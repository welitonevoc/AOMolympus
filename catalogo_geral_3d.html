<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏛️ Mega Catálogo 3D (2.200+ Modelos) — Age of Mythology: Olympus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(15,23,42,0.96) 0%, rgba(15,23,42,0.75) 80%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title-box h1 { font-size: 14px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .badge-count {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #e0f2fe;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #38bdf8;
    }

    /* Filter & Search Bar */
    .search-row {
      display: flex;
      gap: 6px;
    }
    .search-input {
      flex: 1;
      background: rgba(30,41,59,0.85);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      color: white;
      font-size: 12px;
      outline: none;
    }
    .search-input:focus { border-color: #38bdf8; }

    .civ-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .civ-scroll::-webkit-scrollbar { display: none; }
    .civ-btn {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .civ-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56,189,248,0.4);
    }

    /* Bottom Control Panel */
    .panel {
      position: absolute;
      bottom: 12px; left: 12px; right: 12px;
      max-height: 48vh;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 10px 12px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 650px) {
      .panel {
        left: 14px; right: auto; bottom: 14px;
        width: 420px; max-height: 82vh;
      }
    }

    /* Category Filter Buttons */
    .cat-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid #334155;
      scrollbar-width: none;
    }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }

    /* Items Grid with Scroll */
    .items-container {
      flex: 1;
      overflow-y: auto;
      max-height: 25vh;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 4px;
      padding-right: 4px;
    }
    @media (min-width: 650px) {
      .items-container { max-height: 46vh; }
    }

    button.item-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    button.item-btn span.tag {
      font-size: 8.5px;
      color: #94a3b8;
    }
    button.item-btn:active, button.item-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }
    button.item-btn.active span.tag { color: #e0f2fe; }

    .stats-card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10.5px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .export-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size: 13px; font-weight: 600; color: #38bdf8;" id="loading-text">Carregando Banco de Dados 3D...</div>
  </div>

  <div class="top-bar">
    <div class="header-row">
      <div class="title-box">
        <h1>🏛️ Mega Catálogo 3D</h1>
      </div>
      <div class="badge-count" id="total-badge">2.215 Modelos</div>
    </div>
    <div class="search-row">
      <input type="text" class="search-input" id="search-input" placeholder="🔍 Buscar modelo (ex: spear, temple, pharaoh, boat, tree)..." oninput="onSearch()">
    </div>
    <div class="civ-scroll">
      <button class="civ-btn active" onclick="setCiv('all')" id="civ-all">🌟 Todas (2.215)</button>
      <button class="civ-btn" onclick="setCiv('greek')" id="civ-greek">🇬🇷 Grécia (814)</button>
      <button class="civ-btn" onclick="setCiv('egypt')" id="civ-egypt">🇪🇬 Egito (884)</button>
      <button class="civ-btn" onclick="setCiv('norse')" id="civ-norse">🇳🇴 Nórdicos (372)</button>
      <button class="civ-btn" onclick="setCiv('nature')" id="civ-nature">🌲 Natureza (136)</button>
      <button class="civ-btn" onclick="setCiv('mocap')" id="civ-mocap">🌾 Aldeão Mocap (9)</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div class="panel">
    <div class="cat-row">
      <button class="cat-btn active" onclick="setCat('all')" id="cat-all">Todos</button>
      <button class="cat-btn" onclick="setCat('personagens')" id="cat-personagens">🛡️ Personagens (62)</button>
      <button class="cat-btn" onclick="setCat('armas')" id="cat-armas">⚔️ Armas & Elmos (96)</button>
      <button class="cat-btn" onclick="setCat('construcoes')" id="cat-construcoes">🏛️ Construções (658)</button>
      <button class="cat-btn" onclick="setCat('props')" id="cat-props">🏺 Props (1.002)</button>
      <button class="cat-btn" onclick="setCat('natureza')" id="cat-natureza">🌲 Vegetação (363)</button>
      <button class="cat-btn" onclick="setCat('veiculos')" id="cat-veiculos">⛵ Barcos & Carruagens (34)</button>
    </div>

    <!-- LISTA ROLÁVEL DE ITENS -->
    <div class="items-container" id="items-grid"></div>

    <!-- INFO CARD -->
    <div class="stats-card" id="info-card">
      Toque em qualquer modelo da lista para renderizar instantaneamente em 3D PBR.
    </div>

    <button class="export-btn" onclick="exportCurrentGLB()">💾 Exportar Este Modelo para Godot 4 (.GLB)</button>
  </div>

  <script>
    let allModels = [];
    let filteredModels = [];
    let currentCiv = 'all';
    let currentCat = 'all';
    let searchQuery = '';

    let scene, camera, renderer, controls;
    let currentMainObject = null;
    let textureCache = {};
    let mixer = null, clock = new THREE.Clock();

    const fbxLoader = new THREE.FBXLoader();
    const gltfLoader = new THREE.GLTFLoader();
    const textureLoader = new THREE.TextureLoader();

    init3D();
    loadCatalogData();

    function init3D() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1128);
      scene.fog = new THREE.FogExp2(0x0a1128, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 1.8, 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;

      // Luzes
      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const sun = new THREE.DirectionalLight(0xfff7ed, 1.4);
      sun.position.set(6, 12, 7);
      sun.castShadow = true;
      scene.add(sun);

      const rim = new THREE.DirectionalLight(0x38bdf8, 0.85);
      rim.position.set(-6, 5, -5);
      scene.add(rim);

      // Chão
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(16, 48),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(32, 32, 0x38bdf8, 0x1e293b);
      grid.position.y = 0.005;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    async function loadCatalogData() {
      try {
        const res = await fetch('catalogo_db.json');
        allModels = await res.json();
        document.getElementById('total-badge').textContent = `${allModels.length} Modelos`;
        filterAndRender();
        if (allModels.length > 0) loadModel(allModels[0]);
      } catch (err) {
        console.error(err);
        document.getElementById('info-card').textContent = 'Erro ao carregar catalogo_db.json: ' + err.message;
      } finally {
        updateLoading(false);
      }
    }

    function setCiv(civ) {
      currentCiv = civ;
      document.querySelectorAll('.civ-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`civ-${civ}`).classList.add('active');
      filterAndRender();
    }

    function setCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`cat-${cat}`).classList.add('active');
      filterAndRender();
    }

    function onSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      filterAndRender();
    }

    function filterAndRender() {
      filteredModels = allModels.filter(m => {
        const matchCiv = (currentCiv === 'all') || (m.civ === currentCiv);
        const matchCat = (currentCat === 'all') || (m.category === currentCat);
        const matchSearch = (!searchQuery) || (m.name.toLowerCase().includes(searchQuery)) || (m.category.toLowerCase().includes(searchQuery)) || (m.civ.toLowerCase().includes(searchQuery));
        return matchCiv && matchCat && matchSearch;
      });

      document.getElementById('total-badge').textContent = `${filteredModels.length} de ${allModels.length}`;

      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';

      if (filteredModels.length === 0) {
        grid.innerHTML = '<div style="font-size: 11px; color: #94a3b8; padding: 12px; grid-column: 1/-1;">Nenhum modelo encontrado para este filtro.</div>';
        return;
      }

      // Renderizar primeiros 150 para máxima velocidade
      const limit = Math.min(filteredModels.length, 180);
      for (let i = 0; i < limit; i++) {
        const it = filteredModels[i];
        const btn = document.createElement('button');
        btn.className = 'item-btn';
        btn.id = `btn-${it.id}`;

        let cleanName = it.name.replace(/\.(fbx|glb|obj)$/i, '').replace(/^SM_|^Character_/, '');
        btn.innerHTML = `<strong>${cleanName}</strong><span class="tag">${it.civ.toUpperCase()} • ${it.category}</span>`;
        btn.onclick = () => {
          document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadModel(it);
        };
        grid.appendChild(btn);
      }

      if (filteredModels.length > limit) {
        const note = document.createElement('div');
        note.style.gridColumn = '1/-1';
        note.style.fontSize = '10px';
        note.style.color = '#38bdf8';
        note.style.textAlign = 'center';
        note.style.padding = '6px';
        note.textContent = `+ ${filteredModels.length - limit} modelos adicionais. Use a busca acima para filtrar.`;
        grid.appendChild(note);
      }
    }

    function getCivTexture(civ) {
      if (!textureCache[civ]) {
        let p = 'models/synty_ancient_empire/textures/PolygonAncientWorlds_Texture_01_A_Grey.png';
        if (civ === 'egypt') p = 'models/synty_egypt/textures/PolygonAncientEgypt_Texture_01_A.png';
        if (civ === 'norse') p = 'models/synty_vikings/textures/Texture_01.png';
        if (civ === 'nature') p = 'models/synty_nature/textures/StylizedNature_Texture_01.png';
        const tex = textureLoader.load(p);
        tex.flipY = true;
        textureCache[civ] = tex;
      }
      return textureCache[civ];
    }

    function clearScene() {
      if (currentMainObject) {
        scene.remove(currentMainObject);
        currentMainObject = null;
      }
      mixer = null;
    }

    function loadModel(item) {
      clearScene();
      updateLoading(true, `Carregando ${item.name}...`);

      document.getElementById('info-card').innerHTML = `
        <strong>${item.name}</strong><br>
        • <strong>Civilização:</strong> ${item.civ.toUpperCase()} • <strong>Categoria:</strong> ${item.category.toUpperCase()}<br>
        • <strong>Arquivo:</strong> ${item.path} (${item.size_kb} KB)<br>
        • <strong>Formato:</strong> ${item.ext.toUpperCase()} (Low-Poly Mobile Ready)
      `;

      if (item.ext === 'glb' || item.ext === 'gltf') {
        gltfLoader.load(item.path, (gltf) => {
          currentMainObject = gltf.scene;
          currentMainObject.scale.set(1.45, 1.45, 1.45);
          scene.add(currentMainObject);

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(currentMainObject);
            mixer.clipAction(gltf.animations[0]).play();
          }
          adjustCamera(currentMainObject);
          updateLoading(false);
        }, undefined, (err) => {
          updateLoading(true, 'Erro ao carregar GLB: ' + err.message);
        });
      } else {
        fbxLoader.load(item.path, (fbx) => {
          currentMainObject = fbx;
          fbx.scale.set(0.01, 0.01, 0.01);
          scene.add(fbx);

          const tex = getCivTexture(item.civ);
          fbx.traverse(c => {
            if (c.isMesh) {
              c.castShadow = true;
              c.material = new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.7,
                metalness: 0.15
              });
            }
          });

          adjustCamera(fbx);
          updateLoading(false);
        }, undefined, (err) => {
          updateLoading(true, 'Erro no FBX: ' + err.message);
        });
      }
    }

    function adjustCamera(obj) {
      const bbox = new THREE.Box3().setFromObject(obj);
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      controls.target.copy(center);
      const maxDim = Math.max(size.x, size.y, size.z, 0.5);
      camera.position.set(center.x, center.y + maxDim * 0.7, center.z + maxDim * 1.8);
      controls.update();
    }

    function exportCurrentGLB() {
      if (!currentMainObject) {
        alert('Nenhum modelo carregado na cena para exportar!');
        return;
      }
      updateLoading(true, 'Exportando para GLB...');
      const exporter = new THREE.GLTFExporter();
      exporter.parse(currentMainObject, (gltf) => {
        const blob = new Blob([gltf], { type: 'model/gltf-binary' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `aom_olympus_export.glb`;
        link.click();
        updateLoading(false);
      }, { binary: true });
    }

    function updateLoading(show, text) {
      const overlay = document.getElementById('loading-overlay');
      if (show) {
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        if (text) document.getElementById('loading-text').textContent = text;
      } else {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
