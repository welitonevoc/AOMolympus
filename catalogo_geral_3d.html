<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏛️ Catálogo Geral 3D — Age of Mythology: Olympus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(15,23,42,0.96) 0%, rgba(15,23,42,0.75) 75%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .title-box h1 { font-size: 15px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .title-box span { font-size: 11px; color: #94a3b8; }

    /* Civ Selector Tabs */
    .civ-tabs {
      display: flex;
      gap: 4px;
      background: rgba(30,41,59,0.8);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .civ-btn {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #94a3b8;
      transition: all 0.15s ease;
    }
    .civ-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56,189,248,0.4);
    }

    /* Floating Panel */
    .panel {
      position: absolute;
      bottom: 12px; left: 12px; right: 12px;
      max-height: 48vh;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 12px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.65);
      overflow-y: auto;
    }
    @media (min-width: 650px) {
      .panel {
        left: 14px; right: auto; bottom: 14px;
        width: 380px; max-height: 82vh;
      }
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .sub-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .sub-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
      margin: 8px 0 5px 0;
      display: flex;
      justify-content: space-between;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 5px;
      margin-bottom: 8px;
    }
    button.item-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button.item-btn:active, button.item-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 700;
    }

    .stats-card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 6px;
    }

    .export-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      color: white;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

</head>

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1128);
      scene.fog = new THREE.FogExp2(0x0a1128, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 150);
      camera.position.set(0, 1.8, 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.1, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;

      // Luzes
      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const sun = new THREE.DirectionalLight(0xfff7ed, 1.35);
      sun.position.set(6, 12, 7);
      sun.castShadow = true;
      scene.add(sun);

      const rim = new THREE.DirectionalLight(0x38bdf8, 0.85);
      rim.position.set(-6, 5, -5);
      scene.add(rim);

      // Chão
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(10, 48),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
      grid.position.y = 0.005;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);

      renderCatalogMenu();
      loadDefaultAsset();
    }

    function setCiv(civ) {
      activeCiv = civ;
      document.querySelectorAll('.civ-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`civ-${civ}`).classList.add('active');
      renderCatalogMenu();
      loadDefaultAsset();
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`sub-${cat}`).classList.add('active');
      renderCatalogMenu();
    }

    function renderCatalogMenu() {

      container.innerHTML = '';

      const items = (CATALOG[activeCiv] && CATALOG[activeCiv][activeCategory]) || [];
      if (items.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: #94a3b8; padding: 12px 0;">Nenhum item nesta categoria.</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'btn-grid';

      items.forEach((it, idx) => {
        const btn = document.createElement('button');
        btn.className = `item-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = it.name;
        btn.onclick = () => {
          document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadItem(it);
        };
        grid.appendChild(btn);
      });

      container.appendChild(grid);
    }

    function loadDefaultAsset() {
      const items = (CATALOG[activeCiv] && CATALOG[activeCiv][activeCategory]) || [];
      if (items.length > 0) loadItem(items[0]);
    }

    function getCivTexture(civ) {
      if (!textureCache[civ]) {
        let p = 'models/synty_ancient_empire/textures/PolygonAncientWorlds_Texture_01_A_Grey.png';
        if (civ === 'egypt') p = 'models/synty_egypt/textures/PolygonAncientEgypt_Texture_01_A.png';
        if (civ === 'norse') p = 'models/synty_vikings/textures/Texture_01.png';
        const tex = textureLoader.load(p);
        tex.flipY = true;
        textureCache[civ] = tex;
      }
      return textureCache[civ];
    }

    function clearSceneCurrent() {
      if (currentMainObject) {
        scene.remove(currentMainObject);
        currentMainObject = null;
      }
      currentAttachedHelmet = null;
      currentAttachedWeaponR = null;
      currentAttachedWeaponL = null;
      headBone = null; handRBone = null; handLBone = null;
      mixer = null;
    }

    function loadItem(item) {
      clearSceneCurrent();
      updateLoading(true, `Carregando ${item.name}...`);

      document.getElementById('info-card').innerHTML = `
        <strong>${item.name}</strong><br>
        • <strong>Civilização:</strong> ${activeCiv.toUpperCase()}<br>
        • <strong>Descrição:</strong> ${item.desc || 'Modelo modular oficial Synty 3D.'}<br>
        • <strong>Formato:</strong> ${item.isGltf ? 'GLTF/GLB' : 'FBX 7.x (Low-Poly)'}
      `;

      // Se for Aldeão Mocap GLTF nativo
      if (item.isGltf) {
        gltfLoader.load(item.file, (gltf) => {
          currentMainObject = gltf.scene;
          currentMainObject.scale.set(1.45, 1.45, 1.45);
          scene.add(currentMainObject);

          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(currentMainObject);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
          }
          controls.target.set(0, 1.2, 0);
          camera.position.set(0, 1.8, 3.8);
          updateLoading(false);
        }, undefined, (err) => {
          updateLoading(true, 'Erro ao carregar GLB: ' + err.message);
        });
        return;
      }

      // Se for personagem com esqueleto compartilhado
      if (activeCategory === 'units' && item.file) {
        let fbxPath = `models/synty_ancient_empire/characters/${item.file}`;
        if (activeCiv === 'egypt') fbxPath = `models/synty_egypt/characters/${item.file}`;
        if (activeCiv === 'norse') fbxPath = `models/synty_vikings/models/${item.file}`;

        fbxLoader.load(fbxPath, (fbx) => {
          currentMainObject = fbx;
          fbx.scale.set(0.01, 0.01, 0.01);
          scene.add(fbx);

          const tex = getCivTexture(activeCiv);

          fbx.traverse(c => {
            if (c.isBone) {
              const bName = c.name.toLowerCase();
              if (bName.includes('head')) headBone = c;
              if (bName === 'hand_r') handRBone = c;
              if (bName === 'hand_l') handLBone = c;
            }
            if (c.isSkinnedMesh) {
              c.castShadow = true;
              c.material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.15 });
              c.visible = (c.name === item.id);
            }
          });

          // Equipamentos automáticos se especificados
          if (item.bone_helm && headBone) attachAccessory(headBone, item.bone_helm, 'head');
          if (item.bone_wep_r && handRBone) attachAccessory(handRBone, item.bone_wep_r, 'hand_r');
          if (item.bone_wep_l && handLBone) attachAccessory(handLBone, item.bone_wep_l, 'hand_l');

          controls.target.set(0, 1.1, 0);
          camera.position.set(0, 1.8, 4.2);
          updateLoading(false);
        }, undefined, (err) => {
          updateLoading(true, 'Erro no FBX: ' + err.message);
        });
        return;
      }

      // Se for arma, construção ou prop isolado
      let fbxRelPath = '';
      if (activeCiv === 'greek') {
        const fld = item.folder || 'buildings';
        fbxRelPath = `models/synty_ancient_empire/${fld}/${item.id}.fbx`;
      } else if (activeCiv === 'egypt') {
        const fld = item.folder || 'buildings';
        fbxRelPath = `models/synty_egypt/${fld}/${item.id}.fbx`;
      } else if (activeCiv === 'norse') {
        fbxRelPath = `models/synty_vikings/models/${item.id}.fbx`;
      }

      fbxLoader.load(fbxRelPath, (fbx) => {
        currentMainObject = fbx;
        fbx.scale.set(0.01, 0.01, 0.01);
        scene.add(fbx);

        const tex = getCivTexture(activeCiv);
        fbx.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.1 });
          }
        });

        // Enquadrar câmera no objeto
        const bbox = new THREE.Box3().setFromObject(fbx);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());
        controls.target.copy(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(center.x, center.y + maxDim * 0.8, center.z + maxDim * 1.8);

        updateLoading(false);
      }, undefined, (err) => {
        // Tentar fallback se houver
        if (item.fallback) {
          item.id = item.fallback;
          delete item.fallback;
          loadItem(item);
        } else {
          updateLoading(true, 'Arquivo 3D: ' + item.name);
          setTimeout(() => updateLoading(false), 1200);
        }
      });
    }

    function attachAccessory(bone, fileId, type) {
      if (!fileId || fileId === 'none') return;
      let path = `models/synty_ancient_empire/weapons/${fileId}.fbx`;
      if (type === 'head') path = `models/synty_ancient_empire/characters/${fileId}.fbx`;
      if (activeCiv === 'egypt') path = `models/synty_egypt/weapons/${fileId}.fbx`;
      if (activeCiv === 'norse') path = `models/synty_vikings/models/${fileId}.fbx`;

      fbxLoader.load(path, (fbx) => {
        const tex = getCivTexture(activeCiv);
        fbx.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5, metalness: 0.3 });
          }
        });
        if (type === 'hand_r') {
          fbx.position.set(0, -20, 0);
          fbx.rotation.set(-Math.PI / 2, 0, 0);
        } else if (type === 'hand_l') {
          fbx.position.set(10, 0, 0);
          fbx.rotation.set(0, Math.PI / 2, 0);
        }
        bone.add(fbx);
      });
    }

    function exportCurrentGLB() {
      if (!currentMainObject) {
        alert('Nenhum modelo carregado na cena para exportar!');
        return;
      }
      updateLoading(true, 'Exportando para GLB...');
      const exporter = new THREE.GLTFExporter();
      exporter.parse(currentMainObject, (gltf) => {
        const blob = new Blob([gltf], { type: 'model/gltf-binary' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${activeCiv}_${activeCategory}_export.glb`;
        link.click();
        updateLoading(false);
      }, { binary: true });
    }

    function updateLoading(show, text) {
      const overlay = document.getElementById('loading-overlay');
      if (show) {
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        if (text) document.getElementById('loading-text').textContent = text;
      } else {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
