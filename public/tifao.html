<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Titã Tifão - Senhor dos Furacões | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --storm-blue: #38bdf8;
      --gold: #facc15;
      --deep-sky: #070d19;
      --glass: rgba(10, 18, 34, 0.84);
      --border: rgba(56, 189, 248, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--deep-sky);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f0f9ff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #facc15;
      transform: translateY(-1px);
      background: rgba(18, 34, 62, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #38bdf8 0%, #eab308 100%);
      color: #06101f;
      border-color: #fef08a;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.58);
    }
    button.cam-btn {
      border-color: rgba(250, 204, 21, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #b45309 100%);
      color: #08101c;
      border-color: #fef08a;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.5);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 15, 29, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #e0f2fe;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="colosso" class="on">Colosso dos Céus</button>
    <button data-m="tornados">Vórtice de Tornados</button>
    <button data-m="asas">Bater de Asas Sísmico</button>
    <button data-m="apocalipse">Tempestade Apocalíptica</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Titã de Zeus • Tifão</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE DE TEMPESTADE, NUVENS E ARENA CELESTIAL)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map de pele titânica esculpida por ventos e relâmpagos
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 7500; i++) {
    const v = 116 + Math.floor(Math.random() * 24);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(5, 5);

  // 1.2 Textura de Nuvem de Tempestade em Espiral para o Furacão
  const vortexCanvas = document.createElement('canvas');
  vortexCanvas.width = vortexCanvas.height = 512;
  const vCtx = vortexCanvas.getContext('2d');
  vCtx.fillStyle = '#0f172a';
  vCtx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 160; i++) {
    const y = Math.random() * 512;
    vCtx.strokeStyle = i % 3 === 0 ? 'rgba(56, 189, 248, 0.35)' : 'rgba(148, 163, 184, 0.28)';
    vCtx.lineWidth = 2 + Math.random() * 5;
    vCtx.beginPath();
    vCtx.moveTo(0, y);
    vCtx.bezierCurveTo(170, y + 24, 340, y - 24, 512, y);
    vCtx.stroke();
  }
  const vortexTex = new T.CanvasTexture(vortexCanvas);
  vortexTex.wrapS = vortexTex.wrapT = T.RepeatWrapping;
  vortexTex.repeat.set(3, 2);

  // 1.3 Arena Celestial do Olimpo: Mármore Azul-Tempestade com Rosa dos Ventos e Raios Dourados
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#1e293b';
  fCtx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 3600; i++) {
    fCtx.fillStyle = i % 2 === 0 ? 'rgba(51, 65, 85, 0.35)' : 'rgba(15, 23, 42, 0.55)';
    fCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  // Círculos concêntricos olímpicos em Ouro e Azul-Elétrico
  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 425, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#38bdf8';
  fCtx.lineWidth = 6;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 442, 0, Math.PI * 2);
  fCtx.stroke();

  // Estrela de 16 raios de tempestade e ouro
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const isMajor = i % 2 === 0;
    const outerR = isMajor ? 340 : 240;
    const halfW = isMajor ? 0.12 : 0.08;

    fCtx.fillStyle = isMajor ? 'rgba(250, 204, 21, 0.32)' : 'rgba(56, 189, 248, 0.28)';
    fCtx.beginPath();
    fCtx.moveTo(cx, cy);
    fCtx.lineTo(cx + Math.cos(a - halfW) * 95, cy + Math.sin(a - halfW) * 95);
    fCtx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
    fCtx.lineTo(cx + Math.cos(a + halfW) * 95, cy + Math.sin(a + halfW) * 95);
    fCtx.closePath();
    fCtx.fill();
  }

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, vortexTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA TITÂNICA E MATERIAIS CELESTIAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    stormSkin: new T.MeshStandardMaterial({
      color: 0x334155,          // Pele titânica de ardósia azul-tempestade
      roughness: 0.44,
      metalness: 0.18,
      bumpMap: textures.skinBump,
      bumpScale: 0.0055
    }),
    stormSkinDark: new T.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.50,
      metalness: 0.16
    }),
    lightningVein: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x38bdf8,       // Veias de relâmpago azul-elétrico pulsando nos músculos
      emissiveIntensity: 3.4,
      roughness: 0.1
    }),
    goldVein: new T.MeshStandardMaterial({
      color: 0xfef08a,
      emissive: 0xfacc15,       // Veias de ouro celestial de Zeus
      emissiveIntensity: 2.8,
      roughness: 0.12
    }),
    celestialGold: new T.MeshStandardMaterial({
      color: 0xfacc15,
      emissive: 0x451a03,
      emissiveIntensity: 0.28,
      metalness: 0.94,
      roughness: 0.18
    }),
    stormBronze: new T.MeshStandardMaterial({
      color: 0x1e3a5f,
      emissive: 0x0c1938,
      emissiveIntensity: 0.25,
      metalness: 0.90,
      roughness: 0.24
    }),
    wingCloudPrimary: new T.MeshStandardMaterial({
      color: 0x1e293b,          // Plumas/Nuvens densas das asas gigantes
      emissive: 0x0f172a,
      emissiveIntensity: 0.3,
      roughness: 0.55,
      metalness: 0.2,
      side: T.DoubleSide
    }),
    wingLightningTip: new T.MeshStandardMaterial({
      color: 0xbae6fd,
      emissive: 0x0284c7,
      emissiveIntensity: 1.8,
      roughness: 0.25,
      side: T.DoubleSide
    }),
    eyeLightning: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x38bdf8,
      emissiveIntensity: 4.5,
      roughness: 0.05
    }),
    vortexCloud: new T.MeshStandardMaterial({
      map: textures.vortexTex,
      color: 0x38bdf8,
      emissive: 0x0369a1,
      emissiveIntensity: 0.65,
      roughness: 0.45,
      transparent: true,
      opacity: 0.84,
      side: T.DoubleSide
    }),
    serpentScale: new T.MeshStandardMaterial({
      color: 0x1e3a8a,
      emissive: 0x0c4a6e,
      emissiveIntensity: 0.45,
      roughness: 0.35,
      metalness: 0.4
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DO TITÃ TIFÃO (COLOSSO DOS CÉUS + ASAS GIGANTES + FURACÃO)
   ========================================================================== */
function buildTyphonTitan(textures) {
  const M = createMaterials(textures);

  const titanRoot = new T.Group();

  // ------------------------------------------------------------------------
  // A. FURACÃO COLOSSAL EM ESPIRAL SOB TIFÃO (FUNIL DE VENTO E RELÂMPAGOS)
  // ------------------------------------------------------------------------
  const hurricaneGroup = group(titanRoot, 0, 0, 0);

  // Funil principal do tornado (largo no topo onde sustenta o tronco, afunilado na base)
  const funnelGeo = new T.CylinderGeometry(1.15, 0.36, 1.85, 40, 20, true);
  const fPos = funnelGeo.attributes.position;
  for (let i = 0; i < fPos.count; i++) {
    const x = fPos.getX(i), y = fPos.getY(i), z = fPos.getZ(i);
    const normY = (y + 0.925) / 1.85; // 0 na base do chão, 1 na cintura do Titã
    const ang = Math.atan2(z, x);
    const twist = Math.sin(ang * 4 + normY * 8.0) * 0.11 * (0.4 + normY * 0.6);
    const r = Math.sqrt(x * x + z * z) + twist;
    fPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
  }
  funnelGeo.computeVertexNormals();
  const funnelMesh = new T.Mesh(funnelGeo, M.vortexCloud);
  funnelMesh.position.y = 0.925;
  hurricaneGroup.add(funnelMesh);

  // Núcleo elétrico interno do furacão
  const innerFunnel = new T.Mesh(
    new T.CylinderGeometry(0.75, 0.22, 1.80, 24, 1, true),
    new T.MeshBasicMaterial({
      color: 0x7dd3fc,
      transparent: true,
      opacity: 0.36,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  innerFunnel.position.y = 0.92;
  hurricaneGroup.add(innerFunnel);

  // Anéis ciclônicos giratórios envolvendo o tornado
  const cycloneRings = [];
  for (let r = 0; r < 5; r++) {
    const t = r / 4;
    const rad = 0.48 + t * 0.85;
    const cRing = new T.Mesh(
      new T.TorusGeometry(rad, 0.035, 8, 36),
      new T.MeshBasicMaterial({
        color: r % 2 === 0 ? 0x38bdf8 : 0xfde047,
        transparent: true,
        opacity: 0.78,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    cRing.rotation.x = Math.PI / 2 + (r % 2 === 0 ? 0.14 : -0.14);
    cRing.position.y = 0.22 + t * 1.48;
    hurricaneGroup.add(cRing);
    cycloneRings.push({ mesh: cRing, baseY: cRing.position.y, phase: r * 1.3 });
  }

  // Duas Serpentes Aladas/Elétricas emergindo da cintura do furacão (mito de Tifão)
  const waistSerpents = [];
  for (const side of [-1, 1]) {
    const serpRoot = group(hurricaneGroup, side * 0.72, 1.48, 0.22);
    const serpCurve = new T.CatmullRomCurve3([
      new T.Vector3(0, -0.35, -0.15),
      new T.Vector3(side * 0.35, 0.05, 0.12),
      new T.Vector3(side * 0.58, 0.42, 0.35),
      new T.Vector3(side * 0.42, 0.72, 0.58)
    ]);
    sculpt(serpRoot, new T.TubeGeometry(serpCurve, 20, 0.075, 10, false), M.serpentScale);
    // Cabeça dracônica da serpente
    const sHead = group(serpRoot, side * 0.42, 0.72, 0.58);
    sHead.rotation.set(0.35, side * -0.3, 0);
    sculpt(sHead, new T.ConeGeometry(0.11, 0.28, 6), M.serpentScale, [0, 0, 0.1], [Math.PI / 2, 0, 0], [1.1, 1, 0.65]);
    sculpt(sHead, new T.SphereGeometry(0.022, 8, 8), M.eyeLightning, [-0.05, 0.02, 0.14]);
    sculpt(sHead, new T.SphereGeometry(0.022, 8, 8), M.eyeLightning, [0.05, 0.02, 0.14]);
    waistSerpents.push({ root: serpRoot, sHead, side });
  }

  // ------------------------------------------------------------------------
  // B. TRONCO TITÂNICO COLOSSAL DE TIFÃO (ESCALA 1.35x ACIMA DO FURACÃO)
  // ------------------------------------------------------------------------
  const body = group(titanRoot, 0, 1.72, 0);
  body.scale.setScalar(1.35);

  const torso = group(body, 0, 0.48, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.45),
    new T.Vector2(0.32, -0.40),
    new T.Vector2(0.30, -0.20),
    new T.Vector2(0.39, 0.04),
    new T.Vector2(0.54, 0.29),  // Ombros titânicos monumentais
    new T.Vector2(0.47, 0.45),
    new T.Vector2(0.22, 0.52),
    new T.Vector2(0.01, 0.53)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.stormSkin, [0, 0, 0], [0, 0, 0], [1.28, 1.04, 0.82]);

  // Peitorais colossais e Abdômen esculpido
  const pecGeo = new T.SphereGeometry(0.27, 24, 24);
  sculpt(torso, pecGeo, M.stormSkin, [-0.235, 0.23, 0.195], [0.12, -0.22, -0.14], [1.1, 0.9, 0.64]);
  sculpt(torso, pecGeo, M.stormSkin, [0.235, 0.23, 0.195], [0.12, 0.22, 0.14], [1.1, 0.9, 0.64]);

  // Veias de Relâmpago Azul-Elétrico e Ouro pulsando pelo tórax titânico
  const boltVein1 = new T.CatmullRomCurve3([
    new T.Vector3(-0.40, 0.36, 0.14),
    new T.Vector3(-0.22, 0.25, 0.29),
    new T.Vector3(-0.08, 0.14, 0.31),
    new T.Vector3(-0.15, -0.04, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(boltVein1, 16, 0.0095, 6, false), M.lightningVein);

  const boltVein2 = new T.CatmullRomCurve3([
    new T.Vector3(0.40, 0.36, 0.14),
    new T.Vector3(0.22, 0.25, 0.29),
    new T.Vector3(0.08, 0.14, 0.31),
    new T.Vector3(0.15, -0.04, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(boltVein2, 16, 0.0095, 6, false), M.goldVein);

  const abGeo = new T.SphereGeometry(0.105, 16, 16);
  [
    { y: 0.04, sx: 1.08, sy: 0.78, z: 0.254 },
    { y: -0.08, sx: 1.04, sy: 0.80, z: 0.250 },
    { y: -0.20, sx: 0.95, sy: 0.86, z: 0.238 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.stormSkin, [-0.088, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.52]);
    sculpt(torso, abGeo, M.stormSkin, [0.088, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.52]);
  });

  // Dorsais, Trapézio e Pescoço maciço
  const latGeo = new T.SphereGeometry(0.29, 20, 20);
  sculpt(torso, latGeo, M.stormSkin, [-0.27, 0.18, -0.14], [0, 0, -0.25], [1.05, 1.38, 0.7]);
  sculpt(torso, latGeo, M.stormSkin, [0.27, 0.18, -0.14], [0, 0, 0.25], [1.05, 1.38, 0.7]);

  const trapGeo = new T.SphereGeometry(0.27, 18, 18);
  sculpt(torso, trapGeo, M.stormSkin, [-0.23, 0.44, -0.05], [0, 0, 0.4], [1.18, 0.70, 0.8]);
  sculpt(torso, trapGeo, M.stormSkin, [0.23, 0.44, -0.05], [0, 0, -0.4], [1.18, 0.70, 0.8]);

  sculpt(torso, new T.CylinderGeometry(0.16, 0.20, 0.26, 20), M.stormSkin, [0, 0.54, -0.01], [0.08, 0, 0]);

  // Cinturão de Ouro Olímpico e Placas de Tempestade na transição com o Furacão
  const beltGeo = new T.TorusGeometry(0.34, 0.042, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(torso, beltGeo, M.celestialGold, [0, -0.38, 0.01], [0.04, 0, 0], [1.18, 1, 0.88]);
  sculpt(torso, new T.OctahedronGeometry(0.065, 0), M.lightningVein, [0, -0.38, 0.31]);

  // ------------------------------------------------------------------------
  // C. DUAS ENORMES ASAS DE TEMPESTADE ARTICULADAS NAS COSTAS (ENVERGADURA COLOSSAL)
  // ------------------------------------------------------------------------
  const wings = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const wingRoot = group(torso, s * 0.24, 0.34, -0.22);

    // Braço ósseo/armadura dourada da asa (úmero e antebraço alado)
    const innerWing = group(wingRoot, 0, 0, 0);
    sculpt(
      innerWing,
      new T.CylinderGeometry(0.055, 0.042, 0.85, 12),
      M.celestialGold,
      [s * 0.38, 0.22, -0.05],
      [0, 0, s * -1.08]
    );

    // Plumas gigantes de nuvem de tempestade na seção interna da asa
    for (let f = 0; f < 7; f++) {
      const t = f / 6;
      const len = 0.72 + t * 0.42;
      sculpt(
        innerWing,
        new T.ConeGeometry(0.095, len, 6),
        f % 3 === 0 ? M.wingLightningTip : M.wingCloudPrimary,
        [s * (0.18 + t * 0.56), 0.16 + t * 0.22 - len * 0.42, -0.08],
        [0.12, 0, s * (-0.15 - t * 0.15)],
        [1.1, 1, 0.22]
      );
    }

    // Articulação externa da asa (ponta longa e majestosa)
    const outerWing = group(innerWing, s * 0.76, 0.42, -0.06);
    sculpt(
      outerWing,
      new T.CylinderGeometry(0.042, 0.018, 1.05, 12),
      M.celestialGold,
      [s * 0.48, -0.08, -0.04],
      [0, 0, s * -1.72]
    );

    // Rêmiges primárias gigantes com pontas energizadas por relâmpagos
    for (let p = 0; p < 8; p++) {
      const t = p / 7;
      const len = 1.25 - t * 0.28;
      sculpt(
        outerWing,
        new T.ConeGeometry(0.105, len, 6),
        p % 2 === 0 ? M.wingLightningTip : M.wingCloudPrimary,
        [s * (0.12 + t * 0.82), -0.04 - t * 0.14 - len * 0.44, -0.06],
        [0.15, 0, s * (-0.38 - t * 0.48)],
        [1.15, 1, 0.20]
      );
    }

    wings[side] = { wingRoot, innerWing, outerWing };
  }

  // ------------------------------------------------------------------------
  // D. CABEÇA COLOSSAL DE TIFÃO (COROA DE CHIFRES CELESTIAIS E BARBA DE RELÂMPAGOS)
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.78, 0.04);

  const skullGeo = new T.SphereGeometry(0.23, 36, 36);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.18;
    x *= 0.96;
    if (y < 0.02 && y > -0.09 && z > 0) { x *= 1.08; z *= 1.08; }
    if (y <= -0.08 && z > -0.02) { x *= 1.04; z *= 1.14; }
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.stormSkin);

  // Nariz forte e sobrancelhas tempestuosas em V
  sculpt(head, new T.BoxGeometry(0.038, 0.095, 0.056), M.stormSkin, [0, 0.005, 0.218], [-0.14, 0, 0]);
  const browGeo = new T.CapsuleGeometry(0.02, 0.075, 8, 12);
  sculpt(head, browGeo, M.stormSkinDark, [-0.06, 0.05, 0.206], [0.12, 0.25, 1.24]);
  sculpt(head, browGeo, M.stormSkinDark, [0.06, 0.05, 0.206], [0.12, -0.25, -1.24]);

  // Olhos Relampejantes Azul-Elétrico e Branco Incandescente
  for (const side of [-1, 1]) {
    sculpt(head, new T.SphereGeometry(0.024, 16, 16), M.eyeLightning, [side * 0.06, 0.024, 0.202], [0, 0, 0], [1.2, 0.68, 0.85]);
  }

  // Barba Tempestuosa em pontas de nuvem e relâmpago
  const beardSpikes = [];
  for (let b = -2; b <= 2; b++) {
    const len = 0.34 - Math.abs(b) * 0.04;
    const spike = sculpt(
      head,
      new T.ConeGeometry(0.048, len, 6),
      b === 0 ? M.wingLightningTip : M.stormSkinDark,
      [b * 0.045, -0.16 - (2 - Math.abs(b)) * 0.02, 0.19 - Math.abs(b) * 0.02],
      [Math.PI - 0.14, 0, b * 0.08],
      [1, 1, 0.65]
    );
    beardSpikes.push({ mesh: spike, baseRx: Math.PI - 0.14, phase: b * 0.8 });
  }

  // Coroa-Elmo de Tempestade com Chifres Colossais Curvados para os Céus
  const crown = group(head, 0, 0.14, 0);
  const band = new T.TorusGeometry(0.22, 0.02, 10, 36);
  band.rotateX(Math.PI / 2);
  sculpt(crown, band, M.celestialGold, [0, 0, 0], [0.12, 0, 0], [0.96, 1, 1.06]);
  sculpt(crown, new T.OctahedronGeometry(0.036, 0), M.lightningVein, [0, 0.02, 0.232]);

  for (const side of [-1, 1]) {
    const hornPts = [
      new T.Vector3(side * 0.20, 0.02, 0.02),
      new T.Vector3(side * 0.34, 0.16, -0.04),
      new T.Vector3(side * 0.38, 0.38, -0.10),
      new T.Vector3(side * 0.26, 0.56, -0.06)
    ];
    sculpt(crown, new T.TubeGeometry(new T.CatmullRomCurve3(hornPts), 18, 0.032, 10, false), M.celestialGold);
    sculpt(crown, new T.ConeGeometry(0.032, 0.12, 8), M.lightningVein, [side * 0.24, 0.60, -0.05], [0.2, 0, side * 0.45]);
  }

  // ------------------------------------------------------------------------
  // E. BRAÇOS TITÂNICOS COLOSSAIS CANALIZANDO RELÂMPAGOS E FURACÕES
  // ------------------------------------------------------------------------
  function createTyphonArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.58, 0.35, -0.01);

    // Ombreira Celestial Dourada com Cristas de Raio
    sculpt(
      arm,
      new T.SphereGeometry(0.22, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.48),
      M.celestialGold,
      [s * 0.02, 0.04, 0],
      [0, 0, s * -0.35],
      [1.15, 0.78, 1.18]
    );

    sculpt(arm, new T.SphereGeometry(0.19, 20, 20), M.stormSkin, [0, -0.02, 0], [0, 0, s * -0.25], [1.08, 1.18, 1.08]);
    sculpt(arm, new T.CapsuleGeometry(0.125, 0.30, 12, 18), M.stormSkin, [s * 0.03, -0.20, 0], [0, 0, s * 0.08]);
    sculpt(arm, new T.SphereGeometry(0.116, 16, 16), M.stormSkin, [s * 0.022, -0.19, 0.058], [0, 0, s * 0.08], [0.96, 1.48, 0.96]);

    const elbow = group(arm, s * 0.054, -0.40, 0);
    sculpt(elbow, new T.CylinderGeometry(0.118, 0.08, 0.36, 18), M.stormSkin, [0, -0.17, 0], [0, 0, 0], [1.06, 1, 0.98]);

    // Braçadeira Pesada de Ouro e Azul-Tempestade
    const bracer = group(elbow, 0, -0.25, 0);
    sculpt(bracer, new T.CylinderGeometry(0.094, 0.082, 0.14, 24, 1, true), M.stormBronze);
    const bRing = new T.TorusGeometry(0.09, 0.009, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.celestialGold, [0, 0.065, 0]);
    sculpt(bracer, bRing, M.celestialGold, [0, -0.065, 0]);

    const hand = group(elbow, 0, -0.37, 0);
    sculpt(hand, new T.BoxGeometry(0.105, 0.11, 0.055), M.stormSkin, [0, -0.02, 0]);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.025;
      sculpt(hand, new T.CapsuleGeometry(0.015, 0.052, 6, 8), M.stormSkin, [fx, -0.082, 0.024], [1.05, 0, 0]);
    }

    // Esfera de Relâmpago e Ciclone nas palmas titânicas
    const palmAnchor = group(hand, 0, -0.10, 0.06);
    const palmOrb = new T.Mesh(
      new T.SphereGeometry(0.16, 14, 12),
      new T.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.78,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    palmAnchor.add(palmOrb);

    return { arm, elbow, hand, palmAnchor, palmOrb };
  }

  const rightArm = createTyphonArm(true);
  const leftArm = createTyphonArm(false);

  return {
    titanRoot, hurricaneGroup, funnelMesh, cycloneRings, waistSerpents,
    body, torso, head, beardSpikes,
    wings, rightArm, leftArm,
    veinBlue: M.lightningVein,
    veinGold: M.goldVein
  };
}

const WIND_N = 360;

  windPos[i * 3 + 2] = Math.sin(windAngle[i]) * windRadius[i];
}

const galeWaves = [];
const lightningBolts = [];
const boltCoreMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: T.AdditiveBlending, depthWrite: false });
const boltGlowMat = new T.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, blending: T.AdditiveBlending, depthWrite: false });

function triggerWingShockwave(cx, cz) {
  for (let k = 0; k < 3; k++) {
    const sw = new T.Mesh(
      new T.RingGeometry(0.55, 1.05, 56),
      new T.MeshBasicMaterial({
        color: k === 0 ? 0xffffff : (k === 1 ? 0x38bdf8 : 0xfacc15),
        transparent: true,
        opacity: 0.94,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })
    );
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(cx, 0.06 + k * 0.04, cz);
    scene.add(sw);
    galeWaves.push({ mesh: sw, life: 1.25, max: 1.25, delay: k * 0.10 });
  }
  flashLight.position.set(cx, 4.0, cz);
  flashLight.intensity = 12.0;
}

function strikeSkyLightning(cx, cz) {
  const a = Math.random() * Math.PI * 2;
  const dist = 1.8 + Math.random() * 3.8;
  const tx = cx + Math.cos(a) * dist;
  const tz = cz + Math.sin(a) * dist;

  const from = new T.Vector3(tx + (Math.random() - 0.5) * 2.5, 11.5, tz + (Math.random() - 0.5) * 2.5);
  const to = new T.Vector3(tx, 0.05, tz);

  const pts = [from.clone()];
  const steps = 10;
  for (let i = 1; i < steps; i++) {
    const p = from.clone().lerp(to, i / steps);
    p.x += (Math.random() - 0.5) * 0.65;
    p.z += (Math.random() - 0.5) * 0.65;
    pts.push(p);
  }
  pts.push(to);

  const curve = new T.CatmullRomCurve3(pts);
  const core = new T.Mesh(new T.TubeGeometry(curve, 36, 0.045, 6, false), boltCoreMat.clone());
  const glow = new T.Mesh(new T.TubeGeometry(curve, 36, 0.16, 6, false), boltGlowMat.clone());
  scene.add(core, glow);

  lightningBolts.push({ meshes: [core, glow], life: 0.42, max: 0.42 });

  // Onda de impacto no chão
  const imp = new T.Mesh(
    new T.RingGeometry(0.2, 0.55, 32),
    new T.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.95, blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false })
  );
  imp.rotation.x = -Math.PI / 2;
  imp.position.set(tx, 0.04, tz);
  scene.add(imp);
  galeWaves.push({ mesh: imp, life: 0.75, max: 0.75, delay: 0 });

  flashLight.position.set(tx, 3.0, tz);
  flashLight.intensity = 16.0;
}

const spawnedTornadoes = [];
const miniFunnelGeo = new T.CylinderGeometry(0.68, 0.14, 3.8, 24, 12, true);
const mfPos = miniFunnelGeo.attributes.position;
for (let i = 0; i < mfPos.count; i++) {
  const x = mfPos.getX(i), y = mfPos.getY(i), z = mfPos.getZ(i);
  const normY = (y + 1.9) / 3.8;
  const ang = Math.atan2(z, x);
  const twist = Math.sin(ang * 3 + normY * 7.0) * 0.08 * (0.3 + normY * 0.7);
  const r = Math.sqrt(x * x + z * z) + twist;
  mfPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
}
miniFunnelGeo.computeVertexNormals();

function spawnTornadoSwarm(originX, originZ) {
  const count = 3;
  for (let i = 0; i < count; i++) {
    const startAng = (i / count) * Math.PI * 2 + Math.random() * 0.6;

    const funnel = new T.Mesh(

        side: T.DoubleSide,
        depthWrite: false

    funnel.position.y = 1.9;

    const core = new T.Mesh(
      new T.CylinderGeometry(0.32, 0.06, 3.7, 16, 1, true),

        transparent: true,
        opacity: 0.48,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })

    core.position.y = 1.85;

    const baseRing = new T.Mesh(
      new T.RingGeometry(0.25, 0.78, 28),
      new T.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.85,

    tGroup.scale.set(0.1, 0.1, 0.1);

    spawnedTornadoes.push({
      group: tGroup,
      funnel,

      angle: startAng,

  flashLight.position.set(originX, 3.5, originZ);

}

let mode = 'colosso';
let wingCycle = 0;
let wingSlamDone = false;
let boltTimer = 0;
let tornadoTimer = 0;
let apocWeight = 0;
let quakeShake = 0;
let focusFace = false;

let camAngle = 0.42;
let camPitch = 0.20;
let camDist = 11.4;
let targetCamDist = 11.4;
let currentLookAt = new T.Vector3(0, 2.55, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    wingCycle = 0.001;
    wingSlamDone = false;

  });

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 3.5 : 11.4;
  if (focusFace) {
    camAngle = 0.16;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.006, 2.4, 19.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.018, 2.4, 19.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (FURACÃO VIVO, BATER DE ASAS GIGANTES & TEMPESTADE)
   ========================================================================== */
function update(dt, t) {
  let tx = 0, tz = 0, yaw = Math.sin(t * 0.35) * 0.16, pitch = 0.05, roll = 0;
  const hoverY = Math.sin(t * 1.8) * 0.10;

  // Pulso nas veias de relâmpago e ouro
  typhon.veinBlue.emissiveIntensity = 3.0 + Math.sin(t * 7.5) * 1.1;
  typhon.veinGold.emissiveIntensity = 2.6 + Math.cos(t * 6.0) * 0.9;

  // 1. MOVIMENTAÇÃO DO FURACÃO E POSTURA POR MODO (TIFÃO PERMANECE IMPONENTE NO CENTRO)
  tx = Math.sin(t * 0.55) * 0.32;
  tz = Math.cos(t * 0.45) * 0.25;
  if (mode === 'tornados') {
    yaw = Math.sin(t * 0.9) * 0.28;
    pitch = 0.08;
  }

  typhon.titanRoot.position.set(tx, 0, tz);
  typhon.titanRoot.rotation.set(0, yaw, 0);
  typhon.body.position.y = 1.72 + hoverY;
  typhon.body.rotation.set(pitch, 0, roll);

  // Rotação contínua do funil do furacão e anéis ciclônicos
  const vortexSpin = (mode === 'tornados' || mode === 'apocalipse') ? 7.8 : 4.2;
  typhon.funnelMesh.rotation.y += dt * vortexSpin;
  for (const cr of typhon.cycloneRings) {
    cr.mesh.rotation.z += dt * (vortexSpin * 1.1);
    cr.mesh.position.y = cr.baseY + Math.sin(t * 4.0 + cr.phase) * 0.06;
  }
  for (const ws of typhon.waistSerpents) {
    ws.root.rotation.y = Math.sin(t * 2.5 + ws.side) * 0.22;
    ws.sHead.rotation.x = 0.35 + Math.cos(t * 3.8 + ws.side) * 0.18;
  }

  // 2. BATER DE ASAS GIGANTES E BRAÇOS DE TEMPESTADE
  let wingFlap = Math.sin(t * 2.2) * 0.18;
  let outerFlap = Math.cos(t * 2.2) * 0.14;

  if (mode === 'asas') {
    wingCycle += dt * 0.85;
    if (wingCycle >= 1.0) {
      wingCycle = 0.001;
      wingSlamDone = false;
    }

    if (wingCycle < 0.48) {
      // Abre e ergue as asas gigantes ao máximo acumulando pressão atmosférica
      const k = wingCycle / 0.48;
      wingFlap = -0.45 * k;
      outerFlap = -0.35 * k;
      typhon.rightArm.arm.rotation.set(-0.35 * k, 0.2, 1.85 * k);
      typhon.leftArm.arm.rotation.set(-0.35 * k, -0.2, -1.85 * k);
    } else if (wingCycle < 0.68) {
      // Bate as asas com força colossal para frente gerando ondas de furacão!
      const k = (wingCycle - 0.48) / 0.20;
      wingFlap = -0.45 + 1.15 * k;
      outerFlap = -0.35 + 0.95 * k;
      typhon.rightArm.arm.rotation.set(-0.35 + 1.05 * k, 0.2, 1.85 - 1.35 * k);
      typhon.leftArm.arm.rotation.set(-0.35 + 1.05 * k, -0.2, -1.85 + 1.35 * k);

      if (k > 0.7 && !wingSlamDone) {
        wingSlamDone = true;
        triggerWingShockwave(tx, tz);
        quakeShake = 0.26;
      }
    } else {
      const k = (wingCycle - 0.68) / 0.32;
      wingFlap = 0.70 * (1 - k);
      outerFlap = 0.60 * (1 - k);
      typhon.rightArm.arm.rotation.set(0.70 * (1 - k) - 0.25 * k, 0.2, 0.50);
      typhon.leftArm.arm.rotation.set(0.70 * (1 - k) - 0.25 * k, -0.2, -0.50);
    }
  } else if (mode === 'tornados') {
    // Vórtice de Tornados: abre os braços e invoca múltiplos tornados espiralando pela arena
    wingFlap = -0.18 + Math.sin(t * 3.2) * 0.20;
    outerFlap = -0.12 + Math.cos(t * 3.2) * 0.16;
    typhon.rightArm.arm.rotation.set(-0.65, 0.35, 1.35 + Math.sin(t * 2.8) * 0.10);
    typhon.rightArm.elbow.rotation.set(-0.35, 0.2, 0.2);
    typhon.leftArm.arm.rotation.set(-0.65, -0.35, -1.35 + Math.cos(t * 2.8) * 0.10);
    typhon.leftArm.elbow.rotation.set(-0.35, -0.2, -0.2);

    tornadoTimer -= dt;
    if (tornadoTimer <= 0) {
      tornadoTimer = 1.15;
      spawnTornadoSwarm(tx, tz);
      quakeShake = Math.max(quakeShake, 0.14);
    }
  } else if (mode === 'apocalipse') {
    // Braços e asas abertos nos céus invocando Tempestade Apocalíptica de Relâmpagos
    wingFlap = -0.28 + Math.sin(t * 3.5) * 0.22;
    outerFlap = -0.20 + Math.cos(t * 3.5) * 0.18;
    typhon.rightArm.arm.rotation.set(-0.45, 0.2, 2.35 + Math.sin(t * 3.0) * 0.06);
    typhon.rightArm.elbow.rotation.set(0.45, 0.2, 0.2);
    typhon.leftArm.arm.rotation.set(-0.45, -0.2, -2.35 + Math.cos(t * 3.0) * 0.06);
    typhon.leftArm.elbow.rotation.set(0.45, -0.2, -0.2);

    boltTimer -= dt;
    if (boltTimer <= 0) {
      boltTimer = 0.26;
      strikeSkyLightning(tx, tz);
      quakeShake = Math.max(quakeShake, 0.16);
    }
  } else {
    // Colosso dos Céus
    typhon.rightArm.arm.rotation.set(-0.26, 0.2, 0.62 + Math.sin(t * 1.8) * 0.05);
    typhon.rightArm.elbow.rotation.set(-0.62, 0.2, 0.2);
    typhon.leftArm.arm.rotation.set(-0.26, -0.2, -0.62 - Math.sin(t * 1.8) * 0.05);
    typhon.leftArm.elbow.rotation.set(-0.62, -0.2, -0.2);
  }

  typhon.wings.R.innerWing.rotation.y = -0.25 - wingFlap;
  typhon.wings.R.outerWing.rotation.y = -0.18 - outerFlap;
  typhon.wings.L.innerWing.rotation.y = 0.25 + wingFlap;
  typhon.wings.L.outerWing.rotation.y = 0.18 + outerFlap;

  // Esferas elétricas nas mãos
  const handPower = (mode === 'apocalipse' || mode === 'asas' || mode === 'tornados') ? 1.55 : 1.0;
  typhon.rightArm.palmOrb.scale.setScalar((0.9 + Math.sin(t * 16) * 0.2) * handPower);
  typhon.leftArm.palmOrb.scale.setScalar((0.9 + Math.cos(t * 16) * 0.2) * handPower);

  for (const bs of typhon.beardSpikes) {
    bs.mesh.rotation.x = bs.baseRx + Math.sin(t * 3.2 + bs.phase) * 0.05;
  }

  // 3. ATUALIZAÇÃO DE ONDAS DE FURACÃO, RELÂMPAGOS E PARTÍCULAS DE VENTO
  for (let i = galeWaves.length - 1; i >= 0; i--) {
    const gw = galeWaves[i];
    if (gw.delay > 0) { gw.delay -= dt; continue; }
    gw.life -= dt;
    const k = Math.max(0, gw.life / gw.max);
    gw.mesh.scale.setScalar(1 + (1 - k) * 9.5);
    gw.mesh.material.opacity = 0.94 * k;
    if (gw.life <= 0) {
      scene.remove(gw.mesh);
      gw.mesh.geometry.dispose();
      gw.mesh.material.dispose();
      galeWaves.splice(i, 1);
    }
  }

  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    const lb = lightningBolts[i];
    lb.life -= dt;
    const k = Math.max(0, lb.life / lb.max);
    lb.meshes[0].material.opacity = k;
    lb.meshes[1].material.opacity = 0.65 * k;
    if (lb.life <= 0) {
      lb.meshes.forEach(m => {
        scene.remove(m);
        m.geometry.dispose();
        m.material.dispose();
      });
      lightningBolts.splice(i, 1);
    }
  }

  // Atualização dos múltiplos tornados invocados pelo Vórtice de Tornados
  for (let i = spawnedTornadoes.length - 1; i >= 0; i--) {
    const tn = spawnedTornadoes[i];
    tn.life -= dt;
    const k = Math.max(0, tn.life / tn.max);
    const grow = Math.sin((1 - k) * Math.PI);

    tn.angle += tn.angularSpeed * dt;
    tn.radius += tn.radialSpeed * dt;
    tn.group.position.set(
      tx + Math.cos(tn.angle) * tn.radius,
      0,
      tz + Math.sin(tn.angle) * tn.radius
    );
    tn.funnel.rotation.y += dt * 11.0;
    tn.baseRing.rotation.z -= dt * 8.0;

    const sc = Math.max(0.05, grow * 1.15);
    tn.group.scale.set(sc, sc, sc);
    tn.funnel.material.opacity = 0.55 * k;
    tn.baseRing.material.opacity = 0.85 * k;

    if (tn.life <= 0) {
      scene.remove(tn.group);
      tn.group.children.forEach(c => {
        if (c.geometry && c.geometry !== miniFunnelGeo) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      spawnedTornadoes.splice(i, 1);
    }
  }

  const wAttr = windGeo.attributes.position;
  for (let i = 0; i < WIND_N; i++) {
    windAngle[i] += windSpeed[i] * dt * ((mode === 'apocalipse' || mode === 'tornados') ? 2.2 : 1.1);
    wAttr.setX(i, Math.cos(windAngle[i]) * windRadius[i]);
    wAttr.setZ(i, Math.sin(windAngle[i]) * windRadius[i]);
  }
  wAttr.needsUpdate = true;

  const apocTarget = (mode === 'apocalipse') ? 1 : 0;
  apocWeight = T.MathUtils.damp(apocWeight, apocTarget, 2.5, dt);
  scene.background.lerpColors(stormSkyBg, apocSkyBg, apocWeight);
  scene.fog.color.copy(scene.background);

  stormRuneRing.rotation.z += dt * 0.28;
  stormPoint.position.set(tx, 3.2, tz);
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 24);

  // 4. CÂMERA INTERATIVA 360° + TREMOR + FOCO NO ROSTO TITÂNICO
  quakeShake = Math.max(0, quakeShake - dt * 0.55);
  const shakeX = (Math.random() - 0.5) * quakeShake;
  const shakeY = (Math.random() - 0.5) * quakeShake;

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.05;

  const desiredTarget = focusFace
    ? new T.Vector3(tx, 3.65 + hoverY, tz)
    : new T.Vector3(0, 2.55, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist + shakeX,
    currentLookAt.y + vertDist + shakeY,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
