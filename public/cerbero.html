<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Titã Cérbero - Guardião do Submundo | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --hellfire: #ea580c;
      --soul: #10b981;
      --tartarus: #9333ea;
      --obsidian: #060609;
      --glass: rgba(12, 10, 18, 0.84);
      --border: rgba(234, 88, 12, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--obsidian);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #fff7ed;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #10b981;
      transform: translateY(-1px);
      background: rgba(24, 18, 32, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #ea580c 0%, #6d28d9 100%);
      color: #ffffff;
      border-color: #fed7aa;
      box-shadow: 0 0 22px rgba(234, 88, 12, 0.58);
    }
    button.cam-btn {
      border-color: rgba(16, 185, 129, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: #ecfdf5;
      border-color: #6ee7b7;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.5);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fb923c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 8, 15, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234, 88, 12, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #ffedd5;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="guardiao" class="on">Guardião Abissal</button>
    <button data-m="investida">Investida Infernal</button>
    <button data-m="rugido">Rugido Triplo</button>
    <button data-m="baforada">Fogo do Tártaro</button>
    <button id="btn-focus" class="cam-btn">Focar Cabeças</button>
  </div>
</div>

<div id="badge">Titã de Hades • Cérbero</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE DE CINZA/OBSIDIANA, PELAGEM E SOLO)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map rugoso de pele monstruosa titânica
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8000; i++) {
    const v = 114 + Math.floor(Math.random() * 26);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(5, 5);

  // 1.2 Tangas / Saiote de Guerra de Couro Negro e Bronze Forjado
  const armorCanvas = document.createElement('canvas');
  armorCanvas.width = 512;
  armorCanvas.height = 256;
  const aCtx = armorCanvas.getContext('2d');
  const grad = aCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#09090b');
  grad.addColorStop(0.6, '#1c1917');
  grad.addColorStop(1, '#29150c');
  aCtx.fillStyle = grad;
  aCtx.fillRect(0, 0, 512, 256);

  // Borda de ferro envelhecido com runas do Tártaro
  aCtx.fillStyle = '#451a03';
  aCtx.fillRect(0, 204, 512, 36);
  for (let x = 0; x < 512; x += 32) {
    aCtx.strokeStyle = '#ea580c';
    aCtx.lineWidth = 2.5;
    aCtx.beginPath();
    aCtx.moveTo(x + 16, 209);
    aCtx.lineTo(x + 25, 222);
    aCtx.lineTo(x + 16, 235);
    aCtx.lineTo(x + 7, 222);
    aCtx.closePath();
    aCtx.stroke();
  }
  const armorTex = new T.CanvasTexture(armorCanvas);
  armorTex.wrapS = armorTex.wrapT = T.RepeatWrapping;

  // 1.3 Portões do Submundo: Obsidiana Rachada com Fissuras de Magma e Alma Verde
  const obsCanvas = document.createElement('canvas');
  obsCanvas.width = obsCanvas.height = 1024;
  const oCtx = obsCanvas.getContext('2d');
  oCtx.fillStyle = '#090a0f';
  oCtx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 4200; i++) {
    oCtx.fillStyle = i % 2 === 0 ? 'rgba(28, 30, 42, 0.35)' : 'rgba(2, 2, 5, 0.55)';
    oCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  // Selo infernal concêntrico do Tártaro
  oCtx.strokeStyle = '#ea580c';
  oCtx.lineWidth = 14;
  oCtx.beginPath();
  oCtx.arc(cx, cy, 420, 0, Math.PI * 2);
  oCtx.stroke();

  oCtx.strokeStyle = '#10b981';
  oCtx.lineWidth = 6;
  oCtx.beginPath();
  oCtx.arc(cx, cy, 436, 0, Math.PI * 2);
  oCtx.stroke();

  // Fissuras de lava e energia espectral irradiando do centro
  for (let i = 0; i < 40; i++) {
    const a = (i / 40) * Math.PI * 2 + Math.random() * 0.12;
    let r = 85;
    let px = cx + Math.cos(a) * r;
    let py = cy + Math.sin(a) * r;

    oCtx.strokeStyle = i % 3 === 0 ? 'rgba(16, 185, 129, 0.55)' : 'rgba(234, 88, 12, 0.72)';
    oCtx.lineWidth = 2.6;
    oCtx.beginPath();
    oCtx.moveTo(px, py);
    for (let s = 0; s < 6; s++) {
      r += 52;
      const jitter = (Math.random() - 0.5) * 0.16;
      px = cx + Math.cos(a + jitter) * r;
      py = cy + Math.sin(a + jitter) * r;
      oCtx.lineTo(px, py);
    }
    oCtx.stroke();
  }

  const obsidianTex = new T.CanvasTexture(obsCanvas);

  return { skinBump, armorTex, obsidianTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA TITÂNICA E MATERIAIS INFERNAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    titanSkin: new T.MeshStandardMaterial({
      color: 0x3b3f4a,          // Pele titânica de cinza-basalto sombrio
      roughness: 0.48,
      metalness: 0.14,
      bumpMap: textures.skinBump,
      bumpScale: 0.006
    }),
    houndFurDark: new T.MeshStandardMaterial({
      color: 0x16161d,          // Pelagem negra profunda das três cabeças de cão infernal
      roughness: 0.58,
      metalness: 0.12,
      bumpMap: textures.skinBump,
      bumpScale: 0.005
    }),
    houndMuzzle: new T.MeshStandardMaterial({
      color: 0x262630,
      roughness: 0.52,
      metalness: 0.15
    }),
    hellfireVein: new T.MeshStandardMaterial({
      color: 0xfef08a,
      emissive: 0xea580c,       // Veias de magma incandescente pulsando nos músculos
      emissiveIntensity: 3.2,
      roughness: 0.12
    }),
    soulVein: new T.MeshStandardMaterial({
      color: 0x6ee7b7,
      emissive: 0x10b981,       // Veias espectrais verdes do Submundo
      emissiveIntensity: 2.6,
      roughness: 0.15
    }),
    blackIron: new T.MeshStandardMaterial({
      color: 0x18181b,          // Ferro negro forjado (correntes, coleiras e garras)
      metalness: 0.92,
      roughness: 0.28
    }),
    tarnishedBronze: new T.MeshStandardMaterial({
      color: 0x92400e,
      emissive: 0x290d02,
      emissiveIntensity: 0.25,
      metalness: 0.88,
      roughness: 0.3
    }),
    fangBone: new T.MeshStandardMaterial({
      color: 0xf5f5f4,          // Presas afiadas e garras de marfim/osso
      emissive: 0x451a03,
      emissiveIntensity: 0.2,
      roughness: 0.28,
      metalness: 0.1
    }),
    mawGlow: new T.MeshStandardMaterial({
      color: 0xfef08a,
      emissive: 0xf97316,       // Garganta e boca incandescentes de fogo do Tártaro
      emissiveIntensity: 4.0,
      roughness: 0.1
    }),
    eyeHellfire: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xf97316,       // Olhos de fogo infernal (cabeças laterais)
      emissiveIntensity: 4.2,
      roughness: 0.05
    }),
    eyeSoulAlpha: new T.MeshStandardMaterial({
      color: 0xd1fae5,
      emissive: 0x10b981,       // Olhos espectrais verdes (cabeça alfa central)
      emissiveIntensity: 4.4,
      roughness: 0.05
    }),
    loincloth: new T.MeshStandardMaterial({
      map: textures.armorTex,
      roughness: 0.65,
      metalness: 0.15,
      side: T.DoubleSide
    }),
    serpentScale: new T.MeshStandardMaterial({
      color: 0x1e293b,
      emissive: 0x064e3b,
      emissiveIntensity: 0.35,
      roughness: 0.38,
      metalness: 0.35
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DO TITÃ CÉRBERO (CORPO HUMANO TITÂNICO + 3 CABEÇAS DE CÃO + CAUDA SERPENTE)
   ========================================================================== */
function buildHoundHead(M, isCenterAlpha = false, scaleFactor = 1.0) {
  const headRoot = new T.Group();
  headRoot.scale.setScalar(scaleFactor);

  // Crânio lupino/molosso musculoso e largo
  const cranium = sculpt(headRoot, new T.SphereGeometry(0.175, 24, 24), M.houndFurDark, [0, 0.03, 0], [0, 0, 0], [1.06, 0.94, 1.18]);

  // Crista sagital e juba de espinhos/pelos negros na nuca
  for (let s = 0; s < 6; s++) {
    const t = s / 5;
    sculpt(
      headRoot,
      new T.ConeGeometry(0.038, 0.18 - t * 0.04, 5),
      s % 2 === 0 ? M.houndFurDark : M.blackIron,
      [0, 0.16 - t * 0.04, -0.02 - t * 0.16],
      [-0.55 - t * 0.45, 0, 0],
      [0.55, 1, 1]
    );
  }

  // Orelhas pontudas e rasgadas de cão de guarda infernal
  for (const side of [-1, 1]) {
    const ear = sculpt(
      headRoot,
      new T.ConeGeometry(0.046, 0.18, 5),
      M.houndFurDark,
      [side * 0.115, 0.16, -0.04],
      [-0.18, side * 0.15, side * -0.32],
      [0.45, 1, 0.85]
    );
    // Argola de ferro furando a orelha direita
    if (side === 1 && isCenterAlpha) {
      sculpt(ear, new T.TorusGeometry(0.022, 0.005, 6, 16), M.tarnishedBronze, [0.02, 0.02, 0.01], [0, Math.PI / 2, 0]);
    }
  }

  // Arcos superciliares ferozes e rugas no focinho
  for (const side of [-1, 1]) {
    sculpt(headRoot, new T.CapsuleGeometry(0.02, 0.068, 6, 10), M.houndFurDark, [side * 0.068, 0.065, 0.145], [0.15, side * -0.25, side * -1.22]);
  }

  // Olhos Infernais Luminosos (Alfa central brilha em verde-alma; laterais em fogo-magma)
  const eyeMat = isCenterAlpha ? M.eyeSoulAlpha : M.eyeHellfire;
  for (const side of [-1, 1]) {
    sculpt(headRoot, new T.SphereGeometry(0.022, 14, 14), eyeMat, [side * 0.066, 0.042, 0.142], [0, 0, 0], [1.15, 0.72, 0.85]);
  }

  // Focinho Superior (Maxila) alongado e musculoso com narinas fumegantes
  const upperSnout = group(headRoot, 0, 0.005, 0.15);
  sculpt(upperSnout, new T.BoxGeometry(0.135, 0.095, 0.21), M.houndMuzzle, [0, 0, 0.08], [0.04, 0, 0]);
  // Trufa / Nariz negro
  sculpt(upperSnout, new T.BoxGeometry(0.068, 0.048, 0.042), M.blackIron, [0, 0.018, 0.185]);
  // Brilho de brasa nas narinas
  sculpt(upperSnout, new T.SphereGeometry(0.011, 8, 8), M.mawGlow, [-0.018, 0.018, 0.205]);
  sculpt(upperSnout, new T.SphereGeometry(0.011, 8, 8), M.mawGlow, [0.018, 0.018, 0.205]);

  // Núcleo incandescente no fundo da garganta
  const throatGlow = sculpt(headRoot, new T.SphereGeometry(0.065, 12, 12), M.mawGlow, [0, -0.035, 0.13]);

  // Presas Superiores Afiadas (Caninos gigantes)
  for (const side of [-1, 1]) {
    sculpt(upperSnout, new T.ConeGeometry(0.016, 0.068, 6), M.fangBone, [side * 0.046, -0.068, 0.155], [Math.PI, 0, side * -0.08]);
    sculpt(upperSnout, new T.ConeGeometry(0.011, 0.044, 5), M.fangBone, [side * 0.052, -0.058, 0.105], [Math.PI, 0, 0]);
  }

  // Mandíbula Inferior Articulada (abre e fecha para rosnar e cuspir fogo!)
  const jawPivot = group(headRoot, 0, -0.042, 0.08);
  sculpt(jawPivot, new T.BoxGeometry(0.112, 0.046, 0.19), M.houndMuzzle, [0, -0.015, 0.11]);
  // Presas Inferiores
  for (const side of [-1, 1]) {
    sculpt(jawPivot, new T.ConeGeometry(0.014, 0.058, 6), M.fangBone, [side * 0.038, 0.025, 0.185], [0.12, 0, side * 0.08]);
  }
  // Língua flamejante
  sculpt(jawPivot, new T.BoxGeometry(0.048, 0.014, 0.13), M.mawGlow, [0, 0.008, 0.12], [0.08, 0, 0]);

  return { headRoot, jawPivot, throatGlow };
}

export function buildCerberusTitan(textures) {
  const M = createMaterials(textures);

  // Escala Titânica: 1.32x, com pés plantados diretamente no solo (y = 0)
  const titanRoot = new T.Group();
  const body = group(titanRoot, 0, 1.32, 0);
  body.scale.setScalar(1.32);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS TITÂNICAS COLOSSAIS (PÉS FIRMEMENTE NO CHÃO)
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.90, 0);
  sculpt(pelvis, new T.SphereGeometry(0.30, 22, 20), M.titanSkin, [0, 0, 0], [0, 0, 0], [1.18, 0.78, 0.88]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.195, -0.04, 0);

    // Coxa colossal com feixes de quadríceps esculpidos
    sculpt(hip, new T.CylinderGeometry(0.18, 0.132, 0.52, 20), M.titanSkin, [0, -0.25, 0], [0, 0, 0], [1.08, 1, 1.14]);
    const quadGeo = new T.SphereGeometry(0.142, 16, 16);
    sculpt(hip, quadGeo, M.titanSkin, [s * 0.026, -0.22, 0.062], [0, 0, 0], [1.0, 1.85, 0.9]);
    sculpt(hip, quadGeo, M.titanSkin, [s * 0.065, -0.25, 0.016], [0, 0, 0], [0.9, 1.75, 0.94]);

    // Veia de magma pulsando na coxa
    const thighVein = new T.CatmullRomCurve3([
      new T.Vector3(s * 0.12, -0.08, 0.08),
      new T.Vector3(s * 0.14, -0.24, 0.11),
      new T.Vector3(s * 0.10, -0.40, 0.09)
    ]);
    sculpt(hip, new T.TubeGeometry(thighVein, 10, 0.008, 6, false), M.hellfireVein);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.112, 16, 16), M.titanSkin, [0, -0.52, 0.018]);

    // Panturrilha massiva e Algema / Grilhão Infernal no tornozelo
    const knee = group(hip, 0, -0.53, 0);
    sculpt(knee, new T.CylinderGeometry(0.116, 0.072, 0.46, 18), M.titanSkin, [0, -0.23, 0], [0, 0, 0], [1.04, 1, 1.08]);
    sculpt(knee, new T.SphereGeometry(0.11, 16, 16), M.titanSkin, [0, -0.15, -0.048], [0, 0, 0], [1.02, 1.65, 1.0]);

    // Algema pesada de ferro negro no tornozelo
    const shackle = new T.TorusGeometry(0.088, 0.018, 8, 20);
    shackle.rotateX(Math.PI / 2);
    sculpt(knee, shackle, M.blackIron, [0, -0.39, 0.01]);
    sculpt(knee, new T.ConeGeometry(0.02, 0.07, 5), M.tarnishedBronze, [s * 0.095, -0.39, 0.01], [0, 0, -s * Math.PI / 2]);

    // Pé bestial com 3 garras afiadas
    const ankle = group(knee, 0, -0.46, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.13, 0.068, 0.25), M.titanSkin, [0, -0.02, 0.04]);
    for (let c = -1; c <= 1; c++) {
      sculpt(ankle, new T.ConeGeometry(0.018, 0.085, 6), M.fangBone, [c * 0.042, -0.032, 0.18], [1.45, 0, 0]);
    }
    legs[side] = { hip, knee, ankle };
  }

  // Base aberta de colosso plantada no chão
  legs.L.hip.rotation.set(-0.18, -0.18, -0.15);
  legs.L.knee.rotation.set(0.24, 0, 0);
  legs.L.ankle.rotation.set(-0.06, 0, 0.14);

  legs.R.hip.rotation.set(0.16, 0.22, 0.16);
  legs.R.knee.rotation.set(0.20, 0, 0);
  legs.R.ankle.rotation.set(-0.06, 0, -0.14);

  // ------------------------------------------------------------------------
  // B. TRONCO HUMANO TITÂNICO MONSTRUOSO (PEITORAIS, 6-PACK & VEIAS DE MAGMA)
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.34, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.31, -0.40),
    new T.Vector2(0.29, -0.20),
    new T.Vector2(0.37, 0.04),
    new T.Vector2(0.52, 0.29),  // Ombros extremamente largos para sustentar 3 pescoços!
    new T.Vector2(0.46, 0.45),
    new T.Vector2(0.26, 0.52),
    new T.Vector2(0.01, 0.53)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.titanSkin, [0, 0, 0], [0, 0, 0], [1.28, 1.04, 0.82]);

  // Peitorais colossais
  const pecGeo = new T.SphereGeometry(0.27, 24, 24);
  sculpt(torso, pecGeo, M.titanSkin, [-0.23, 0.23, 0.195], [0.12, -0.22, -0.14], [1.1, 0.9, 0.64]);
  sculpt(torso, pecGeo, M.titanSkin, [0.23, 0.23, 0.195], [0.12, 0.22, 0.14], [1.1, 0.9, 0.64]);

  // Veias de Magma e Alma Verde pulsando pelo tórax titânico
  const vein1 = new T.CatmullRomCurve3([
    new T.Vector3(-0.38, 0.35, 0.14),
    new T.Vector3(-0.22, 0.25, 0.29),
    new T.Vector3(-0.08, 0.14, 0.31),
    new T.Vector3(-0.14, -0.02, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(vein1, 16, 0.009, 6, false), M.hellfireVein);

  const vein2 = new T.CatmullRomCurve3([
    new T.Vector3(0.38, 0.35, 0.14),
    new T.Vector3(0.22, 0.25, 0.29),
    new T.Vector3(0.08, 0.14, 0.31),
    new T.Vector3(0.14, -0.02, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(vein2, 16, 0.009, 6, false), M.soulVein);

  // Six-Pack Abdominal Profundo e Oblíquos
  const abGeo = new T.SphereGeometry(0.105, 16, 16);
  [
    { y: 0.04, sx: 1.08, sy: 0.78, z: 0.254 },
    { y: -0.08, sx: 1.04, sy: 0.80, z: 0.250 },
    { y: -0.20, sx: 0.95, sy: 0.86, z: 0.238 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.titanSkin, [-0.088, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.52]);
    sculpt(torso, abGeo, M.titanSkin, [0.088, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.52]);
  });

  // Dorsais e Trapézios gigantescos formando a base muscular das 3 cabeças
  const latGeo = new T.SphereGeometry(0.29, 20, 20);
  sculpt(torso, latGeo, M.titanSkin, [-0.27, 0.18, -0.14], [0, 0, -0.25], [1.05, 1.38, 0.7]);
  sculpt(torso, latGeo, M.titanSkin, [0.27, 0.18, -0.14], [0, 0, 0.25], [1.05, 1.38, 0.7]);

  const trapGeo = new T.SphereGeometry(0.28, 18, 18);
  sculpt(torso, trapGeo, M.titanSkin, [-0.24, 0.45, -0.05], [0, 0, 0.38], [1.2, 0.72, 0.82]);
  sculpt(torso, trapGeo, M.titanSkin, [0.24, 0.45, -0.05], [0, 0, -0.38], [1.2, 0.72, 0.82]);

  // Correntes Infernais de Ferro Negro cruzando o peitoral como um "X"
  for (const dir of [-1, 1]) {
    const chainPts = [
      new T.Vector3(dir * 0.38, 0.44, 0.14),
      new T.Vector3(dir * 0.16, 0.20, 0.31),
      new T.Vector3(-dir * 0.12, -0.08, 0.29),
      new T.Vector3(-dir * 0.32, -0.34, 0.18)
    ];
    const chainCurve = new T.CatmullRomCurve3(chainPts);
    for (let c = 0; c <= 14; c++) {
      const pt = chainCurve.getPoint(c / 14);
      const link = new T.TorusGeometry(0.026, 0.008, 6, 12);
      sculpt(torso, link, M.blackIron, [pt.x, pt.y, pt.z], [c % 2 === 0 ? 0.3 : 1.2, dir * 0.4, 0]);
    }
  }

  // ------------------------------------------------------------------------
  // C. AS TRÊS CABEÇAS DE CÃO INFERNAL (ALFA CENTRAL + 2 LATERAIS FEROZES)
  // ------------------------------------------------------------------------
  const necksGroup = group(torso, 0, 0.48, 0.02);

  // 1. Cabeça Central (Alfa — Maior, com olhos verde-alma e coleira de ferro com espigões)
  const neckCenter = group(necksGroup, 0, 0.04, 0.02);
  sculpt(neckCenter, new T.CylinderGeometry(0.145, 0.185, 0.28, 18), M.titanSkin, [0, 0.12, 0], [0.12, 0, 0]);
  const collarC = new T.TorusGeometry(0.162, 0.022, 8, 24);
  collarC.rotateX(Math.PI / 2);
  sculpt(neckCenter, collarC, M.blackIron, [0, 0.15, 0.01], [0.12, 0, 0]);
  for (let sp = 0; sp < 8; sp++) {
    const a = (sp / 8) * Math.PI * 2;
    sculpt(neckCenter, new T.ConeGeometry(0.02, 0.075, 5), M.tarnishedBronze, [Math.sin(a) * 0.18, 0.15, Math.cos(a) * 0.18 + 0.01], [Math.cos(a) * 1.4, 0, -Math.sin(a) * 1.4]);
  }
  const headCenterObj = buildHoundHead(M, true, 1.14);
  headCenterObj.headRoot.position.set(0, 0.32, 0.04);
  neckCenter.add(headCenterObj.headRoot);

  // 2. Cabeça Esquerda (Fogo do Tártaro — Olhos laranja-brasa, inclinada para a esquerda)
  const neckLeft = group(necksGroup, -0.25, 0.0, 0.01);
  neckLeft.rotation.set(0.08, 0.34, 0.26);
  sculpt(neckLeft, new T.CylinderGeometry(0.125, 0.16, 0.26, 16), M.titanSkin, [0, 0.11, 0]);
  const collarL = new T.TorusGeometry(0.142, 0.018, 8, 20);
  collarL.rotateX(Math.PI / 2);
  sculpt(neckLeft, collarL, M.blackIron, [0, 0.14, 0]);
  const headLeftObj = buildHoundHead(M, false, 0.96);
  headLeftObj.headRoot.position.set(0, 0.28, 0.03);
  neckLeft.add(headLeftObj.headRoot);

  // 3. Cabeça Direita (Fogo do Tártaro — Olhos laranja-brasa, inclinada para a direita)
  const neckRight = group(necksGroup, 0.25, 0.0, 0.01);
  neckRight.rotation.set(0.08, -0.34, -0.26);
  sculpt(neckRight, new T.CylinderGeometry(0.125, 0.16, 0.26, 16), M.titanSkin, [0, 0.11, 0]);
  const collarR = new T.TorusGeometry(0.142, 0.018, 8, 20);
  collarR.rotateX(Math.PI / 2);
  sculpt(neckRight, collarR, M.blackIron, [0, 0.14, 0]);
  const headRightObj = buildHoundHead(M, false, 0.96);
  headRightObj.headRoot.position.set(0, 0.28, 0.03);
  neckRight.add(headRightObj.headRoot);

  // ------------------------------------------------------------------------
  // D. BRAÇOS TITÂNICOS COLOSSAIS COM MANOPLAS DE CORRENTES E GARRAS INFERNAIS
  // ------------------------------------------------------------------------
  function createTitanArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.56, 0.35, -0.01);

    sculpt(
      arm,
      new T.SphereGeometry(0.21, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.48),
      M.blackIron,
      [s * 0.02, 0.04, 0],
      [0, 0, s * -0.35],
      [1.15, 0.78, 1.18]
    );
    sculpt(arm, new T.ConeGeometry(0.032, 0.16, 5), M.tarnishedBronze, [s * 0.12, 0.14, 0], [0, 0, s * -0.5]);

    sculpt(arm, new T.SphereGeometry(0.185, 20, 20), M.titanSkin, [0, -0.02, 0], [0, 0, s * -0.25], [1.08, 1.18, 1.08]);
    sculpt(arm, new T.CapsuleGeometry(0.122, 0.30, 12, 18), M.titanSkin, [s * 0.03, -0.20, 0], [0, 0, s * 0.08]);
    sculpt(arm, new T.SphereGeometry(0.114, 16, 16), M.titanSkin, [s * 0.022, -0.19, 0.058], [0, 0, s * 0.08], [0.96, 1.48, 0.96]);

    const elbow = group(arm, s * 0.052, -0.40, 0);
    sculpt(elbow, new T.CylinderGeometry(0.116, 0.078, 0.36, 18), M.titanSkin, [0, -0.17, 0], [0, 0, 0], [1.06, 1, 0.98]);

    for (let r = 0; r < 3; r++) {
      const chainRing = new T.TorusGeometry(0.095 - r * 0.006, 0.014, 8, 20);
      chainRing.rotateX(Math.PI / 2);
      sculpt(elbow, chainRing, M.blackIron, [0, -0.18 - r * 0.055, 0], [0.15, 0, r * 0.2]);
    }

    const hand = group(elbow, 0, -0.37, 0);
    sculpt(hand, new T.BoxGeometry(0.105, 0.11, 0.055), M.titanSkin, [0, -0.02, 0]);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.025;
      sculpt(hand, new T.CapsuleGeometry(0.015, 0.048, 6, 8), M.titanSkin, [fx, -0.08, 0.024], [1.15, 0, 0]);
      sculpt(hand, new T.ConeGeometry(0.014, 0.075, 5), M.fangBone, [fx, -0.125, 0.055], [1.85, 0, 0]);
    }
    sculpt(hand, new T.ConeGeometry(0.016, 0.07, 5), M.fangBone, [-s * 0.062, -0.055, 0.045], [1.2, 0, -s * 0.75]);

    return { arm, elbow, hand };
  }

  const rightArm = createTitanArm(true);
  const leftArm = createTitanArm(false);

  // ------------------------------------------------------------------------
  // E. SAIOTE DE GUERRA INFERNAL + CAUDA DE SERPENTE ARTICULADA NAS COSTAS
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  const beltGeo = new T.TorusGeometry(0.32, 0.038, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.blackIron, [0, -0.36, 0.01], [0.05, 0, -0.03], [1.16, 1, 0.88]);
  sculpt(garments, new T.CylinderGeometry(0.082, 0.082, 0.03, 14), M.tarnishedBronze, [0, -0.36, 0.29], [Math.PI / 2, 0, 0]);
  sculpt(garments, new T.OctahedronGeometry(0.038, 0), M.hellfireVein, [0, -0.36, 0.31]);

  const skirtGeo = new T.CylinderGeometry(0.32, 0.58, 0.86, 44, 16, true);
  const skPos = skirtGeo.attributes.position;
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.43 - y) / 0.86));
    const pleat = Math.sin(angle * 10) * 0.032 * (0.2 + normY * 0.9);
    const tatter = Math.sin(angle * 7) * 0.07 * Math.pow(normY, 2);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.1;
    z = Math.sin(angle) * r * 0.86 - normY * 0.06;
    skPos.setXYZ(i, x, y + tatter, z);
  }
  skirtGeo.computeVertexNormals();
  sculpt(garments, skirtGeo, M.loincloth, [0, -0.78, 0], [0.04, 0, 0]);

  const tailGroup = group(pelvis, 0, -0.05, -0.24);
  const tailSegments = [];
  let parentTail = tailGroup;
  for (let seg = 0; seg < 7; seg++) {
    const t = seg / 6;
    const rad = 0.095 * (1 - t * 0.62);
    const segPivot = group(parentTail, 0, seg === 0 ? 0 : -0.18, seg === 0 ? 0 : -0.12);
    sculpt(segPivot, new T.CylinderGeometry(rad * 0.85, rad, 0.24, 12), M.serpentScale, [0, -0.09, -0.06], [0.65, 0, 0]);
    if (seg === 6) {
      sculpt(segPivot, new T.ConeGeometry(0.065, 0.18, 6), M.serpentScale, [0, -0.22, -0.14], [1.85, 0, 0], [1.2, 1, 0.6]);
      sculpt(segPivot, new T.SphereGeometry(0.015, 8, 8), M.eyeSoulAlpha, [-0.032, -0.20, -0.16]);
      sculpt(segPivot, new T.SphereGeometry(0.015, 8, 8), M.eyeSoulAlpha, [0.032, -0.20, -0.16]);
    }
    tailSegments.push({ pivot: segPivot, phase: seg * 0.65 });
    parentTail = segPivot;
  }

  return {
    titanRoot, body, torso, legs,
    rightArm, leftArm,
    necksGroup, neckCenter, neckLeft, neckRight,
    headCenterObj, headLeftObj, headRightObj,
    tailSegments,
    veinMatHell: M.hellfireVein,
    veinMatSoul: M.soulVein
  };
}

const EMBER_N = 360;
const emberPos = new Float32Array(EMBER_N * 3);
const emberVel = new Float32Array(EMBER_N * 3);
const emberLife = new Float32Array(EMBER_N);
let emberIdx = 0;

for (let i = 0; i < EMBER_N; i++) {
  emberPos[i * 3] = (Math.random() - 0.5) * 15;
  emberPos[i * 3 + 1] = Math.random() * 6.5;
  emberPos[i * 3 + 2] = (Math.random() - 0.5) * 15;
  emberVel[i * 3] = (Math.random() - 0.5) * 0.4;
  emberVel[i * 3 + 1] = 0.45 + Math.random() * 0.75;
  emberVel[i * 3 + 2] = (Math.random() - 0.5) * 0.4;
  emberLife[i] = 999;
}
const emberGeo = new T.BufferGeometry();
emberGeo.setAttribute('position', new T.BufferAttribute(emberPos, 3));
scene.add(new T.Points(emberGeo, new T.PointsMaterial({
  color: 0xfb923c,
  size: 0.10,
  transparent: true,
  opacity: 0.88,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnHellBurst(x, y, z, count = 26) {
  for (let c = 0; c < count; c++) {
    const i = emberIdx;
    emberIdx = (emberIdx + 1) % 180;
    emberPos[i * 3] = x;
    emberPos[i * 3 + 1] = y;
    emberPos[i * 3 + 2] = z;
    emberVel[i * 3] = (Math.random() - 0.5) * 6.5;
    emberVel[i * 3 + 1] = 1.8 + Math.random() * 5.2;
    emberVel[i * 3 + 2] = (Math.random() - 0.5) * 6.5;
    emberLife[i] = 0.7 + Math.random() * 0.5;
  }
}

function updateEmbers(dt, t) {
  for (let i = 0; i < EMBER_N; i++) {
    if (i < 180 && emberLife[i] < 100) {
      if (emberLife[i] <= 0) continue;
      emberLife[i] -= dt;
      emberVel[i * 3 + 1] -= 8.5 * dt;
      emberPos[i * 3] += emberVel[i * 3] * dt;
      emberPos[i * 3 + 1] += emberVel[i * 3 + 1] * dt;
      emberPos[i * 3 + 2] += emberVel[i * 3 + 2] * dt;
      if (emberLife[i] <= 0) emberPos[i * 3 + 1] = -100;
    } else {
      emberPos[i * 3] += Math.sin(t * 1.3 + i) * 0.25 * dt;
      emberPos[i * 3 + 1] += emberVel[i * 3 + 1] * dt;
      emberPos[i * 3 + 2] += Math.cos(t * 1.2 + i) * 0.25 * dt;
      if (emberPos[i * 3 + 1] > 6.8) {
        emberPos[i * 3 + 1] = 0.1;
        emberPos[i * 3] = (Math.random() - 0.5) * 14;
        emberPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
      }
    }
  }
  emberGeo.attributes.position.needsUpdate = true;
}

function triggerTripleRoar(cx, cz) {
  const colors = [0x10b981, 0xea580c, 0x9333ea];
  for (let k = 0; k < 3; k++) {
    const sw = new T.Mesh(
      new T.RingGeometry(0.45, 0.88, 56),
      new T.MeshBasicMaterial({
        color: colors[k],
        transparent: true,
        opacity: 0.94,

        depthWrite: false
      })
    );
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(cx, 0.05 + k * 0.03, cz);
    scene.add(sw);
    roarRings.push({ mesh: sw, life: 1.25, max: 1.25, delay: k * 0.12 });
  }
  blastLight.position.set(cx, 3.2, cz);
  blastLight.intensity = 14.0;
  spawnHellBurst(cx, 0.3, cz, 45);
}

function fireTripleHellBreath(yaw) {
  cerberus.titanRoot.updateMatrixWorld(true);
  const heads = [
    { obj: cerberus.headCenterObj, color: 0x10b981, spread: 0 },
    { obj: cerberus.headLeftObj, color: 0xf97316, spread: 0.34 },
    { obj: cerberus.headRightObj, color: 0xf97316, spread: -0.34 }
  ];

  for (const h of heads) {
    h.obj.throatGlow.getWorldPosition(tmpV);
    const start = tmpV.clone();
    const ang = yaw + h.spread + (Math.random() - 0.5) * 0.14;
    const dist = 3.2 + Math.random() * 1.6;
    const target = new T.Vector3(
      start.x + Math.sin(ang) * dist,
      0.12,
      start.z + Math.cos(ang) * dist
    );

    const orbGroup = new T.Group();
    orbGroup.position.copy(start);
    const core = new T.Mesh(new T.SphereGeometry(0.18, 10, 10), new T.MeshBasicMaterial({ color: 0xfef08a }));
    const halo = new T.Mesh(
      new T.SphereGeometry(0.34, 10, 10),
      new T.MeshBasicMaterial({
        color: h.color,
        transparent: true,
        opacity: 0.72,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    orbGroup.add(core, halo);
    scene.add(orbGroup);

    fireOrbs.push({ mesh: orbGroup, start, target, progress: 0, speed: 2.8, color: h.color });
  }
}

    breathTimer = 0.10;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusHeads = !focusHeads;
  btnFocus.classList.toggle('active', focusHeads);
  btnFocus.textContent = focusHeads ? 'Corpo Inteiro' : 'Focar Cabeças';
  targetCamDist = focusHeads ? 3.55 : 10.6;
  if (focusHeads) {
    camAngle = 0.15;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.006, 2.3, 18.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.018, 2.3, 18.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO
   ========================================================================== */
let lastStepIndex = -1;

function update(dt, t) {
  let cx = 0, cz = 0, cy = 0, yaw = Math.sin(t * 0.35) * 0.14, pitch = 0.05, roll = 0;
  const breath = Math.sin(t * 2.1) * 0.028;

  cerberus.veinMatHell.emissiveIntensity = 2.8 + Math.sin(t * 5.5) * 0.9;
  cerberus.veinMatSoul.emissiveIntensity = 2.4 + Math.cos(t * 4.8) * 0.8;

  if (mode === 'investida') {
    const a = t * 1.15;
    const R = 3.05;
    cx = Math.cos(a) * R;
    cz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.24;
    roll = -0.18;

    const stride = t * 6.5;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    cy = Math.abs(cosS) * 0.08;

    const currentStep = Math.floor(stride / Math.PI);
    if (currentStep !== lastStepIndex) {
      lastStepIndex = currentStep;
      spawnGroundTrail(cx, cz);
      spawnHellBurst(cx, 0.15, cz, 8);
      quakeShake = Math.max(quakeShake, 0.08);
    }

    cerberus.legs.L.hip.rotation.x = -0.22 + sinS * 0.48;
    cerberus.legs.L.knee.rotation.x = 0.28 + Math.max(0, -cosS) * 0.52;
    cerberus.legs.L.ankle.rotation.x = -0.06 - sinS * 0.22;

    cerberus.legs.R.hip.rotation.x = -0.22 - sinS * 0.48;
    cerberus.legs.R.knee.rotation.x = 0.28 + Math.max(0, cosS) * 0.52;
    cerberus.legs.R.ankle.rotation.x = -0.06 + sinS * 0.22;

    cerberus.rightArm.arm.rotation.set(-0.75 - sinS * 0.35, 0.25, 0.52);
    cerberus.rightArm.elbow.rotation.set(-0.68, 0.15, 0.2);
    cerberus.leftArm.arm.rotation.set(-0.75 + sinS * 0.35, -0.25, -0.52);
    cerberus.leftArm.elbow.rotation.set(-0.68, -0.15, -0.2);
  } else if (mode === 'rugido') {
    pitch = -0.15 + Math.sin(t * 18) * 0.015;
    cy = -0.04;
    cerberus.legs.L.hip.rotation.x = -0.24;
    cerberus.legs.L.knee.rotation.x = 0.34;
    cerberus.legs.L.ankle.rotation.x = -0.10;
    cerberus.legs.R.hip.rotation.x = 0.12;
    cerberus.legs.R.knee.rotation.x = 0.28;
    cerberus.legs.R.ankle.rotation.x = -0.10;

    cerberus.rightArm.arm.rotation.set(-0.35, 0.25, 1.48 + Math.sin(t * 3.2) * 0.08);
    cerberus.rightArm.elbow.rotation.set(-0.45, 0.2, 0.25);
    cerberus.leftArm.arm.rotation.set(-0.35, -0.25, -1.48 - Math.sin(t * 3.2) * 0.08);
    cerberus.leftArm.elbow.rotation.set(-0.45, -0.2, -0.25);

    roarTimer -= dt;
    if (roarTimer <= 0) {
      roarTimer = 1.35;
      triggerTripleRoar(cx, cz);
      quakeShake = 0.28;
    }
  } else if (mode === 'baforada') {
    pitch = 0.20;
    cy = -0.03;
    cerberus.legs.L.hip.rotation.x = -0.24;
    cerberus.legs.L.knee.rotation.x = 0.32;
    cerberus.legs.L.ankle.rotation.x = -0.08;
    cerberus.legs.R.hip.rotation.x = 0.14;
    cerberus.legs.R.knee.rotation.x = 0.26;
    cerberus.legs.R.ankle.rotation.x = -0.08;

    cerberus.rightArm.arm.rotation.set(-0.65, 0.2, 0.72 + Math.sin(t * 6) * 0.05);
    cerberus.rightArm.elbow.rotation.set(-0.75, 0.15, 0.2);
    cerberus.leftArm.arm.rotation.set(-0.65, -0.2, -0.72 - Math.sin(t * 6) * 0.05);
    cerberus.leftArm.elbow.rotation.set(-0.75, -0.15, -0.2);

    breathTimer -= dt;
    if (breathTimer <= 0) {
      breathTimer = 0.55;
      fireTripleHellBreath(yaw);
    }
  } else {
    cy = 0;
    const kneeFlex = Math.sin(t * 2.1) * 0.035;
    cerberus.legs.L.hip.rotation.x = -0.18 - kneeFlex;
    cerberus.legs.L.knee.rotation.x = 0.24 + kneeFlex * 1.8;
    cerberus.legs.L.ankle.rotation.x = -0.06 - kneeFlex * 0.8;

    cerberus.legs.R.hip.rotation.x = 0.16 - kneeFlex;
    cerberus.legs.R.knee.rotation.x = 0.20 + kneeFlex * 1.8;
    cerberus.legs.R.ankle.rotation.x = -0.06 - kneeFlex * 0.8;

    cerberus.rightArm.arm.rotation.set(-0.26, 0.2, 0.54 + Math.sin(t * 2.1) * 0.045);
    cerberus.rightArm.elbow.rotation.set(-0.64 - Math.cos(t * 2.1) * 0.05, 0.2, 0.2);
    cerberus.leftArm.arm.rotation.set(-0.26, -0.2, -0.54 - Math.sin(t * 2.1) * 0.045);
    cerberus.leftArm.elbow.rotation.set(-0.64 - Math.cos(t * 2.1) * 0.05, -0.2, -0.2);
  }

  cerberus.titanRoot.position.set(cx, cy, cz);
  cerberus.titanRoot.rotation.set(0, yaw, 0);
  cerberus.body.position.y = 1.32 + breath * 0.6;
  cerberus.body.rotation.set(pitch, 0, roll);

  const jawOpenBoost = (mode === 'rugido' || mode === 'baforada') ? 0.42 : 0.08;

  cerberus.neckCenter.rotation.y = Math.sin(t * 1.1) * 0.14;
  cerberus.neckCenter.rotation.x = (mode === 'rugido' ? -0.35 : 0.06) + Math.sin(t * 2.2) * 0.05;
  cerberus.headCenterObj.jawPivot.rotation.x = jawOpenBoost + Math.max(0, Math.sin(t * 3.4)) * 0.22;

  cerberus.neckLeft.rotation.y = 0.34 + Math.cos(t * 1.45) * 0.18;
  cerberus.neckLeft.rotation.x = (mode === 'rugido' ? -0.28 : 0.08) + Math.cos(t * 2.5) * 0.06;
  cerberus.headLeftObj.jawPivot.rotation.x = jawOpenBoost + Math.max(0, Math.cos(t * 4.1 + 1.0)) * 0.24;

  cerberus.neckRight.rotation.y = -0.34 + Math.sin(t * 1.35 + 2.0) * 0.18;
  cerberus.neckRight.rotation.x = (mode === 'rugido' ? -0.28 : 0.08) + Math.sin(t * 2.4 + 1.0) * 0.06;
  cerberus.headRightObj.jawPivot.rotation.x = jawOpenBoost + Math.max(0, Math.sin(t * 3.8 + 2.2)) * 0.24;

  const tailSpeed = (mode === 'investida' || mode === 'rugido') ? 5.2 : 3.2;
  for (const ts of cerberus.tailSegments) {
    ts.pivot.rotation.y = Math.sin(t * tailSpeed - ts.phase) * 0.28;
    ts.pivot.rotation.x = Math.cos(t * (tailSpeed * 0.8) - ts.phase) * 0.11;
  }

  cerberus.headCenterObj.throatGlow.getWorldPosition(tmpV);
  mawLight.position.copy(tmpV);
  mawLight.intensity = 2.6 + jawOpenBoost * 4.0 + Math.sin(t * 14) * 0.4;

  for (let i = roarRings.length - 1; i >= 0; i--) {
    const rr = roarRings[i];
    if (rr.delay > 0) { rr.delay -= dt; continue; }
    rr.life -= dt;
    const k = Math.max(0, rr.life / rr.max);
    rr.mesh.scale.setScalar(1 + (1 - k) * 9.5);
    rr.mesh.material.opacity = 0.94 * k;
    if (rr.life <= 0) {
      scene.remove(rr.mesh);
      rr.mesh.geometry.dispose();
      rr.mesh.material.dispose();
      roarRings.splice(i, 1);
    }
  }

  for (let i = fireOrbs.length - 1; i >= 0; i--) {
    const fo = fireOrbs[i];
    fo.progress += dt * fo.speed;
    const p = Math.min(1, fo.progress);
    fo.mesh.position.lerpVectors(fo.start, fo.target, p);
    fo.mesh.scale.setScalar(1 + p * 0.8);

    if (p >= 1) {
      spawnHellBurst(fo.target.x, 0.2, fo.target.z, 18);
      blastLight.position.set(fo.target.x, 1.0, fo.target.z);
      blastLight.intensity = 9.5;
      scene.remove(fo.mesh);
      fo.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      fireOrbs.splice(i, 1);
    }
  }

  for (let i = groundTrails.length - 1; i >= 0; i--) {
    const gt = groundTrails[i];
    gt.life -= dt;
    const k = Math.max(0, gt.life / gt.max);
    gt.mesh.scale.setScalar(1 + (1 - k) * 2.5);
    gt.mesh.material.opacity = 0.75 * k;
    if (gt.life <= 0) {
      scene.remove(gt.mesh);
      gt.mesh.geometry.dispose();
      gt.mesh.material.dispose();
      groundTrails.splice(i, 1);
    }
  }

  for (const mf of monolithFlames) {
    mf.mesh.scale.set(1 + Math.sin(t * 10 + mf.phase) * 0.14, 1 + Math.cos(t * 12 + mf.phase) * 0.22, 1);
  }

  const infernoTarget = (mode === 'rugido' || mode === 'baforada') ? 1 : 0;
  infernoWeight = T.MathUtils.damp(infernoWeight, infernoTarget, 2.8, dt);
  scene.background.lerpColors(abyssBg, infernoBg, infernoWeight);
  scene.fog.color.copy(scene.background);

  hellRuneRing.rotation.z += dt * 0.22;
  abyssMistRing.rotation.z -= dt * 0.12;
  abyssMistRing.position.set(cx, 0.012, cz);
  shadowBlob.position.set(cx, 0.015, cz);
  const shScale = Math.max(1.6, 2.55 - cy * 0.35);
  shadowBlob.scale.set(shScale, shScale, 1);

  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 15);
  updateEmbers(dt, t);

  quakeShake = Math.max(0, quakeShake - dt * 0.55);
  const shakeX = (Math.random() - 0.5) * quakeShake;
  const shakeY = (Math.random() - 0.5) * quakeShake;

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusHeads && mode !== 'investida') camAngle += dt * 0.05;

  const desiredTarget = focusHeads
    ? new T.Vector3(cx, 3.88 + cy + breath, cz + 0.15)
    : new T.Vector3(0, 2.38, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist + shakeX,
    currentLookAt.y + vertDist + shakeY,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
