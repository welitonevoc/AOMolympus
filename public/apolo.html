<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apolo - Deus do Sol e da Luz | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #facc15;
      --amber: #f59e0b;
      --solar: #fef08a;
      --glass: rgba(24, 18, 8, 0.78);
      --border: rgba(250, 204, 21, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140f05;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #fefce8;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #fde047;
      transform: translateY(-1px);
      background: rgba(46, 34, 12, 0.92);
    }
    button.on {
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
      color: #1c1304;
      border-color: #fef9c3;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.6);
    }
    button.cam-btn {
      border-color: rgba(251, 191, 36, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #d97706 0%, #92400e 100%);
      color: #ffffff;
      border-color: #fde68a;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fde047;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 960px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 15, 6, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(250, 204, 21, 0.32);
      padding: 7px 16px;
      border-radius: 999px;
      color: #fef9c3;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="pairar" class="on">Pairar Solar</button>
    <button data-m="voo">Voo Radiante</button>
    <button data-m="flecha">Flecha Solar</button>
    <button data-m="helio">Chama de Hélio</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Olympus • Apolo</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE SOLAR, TÚNICA GREGA E MOSAICO DE DELFOS)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map suave da pele
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5200; i++) {
    const v = 123 + Math.floor(Math.random() * 12);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Himation Branco Solar com Meandro Grego Dourado e Âmbar
  const tunicCanvas = document.createElement('canvas');
  tunicCanvas.width = 512;
  tunicCanvas.height = 256;
  const tCtx = tunicCanvas.getContext('2d');
  const grad = tCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#fffbeb');
  grad.addColorStop(0.68, '#fef3c7');
  grad.addColorStop(1, '#fde68a');
  tCtx.fillStyle = grad;
  tCtx.fillRect(0, 0, 512, 256);

  // Trama de pregas finas de tecido nobre
  tCtx.fillStyle = 'rgba(217, 119, 6, 0.12)';
  for (let x = 0; x < 512; x += 9) tCtx.fillRect(x, 0, 3, 256);

  // Faixa Âmbar-Solar e Ouro com Meandro Grego
  tCtx.fillStyle = '#b45309';
  tCtx.fillRect(0, 198, 512, 40);
  tCtx.fillStyle = '#facc15';
  tCtx.fillRect(0, 194, 512, 5);
  tCtx.fillRect(0, 238, 512, 5);

  tCtx.strokeStyle = '#fef08a';
  tCtx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    tCtx.beginPath();
    tCtx.moveTo(x + 4, 230);
    tCtx.lineTo(x + 4, 206);
    tCtx.lineTo(x + 24, 206);
    tCtx.lineTo(x + 24, 224);
    tCtx.lineTo(x + 12, 224);
    tCtx.lineTo(x + 12, 214);
    tCtx.lineTo(x + 18, 214);
    tCtx.stroke();
  }
  const tunicTex = new T.CanvasTexture(tunicCanvas);
  tunicTex.wrapS = tunicTex.wrapT = T.RepeatWrapping;

  // 1.3 Piso do Santuário de Delfos: Mármore Branco com Sol Dourado e Anéis Astrológicos
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#fafaf9';
  fCtx.fillRect(0, 0, 1024, 1024);

  // Veios sutis de mármore claro
  fCtx.strokeStyle = 'rgba(180, 165, 145, 0.25)';
  fCtx.lineWidth = 2;
  for (let i = 0; i < 42; i++) {
    fCtx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    fCtx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      fCtx.lineTo(mx, my);
    }
    fCtx.stroke();
  }

  const cx = 512, cy = 512;
  // Anéis astrológicos externos em Ouro e Âmbar
  fCtx.strokeStyle = '#d97706';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 430, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#facc15';
  fCtx.lineWidth = 6;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 446, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 414, 0, Math.PI * 2);
  fCtx.stroke();

  // Divisões astrológicas de 12 casas
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    fCtx.strokeStyle = 'rgba(217, 119, 6, 0.45)';
    fCtx.lineWidth = 3;
    fCtx.beginPath();
    fCtx.moveTo(cx + Math.cos(a) * 260, cy + Math.sin(a) * 260);
    fCtx.lineTo(cx + Math.cos(a) * 414, cy + Math.sin(a) * 414);
    fCtx.stroke();
  }

  // Grande Sol Dourado de 16 raios flamejantes no centro de Delfos
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const isMajor = i % 2 === 0;
    const tipR = isMajor ? 255 : 195;
    const halfW = isMajor ? 0.14 : 0.10;

    fCtx.fillStyle = isMajor ? '#eab308' : '#f59e0b';
    fCtx.beginPath();
    fCtx.moveTo(cx, cy);
    fCtx.lineTo(cx + Math.cos(a - halfW) * 90, cy + Math.sin(a - halfW) * 90);
    fCtx.lineTo(cx + Math.cos(a) * tipR, cy + Math.sin(a) * tipR);
    fCtx.lineTo(cx + Math.cos(a + halfW) * 90, cy + Math.sin(a + halfW) * 90);
    fCtx.closePath();
    fCtx.fill();
    fCtx.strokeStyle = '#fef08a';
    fCtx.lineWidth = 2.5;
    fCtx.stroke();
  }

  // Disco solar central
  fCtx.fillStyle = '#facc15';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 78, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = '#b45309';
  fCtx.lineWidth = 6;
  fCtx.stroke();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, tunicTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ANATÔMICA E MATERIAIS SOLARES
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xdca478,          // Pele mediterrânea dourada radiante
      roughness: 0.36,
      metalness: 0.06,
      bumpMap: textures.skinBump,
      bumpScale: 0.0028
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0xc5895e,
      roughness: 0.40,
      metalness: 0.06,
      bumpMap: textures.skinBump,
      bumpScale: 0.0028
    }),
    hairSunGold: new T.MeshStandardMaterial({
      color: 0xfacc15,          // Cachos dourado-sol vibrantes
      emissive: 0x451a03,
      emissiveIntensity: 0.25,
      roughness: 0.34,
      metalness: 0.22
    }),
    hairAmberCurl: new T.MeshStandardMaterial({
      color: 0xf59e0b,          // Mechas âmbar-douradas profundas
      emissive: 0x3b1502,
      emissiveIntensity: 0.22,
      roughness: 0.36,
      metalness: 0.2
    }),
    goldPolished: new T.MeshStandardMaterial({
      color: 0xfde047,
      emissive: 0x713f12,
      emissiveIntensity: 0.3,
      metalness: 0.94,
      roughness: 0.16
    }),
    amberBronze: new T.MeshStandardMaterial({
      color: 0xd97706,
      emissive: 0x3b1803,
      emissiveIntensity: 0.24,
      metalness: 0.88,
      roughness: 0.22
    }),
    solarCore: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfef08a,
      emissiveIntensity: 3.8,
      roughness: 0.08
    }),
    ivoryGrip: new T.MeshStandardMaterial({
      color: 0xfefce8,
      roughness: 0.35,
      metalness: 0.08
    }),
    cedarWood: new T.MeshStandardMaterial({
      color: 0x7c2d12,
      emissive: 0x290c04,
      emissiveIntensity: 0.2,
      roughness: 0.42,
      metalness: 0.14
    }),
    amberGem: new T.MeshStandardMaterial({
      color: 0xf59e0b,
      emissive: 0xd97706,
      emissiveIntensity: 2.8,
      roughness: 0.1,
      metalness: 0.25
    }),
    solarRayMat: new T.MeshBasicMaterial({
      color: 0xfde047,
      transparent: true,
      opacity: 0.88,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    }),
    eyeSolarGold: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfacc15,       // Olhos dourados incandescentes
      emissiveIntensity: 3.6,
      roughness: 0.06
    }),
    tunic: new T.MeshStandardMaterial({
      map: textures.tunicTex,
      color: 0xffffff,
      roughness: 0.52,
      metalness: 0.05,
      side: T.DoubleSide
    }),
    scarletSolarCloak: new T.MeshStandardMaterial({
      color: 0xb91c1c,          // Manto escarlate-solar com reflexo âmbar
      emissive: 0x450a0a,
      emissiveIntensity: 0.35,
      roughness: 0.48,
      metalness: 0.14,
      side: T.DoubleSide
    }),
    featherWhite: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfef08a,
      emissiveIntensity: 0.35,
      roughness: 0.4
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE APOLO + AURÉOLA SOLAR + ARCO RECURVO + LIRA (KITHARA)
   ========================================================================== */
function buildApollo(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.12, 0);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS ATLÉTICAS (SANDÁLIAS SOLARES DOURADAS)
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.23, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.08, 0.78, 0.82]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.145, -0.04, 0);

    // Coxa esguia e atlética
    sculpt(hip, new T.CylinderGeometry(0.135, 0.095, 0.50, 20), M.skin, [0, -0.24, 0], [0, 0, 0], [1.02, 1, 1.06]);
    sculpt(hip, new T.SphereGeometry(0.105, 16, 16), M.skin, [s * 0.018, -0.21, 0.045], [0, 0, 0], [0.94, 1.82, 0.86]);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.084, 16, 16), M.skin, [0, -0.50, 0.014]);

    // Canela, Panturrilha e Grevas Douradas Solares
    const knee = group(hip, 0, -0.51, 0);
    sculpt(knee, new T.CylinderGeometry(0.085, 0.052, 0.46, 18), M.skin, [0, -0.23, 0]);
    sculpt(knee, new T.SphereGeometry(0.08, 16, 16), M.skin, [0, -0.15, -0.035], [0, 0, 0], [0.96, 1.65, 0.95]);
    sculpt(knee, new T.CylinderGeometry(0.082, 0.055, 0.32, 16, 1, false, -0.82, 1.64), M.goldPolished, [0, -0.24, 0.008]);

    // Pé e Sandália Solar
    const ankle = group(knee, 0, -0.46, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.088, 0.046, 0.21), M.skin, [0, -0.02, 0.038], [0.22, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.096, 0.015, 0.224), M.goldPolished, [0, -0.044, 0.038], [0.22, 0, 0]);

    const strap = new T.TorusGeometry(0.058, 0.0055, 8, 20);
    strap.rotateX(Math.PI / 2);
    for (let k = 0; k < 3; k++) {
      sculpt(ankle, strap, M.goldPolished, [0, 0.02 + k * 0.042, -0.02], [0.1, 0, 0]);
    }
    legs[side] = { hip, knee, ankle };
  }

  // Postura clássica de arqueiro celeste pairando
  legs.L.hip.rotation.set(-0.34, -0.08, -0.05);
  legs.L.knee.rotation.set(0.48, 0, 0);
  legs.R.hip.rotation.set(0.22, 0.08, 0.05);
  legs.R.knee.rotation.set(0.24, 0, 0);

  // ------------------------------------------------------------------------
  // B. TRONCO APOLÍNEO (PEITORAIS, ABDÔMEN 6-PACK, TRAPÉZIO E PESCOÇO)
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.32, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.43),
    new T.Vector2(0.235, -0.39),
    new T.Vector2(0.205, -0.19),
    new T.Vector2(0.255, 0.03),
    new T.Vector2(0.36, 0.26),
    new T.Vector2(0.32, 0.42),
    new T.Vector2(0.14, 0.49),
    new T.Vector2(0.01, 0.50)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.15, 1.02, 0.72]);

  // Peitorais bem definidos
  const pecGeo = new T.SphereGeometry(0.20, 22, 22);
  sculpt(torso, pecGeo, M.skin, [-0.17, 0.22, 0.155], [0.12, -0.22, -0.14], [1.04, 0.85, 0.56]);
  sculpt(torso, pecGeo, M.skin, [0.17, 0.22, 0.155], [0.12, 0.22, 0.14], [1.04, 0.85, 0.56]);

  // Abdômen esculpido (6-pack)
  const abGeo = new T.SphereGeometry(0.08, 14, 14);
  [
    { y: 0.04, sx: 0.96, sy: 0.75, z: 0.196 },
    { y: -0.075, sx: 0.92, sy: 0.78, z: 0.192 },
    { y: -0.19, sx: 0.84, sy: 0.84, z: 0.182 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.066, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.46]);
    sculpt(torso, abGeo, M.skin, [0.066, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.46]);
  });

  // Oblíquos, Dorsais e Pescoço
  const obliqueGeo = new T.CapsuleGeometry(0.072, 0.22, 10, 14);
  sculpt(torso, obliqueGeo, M.skin, [-0.225, -0.11, 0.08], [0.1, 0, -0.18], [0.85, 1, 0.85]);
  sculpt(torso, obliqueGeo, M.skin, [0.225, -0.11, 0.08], [0.1, 0, 0.18], [0.85, 1, 0.85]);

  const latGeo = new T.SphereGeometry(0.22, 18, 18);
  sculpt(torso, latGeo, M.skin, [-0.195, 0.17, -0.11], [0, 0, -0.25], [1.0, 1.32, 0.64]);
  sculpt(torso, latGeo, M.skin, [0.195, 0.17, -0.11], [0, 0, 0.25], [1.0, 1.32, 0.64]);

  sculpt(torso, new T.CylinderGeometry(0.112, 0.142, 0.25, 20), M.skin, [0, 0.52, -0.008], [0.07, 0, 0]);

  // ------------------------------------------------------------------------
  // C. ROSTO CLÁSSICO SERENO (SEM BARBA) + CACHOS DOURADOS + AURÉOLA SOLAR
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.73, 0.032);

  // Crânio clássico harmônico (sem barba, feições solares nobres)
  const skullGeo = new T.SphereGeometry(0.192, 38, 38);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.16;
    x *= 0.90;
    if (y < 0.02 && y > -0.08 && z > 0) { x *= 1.03; z *= 1.04; }
    if (y <= -0.08 && z > -0.02) {
      const taper = Math.max(0.66, 1.0 - ((-0.08 - y) / 0.14) * 0.32);
      x *= taper;
      z *= 1.04;
    }
    if (z < -0.11) z *= 0.93;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  // Maçãs do rosto suaves
  const cheekGeo = new T.SphereGeometry(0.044, 16, 16);
  sculpt(head, cheekGeo, M.skin, [-0.066, -0.015, 0.148], [0, -0.3, 0], [1.08, 0.85, 0.64]);
  sculpt(head, cheekGeo, M.skin, [0.066, -0.015, 0.148], [0, 0.3, 0], [1.08, 0.85, 0.64]);

  // Nariz grego reto e perfeito
  sculpt(head, new T.BoxGeometry(0.022, 0.078, 0.042), M.skin, [0, 0.004, 0.184], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.016, 14, 14), M.skin, [0, -0.034, 0.198], [0, 0, 0], [0.94, 0.82, 0.98]);

  // Sobrancelhas dourado-âmbar arqueadas e serenas
  const browGeo = new T.CapsuleGeometry(0.008, 0.056, 8, 12);
  sculpt(head, browGeo, M.hairAmberCurl, [-0.052, 0.048, 0.178], [0.1, 0.25, 1.40]);
  sculpt(head, browGeo, M.hairAmberCurl, [0.052, 0.048, 0.178], [0.1, -0.25, -1.40]);

  // Olhos Dourados Incandescentes (luz solar nos olhos)
  const eyeGeo = new T.SphereGeometry(0.019, 16, 16);
  sculpt(head, eyeGeo, M.eyeSolarGold, [-0.052, 0.022, 0.172], [0, 0, 0], [1.15, 0.76, 0.8]);
  sculpt(head, eyeGeo, M.eyeSolarGold, [0.052, 0.022, 0.172], [0, 0, 0], [1.15, 0.76, 0.8]);

  // Lábios esculpidos serenos
  sculpt(head, new T.CapsuleGeometry(0.009, 0.036, 8, 12), M.skinShade, [0, -0.078, 0.184], [0, 0, Math.PI / 2], [1, 1, 0.75]);

  // Cabeleira de Cachos Dourado-Sol Volumosos + Coroa de Louros Dourada
  const hairCurls = [];
  sculpt(head, new T.SphereGeometry(0.198, 24, 24), M.hairSunGold, [0, 0.042, -0.018], [-0.08, 0, 0], [1.03, 1.03, 1.07]);

  for (let i = 0; i < 28; i++) {
    const ang = (i / 28) * Math.PI * 2;
    const isFront = Math.cos(ang) > 0.35;
    const rad = isFront ? 0.178 : 0.196;
    const cx = Math.sin(ang) * rad;
    const cz = Math.cos(ang) * rad - 0.01;
    const cy = isFront ? 0.076 : (0.03 - (i % 4) * 0.045);
    const curlSize = isFront ? 0.034 : (0.048 + (i % 2) * 0.012);

    const curl = sculpt(
      head,
      new T.SphereGeometry(curlSize, 12, 12),
      i % 2 === 0 ? M.hairSunGold : M.hairAmberCurl,
      [cx, cy, cz],
      [0.2, ang, 0],
      [1.05, 1.25, 0.95]
    );
    hairCurls.push({ mesh: curl, baseY: cy, phase: i * 0.5 });
  }

  // Coroa de Louros Dourada Brilhante
  const laurelCrown = group(head, 0, 0.105, 0.012);
  laurelCrown.rotation.x = 0.22;
  const circlet = new T.TorusGeometry(0.196, 0.009, 10, 36, Math.PI * 1.7);
  circlet.rotateX(Math.PI / 2);
  circlet.rotateY(-Math.PI * 0.35);
  sculpt(laurelCrown, circlet, M.goldPolished, [0, 0, 0], [0, 0, 0], [0.96, 1, 1.05]);

  const leafGeo = new T.SphereGeometry(0.025, 10, 10);
  leafGeo.scale(0.55, 1.45, 0.22);
  for (const side of [-1, 1]) {
    for (let i = 0; i < 8; i++) {
      const t = i / 7;
      const ang = side * (0.28 + t * 2.2);
      sculpt(
        laurelCrown,
        leafGeo,
        M.goldPolished,
        [Math.sin(ang) * 0.192, (1 - t) * 0.014, Math.cos(ang) * 0.206],
        [0.3, ang, side * -0.55]
      );
    }
  }

  // AURÉOLA SOLAR RADIANTE ATRÁS DA CABEÇA (DISCO DE LUZ + 16 RAIOS DOURADOS)
  const solarHaloGroup = group(head, 0, 0.05, -0.22);
  const haloInnerRing = new T.Mesh(
    new T.TorusGeometry(0.34, 0.012, 8, 48),
    new T.MeshBasicMaterial({
      color: 0xfde047,
      transparent: true,
      opacity: 0.85,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  const haloOuterRing = new T.Mesh(
    new T.TorusGeometry(0.46, 0.008, 8, 48),
    new T.MeshBasicMaterial({
      color: 0xf59e0b,
      transparent: true,
      opacity: 0.65,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  solarHaloGroup.add(haloInnerRing, haloOuterRing);

  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const isMajor = i % 2 === 0;
    const rayLen = isMajor ? 0.36 : 0.24;
    const rayMid = 0.36 + rayLen * 0.5;
    const rayMesh = new T.Mesh(
      new T.ConeGeometry(isMajor ? 0.026 : 0.016, rayLen, 4),
      M.solarRayMat
    );
    rayMesh.position.set(Math.cos(a) * rayMid, Math.sin(a) * rayMid, 0);
    rayMesh.rotation.z = a - Math.PI / 2;
    rayMesh.scale.z = 0.2;
    solarHaloGroup.add(rayMesh);
  }

  // ------------------------------------------------------------------------
  // D. BRAÇOS ATLÉTICOS E BRACELETES SOLARES DOURADOS
  // ------------------------------------------------------------------------
  function createApolloArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.40, 0.33, -0.008);

    sculpt(arm, new T.SphereGeometry(0.128, 18, 18), M.skin, [0, 0, 0], [0, 0, s * -0.22], [1.04, 1.12, 1.04]);
    sculpt(arm, new T.CapsuleGeometry(0.082, 0.26, 12, 16), M.skin, [s * 0.02, -0.17, 0], [0, 0, s * 0.07]);
    sculpt(arm, new T.SphereGeometry(0.076, 14, 14), M.skin, [s * 0.015, -0.16, 0.038], [0, 0, s * 0.07], [0.92, 1.42, 0.92]);

    const elbow = group(arm, s * 0.038, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.076, 0.050, 0.31, 18), M.skin, [0, -0.15, 0]);

    // Bracelete Dourado Solar com Gema Âmbar
    const bracer = group(elbow, 0, -0.24, 0);
    sculpt(bracer, new T.CylinderGeometry(0.06, 0.054, 0.085, 24, 1, true), M.goldPolished);
    const bRing = new T.TorusGeometry(0.058, 0.0055, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.amberBronze, [0, 0.04, 0]);
    sculpt(bracer, bRing, M.amberBronze, [0, -0.04, 0]);
    sculpt(bracer, new T.OctahedronGeometry(0.018, 0), M.amberGem, [s * 0.06, 0, 0]);

    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.066, 0.076, 0.032), M.skin, [0, -0.018, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.009, 0.036, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.0155;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.058, 0.016], [1.1, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.035, -0.028, 0.02], [0.55, 0, -s * 0.6], [1.05, 0.9, 1.05]);

    return { arm, elbow, hand };
  }

  const rightArm = createApolloArm(true);
  const leftArm = createApolloArm(false);

  // ------------------------------------------------------------------------
  // E. ARCO SOLAR RECURVO DUPLO (NA MÃO ESQUERDA) + FLECHA DE LUZ (MÃO DIREITA)
  // ------------------------------------------------------------------------
  const solarBow = new T.Group();
  leftArm.hand.add(solarBow);
  solarBow.position.set(0, -0.04, 0.045);

  const bowStringNockY = 0.86;
  const bowStringNockZ = -0.175;

  for (const dirY of [-1, 1]) {
    const limbPts = [
      new T.Vector3(0, dirY * 0.10, 0.01),
      new T.Vector3(0, dirY * 0.28, 0.035),
      new T.Vector3(0, dirY * 0.48, 0.005),
      new T.Vector3(0, dirY * 0.68, -0.095),
      new T.Vector3(0, dirY * 0.82, -0.185),
      new T.Vector3(0, dirY * 0.94, -0.135)
    ];
    const limbCurve = new T.CatmullRomCurve3(limbPts);

    sculpt(solarBow, new T.TubeGeometry(limbCurve, 28, 0.018, 10, false), M.goldPolished);

    const innerPts = [
      new T.Vector3(0, dirY * 0.13, 0.025),
      new T.Vector3(0, dirY * 0.34, 0.052),
      new T.Vector3(0, dirY * 0.56, 0.015),
      new T.Vector3(0, dirY * 0.74, -0.085)
    ];
    sculpt(solarBow, new T.TubeGeometry(new T.CatmullRomCurve3(innerPts), 20, 0.011, 8, false), M.amberBronze);

    sculpt(
      solarBow,
      new T.ConeGeometry(0.018, 0.14, 4),
      M.goldPolished,
      [0, dirY * 0.46, 0.055],
      [dirY * 0.95, 0, 0],
      [0.35, 1, 1]
    );

    const nockPos = [0, dirY * bowStringNockY, bowStringNockZ];
    sculpt(solarBow, new T.SphereGeometry(0.018, 12, 12), M.ivoryGrip, nockPos);
    const nockCollar = new T.TorusGeometry(0.019, 0.0045, 8, 16);
    nockCollar.rotateX(Math.PI / 2);
    sculpt(solarBow, nockCollar, M.goldPolished, [0, dirY * (bowStringNockY - 0.015), bowStringNockZ + 0.005]);

    sculpt(
      solarBow,
      new T.ConeGeometry(0.016, 0.11, 5),
      M.goldPolished,
      [0, dirY * 0.96, -0.115],
      [dirY * 0.42, 0, 0],
      [0.45, 1, 1]
    );
  }

  // Empunhadura
  sculpt(solarBow, new T.CylinderGeometry(0.025, 0.025, 0.22, 16), M.ivoryGrip, [0, 0, 0.01]);
  for (const gy of [-0.11, -0.055, 0.055, 0.11]) {
    const gripRing = new T.TorusGeometry(0.027, 0.0055, 8, 20);
    gripRing.rotateX(Math.PI / 2);
    sculpt(solarBow, gripRing, M.goldPolished, [0, gy, 0.01]);
  }
  sculpt(solarBow, new T.CylinderGeometry(0.036, 0.036, 0.018, 16), M.goldPolished, [0, 0, 0.036], [Math.PI / 2, 0, 0], [0.85, 1, 1.35]);
  sculpt(solarBow, new T.OctahedronGeometry(0.02, 0), M.amberGem, [0, 0, 0.046], [0, 0, 0], [0.8, 1.3, 0.6]);

  const stringGeo = new T.BufferGeometry().setFromPoints([
    new T.Vector3(0, bowStringNockY, bowStringNockZ),
    new T.Vector3(0, 0, bowStringNockZ),
    new T.Vector3(0, -bowStringNockY, bowStringNockZ)
  ]);
  const bowString = new T.Line(
    stringGeo,
    new T.LineBasicMaterial({ color: 0xfef08a, linewidth: 2 })
  );
  solarBow.add(bowString);

  // Flecha engatada
  const nockedArrow = new T.Group();
  rightArm.hand.add(nockedArrow);
  nockedArrow.position.set(0, -0.04, 0.035);
  nockedArrow.rotation.set(Math.PI / 2, 0, 0);

  sculpt(nockedArrow, new T.CylinderGeometry(0.009, 0.009, 1.18, 8), M.solarCore, [0, 0.36, 0]);
  sculpt(nockedArrow, new T.ConeGeometry(0.034, 0.17, 4), M.goldPolished, [0, 0.98, 0], [0, 0, 0], [1.0, 1.0, 0.26]);
  sculpt(nockedArrow, new T.BoxGeometry(0.01, 0.12, 0.018), M.solarCore, [0, 0.94, 0]);
  sculpt(nockedArrow, new T.BoxGeometry(0.058, 0.13, 0.006), M.featherWhite, [0, -0.17, 0]);
  sculpt(nockedArrow, new T.BoxGeometry(0.006, 0.13, 0.058), M.featherWhite, [0, -0.17, 0]);

  const arrowAnchor = group(nockedArrow, 0, 1.02, 0);
  const arrowGlow = new T.Mesh(
    new T.SphereGeometry(0.12, 12, 10),
    new T.MeshBasicMaterial({
      color: 0xfde047,
      transparent: true,
      opacity: 0.85,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  arrowAnchor.add(arrowGlow);

  // ------------------------------------------------------------------------
  // F. ALJAVA DOURADA + LIRA DOURADA GREGA (KITHARA)
  // ------------------------------------------------------------------------
  const quiver = group(torso, -0.12, 0.18, -0.22);
  quiver.rotation.set(0.18, 0.1, -0.45);
  sculpt(quiver, new T.CylinderGeometry(0.075, 0.055, 0.68, 16), M.amberBronze);
  sculpt(quiver, new T.TorusGeometry(0.076, 0.01, 8, 20), M.goldPolished, [0, 0.33, 0], [Math.PI / 2, 0, 0]);
  sculpt(quiver, new T.TorusGeometry(0.066, 0.008, 8, 20), M.goldPolished, [0, 0.05, 0], [Math.PI / 2, 0, 0]);

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const fx = Math.cos(a) * 0.032;
    const fz = Math.sin(a) * 0.032;
    sculpt(quiver, new T.CylinderGeometry(0.008, 0.008, 0.25, 6), M.solarCore, [fx, 0.42, fz]);
    sculpt(quiver, new T.BoxGeometry(0.036, 0.08, 0.005), M.featherWhite, [fx, 0.50, fz], [0, a, 0]);
  }

  // Lira Kithara flutuante
  const lyreOrbitGroup = new T.Group();
  root.add(lyreOrbitGroup);

  const lyre = new T.Group();
  lyreOrbitGroup.add(lyre);

  const soundboxShape = new T.Shape();
  soundboxShape.moveTo(-0.125, -0.24);
  soundboxShape.lineTo(0.125, -0.24);
  soundboxShape.lineTo(0.165, -0.05);
  soundboxShape.lineTo(-0.165, -0.05);
  soundboxShape.closePath();

  const soundboxGeo = new T.ExtrudeGeometry(soundboxShape, {
    depth: 0.054,
    bevelEnabled: true,
    bevelThickness: 0.008,
    bevelSize: 0.008,
    bevelSegments: 3
  });
  soundboxGeo.center();
  sculpt(lyre, soundboxGeo, M.cedarWood, [0, -0.145, 0]);

  sculpt(lyre, new T.BoxGeometry(0.35, 0.022, 0.076), M.goldPolished, [0, -0.045, 0]);
  sculpt(lyre, new T.BoxGeometry(0.27, 0.026, 0.078), M.goldPolished, [0, -0.245, 0]);
  sculpt(lyre, new T.BoxGeometry(0.18, 0.024, 0.068), M.amberBronze, [0, -0.268, 0]);

  for (const zSide of [-1, 1]) {
    const zFace = zSide * 0.036;
    sculpt(lyre, new T.TorusGeometry(0.042, 0.006, 8, 24), M.goldPolished, [0, -0.142, zFace]);
    sculpt(lyre, new T.CylinderGeometry(0.024, 0.024, 0.008, 16), M.amberGem, [0, -0.142, zFace], [Math.PI / 2, 0, 0]);
    for (let r = 0; r < 8; r++) {
      const ra = (r / 8) * Math.PI * 2;
      sculpt(
        lyre,
        new T.ConeGeometry(0.007, 0.024, 4),
        M.goldPolished,
        [Math.cos(ra) * 0.052, -0.142 + Math.sin(ra) * 0.052, zFace],
        [0, 0, ra - Math.PI / 2],
        [1, 1, 0.4]
      );
    }
  }

  sculpt(lyre, new T.BoxGeometry(0.21, 0.018, 0.084), M.ivoryGrip, [0, -0.195, 0]);
  sculpt(lyre, new T.BoxGeometry(0.22, 0.008, 0.086), M.goldPolished, [0, -0.204, 0]);

  for (const side of [-1, 1]) {
    const armPts = [
      new T.Vector3(side * 0.145, -0.05, 0),
      new T.Vector3(side * 0.215, 0.03, 0),
      new T.Vector3(side * 0.225, 0.13, 0),
      new T.Vector3(side * 0.165, 0.23, 0),
      new T.Vector3(side * 0.145, 0.28, 0)
    ];
    sculpt(lyre, new T.TubeGeometry(new T.CatmullRomCurve3(armPts), 24, 0.019, 10, false), M.goldPolished);

    sculpt(lyre, new T.TorusGeometry(0.023, 0.005, 8, 16), M.amberBronze, [side * 0.185, -0.01, 0], [Math.PI / 2.6, 0, 0]);
    sculpt(lyre, new T.TorusGeometry(0.022, 0.005, 8, 16), M.amberBronze, [side * 0.212, 0.15, 0], [Math.PI / 2.2, 0, 0]);

    const scrollGroup = group(lyre, side * 0.145, 0.285, 0);
    sculpt(scrollGroup, new T.TorusGeometry(0.026, 0.011, 10, 20, Math.PI * 1.45), M.goldPolished, [side * 0.015, 0.012, 0], [0, 0, side * -0.4]);
    sculpt(scrollGroup, new T.SphereGeometry(0.014, 10, 10), M.amberGem, [side * 0.015, 0.012, 0]);
  }

  const jugumY = 0.235;
  sculpt(lyre, new T.CylinderGeometry(0.016, 0.016, 0.37, 16), M.goldPolished, [0, jugumY, 0], [0, 0, Math.PI / 2]);
  sculpt(lyre, new T.CylinderGeometry(0.018, 0.018, 0.26, 16), M.ivoryGrip, [0, jugumY, 0], [0, 0, Math.PI / 2]);

  for (const side of [-1, 1]) {
    sculpt(lyre, new T.SphereGeometry(0.022, 12, 12), M.goldPolished, [side * 0.195, jugumY, 0]);
    sculpt(lyre, new T.ConeGeometry(0.016, 0.045, 8), M.amberBronze, [side * 0.22, jugumY, 0], [0, 0, side * -Math.PI / 2]);
  }

  const lyreStrings = [];
  const lyreStringMat = new T.MeshStandardMaterial({
    color: 0xfef08a,
    emissive: 0xfacc15,
    emissiveIntensity: 1.8,
    metalness: 0.9,
    roughness: 0.15
  });

  const bridgeY = -0.195;
  const stringLen = jugumY - bridgeY;
  const stringMidY = (jugumY + bridgeY) * 0.5;

  for (let s = -3; s <= 3; s++) {
    const sx = s * 0.028;
    sculpt(lyre, new T.BoxGeometry(0.011, 0.044, 0.026), M.goldPolished, [sx, jugumY + 0.012, 0], [0.25, 0, 0]);

    const strMesh = sculpt(
      lyre,
      new T.CylinderGeometry(0.0024, 0.0024, stringLen, 6),
      lyreStringMat,
      [sx, stringMidY, 0.032]
    );
    const strMeshBack = sculpt(
      lyre,
      new T.CylinderGeometry(0.0024, 0.0024, stringLen, 6),
      lyreStringMat,
      [sx, stringMidY, -0.032]
    );
    lyreStrings.push({ front: strMesh, back: strMeshBack, baseX: sx, phase: s * 0.9 });
  }

  // ------------------------------------------------------------------------
  // G. VESTIMENTA SOLAR
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  const sashCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.19, -0.36, 0.19),
    new T.Vector3(-0.23, 0.05, 0.21),
    new T.Vector3(-0.21, 0.41, 0.12),
    new T.Vector3(-0.19, 0.43, -0.12),
    new T.Vector3(-0.16, 0.05, -0.19),
    new T.Vector3(-0.13, -0.36, -0.16)
  ]);
  const sashGeo = new T.TubeGeometry(sashCurve, 28, 0.098, 12, false);
  sashGeo.scale(1.12, 1, 0.46);
  sculpt(garments, sashGeo, M.tunic);

  sculpt(garments, new T.CylinderGeometry(0.048, 0.048, 0.018, 20), M.goldPolished, [-0.21, 0.41, 0.13], [-0.35, -0.25, 0]);

  const beltGeo = new T.TorusGeometry(0.25, 0.022, 10, 32);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.goldPolished, [0, -0.34, 0.008], [0.05, 0, -0.03], [1.06, 1, 0.80]);
  sculpt(garments, new T.OctahedronGeometry(0.028, 0), M.solarCore, [0, -0.34, 0.205]);

  const skirtGeo = new T.CylinderGeometry(0.25, 0.52, 0.82, 48, 18, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.41 - y) / 0.82));
    const pleat = Math.sin(angle * 14) * 0.028 * (0.25 + normY * 0.92);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.05;
    z = Math.sin(angle) * r * 0.82 - normY * 0.08;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.tunic, [0, -0.74, 0], [0.04, 0, 0]);

  const capeGeo = new T.PlaneGeometry(1.32, 1.84, 24, 32);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.92 - y) / 1.84));
    const archZ = -0.17 - Math.cos((x / 0.66) * Math.PI * 0.5) * 0.08;
    const z = archZ - normY * 0.50;
    const fx = x * (0.62 + normY * 0.74);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.scarletSolarCloak, [0, -0.44, -0.04]);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    solarBow, bowString, bowStringNockY, bowStringNockZ,
    nockedArrow, arrowAnchor, arrowGlow,
    solarHaloGroup, hairCurls,
    lyreOrbitGroup, lyre, lyreStrings,
    skirtMesh, skirtBase,
    cape, capeBase
  };
}

/* ==========================================================================
   4. SANTUÁRIO DE DELFOS / TEMPLO SOLAR E ILUMINAÇÃO RADIANTE
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const skyNormal = new T.Color(0x38bdf8);
const skyEclipse = new T.Color(0x451a03);
scene.background = skyNormal.clone();
scene.fog = new T.FogExp2(0xfde68a, 0.015);

// Céu Solar de Delfos
const skyGeo = new T.SphereGeometry(80, 32, 32);
const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x0369a1) },
    midColor: { value: new T.Color(0x38bdf8) },
    horizonColor: { value: new T.Color(0xfef08a) },
    eclipseFactor: { value: 0.0 },
    sunDir: { value: new T.Vector3(0.45, 0.45, -0.78).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform float eclipseFactor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 dayCol = mix(horizonColor, midColor, smoothstep(0.40, 0.66, h));
      dayCol = mix(dayCol, topColor, smoothstep(0.66, 0.96, h));

      vec3 eclTop = vec3(0.08, 0.03, 0.01);
      vec3 eclMid = vec3(0.45, 0.16, 0.02);
      vec3 eclHor = vec3(0.98, 0.72, 0.12);
      vec3 eclCol = mix(eclHor, eclMid, smoothstep(0.40, 0.66, h));
      eclCol = mix(eclCol, eclTop, smoothstep(0.66, 0.96, h));

      vec3 col = mix(dayCol, eclCol, eclipseFactor);
      float sunGlow = max(dot(dir, sunDir), 0.0);

      gl_FragColor = vec4(col, 1.0);
    }
  `

    dustPos[i * 3] = x;
    dustPos[i * 3 + 1] = y;

  }

function updateDust(dt, t) {
  for (let i = 0; i < DUST_N; i++) {
    if (i < 150 && dustLife[i] < 100) {
      if (dustLife[i] <= 0) continue;
      dustLife[i] -= dt;
      dustVel[i * 3 + 1] -= 8.5 * dt;
      dustPos[i * 3] += dustVel[i * 3] * dt;
      dustPos[i * 3 + 1] += dustVel[i * 3 + 1] * dt;
      dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
      if (dustLife[i] <= 0) dustPos[i * 3 + 1] = -100;
    } else {
      dustPos[i * 3] += Math.sin(t * 1.1 + i) * 0.16 * dt;
      dustPos[i * 3 + 1] += dustVel[i * 3 + 1] * dt;
      dustPos[i * 3 + 2] += Math.cos(t * 1.1 + i) * 0.16 * dt;
      if (dustPos[i * 3 + 1] > 6.0) {
        dustPos[i * 3 + 1] = 0.1;
        dustPos[i * 3] = (Math.random() - 0.5) * 13;
        dustPos[i * 3 + 2] = (Math.random() - 0.5) * 13;
      }
    }
  }
  dustGeo.attributes.position.needsUpdate = true;
}

let camAngle = 0.42;

document.querySelectorAll('button[data-m]').forEach((b) => {

  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 2.55 : 8.5;
  if (focusFace) {
    camAngle = 0.22;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

  renderer.setSize(innerWidth, innerHeight);
});

   7. LOOP DE ANIMAÇÃO
   ========================================================================== */
function update(dt, t) {
  let ax = 0, az = 0, yaw = Math.sin(t * 0.35) * 0.18, pitch = 0.05, roll = 0;
  const hoverY = Math.sin(t * 1.65) * 0.09;

  if (mode === 'voo') {
    const a = t * 0.85;
    const R = 2.95;
    ax = Math.cos(a) * R;
    az = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.22;
    roll = -0.28;

    trailTimer -= dt;
    if (trailTimer <= 0) {
      trailTimer = 0.10;
      spawnFlightTrail(ax, az);
    }
  } else {
    ax = Math.sin(t * 0.45) * 0.22;
    az = Math.cos(t * 0.38) * 0.18;
  }

  apollo.root.position.set(ax, 0, az);
  apollo.root.rotation.set(0, yaw, 0);
  apollo.body.position.y = 1.12 + hoverY;
  apollo.body.rotation.set(pitch, 0, roll);

  if (mode === 'flecha') {
    apollo.leftArm.arm.rotation.set(-1.35, -0.35, -0.35);
    apollo.leftArm.elbow.rotation.set(-0.15, 0, 0);
    apollo.solarBow.rotation.set(0, 0, 0.15);

    arrowTimer -= dt;
    drawTension = T.MathUtils.clamp(1.0 - (arrowTimer / 0.65), 0, 1);

    apollo.rightArm.arm.rotation.set(-1.25, 0.25, 0.65);
    apollo.rightArm.elbow.rotation.set(-1.35 + drawTension * 0.35, 0.2, 0.15);
    apollo.nockedArrow.visible = drawTension > 0.15;

    if (arrowTimer <= 0) {
      arrowTimer = 0.65;
      drawTension = 0;
      fireSolarArrow();
    }
  } else if (mode === 'helio') {
    drawTension = 0;
    apollo.nockedArrow.visible = true;
    apollo.leftArm.arm.rotation.set(-0.45, -0.25, -2.25 + Math.sin(t * 2) * 0.04);
    apollo.leftArm.elbow.rotation.set(-0.35, -0.1, 0);
    apollo.rightArm.arm.rotation.set(-0.45, 0.25, 2.25 + Math.cos(t * 2) * 0.04);
    apollo.rightArm.elbow.rotation.set(-0.35, 0.1, 0);
    apollo.solarBow.rotation.set(0, 0, 0);
  } else {
    drawTension = 0;
    apollo.nockedArrow.visible = true;
    apollo.leftArm.arm.rotation.set(-0.62, -0.35, -0.55 + Math.sin(t * 1.4) * 0.03);
    apollo.leftArm.elbow.rotation.set(-0.52, -0.2, 0.15);
    apollo.solarBow.rotation.set(0.15, 0, 0.25);

    apollo.rightArm.arm.rotation.set(-0.28, 0.18, 0.58 + Math.cos(t * 1.4) * 0.03);
    apollo.rightArm.elbow.rotation.set(-0.78, 0.2, 0.22);
  }

  const sAttr = apollo.bowString.geometry.attributes.position;
  sAttr.setXYZ(0, 0, apollo.bowStringNockY, apollo.bowStringNockZ);
  sAttr.setXYZ(1, 0, 0, apollo.bowStringNockZ - drawTension * 0.36);
  sAttr.setXYZ(2, 0, -apollo.bowStringNockY, apollo.bowStringNockZ);
  sAttr.needsUpdate = true;

  apollo.solarHaloGroup.rotation.z += dt * (0.45 + heliosWeight * 1.2);

  const lyreAng = -t * 0.75 + 0.55;
  apollo.lyreOrbitGroup.position.set(
    Math.cos(lyreAng) * 1.02,
    2.18 + Math.sin(t * 2.2) * 0.11,
    Math.sin(lyreAng) * 1.02
  );
  apollo.lyreOrbitGroup.rotation.y = -lyreAng + Math.PI / 2;
  apollo.lyre.rotation.z = Math.sin(t * 1.8) * 0.06;

  for (const ls of apollo.lyreStrings) {
    const vib = Math.sin(t * 28 + ls.phase) * 0.0022;
    ls.front.position.x = ls.baseX + vib;
    ls.back.position.x = ls.baseX - vib;
  }

  apollo.arrowGlow.scale.setScalar(0.9 + Math.sin(t * 14) * 0.2 + drawTension * 0.4);
  apollo.arrowAnchor.getWorldPosition(tmpV);
  arrowLight.position.copy(tmpV);
  arrowLight.intensity = 1.9 + drawTension * 2.0 + Math.sin(t * 14) * 0.35;

  const wind = (mode === 'voo' || mode === 'helio') ? 1.85 : 1.0;
  for (const c of apollo.hairCurls) {
    c.mesh.position.y = c.baseY + Math.sin(t * 2.6 * wind + c.phase) * 0.007;
  }

  const cAttr = apollo.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = apollo.capeBase[i * 3];
    const by = apollo.capeBase[i * 3 + 1];
    const bz = apollo.capeBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.92 - by) / 1.84));
    const wave1 = Math.sin(t * 3.2 * wind - normY * 4.5 + bx * 2.5) * 0.13 * normY;
    const wave2 = Math.cos(t * 2.2 * wind - normY * 3.0) * 0.055 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.4 - normY * 3.0) * 0.032 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  apollo.cape.geometry.computeVertexNormals();

  const skAttr = apollo.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = apollo.skirtBase[i * 3];
    const by = apollo.skirtBase[i * 3 + 1];
    const bz = apollo.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.41 - by) / 0.82));
    skAttr.setZ(i, bz + Math.sin(t * 3.4 * wind - normY * 4.0 + bx * 4.0) * 0.038 * normY);
  }
  skAttr.needsUpdate = true;
  apollo.skirtMesh.geometry.computeVertexNormals();

  for (let i = solarArrows.length - 1; i >= 0; i--) {
    const ar = solarArrows[i];
    ar.progress += dt * ar.speed;
    const p = Math.min(1, ar.progress);
    ar.mesh.position.lerpVectors(ar.start, ar.target, p);

    if (p >= 1) {
      spawnShockRing(ar.target.x, ar.target.z, 0xfde047, 4.2);
      spawnSolarSparks(ar.target.x, 0.15, ar.target.z, 24);
      blastLight.position.set(ar.target.x, 0.9, ar.target.z);
      blastLight.intensity = 10.5;

      scene.remove(ar.mesh);
      ar.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      solarArrows.splice(i, 1);
    }
  }

  for (let i = shockRings.length - 1; i >= 0; i--) {
    const sr = shockRings[i];
    sr.life -= dt;
    const k = Math.max(0, sr.life / sr.max);
    sr.mesh.scale.setScalar(1 + (1 - k) * sr.maxScale);
    sr.mesh.material.opacity = 0.94 * k;
    if (sr.life <= 0) {
      scene.remove(sr.mesh);
      sr.mesh.geometry.dispose();
      sr.mesh.material.dispose();
      shockRings.splice(i, 1);
    }
  }

  for (let i = flightTrails.length - 1; i >= 0; i--) {
    const ft = flightTrails[i];
    ft.life -= dt;
    const k = Math.max(0, ft.life / ft.max);
    ft.mesh.scale.setScalar(1 + (1 - k) * 2.2);
    ft.mesh.material.opacity = 0.72 * k;
    if (ft.life <= 0) {
      scene.remove(ft.mesh);
      ft.mesh.geometry.dispose();
      ft.mesh.material.dispose();
      flightTrails.splice(i, 1);
    }
  }

  const heliosTarget = (mode === 'helio') ? 1 : 0;
  heliosWeight = T.MathUtils.damp(heliosWeight, heliosTarget, 3.0, dt);
  heliosGroup.visible = heliosWeight > 0.02;
  skyMat.uniforms.eclipseFactor.value = heliosWeight;

  if (heliosGroup.visible) {
    const beamAngle = t * 0.65;
    const beamX = Math.sin(beamAngle) * 2.1;
    const beamZ = Math.cos(beamAngle) * 2.1;

    heliosOrb.position.set(ax, 4.9, az);
    heliosCorona.position.set(ax, 4.9, az);
    heliosOrb.scale.setScalar(heliosWeight * (1 + Math.sin(t * 14) * 0.08));
    heliosCorona.scale.setScalar(heliosWeight * (1.1 + Math.cos(t * 12) * 0.14));

    orbitalBeamCore.position.set(beamX, 4.25, beamZ);
    orbitalBeamOuter.position.set(beamX, 4.25, beamZ);
    orbitalBeamCore.scale.set(heliosWeight * (1 + Math.sin(t * 22) * 0.15), 1, heliosWeight * (1 + Math.sin(t * 22) * 0.15));
    orbitalBeamOuter.scale.set(heliosWeight * (1 + Math.cos(t * 18) * 0.2), 1, heliosWeight * (1 + Math.cos(t * 18) * 0.2));

    for (const hr of heatRings) {
      hr.y += dt * 3.8;
      if (hr.y > 5.8) hr.y = 0.15;
      hr.mesh.position.set(beamX, hr.y, beamZ);
      hr.mesh.scale.setScalar(heliosWeight * (1.2 - (hr.y / 6.5) * 0.5));
      hr.mesh.material.opacity = 0.85 * heliosWeight * (1 - hr.y / 6.0);
    }

    if (Math.random() < 0.55) spawnSolarSparks(beamX, 0.2, beamZ, 4);
    blastLight.position.set(beamX, 1.2, beamZ);
    blastLight.intensity = 11.0 * heliosWeight;
  }

  for (const bf of brazierFlames) {
    bf.f1.scale.set(1 + Math.sin(t * 11 + bf.phase) * 0.12, 1 + Math.cos(t * 13 + bf.phase) * 0.18, 1);
    bf.f2.scale.set(1 + Math.cos(t * 10 + bf.phase) * 0.15, 1 + Math.sin(t * 9 + bf.phase) * 0.2, 1);
  }

  solarRing.rotation.z += dt * 0.18;
  shadowBlob.position.set(ax, 0.015, az);
  const s = 1.6 - hoverY * 1.4;
  shadowBlob.scale.set(s, s, 1);
  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 15);
  updateDust(dt, t);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(ax, 3.04 + hoverY, az)
    : new T.Vector3(0, 1.92, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
</body>
</html>
