<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. ESPECIFICAÇÃO DE TIERS T1–T4 DE HADES
   ========================================================================== */
export const HADES_HOPLITE_TIERS = {
  1: {
    tier: 1,
    id: 'hades_01',
    name: 'Hoplita Umbral (Map 01)',
    subtitle: 'Era Arcaica — Ferro Escurecido do Submundo & Túnica Cinza-Carvão',
    armorHex: 0x3f3f46,
    accentHex: 0xea580c,
    greaveHex: 0x27272a,
    metalness: 0.62,
    roughness: 0.48,
    shieldRimHex: 0x9a3412,
    shieldBgHex: 0x09090b,
    bidentHex: 0xf97316,
    crestColorHex: 0x991b1b,
    cloakColorHex: 0x18181b,
    soulGlow: 0.25
  },
  2: {
    tier: 2,
    id: 'hades_02',
    name: 'Hoplita Estígio (Map 02)',
    subtitle: 'Era Heroica — Bronze Infernal Forjado, Ombreiras & Crista Púrpura',
    armorHex: 0x78350f,
    accentHex: 0x10b981,
    greaveHex: 0x5c2d16,
    metalness: 0.82,
    roughness: 0.30,
    shieldRimHex: 0xea580c,
    shieldBgHex: 0x140d1f,
    bidentHex: 0x34d399,
    crestColorHex: 0x7e22ce,
    cloakColorHex: 0x2e1065,
    soulGlow: 0.55
  },
  3: {
    tier: 3,
    id: 'hades_03',
    name: 'Hoplita de Ouro Sombrio (Map 03)',
    subtitle: 'Era Mítica — Couraça de Ouro Amaldiçoado, Escudo do Bidente & Almas do Estige',
    armorHex: 0xd97706,
    accentHex: 0x10b981,
    greaveHex: 0xb45309,
    metalness: 0.92,
    roughness: 0.20,
    shieldRimHex: 0xfacc15,
    shieldBgHex: 0x090612,
    bidentHex: 0x6ee7b7,
    crestColorHex: 0xea580c,
    cloakColorHex: 0x450a0a,
    soulGlow: 1.25
  },
  4: {
    tier: 4,
    id: 'hades_04',
    name: 'Campeão do Tártaro (Map 04)',
    subtitle: 'Era dos Titãs — Armadura de Obsidiana & Prata Espectral com Chifres Infernais',
    armorHex: 0x1e1b2e,
    accentHex: 0x10b981,
    greaveHex: 0x2e294e,
    metalness: 0.95,
    roughness: 0.16,
    shieldRimHex: 0x10b981,
    shieldBgHex: 0x030206,
    bidentHex: 0xa7f3d0,
    crestColorHex: 0x10b981,
    cloakColorHex: 0x090514,
    soulGlow: 2.2
  }
};

/* ==========================================================================
   2. TEXTURAS PROCEDURAIS PBR SOMBRIAS
   ========================================================================== */
function createProceduralTextures() {
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5500; i++) {
    const v = 122 + Math.floor(Math.random() * 14);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // Chiton Sombrio Cinza-Carvão com Runas do Tártaro em Brasa e Ouro
  const chitonCanvas = document.createElement('canvas');
  chitonCanvas.width = 512;
  chitonCanvas.height = 256;
  const cCtx = chitonCanvas.getContext('2d');
  cCtx.fillStyle = '#27272a';
  cCtx.fillRect(0, 0, 512, 256);
  cCtx.fillStyle = 'rgba(9, 9, 11, 0.25)';
  for (let x = 0; x < 512; x += 8) cCtx.fillRect(x, 0, 3, 256);

  cCtx.fillStyle = '#450a0a';
  cCtx.fillRect(0, 198, 512, 38);
  cCtx.fillStyle = '#ea580c';
  cCtx.fillRect(0, 194, 512, 4);
  cCtx.fillRect(0, 236, 512, 4);

  // Losangos rúnicos do Submundo
  cCtx.strokeStyle = '#6ee7b7';
  cCtx.lineWidth = 2.8;
  for (let x = 0; x < 512; x += 32) {
    cCtx.beginPath();
    cCtx.moveTo(x + 16, 204);
    cCtx.lineTo(x + 26, 217);
    cCtx.lineTo(x + 16, 230);
    cCtx.lineTo(x + 6, 217);
    cCtx.closePath();
    cCtx.stroke();
  }
  const chitonTex = new T.CanvasTexture(chitonCanvas);
  chitonTex.wrapS = chitonTex.wrapT = T.RepeatWrapping;

  // Escudo Hoplon de Hades com o Bidente Sagrado e Chamas do Tártaro
  function createHadesShieldTexture(tier) {
    const spec = HADES_HOPLITE_TIERS[tier];
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgHex = '#' + spec.shieldBgHex.toString(16).padStart(6, '0');
    const rimHex = '#' + spec.shieldRimHex.toString(16).padStart(6, '0');
    const bidHex = '#' + spec.bidentHex.toString(16).padStart(6, '0');

    const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
    grad.addColorStop(0, '#1e1035');
    grad.addColorStop(0.55, bgHex);
    grad.addColorStop(0.80, bgHex);
    grad.addColorStop(0.86, rimHex);
    grad.addColorStop(0.95, '#09090b');
    grad.addColorStop(1, rimHex);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = rimHex;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(256, 256, 206, 0, Math.PI * 2);
    ctx.stroke();

    // Espinhos / Chamas radiais ao redor da borda interna
    const spikeCount = tier === 4 ? 20 : (tier === 3 ? 16 : 12);
    ctx.fillStyle = bidHex;
    for (let i = 0; i < spikeCount; i++) {
      const a = (i / spikeCount) * Math.PI * 2;
      const sx1 = 256 + Math.cos(a - 0.06) * 195;
      const sy1 = 256 + Math.sin(a - 0.06) * 195;
      const sx2 = 256 + Math.cos(a + 0.06) * 195;
      const sy2 = 256 + Math.sin(a + 0.06) * 195;
      const tipX = 256 + Math.cos(a) * 165;
      const tipY = 256 + Math.sin(a) * 165;
      ctx.beginPath();
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(sx2, sy2);
      ctx.closePath();
      ctx.fill();
    }

    // Desenho do Bidente de Hades (Cetro de Duas Pontas do Submundo)
    ctx.save();
    if (tier >= 3) {
      ctx.shadowColor = tier === 4 ? '#10b981' : '#ea580c';
      ctx.shadowBlur = 24;
    }

    ctx.strokeStyle = bidHex;
    ctx.fillStyle = bidHex;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Haste central inferior
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(256, 398);
    ctx.lineTo(256, 232);
    ctx.stroke();

    // Forquilha curva do Bidente
    ctx.lineWidth = 13;
    ctx.beginPath();
    ctx.moveTo(202, 148);
    ctx.quadraticCurveTo(202, 232, 256, 232);
    ctx.quadraticCurveTo(310, 232, 310, 148);
    ctx.stroke();

    // Duas pontas afiadas do Bidente
    for (const side of [-1, 1]) {
      const px = 256 + side * 54;
      ctx.beginPath();
      ctx.moveTo(px, 108);
      ctx.lineTo(px - 17, 158);
      ctx.lineTo(px + 17, 158);
      ctx.closePath();
      ctx.fill();
    }

    // Gema / Crânio rúnico na junção do Bidente
    ctx.fillStyle = rimHex;
    ctx.beginPath();
    ctx.arc(256, 232, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    const tex = new T.CanvasTexture(canvas);
    tex.colorSpace = T.SRGBColorSpace;
    return tex;
  }

  // Piso de Obsidiana Rachada dos Portões do Submundo
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#12101a';
  fCtx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 3800; i++) {
    fCtx.fillStyle = i % 2 === 0 ? 'rgba(30, 27, 46, 0.45)' : 'rgba(5, 4, 10, 0.55)';
    fCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  fCtx.strokeStyle = '#ea580c';
  fCtx.lineWidth = 16;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 420, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#10b981';
  fCtx.lineWidth = 7;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 436, 0, Math.PI * 2);
  fCtx.stroke();

  // Fissuras de magma e almas verdes irradiando do centro
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    fCtx.strokeStyle = i % 2 === 0 ? 'rgba(16, 185, 129, 0.65)' : 'rgba(234, 88, 12, 0.75)';
    fCtx.lineWidth = 3.5;
    fCtx.beginPath();
    fCtx.moveTo(cx + Math.cos(a) * 85, cy + Math.sin(a) * 85);
    fCtx.lineTo(cx + Math.cos(a + 0.08) * 240, cy + Math.sin(a + 0.08) * 240);
    fCtx.lineTo(cx + Math.cos(a) * 405, cy + Math.sin(a) * 405);
    fCtx.stroke();
  }

  const floorTex = new T.CanvasTexture(floorCanvas);
  return { skinBump, chitonTex, floorTex, createHadesShieldTexture };
}

/* ==========================================================================
   3. CONSTRUÇÃO DO HOPLITA DE HADES
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function buildHadesHoplite(textures, initialTier = 3) {
  const spec0 = HADES_HOPLITE_TIERS[initialTier];

  const M = {
    skin: new T.MeshStandardMaterial({
      color: 0x9e8474,          // Tom pálido acinzentado do Submundo
      roughness: 0.46,
      metalness: 0.08,
      bumpMap: textures.skinBump,
      bumpScale: 0.0035
    }),
    beard: new T.MeshStandardMaterial({
      color: 0x09090b,
      roughness: 0.65
    }),
    armorMain: new T.MeshStandardMaterial({
      color: spec0.armorHex,
      metalness: spec0.metalness,
      roughness: spec0.roughness
    }),
    armorAccent: new T.MeshStandardMaterial({
      color: spec0.accentHex,
      emissive: 0x064e3b,
      emissiveIntensity: 0.4,
      metalness: 0.9,
      roughness: 0.18
    }),
    greaveMat: new T.MeshStandardMaterial({
      color: spec0.greaveHex,
      metalness: spec0.metalness,
      roughness: spec0.roughness
    }),
    leatherMat: new T.MeshStandardMaterial({
      color: 0x18181b,
      roughness: 0.72
    }),
    chitonMat: new T.MeshStandardMaterial({
      map: textures.chitonTex,
      roughness: 0.56,
      side: T.DoubleSide
    }),
    crestMat: new T.MeshStandardMaterial({
      color: spec0.crestColorHex,
      emissive: 0x2e1065,
      emissiveIntensity: 0.35,
      roughness: 0.42
    }),
    cloakMat: new T.MeshStandardMaterial({
      color: spec0.cloakColorHex,
      emissive: 0x1c0505,
      emissiveIntensity: 0.3,
      roughness: 0.54,
      side: T.DoubleSide
    }),
    shieldMat: new T.MeshStandardMaterial({
      map: textures.createHadesShieldTexture(initialTier),
      metalness: 0.82,
      roughness: 0.24,
      side: T.DoubleSide
    }),
    spearShaftMat: new T.MeshStandardMaterial({
      color: 0x18181b,
      roughness: 0.45,
      metalness: 0.45
    }),
    soulMat: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x10b981,
      emissiveIntensity: spec0.soulGlow,
      roughness: 0.08
    })
  };

  const root = new T.Group();
  const body = group(root, 0, 1.04, 0);

  const tier2Parts = [];
  const tier3Parts = [];
  const tier4Parts = [];

  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.24, 20, 18), M.leatherMat, [0, 0, 0], [0, 0, 0], [1.14, 0.78, 0.85]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.155, -0.04, 0);

    sculpt(hip, new T.CylinderGeometry(0.145, 0.105, 0.48, 18), M.skin, [0, -0.23, 0], [0, 0, 0], [1.04, 1, 1.08]);
    sculpt(hip, new T.SphereGeometry(0.112, 14, 14), M.skin, [s * 0.02, -0.20, 0.048], [0, 0, 0], [0.96, 1.8, 0.86]);
    sculpt(hip, new T.SphereGeometry(0.088, 14, 14), M.skin, [0, -0.48, 0.015]);

    const knee = group(hip, 0, -0.49, 0);
    sculpt(knee, new T.CylinderGeometry(0.09, 0.056, 0.44, 16), M.skin, [0, -0.22, 0]);
    sculpt(knee, new T.SphereGeometry(0.085, 14, 14), M.skin, [0, -0.15, -0.038], [0, 0, 0], [0.98, 1.65, 0.96]);

    sculpt(knee, new T.CylinderGeometry(0.092, 0.060, 0.35, 16, 1, false, -0.88, 1.76), M.greaveMat, [0, -0.22, 0.01]);
    const kneeCap = sculpt(knee, new T.ConeGeometry(0.050, 0.11, 4), M.armorAccent, [0, -0.02, 0.082], [0.15, 0, 0], [1.1, 1, 0.42]);
    tier2Parts.push(kneeCap);

    const ankle = group(knee, 0, -0.44, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.098, 0.052, 0.22), M.leatherMat, [0, -0.02, 0.038]);
    sculpt(ankle, new T.BoxGeometry(0.106, 0.018, 0.232), M.greaveMat, [0, -0.046, 0.038]);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.22, -0.14, -0.10);
  legs.L.knee.rotation.set(0.28, 0, 0);
  legs.R.hip.rotation.set(0.18, 0.16, 0.12);
  legs.R.knee.rotation.set(0.22, 0, 0);

  const torso = group(body, 0, 1.30, 0);
  const torsoPts = [
    new T.Vector2(0.01, -0.43),
    new T.Vector2(0.26, -0.39),
    new T.Vector2(0.24, -0.19),
    new T.Vector2(0.30, 0.04),
    new T.Vector2(0.39, 0.27),
    new T.Vector2(0.34, 0.42),
    new T.Vector2(0.15, 0.49),
    new T.Vector2(0.01, 0.50)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 32), M.skin, [0, 0, 0], [0, 0, 0], [1.18, 1.02, 0.75]);

  const cuirassPts = [
    new T.Vector2(0.01, -0.36),
    new T.Vector2(0.27, -0.32),
    new T.Vector2(0.255, -0.15),
    new T.Vector2(0.315, 0.05),
    new T.Vector2(0.405, 0.27),
    new T.Vector2(0.34, 0.39),
    new T.Vector2(0.19, 0.42),
    new T.Vector2(0.01, 0.42)
  ];
  sculpt(torso, new T.LatheGeometry(cuirassPts, 36), M.armorMain, [0, 0.01, 0], [0, 0, 0], [1.19, 1.0, 0.78]);

  for (const side of [-1, 1]) {
    sculpt(torso, new T.BoxGeometry(0.085, 0.03, 0.32), M.armorAccent, [side * 0.22, 0.40, 0.01], [0.1, 0, side * -0.12]);
  }

  const pecArmorGeo = new T.SphereGeometry(0.20, 20, 20);
  const pecArmorL = sculpt(torso, pecArmorGeo, M.armorMain, [-0.18, 0.22, 0.175], [0.12, -0.22, -0.14], [1.05, 0.85, 0.55]);
  const pecArmorR = sculpt(torso, pecArmorGeo, M.armorMain, [0.18, 0.22, 0.175], [0.12, 0.22, 0.14], [1.05, 0.85, 0.55]);
  tier3Parts.push(pecArmorL, pecArmorR);

  const abArmorGeo = new T.SphereGeometry(0.082, 12, 12);
  [0.03, -0.08, -0.19].forEach(ay => {
    const abL = sculpt(torso, abArmorGeo, M.armorMain, [-0.072, ay, 0.225], [0, 0, 0], [1.0, 0.75, 0.45]);
    const abR = sculpt(torso, abArmorGeo, M.armorMain, [0.072, ay, 0.225], [0, 0, 0], [1.0, 0.75, 0.45]);
    tier3Parts.push(abL, abR);
  });

  // Emblema peitoral do Bidente de Hades
  const chestBident = group(torso, 0, 0.19, 0.256);
  sculpt(chestBident, new T.BoxGeometry(0.016, 0.09, 0.022), M.armorAccent, [0, -0.03, 0]);
  sculpt(chestBident, new T.BoxGeometry(0.068, 0.015, 0.022), M.armorAccent, [0, 0.015, 0]);
  sculpt(chestBident, new T.BoxGeometry(0.015, 0.075, 0.022), M.armorAccent, [-0.028, 0.045, 0]);
  sculpt(chestBident, new T.BoxGeometry(0.015, 0.075, 0.022), M.armorAccent, [0.028, 0.045, 0]);
  tier2Parts.push(chestBident);

  const gorget = new T.TorusGeometry(0.21, 0.024, 10, 32);
  gorget.rotateX(Math.PI / 2);
  const gorgetMesh = sculpt(torso, gorget, M.armorAccent, [0, 0.41, 0.01], [0.16, 0, 0], [1.15, 1, 0.9]);
  tier4Parts.push(gorgetMesh);

  sculpt(torso, new T.CylinderGeometry(0.115, 0.145, 0.24, 18), M.skin, [0, 0.51, -0.008], [0.06, 0, 0]);

  const head = group(torso, 0, 0.72, 0.032);
  sculpt(head, new T.SphereGeometry(0.185, 28, 28), M.skin, [0, 0, 0], [0, 0, 0], [0.92, 1.14, 0.98]);
  sculpt(head, new T.CylinderGeometry(0.16, 0.14, 0.10, 20, 1, false, -Math.PI * 0.4, Math.PI * 0.8), M.beard, [0, -0.10, 0.04], [0.1, 0, 0], [0.95, 1, 1.04]);
  // Olhos brilhando em fogo infernal laranja/esmeralda
  const eyeMat = new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xea580c, emissiveIntensity: 2.2 });
  sculpt(head, new T.SphereGeometry(0.018, 12, 12), eyeMat, [-0.048, 0.02, 0.172], [0, 0, 0], [1.15, 0.7, 0.8]);
  sculpt(head, new T.SphereGeometry(0.018, 12, 12), eyeMat, [0.048, 0.02, 0.172], [0, 0, 0], [1.15, 0.7, 0.8]);

  const helm = group(head, 0, 0.032, -0.004);
  sculpt(helm, new T.SphereGeometry(0.205, 30, 22, 0, Math.PI * 2, 0, Math.PI * 0.56), M.armorMain, [0, 0.02, 0], [-0.08, 0, 0], [0.98, 1.08, 1.06]);
  sculpt(helm, new T.BoxGeometry(0.02, 0.105, 0.028), M.armorAccent, [0, 0.03, 0.204], [-0.06, 0, 0]);
  for (const side of [-1, 1]) {
    const cheek = group(helm, side * 0.148, -0.042, 0.102);
    cheek.rotation.set(0.08, side * 0.5, side * -0.12);
    sculpt(cheek, new T.BoxGeometry(0.02, 0.15, 0.12), M.armorMain);
  }
  sculpt(helm, new T.CylinderGeometry(0.195, 0.22, 0.13, 22, 1, true, Math.PI * 0.62, Math.PI * 0.76), M.armorMain, [0, -0.068, -0.014], [0.12, 0, 0]);

  const crestMount = group(helm, 0, 0.22, -0.01);
  sculpt(crestMount, new T.BoxGeometry(0.032, 0.075, 0.28), M.armorAccent, [0, 0, 0], [-0.08, 0, 0]);
  const crestSegments = [];
  for (let i = 0; i < 18; i++) {
    const t = i / 17;
    const ang = -0.5 + t * 2.45;
    const r = 0.23;
    const cy = Math.cos(ang) * r * 0.88 - 0.03;
    const cz = Math.sin(ang) * r * 1.12 - 0.03;
    const seg = sculpt(crestMount, new T.BoxGeometry(0.024, 0.14 + Math.sin(t * Math.PI) * 0.05, 0.032), M.crestMat, [0, cy, cz], [ang, 0, 0]);
    crestSegments.push({ mesh: seg, phase: i * 0.45, factor: 0.3 + t * 0.9 });
  }
  tier2Parts.push(crestMount);

  // Chifres Infernais e Espigões do Elmo do Tártaro (Tier 4)
  const helmHorns = group(helm, 0, 0.08, -0.02);
  for (const side of [-1, 1]) {
    const hPivot = group(helmHorns, side * 0.18, 0.02, 0.02);
    hPivot.rotation.set(0.15, side * 0.25, side * -0.35);
    sculpt(hPivot, new T.ConeGeometry(0.034, 0.28, 6), M.armorAccent, [side * 0.04, 0.12, 0], [0, 0, side * -0.25]);
    sculpt(hPivot, new T.ConeGeometry(0.022, 0.18, 5), M.armorMain, [side * 0.06, 0.05, -0.07], [-0.45, 0, side * -0.45]);
  }
  tier4Parts.push(helmHorns);

  function createHopliteArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.42, 0.33, -0.008);

    const pauldronT2 = sculpt(arm, new T.SphereGeometry(0.165, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), M.armorMain, [s * 0.015, 0.035, 0], [0, 0, s * -0.32], [1.12, 0.76, 1.15]);
    tier2Parts.push(pauldronT2);

    const pauldronT4 = sculpt(arm, new T.SphereGeometry(0.185, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.42), M.armorAccent, [s * 0.02, 0.06, 0], [0, 0, s * -0.35], [1.14, 0.72, 1.16]);
    tier4Parts.push(pauldronT4);

    sculpt(arm, new T.SphereGeometry(0.128, 16, 16), M.skin, [0, -0.01, 0]);
    sculpt(arm, new T.CapsuleGeometry(0.085, 0.26, 12, 16), M.skin, [s * 0.022, -0.17, 0], [0, 0, s * 0.07]);

    const elbow = group(arm, s * 0.04, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.082, 0.054, 0.31, 16), M.skin, [0, -0.15, 0]);

    const bracer = sculpt(elbow, new T.CylinderGeometry(0.066, 0.058, 0.11, 20, 1, true), M.armorAccent, [0, -0.24, 0]);
    tier2Parts.push(bracer);

    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.068, 0.078, 0.034), M.skin, [0, -0.018, 0]);

    return { arm, elbow, hand };
  }

  const rightArm = createHopliteArm(true);
  const leftArm = createHopliteArm(false);

  // LANÇA-BIDENTE DE HADES (DUAS PONTAS PERFURANTES DO SUBMUNDO)
  const spear = new T.Group();
  rightArm.hand.add(spear);
  spear.position.set(0, -0.035, 0.032);
  spear.rotation.set(Math.PI / 2, 0, 0);

  sculpt(spear, new T.CylinderGeometry(0.02, 0.023, 2.75, 14), M.spearShaftMat, [0, 0.35, 0]);
  sculpt(spear, new T.ConeGeometry(0.034, 0.22, 8), M.armorAccent, [0, -1.12, 0], [Math.PI, 0, 0]);

  const spearHead = group(spear, 0, 1.72, 0);
  sculpt(spearHead, new T.CylinderGeometry(0.038, 0.024, 0.11, 12), M.armorAccent, [0, 0.04, 0]);
  // Travessa e duas lâminas paralelas do Bidente de Hades
  sculpt(spearHead, new T.BoxGeometry(0.20, 0.03, 0.026), M.armorAccent, [0, 0.11, 0]);
  for (const side of [-1, 1]) {
    sculpt(spearHead, new T.ConeGeometry(0.044, 0.44, 4), M.armorAccent, [side * 0.082, 0.31, 0], [0, 0, 0], [0.95, 1.0, 0.24]);
  }

  const spearSoulCore = sculpt(spearHead, new T.OctahedronGeometry(0.042, 0), M.soulMat, [0, 0.15, 0]);
  tier3Parts.push(spearSoulCore);

  // Cone de energia espectral verde na ponta do bidente para a estocada
  const thrustCone = new T.Mesh(
    new T.ConeGeometry(0.26, 0.98, 16, 1, true),
    new T.MeshBasicMaterial({
      color: 0x10b981,
      transparent: true,
      opacity: 0,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  thrustCone.position.set(0, 0.40, 0);
  spearHead.add(thrustCone);

  const spearTipAnchor = group(spearHead, 0, 0.54, 0);

  const hoplonShield = group(leftArm.elbow, -0.055, -0.22, 0.02);
  hoplonShield.rotation.set(0, -Math.PI / 2, 0);

  const shieldDomeGeo = new T.SphereGeometry(0.60, 32, 22, 0, Math.PI * 2, 0, Math.PI * 0.28);
  shieldDomeGeo.rotateX(Math.PI / 2);
  sculpt(hoplonShield, shieldDomeGeo, M.shieldMat, [0, 0, -0.46]);
  sculpt(hoplonShield, new T.TorusGeometry(0.57, 0.028, 10, 44), M.armorAccent, [0, 0, 0.02]);

  const garments = group(torso, 0, 0, 0);
  const beltGeo = new T.TorusGeometry(0.275, 0.028, 10, 32);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.leatherMat, [0, -0.35, 0.01], [0.05, 0, -0.03], [1.12, 1, 0.84]);
  sculpt(garments, new T.BoxGeometry(0.11, 0.085, 0.026), M.armorAccent, [0, -0.35, 0.24]);

  const pterugesGroup = group(garments, 0, -0.38, 0);
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    sculpt(
      pterugesGroup,
      new T.BoxGeometry(0.078, 0.34, 0.016),
      i % 2 === 0 ? M.leatherMat : M.armorMain,
      [Math.sin(a) * 0.28, -0.17, Math.cos(a) * 0.22],
      [Math.cos(a) * 0.14, a, -Math.sin(a) * 0.14]
    );
  }
  tier2Parts.push(pterugesGroup);

  const skirtGeo = new T.CylinderGeometry(0.26, 0.48, 0.64, 44, 16, true);
  const skPos = skirtGeo.attributes.position;
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.32 - y) / 0.64));
    const pleat = Math.sin(angle * 16) * 0.024 * (0.2 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    skPos.setXYZ(i, Math.cos(angle) * r * 1.06, y, Math.sin(angle) * r * 0.84);
  }
  skirtGeo.computeVertexNormals();
  sculpt(garments, skirtGeo, M.chitonMat, [0, -0.62, 0], [0.04, 0, 0]);

  const capeGeo = new T.PlaneGeometry(1.32, 1.76, 22, 28);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.88 - y) / 1.76));
    const archZ = -0.17 - Math.cos((x / 0.66) * Math.PI * 0.5) * 0.08;
    const z = archZ - normY * 0.48;
    const fx = x * (0.62 + normY * 0.74);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.cloakMat, [0, -0.44, -0.04]);
  tier3Parts.push(cape);

  let currentTier = initialTier;

  function applyTier(tier) {
    currentTier = tier;
    root.userData.armorTier = tier;
    const nextSpec = HADES_HOPLITE_TIERS[tier] ?? HADES_HOPLITE_TIERS[3];

    M.armorMain.color.setHex(nextSpec.armorHex);
    M.armorMain.metalness = nextSpec.metalness;
    M.armorMain.roughness = nextSpec.roughness;

    M.armorAccent.color.setHex(nextSpec.accentHex);
    M.greaveMat.color.setHex(nextSpec.greaveHex);
    M.greaveMat.metalness = nextSpec.metalness;
    M.greaveMat.roughness = nextSpec.roughness;

    M.crestMat.color.setHex(nextSpec.crestColorHex);
    M.cloakMat.color.setHex(nextSpec.cloakColorHex);
    M.soulMat.emissiveIntensity = nextSpec.soulGlow;

    if (M.shieldMat.map) M.shieldMat.map.dispose();
    M.shieldMat.map = textures.createHadesShieldTexture(tier);
    M.shieldMat.needsUpdate = true;

    tier2Parts.forEach((p) => { p.visible = tier >= 2; });
    tier3Parts.forEach((p) => { p.visible = tier >= 3; });
    tier4Parts.forEach((p) => { p.visible = tier >= 4; });
  }

  root.userData.setArmorTier = applyTier;
  applyTier(initialTier);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm, spear, thrustCone, spearTipAnchor, hoplonShield,
    crestSegments, cape, capeBase,
    getTier: () => currentTier
  };
}

/* ==========================================================================
   4. CENA E RENDERER (PORTÕES DO SUBMUNDO DE HADES)
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x090712);
scene.fog = new T.FogExp2(0x090712, 0.022);

const camera = new T.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 140);

const hemi = new T.HemisphereLight(0xa7f3d0, 0x2e1065, 0.95);
scene.add(hemi);

const sun = new T.DirectionalLight(0xffedd5, 2.05);
sun.position.set(4.8, 8.0, 5.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 28 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const soulRim = new T.DirectionalLight(0x10b981, 1.55);
soulRim.position.set(-4.5, 4.5, -5.0);
scene.add(soulRim);

const sparkLight = new T.PointLight(0x10b981, 0, 10);
scene.add(sparkLight);

const textures = createProceduralTextures();

const arenaFloor = new T.Mesh(
  new T.CylinderGeometry(7.2, 7.5, 0.32, 72),
  new T.MeshStandardMaterial({ map: textures.floorTex, roughness: 0.36, metalness: 0.35 })
);
arenaFloor.position.y = -0.16;
arenaFloor.receiveShadow = true;
scene.add(arenaFloor);

const soulRing = new T.Mesh(
  new T.RingGeometry(4.45, 4.56, 72),
  new T.MeshBasicMaterial({ color: 0xea580c, transparent: true, opacity: 0.85, side: T.DoubleSide })
);
soulRing.rotation.x = -Math.PI / 2;
soulRing.position.y = 0.015;
scene.add(soulRing);

const obsidianMat = new T.MeshStandardMaterial({ color: 0x18181b, roughness: 0.55, metalness: 0.45 });
const bronzeColMat = new T.MeshStandardMaterial({ color: 0x92400e, metalness: 0.88, roughness: 0.25 });
const torchMat = new T.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.85, blending: T.AdditiveBlending });
const torches = [];

for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + 0.2;
  const col = group(scene, Math.cos(a) * 5.8, 0, Math.sin(a) * 5.8);
  sculpt(col, new T.BoxGeometry(0.7, 0.14, 0.7), obsidianMat, [0, 0.07, 0]);
  sculpt(col, new T.CylinderGeometry(0.22, 0.26, 2.75, 8), obsidianMat, [0, 1.52, 0]);
  sculpt(col, new T.BoxGeometry(0.64, 0.14, 0.64), obsidianMat, [0, 2.96, 0]);
  sculpt(col, new T.BoxGeometry(0.54, 0.05, 0.54), bronzeColMat, [0, 3.06, 0]);

  const flame = new T.Mesh(new T.ConeGeometry(0.14, 0.42, 8), torchMat);
  flame.position.y = 3.28;
  col.add(flame);
  torches.push({ mesh: flame, phase: i * 0.9 });
}

const hoplite = buildHadesHoplite(textures, 3);
scene.add(hoplite.root);

const SPARK_N = 65;
const sparkPos = new Float32Array(SPARK_N * 3).fill(-100);
const sparkVel = new Float32Array(SPARK_N * 3);
const sparkLife = new Float32Array(SPARK_N);
let sparkIdx = 0;

const sparkGeo = new T.BufferGeometry();
sparkGeo.setAttribute('position', new T.BufferAttribute(sparkPos, 3));
scene.add(new T.Points(sparkGeo, new T.PointsMaterial({
  color: 0x6ee7b7,
  size: 0.13,
  transparent: true,
  opacity: 0.95,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnSoulSpark(pos) {
  for (let k = 0; k < 16; k++) {
    const i = sparkIdx;
    sparkIdx = (sparkIdx + 1) % SPARK_N;
    sparkPos[i * 3] = pos.x;
    sparkPos[i * 3 + 1] = pos.y;
    sparkPos[i * 3 + 2] = pos.z;
    sparkVel[i * 3] = (Math.random() - 0.5) * 4.6;
    sparkVel[i * 3 + 1] = Math.random() * 4.6 + 1.1;
    sparkVel[i * 3 + 2] = (Math.random() - 0.5) * 4.6;
    sparkLife[i] = 0.28 + Math.random() * 0.25;
  }
  sparkLight.position.copy(pos);
  sparkLight.intensity = 8.5;
}

function updateSparks(dt) {
  for (let i = 0; i < SPARK_N; i++) {
    if (sparkLife[i] <= 0) continue;
    sparkLife[i] -= dt;
    sparkVel[i * 3 + 1] -= 11.5 * dt;
    sparkPos[i * 3] += sparkVel[i * 3] * dt;
    sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
    sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    if (sparkLife[i] <= 0) sparkPos[i * 3 + 1] = -100;
  }
  sparkGeo.attributes.position.needsUpdate = true;
}

const upgradeWaves = [];
function triggerTierUpgradeBurst(x, z, tier) {
  const col = tier === 4 ? 0x10b981 : (tier === 3 ? 0xea580c : 0x9333ea);
  const ring = new T.Mesh(
    new T.RingGeometry(0.35, 0.75, 48),
    new T.MeshBasicMaterial({
      color: col,
      transparent: true,
      opacity: 0.95,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.04, z);
  scene.add(ring);
  upgradeWaves.push({ mesh: ring, life: 0.85, max: 0.85 });
}

/* ==========================================================================
   5. CONTROLES INTERATIVOS
   ========================================================================== */
let action = 'guarda';
let thrustTimer = 0;
let focusClose = false;

let hx = 0, hz = 0;
let camAngle = 0.45;
let camPitch = 0.18;
let camDist = 7.8;
let targetCamDist = 7.8;
let currentLookAt = new T.Vector3(0, 1.75, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

const tierTitleEl = document.getElementById('tier-title');
const tierSubEl = document.getElementById('tier-sub');

document.querySelectorAll('button[data-tier]').forEach((b) => {
  b.addEventListener('click', () => {
    const tNum = Number(b.dataset.tier);
    hoplite.root.userData.setArmorTier(tNum);
    const spec = HADES_HOPLITE_TIERS[tNum];
    tierTitleEl.textContent = `Tier ${tNum}: ${spec.name}`;
    tierSubEl.textContent = spec.subtitle;

    document.querySelectorAll('button[data-tier]').forEach((x) => x.classList.toggle('on', x === b));
    triggerTierUpgradeBurst(hx, hz, tNum);
  });
});

document.querySelectorAll('button[data-act]').forEach((b) => {
  b.addEventListener('click', () => {
    action = b.dataset.act;
    thrustTimer = 0.001;
    if (action !== 'marcha' && action !== 'corrida') { hx = 0; hz = 0; }
    document.querySelectorAll('button[data-act]').forEach((x) => x.classList.toggle('on', x === b));

    const tNum = hoplite.getTier();
    const spec = HADES_HOPLITE_TIERS[tNum];
    if (action === 'defesa') {
      tierTitleEl.textContent = 'Égide do Tártaro • Postura Ancorada';
      tierSubEl.textContent = 'Ele puxou o escudo do Bidente rente ao peito, firmando os pés na obsidiana enquanto brasas saltam do impacto.';
    } else {
      tierTitleEl.textContent = `Tier ${tNum}: ${spec.name}`;
      tierSubEl.textContent = spec.subtitle;
    }
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusClose = !focusClose;
  btnFocus.classList.toggle('active', focusClose);
  btnFocus.textContent = focusClose ? 'Corpo Inteiro' : 'Focar Elmo / Escudo';
  targetCamDist = focusClose ? 2.55 : 7.8;
  if (focusClose) {
    camAngle = 0.25;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.8, 14.5);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.8, 14.5);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   6. LOOP DE ANIMAÇÃO
   ========================================================================== */
const tmpV = new T.Vector3();
let sparkTriggered = false;
let blockTimer = 0;
let blockSparkDone = false;

function update(dt, t) {
  let hy = 0, yaw = Math.sin(t * 0.35) * 0.12, pitch = 0.02, roll = 0;
  let torsoYaw = 0;
  const breath = Math.sin(t * 2.2) * 0.022;

  if (action === 'marcha') {
    const a = t * 0.85;
    const R = 2.65;
    hx = Math.cos(a) * R;
    hz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.07;
    roll = -0.06;

    const stride = t * 5.2;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    hy = Math.abs(cosS) * 0.045;
    torsoYaw = sinS * 0.08;

    hoplite.legs.L.hip.rotation.x = -0.16 + sinS * 0.36;
    hoplite.legs.L.knee.rotation.x = 0.22 + Math.max(0, -cosS) * 0.36;
    hoplite.legs.R.hip.rotation.x = -0.16 - sinS * 0.36;
    hoplite.legs.R.knee.rotation.x = 0.22 + Math.max(0, cosS) * 0.36;

    hoplite.hoplonShield.position.set(-0.055, -0.22, 0.02);
    hoplite.hoplonShield.rotation.set(0, -Math.PI / 2, 0);
    hoplite.leftArm.arm.rotation.set(-0.68, -0.42, -0.40);
    hoplite.leftArm.elbow.rotation.set(-0.92, -0.22, 0.22);
    hoplite.rightArm.arm.rotation.set(-0.78 - sinS * 0.12, 0.18, 0.45);
    hoplite.rightArm.elbow.rotation.set(-0.58 + sinS * 0.10, 0.15, 0.2);
  } else if (action === 'corrida') {
    const a = t * 1.65;
    const R = 2.85;
    hx = Math.cos(a) * R;
    hz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.24;
    roll = -0.22;

    const stride = t * 10.5;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    hy = Math.abs(cosS) * 0.11;
    torsoYaw = sinS * 0.14;

    hoplite.legs.L.hip.rotation.x = -0.35 + sinS * 0.62;
    hoplite.legs.L.knee.rotation.x = 0.45 + Math.max(0, -cosS) * 0.65;
    hoplite.legs.R.hip.rotation.x = -0.35 - sinS * 0.62;
    hoplite.legs.R.knee.rotation.x = 0.45 + Math.max(0, cosS) * 0.65;

    hoplite.hoplonShield.position.set(-0.055, -0.22, 0.02);
    hoplite.hoplonShield.rotation.set(0, -Math.PI / 2, 0);
    hoplite.leftArm.arm.rotation.set(-0.82, -0.52, -0.36);
    hoplite.leftArm.elbow.rotation.set(-1.05, -0.28, 0.24);
    hoplite.rightArm.arm.rotation.set(-1.12 - sinS * 0.18, 0.16, 0.40);
    hoplite.rightArm.elbow.rotation.set(-0.78 + sinS * 0.14, 0.15, 0.18);
  } else if (action === 'ataque') {
    hoplite.hoplonShield.position.set(-0.055, -0.22, 0.02);
    hoplite.hoplonShield.rotation.set(0, -Math.PI / 2, 0);
    const prevTimer = thrustTimer;
    thrustTimer = (thrustTimer + dt * 1.45) % 1.0;
    if (thrustTimer < prevTimer) sparkTriggered = false;

    if (thrustTimer < 0.28) {
      const p = thrustTimer / 0.28;
      const ease = p * p;
      torsoYaw = -0.25 * ease;
      pitch = 0.04 * ease;
      hz = -0.15 * ease;

      hoplite.legs.L.hip.rotation.set(-0.25, -0.14, -0.10);
      hoplite.legs.L.knee.rotation.set(0.32, 0, 0);
      hoplite.legs.R.hip.rotation.set(0.22, 0.16, 0.12);
      hoplite.legs.R.knee.rotation.set(0.26, 0, 0);

      const armX = -0.85 * (1 - ease) + 0.52 * ease;
      const elbowX = -0.55 * (1 - ease) - 1.32 * ease;
      const armZ = 0.45 * (1 - ease) + 0.06 * ease;
      const elbowZ = 0.20 * (1 - ease) + 0.0 * ease;

      hoplite.rightArm.arm.rotation.set(armX, 0.05, armZ);
      hoplite.rightArm.elbow.rotation.set(elbowX, 0.0, elbowZ);
      hoplite.spear.rotation.set(Math.PI / 2 - (armX + elbowX), 0, -(armZ + elbowZ));

      hoplite.leftArm.arm.rotation.set(-0.78, -0.48, -0.35);
      hoplite.leftArm.elbow.rotation.set(-1.05, -0.25, 0.24);
      hoplite.thrustCone.material.opacity = 0;
    } else if (thrustTimer < 0.52) {
      const p = (thrustTimer - 0.28) / 0.24;
      const lunge = Math.sin(p * Math.PI * 0.5);
      torsoYaw = -0.25 + 0.55 * lunge;
      pitch = 0.04 + 0.12 * lunge;
      hz = -0.15 + 0.65 * lunge;
      hy = -0.07 * lunge;

      hoplite.legs.L.hip.rotation.set(-0.25 - 0.34 * lunge, -0.14, -0.10);
      hoplite.legs.L.knee.rotation.set(0.32 + 0.32 * lunge, 0, 0);
      hoplite.legs.R.hip.rotation.set(0.22 + 0.30 * lunge, 0.16, 0.12);
      hoplite.legs.R.knee.rotation.set(0.26 - 0.14 * lunge, 0, 0);

      const armX = 0.52 - 1.98 * lunge;
      const elbowX = -1.32 + 1.26 * lunge;
      const armZ = 0.06 * (1 - lunge);

      hoplite.rightArm.arm.rotation.set(armX, 0.02, armZ);
      hoplite.rightArm.elbow.rotation.set(elbowX, 0.0, 0.0);
      hoplite.spear.rotation.set(Math.PI / 2 - (armX + elbowX) - pitch, 0, -armZ);

      hoplite.leftArm.arm.rotation.set(-0.62, -0.65, -0.48);
      hoplite.leftArm.elbow.rotation.set(-0.95, -0.28, 0.22);

      hoplite.thrustCone.material.opacity = Math.sin(p * Math.PI) * 0.85;
      hoplite.thrustCone.scale.set(1, 0.85 + lunge * 0.65, 1);

      if (lunge > 0.88 && !sparkTriggered) {
        sparkTriggered = true;
        hoplite.root.updateMatrixWorld(true);
        hoplite.spearTipAnchor.getWorldPosition(tmpV);
        spawnSoulSpark(tmpV);
      }
    } else {
      const k = (thrustTimer - 0.52) / 0.48;
      const rem = 1 - k;
      torsoYaw = 0.30 * rem;
      pitch = 0.16 * rem;
      hz = 0.50 * rem;
      hy = -0.07 * rem;

      hoplite.legs.L.hip.rotation.set(-0.22 - 0.37 * rem, -0.14, -0.10);
      hoplite.legs.L.knee.rotation.set(0.28 + 0.36 * rem, 0, 0);
      hoplite.legs.R.hip.rotation.set(0.18 + 0.34 * rem, 0.16, 0.12);
      hoplite.legs.R.knee.rotation.set(0.22 - 0.10 * rem, 0, 0);

      const armX = -1.46 * rem - 0.85 * k;
      const elbowX = -0.06 * rem - 0.55 * k;
      const armZ = 0.45 * k;
      const elbowZ = 0.20 * k;

      hoplite.rightArm.arm.rotation.set(armX, 0.02 * rem + 0.18 * k, armZ);
      hoplite.rightArm.elbow.rotation.set(elbowX, 0.15 * k, elbowZ);
      hoplite.spear.rotation.set(Math.PI / 2 - (armX + elbowX) * rem - pitch, 0, -(armZ + elbowZ) * rem);

      hoplite.leftArm.arm.rotation.set(-0.62 * rem - 0.68 * k, -0.65 * rem - 0.42 * k, -0.48 * rem - 0.42 * k);
      hoplite.leftArm.elbow.rotation.set(-0.95 * rem - 0.92 * k, -0.25, 0.22);
      hoplite.thrustCone.material.opacity = 0;
    }
  } else if (action === 'defesa') {
    hoplite.spear.rotation.set(Math.PI / 2, 0, 0);
    hoplite.thrustCone.material.opacity = 0;

    const prevBlock = blockTimer;
    blockTimer = (blockTimer + dt * 0.85) % 1.0;
    if (blockTimer < prevBlock) blockSparkDone = false;

    const hitPulse = (blockTimer > 0.45 && blockTimer < 0.72)
      ? Math.sin(((blockTimer - 0.45) / 0.27) * Math.PI)
      : 0;

    if (hitPulse > 0.85 && !blockSparkDone) {
      blockSparkDone = true;
      hoplite.root.updateMatrixWorld(true);
      hoplite.hoplonShield.getWorldPosition(tmpV);
      tmpV.z += 0.18;
      spawnSoulSpark(tmpV);
    }

    hy = -0.14 - hitPulse * 0.04;
    hz = -0.18 * hitPulse;
    pitch = 0.14 - hitPulse * 0.12;
    torsoYaw = 0.28 - hitPulse * 0.08;

    hoplite.legs.L.hip.rotation.set(-0.48 - hitPulse * 0.1, -0.18, -0.14);
    hoplite.legs.L.knee.rotation.set(0.68 + hitPulse * 0.14, 0, 0);
    hoplite.legs.R.hip.rotation.set(0.36 + hitPulse * 0.08, 0.22, 0.18);
    hoplite.legs.R.knee.rotation.set(0.56 + hitPulse * 0.12, 0, 0);

    hoplite.leftArm.arm.rotation.set(-0.72 - hitPulse * 0.08, 0.35, 0.58);
    hoplite.leftArm.elbow.rotation.set(-1.35, 0.45, -1.15);

    hoplite.hoplonShield.position.set(0.02, -0.26, 0.10 - hitPulse * 0.03);
    hoplite.hoplonShield.rotation.set(1.18, -0.22, -0.35);

    hoplite.rightArm.arm.rotation.set(-1.32 + hitPulse * 0.06, 0.16, 0.36);
    hoplite.rightArm.elbow.rotation.set(-0.62, 0.15, 0.2);
  } else {
    hoplite.hoplonShield.position.set(-0.055, -0.22, 0.02);
    hoplite.hoplonShield.rotation.set(0, -Math.PI / 2, 0);
    hoplite.spear.rotation.set(Math.PI / 2, 0, 0);
    hoplite.thrustCone.material.opacity = 0;
    hoplite.leftArm.arm.rotation.set(-0.68, -0.42, -0.42 + Math.sin(t * 1.6) * 0.02);
    hoplite.leftArm.elbow.rotation.set(-0.92, -0.22, 0.22);
    hoplite.rightArm.arm.rotation.set(-0.85, 0.18, 0.45 + Math.cos(t * 1.6) * 0.02);
    hoplite.rightArm.elbow.rotation.set(-0.55, 0.15, 0.2);

    hoplite.legs.L.hip.rotation.set(-0.22, -0.14, -0.10);
    hoplite.legs.L.knee.rotation.set(0.28, 0, 0);
    hoplite.legs.R.hip.rotation.set(0.18, 0.16, 0.12);
    hoplite.legs.R.knee.rotation.set(0.22, 0, 0);
  }

  hoplite.root.position.set(hx, hy, hz);
  hoplite.root.rotation.set(0, yaw, 0);
  hoplite.body.position.y = 1.04 + breath;
  hoplite.body.rotation.set(pitch, torsoYaw, roll);

  const wind = (action === 'marcha' || action === 'corrida') ? (action === 'corrida' ? 2.4 : 1.6) : 1.0;
  for (const cs of hoplite.crestSegments) {
    cs.mesh.position.x = Math.sin(t * 3.4 * wind - cs.phase) * 0.016 * cs.factor;
  }
  if (hoplite.cape.visible) {
    const cAttr = hoplite.cape.geometry.attributes.position;
    for (let i = 0; i < cAttr.count; i++) {
      const bx = hoplite.capeBase[i * 3];
      const by = hoplite.capeBase[i * 3 + 1];
      const bz = hoplite.capeBase[i * 3 + 2];
      const normY = Math.max(0, Math.min(1, (0.88 - by) / 1.76));
      const wave = Math.sin(t * 3.2 * wind - normY * 4.5 + bx * 2.5) * 0.12 * normY;
      cAttr.setXYZ(i, bx, by, bz + wave);
    }
    cAttr.needsUpdate = true;
    hoplite.cape.geometry.computeVertexNormals();
  }

  for (const tr of torches) {
    tr.mesh.scale.set(1 + Math.sin(t * 11 + tr.phase) * 0.15, 1 + Math.cos(t * 13 + tr.phase) * 0.22, 1);
  }

  for (let i = upgradeWaves.length - 1; i >= 0; i--) {
    const uw = upgradeWaves[i];
    uw.life -= dt;
    const k = Math.max(0, uw.life / uw.max);
    uw.mesh.scale.setScalar(1 + (1 - k) * 5.2);
    uw.mesh.material.opacity = 0.95 * k;
    if (uw.life <= 0) {
      scene.remove(uw.mesh);
      uw.mesh.geometry.dispose();
      uw.mesh.material.dispose();
      upgradeWaves.splice(i, 1);
    }
  }

  sparkLight.intensity = Math.max(0, sparkLight.intensity - dt * 25);
  updateSparks(dt);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusClose && action !== 'marcha' && action !== 'corrida') camAngle += dt * 0.05;

  const desiredTarget = focusClose
    ? new T.Vector3(hx, 2.68 + hy + breath, hz)
    : new T.Vector3(0, 1.78, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
