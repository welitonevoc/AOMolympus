<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Titã Caríbdis - Colosso das Profundezas | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --abyss-cyan: #2dd4bf;
      --deep-blue: #0284c7;
      --coral-glow: #38bdf8;
      --abyss-bg: #020c14;
      --glass: rgba(4, 22, 34, 0.84);
      --border: rgba(45, 212, 191, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--abyss-bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #e6fffa;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #5eead4;
      transform: translateY(-1px);
      background: rgba(8, 38, 56, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #2dd4bf 0%, #0284c7 100%);
      color: #03131c;
      border-color: #99f6e4;
      box-shadow: 0 0 22px rgba(45, 212, 191, 0.6);
    }
    button.cam-btn {
      border-color: rgba(234, 179, 8, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #b45309 100%);
      color: #08121a;
      border-color: #fef08a;
      box-shadow: 0 0 18px rgba(234, 179, 8, 0.5);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #5eead4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(4, 20, 30, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(45, 212, 191, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #ccfbf1;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="colosso" class="on">Colosso Abissal</button>
    <button data-m="vortice">Vórtice Devorador</button>
    <button data-m="sopro">Sopro Abissal</button>
    <button data-m="kraken">Fúria do Kraken</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Titã de Poseidon • Caríbdis</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (ESCAMAS ABISSAIS, CARAPAÇA DE CORAL E ÁGUA)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map de escamas oceânicas e carapaça quitinosa
  const scaleCanvas = document.createElement('canvas');
  scaleCanvas.width = scaleCanvas.height = 256;
  const sCtx = scaleCanvas.getContext('2d');
  sCtx.fillStyle = '#707070';
  sCtx.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 16) {
    for (let x = 0; x < 256; x += 16) {
      const ox = (y % 32 === 0) ? 0 : 8;
      sCtx.strokeStyle = '#d4d4d4';
      sCtx.lineWidth = 2;
      sCtx.beginPath();
      sCtx.arc(x + ox, y, 10, 0, Math.PI);
      sCtx.stroke();
    }
  }
  const scaleBump = new T.CanvasTexture(scaleCanvas);
  scaleBump.wrapS = scaleBump.wrapT = T.RepeatWrapping;
  scaleBump.repeat.set(6, 6);

  // 1.2 Textura de Água Espiral e Espuma para o Redemoinho Devorador
  const whirlCanvas = document.createElement('canvas');
  whirlCanvas.width = whirlCanvas.height = 512;
  const wCtx = whirlCanvas.getContext('2d');
  wCtx.fillStyle = '#042f2e';
  wCtx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 180; i++) {
    const y = Math.random() * 512;
    wCtx.strokeStyle = i % 3 === 0 ? 'rgba(45, 212, 191, 0.42)' : 'rgba(224, 242, 254, 0.30)';
    wCtx.lineWidth = 2 + Math.random() * 5;
    wCtx.beginPath();
    wCtx.moveTo(0, y);
    wCtx.bezierCurveTo(170, y + 26, 340, y - 26, 512, y);
    wCtx.stroke();
  }
  const whirlTex = new T.CanvasTexture(whirlCanvas);
  whirlTex.wrapS = whirlTex.wrapT = T.RepeatWrapping;
  whirlTex.repeat.set(3, 2);

  // 1.3 Textura de Caustics / Espuma Oceânica para a superfície do Mar
  const waterCanvas = document.createElement('canvas');
  waterCanvas.width = waterCanvas.height = 256;
  const fCtx = waterCanvas.getContext('2d');
  fCtx.fillStyle = '#03354a';
  fCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 850; i++) {
    const r = 3 + Math.random() * 14;
    fCtx.strokeStyle = `rgba(94, 234, 212, ${0.10 + Math.random() * 0.24})`;
    fCtx.lineWidth = 1.4;
    fCtx.beginPath();
    fCtx.arc(Math.random() * 256, Math.random() * 256, r, 0, Math.PI * 2);
    fCtx.stroke();
  }
  const waterTex = new T.CanvasTexture(waterCanvas);
  waterTex.wrapS = waterTex.wrapT = T.RepeatWrapping;
  waterTex.repeat.set(5, 5);

  return { scaleBump, whirlTex, waterTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA TITÂNICA E MATERIAIS ABISSAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    abyssSkin: new T.MeshStandardMaterial({
      color: 0x0f3b4c,          // Pele abissal azul-petróleo escuro escamada
      roughness: 0.36,
      metalness: 0.24,
      bumpMap: textures.scaleBump,
      bumpScale: 0.0065
    }),
    chitinArmor: new T.MeshStandardMaterial({
      color: 0x111827,          // Carapaça quitinosa de coral negro e obsidiana marinha
      emissive: 0x042f2e,
      emissiveIntensity: 0.25,
      roughness: 0.28,
      metalness: 0.72,
      bumpMap: textures.scaleBump,
      bumpScale: 0.005
    }),
    atlanteanGold: new T.MeshStandardMaterial({
      color: 0xd97706,          // Ouro atlante envelhecido pelo sal
      emissive: 0x291102,
      emissiveIntensity: 0.22,
      metalness: 0.90,
      roughness: 0.24
    }),
    bioTealVein: new T.MeshStandardMaterial({
      color: 0x99f6e4,
      emissive: 0x14b8a6,       // Veias bioluminescentes turquesa pulsando nos músculos
      emissiveIntensity: 3.4,
      roughness: 0.1
    }),
    coralGlow: new T.MeshStandardMaterial({
      color: 0xe0f2fe,
      emissive: 0x38bdf8,       // Corais cristalinos luminosos na coroa e ombros
      emissiveIntensity: 3.0,
      roughness: 0.12
    }),
    eyeAbyss: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x2dd4bf,       // Olhos abissais incandescentes
      emissiveIntensity: 4.5,
      roughness: 0.05
    }),
    fangIvory: new T.MeshStandardMaterial({
      color: 0xf1f5f9,
      emissive: 0x0f766e,
      emissiveIntensity: 0.2,
      roughness: 0.25
    }),
    whirlWater: new T.MeshStandardMaterial({
      map: textures.whirlTex,
      color: 0x0ea5e9,
      emissive: 0x0f766e,
      emissiveIntensity: 0.7,
      roughness: 0.18,
      metalness: 0.25,
      transparent: true,
      opacity: 0.86,
      side: T.DoubleSide
    }),
    foamMat: new T.MeshStandardMaterial({
      color: 0xf0f9ff,
      emissive: 0x5eead4,
      emissiveIntensity: 0.5,
      roughness: 0.6,
      transparent: true,
      opacity: 0.9
    }),
    tentacleMat: new T.MeshStandardMaterial({
      color: 0x134e4a,
      emissive: 0x042f2e,
      emissiveIntensity: 0.35,
      roughness: 0.34,
      metalness: 0.2,
      bumpMap: textures.scaleBump,
      bumpScale: 0.004
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DO TITÃ CARÍBDIS / LEVIATÃ ABISSAL
   ========================================================================== */
function buildCharybdisTitan(textures) {
  const M = createMaterials(textures);

  const titanRoot = new T.Group();

  // ------------------------------------------------------------------------
  // A. REDEMOINHO OCEÂNICO DEVORADOR SOB CARÍBDIS (FUNIL DE ÁGUA E ESPUMA)
  // ------------------------------------------------------------------------
  const whirlpoolGroup = group(titanRoot, 0, 0, 0);

  // Funil espiralado principal emergindo do oceano
  const funnelGeo = new T.CylinderGeometry(1.18, 1.85, 1.75, 44, 20, true);
  const fPos = funnelGeo.attributes.position;
  for (let i = 0; i < fPos.count; i++) {
    const x = fPos.getX(i), y = fPos.getY(i), z = fPos.getZ(i);
    const normY = (y + 0.875) / 1.75; // 0 na base do mar, 1 na cintura do Titã
    const ang = Math.atan2(z, x);
    const spiral = Math.sin(ang * 5 + normY * 8.5) * 0.11 * (0.4 + normY * 0.6);
    const r = Math.sqrt(x * x + z * z) + spiral;
    fPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
  }
  funnelGeo.computeVertexNormals();
  const funnelMesh = new T.Mesh(funnelGeo, M.whirlWater);
  funnelMesh.position.y = 0.85;
  whirlpoolGroup.add(funnelMesh);

  // Núcleo bioluminescente interno do redemoinho
  const innerCore = new T.Mesh(
    new T.CylinderGeometry(0.82, 1.25, 1.70, 28, 1, true),
    new T.MeshBasicMaterial({
      color: 0x2dd4bf,
      transparent: true,
      opacity: 0.34,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  innerCore.position.y = 0.84;
  whirlpoolGroup.add(innerCore);

  // Colar de espuma turbulenta onde o redemoinho gira na superfície do oceano
  const baseFoamRing = new T.Mesh(new T.TorusGeometry(1.85, 0.22, 12, 44), M.foamMat);
  baseFoamRing.rotation.x = Math.PI / 2;
  baseFoamRing.position.y = 0.10;
  whirlpoolGroup.add(baseFoamRing);

  // Anéis helicoidais de correnteza bioluminescente
  const whirlRings = [];
  for (let r = 0; r < 5; r++) {
    const t = r / 4;
    const rad = 1.78 - t * 0.56;
    const wRing = new T.Mesh(
      new T.TorusGeometry(rad, 0.036, 8, 40),
      new T.MeshBasicMaterial({
        color: r % 2 === 0 ? 0x2dd4bf : 0x38bdf8,
        transparent: true,
        opacity: 0.78,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    wRing.rotation.x = Math.PI / 2 + (r % 2 === 0 ? 0.12 : -0.12);
    wRing.position.y = 0.22 + t * 1.38;
    whirlpoolGroup.add(wRing);
    whirlRings.push({ mesh: wRing, baseY: wRing.position.y, phase: r * 1.25 });
  }

  // ------------------------------------------------------------------------
  // B. TRONCO TITÂNICO DO LEVIATÃ ABISSAL (ESCALA 1.35x ACIMA DO REDEMOINHO)
  // ------------------------------------------------------------------------
  const body = group(titanRoot, 0, 1.65, 0);
  body.scale.setScalar(1.35);

  const torso = group(body, 0, 0.48, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.45),
    new T.Vector2(0.34, -0.40),
    new T.Vector2(0.31, -0.20),
    new T.Vector2(0.40, 0.04),
    new T.Vector2(0.55, 0.29),  // Ombros largos de monstro marinho
    new T.Vector2(0.48, 0.45),
    new T.Vector2(0.23, 0.52),
    new T.Vector2(0.01, 0.53)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.abyssSkin, [0, 0, 0], [0, 0, 0], [1.28, 1.04, 0.82]);

  // Placas de Carapaça de Coral Negro no Peitoral e Abdômen
  const pecGeo = new T.SphereGeometry(0.27, 24, 24);
  sculpt(torso, pecGeo, M.chitinArmor, [-0.235, 0.23, 0.195], [0.12, -0.22, -0.14], [1.1, 0.9, 0.64]);
  sculpt(torso, pecGeo, M.chitinArmor, [0.235, 0.23, 0.195], [0.12, 0.22, 0.14], [1.1, 0.9, 0.64]);

  // Veias Bioluminescentes Turquesa pulsando pelo peito e abdômen
  const bioVeinL = new T.CatmullRomCurve3([
    new T.Vector3(-0.40, 0.36, 0.14),
    new T.Vector3(-0.22, 0.25, 0.29),
    new T.Vector3(-0.08, 0.14, 0.31),
    new T.Vector3(-0.15, -0.04, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(bioVeinL, 16, 0.0095, 6, false), M.bioTealVein);

  const bioVeinR = new T.CatmullRomCurve3([
    new T.Vector3(0.40, 0.36, 0.14),
    new T.Vector3(0.22, 0.25, 0.29),
    new T.Vector3(0.08, 0.14, 0.31),
    new T.Vector3(0.15, -0.04, 0.29)
  ]);
  sculpt(torso, new T.TubeGeometry(bioVeinR, 16, 0.0095, 6, false), M.bioTealVein);

  const abGeo = new T.SphereGeometry(0.105, 16, 16);
  [
    { y: 0.04, sx: 1.08, sy: 0.78, z: 0.254 },
    { y: -0.08, sx: 1.04, sy: 0.80, z: 0.250 },
    { y: -0.20, sx: 0.95, sy: 0.86, z: 0.238 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.abyssSkin, [-0.088, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.52]);
    sculpt(torso, abGeo, M.abyssSkin, [0.088, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.52]);
  });

  // Dorsais e Carapaça Dorsal com Espigões de Coral Abissal
  const latGeo = new T.SphereGeometry(0.29, 20, 20);
  sculpt(torso, latGeo, M.chitinArmor, [-0.27, 0.18, -0.14], [0, 0, -0.25], [1.05, 1.38, 0.7]);
  sculpt(torso, latGeo, M.chitinArmor, [0.27, 0.18, -0.14], [0, 0, 0.25], [1.05, 1.38, 0.7]);

  // Crista dorsal de espinhos de coral luminoso
  for (let sp = 0; sp < 5; sp++) {
    const sy = 0.42 - sp * 0.16;
    const len = 0.26 - sp * 0.025;
    sculpt(
      torso,
      new T.ConeGeometry(0.042, len, 5),
      sp % 2 === 0 ? M.coralGlow : M.chitinArmor,
      [0, sy, -0.28],
      [-1.15, 0, 0],
      [0.65, 1, 1]
    );
  }

  // Pescoço maciço com guelras bioluminescentes laterais
  sculpt(torso, new T.CylinderGeometry(0.165, 0.21, 0.26, 20), M.abyssSkin, [0, 0.54, -0.01], [0.08, 0, 0]);
  for (const side of [-1, 1]) {
    for (let g = 0; g < 3; g++) {
      sculpt(
        torso,
        new T.BoxGeometry(0.018, 0.055, 0.08),
        M.bioTealVein,
        [side * 0.175, 0.50 + g * 0.045, 0.02],
        [0, side * 0.35, side * -0.25]
      );
    }
  }

  // Cinturão de Escamas e Mandíbulas Abissais na transição com o Redemoinho
  const beltGeo = new T.TorusGeometry(0.35, 0.045, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(torso, beltGeo, M.atlanteanGold, [0, -0.38, 0.01], [0.04, 0, 0], [1.18, 1, 0.88]);
  sculpt(torso, new T.OctahedronGeometry(0.068, 0), M.bioTealVein, [0, -0.38, 0.32]);

  // ------------------------------------------------------------------------
  // C. QUATRO TENTÁCULOS MARINHOS GIGANTES ARTICULADOS NAS COSTAS
  // ------------------------------------------------------------------------
  const backTentacles = [];
  const tentacleSpecs = [
    { x: -0.38, y: 0.32, z: -0.22, yaw: 0.55, roll: 0.45 },
    { x: 0.38, y: 0.32, z: -0.22, yaw: -0.55, roll: -0.45 },
    { x: -0.46, y: 0.04, z: -0.20, yaw: 0.72, roll: 0.65 },
    { x: 0.46, y: 0.04, z: -0.20, yaw: -0.72, roll: -0.65 }
  ];

  tentacleSpecs.forEach((spec, idx) => {
    const tRoot = group(torso, spec.x, spec.y, spec.z);
    tRoot.rotation.set(0.15, spec.yaw, spec.roll);

    const segs = [];
    let parentSeg = tRoot;
    for (let s = 0; s < 6; s++) {
      const t = s / 5;
      const rad = 0.082 * (1 - t * 0.65);
      const segPivot = group(parentSeg, 0, s === 0 ? 0 : 0.24, s === 0 ? 0 : -0.05);
      sculpt(segPivot, new T.CylinderGeometry(rad * 0.82, rad, 0.28, 12), M.tentacleMat, [0, 0.12, -0.02], [-0.22, 0, 0]);
      if (s < 5) {
        sculpt(segPivot, new T.SphereGeometry(rad * 0.42, 8, 8), M.bioTealVein, [0, 0.12, rad * 0.75]);
      }
      segs.push({ pivot: segPivot, phase: idx * 1.1 + s * 0.55 });
      parentSeg = segPivot;
    }
    backTentacles.push({ root: tRoot, segs, spec });
  });

  // ------------------------------------------------------------------------
  // D. CABEÇA ABISSAL DO LEVIATÃ (COROA DE CORAIS LUMINOSOS + MANDÍBULA ARTICULADA)
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.78, 0.04);

  // Crânio blindado abissal com crista frontal
  const skullGeo = new T.SphereGeometry(0.23, 36, 36);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.16;
    x *= 0.96;
    if (y < 0.02 && y > -0.09 && z > 0) { x *= 1.10; z *= 1.08; }
    if (y <= -0.08 && z > -0.02) { x *= 1.05; z *= 1.15; }
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.abyssSkin);

  // Placa frontal de carapaça na testa e nariz abissal
  sculpt(head, new T.ConeGeometry(0.085, 0.18, 6), M.chitinArmor, [0, 0.11, 0.19], [-0.28, 0, 0], [1.1, 1, 0.55]);

  // Quatro olhos abissais bioluminescentes
  for (const side of [-1, 1]) {
    sculpt(head, new T.SphereGeometry(0.026, 14, 14), M.eyeAbyss, [side * 0.065, 0.030, 0.202], [0, 0, 0], [1.25, 0.65, 0.85]);
    sculpt(head, new T.SphereGeometry(0.015, 10, 10), M.eyeAbyss, [side * 0.115, 0.055, 0.175], [0, 0, 0], [1.1, 0.7, 0.85]);
  }

  // Núcleo de energia abissal no interior da boca (para o Sopro Abissal)
  const mouthCore = sculpt(head, new T.SphereGeometry(0.055, 12, 12), M.bioTealVein, [0, -0.075, 0.16]);

  // Mandíbula Inferior Articulada + Presas Abissais
  const jawPivot = group(head, 0, -0.085, 0.09);
  sculpt(jawPivot, new T.BoxGeometry(0.15, 0.055, 0.16), M.chitinArmor, [0, -0.02, 0.08]);
  for (const side of [-1, 1]) {
    sculpt(jawPivot, new T.ConeGeometry(0.016, 0.068, 5), M.fangIvory, [side * 0.052, 0.025, 0.14], [0.15, 0, side * 0.12]);
  }

  // Barbelos / Tentáculos faciais ondulantes ao redor da mandíbula
  const faceTentacles = [];
  for (const side of [-1, 1]) {
    const fTent = sculpt(
      head,
      new T.ConeGeometry(0.026, 0.32, 8),
      M.tentacleMat,
      [side * 0.12, -0.14, 0.17],
      [Math.PI - 0.18, 0, side * 0.22]
    );
    faceTentacles.push({ mesh: fTent, side, phase: side * 0.9 });
  }

  // Coroa de corais abissais luminosos e chifres de Leviatã
  const coralCrown = group(head, 0, 0.15, 0);
  const crownRing = new T.TorusGeometry(0.22, 0.022, 10, 36);
  crownRing.rotateX(Math.PI / 2);
  sculpt(coralCrown, crownRing, M.atlanteanGold, [0, 0, 0], [0.12, 0, 0], [0.96, 1, 1.06]);

  for (let c = 0; c < 7; c++) {
    const a = ((c - 3) / 3) * Math.PI * 0.65;
    const h = 0.24 - Math.abs(c - 3) * 0.025;
    sculpt(
      coralCrown,
      new T.ConeGeometry(0.035, h, 6),
      c % 2 === 0 ? M.coralGlow : M.chitinArmor,
      [Math.sin(a) * 0.19, h * 0.5 + 0.02, Math.cos(a) * 0.19],
      [0.15, -a, a * 0.35]
    );
  }

  // ------------------------------------------------------------------------
  // E. BRAÇOS TITÂNICOS: GARRA COLOSSAL (ESQ) & ANTEBRAÇO ESPINHOSO (DIR)
  // ------------------------------------------------------------------------
  // 1. BRAÇO ESQUERDO COM GARRA-PINÇA GIGANTE DE CRUSTÁCEO
  const armL = group(torso, -0.58, 0.36, 0);
  const shoulderL = sculpt(armL, new T.SphereGeometry(0.22, 18, 18), M.chitinArmor, [0, 0, 0], [0, 0, 0.2]);
  for (let sp = 0; sp < 3; sp++) {
    sculpt(armL, new T.ConeGeometry(0.038, 0.22, 5), M.coralGlow, [-0.12 - sp * 0.05, 0.10 + sp * 0.04, -0.05 + sp * 0.04], [0, 0, 0.9]);
  }
  const bicepL = sculpt(armL, new T.CylinderGeometry(0.14, 0.16, 0.42, 16), M.abyssSkin, [-0.14, -0.22, 0], [0, 0, 0.35]);

  const forearmLPivot = group(armL, -0.26, -0.42, 0);
  forearmLPivot.rotation.set(0.25, 0, 0.2);
  sculpt(forearmLPivot, new T.CylinderGeometry(0.18, 0.14, 0.48, 16), M.chitinArmor, [0, -0.22, 0]);

  // Garra-Pinça Colossal (Duas mandíbulas móveis)
  const clawRoot = group(forearmLPivot, 0, -0.48, 0);
  const clawUpper = group(clawRoot, 0, 0, 0);
  sculpt(clawUpper, new T.ConeGeometry(0.09, 0.54, 8), M.chitinArmor, [-0.08, -0.26, 0.04], [0.2, 0, 0.28], [1.2, 1, 0.6]);
  sculpt(clawUpper, new T.SphereGeometry(0.065, 8, 8), M.coralGlow, [-0.06, -0.15, 0.04]);

  const clawLower = group(clawRoot, 0, 0, 0);
  sculpt(clawLower, new T.ConeGeometry(0.08, 0.50, 8), M.chitinArmor, [0.08, -0.24, -0.04], [-0.2, 0, -0.28], [1.1, 1, 0.6]);
  sculpt(clawLower, new T.SphereGeometry(0.065, 8, 8), M.coralGlow, [0.06, -0.15, -0.04]);

  // 2. BRAÇO DIREITO TITÂNICO (GOLPES DE IMPACTO E CONDUÇÃO DAS MARÉS)
  const armR = group(torso, 0.58, 0.36, 0);
  const shoulderR = sculpt(armR, new T.SphereGeometry(0.22, 18, 18), M.chitinArmor, [0, 0, 0], [0, 0, -0.2]);
  for (let sp = 0; sp < 3; sp++) {
    sculpt(armR, new T.ConeGeometry(0.038, 0.22, 5), M.coralGlow, [0.12 + sp * 0.05, 0.10 + sp * 0.04, -0.05 + sp * 0.04], [0, 0, -0.9]);
  }
  const bicepR = sculpt(armR, new T.CylinderGeometry(0.14, 0.16, 0.42, 16), M.abyssSkin, [0.14, -0.22, 0], [0, 0, -0.35]);

  const forearmRPivot = group(armR, 0.26, -0.42, 0);
  forearmRPivot.rotation.set(0.25, 0, -0.2);
  sculpt(forearmRPivot, new T.CylinderGeometry(0.18, 0.14, 0.48, 16), M.chitinArmor, [0, -0.22, 0]);

  // Punho Titânico com Garras de Coral e Runas Atlantes
  const handR = group(forearmRPivot, 0, -0.48, 0);
  sculpt(handR, new T.BoxGeometry(0.24, 0.20, 0.26), M.abyssSkin);
  for (let f = 0; f < 4; f++) {
    sculpt(handR, new T.ConeGeometry(0.034, 0.22, 6), M.fangIvory, [0.08 - f * 0.055, -0.18, 0.11], [0.35, 0, 0]);
  }

  // Jato de Sopro Abissal (Partículas e Cilindro Volumétrico)
  const breathBeam = new T.Mesh(
    new T.CylinderGeometry(0.08, 0.85, 8.5, 24, 1, true),
    new T.MeshBasicMaterial({
      color: 0x2dd4bf,
      transparent: true,
      opacity: 0.0,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  breathBeam.rotation.x = -Math.PI / 2;
  breathBeam.position.set(0, 0, 4.3);
  head.add(breathBeam);

  return {
    root: titanRoot,
    body,
    torso,
    head,
    jawPivot,
    mouthCore,
    breathBeam,
    armL,
    armR,
    forearmLPivot,
    forearmRPivot,
    clawUpper,
    clawLower,
    whirlpoolGroup,
    whirlRings,
    backTentacles,
    faceTentacles,
    materials: M
  };
}

/* ==========================================================================
   4. CENÁRIO OCEÂNICO ABISSAL DE CARÍBDIS
   ========================================================================== */
function buildOceanScene(textures) {
  const envGroup = new T.Group();

  // 1. Superfície do Mar com Ondas
  const seaGeo = new T.PlaneGeometry(80, 80, 72, 72);
  seaGeo.rotateX(-Math.PI / 2);
  const seaMat = new T.MeshStandardMaterial({
    map: textures.waterTex,
    color: 0x032838,
    emissive: 0x021622,
    emissiveIntensity: 0.4,
    roughness: 0.22,
    metalness: 0.35,
    transparent: true,
    opacity: 0.88
  });
  const seaMesh = new T.Mesh(seaGeo, seaMat);
  seaMesh.position.y = 0.05;
  seaMesh.receiveShadow = true;
  envGroup.add(seaMesh);

  // 2. Fundo Oceânico Profundo com Rocha Escura
  const seabedGeo = new T.PlaneGeometry(90, 90, 32, 32);
  seabedGeo.rotateX(-Math.PI / 2);
  const seabedMat = new T.MeshStandardMaterial({
    color: 0x020f18,
    roughness: 0.9,
    metalness: 0.1
  });
  const seabedMesh = new T.Mesh(seabedGeo, seabedMat);
  seabedMesh.position.y = -2.8;
  envGroup.add(seabedMesh);

  // 3. Pilares e Recifes de Coral Abissal circundando Caríbdis
  const reefCount = 14;
  for (let r = 0; r < reefCount; r++) {
    const ang = (r / reefCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
    const dist = 5.2 + Math.random() * 4.5;
    const rx = Math.sin(ang) * dist;
    const rz = Math.cos(ang) * dist;
    const rH = 2.4 + Math.random() * 3.8;
    const reefGeo = new T.ConeGeometry(0.45 + Math.random() * 0.3, rH, 6);
    const reefMat = new T.MeshStandardMaterial({
      color: 0x082533,
      emissive: r % 3 === 0 ? 0x0f766e : 0x031824,
      emissiveIntensity: 0.45,
      roughness: 0.75
    });
    const reefMesh = new T.Mesh(reefGeo, reefMat);
    reefMesh.position.set(rx, rH * 0.5 - 2.8, rz);
    reefMesh.rotation.y = Math.random() * Math.PI;
    reefMesh.rotation.z = (Math.random() - 0.5) * 0.2;
    envGroup.add(reefMesh);

    // Cristais de Coral Luminoso incrustados nas rochas
    if (r % 2 === 0) {
      const cGlow = new T.Mesh(
        new T.OctahedronGeometry(0.18 + Math.random() * 0.14, 0),
        new T.MeshStandardMaterial({
          color: 0x99f6e4,
          emissive: 0x2dd4bf,
          emissiveIntensity: 3.5,
          roughness: 0.1
        })
      );
      cGlow.position.set(rx + (Math.random() - 0.5) * 0.4, rH * 0.6 - 2.8, rz + (Math.random() - 0.5) * 0.4);
      envGroup.add(cGlow);
    }
  }

  return { envGroup, seaGeo, seaMesh };
}

/* ==========================================================================
   5. SISTEMA PRINCIPAL DE RENDERIZAÇÃO, LUZES E INTERAÇÃO
   ========================================================================== */
const scene = new T.Scene();
scene.background = new T.Color(0x020c14);
scene.fog = new T.FogExp2(0x020c14, 0.026);

const camera = new T.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 160);
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

// Iluminação Abissal e Raios Solares Submarinos
const ambient = new T.AmbientLight(0x072635, 1.2);
scene.add(ambient);

const hemi = new T.HemisphereLight(0x38bdf8, 0x02131e, 1.4);
scene.add(hemi);

const keyLight = new T.DirectionalLight(0xccfbf1, 3.8);
keyLight.position.set(8, 16, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

// Luz Bioluminescente Central sob o Redemoinho
const abyssCoreLight = new T.PointLight(0x2dd4bf, 8.5, 12);
abyssCoreLight.position.set(0, 0.8, 0);
scene.add(abyssCoreLight);

// Criar Texturas, Cenário e o Titã Caríbdis
const textures = createProceduralTextures();
const oceanScene = buildOceanScene(textures);
scene.add(oceanScene.envGroup);

const charybdis = buildCharybdisTitan(textures);
scene.add(charybdis.root);

// Partículas de Espuma e Borrifo de Água
const sprayCount = 450;
const sprayGeo = new T.BufferGeometry();
const sprayPos = new Float32Array(sprayCount * 3);
const sprayVel = [];
for (let i = 0; i < sprayCount; i++) {
  const ang = Math.random() * Math.PI * 2;
  const dist = 0.8 + Math.random() * 2.5;
  sprayPos[i * 3 + 0] = Math.cos(ang) * dist;
  sprayPos[i * 3 + 1] = Math.random() * 3.5;
  sprayPos[i * 3 + 2] = Math.sin(ang) * dist;
  sprayVel.push({
    vx: (Math.random() - 0.5) * 1.5,
    vy: 1.2 + Math.random() * 3.5,
    vz: (Math.random() - 0.5) * 1.5,
    life: Math.random()
  });
}
sprayGeo.setAttribute('position', new T.BufferAttribute(sprayPos, 3));
const sprayMat = new T.PointsMaterial({
  color: 0xe0f2fe,
  size: 0.08,
  transparent: true,
  opacity: 0.65,
  blending: T.AdditiveBlending
});
const spraySystem = new T.Points(sprayGeo, sprayMat);
scene.add(spraySystem);

// --------------------------------------------------------------------------
// CONTROLES DE CÂMERA 360° E INTERAÇÃO
// --------------------------------------------------------------------------
let camAngle = 0.35;
let camPitch = 0.28;
let camDist = 9.8;
let targetCamDist = 9.8;
let dragging = false;
let lastMouse = { x: 0, y: 0 };
let focusFace = false;
let currentLookAt = new T.Vector3(0, 2.2, 0);

window.addEventListener('pointerdown', e => {
  dragging = true;
  lastMouse.x = e.clientX;
  lastMouse.y = e.clientY;
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  lastMouse.x = e.clientX;
  lastMouse.y = e.clientY;
  camAngle -= dx * 0.007;
  camPitch = Math.max(-0.25, Math.min(1.2, camPitch + dy * 0.007));
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('wheel', e => {
  targetCamDist = Math.max(3.8, Math.min(16.0, targetCamDist + e.deltaY * 0.008));
});

// Suporte a Touch Zoom (Pinch)
let touchStartDist = 0;
window.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    touchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
window.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const diff = touchStartDist - dist;
    touchStartDist = dist;
    targetCamDist = Math.max(3.8, Math.min(16.0, targetCamDist + diff * 0.02));
  }
});

// Modos de Ação do Titã
let currentMode = 'colosso';
const modeBtns = document.querySelectorAll('.btn-group button[data-m]');
modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    modeBtns.forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentMode = btn.getAttribute('data-m');
  });
});

const focusBtn = document.getElementById('btn-focus');
focusBtn.addEventListener('click', () => {
  focusFace = !focusFace;
  focusBtn.classList.toggle('active', focusFace);
  focusBtn.textContent = focusFace ? 'Visão Geral' : 'Focar Rosto';
  targetCamDist = focusFace ? 4.8 : 9.8;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --------------------------------------------------------------------------
// LOOP DE ANIMAÇÃO PRINCIPAL
// --------------------------------------------------------------------------
const clock = new T.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  // 1. Rotação contínua do Redemoinho Devorador
  const whirlSpeed = currentMode === 'vortice' ? 8.5 : currentMode === 'kraken' ? 5.2 : 2.8;
  charybdis.whirlpoolGroup.rotation.y += dt * whirlSpeed;
  for (const wr of charybdis.whirlRings) {
    wr.mesh.rotation.y -= dt * (whirlSpeed * 1.35);
    wr.mesh.position.y = wr.baseY + Math.sin(t * 3.5 + wr.phase) * 0.05;
  }

  // 2. Animação de Ondulação da Superfície do Mar
  const seaAttr = oceanScene.seaGeo.attributes.position;
  for (let i = 0; i < seaAttr.count; i++) {
    const x = seaAttr.getX(i);
    const z = seaAttr.getZ(i);
    const distToCenter = Math.hypot(x, z);
    const whirlInfluence = Math.max(0, 1 - distToCenter / 7);
    const wave = Math.sin(t * 2.5 + x * 0.5) * Math.cos(t * 2.2 + z * 0.5) * 0.12 * (1 - whirlInfluence);
    seaAttr.setY(i, wave - whirlInfluence * 0.35);
  }
  seaAttr.needsUpdate = true;

  // 3. Cinemática Procedural de Caríbdis por Modo
  if (currentMode === 'vortice') {
    // Vórtice Devorador: Corpo erguido, braços abertos, rugido para os céus
    charybdis.body.position.y = 1.9 + Math.sin(t * 3.8) * 0.14;
    charybdis.torso.rotation.x = -0.18 + Math.sin(t * 2.5) * 0.06;
    charybdis.jawPivot.rotation.x = 0.45 + Math.sin(t * 6) * 0.12; // Boca totalmente aberta
    charybdis.mouthCore.scale.setScalar(1.6 + Math.sin(t * 12) * 0.3);

    charybdis.armL.rotation.set(-0.6, 0.4, 0.85);
    charybdis.armR.rotation.set(-0.6, -0.4, -0.85);
    charybdis.clawUpper.rotation.z = 0.55 + Math.sin(t * 8) * 0.25;
    charybdis.clawLower.rotation.z = -0.55 - Math.sin(t * 8) * 0.25;

    charybdis.breathBeam.material.opacity = 0.0;
    abyssCoreLight.intensity = 14 + Math.sin(t * 14) * 4;
  } else if (currentMode === 'sopro') {
    // Sopro Abissal: Disparo de raio volumétrico e energia bioluminescente
    charybdis.body.position.y = 1.65 + Math.sin(t * 2.0) * 0.05;
    charybdis.torso.rotation.x = 0.15 + Math.sin(t * 3.5) * 0.04;
    charybdis.jawPivot.rotation.x = 0.55; // Boca aberta para o disparo
    charybdis.mouthCore.scale.setScalar(2.2 + Math.sin(t * 24) * 0.4);

    charybdis.breathBeam.material.opacity = 0.82 + Math.sin(t * 20) * 0.18;
    charybdis.breathBeam.scale.x = 1.0 + Math.sin(t * 25) * 0.25;
    charybdis.breathBeam.scale.y = 1.0 + Math.sin(t * 25) * 0.25;

    charybdis.armL.rotation.set(0.35, 0.2, 0.4);
    charybdis.armR.rotation.set(0.35, -0.2, -0.4);
    abyssCoreLight.intensity = 16.0;
  } else if (currentMode === 'kraken') {
    // Fúria do Kraken: Garras batendo na água, ataques agressivos
    const beat = t * 6.5;
    charybdis.body.position.y = 1.65 + Math.abs(Math.sin(beat * 0.5)) * 0.18;
    charybdis.torso.rotation.x = Math.sin(beat) * 0.15;
    charybdis.jawPivot.rotation.x = 0.25 + Math.abs(Math.sin(beat)) * 0.2;

    charybdis.armL.rotation.set(-0.4 + Math.sin(beat) * 0.7, 0.1, 0.3);
    charybdis.armR.rotation.set(-0.4 - Math.sin(beat) * 0.7, -0.1, -0.3);
    charybdis.clawUpper.rotation.z = Math.abs(Math.sin(beat * 1.5)) * 0.6;
    charybdis.clawLower.rotation.z = -Math.abs(Math.sin(beat * 1.5)) * 0.6;

    charybdis.breathBeam.material.opacity = 0.0;
    abyssCoreLight.intensity = 9.0;
  } else {
    // Colosso Abissal (Padrão): Respiração imponente, postura de leviatã
    charybdis.body.position.y = 1.65 + Math.sin(t * 1.8) * 0.06;
    charybdis.torso.rotation.x = 0.04 + Math.sin(t * 1.4) * 0.025;
    charybdis.jawPivot.rotation.x = 0.12 + Math.sin(t * 2.2) * 0.06;
    charybdis.mouthCore.scale.setScalar(1.0 + Math.sin(t * 4) * 0.15);

    charybdis.armL.rotation.set(0.12 + Math.sin(t * 1.5) * 0.06, 0.1, 0.35);
    charybdis.armR.rotation.set(0.12 + Math.cos(t * 1.5) * 0.06, -0.1, -0.35);
    charybdis.clawUpper.rotation.z = 0.25 + Math.sin(t * 2.5) * 0.1;
    charybdis.clawLower.rotation.z = -0.25 - Math.sin(t * 2.5) * 0.1;

    charybdis.breathBeam.material.opacity = 0.0;
    abyssCoreLight.intensity = 7.5 + Math.sin(t * 3) * 1.5;
  }

  // 4. Ondulação orgânica dos 4 Tentáculos Dorsais Gigantes
  charybdis.backTentacles.forEach((tent, i) => {
    tent.segs.forEach((seg, sIdx) => {
      const freq = currentMode === 'kraken' ? 5.5 : 2.6;
      const amp = currentMode === 'kraken' ? 0.38 : 0.18;
      seg.pivot.rotation.x = Math.sin(t * freq + seg.phase) * amp;
      seg.pivot.rotation.z = Math.cos(t * freq + seg.phase) * (amp * 0.7);
    });
  });

  // 5. Ondulação dos Tentáculos Barbelos Faciais
  charybdis.faceTentacles.forEach(ft => {
    ft.mesh.rotation.z = ft.side * (0.22 + Math.sin(t * 3.5 + ft.phase) * 0.12);
  });

  // 6. Atualização do Sistema de Partículas de Espuma e Borrifos
  const sPosArr = sprayGeo.attributes.position.array;
  for (let i = 0; i < sprayCount; i++) {
    const v = sprayVel[i];
    sPosArr[i * 3 + 0] += v.vx * dt;
    sPosArr[i * 3 + 1] += v.vy * dt;
    sPosArr[i * 3 + 2] += v.vz * dt;
    v.vy -= 4.2 * dt; // Gravidade
    if (sPosArr[i * 3 + 1] < 0.1) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 1.0 + Math.random() * 2.4;
      sPosArr[i * 3 + 0] = Math.cos(ang) * dist;
      sPosArr[i * 3 + 1] = 0.12;
      sPosArr[i * 3 + 2] = Math.sin(ang) * dist;
      v.vy = (currentMode === 'vortice' ? 3.5 : 1.8) + Math.random() * 3.0;
    }
  }
  sprayGeo.attributes.position.needsUpdate = true;

  // 7. Atualização suave da Câmera Orbital 360°
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) {
    camAngle += dt * 0.06; // Rotação orbital suave ao redor do Titã
  }

  const targetLook = focusFace ? new T.Vector3(0, 3.15, 0.4) : new T.Vector3(0, 2.1, 0);
  currentLookAt.lerp(targetLook, 0.08);

  const hDist = Math.cos(camPitch) * camDist;
  const vDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * hDist,
    currentLookAt.y + vDist,
    currentLookAt.z + Math.cos(camAngle) * hDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
