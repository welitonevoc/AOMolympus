<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Modelo 3D • Ciclope de Zeus (Base & Ciclope Ancião)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080d1a;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <!-- Barra Superior de Controles -->
  <div class="fixed top-3 left-3 right-3 z-10 flex flex-col gap-2 pointer-events-none">
    <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
      <button id="btn-base" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-400 text-slate-950 border border-amber-200 shadow-lg transition hover:brightness-105">
        🔨 Ciclope (Era Clássica)
      </button>
      <button id="btn-elder" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-slate-100 border border-amber-400/50 shadow-lg backdrop-blur transition hover:bg-slate-800">
        ⚡ Vontade de Cronos (Ancião)
      </button>
      <button id="btn-pose" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-sky-200 border border-sky-400/40 shadow-lg backdrop-blur transition hover:bg-slate-800">
        🤾 Pausa / Animação de Golpe
      </button>
      <button id="btn-focus" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-emerald-200 border border-emerald-400/40 shadow-lg backdrop-blur transition hover:bg-slate-800">
        👁️ Focar Rosto & Olho Único
      </button>
    </div>
  </div>

  <!-- Cartão Inferior Informativo -->
  <div class="fixed bottom-11 left-1/2 -translate-x-1/2 z-10 w-[92vw] max-w-xl rounded-2xl bg-slate-950/85 border border-amber-400/40 px-4 py-2.5 text-center backdrop-blur pointer-events-none shadow-xl">
    <div id="info-title" class="text-sm font-bold text-amber-300">Ciclope de Zeus • Modelo 3D (Era Clássica)</div>
    <div id="info-desc" class="text-xs text-slate-300 mt-0.5">Olho central luminoso, chifre frontal, pernas caprinas com cascos, túnica exomis azul-olímpica, escudo hoplon e clava de guerra.</div>
  </div>

  <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-10 rounded-full bg-slate-900/80 border border-white/10 px-4 py-1 text-[11px] text-slate-300 whitespace-nowrap pointer-events-none">
    Arraste para girar 360° • Scroll / Pinça para zoom
  </div>

  <script>
    (function () {
      const T = THREE;

      /* ======================================================================
         1. TEXTURAS PROCEDURAIS (PELAGEM CAPRINA, ARMADURA ESCAMADA & CHÃO)
         ====================================================================== */
      function createGoatFurTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#3b2416';
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 3600; i++) {
          const v = 36 + Math.floor(Math.random() * 40);
          ctx.fillStyle = `rgb(${v + 24}, ${v + 10}, ${v})`;
          ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 11);
        }
        const tex = new T.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = T.RepeatWrapping;
        return tex;
      }

      function createScaleArmorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(0, 0, 512, 512);

        const rows = 16;
        const cols = 14;
        const rH = 512 / rows;
        const cW = 512 / cols;

        for (let r = 0; r < rows; r++) {
          const y = r * rH;
          const offset = (r % 2 === 0) ? 0 : cW * 0.5;
          for (let c = -1; c <= cols; c++) {
            const x = c * cW + offset;
            const grad = ctx.createRadialGradient(x + cW * 0.5, y + rH * 0.35, 2, x + cW * 0.5, y + rH * 0.5, cW * 0.6);
            grad.addColorStop(0, '#f8fafc');
            grad.addColorStop(0.65, '#94a3b8');
            grad.addColorStop(1, '#334155');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x + cW * 0.5, y + rH * 0.5, cW * 0.48, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        const tex = new T.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = T.RepeatWrapping;
        return tex;
      }

      function createArenaTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4d7327';
        ctx.fillRect(0, 0, 1024, 1024);

        for (let i = 0; i < 6000; i++) {
          ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(12,28,6,0.16)';
          ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
        }

        const cx = 512, cy = 512;
        const dirt = ctx.createRadialGradient(cx, cy, 140, cx, cy, 390);
        dirt.addColorStop(0, '#b59462');
        dirt.addColorStop(0.75, '#9e7d4c');
        dirt.addColorStop(1, 'rgba(158, 125, 76, 0)');
        ctx.fillStyle = dirt;
        ctx.fillRect(0, 0, 1024, 1024);

        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(cx, cy, 380, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx, cy, 396, 0, Math.PI * 2);
        ctx.stroke();

        return new T.CanvasTexture(canvas);
      }

      /* ======================================================================
         2. HELPERS DE CONSTRUÇÃO 3D
         ====================================================================== */
      function addGroup(parent, x, y, z) {
        const g = new T.Group();
        g.position.set(x || 0, y || 0, z || 0);
        if (parent) parent.add(g);
        return g;
      }

      function addMesh(parent, geo, mat, pos, rot, scale) {
        const m = new T.Mesh(geo, mat);
        if (pos) m.position.set(pos[0], pos[1], pos[2]);
        if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
        if (scale) m.scale.set(scale[0], scale[1], scale[2]);
        m.castShadow = true;
        m.receiveShadow = true;
        if (parent) parent.add(m);
        return m;
      }

      /* ======================================================================
         3. MODELO 3D DO CICLOPE DE ZEUS
         ====================================================================== */
      function createCyclopsModel(furTex, armorTex) {
        const M = {
          skin: new T.MeshStandardMaterial({ color: 0xb59c6b, roughness: 0.52, metalness: 0.05 }),
          muscle: new T.MeshStandardMaterial({ color: 0xa38958, roughness: 0.55, metalness: 0.05 }),
          fur: new T.MeshStandardMaterial({ map: furTex, roughness: 0.85 }),
          hoof: new T.MeshStandardMaterial({ color: 0x27272a, roughness: 0.45, metalness: 0.2 }),
          tunic: new T.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.62, side: T.DoubleSide }),
          zeusBlue: new T.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x1e3a8a, emissiveIntensity: 0.25, roughness: 0.45 }),
          bronze: new T.MeshStandardMaterial({ color: 0xb45309, metalness: 0.85, roughness: 0.28 }),
          gold: new T.MeshStandardMaterial({ color: 0xfacc15, emissive: 0x451a03, emissiveIntensity: 0.25, metalness: 0.92, roughness: 0.18 }),
          steel: new T.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.92, roughness: 0.20 }),
          wood: new T.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.72 }),
          horn: new T.MeshStandardMaterial({ color: 0xe7e5e4, roughness: 0.35 }),
          scaleArmor: new T.MeshStandardMaterial({ map: armorTex, metalness: 0.85, roughness: 0.25 }),
          crimson: new T.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.45 }),
          eyeWhite: new T.MeshStandardMaterial({ color: 0xfef9c3, roughness: 0.18 }),
          eyeIris: new T.MeshStandardMaterial({ color: 0x1e3a8a, emissive: 0x38bdf8, emissiveIntensity: 1.0, roughness: 0.1 })
        };

        const root = new T.Group();
        const baseOnly = [];
        const elderOnly = [];

        const scaleFactor = 1.32;
        const body = addGroup(root, 0, 1.02 * scaleFactor, 0);
        body.scale.setScalar(scaleFactor);

        // Pelve e pernas caprinas com cascos fendidos
        const pelvis = addGroup(body, 0, 0.86, 0);
        addMesh(pelvis, new T.SphereGeometry(0.28, 18, 16), M.fur, [0, 0, 0], null, [1.18, 0.82, 0.90]);

        const legs = {};
        ['L', 'R'].forEach((side) => {
          const s = side === 'R' ? 1 : -1;
          const hip = addGroup(pelvis, s * 0.19, -0.04, 0);

          addMesh(hip, new T.CylinderGeometry(0.18, 0.13, 0.46, 16), M.fur, [0, -0.22, 0.04], [-0.22, 0, 0]);
          const knee = addGroup(hip, 0, -0.42, 0.08);
          addMesh(knee, new T.CylinderGeometry(0.12, 0.085, 0.44, 14), M.fur, [0, -0.22, -0.04], [0.18, 0, 0]);

          const wrap = addMesh(knee, new T.CylinderGeometry(0.095, 0.092, 0.14, 14), M.zeusBlue, [0, -0.32, -0.06], [0.18, 0, 0]);
          baseOnly.push(wrap);

          const ankle = addGroup(knee, 0, -0.44, -0.06);
          addMesh(ankle, new T.BoxGeometry(0.075, 0.11, 0.18), M.hoof, [-0.042, -0.04, 0.04]);
          addMesh(ankle, new T.BoxGeometry(0.075, 0.11, 0.18), M.hoof, [0.042, -0.04, 0.04]);

          legs[side] = { hip, knee, ankle };
        });

        legs.L.hip.rotation.set(-0.14, -0.10, -0.06);
        legs.R.hip.rotation.set(0.12, 0.10, 0.06);

        // Tronco musculoso
        const torso = addGroup(body, 0, 1.32, 0);
        const torsoPts = [
          new T.Vector2(0.01, -0.44),
          new T.Vector2(0.30, -0.40),
          new T.Vector2(0.28, -0.16),
          new T.Vector2(0.38, 0.08),
          new T.Vector2(0.49, 0.30),
          new T.Vector2(0.42, 0.45),
          new T.Vector2(0.18, 0.52),
          new T.Vector2(0.01, 0.53)
        ];
        addMesh(torso, new T.LatheGeometry(torsoPts, 32), M.skin, null, null, [1.24, 1.04, 0.82]);

        // Relevo de peitorais e abdômen
        addMesh(torso, new T.SphereGeometry(0.22, 16, 14), M.muscle, [-0.20, 0.22, 0.24], [0.1, 0.2, 0], [1.15, 0.85, 0.65]);
        addMesh(torso, new T.SphereGeometry(0.22, 16, 14), M.muscle, [0.20, 0.22, 0.24], [0.1, -0.2, 0], [1.15, 0.85, 0.65]);
        for (let r = 0; r < 3; r++) {
          const ay = -0.04 - r * 0.11;
          addMesh(torso, new T.BoxGeometry(0.11, 0.08, 0.06), M.muscle, [-0.07, ay, 0.31]);
          addMesh(torso, new T.BoxGeometry(0.11, 0.08, 0.06), M.muscle, [0.07, ay, 0.31]);
        }

        // Veste base: Túnica Exomis branca com faixa no ombro esquerdo
        const baseTunic = addGroup(torso, 0, 0, 0);
        addMesh(baseTunic, new T.CylinderGeometry(0.34, 0.42, 0.65, 24), M.tunic, [0, -0.22, 0], null, [1.18, 1.0, 0.84]);
        addMesh(baseTunic, new T.BoxGeometry(0.24, 0.66, 0.44), M.tunic, [-0.22, 0.18, 0.01], [0, 0, 0.42]);
        addMesh(baseTunic, new T.CylinderGeometry(0.065, 0.065, 0.04, 14), M.bronze, [-0.28, 0.40, 0.18], [0.3, 0, -0.3]);
        baseOnly.push(baseTunic);

        // Armadura do Ciclope Ancião (Vontade de Cronos)
        const elderArmor = addGroup(torso, 0, 0, 0);
        addMesh(elderArmor, new T.LatheGeometry(torsoPts, 32), M.scaleArmor, [0, 0.01, 0], null, [1.26, 1.05, 0.85]);
        addMesh(elderArmor, new T.BoxGeometry(0.32, 0.36, 0.06), M.crimson, [0, 0.18, 0.33]);
        addMesh(elderArmor, new T.BoxGeometry(0.36, 0.40, 0.04), M.gold, [0, 0.18, 0.32]);
        [-1, 1].forEach((side) => {
          addMesh(elderArmor, new T.ConeGeometry(0.24, 0.42, 5), M.gold, [side * 0.48, 0.46, 0], [0, 0, side * -0.85], [1.0, 1.0, 1.3]);
        });
        addMesh(elderArmor, new T.CylinderGeometry(0.35, 0.52, 0.62, 24), M.tunic, [0, -0.45, 0], null, [1.18, 1.0, 0.86]);
        addMesh(elderArmor, new T.CylinderGeometry(0.51, 0.54, 0.10, 24), M.crimson, [0, -0.72, 0], null, [1.18, 1.0, 0.86]);
        for (let p = -2; p <= 2; p++) {
          addMesh(elderArmor, new T.BoxGeometry(0.11, 0.52, 0.04), M.gold, [p * 0.12, -0.44, 0.36], [-0.14, 0, 0]);
        }
        elderArmor.visible = false;
        elderOnly.push(elderArmor);

        // Cabeça com um único olho central, chifre frontal, presas e orelhas pontudas
        addMesh(torso, new T.CylinderGeometry(0.16, 0.20, 0.22, 18), M.skin, [0, 0.54, 0]);

        const head = addGroup(torso, 0, 0.78, 0.04);
        addMesh(head, new T.SphereGeometry(0.22, 24, 24), M.skin, [0, 0.02, 0], null, [0.94, 1.15, 1.02]);
        addMesh(head, new T.BoxGeometry(0.28, 0.16, 0.26), M.skin, [0, -0.10, 0.06]);
        addMesh(head, new T.BoxGeometry(0.26, 0.055, 0.10), M.muscle, [0, 0.09, 0.19]);

        const eyeGroup = addGroup(head, 0, 0.035, 0.21);
        addMesh(eyeGroup, new T.SphereGeometry(0.058, 16, 16), M.eyeWhite, null, null, [1.35, 0.78, 0.65]);
        addMesh(eyeGroup, new T.SphereGeometry(0.032, 14, 14), M.eyeIris, [0, 0, 0.024], null, [1.0, 1.0, 0.6]);

        [-1, 1].forEach((side) => {
          addMesh(head, new T.ConeGeometry(0.022, 0.08, 5), M.horn, [side * 0.085, -0.10, 0.20], [0.15, 0, side * -0.18]);
          addMesh(head, new T.ConeGeometry(0.045, 0.16, 5), M.skin, [side * 0.22, 0.02, -0.02], [0, 0, side * -1.1]);
        });
        addMesh(head, new T.ConeGeometry(0.065, 0.28, 10), M.horn, [0, 0.28, 0.06], [0.22, 0, 0]);

        // Braços, clava de guerra, bidente ancião e escudo hoplon
        function buildArm(isRight) {
          const s = isRight ? 1 : -1;
          const arm = addGroup(torso, s * 0.52, 0.34, 0);
          addMesh(arm, new T.SphereGeometry(0.165, 16, 16), M.skin, [0, -0.01, 0]);
          addMesh(arm, new T.CylinderGeometry(0.125, 0.105, 0.34, 16), M.skin, [s * 0.02, -0.18, 0], [0, 0, s * 0.06]);

          const elbow = addGroup(arm, s * 0.04, -0.36, 0);
          addMesh(elbow, new T.CylinderGeometry(0.105, 0.082, 0.34, 16), M.skin, [0, -0.16, 0]);

          const wBase = addMesh(elbow, new T.CylinderGeometry(0.095, 0.086, 0.14, 16), M.zeusBlue, [0, -0.25, 0]);
          baseOnly.push(wBase);

          const wElder = addMesh(elbow, new T.CylinderGeometry(0.098, 0.088, 0.18, 16), M.bronze, [0, -0.24, 0]);
          wElder.visible = false;
          elderOnly.push(wElder);

          const hand = addGroup(elbow, 0, -0.35, 0);
          addMesh(hand, new T.BoxGeometry(0.11, 0.12, 0.08), M.skin, [0, -0.02, 0]);
          return { arm, elbow, hand };
        }

        const rightArm = buildArm(true);
        const leftArm = buildArm(false);

        // Clava de ferro pontiaguda (Base)
        const club = addGroup(rightArm.hand, 0, -0.04, 0.04);
        club.rotation.set(Math.PI / 2, 0, 0);
        addMesh(club, new T.CylinderGeometry(0.028, 0.032, 1.35, 10), M.wood, [0, 0.35, 0]);
        addMesh(club, new T.CylinderGeometry(0.095, 0.045, 0.45, 6), M.steel, [0, 0.95, 0]);
        addMesh(club, new T.ConeGeometry(0.095, 0.24, 6), M.steel, [0, 1.29, 0]);
        baseOnly.push(club);

        // Bidente gigante (Ancião)
        const elderFork = addGroup(rightArm.hand, 0, -0.04, 0.04);
        elderFork.rotation.set(Math.PI / 2, 0, 0);
        addMesh(elderFork, new T.CylinderGeometry(0.026, 0.028, 2.25, 10), M.wood, [0, 0.55, 0]);
        addMesh(elderFork, new T.BoxGeometry(0.32, 0.05, 0.05), M.steel, [0, 1.55, 0]);
        addMesh(elderFork, new T.ConeGeometry(0.035, 0.42, 4), M.steel, [0, 1.78, 0]);
        [-1, 1].forEach((side) => {
          addMesh(elderFork, new T.ConeGeometry(0.032, 0.48, 4), M.steel, [side * 0.14, 1.80, 0]);
        });
        elderFork.visible = false;
        elderOnly.push(elderFork);

        // Escudo Hoplon no braço esquerdo
        const shield = addGroup(leftArm.elbow, -0.09, -0.22, 0.02);
        shield.rotation.set(0, -Math.PI / 2, 0);
        addMesh(shield, new T.CylinderGeometry(0.55, 0.55, 0.06, 24), M.bronze, null, [Math.PI / 2, 0, 0]);
        addMesh(shield, new T.TorusGeometry(0.52, 0.032, 8, 32), M.zeusBlue, [0, 0, 0.03]);
        baseOnly.push(shield);

        // Anel de aura no chão
        const aura = new T.Mesh(
          new T.RingGeometry(0.95, 1.25, 48),
          new T.MeshBasicMaterial({
            color: 0xfacc15,
            transparent: true,
            opacity: 0.35,
            blending: T.AdditiveBlending,
            side: T.DoubleSide,
            depthWrite: false
          })
        );
        aura.rotation.x = -Math.PI / 2;
        aura.position.y = 0.025;
        root.add(aura);

        let elderActive = false;
        function setElder(flag) {
          elderActive = !!flag;
          baseOnly.forEach((p) => { p.visible = !elderActive; });
          elderOnly.forEach((p) => { p.visible = elderActive; });
          aura.material.color.setHex(elderActive ? 0xef4444 : 0xfacc15);
          aura.scale.setScalar(elderActive ? 1.22 : 1.0);
        }

        return {
          root,
          body,
          torso,
          legs,
          rightArm,
          leftArm,
          aura,
          scaleFactor,
          setElder,
          isElder: () => elderActive
        };
      }

      /* ======================================================================
         4. CENA, LUZES, ARENA E CONTROLES DE CÂMERA 360°
         ====================================================================== */
      const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.appendChild(renderer.domElement);

      const scene = new T.Scene();
      scene.background = new T.Color(0x0c1a30);
      scene.fog = new T.FogExp2(0x0c1a30, 0.016);

      const camera = new T.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);

      scene.add(new T.HemisphereLight(0xfef9c3, 0x1e3a8a, 1.18));

      const sun = new T.DirectionalLight(0xfffbeb, 2.35);
      sun.position.set(5.8, 10.2, 6.5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      scene.add(sun);

      const rim = new T.DirectionalLight(0x38bdf8, 1.5);
      rim.position.set(-5.0, 5.0, -5.5);
      scene.add(rim);

      const furTex = createGoatFurTexture();
      const armorTex = createScaleArmorTexture();
      const arenaTex = createArenaTexture();

      const floor = addMesh(
        scene,
        new T.CylinderGeometry(8.5, 8.8, 0.32, 64),
        new T.MeshStandardMaterial({ map: arenaTex, roughness: 0.75, metalness: 0.05 }),
        [0, -0.16, 0]
      );
      void floor;

      const marble = new T.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.45 });
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI + ((i - 2.5) / 5) * Math.PI * 0.85;
        const col = addGroup(scene, Math.cos(angle) * 6.8, 0, Math.sin(angle) * 6.8);
        addMesh(col, new T.BoxGeometry(0.7, 0.14, 0.7), marble, [0, 0.07, 0]);
        addMesh(col, new T.CylinderGeometry(0.22, 0.26, 2.7, 16), marble, [0, 1.5, 0]);
        addMesh(col, new T.BoxGeometry(0.64, 0.14, 0.64), marble, [0, 2.9, 0]);
      }

      const cyclops = createCyclopsModel(furTex, armorTex);
      scene.add(cyclops.root);

      // UI e interações
      const btnBase = document.getElementById('btn-base');
      const btnElder = document.getElementById('btn-elder');
      const btnPose = document.getElementById('btn-pose');
      const btnFocus = document.getElementById('btn-focus');
      const infoTitle = document.getElementById('info-title');
      const infoDesc = document.getElementById('info-desc');

      let animateStrike = true;
      let focusEye = false;

      btnBase.addEventListener('click', () => {
        cyclops.setElder(false);
        btnBase.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-400 text-slate-950 border border-amber-200 shadow-lg transition';
        btnElder.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-slate-100 border border-amber-400/50 shadow-lg backdrop-blur transition hover:bg-slate-800';
        infoTitle.textContent = 'Ciclope de Zeus • Modelo 3D (Era Clássica)';
        infoDesc.textContent = 'Olho central luminoso, chifre frontal, pernas caprinas com cascos, túnica exomis azul-olímpica, escudo hoplon e clava de guerra.';
      });

      btnElder.addEventListener('click', () => {
        cyclops.setElder(true);
        btnElder.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-red-600 text-white border border-amber-200 shadow-lg transition';
        btnBase.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900/90 text-slate-100 border border-amber-400/50 shadow-lg backdrop-blur transition hover:bg-slate-800';
        infoTitle.textContent = 'Ciclope Ancião • Tecnologia: Vontade de Cronos';
        infoDesc.textContent = 'Armadura escamada em prata e ouro, brasão carmesim, ombreiras pontiagudas, saia laminada e bidente gigante.';
      });

      let camAngle = 0.68;
      let camPitch = 0.28;
      let camDist = 7.8;
      let targetDist = 7.8;
      let lookAt = new T.Vector3(0, 1.9, 0);

      btnPose.addEventListener('click', () => {
        animateStrike = !animateStrike;
        btnPose.textContent = animateStrike ? '🤾 Pausa / Animação de Golpe' : '▶️ Retomar Animação';
      });

      btnFocus.addEventListener('click', () => {
        focusEye = !focusEye;
        btnFocus.textContent = focusEye ? '🌐 Visão Completa' : '👁️ Focar Rosto & Olho Único';
        targetDist = focusEye ? 3.4 : 7.8;
        if (focusEye) {
          camAngle = 0.22;
          camPitch = 0.12;
        }
      });

      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      let pinchDist = 0;

      renderer.domElement.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener('pointerup', () => {
        dragging = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        camAngle -= (e.clientX - lastX) * 0.009;
        camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.15, 0.95);
        lastX = e.clientX;
        lastY = e.clientY;
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        targetDist = T.MathUtils.clamp(targetDist + e.deltaY * 0.006, 2.2, 16.0);
      }, { passive: false });

      renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          targetDist = T.MathUtils.clamp(targetDist + (pinchDist - dist) * 0.018, 2.2, 16.0);
          pinchDist = dist;
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new T.Clock();
      let elapsed = 0;
      let strikeCycle = 0;

      function animate() {
        const dt = Math.min(clock.getDelta(), 0.05);
        elapsed += dt;

        const breath = Math.sin(elapsed * 2.0) * 0.03;
        cyclops.body.position.y = 1.02 * cyclops.scaleFactor + breath;
        cyclops.aura.rotation.z += dt * 0.4;

        if (animateStrike) {
          strikeCycle = (strikeCycle + dt * 0.75) % 1.0;
          if (strikeCycle < 0.45) {
            const p = strikeCycle / 0.45;
            cyclops.torso.rotation.set(-0.10 * p, -0.35 * p, 0);
            cyclops.rightArm.arm.rotation.set(-2.0 * p - 0.35 * (1 - p), 0.15, 0.32);
            cyclops.rightArm.elbow.rotation.set(-0.7 * p, 0, 0);
          } else if (strikeCycle < 0.75) {
            const p = (strikeCycle - 0.45) / 0.30;
            const slam = Math.sin(p * Math.PI * 0.5);
            cyclops.torso.rotation.set(-0.10 + 0.32 * slam, -0.35 + 0.72 * slam, 0);
            cyclops.rightArm.arm.rotation.set(-2.0 + 1.65 * slam, 0.12, 0.25);
            cyclops.rightArm.elbow.rotation.set(-0.7 + 0.5 * slam, 0, 0);
          } else {
            const rem = 1 - (strikeCycle - 0.75) / 0.25;
            cyclops.torso.rotation.set(0.22 * rem, 0.37 * rem, 0);
            cyclops.rightArm.arm.rotation.set(-0.35, 0.15, 0.30);
            cyclops.rightArm.elbow.rotation.set(-0.35, 0, 0);
          }
          cyclops.leftArm.arm.rotation.set(-0.42, -0.22, -0.34);
          cyclops.leftArm.elbow.rotation.set(-0.6, 0, 0);
        } else {
          cyclops.torso.rotation.set(0.02, Math.sin(elapsed * 0.6) * 0.08, 0);
          cyclops.rightArm.arm.rotation.set(-0.35, 0.15, 0.30);
          cyclops.rightArm.elbow.rotation.set(-0.4, 0, 0);
          cyclops.leftArm.arm.rotation.set(-0.35, -0.2, -0.32);
          cyclops.leftArm.elbow.rotation.set(-0.55, 0, 0);
        }

        camDist = T.MathUtils.lerp(camDist, targetDist, 0.12);
        if (!dragging && !focusEye) {
          camAngle += dt * 0.06;
        }

        const desiredTarget = focusEye
          ? new T.Vector3(0, 3.15 + breath, 0)
          : new T.Vector3(0, 1.9 + breath * 0.5, 0);
        lookAt.lerp(desiredTarget, 0.13);

        const hDist = Math.cos(camPitch) * camDist;
        const vDist = Math.sin(camPitch) * camDist;
        camera.position.set(
          lookAt.x + Math.sin(camAngle) * hDist,
          lookAt.y + vDist,
          lookAt.z + Math.cos(camAngle) * hDist
        );
        camera.lookAt(lookAt);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      window.onload = function () {
        animate();
      };
      if (document.readyState === 'complete') {
        animate();
      }
    })();
  </script>
</body>
</html>
