<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hades - Senhor do Submundo | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --soul: #10b981;
      --tartarus: #9333ea;
      --bronze: #b45309;
      --obsidian: #050508;
      --glass: rgba(10, 10, 16, 0.82);
      --border: rgba(16, 185, 129, 0.38);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--obsidian);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #ecfdf5;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #34d399;
      transform: translateY(-1px);
      background: rgba(18, 22, 32, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #10b981 0%, #6d28d9 100%);
      color: #ffffff;
      border-color: #6ee7b7;
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.5);
    }
    button.cam-btn {
      border-color: rgba(180, 83, 9, 0.65);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #d97706 0%, #78350f 100%);
      color: #fef3c7;
      border-color: #fcd34d;
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 880px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 8, 14, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 211, 153, 0.28);
      padding: 7px 16px;
      border-radius: 999px;
      color: #d1fae5;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="reinar" class="on">Reinar</button>
    <button data-m="marcha">Marcha Sombria</button>
    <button data-m="chama">Chama do Tártaro</button>
    <button data-m="portal">Portal das Almas</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto / Corpo</button>
  </div>
</div>

<div id="badge">Olympus • Hades</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE DE CINZA PÁLIDA, OBSIDIANA E VESTES)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map de pele marmórea/cinzenta
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6500; i++) {
    const v = 122 + Math.floor(Math.random() * 14);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Túnica Real do Submundo (obsidiana e carmesim profundo com borda de bronze e runas)
  const tunicCanvas = document.createElement('canvas');
  tunicCanvas.width = 512;
  tunicCanvas.height = 256;
  const tCtx = tunicCanvas.getContext('2d');
  const grad = tCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#09090b');
  grad.addColorStop(0.55, '#181024');
  grad.addColorStop(1, '#3b0718');
  tCtx.fillStyle = grad;
  tCtx.fillRect(0, 0, 512, 256);

  // Textura de trama sombria
  tCtx.strokeStyle = 'rgba(147, 51, 234, 0.14)';
  tCtx.lineWidth = 2;
  for (let y = 12; y < 200; y += 20) {
    tCtx.beginPath();
    tCtx.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) {
      tCtx.lineTo(x + 16, y + 6);
      tCtx.lineTo(x + 32, y);
    }
    tCtx.stroke();
  }

  // Barra ornamentada de bronze envelhecido e runas necromânticas verdes
  tCtx.fillStyle = '#78350f';
  tCtx.fillRect(0, 204, 512, 36);
  tCtx.fillStyle = '#050508';
  tCtx.fillRect(0, 202, 512, 3);
  tCtx.fillRect(0, 240, 512, 3);
  for (let x = 0; x < 512; x += 32) {
    tCtx.strokeStyle = '#10b981';
    tCtx.lineWidth = 2.5;
    tCtx.beginPath();
    tCtx.moveTo(x + 16, 209);
    tCtx.lineTo(x + 25, 222);
    tCtx.lineTo(x + 16, 235);
    tCtx.lineTo(x + 7, 222);
    tCtx.closePath();
    tCtx.stroke();
  }
  const tunicTex = new T.CanvasTexture(tunicCanvas);
  tunicTex.wrapS = tunicTex.wrapT = T.RepeatWrapping;

  // 1.3 Chão e Pilares de Obsidiana e Basalto Rachado com veios de energia
  const obsCanvas = document.createElement('canvas');
  obsCanvas.width = obsCanvas.height = 512;
  const oCtx = obsCanvas.getContext('2d');
  oCtx.fillStyle = '#0b0c12';
  oCtx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2400; i++) {
    oCtx.fillStyle = i % 2 === 0 ? 'rgba(30, 32, 48, 0.25)' : 'rgba(2, 2, 5, 0.45)';
    oCtx.fillRect(Math.random() * 512, Math.random() * 512, 8, 8);
  }
  // Fissuras arcanas brilhando sutilmente
  for (let i = 0; i < 24; i++) {
    oCtx.strokeStyle = i % 3 === 0 ? 'rgba(16, 185, 129, 0.28)' : 'rgba(126, 34, 206, 0.24)';
    oCtx.lineWidth = 1.8;
    oCtx.beginPath();
    let cx = Math.random() * 512, cy = Math.random() * 512;
    oCtx.moveTo(cx, cy);
    for (let s = 0; s < 6; s++) {
      cx += (Math.random() - 0.5) * 70;
      cy += (Math.random() - 0.5) * 70;
      oCtx.lineTo(cx, cy);
    }
    oCtx.stroke();
  }
  const obsidianTex = new T.CanvasTexture(obsCanvas);
  obsidianTex.wrapS = obsidianTex.wrapT = T.RepeatWrapping;
  obsidianTex.repeat.set(3, 3);

  // 1.4 Textura procedural de névoa/fumaça sombria
  const smokeCanvas = document.createElement('canvas');
  smokeCanvas.width = smokeCanvas.height = 256;
  const smCtx = smokeCanvas.getContext('2d');
  smCtx.fillStyle = '#07070c';
  smCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 750; i++) {
    const r = 6 + Math.random() * 24;
    const grd = smCtx.createRadialGradient(
      Math.random() * 256, Math.random() * 256, 1,
      Math.random() * 256, Math.random() * 256, r
    );
    grd.addColorStop(0, i % 4 === 0 ? 'rgba(16, 185, 129, 0.18)' : 'rgba(88, 28, 135, 0.22)');
    grd.addColorStop(1, 'rgba(5, 5, 8, 0)');
    smCtx.fillStyle = grd;
    smCtx.fillRect(0, 0, 256, 256);
  }
  const smokeTex = new T.CanvasTexture(smokeCanvas);
  smokeTex.wrapS = smokeTex.wrapT = T.RepeatWrapping;
  smokeTex.repeat.set(2, 2);

  return { skinBump, tunicTex, obsidianTex, smokeTex };
}

/* ==========================================================================
   2. HELPERS DE GEOMETRIA E MATERIAIS DO SUBMUNDO
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skinAsh: new T.MeshStandardMaterial({
      color: 0x8b95a5,          // Pele pálida de cinza e mármore frio
      roughness: 0.42,
      metalness: 0.12,
      bumpMap: textures.skinBump,
      bumpScale: 0.004
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0x64748b,
      roughness: 0.46,
      metalness: 0.12,
      bumpMap: textures.skinBump,
      bumpScale: 0.004
    }),
    necroticVein: new T.MeshStandardMaterial({
      color: 0x34d399,
      emissive: 0x059669,
      emissiveIntensity: 2.3,
      roughness: 0.2
    }),
    tartarusVein: new T.MeshStandardMaterial({
      color: 0xc084fc,
      emissive: 0x7e22ce,
      emissiveIntensity: 2.1,
      roughness: 0.2
    }),
    hairObsidian: new T.MeshStandardMaterial({
      color: 0x0f111a,
      roughness: 0.45,
      metalness: 0.18
    }),
    hairAshStreak: new T.MeshStandardMaterial({
      color: 0x475569,
      roughness: 0.44,
      metalness: 0.2
    }),
    blackIron: new T.MeshStandardMaterial({
      color: 0x18181b,
      emissive: 0x09090b,
      metalness: 0.92,
      roughness: 0.26
    }),
    tarnishedGold: new T.MeshStandardMaterial({
      color: 0xb45309,
      emissive: 0x291202,
      emissiveIntensity: 0.25,
      metalness: 0.88,
      roughness: 0.28
    }),
    boneSkull: new T.MeshStandardMaterial({
      color: 0xd6d3d1,
      roughness: 0.55,
      metalness: 0.08
    }),
    soulCore: new T.MeshStandardMaterial({
      color: 0x6ee7b7,
      emissive: 0x10b981,
      emissiveIntensity: 3.2,
      roughness: 0.1
    }),
    tunic: new T.MeshStandardMaterial({
      map: textures.tunicTex,
      color: 0xffffff,
      roughness: 0.62,
      metalness: 0.1,
      side: T.DoubleSide
    }),
    shadowCloak: new T.MeshStandardMaterial({
      color: 0x09070e,
      emissive: 0x1e0826,
      emissiveIntensity: 0.35,
      roughness: 0.65,
      metalness: 0.15,
      side: T.DoubleSide
    }),
    eyeSpectral: new T.MeshStandardMaterial({
      color: 0xa7f3d0,
      emissive: 0x10b981,
      emissiveIntensity: 3.8,
      roughness: 0.05
    }),
    shadowVortex: new T.MeshStandardMaterial({
      map: textures.smokeTex,
      color: 0x1e1b4b,
      emissive: 0x3b0764,
      emissiveIntensity: 0.7,
      roughness: 0.85,
      transparent: true,
      opacity: 0.86,
      side: T.DoubleSide
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE HADES + VÓRTICE DE SOMBRAS + BIDENTE REAL DO SUBMUNDO
   ========================================================================== */
function buildHades(textures) {
  const M = createMaterials(textures);

  // Grupo raiz deslizando sobre o chão de obsidiana (y = 0)
  const vessel = new T.Group();

  // ------------------------------------------------------------------------
  // A. VÓRTICE DE FUMAÇA SOMBRIA E ALMAS ORBITANTES SOB OS PÉS
  // ------------------------------------------------------------------------
  const shadowBaseGroup = group(vessel, 0, 0, 0);

  // Cone invertido / coluna espiralada de fumaça sombria que sustenta Hades
  const smokeGeo = new T.CylinderGeometry(0.42, 1.05, 1.25, 36, 16, true);
  const smPos = smokeGeo.attributes.position;
  for (let i = 0; i < smPos.count; i++) {
    const x = smPos.getX(i), y = smPos.getY(i), z = smPos.getZ(i);
    const normY = (y + 0.625) / 1.25;
    const ang = Math.atan2(z, x);
    const swirl = Math.sin(ang * 5 - normY * 6.5) * 0.08 * (1 - normY * 0.35);
    const r = Math.sqrt(x * x + z * z) + swirl;
    smPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
  }
  smokeGeo.computeVertexNormals();
  const shadowCone = new T.Mesh(smokeGeo, M.shadowVortex);
  shadowCone.position.y = 0.58;
  shadowBaseGroup.add(shadowCone);

  // Aura necromântica interna verde-violeta
  const innerMist = new T.Mesh(
    new T.CylinderGeometry(0.28, 0.72, 1.15, 24, 1, true),
    new T.MeshBasicMaterial({
      color: 0x10b981,
      transparent: true,
      opacity: 0.28,
      blending: T.AdditiveBlending,
      depthWrite: false,
      side: T.DoubleSide
    })
  );
  innerMist.position.y = 0.55;
  shadowBaseGroup.add(innerMist);

  // Anel rúnico espectral na base do solo
  const groundAuraRing = new T.Mesh(
    new T.RingGeometry(0.55, 1.18, 48),
    new T.MeshBasicMaterial({
      color: 0x34d399,
      transparent: true,
      opacity: 0.45,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  groundAuraRing.rotation.x = -Math.PI / 2;
  groundAuraRing.position.y = 0.03;
  shadowBaseGroup.add(groundAuraRing);

  // Espíritos / Orbes de Almas orbitando ao redor de Hades
  const orbitingWisps = [];
  for (let i = 0; i < 6; i++) {
    const wisp = new T.Mesh(
      new T.SphereGeometry(0.055, 10, 10),
      new T.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x34d399 : 0xc084fc,
        transparent: true,
        opacity: 0.85,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    shadowBaseGroup.add(wisp);
    orbitingWisps.push({
      mesh: wisp,
      radius: 0.75 + (i % 3) * 0.22,
      height: 0.35 + i * 0.36,
      speed: (i % 2 === 0 ? 1.8 : -1.5),
      phase: (i / 6) * Math.PI * 2
    });
  }

  // ------------------------------------------------------------------------
  // B. CORPO ESGUIO, IMPONENTE E ESCULPIDO DE HADES (y = 1.12)
  // ------------------------------------------------------------------------
  const body = group(vessel, 0, 1.12, 0);

  // Pelve e Pernas esguias e musculosas parcialmente envoltas na névoa
  const pelvis = group(body, 0, 0.94, 0);
  sculpt(pelvis, new T.SphereGeometry(0.24, 22, 20), M.skinAsh, [0, 0, 0], [0, 0, 0], [1.08, 0.75, 0.8]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.16, -0.04, 0);

    // Coxa esguia e definida
    sculpt(hip, new T.CylinderGeometry(0.138, 0.098, 0.52, 20), M.skinAsh, [0, -0.25, 0], [0, 0, 0], [1.0, 1, 1.06]);
    const quadGeo = new T.SphereGeometry(0.106, 16, 16);
    sculpt(hip, quadGeo, M.skinAsh, [s * 0.02, -0.22, 0.048], [0, 0, 0], [0.92, 1.85, 0.84]);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.088, 16, 16), M.skinAsh, [0, -0.52, 0.014]);

    // Panturrilha e Grevas de Ferro Negro e Bronze
    const knee = group(hip, 0, -0.53, 0);
    sculpt(knee, new T.CylinderGeometry(0.088, 0.054, 0.48, 18), M.skinAsh, [0, -0.24, 0]);
    sculpt(knee, new T.SphereGeometry(0.084, 16, 16), M.skinAsh, [0, -0.17, -0.038], [0, 0, 0], [0.95, 1.65, 0.94]);
    sculpt(knee, new T.CylinderGeometry(0.086, 0.058, 0.36, 14, 1, false, -0.85, 1.7), M.blackIron, [0, -0.24, 0.01]);

    // Pé com bota/sandália sombria
    const ankle = group(knee, 0, -0.48, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.092, 0.05, 0.22), M.blackIron, [0, -0.02, 0.04], [0.22, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.098, 0.016, 0.23), M.tarnishedGold, [0, -0.046, 0.04], [0.22, 0, 0]);
    legs[side] = { hip, knee, ankle };
  }

  // Postura flutuante aristocrática e sombria
  legs.R.hip.rotation.set(0.14, 0.05, 0.04);
  legs.R.knee.rotation.set(0.18, 0, 0);
  legs.L.hip.rotation.set(-0.32, -0.06, -0.04);
  legs.L.knee.rotation.set(0.52, 0, 0);

  // ------------------------------------------------------------------------
  // C. TRONCO ESCULPIDO (ALTO, ESGUIO-MUSCULOSO COM VEIAS NECROMÂNTICAS)
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.38, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.46),
    new T.Vector2(0.24, -0.42), // Quadril estreito
    new T.Vector2(0.21, -0.21), // Cintura aristocrática
    new T.Vector2(0.27, 0.04),  // Costelas definidas
    new T.Vector2(0.38, 0.29),  // Ombros largos
    new T.Vector2(0.33, 0.45),  // Clavícula
    new T.Vector2(0.14, 0.52),  // Pescoço
    new T.Vector2(0.01, 0.53)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skinAsh, [0, 0, 0], [0, 0, 0], [1.16, 1.04, 0.70]);

  // Peitorais esculpidos
  const pecGeo = new T.SphereGeometry(0.205, 24, 24);
  sculpt(torso, pecGeo, M.skinAsh, [-0.18, 0.24, 0.155], [0.12, -0.22, -0.14], [1.04, 0.85, 0.56]);
  sculpt(torso, pecGeo, M.skinAsh, [0.18, 0.24, 0.155], [0.12, 0.22, 0.14], [1.04, 0.85, 0.56]);

  // Veias necromânticas brilhando em verde-esmeralda e violeta no peito direito (exposto)
  const chestVein1 = new T.CatmullRomCurve3([
    new T.Vector3(0.33, 0.34, 0.08),
    new T.Vector3(0.22, 0.27, 0.22),
    new T.Vector3(0.13, 0.19, 0.24),
    new T.Vector3(0.16, 0.09, 0.23)
  ]);
  sculpt(torso, new T.TubeGeometry(chestVein1, 16, 0.0065, 6, false), M.necroticVein);

  const chestVein2 = new T.CatmullRomCurve3([
    new T.Vector3(0.22, 0.27, 0.22),
    new T.Vector3(0.27, 0.15, 0.20),
    new T.Vector3(0.21, 0.04, 0.21)
  ]);
  sculpt(torso, new T.TubeGeometry(chestVein2, 12, 0.005, 6, false), M.tartarusVein);

  // Abdômen esculpido (6-pack) e oblíquos
  const abGeo = new T.SphereGeometry(0.082, 16, 16);
  [
    { y: 0.045, sx: 0.96, sy: 0.75, z: 0.198 },
    { y: -0.075, sx: 0.92, sy: 0.78, z: 0.194 },
    { y: -0.195, sx: 0.84, sy: 0.84, z: 0.184 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skinAsh, [-0.068, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.46]);
    sculpt(torso, abGeo, M.skinAsh, [0.068, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.46]);
  });

  const obliqueGeo = new T.CapsuleGeometry(0.074, 0.23, 10, 16);
  sculpt(torso, obliqueGeo, M.skinAsh, [-0.235, -0.11, 0.08], [0.1, 0, -0.18], [0.85, 1, 0.85]);
  sculpt(torso, obliqueGeo, M.skinAsh, [0.235, -0.11, 0.08], [0.1, 0, 0.18], [0.85, 1, 0.85]);

  // Dorsais, Trapézio e Pescoço esguio
  const latGeo = new T.SphereGeometry(0.225, 20, 20);
  sculpt(torso, latGeo, M.skinAsh, [-0.20, 0.18, -0.11], [0, 0, -0.25], [1.0, 1.35, 0.64]);
  sculpt(torso, latGeo, M.skinAsh, [0.20, 0.18, -0.11], [0, 0, 0.25], [1.0, 1.35, 0.64]);

  const trapGeo = new T.SphereGeometry(0.205, 18, 18);
  sculpt(torso, trapGeo, M.skinAsh, [-0.175, 0.43, -0.04], [0, 0, 0.42], [1.1, 0.65, 0.74]);
  sculpt(torso, trapGeo, M.skinAsh, [0.175, 0.43, -0.04], [0, 0, -0.42], [1.1, 0.65, 0.74]);

  sculpt(torso, new T.CylinderGeometry(0.115, 0.145, 0.27, 20), M.skinAsh, [0, 0.55, -0.01], [0.08, 0, 0], [1, 1, 1.04]);

  // ------------------------------------------------------------------------
  // D. ROSTO ARISTOCRÁTICO, SÓBRIO E MACABRO + ELMO DAS TREVAS (KYNEE)
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.78, 0.036);

  // Crânio alongado com bochechas encovadas, maçãs salientes e queixo pontiagudo
  const skullGeo = new T.SphereGeometry(0.205, 36, 36);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.26; // Face aristocrática alongada
    x *= 0.85; // Rosto fino e encovado
    if (y < 0.03 && y > -0.06 && z > 0) { x *= 1.14; z *= 1.08; } // Maçãs do rosto afiladas
    if (y <= -0.06 && y > -0.14 && z > 0) { x *= 0.84; }          // Bochechas encovadas (gaunt)
    if (y <= -0.14 && z > -0.01) { x *= 0.78; z *= 1.12; }         // Queixo fino e angular
    if (z < -0.12) z *= 0.92;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skinAsh);

  // Maçãs do rosto angulosas e sombras sub-zigomáticas
  const cheekGeo = new T.BoxGeometry(0.058, 0.042, 0.062);
  sculpt(head, cheekGeo, M.skinAsh, [-0.074, -0.008, 0.155], [0.15, -0.48, -0.22]);
  sculpt(head, cheekGeo, M.skinAsh, [0.074, -0.008, 0.155], [0.15, 0.48, 0.22]);

  // Nariz fino, reto e aristocrático
  sculpt(head, new T.BoxGeometry(0.024, 0.096, 0.052), M.skinAsh, [0, 0.006, 0.198], [-0.15, 0, 0]);
  sculpt(head, new T.ConeGeometry(0.018, 0.036, 10), M.skinAsh, [0, -0.044, 0.214], [1.45, 0, 0]);

  // Sobrancelhas severas e arqueadas de soberano implacável
  const browRidge = new T.CapsuleGeometry(0.015, 0.068, 8, 12);
  sculpt(head, browRidge, M.skinShade, [-0.05, 0.048, 0.184], [0.12, 0.25, 1.26]);
  sculpt(head, browRidge, M.skinShade, [0.05, 0.048, 0.184], [0.12, -0.25, -1.26]);

  const eyebrow = new T.CapsuleGeometry(0.012, 0.068, 8, 12);
  sculpt(head, eyebrow, M.hairObsidian, [-0.05, 0.055, 0.193], [0.12, 0.25, 1.22], [1.1, 1, 0.85]);
  sculpt(head, eyebrow, M.hairObsidian, [0.05, 0.055, 0.193], [0.12, -0.25, -1.22], [1.1, 1, 0.85]);

  // Olhos espectrais brilhando em verde-esmeralda frio nas órbitas sombreadas
  const eyeGeo = new T.SphereGeometry(0.019, 16, 16);
  sculpt(head, eyeGeo, M.eyeSpectral, [-0.05, 0.025, 0.178], [0, 0, 0], [1.15, 0.64, 0.8]);
  sculpt(head, eyeGeo, M.eyeSpectral, [0.05, 0.025, 0.178], [0, 0, 0], [1.15, 0.64, 0.8]);

  const eyelidGeo = new T.BoxGeometry(0.048, 0.013, 0.028);
  sculpt(head, eyelidGeo, M.skinShade, [-0.05, 0.034, 0.188], [0.18, 0.22, -0.2]);
  sculpt(head, eyelidGeo, M.skinShade, [0.05, 0.034, 0.188], [0.18, -0.22, 0.2]);

  // Lábios finos e sérios
  sculpt(head, new T.CapsuleGeometry(0.01, 0.044, 8, 12), M.skinShade, [0, -0.095, 0.192], [0, 0, Math.PI / 2], [1, 1, 0.75]);

  // Barba pontiaguda de monarca sombrio (cavanhaque real afilado + bigode fino)
  const stacheL = new T.CatmullRomCurve3([
    new T.Vector3(-0.008, -0.072, 0.20),
    new T.Vector3(-0.045, -0.084, 0.192),
    new T.Vector3(-0.062, -0.125, 0.172)
  ]);
  const stacheR = new T.CatmullRomCurve3([
    new T.Vector3(0.008, -0.072, 0.20),
    new T.Vector3(0.045, -0.084, 0.192),
    new T.Vector3(0.062, -0.125, 0.172)
  ]);
  sculpt(head, new T.TubeGeometry(stacheL, 12, 0.013, 8, false), M.hairObsidian);
  sculpt(head, new T.TubeGeometry(stacheR, 12, 0.013, 8, false), M.hairObsidian);

  // Cavanhaque longo e pontiagudo em ferro/obsidiana com mechas cinzas
  const goateeGeo = new T.ConeGeometry(0.044, 0.28, 14);
  goateeGeo.rotateX(Math.PI);
  const beardTip = sculpt(head, goateeGeo, M.hairObsidian, [0, -0.23, 0.175], [-0.14, 0, 0], [0.95, 1, 0.78]);
  sculpt(head, goateeGeo, M.hairAshStreak, [0, -0.21, 0.168], [-0.12, 0, 0], [0.72, 0.9, 0.72]);

  // Cabelos longos e lisos/ondulados negros com mechas cinzentas caindo pelas costas
  sculpt(head, new T.SphereGeometry(0.208, 24, 24), M.hairObsidian, [0, 0.055, -0.02], [-0.1, 0, 0], [0.96, 1.04, 1.06]);
  const hairStrands = [];
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 1.55 + Math.PI * 0.72;
    const r = 0.18;
    const sx = Math.sin(angle) * r;
    const sz = Math.cos(angle) * r - 0.01;
    const sy = 0.085 + Math.cos(angle * 2) * 0.02;
    const len = 0.56 + (i % 3) * 0.08;
    const pts = [];
    for (let k = 0; k <= 6; k++) {
      const t = k / 6;
      const flare = 1 + t * 0.34;
      pts.push(new T.Vector3(
        sx * flare + Math.sin(t * Math.PI * 2.0 + i) * 0.026,
        sy - t * len,
        sz * flare - t * 0.15
      ));
    }
    const tube = new T.TubeGeometry(new T.CatmullRomCurve3(pts), 14, 0.031 * (1 - 0.15 * (i % 2)), 8, false);
    const strand = sculpt(head, tube, i % 4 === 0 ? M.hairAshStreak : M.hairObsidian);
    hairStrands.push({ mesh: strand, phase: i * 0.42 });
  }

  // COROA-ELMO DAS TREVAS (KYNEE) — Ferro Negro, Pontas Góticas e Chifres Curvos
  const crown = group(head, 0, 0.125, 0.008);
  crown.rotation.x = 0.14;

  // Diadema frontal de ferro negro e bronze envelhecido
  const crownBase = new T.CylinderGeometry(0.198, 0.192, 0.055, 32, 1, true);
  sculpt(crown, crownBase, M.blackIron, [0, 0, 0], [0, 0, 0], [0.94, 1, 1.06]);

  // Pontas de coroa macabra ao redor da cabeça (pontas frontais mais altas)
  for (let i = 0; i < 9; i++) {
    const ang = ((i - 4) / 4) * Math.PI * 0.75;
    const isCenter = i === 4;
    const hSpike = isCenter ? 0.22 : (0.14 - Math.abs(i - 4) * 0.015);
    sculpt(
      crown,
      new T.ConeGeometry(isCenter ? 0.028 : 0.02, hSpike, 5),
      isCenter ? M.tarnishedGold : M.blackIron,
      [Math.sin(ang) * 0.186, 0.025 + hSpike * 0.45, Math.cos(ang) * 0.208],
      [0.12, ang, 0],
      [0.85, 1, 0.45]
    );
  }
  // Gema espectral incrustada no centro da coroa
  sculpt(crown, new T.OctahedronGeometry(0.022, 0), M.soulCore, [0, 0.015, 0.214], [0, 0, 0], [0.75, 1.35, 0.6]);

  // Chifres sombrios curvados para trás nas laterais do Elmo das Trevas
  for (const side of [-1, 1]) {
    const hornCurve = new T.CatmullRomCurve3([
      new T.Vector3(side * 0.185, 0.02, 0.02),
      new T.Vector3(side * 0.245, 0.11, -0.06),
      new T.Vector3(side * 0.215, 0.24, -0.18),
      new T.Vector3(side * 0.155, 0.31, -0.26)
    ]);
    sculpt(crown, new T.TubeGeometry(hornCurve, 16, 0.022, 8, false), M.blackIron);
    sculpt(crown, new T.ConeGeometry(0.022, 0.09, 8), M.tarnishedGold, [side * 0.145, 0.33, -0.28], [-0.85, 0, side * 0.35]);
  }

  // ------------------------------------------------------------------------
  // E. BRAÇOS MUSCULOSOS + OMBREIRA DE CRÂNIO ESCULPIDO NO OMBRO ESQUERDO
  // ------------------------------------------------------------------------
  function createHadesArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.43, 0.35, -0.01);

    // Deltoide
    sculpt(arm, new T.SphereGeometry(0.14, 20, 20), M.skinAsh, [0, 0, 0], [0, 0, s * -0.25], [1.04, 1.15, 1.04]);

    // Bíceps e Tríceps
    sculpt(arm, new T.CapsuleGeometry(0.09, 0.28, 12, 18), M.skinAsh, [s * 0.024, -0.185, 0], [0, 0, s * 0.08]);
    sculpt(arm, new T.SphereGeometry(0.084, 16, 16), M.skinAsh, [s * 0.016, -0.175, 0.044], [0, 0, s * 0.08], [0.92, 1.45, 0.92]);
    sculpt(arm, new T.SphereGeometry(0.082, 16, 16), M.skinAsh, [s * 0.05, -0.185, -0.038], [0, 0, s * 0.08], [0.95, 1.4, 0.9]);

    // Antebraço
    const elbow = group(arm, s * 0.044, -0.37, 0);
    sculpt(elbow, new T.CylinderGeometry(0.085, 0.054, 0.34, 18), M.skinAsh, [0, -0.16, 0], [0, 0, 0], [1.04, 1, 0.95]);
    sculpt(elbow, new T.SphereGeometry(0.068, 14, 14), M.skinAsh, [s * 0.018, -0.09, 0.02], [0, 0, 0], [0.95, 1.5, 0.95]);

    // Braçadeira pontiaguda de Ferro Negro e Bronze
    const bracer = group(elbow, 0, -0.26, 0);
    sculpt(bracer, new T.CylinderGeometry(0.068, 0.059, 0.11, 24, 1, true), M.blackIron, [0, 0, 0], [0, 0, 0], [1.05, 1, 0.96]);
    const bRing = new T.TorusGeometry(0.065, 0.006, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.tarnishedGold, [0, 0.05, 0], [0, 0, 0], [1.05, 1, 0.96]);
    sculpt(bracer, bRing, M.tarnishedGold, [0, -0.05, 0], [0, 0, 0], [1.05, 1, 0.96]);
    // Espigão lateral na braçadeira
    sculpt(bracer, new T.ConeGeometry(0.016, 0.075, 6), M.blackIron, [s * 0.078, 0.01, -0.01], [0, 0, -s * 1.35]);

    // Mão com dedos articulados
    const hand = group(elbow, 0, -0.35, 0);
    sculpt(hand, new T.BoxGeometry(0.072, 0.082, 0.036), M.skinAsh, [0, -0.02, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.01, 0.04, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.017;
      sculpt(hand, fingerGeo, M.skinAsh, [fx, -0.065, 0.018], [isRight ? 1.25 : 0.35, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skinAsh, [-s * 0.04, -0.032, 0.022], [0.6, 0, -s * 0.65], [1.1, 0.9, 1.1]);

    return { arm, elbow, hand };
  }

  const rightArm = createHadesArm(true);
  const leftArm = createHadesArm(false);

  // OMBREIRA DE CRÂNIO ESCULPIDO NO OMBRO ESQUERDO
  const skullPauldron = group(leftArm.arm, -0.04, 0.05, 0);
  skullPauldron.rotation.set(0.08, 0.15, 0.32);

  // Placa base de ferro negro
  sculpt(
    skullPauldron,
    new T.SphereGeometry(0.185, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
    M.blackIron,
    [0, 0.02, 0],
    [0, 0, 0],
    [1.12, 0.78, 1.16]
  );

  // Crânio esculpido sobre a ombreira
  const skullMotif = group(skullPauldron, -0.03, 0.08, 0.04);
  skullMotif.rotation.set(0.25, -0.35, 0.15);
  sculpt(skullMotif, new T.SphereGeometry(0.085, 16, 16), M.boneSkull, [0, 0.02, 0], [0, 0, 0], [0.95, 1.05, 1.05]);
  sculpt(skullMotif, new T.BoxGeometry(0.072, 0.055, 0.065), M.boneSkull, [0, -0.035, 0.035]);
  // Órbitas oculares brilhando em verde necromântico
  sculpt(skullMotif, new T.SphereGeometry(0.018, 10, 10), M.eyeSpectral, [-0.026, 0.0, 0.072]);
  sculpt(skullMotif, new T.SphereGeometry(0.018, 10, 10), M.eyeSpectral, [0.026, 0.0, 0.072]);
  // Chifres laterais na ombreira
  sculpt(skullMotif, new T.ConeGeometry(0.02, 0.13, 6), M.tarnishedGold, [-0.095, 0.04, -0.01], [0, 0, 0.75]);
  sculpt(skullMotif, new T.ConeGeometry(0.02, 0.13, 6), M.tarnishedGold, [0.095, 0.04, -0.01], [0, 0, -0.75]);

  // ------------------------------------------------------------------------
  // F. BIDENTE REAL DE HADES (DUAS PONTAS CURVAS + NÚCLEO DE ALMAS APRISIONADO)
  // ------------------------------------------------------------------------
  const bident = new T.Group();
  rightArm.hand.add(bident);
  bident.position.set(0, -0.04, 0.035);

  // Haste longa de ferro negro e bronze envelhecido (2.92 unidades)
  sculpt(bident, new T.CylinderGeometry(0.025, 0.028, 2.92, 18), M.blackIron, [0, 0.18, 0]);

  // Anéis ornamentais de bronze ao longo da haste
  for (const ry of [-0.65, -0.15, 0.45, 1.15, 1.52]) {
    sculpt(bident, new T.CylinderGeometry(0.034, 0.034, 0.045, 16), M.tarnishedGold, [0, ry, 0]);
  }

  // Ponteira inferior em forma de lança funerária
  sculpt(bident, new T.ConeGeometry(0.045, 0.25, 8), M.blackIron, [0, -1.40, 0], [Math.PI, 0, 0], [1, 1, 0.5]);

  // Cabeça Dupla do Bidente de Hades
  const bidentHead = group(bident, 0, 1.62, 0);

  // Base em cálice gótico de bronze e ferro
  sculpt(bidentHead, new T.CylinderGeometry(0.072, 0.032, 0.16, 16), M.tarnishedGold, [0, 0.04, 0]);

  // Arco duplo em U profundo sustentando as duas pontas
  const forkArc = new T.TorusGeometry(0.24, 0.026, 12, 32, Math.PI);
  forkArc.rotateZ(Math.PI);
  sculpt(bidentHead, forkArc, M.blackIron, [0, 0.26, 0], [0, 0, 0], [1.0, 0.85, 0.65]);

  // Núcleo de Alma Aprisionada flutuando e girando ENTRE as duas pontas do Bidente
  const soulOrb = sculpt(bidentHead, new T.OctahedronGeometry(0.088, 1), M.soulCore, [0, 0.34, 0], [0, 0, 0], [0.85, 1.25, 0.85]);
  const soulRing1 = new T.Mesh(
    new T.TorusGeometry(0.145, 0.009, 8, 32),
    new T.MeshBasicMaterial({
      color: 0x34d399,
      transparent: true,
      opacity: 0.85,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  soulRing1.position.set(0, 0.34, 0);
  bidentHead.add(soulRing1);

  const soulRing2 = new T.Mesh(
    new T.TorusGeometry(0.175, 0.008, 8, 32),
    new T.MeshBasicMaterial({
      color: 0xc084fc,
      transparent: true,
      opacity: 0.75,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  soulRing2.position.set(0, 0.34, 0);
  soulRing2.rotation.x = Math.PI / 3;
  bidentHead.add(soulRing2);

  // As Duas Pontas Longas e Farpadas do Bidente
  for (const side of [-1, 1]) {
    const prong = group(bidentHead, side * 0.24, 0.26, 0);

    // Lâmina vertical longa afiada
    sculpt(prong, new T.CylinderGeometry(0.015, 0.032, 0.62, 10), M.blackIron, [0, 0.31, 0], [0, 0, 0], [1, 1, 0.45]);
    // Ponta superior longa e ameaçadora
    sculpt(prong, new T.ConeGeometry(0.052, 0.32, 6), M.tarnishedGold, [0, 0.76, 0], [0, 0, side * -0.05], [1, 1, 0.32]);
    // Farpa externa em gancho
    sculpt(prong, new T.ConeGeometry(0.028, 0.14, 6), M.blackIron, [side * 0.032, 0.48, 0], [0, 0, -side * 2.35], [0.85, 1, 0.4]);
    // Filete de energia necromântica na lâmina
    sculpt(prong, new T.BoxGeometry(0.008, 0.42, 0.026), M.necroticVein, [0, 0.36, 0]);
  }

  // Âncora de disparo entre as pontas do Bidente
  const bidentAnchor = group(bidentHead, 0, 0.52, 0);
  const bidentGlow = new T.Mesh(
    new T.SphereGeometry(0.22, 14, 12),
    new T.MeshBasicMaterial({
      color: 0x10b981,
      transparent: true,
      opacity: 0.65,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  bidentAnchor.add(bidentGlow);

  // ------------------------------------------------------------------------
  // G. VESTES DO SUBMUNDO (FAIXA SOBRE O OMBRO ESQUERDO, SAIOTE E MANTO ESFARRAPADO)
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  // Faixa da túnica sombria cruzando o ombro esquerdo (deixando o peito direito e veias visíveis)
  const sashCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.20, -0.42, 0.20),
    new T.Vector3(-0.24, 0.05, 0.22),
    new T.Vector3(-0.22, 0.44, 0.12),
    new T.Vector3(-0.20, 0.46, -0.12),
    new T.Vector3(-0.16, 0.05, -0.20),
    new T.Vector3(-0.13, -0.42, -0.16)
  ]);
  const sashGeo = new T.TubeGeometry(sashCurve, 32, 0.105, 12, false);
  sashGeo.scale(1.15, 1, 0.48);
  sculpt(garments, sashGeo, M.tunic);

  // Cinto de Ferro Negro e Bronze com fivela de gema do Tártaro
  const beltGeo = new T.TorusGeometry(0.255, 0.026, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.blackIron, [0, -0.36, 0.01], [0.06, 0, -0.04], [1.06, 1, 0.82]);

  const buckle = group(garments, 0, -0.36, 0.215);
  sculpt(buckle, new T.BoxGeometry(0.11, 0.095, 0.025), M.tarnishedGold);
  sculpt(buckle, new T.OctahedronGeometry(0.032, 0), M.tartarusVein, [0, 0, 0.016]);

  // Saiote / Túnica inferior com barra irregular / esfarrapada e runas
  const skirtGeo = new T.CylinderGeometry(0.265, 0.56, 0.92, 48, 22, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = (0.46 - y) / 0.92;
    const pleat = Math.sin(angle * 11) * 0.032 * (0.25 + normY * 0.95);
    // Borda inferior esfarrapada (pontas irregulares)
    const tatterY = Math.sin(angle * 7) * 0.065 * Math.pow(Math.max(0, normY), 2);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.05;
    z = Math.sin(angle) * r * 0.83 - normY * 0.08;
    y += tatterY;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.tunic, [0, -0.80, 0], [0.04, 0, 0]);

  // Manto das Sombras Esfarrapado (ondula como fumaça densa na barra inferior)
  const capeGeo = new T.PlaneGeometry(1.38, 1.96, 26, 34);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.98 - y) / 1.96));
    const archZ = -0.17 - Math.cos((x / 0.69) * Math.PI * 0.5) * 0.08;
    const z = archZ - normY * 0.54;
    const fx = x * (0.64 + normY * 0.78);
    // Pontas esfarrapadas na base do manto
    const tatter = Math.sin(x * 11) * 0.11 * Math.pow(normY, 2.2);
    const fy = y + tatter;
    cPos.setXYZ(i, fx, fy, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = fy;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.shadowCloak, [0, -0.46, -0.04]);

  return {
    vessel, shadowBaseGroup, shadowCone, groundAuraRing, orbitingWisps,
    body, torso, head, beardTip, legs,
    rightArm, leftArm,
    bident, bidentHead, soulOrb, soulRing1, soulRing2, bidentAnchor, bidentGlow,
    hairStrands,
    skirtMesh, skirtBase,
    cape, capeBase
  };
}

/* ==========================================================================
   4. CENA DO TEMPLO DE OBSIDIANA NO SUBMUNDO E ILUMINAÇÃO MACABRA
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const baseBg = new T.Color(0x090b14);
const portalBg = new T.Color(0x040308);
scene.background = baseBg.clone();
scene.fog = new T.FogExp2(0x090b14, 0.026);

const camera = new T.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 140);

// Iluminação Sombria e Dramática
const hemi = new T.HemisphereLight(0x64748b, 0x090514, 0.72);
scene.add(hemi);

// Luz fria espectral vinda de cima (como fenda da superfície)
const abyssMoon = new T.DirectionalLight(0xcbd5e1, 1.55);
abyssMoon.position.set(4.0, 7.5, 4.8);
abyssMoon.castShadow = true;

const ASH_N = 360;
const ashPos = new Float32Array(ASH_N * 3);
const ashVel = new Float32Array(ASH_N * 3);
const ashLife = new Float32Array(ASH_N);
let ashIdx = 0;

// Inicializar cinzas ambientes subindo lentamente
for (let i = 0; i < ASH_N; i++) {
  ashPos[i * 3] = (Math.random() - 0.5) * 14;
  ashPos[i * 3 + 1] = Math.random() * 5.5;
  ashPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
  ashVel[i * 3] = (Math.random() - 0.5) * 0.3;
  ashVel[i * 3 + 1] = 0.25 + Math.random() * 0.45;
  ashVel[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
  ashLife[i] = 999; // Partículas ambientes contínuas
}

const ashGeo = new T.BufferGeometry();
ashGeo.setAttribute('position', new T.BufferAttribute(ashPos, 3));
scene.add(new T.Points(ashGeo, new T.PointsMaterial({
  color: 0x6ee7b7,
  size: 0.085,
  transparent: true,
  opacity: 0.78,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnSoulBurst(x, y, z, count = 16) {
  for (let c = 0; c < count; c++) {
    const i = ashIdx;
    ashIdx = (ashIdx + 1) % 140; // Primeiros 140 slots usados para explosões
    ashPos[i * 3] = x;
    ashPos[i * 3 + 1] = y;
    ashPos[i * 3 + 2] = z;
    ashVel[i * 3] = (Math.random() - 0.5) * 4.2;
    ashVel[i * 3 + 1] = 1.5 + Math.random() * 4.2;
    ashVel[i * 3 + 2] = (Math.random() - 0.5) * 4.2;
    ashLife[i] = 0.75 + Math.random() * 0.5;
  }
}

function updateParticles(dt, t) {
  for (let i = 0; i < ASH_N; i++) {
    if (i < 140 && ashLife[i] < 100) {
      if (ashLife[i] <= 0) continue;
      ashLife[i] -= dt;
      ashVel[i * 3 + 1] -= 4.5 * dt;
      ashPos[i * 3] += ashVel[i * 3] * dt;
      ashPos[i * 3 + 1] += ashVel[i * 3 + 1] * dt;
      ashPos[i * 3 + 2] += ashVel[i * 3 + 2] * dt;
      if (ashLife[i] <= 0) ashPos[i * 3 + 1] = -100;
    } else {
      // Cinzas ambientes flutuando suavemente
      ashPos[i * 3] += Math.sin(t + i) * 0.15 * dt;
      ashPos[i * 3 + 1] += ashVel[i * 3 + 1] * dt;
      ashPos[i * 3 + 2] += Math.cos(t + i) * 0.15 * dt;
      if (ashPos[i * 3 + 1] > 5.8) {
        ashPos[i * 3 + 1] = 0.05;
        ashPos[i * 3] = (Math.random() - 0.5) * 13;
        ashPos[i * 3 + 2] = (Math.random() - 0.5) * 13;
      }
    }
  }
  ashGeo.attributes.position.needsUpdate = true;
}

let mode = 'reinar';
let fireTimer = 0;
let thrustAnim = 0;
let portalW = 0;
let focusFace = false;

let camAngle = 0.45;
let camPitch = 0.20;
let camDist = 8.8;
let targetCamDist = 8.8;
let currentLookAt = new T.Vector3(0, 1.95, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    fireTimer = 0.12;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  targetCamDist = focusFace ? 2.65 : 8.8;
  if (focusFace) {
    camAngle = 0.22;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.25, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.5);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.5);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (SOMBRAS, BIDENTE, CHAMA DO TÁRTARO E PORTAL DAS ALMAS)
   ========================================================================== */
let trailTimer = 0;

function update(dt, t) {
  // 1. DESLIZE SOMBRIO SOBRE O CHÃO DE OBSIDIANA (SEM VOAR COMO ZEUS)
  let gx = 0, gz = 0, yaw = Math.sin(t * 0.35) * 0.16, tiltPitch = 0.03, tiltRoll = 0;
  const hoverBob = Math.sin(t * 1.4) * 0.06;

  if (mode === 'marcha') {
    const a = t * 0.65;
    const R = 3.0;
    gx = Math.cos(a) * R;
    gz = Math.sin(a) * R;
    yaw = -a;
    tiltPitch = 0.16;
    tiltRoll = -0.20;

    trailTimer -= dt;
    if (trailTimer <= 0) {
      trailTimer = 0.10;
      spawnShadowTrail(gx, gz);
    }
  } else {
    gx = Math.sin(t * 0.45) * 0.25;
    gz = Math.cos(t * 0.38) * 0.20;
  }

  hades.vessel.position.set(gx, 0, gz);
  hades.vessel.rotation.set(0, yaw, 0);
  hades.body.position.y = 1.12 + hoverBob;
  hades.body.rotation.set(tiltPitch, 0, tiltRoll);

  // Vórtice de fumaça sombria e almas orbitando aos pés de Hades
  hades.shadowCone.rotation.y -= dt * (mode === 'marcha' ? 4.5 : 2.2);
  hades.groundAuraRing.scale.setScalar(1 + Math.sin(t * 3.0) * 0.06);
  for (const w of hades.orbitingWisps) {
    const ang = t * w.speed + w.phase;
    w.mesh.position.set(
      Math.cos(ang) * w.radius,
      w.height + Math.sin(t * 2.5 + w.phase) * 0.15,
      Math.sin(ang) * w.radius
    );
  }

  // 2. POSTURA E ANIMAÇÃO DO BIDENTE REAL
  thrustAnim = Math.max(0, thrustAnim - dt * 2.8);

  if (mode === 'chama') {
    // Postura ofensiva projetando o Bidente para disparar Chamas do Tártaro
    hades.rightArm.arm.rotation.set(-0.55 + thrustAnim * 0.45, 0.15, 1.35 - thrustAnim * 0.35);
    hades.rightArm.elbow.rotation.set(-0.35 + thrustAnim * 0.25, 0.2, 0.25);
    hades.bident.rotation.set(0.95 + thrustAnim * 0.25, 0, -0.35);
    hades.leftArm.arm.rotation.set(0.45, -0.3, -0.85);

    fireTimer -= dt;
    if (fireTimer <= 0) {
      fireTimer = 0.58;
      thrustAnim = 1.0;
      fireTartarusFlame();
    }
  } else if (mode === 'portal') {
    // Bidente erguido invocando o Portal das Almas
    hades.rightArm.arm.rotation.set(-0.50, 0.15, 2.38 + Math.sin(t * 2.0) * 0.04);
    hades.rightArm.elbow.rotation.set(0.55, 0.2, 0.28);
    hades.bident.rotation.set(0.22, 0, -0.24);
    hades.leftArm.arm.rotation.set(0.55, -0.35, -1.15);
  } else if (mode === 'marcha') {
    // Bidente inclinado cortando as sombras
    hades.rightArm.arm.rotation.set(0.32, 0.15, 0.72);
    hades.rightArm.elbow.rotation.set(-0.45, 0.1, 0.22);
    hades.bident.rotation.set(0.85, 0.1, -0.36);
    hades.leftArm.arm.rotation.set(0.28, -0.22, -0.78);
  } else {
    // Reinar: postura imponente e aristocrática com o Bidente vertical
    hades.rightArm.arm.rotation.set(-0.18, 0.12, 0.55 + Math.sin(t * 1.4) * 0.03);
    hades.rightArm.elbow.rotation.set(-0.52, 0.15, 0.22);
    hades.bident.rotation.set(0.18, 0, -0.46);
    hades.leftArm.arm.rotation.set(0.25, -0.2, -0.74 + Math.cos(t * 1.3) * 0.03);
  }

  // Núcleo de Alma Aprisionada entre as pontas do Bidente
  hades.soulOrb.rotation.y += dt * 3.0;
  hades.soulRing1.rotation.z += dt * 3.6;
  hades.soulRing2.rotation.y -= dt * 3.2;

  const powerMult = (mode === 'chama' || mode === 'portal') ? 1.55 : 1.0;
  hades.bidentGlow.scale.setScalar((0.9 + Math.sin(t * 14) * 0.18) * powerMult);
  hades.bidentAnchor.getWorldPosition(tmpV);
  bidentLight.position.copy(tmpV);
  bidentLight.intensity = 2.3 * powerMult + Math.sin(t * 16) * 0.4;

  // Vento submundo nos cabelos longos, cavanhaque e manto esfarrapado
  const wind = (mode === 'marcha' || mode === 'portal') ? 1.85 : 1.0;
  hades.beardTip.rotation.x = -0.14 + Math.sin(t * 2.4 * wind) * 0.035;
  for (const s of hades.hairStrands) {
    s.mesh.rotation.x = Math.sin(t * 2.3 * wind + s.phase) * 0.04;
    s.mesh.rotation.z = Math.cos(t * 1.8 * wind + s.phase) * 0.032;
  }

  const cAttr = hades.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = hades.capeBase[i * 3];
    const by = hades.capeBase[i * 3 + 1];
    const bz = hades.capeBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.98 - by) / 1.96));
    const wave1 = Math.sin(t * 3.1 * wind - normY * 4.5 + bx * 2.5) * 0.14 * normY;
    const wave2 = Math.cos(t * 2.1 * wind - normY * 3.0) * 0.06 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.3 - normY * 3.0) * 0.035 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  hades.cape.geometry.computeVertexNormals();

  const skAttr = hades.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = hades.skirtBase[i * 3];
    const by = hades.skirtBase[i * 3 + 1];
    const bz = hades.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.46 - by) / 0.92));
    skAttr.setZ(i, bz + Math.sin(t * 3.3 * wind - normY * 4.0 + bx * 4.0) * 0.042 * normY);
  }
  skAttr.needsUpdate = true;
  hades.skirtMesh.geometry.computeVertexNormals();

  // 3. ATUALIZAÇÃO DE RASTROS SOMBRIOS, CHAMAS DO TÁRTARO E PORTAL DAS ALMAS
  for (let i = shadowTrails.length - 1; i >= 0; i--) {
    const st = shadowTrails[i];
    st.life -= dt;
    const k = Math.max(0, st.life / st.max);
    st.mesh.scale.setScalar(1 + (1 - k) * 2.5);
    st.mesh.material.opacity = 0.62 * k;
    if (st.life <= 0) {
      scene.remove(st.mesh);
      st.mesh.geometry.dispose();
      st.mesh.material.dispose();
      shadowTrails.splice(i, 1);
    }
  }

  for (let i = tartarusBolts.length - 1; i >= 0; i--) {
    const b = tartarusBolts[i];
    b.progress += dt * b.speed;
    const p = Math.min(1, b.progress);
    b.mesh.position.lerpVectors(b.start, b.target, p);
    b.mesh.position.y += Math.sin(p * Math.PI) * 0.55;
    b.mesh.rotation.y += dt * 10;

    if (p >= 1) {
      eruptHellfire(b.target);
      scene.remove(b.mesh);
      b.mesh.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      tartarusBolts.splice(i, 1);
    }
  }

  for (let i = hellfirePools.length - 1; i >= 0; i--) {
    const hf = hellfirePools[i];
    hf.life -= dt;
    const k = Math.max(0, hf.life / hf.max);
    hf.pool.scale.setScalar(1 + (1 - k) * 1.4);
    hf.pool.material.opacity = 0.9 * k;
    hf.pillar.scale.set(1 + (1 - k) * 0.5, k, 1 + (1 - k) * 0.5);
    hf.pillar.position.y = 1.2 * k;
    hf.pillar.material.opacity = 0.78 * k;
    if (hf.life <= 0) {
      scene.remove(hf.pool, hf.pillar);
      hf.pool.geometry.dispose(); hf.pool.material.dispose();
      hf.pillar.geometry.dispose(); hf.pillar.material.dispose();
      hellfirePools.splice(i, 1);
    }
  }

  // Portal das Almas ativo
  const portalTarget = (mode === 'portal') ? 1 : 0;
  portalW = T.MathUtils.damp(portalW, portalTarget, 2.5, dt);
  portalGroup.visible = portalW > 0.02;
  if (portalGroup.visible) {
    portalGroup.position.set(gx, 0, gz);
    portalDisc.rotation.z += dt * 1.2;
    portalInnerRing.rotation.z -= dt * 2.1;
    portalDisc.material.opacity = 0.55 * portalW;
    portalInnerRing.material.opacity = 0.72 * portalW;

    for (const w of wraiths) {
      w.angle += dt * w.speed;
      w.y += dt * 1.65;
      if (w.y > 4.4) w.y = 0.1;
      w.group.position.set(
        Math.cos(w.angle) * w.radius,
        w.y,
        Math.sin(w.angle) * w.radius
      );
      w.group.rotation.y = -w.angle;
      w.group.scale.setScalar(portalW);
    }
  }

  // Chamas dos braseiros e anéis rúnicos do templo
  for (const pf of pillarFlames) {
    pf.f1.scale.set(1 + Math.sin(t * 9 + pf.phase) * 0.12, 1 + Math.cos(t * 11 + pf.phase) * 0.18, 1);
    pf.f2.scale.set(1 + Math.cos(t * 10 + pf.phase) * 0.15, 1 + Math.sin(t * 8 + pf.phase) * 0.2, 1);
  }
  runeRings[0].rotation.z += dt * 0.18;
  runeRings[1].rotation.z -= dt * 0.24;

  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 14);
  updateParticles(dt, t);

  // Atmosfera ainda mais sombria durante Portal das Almas
  scene.background.lerpColors(baseBg, portalBg, portalW);
  scene.fog.color.copy(scene.background);
  abyssMoon.intensity = 1.55 - 0.65 * portalW;

  // 4. CÂMERA INTERATIVA 360° + ZOOM + FOCO ROSTO / CORPO
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(gx, 3.06 + hoverBob, gz)
    : new T.Vector3(0, 1.98, 0);
  currentLookAt.lerp(desiredTarget, 0.12);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
