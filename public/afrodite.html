<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Afrodite - Deusa da Beleza | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --rose: #fb7185;
      --gold: #facc15;
      --pearl: #fff1f2;
      --glass: rgba(36, 12, 24, 0.78);
      --border: rgba(251, 113, 133, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0812;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: var(--pearl);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.38);
      transition: all 0.22s ease;
    }
    button:hover {
      border-color: #fda4af;
      transform: translateY(-1px);
      background: rgba(58, 18, 38, 0.92);
    }
    button.on {
      background: linear-gradient(135deg, #fb7185 0%, #f59e0b 100%);
      color: #1f0712;
      border-color: #ffe4e6;
      box-shadow: 0 0 22px rgba(251, 113, 133, 0.6);
    }
    button.cam-btn {
      border-color: rgba(250, 204, 21, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #be123c 100%);
      color: #ffffff;
      border-color: #fef08a;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.55);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fda4af;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 960px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 10, 20, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(251, 113, 133, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #ffe4e6;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="graca" class="on">Graça Divina</button>
    <button data-m="danca">Dança nas Pétalas</button>
    <button data-m="encanto">Encanto Irresistível</button>
    <button data-m="mare">Maré de Paixão</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Olympus • Afrodite</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE SEDOSA, VESTE DE SEDA ROSADA E MÁRMORE)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map ultrafino para pele acetinada
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4200; i++) {
    const v = 125 + Math.floor(Math.random() * 8);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Seda Perolada e Rosa-Flor com bordado dourado de ondas e rosas
  const silkCanvas = document.createElement('canvas');
  silkCanvas.width = 512;
  silkCanvas.height = 256;
  const tCtx = silkCanvas.getContext('2d');
  const grad = tCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#fff1f2');
  grad.addColorStop(0.55, '#ffe4e6');
  grad.addColorStop(0.82, '#fecdd3');
  grad.addColorStop(1, '#fda4af');
  tCtx.fillStyle = grad;
  tCtx.fillRect(0, 0, 512, 256);

  // Pregas delicadas de seda fluida
  tCtx.fillStyle = 'rgba(244, 63, 94, 0.08)';
  for (let x = 0; x < 512; x += 8) tCtx.fillRect(x, 0, 3, 256);

  // Barra dourada ornamentada com volutas marinhas
  tCtx.fillStyle = '#be185d';
  tCtx.fillRect(0, 206, 512, 34);
  tCtx.fillStyle = '#facc15';
  tCtx.fillRect(0, 202, 512, 5);
  tCtx.fillRect(0, 240, 512, 5);

  tCtx.strokeStyle = '#fef08a';
  tCtx.lineWidth = 2.6;
  for (let x = 0; x < 512; x += 32) {
    tCtx.beginPath();
    tCtx.arc(x + 16, 223, 10, 0, Math.PI * 1.65);
    tCtx.stroke();
  }
  const silkTex = new T.CanvasTexture(silkCanvas);
  silkTex.wrapS = silkTex.wrapT = T.RepeatWrapping;

  // 1.3 Piso do Santuário de Citera / Chipre: Mármore Rosado e Espelho d'Água com Rosa Dourada
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  const fGrad = fCtx.createRadialGradient(512, 512, 40, 512, 512, 512);
  fGrad.addColorStop(0, '#fff1f2');
  fGrad.addColorStop(0.55, '#ffe4e6');
  fGrad.addColorStop(0.85, '#fbcfe8');
  fGrad.addColorStop(1, '#f9a8d4');
  fCtx.fillStyle = fGrad;
  fCtx.fillRect(0, 0, 1024, 1024);

  // Veios suaves de mármore rosado e pérola
  fCtx.strokeStyle = 'rgba(190, 24, 93, 0.14)';
  fCtx.lineWidth = 2;
  for (let i = 0; i < 38; i++) {
    fCtx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    fCtx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      fCtx.lineTo(mx, my);
    }
    fCtx.stroke();
  }

  const cx = 512, cy = 512;
  // Anéis concêntricos de ouro e quartzo rosa
  fCtx.strokeStyle = '#db2777';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 425, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 7;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 440, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 410, 0, Math.PI * 2);
  fCtx.stroke();

  // Mandala de Pétalas de Rosa / Concha de Vênus no centro do piso
  for (let ring = 0; ring < 2; ring++) {
    const petals = ring === 0 ? 12 : 16;
    const rOuter = ring === 0 ? 275 : 185;
    const rInner = ring === 0 ? 120 : 65;
    for (let i = 0; i < petals; i++) {
      const a = (i / petals) * Math.PI * 2 + ring * 0.2;
      fCtx.fillStyle = ring === 0 ? 'rgba(244, 63, 94, 0.25)' : 'rgba(250, 204, 21, 0.45)';
      fCtx.beginPath();
      fCtx.moveTo(cx + Math.cos(a - 0.18) * rInner, cy + Math.sin(a - 0.18) * rInner);
      fCtx.quadraticCurveTo(
        cx + Math.cos(a) * (rOuter + 25),
        cy + Math.sin(a) * (rOuter + 25),
        cx + Math.cos(a + 0.18) * rInner,
        cy + Math.sin(a + 0.18) * rInner
      );
      fCtx.closePath();
      fCtx.fill();
      fCtx.strokeStyle = '#eab308';
      fCtx.lineWidth = 2.5;
      fCtx.stroke();
    }
  }

  fCtx.fillStyle = '#facc15';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 52, 0, Math.PI * 2);
  fCtx.fill();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, silkTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ORGÂNICA E MATERIAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xf0c4a8,          // Pele porcelana-dourada luminosa e acetinada
      roughness: 0.32,
      metalness: 0.04,
      bumpMap: textures.skinBump,
      bumpScale: 0.002
    }),
    blushSkin: new T.MeshStandardMaterial({
      color: 0xeba598,          // Rubor suave nas maçãs do rosto
      roughness: 0.34,
      metalness: 0.04
    }),
    lipRose: new T.MeshStandardMaterial({
      color: 0xe11d48,          // Lábios rosados definidos
      emissive: 0x4c0519,
      emissiveIntensity: 0.2,
      roughness: 0.24,
      metalness: 0.06
    }),
    hairHoneyGold: new T.MeshStandardMaterial({
      color: 0xf6c945,          // Cabelos loiro-mel dourados sedosos
      emissive: 0x422006,
      emissiveIntensity: 0.2,
      roughness: 0.30,
      metalness: 0.22
    }),
    hairChampagne: new T.MeshStandardMaterial({
      color: 0xfef08a,          // Mechas loiro-champanhe iluminadas
      emissive: 0x523105,
      emissiveIntensity: 0.22,
      roughness: 0.28,
      metalness: 0.24
    }),
    goldPolished: new T.MeshStandardMaterial({
      color: 0xfacc15,
      emissive: 0x422006,
      emissiveIntensity: 0.24,
      metalness: 0.94,
      roughness: 0.16
    }),
    roseGold: new T.MeshStandardMaterial({
      color: 0xfda4af,
      emissive: 0x4c0519,
      emissiveIntensity: 0.22,
      metalness: 0.88,
      roughness: 0.2
    }),
    pearlMat: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffe4e6,
      emissiveIntensity: 0.35,
      roughness: 0.14,
      metalness: 0.35
    }),
    nacreShell: new T.MeshStandardMaterial({
      color: 0xfff1f2,
      emissive: 0xfecdd3,
      emissiveIntensity: 0.28,
      roughness: 0.22,
      metalness: 0.45,
      side: T.DoubleSide
    }),
    rubyHeartGem: new T.MeshStandardMaterial({
      color: 0xf43f5e,
      emissive: 0xe11d48,
      emissiveIntensity: 2.8,
      roughness: 0.08,
      metalness: 0.3
    }),
    eyeWhite: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xf8fafc,
      emissiveIntensity: 0.25,
      roughness: 0.08
    }),
    eyeSapphireSky: new T.MeshStandardMaterial({
      color: 0x38bdf8,          // Olhos azul-celeste / água-marinha radiantes
      emissive: 0x0284c7,
      emissiveIntensity: 2.4,
      roughness: 0.06
    }),
    eyePupil: new T.MeshStandardMaterial({
      color: 0x0c244a,
      roughness: 0.1
    }),
    lashBrown: new T.MeshStandardMaterial({
      color: 0x451a03,
      roughness: 0.45
    }),
    silkDress: new T.MeshStandardMaterial({
      map: textures.silkTex,
      color: 0xffffff,
      roughness: 0.44,
      metalness: 0.08,
      side: T.DoubleSide
    }),
    roseShawl: new T.MeshStandardMaterial({
      color: 0xf43f5e,          // Xale/véu de seda rosa-carmesim translúcido
      emissive: 0x4c0519,
      emissiveIntensity: 0.32,
      roughness: 0.38,
      metalness: 0.12,
      transparent: true,
      opacity: 0.88,
      side: T.DoubleSide
    }),
    doveWhite: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffe4e6,
      emissiveIntensity: 0.35,
      roughness: 0.35
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE AFRODITE + CONCHA DE NÁCAR + ESPELHO DOURADO + POMBA SAGRADA
   ========================================================================== */
function buildAphrodite(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();

  // ------------------------------------------------------------------------
  // A. CONCHA GIGANTE DE NÁCAR E PÉROLAS FLUTUANTE SOB OS PÉS DE AFRODITE
  // ------------------------------------------------------------------------
  const shellPlatform = group(root, 0, 0.28, 0);

  // Valva principal da concha de madrepérola esculpida com nervuras radiais
  const shellGeo = new T.SphereGeometry(1.18, 40, 24, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.46);
  const shPos = shellGeo.attributes.position;
  for (let i = 0; i < shPos.count; i++) {
    let x = shPos.getX(i), y = shPos.getY(i), z = shPos.getZ(i);
    const ang = Math.atan2(z, x);
    const r = Math.hypot(x, z);
    // Nervuras onduladas clássicas de concha de Vieira (Nascimento de Vênus)
    const scallop = Math.sin(ang * 14) * 0.032 * (r / 1.18);
    y += scallop;
    z *= 1.15;
    shPos.setXYZ(i, x, y, z);
  }
  shellGeo.computeVertexNormals();
  sculpt(shellPlatform, shellGeo, M.nacreShell, [0, 0.72, -0.05], [0.06, 0, 0], [1.05, 0.65, 1.0]);

  // Borda dourada e colar de 24 pérolas luminosas ao redor da concha
  const shellRim = new T.TorusGeometry(1.16, 0.018, 10, 48);
  shellRim.rotateX(Math.PI / 2);
  sculpt(shellPlatform, shellRim, M.goldPolished, [0, 0.04, -0.05], [0.06, 0, 0], [1.05, 1.15, 1]);

  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const px = Math.cos(a) * 1.21;
    const pz = Math.sin(a) * 1.32 - 0.05;
    const py = 0.05 + Math.sin(a * 14) * 0.025 - pz * 0.06;
    sculpt(shellPlatform, new T.SphereGeometry(0.032, 12, 12), M.pearlMat, [px, py, pz]);
  }

  // ------------------------------------------------------------------------
  // B. CORPO FEMININO GRACIOSO E ESCULPIDO DE AFRODITE (y = 0.34)
  // ------------------------------------------------------------------------
  const body = group(root, 0, 0.34, 0);

  // Pelve e Pernas esguias, longas e graciosas (pose clássica contrapposto)
  const pelvis = group(body, 0, 0.94, 0);
  sculpt(pelvis, new T.SphereGeometry(0.22, 24, 22), M.skin, [0, 0, 0], [0, 0, 0], [1.12, 0.80, 0.86]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.128, -0.04, 0);

    // Coxa esguia e bem contornada
    sculpt(hip, new T.CylinderGeometry(0.126, 0.084, 0.54, 22), M.skin, [0, -0.26, 0], [0, 0, 0], [1.02, 1, 1.06]);
    sculpt(hip, new T.SphereGeometry(0.095, 16, 16), M.skin, [s * 0.012, -0.22, 0.038], [0, 0, 0], [0.94, 1.8, 0.86]);

    // Joelho delicado
    sculpt(hip, new T.SphereGeometry(0.072, 16, 16), M.skin, [0, -0.54, 0.014]);

    // Canela, Panturrilha graciosa e Tornozeleira de Ouro e Pérolas
    const knee = group(hip, 0, -0.55, 0);
    sculpt(knee, new T.CylinderGeometry(0.074, 0.044, 0.50, 20), M.skin, [0, -0.25, 0]);
    sculpt(knee, new T.SphereGeometry(0.07, 16, 16), M.skin, [0, -0.17, -0.03], [0, 0, 0], [0.95, 1.65, 0.95]);

    // Tornozeleira dourada com pérolas
    const anklet = new T.TorusGeometry(0.052, 0.0055, 8, 24);
    anklet.rotateX(Math.PI / 2);
    sculpt(knee, anklet, M.goldPolished, [0, -0.45, 0.01]);
    sculpt(knee, new T.SphereGeometry(0.014, 10, 10), M.pearlMat, [s * 0.052, -0.45, 0.01]);

    // Pé delicado e Sandália Dourada de Deusa
    const ankle = group(knee, 0, -0.50, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.076, 0.04, 0.19), M.skin, [0, -0.018, 0.035], [0.14, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.082, 0.012, 0.20), M.goldPolished, [0, -0.038, 0.035], [0.14, 0, 0]);

    const strap = new T.TorusGeometry(0.05, 0.0045, 8, 20);
    strap.rotateX(Math.PI / 2);
    sculpt(ankle, strap, M.goldPolished, [0, 0.018, -0.018], [0.08, 0, 0]);
    sculpt(ankle, strap, M.roseGold, [0, 0.052, -0.018], [0.08, 0, 0]);

    legs[side] = { hip, knee, ankle };
  }

  // Pose contrapposto clássica: perna esquerda suavemente flexionada à frente, direita firme
  legs.L.hip.rotation.set(-0.22, -0.10, -0.04);
  legs.L.knee.rotation.set(0.28, 0, 0);
  legs.R.hip.rotation.set(0.10, 0.08, 0.04);
  legs.R.knee.rotation.set(0.10, 0, 0);

  // ------------------------------------------------------------------------
  // C. TRONCO FEMININO GRACIOSO, VESTE DE SEDA E JOIAS DE OURO E PÉROLAS
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.38, 0);

  // Silhueta feminina harmoniosa e delicada (cintura fina, ombros graciosos)
  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.225, -0.40), // Quadril
    new T.Vector2(0.162, -0.18), // Cintura fina e elegante
    new T.Vector2(0.202, 0.04),  // Costelas
    new T.Vector2(0.268, 0.26),  // Tórax / Ombros delicados
    new T.Vector2(0.238, 0.40),  // Clavícula
    new T.Vector2(0.105, 0.47),  // Base do pescoço
    new T.Vector2(0.01, 0.48)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 40), M.skin, [0, 0, 0], [0, 0, 0], [1.14, 1.02, 0.74]);

  // Busto drapeado em seda perolada e rosa com detalhe dourado
  const bustGeo = new T.SphereGeometry(0.132, 24, 24);
  sculpt(torso, bustGeo, M.silkDress, [-0.108, 0.20, 0.132], [0.08, -0.18, 0], [0.96, 0.94, 0.80]);
  sculpt(torso, bustGeo, M.silkDress, [0.108, 0.20, 0.132], [0.08, 0.18, 0], [0.96, 0.94, 0.80]);

  // Faixa cruzada de seda perolada sobre o tronco (deixando ombro direito à mostra)
  const bodiceCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.18, 0.36, 0.11),
    new T.Vector3(-0.08, 0.16, 0.21),
    new T.Vector3(0.06, -0.08, 0.19),
    new T.Vector3(0.16, -0.32, 0.15)
  ]);
  const bodiceSash = new T.TubeGeometry(bodiceCurve, 24, 0.075, 12, false);
  bodiceSash.scale(1.1, 1, 0.45);
  sculpt(torso, bodiceSash, M.silkDress);

  // Colar de Pérolas e Pingente de Coração de Rubi no colo
  const necklace = new T.TorusGeometry(0.155, 0.011, 10, 32);
  necklace.rotateX(Math.PI / 2);
  sculpt(torso, necklace, M.goldPolished, [0, 0.38, 0.015], [0.22, 0, 0], [1.12, 1, 0.92]);
  for (let p = -4; p <= 4; p++) {
    const pa = p * 0.22;
    sculpt(
      torso,
      new T.SphereGeometry(0.013, 10, 10),
      M.pearlMat,
      [Math.sin(pa) * 0.165, 0.345 - Math.cos(pa) * 0.018, Math.cos(pa) * 0.152]
    );
  }
  sculpt(torso, new T.OctahedronGeometry(0.022, 0), M.rubyHeartGem, [0, 0.315, 0.168], [0, 0, 0], [0.95, 1.25, 0.55]);

  // Pescoço longo, esguio e elegante
  sculpt(torso, new T.CylinderGeometry(0.082, 0.104, 0.25, 22), M.skin, [0, 0.51, -0.005], [0.05, 0, 0]);

  // ------------------------------------------------------------------------
  // D. ROSTO DE EXTREMA BELEZA CLÁSSICA + CABELOS DOURADOS ESPLÊNDIDOS + TIARA DE PÉROLAS
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.72, 0.032);

  // Crânio oval harmonioso com proporções faciais clássicas delicadas
  const skullGeo = new T.SphereGeometry(0.180, 44, 44);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.15;
    x *= 0.87;
    if (y < 0.02 && y > -0.05 && z > 0) {
      x *= 1.03;
      z *= 1.04;
    }
    if (y <= -0.05 && z > -0.02) {
      const chinTaper = Math.max(0.54, 1.0 - ((-0.05 - y) / 0.15) * 0.44);
      x *= chinTaper;
      z *= 1.02;
    }
    if (z < -0.10) z *= 0.94;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  // Maçãs do rosto suaves com rubor rosado sutil
  const cheekGeo = new T.SphereGeometry(0.04, 16, 16);
  sculpt(head, cheekGeo, M.blushSkin, [-0.06, -0.015, 0.142], [0, -0.3, 0], [1.08, 0.82, 0.58]);
  sculpt(head, cheekGeo, M.blushSkin, [0.06, -0.015, 0.142], [0, 0.3, 0], [1.08, 0.82, 0.58]);

  // Nariz delicado, fino e reto
  sculpt(head, new T.BoxGeometry(0.016, 0.066, 0.035), M.skin, [0, 0.002, 0.173], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.013, 14, 14), M.skin, [0, -0.030, 0.185], [0, 0, 0], [0.9, 0.78, 0.95]);

  // Sobrancelhas finas e arqueadas em tom mel-dourado
  const browGeo = new T.CapsuleGeometry(0.0048, 0.050, 8, 12);
  sculpt(head, browGeo, M.lashBrown, [-0.047, 0.045, 0.166], [0.1, 0.25, 1.44]);
  sculpt(head, browGeo, M.lashBrown, [0.047, 0.045, 0.166], [0.1, -0.25, -1.44]);

  // Olhos Expressivos Azul-Celeste / Água-Marinha com cílios longos e brilho estelar
  for (const side of [-1, 1]) {
    const eyeGroup = group(head, side * 0.047, 0.017, 0.156);
    eyeGroup.rotation.y = side * 0.18;

    // Esclera branca luminosa
    sculpt(eyeGroup, new T.SphereGeometry(0.022, 18, 18), M.eyeWhite, [0, 0, 0], [0, 0, 0], [1.18, 0.92, 0.65]);
    // Íris azul-celeste / safira radiante
    sculpt(eyeGroup, new T.SphereGeometry(0.015, 16, 16), M.eyeSapphireSky, [-side * 0.002, -0.001, 0.009], [0, 0, 0], [0.95, 1.08, 0.55]);
    // Pupila
    sculpt(eyeGroup, new T.SphereGeometry(0.0078, 12, 12), M.eyePupil, [-side * 0.002, -0.001, 0.014], [0, 0, 0], [0.9, 1.05, 0.5]);
    // Dois pontos de luz especular (olhar apaixonado e brilhante)
    sculpt(eyeGroup, new T.SphereGeometry(0.0042, 8, 8), M.eyeWhite, [-side * 0.006, 0.005, 0.016]);
    sculpt(eyeGroup, new T.SphereGeometry(0.0024, 8, 8), M.eyeWhite, [side * 0.004, -0.004, 0.016]);
    // Cílios superiores arqueados
    sculpt(eyeGroup, new T.BoxGeometry(0.050, 0.006, 0.018), M.lashBrown, [side * 0.003, 0.015, 0.008], [0.12, 0, side * -0.10]);
  }

  // Lábios rosados definidos em arco de cupido e sorriso sereno
  sculpt(head, new T.CapsuleGeometry(0.0072, 0.028, 8, 12), M.lipRose, [0, -0.070, 0.171], [0, 0, Math.PI / 2], [1, 1, 0.78]);
  sculpt(head, new T.CapsuleGeometry(0.0088, 0.024, 8, 12), M.lipRose, [0, -0.081, 0.169], [0, 0, Math.PI / 2], [1, 1, 0.85]);

  // ------------------------------------------------------------------------
  // CABELOS LONGOS E ONDULADOS LOIRO-MEL / CHAMPANHE + TIARA DE OURO E PÉROLAS
  // ------------------------------------------------------------------------
  const hairStrands = [];

  // Calota sedosa volumosa no topo da cabeça
  sculpt(head, new T.SphereGeometry(0.188, 28, 28), M.hairHoneyGold, [0, 0.036, -0.018], [-0.08, 0, 0], [0.98, 1.06, 1.06]);

  // Mechas frontais repartidas ao meio em ondas suaves (estilo Botticelli / Deusa Clássica)
  for (const side of [-1, 1]) {
    const waveFrontPts = [
      new T.Vector3(side * 0.015, 0.165, 0.135),
      new T.Vector3(side * 0.105, 0.115, 0.135),
      new T.Vector3(side * 0.168, 0.015, 0.105),
      new T.Vector3(side * 0.182, -0.145, 0.095),
      new T.Vector3(side * 0.155, -0.320, 0.115),
      new T.Vector3(side * 0.135, -0.480, 0.125)
    ];
    const frontTube = new T.TubeGeometry(new T.CatmullRomCurve3(waveFrontPts), 20, 0.032, 10, false);
    const frontLock = sculpt(head, frontTube, M.hairChampagne);
    hairStrands.push({ mesh: frontLock, phase: side * 0.7 });
  }

  // Cascata longa e exuberante de cachos dourados ondulando até os quadris
  for (let i = 0; i < 36; i++) {
    const angle = (i / 36) * Math.PI * 1.55 + Math.PI * 0.725;
    const r = 0.168;
    const sx = Math.sin(angle) * r;
    const sz = Math.cos(angle) * r - 0.012;
    const sy = 0.048 + Math.cos(angle * 2) * 0.018;
    const len = 0.84 + (i % 4) * 0.095;
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const t = k / 8;
      const flare = 1 + t * 0.48;
      pts.push(new T.Vector3(
        sx * flare + Math.sin(t * Math.PI * 2.8 + i * 0.65) * 0.044,
        sy - t * len,
        sz * flare - t * 0.18
      ));
    }
    const tube = new T.TubeGeometry(new T.CatmullRomCurve3(pts), 18, 0.031 * (1 - 0.14 * (i % 2)), 8, false);
    const strand = sculpt(head, tube, i % 3 === 0 ? M.hairChampagne : M.hairHoneyGold);
    hairStrands.push({ mesh: strand, phase: i * 0.36 });
  }

  // Tiara Dourada de Concha e Pérolas + Rosas Douradas nos Cabelos
  const tiara = group(head, 0, 0.118, 0.012);
  tiara.rotation.x = 0.16;

  const tiaraBand = new T.TorusGeometry(0.182, 0.0085, 10, 36, Math.PI * 1.4);
  tiaraBand.rotateX(Math.PI / 2);
  tiaraBand.rotateY(-Math.PI * 0.2);
  sculpt(tiara, tiaraBand, M.goldPolished, [0, 0, 0], [0, 0, 0], [0.95, 1, 1.05]);

  // Concha central dourada com pérola luminosa na testa
  sculpt(tiara, new T.ConeGeometry(0.034, 0.075, 7), M.goldPolished, [0, 0.032, 0.184], [-0.15, 0, 0], [1.1, 1, 0.35]);
  sculpt(tiara, new T.SphereGeometry(0.018, 12, 12), M.pearlMat, [0, 0.016, 0.192]);

  // Rosas de Ouro Rosé e Pérolas nas laterais da tiara
  for (const side of [-1, 1]) {
    sculpt(tiara, new T.TorusGeometry(0.022, 0.008, 8, 16), M.roseGold, [side * 0.165, 0.01, 0.06], [0, side * 1.1, 0]);
    sculpt(tiara, new T.SphereGeometry(0.012, 10, 10), M.pearlMat, [side * 0.168, 0.01, 0.06]);
    // Brincos pendentes de pérola e ouro
    sculpt(head, new T.SphereGeometry(0.012, 10, 10), M.goldPolished, [side * 0.162, -0.025, 0.01]);
    sculpt(head, new T.SphereGeometry(0.016, 12, 12), M.pearlMat, [side * 0.166, -0.052, 0.01]);
  }

  // ------------------------------------------------------------------------
  // E. BRAÇOS DELICADOS, BRACELETES DE SERPENTE DOURADA E ESPELHO DE VÊNUS
  // ------------------------------------------------------------------------
  function createGracefulArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.31, 0.32, -0.005);

    // Ombro e Braço esguio e suave
    sculpt(arm, new T.SphereGeometry(0.088, 18, 18), M.skin);
    sculpt(arm, new T.CapsuleGeometry(0.058, 0.26, 12, 16), M.skin, [s * 0.015, -0.17, 0], [0, 0, s * 0.05]);

    // Bracelete espiralado dourado no braço superior
    if (!isRight) {
      const upperArmlet = new T.TorusGeometry(0.062, 0.0055, 8, 24);
      upperArmlet.rotateX(Math.PI / 2);
      sculpt(arm, upperArmlet, M.goldPolished, [s * 0.012, -0.14, 0]);
      sculpt(arm, upperArmlet, M.roseGold, [s * 0.014, -0.16, 0]);
    }

    // Cotovelo e Antebraço delicado
    const elbow = group(arm, s * 0.028, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.056, 0.038, 0.30, 18), M.skin, [0, -0.145, 0]);

    // Pulseira de Ouro e Pérolas
    const wristBand = new T.TorusGeometry(0.044, 0.0055, 8, 24);
    wristBand.rotateX(Math.PI / 2);
    sculpt(elbow, wristBand, M.goldPolished, [0, -0.25, 0]);
    sculpt(elbow, new T.SphereGeometry(0.012, 10, 10), M.pearlMat, [s * 0.045, -0.25, 0]);

    // Mão graciosa com dedos alongados
    const hand = group(elbow, 0, -0.31, 0);
    sculpt(hand, new T.BoxGeometry(0.050, 0.062, 0.024), M.skin, [0, -0.014, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.007, 0.034, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.012;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.048, 0.01], [isRight ? 0.45 : 0.95, 0, (f - 1.5) * 0.06]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.028, -0.022, 0.015], [0.45, 0, -s * 0.55], [1.0, 0.88, 1.0]);

    return { arm, elbow, hand };
  }

  const rightArm = createGracefulArm(true);
  const leftArm = createGracefulArm(false);

  // Espelho Sagrado de Vênus flutuando sutilmente ao lado de Afrodite (mãos livres e graciosas)
  const floatingMirrorGroup = new T.Group();
  root.add(floatingMirrorGroup);

  const venusMirror = new T.Group();
  floatingMirrorGroup.add(venusMirror);

  // Cabo ornamentado do espelho
  sculpt(venusMirror, new T.CylinderGeometry(0.011, 0.015, 0.22, 12), M.goldPolished, [0, -0.04, 0]);
  sculpt(venusMirror, new T.SphereGeometry(0.02, 12, 12), M.pearlMat, [0, -0.15, 0]);

  // Moldura oval dourada com rosas de ouro rosé
  const mirrorFrame = new T.TorusGeometry(0.135, 0.016, 10, 32);
  sculpt(venusMirror, mirrorFrame, M.goldPolished, [0, 0.19, 0], [0, 0, 0], [0.85, 1.15, 1]);
  sculpt(venusMirror, new T.OctahedronGeometry(0.022, 0), M.rubyHeartGem, [0, 0.345, 0]);

  // Superfície refletora luminosa do Espelho de Vênus
  const mirrorGlass = new T.Mesh(
    new T.CircleGeometry(0.13, 32),
    new T.MeshStandardMaterial({
      color: 0xffe4e6,
      emissive: 0xfb7185,
      emissiveIntensity: 1.9,
      metalness: 0.95,
      roughness: 0.05,
      side: T.DoubleSide
    })
  );
  mirrorGlass.position.set(0, 0.19, 0);
  mirrorGlass.scale.set(0.85, 1.15, 1);
  venusMirror.add(mirrorGlass);

  // Esferas de luz e magia divina nas palmas livres de ambas as mãos
  const magicHandAnchor = group(rightArm.hand, 0, -0.055, 0.035);
  const magicHandGlow = new T.Mesh(
    new T.SphereGeometry(0.095, 12, 10),
    new T.MeshBasicMaterial({
      color: 0xfb7185,
      transparent: true,
      opacity: 0.78,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  magicHandAnchor.add(magicHandGlow);

  const leftHandGlow = new T.Mesh(
    new T.SphereGeometry(0.085, 12, 10),
    new T.MeshBasicMaterial({
      color: 0xfde047,
      transparent: true,
      opacity: 0.68,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  leftHandGlow.position.set(0, -0.055, 0.035);
  leftArm.hand.add(leftHandGlow);

  // ------------------------------------------------------------------------
  // F. VESTE DE SEDA FLUIDA E XALE DE VÊNUS FLUTUANTE AO REDOR DOS BRAÇOS
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  // Cinto dourado delicado com coração de rubi na cintura alta
  const beltGeo = new T.TorusGeometry(0.195, 0.015, 10, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.goldPolished, [0, -0.18, 0.005], [0.04, 0, 0], [1.14, 1, 0.80]);
  sculpt(garments, new T.OctahedronGeometry(0.026, 0), M.rubyHeartGem, [0, -0.18, 0.165], [0, 0, 0], [1.0, 1.25, 0.55]);

  // Saia longa de seda perolada e rosa com fenda lateral graciosa e pregas fluidas
  const skirtGeo = new T.CylinderGeometry(0.195, 0.62, 1.26, 56, 24, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = (0.63 - y) / 1.26;
    const pleat = Math.sin(angle * 18) * 0.026 * (0.2 + normY * 0.95);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.06;
    z = Math.sin(angle) * r * 0.86 - normY * 0.05;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.silkDress, [0, -0.80, 0], [0.03, 0, 0]);

  // Véu / Xale Etéreo de Seda Rosa-Carmesim flutuando em arco celestial atrás dos ombros
  const shawlGeo = new T.PlaneGeometry(1.75, 1.75, 28, 32);
  const shlPos = shawlGeo.attributes.position;
  const shawlBase = new Float32Array(shlPos.array.length);
  for (let i = 0; i < shlPos.count; i++) {
    const x = shlPos.getX(i), y = shlPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.875 - y) / 1.75));
    const uX = x / 0.875; // -1 a +1
    // Arco elegante flutuando atrás dos braços e ombros
    const archZ = -0.18 - Math.cos(uX * Math.PI * 0.5) * 0.14;
    const z = archZ - normY * 0.42;
    const fx = x * (0.78 + Math.sin(normY * Math.PI) * 0.35);
    shlPos.setXYZ(i, fx, y, z);
    shawlBase[i * 3] = fx;
    shawlBase[i * 3 + 1] = y;
    shawlBase[i * 3 + 2] = z;
  }
  shawlGeo.computeVertexNormals();
  const shawlMesh = sculpt(garments, shawlGeo, M.roseShawl, [0, -0.35, -0.05]);

  // ------------------------------------------------------------------------
  // G. POMBA BRANCA SAGRADA DE AFRODITE VOANDO AO SEU REDOR
  // ------------------------------------------------------------------------
  const doveOrbitGroup = new T.Group();
  root.add(doveOrbitGroup);

  const dove = new T.Group();
  doveOrbitGroup.add(dove);

  sculpt(dove, new T.SphereGeometry(0.085, 16, 16), M.doveWhite, [0, 0, 0], [0.3, 0, 0], [0.85, 1.45, 0.85]);
  const doveHead = group(dove, 0, 0.11, 0.045);
  sculpt(doveHead, new T.SphereGeometry(0.052, 14, 14), M.doveWhite);
  sculpt(doveHead, new T.ConeGeometry(0.012, 0.036, 6), M.goldPolished, [0, -0.005, 0.055], [Math.PI / 2, 0, 0]);
  // Cauda em leque da pomba
  sculpt(dove, new T.ConeGeometry(0.065, 0.16, 6), M.doveWhite, [0, -0.13, -0.05], [-2.4, 0, 0], [1.3, 1, 0.2]);

  const doveWingL = group(dove, -0.065, 0.04, 0);
  sculpt(doveWingL, new T.BoxGeometry(0.24, 0.01, 0.11), M.doveWhite, [-0.11, 0, -0.01], [0.1, 0.15, 0]);

  const doveWingR = group(dove, 0.065, 0.04, 0);
  sculpt(doveWingR, new T.BoxGeometry(0.24, 0.01, 0.11), M.doveWhite, [0.11, 0, -0.01], [0.1, -0.15, 0]);

  return {
    root, shellPlatform, body, torso, head, legs,
    rightArm, leftArm, floatingMirrorGroup, venusMirror, magicHandAnchor, magicHandGlow, leftHandGlow,
    hairStrands, skirtMesh, skirtBase, shawlMesh, shawlBase,
    doveOrbitGroup, dove, doveWingL, doveWingR
  };
}

/* ==========================================================================
   4. SANTUÁRIO DE CITERA (MÁRMORE ROSADO, COLUNAS COM ROSAS E ILUMINAÇÃO)
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x2a0e1d);
scene.fog = new T.FogExp2(0x3b1228, 0.016);

// Céu de Crepúsculo Dourado e Rosa-Aurora
const skyGeo = new T.SphereGeometry(80, 32, 32);
const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x1f0a1d) },
    midColor: { value: new T.Color(0x881337) },
    horizonColor: { value: new T.Color(0xfda4af) },
    sunDir: { value: new T.Vector3(0.45, 0.38, -0.78).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(horizonColor, midColor, smoothstep(0.40, 0.66, h));
      col = mix(col, topColor, smoothstep(0.66, 0.96, h));
      float sunGlow = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.85, 0.65) * pow(sunGlow, 8.0) * 0.5;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new T.Mesh(skyGeo, skyMat));

const camera = new T.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 150);

// Iluminação Suave e Luminosa
const hemi = new T.HemisphereLight(0xffe4e6, 0x881337, 1.12);
scene.add(hemi);

const sun = new T.DirectionalLight(0xfff1f2, 2.25);
sun.position.set(4.8, 8.0, 5.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 28 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const roseRim = new T.DirectionalLight(0xfb7185, 1.45);
roseRim.position.set(-4.5, 4.5, -5.0);
scene.add(roseRim);

const charmLight = new T.PointLight(0xfb7185, 2.0, 8);
scene.add(charmLight);

const pulseLight = new T.PointLight(0xfde047, 0, 16);
scene.add(pulseLight);

const textures = createProceduralTextures();

// Plataforma Circular de Mármore Rosado com Mandala de Pétalas
const arenaFloor = new T.Mesh(
  new T.CylinderGeometry(7.3, 7.6, 0.32, 72),
  new T.MeshStandardMaterial({ map: textures.floorTex, roughness: 0.34, metalness: 0.12 })
);
arenaFloor.position.y = -0.16;
arenaFloor.receiveShadow = true;
scene.add(arenaFloor);

const stepRing = new T.Mesh(
  new T.CylinderGeometry(7.9, 8.2, 0.18, 72),
  new T.MeshStandardMaterial({ color: 0xffe4e6, roughness: 0.45 })
);
stepRing.position.y = -0.24;
stepRing.receiveShadow = true;
scene.add(stepRing);

const roseRing = new T.Mesh(
  new T.RingGeometry(4.55, 4.65, 72),
  new T.MeshBasicMaterial({
    color: 0xfb7185,
    transparent: true,
    opacity: 0.78,
    blending: T.AdditiveBlending,
    side: T.DoubleSide
  })
);
roseRing.rotation.x = -Math.PI / 2;
roseRing.position.y = 0.015;
scene.add(roseRing);

// 8 Colunas Jônicas de Mármore Claro Enfeitadas com Grinaldas de Rosas
const marbleMat = new T.MeshStandardMaterial({ color: 0xfff1f2, roughness: 0.38, metalness: 0.06 });
const goldColMat = new T.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.2 });
const vineMat = new T.MeshStandardMaterial({ color: 0x15803d, roughness: 0.65 });
const roseBloomMat = new T.MeshStandardMaterial({
  color: 0xf43f5e,
  emissive: 0x881337,
  emissiveIntensity: 0.4,
  roughness: 0.35
});

const shaftGeo = new T.CylinderGeometry(0.22, 0.26, 2.75, 22, 1);
const shPos = shaftGeo.attributes.position;
for (let i = 0; i < shPos.count; i++) {
  const x = shPos.getX(i), y = shPos.getY(i), z = shPos.getZ(i);
  const ang = Math.atan2(z, x);
  const flute = Math.cos(ang * 18) * 0.007;
  const r = Math.sqrt(x * x + z * z) - flute;
  shPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
}
shaftGeo.computeVertexNormals();

for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + 0.2;
  const dist = 5.85;
  const col = group(scene, Math.cos(a) * dist, 0, Math.sin(a) * dist);

  sculpt(col, new T.BoxGeometry(0.72, 0.14, 0.72), marbleMat, [0, 0.07, 0]);
  sculpt(col, shaftGeo, marbleMat, [0, 1.52, 0]);
  sculpt(col, new T.CylinderGeometry(0.34, 0.22, 0.15, 20), marbleMat, [0, 2.96, 0]);
  sculpt(col, new T.BoxGeometry(0.64, 0.14, 0.64), marbleMat, [0, 3.10, 0]);
  sculpt(col, new T.BoxGeometry(0.54, 0.05, 0.54), goldColMat, [0, 3.20, 0]);

  // Grinalda espiralada de folhas e rosas ao redor do fuste
  const garlandPts = [];
  for (let g = 0; g <= 24; g++) {
    const t = g / 24;
    const ga = t * Math.PI * 4 + i;
    garlandPts.push(new T.Vector3(Math.cos(ga) * 0.255, 0.35 + t * 2.35, Math.sin(ga) * 0.255));
  }
  sculpt(col, new T.TubeGeometry(new T.CatmullRomCurve3(garlandPts), 24, 0.016, 6, false), vineMat);

  for (let r = 0; r < 6; r++) {
    const t = (r + 0.5) / 6;
    const ga = t * Math.PI * 4 + i;
    sculpt(col, new T.SphereGeometry(0.048, 10, 10), roseBloomMat, [Math.cos(ga) * 0.27, 0.35 + t * 2.35, Math.sin(ga) * 0.27]);
  }
}

// Geometria de Rosa 3D Esculpida para Florescer na Arena
function createRose3DGeometry() {
  const roseGroup = new T.Group();
  const petalOuterMat = new T.MeshStandardMaterial({
    color: 0xe11d48,
    emissive: 0x881337,
    emissiveIntensity: 0.65,
    roughness: 0.3,
    side: T.DoubleSide
  });
  const petalInnerMat = new T.MeshStandardMaterial({
    color: 0xfb7185,
    emissive: 0xf43f5e,
    emissiveIntensity: 0.85,
    roughness: 0.25,
    side: T.DoubleSide
  });

  // Miolo espiral da rosa
  const core = new T.Mesh(new T.ConeGeometry(0.09, 0.22, 8), petalInnerMat);
  core.position.y = 0.12;
  roseGroup.add(core);

  // 2 camadas de pétalas abertas
  for (let layer = 0; layer < 2; layer++) {
    const count = layer === 0 ? 5 : 7;
    const tilt = layer === 0 ? 0.55 : 0.98;
    const rad = layer === 0 ? 0.08 : 0.14;
    for (let p = 0; p < count; p++) {
      const a = (p / count) * Math.PI * 2 + layer * 0.4;
      const pet = new T.Mesh(new T.SphereGeometry(0.11, 10, 8, 0, Math.PI, 0, Math.PI * 0.6), layer === 0 ? petalInnerMat : petalOuterMat);
      pet.position.set(Math.cos(a) * rad, 0.10, Math.sin(a) * rad);
      pet.rotation.set(Math.sin(a) * tilt, -a, -Math.cos(a) * tilt);
      pet.scale.set(1.1, 1.2, 0.45);
      roseGroup.add(pet);
    }
  }
  return roseGroup;
}

// Ondas de Encanto Irresistível, Corações, Rosas 3D e Feixes Espirais
const charmWaves = [];
const floatingHearts = [];
const bloomingRoses = [];
const danceTrails = [];

function createHeartGeometry(scale = 1) {
  const s = new T.Shape();
  s.moveTo(0, 0.12 * scale);
  s.bezierCurveTo(0, 0.20 * scale, -0.14 * scale, 0.22 * scale, -0.14 * scale, 0.10 * scale);
  s.bezierCurveTo(-0.14 * scale, 0.0, 0, -0.10 * scale, 0, -0.18 * scale);
  s.bezierCurveTo(0, -0.10 * scale, 0.14 * scale, 0.0, 0.14 * scale, 0.10 * scale);
  s.bezierCurveTo(0.14 * scale, 0.22 * scale, 0, 0.20 * scale, 0, 0.12 * scale);
  const geo = new T.ExtrudeGeometry(s, { depth: 0.03 * scale, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 });
  geo.center();
  return geo;
}
const heartGeo = createHeartGeometry(1.15);

function spawnCharmPulse(x, z) {
  // Onda dupla prismática (Rosa-Carmesim + Ouro Luminoso)
  for (let w = 0; w < 2; w++) {
    const ring = new T.Mesh(
      new T.RingGeometry(0.32 + w * 0.15, 0.65 + w * 0.15, 56),
      new T.MeshBasicMaterial({
        color: w === 0 ? 0xfb7185 : 0xfde047,
        transparent: true,
        opacity: 0.92,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, 0.05 + w * 0.02, z);
    scene.add(ring);
    charmWaves.push({ mesh: ring, life: 1.35, max: 1.35, maxScale: 8.5 - w * 1.5 });
  }

  // Corações luminosos e Rosas 3D desabrochando em espiral
  for (let h = 0; h < 8; h++) {
    const a = (h / 8) * Math.PI * 2 + Math.random() * 0.35;
    const hm = new T.Mesh(
      heartGeo,
      new T.MeshBasicMaterial({
        color: h % 2 === 0 ? 0xf43f5e : 0xfde047,
        transparent: true,
        opacity: 0.94,
        blending: T.AdditiveBlending
      })
    );
    hm.position.set(x + Math.cos(a) * 0.85, 1.35 + Math.random() * 0.55, z + Math.sin(a) * 0.85);
    hm.rotation.y = -a + Math.PI / 2;
    scene.add(hm);
    floatingHearts.push({
      mesh: hm,
      angle: a,
      radius: 0.85,
      radialSpeed: 1.65,
      vy: 2.1 + Math.random() * 0.9,
      life: 1.25,
      max: 1.25
    });
  }

  // 3 Rosas 3D florescendo no piso de mármore ao redor
  for (let r = 0; r < 3; r++) {
    const ra = Math.random() * Math.PI * 2;
    const rDist = 1.6 + Math.random() * 2.4;
    const rose = createRose3DGeometry();
    rose.position.set(x + Math.cos(ra) * rDist, 0.02, z + Math.sin(ra) * rDist);
    rose.scale.setScalar(0.05);
    scene.add(rose);
    bloomingRoses.push({ mesh: rose, life: 1.6, max: 1.6 });
  }

  pulseLight.position.set(x, 1.9, z);
  pulseLight.intensity = 11.0;
}

function spawnDanceTrail(x, z) {
  const ring = new T.Mesh(

/* ==========================================================================
   6. CONTROLES INTERATIVOS E CÂMERA 360° / FOCO NO ROSTO
   ========================================================================== */
let mode = 'graca';
let charmTimer = 0;
let trailTimer = 0;
let tideWeight = 0;
let focusFace = false;

let camAngle = 0.36;
let camPitch = 0.16;
let camDist = 8.2;
let targetCamDist = 8.2;
let currentLookAt = new T.Vector3(0, 1.85, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    charmTimer = 0.08;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 2.45 : 8.2;
  if (focusFace) {
    camAngle = 0.15;
    camPitch = 0.06;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.75, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.75, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (GRAÇA DIVINA, DANÇA NAS PÉTALAS, ENCANTO & MARÉ DE PAIXÃO)
   ========================================================================== */
const tmpV = new T.Vector3();

function update(dt, t) {
  let ax = 0, az = 0, yaw = Math.sin(t * 0.45) * 0.22, pitch = 0.02, roll = 0;
  const floatY = Math.sin(t * 1.65) * 0.08;

  // 1. MOVIMENTAÇÃO E POSTURA POR MODO
  if (mode === 'danca') {
    const a = t * 0.78;
    const R = 2.75;
    ax = Math.cos(a) * R;
    az = Math.sin(a) * R;
    yaw = -a + Math.sin(t * 2.4) * 0.35;
    pitch = 0.08;
    roll = -0.16;

    trailTimer -= dt;
    if (trailTimer <= 0) {
      trailTimer = 0.11;
      spawnDanceTrail(ax, az);
    }
  } else {
    ax = Math.sin(t * 0.45) * 0.16;
    az = Math.cos(t * 0.38) * 0.14;
  }

  aphrodite.root.position.set(ax, floatY, az);
  aphrodite.root.rotation.set(0, yaw, 0);
  aphrodite.body.rotation.set(pitch, 0, roll);
  aphrodite.shellPlatform.rotation.y = Math.sin(t * 0.5) * 0.08;

  // 2. POSE GRACIOSA DE MÃOS LIVRES (ESPELHO SAGRADO FLUTUANDO AO LADO)
  if (mode === 'encanto') {
    // Mãos abertas e graciosas projetando ondas de encanto e corações
    aphrodite.rightArm.arm.rotation.set(-0.92, 0.28, 0.95 + Math.sin(t * 2.2) * 0.06);
    aphrodite.rightArm.elbow.rotation.set(-0.42, 0.2, 0.22);
    aphrodite.leftArm.arm.rotation.set(-0.78, -0.28, -0.88 + Math.cos(t * 2.2) * 0.06);
    aphrodite.leftArm.elbow.rotation.set(-0.48, -0.2, -0.22);

    charmTimer -= dt;
    if (charmTimer <= 0) {
      charmTimer = 0.92;
      spawnCharmPulse(ax, az);
    }
  } else if (mode === 'mare') {
    // Braços erguidos em dança celestial invocando a Maré de Paixão
    aphrodite.rightArm.arm.rotation.set(-0.35, 0.25, 2.15 + Math.sin(t * 2.0) * 0.06);
    aphrodite.rightArm.elbow.rotation.set(0.45, 0.2, 0.25);
    aphrodite.leftArm.arm.rotation.set(-0.35, -0.25, -2.05 + Math.cos(t * 2.0) * 0.06);
    aphrodite.leftArm.elbow.rotation.set(0.45, -0.2, -0.25);
  } else {
    // Graça Divina / Dança nas Pétalas: braços e mãos livres em pose etérea de deusa
    aphrodite.leftArm.arm.rotation.set(-0.32, -0.25, -0.68 + Math.sin(t * 1.5) * 0.045);
    aphrodite.leftArm.elbow.rotation.set(-0.68, -0.22, -0.18);
    aphrodite.rightArm.arm.rotation.set(-0.26, 0.22, 0.58 + Math.cos(t * 1.5) * 0.045);
    aphrodite.rightArm.elbow.rotation.set(-0.62, 0.25, 0.18);
  }

  // Espelho Sagrado de Vênus flutuando suavemente ao lado esquerdo de Afrodite
  const mirrorAng = t * 0.72 + 2.35;
  aphrodite.floatingMirrorGroup.position.set(
    Math.cos(mirrorAng) * 0.94,
    1.88 + Math.sin(t * 2.1) * 0.09,
    Math.sin(mirrorAng) * 0.94
  );
  aphrodite.floatingMirrorGroup.rotation.y = -mirrorAng + Math.PI / 2;
  aphrodite.venusMirror.rotation.z = Math.sin(t * 1.6) * 0.06;

  // Pomba Sagrada voando suavemente ao redor de Afrodite
  const doveAng = t * 1.1;
  aphrodite.doveOrbitGroup.position.set(
    Math.cos(doveAng) * 0.98,
    2.55 + Math.sin(t * 2.5) * 0.14,
    Math.sin(doveAng) * 0.98
  );
  aphrodite.doveOrbitGroup.rotation.y = -doveAng;
  aphrodite.dove.rotation.z = -0.22;
  const doveFlap = Math.sin(t * 12.0) * 0.55;
  aphrodite.doveWingL.rotation.z = doveFlap;
  aphrodite.doveWingR.rotation.z = -doveFlap;

  // Brilho mágico nas palmas livres de ambas as mãos
  const handBoost = (mode === 'encanto' || mode === 'mare') ? 0.55 : 0;
  aphrodite.magicHandGlow.scale.setScalar(0.85 + Math.sin(t * 10) * 0.18 + handBoost);
  aphrodite.leftHandGlow.scale.setScalar(0.85 + Math.cos(t * 10) * 0.18 + handBoost);
  aphrodite.magicHandAnchor.getWorldPosition(tmpV);
  charmLight.position.copy(tmpV);

  // Vento suave nos cabelos dourados, saia de seda e xale rosa
  const wind = (mode === 'danca' || mode === 'mare') ? 1.85 : 1.0;
  for (const s of aphrodite.hairStrands) {
    s.mesh.rotation.x = Math.sin(t * 2.2 * wind + s.phase) * 0.035;
    s.mesh.rotation.z = Math.cos(t * 1.8 * wind + s.phase) * 0.028;
  }

  const shAttr = aphrodite.shawlMesh.geometry.attributes.position;
  for (let i = 0; i < shAttr.count; i++) {
    const bx = aphrodite.shawlBase[i * 3];
    const by = aphrodite.shawlBase[i * 3 + 1];
    const bz = aphrodite.shawlBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.875 - by) / 1.75));
    const wave = Math.sin(t * 2.8 * wind - normY * 4.0 + bx * 2.5) * 0.14 * normY;
    shAttr.setXYZ(i, bx + Math.sin(t * 2.2 - normY * 3.0) * 0.04 * normY, by, bz + wave);
  }
  shAttr.needsUpdate = true;
  aphrodite.shawlMesh.geometry.computeVertexNormals();

  const skAttr = aphrodite.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = aphrodite.skirtBase[i * 3];
    const by = aphrodite.skirtBase[i * 3 + 1];
    const bz = aphrodite.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.63 - by) / 1.26));
    skAttr.setZ(i, bz + Math.sin(t * 3.0 * wind - normY * 4.0 + bx * 4.0) * 0.042 * normY);
  }
  skAttr.needsUpdate = true;
  aphrodite.skirtMesh.geometry.computeVertexNormals();

  // 3. PÉTALAS DE ROSA, ONDAS DE ENCANTO, CORAÇÕES E MARÉ DE PAIXÃO
  for (const p of petals) {
    p.angle += p.swirlSpeed * dt * (mode === 'mare' ? 2.4 : 1.0);
    p.y -= p.fallSpeed * dt;
    if (p.y < 0.1) p.y = 5.0;
    p.mesh.position.set(
      Math.cos(p.angle) * p.radius,
      p.y,
      Math.sin(p.angle) * p.radius
    );
    p.mesh.rotation.set(t * 1.5 + p.phase, t * 2.0, Math.sin(t + p.phase));
  }

  for (let i = charmWaves.length - 1; i >= 0; i--) {
    const cw = charmWaves[i];
    cw.life -= dt;
    const k = Math.max(0, cw.life / cw.max);
    cw.mesh.scale.setScalar(1 + (1 - k) * (cw.maxScale || 7.5));
    cw.mesh.material.opacity = 0.92 * k;
    if (cw.life <= 0) {
      scene.remove(cw.mesh);
      cw.mesh.geometry.dispose();
      cw.mesh.material.dispose();
      charmWaves.splice(i, 1);
    }
  }

  for (let i = floatingHearts.length - 1; i >= 0; i--) {
    const fh = floatingHearts[i];
    fh.life -= dt;
    const k = Math.max(0, fh.life / fh.max);
    fh.angle += dt * 2.2;
    fh.radius += fh.radialSpeed * dt;
    fh.mesh.position.x = ax + Math.cos(fh.angle) * fh.radius;
    fh.mesh.position.z = az + Math.sin(fh.angle) * fh.radius;
    fh.mesh.position.y += fh.vy * dt;
    fh.mesh.rotation.y += dt * 3.5;
    fh.mesh.scale.setScalar(0.65 + (1 - k) * 0.85);
    fh.mesh.material.opacity = 0.94 * k;
    if (fh.life <= 0) {
      scene.remove(fh.mesh);
      fh.mesh.material.dispose();
      floatingHearts.splice(i, 1);
    }
  }

  for (let i = bloomingRoses.length - 1; i >= 0; i--) {
    const br = bloomingRoses[i];
    br.life -= dt;
    const k = Math.max(0, br.life / br.max);
    const bloomScale = Math.sin((1 - k) * Math.PI) * 1.45;
    br.mesh.scale.setScalar(Math.max(0.05, bloomScale));
    br.mesh.rotation.y += dt * 1.5;
    if (br.life <= 0) {
      scene.remove(br.mesh);
      br.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      bloomingRoses.splice(i, 1);
    }
  }

  for (let i = danceTrails.length - 1; i >= 0; i--) {
    const dtItem = danceTrails[i];
    dtItem.life -= dt;
    const k = Math.max(0, dtItem.life / dtItem.max);
    dtItem.mesh.scale.setScalar(1 + (1 - k) * 2.4);
    dtItem.mesh.material.opacity = 0.78 * k;
    if (dtItem.life <= 0) {
      scene.remove(dtItem.mesh);
      dtItem.mesh.geometry.dispose();
      dtItem.mesh.material.dispose();
      danceTrails.splice(i, 1);
    }
  }

  // Maré de Paixão ativa (Ciclone de fitas rosa-douradas + rosas 3D)
  const tideTarget = (mode === 'mare') ? 1 : 0;
  tideWeight = T.MathUtils.damp(tideWeight, tideTarget, 3.0, dt);
  passionTideGroup.visible = tideWeight > 0.02;
  if (passionTideGroup.visible) {
    passionTideGroup.position.set(ax, 0, az);
    tideVortexRing1.rotation.z += dt * 2.6;
    tideVortexRing2.rotation.z -= dt * 3.4;
    tideBeam.rotation.y += dt * 1.6;
    for (let r = 0; r < spiralRibbons.length; r++) {
      spiralRibbons[r].rotation.y += dt * (2.4 + r * 0.25);
      spiralRibbons[r].scale.setScalar(tideWeight);
      spiralRibbons[r].material.opacity = 0.85 * tideWeight;
    }
    tideVortexRing1.scale.setScalar(tideWeight * (1 + Math.sin(t * 6) * 0.08));
    tideVortexRing2.scale.setScalar(tideWeight * (1 + Math.cos(t * 6) * 0.08));
    tideBeam.material.opacity = 0.28 * tideWeight;
    if (Math.random() < 0.28) spawnCharmPulse(ax, az);
  }

  roseRing.rotation.z += dt * 0.18;
  pulseLight.intensity = Math.max(0, pulseLight.intensity - dt * 12);

  // 4. CÂMERA INTERATIVA 360° + ZOOM + FOCO NO ROSTO
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(ax, 2.38 + floatY, az)
    : new T.Vector3(0, 1.65, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
</body>
