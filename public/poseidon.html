<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poseidon - Deus dos Mares | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #eab308;
      --cyan: #2dd4bf;
      --abyss: #04151f;
      --glass: rgba(4, 24, 34, 0.78);
      --border: rgba(45, 212, 191, 0.42);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--abyss);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #e6fffa;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #5eead4;
      transform: translateY(-1px);
      background: rgba(8, 42, 58, 0.92);
    }
    button.on {
      background: linear-gradient(135deg, #2dd4bf 0%, #0284c7 100%);
      color: #03151e;
      border-color: #99f6e4;
      box-shadow: 0 0 20px rgba(45, 212, 191, 0.55);
    }
    button.cam-btn {
      border-color: rgba(234, 179, 8, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      color: #09131a;
      border-color: #fef08a;
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #5eead4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 880px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(4, 24, 34, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(94, 234, 212, 0.25);
      padding: 7px 16px;
      border-radius: 999px;
      color: #ccfbf1;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="conduzido" class="on">Conduzido pelas Águas</button>
    <button data-m="correnteza">Navegar na Correnteza</button>
    <button data-m="golpe">Golpe do Tridente</button>
    <button data-m="tsunami">Tsunami</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto / Tridente</button>
  </div>
</div>

<div id="badge">Olympus • Poseidon</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE, PEDRA ATLANTE, TECIDO E ÁGUA)
   ========================================================================== */
function createProceduralTextures() {
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6500; i++) {
    const v = 122 + Math.floor(Math.random() * 14);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  const tunicCanvas = document.createElement('canvas');
  tunicCanvas.width = 512;
  tunicCanvas.height = 256;
  const tCtx = tunicCanvas.getContext('2d');
  const grad = tCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#083344');
  grad.addColorStop(0.65, '#115e59');
  grad.addColorStop(1, '#042f2e');
  tCtx.fillStyle = grad;
  tCtx.fillRect(0, 0, 512, 256);

  tCtx.strokeStyle = 'rgba(45, 212, 191, 0.16)';
  tCtx.lineWidth = 2;
  for (let y = 16; y < 200; y += 24) {
    for (let x = 0; x < 512; x += 32) {
      tCtx.beginPath();
      tCtx.arc(x + 16, y, 14, 0, Math.PI);
      tCtx.stroke();
    }
  }

  tCtx.fillStyle = '#ca8a04';
  tCtx.fillRect(0, 206, 512, 36);
  tCtx.fillStyle = '#04151f';
  tCtx.fillRect(0, 204, 512, 3);
  tCtx.fillRect(0, 242, 512, 3);
  for (let x = 0; x < 512; x += 32) {
    tCtx.beginPath();
    tCtx.arc(x + 16, 224, 10, 0, Math.PI * 1.65);
    tCtx.strokeStyle = '#04151f';
    tCtx.lineWidth = 3;
    tCtx.stroke();
  }
  const tunicTex = new T.CanvasTexture(tunicCanvas);
  tunicTex.wrapS = tunicTex.wrapT = T.RepeatWrapping;

  const stoneCanvas = document.createElement('canvas');
  stoneCanvas.width = stoneCanvas.height = 256;
  const mCtx = stoneCanvas.getContext('2d');
  mCtx.fillStyle = '#1e3a44';
  mCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1200; i++) {
    mCtx.fillStyle = i % 2 === 0 ? 'rgba(13, 148, 136, 0.15)' : 'rgba(15, 23, 42, 0.25)';
    mCtx.fillRect(Math.random() * 256, Math.random() * 256, 6, 6);
  }
  mCtx.strokeStyle = 'rgba(45, 212, 191, 0.35)';
  mCtx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    mCtx.beginPath();
    let mx = Math.random() * 256, my = 0;
    mCtx.moveTo(mx, my);
    while (my < 256) {
      my += 22;
      mx += (Math.random() - 0.5) * 28;
      mCtx.lineTo(mx, my);
    }
    mCtx.stroke();
  }
  const stoneTex = new T.CanvasTexture(stoneCanvas);
  stoneTex.wrapS = stoneTex.wrapT = T.RepeatWrapping;

  const foamCanvas = document.createElement('canvas');
  foamCanvas.width = foamCanvas.height = 256;
  const fCtx = foamCanvas.getContext('2d');
  fCtx.fillStyle = '#0284c7';
  fCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    const r = 2 + Math.random() * 14;
    fCtx.strokeStyle = `rgba(224, 242, 254, ${0.12 + Math.random() * 0.28})`;
    fCtx.lineWidth = 1.5;
    fCtx.beginPath();
    fCtx.arc(Math.random() * 256, Math.random() * 256, r, 0, Math.PI * 2);
    fCtx.stroke();
  }
  const waterTex = new T.CanvasTexture(foamCanvas);
  waterTex.wrapS = waterTex.wrapT = T.RepeatWrapping;
  waterTex.repeat.set(3, 3);

  return { skinBump, tunicTex, stoneTex, waterTex };
}

function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xa9704c,
      roughness: 0.38,
      metalness: 0.1,
      bumpMap: textures.skinBump,
      bumpScale: 0.004
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0x8c5838,
      roughness: 0.42,
      metalness: 0.1,
      bumpMap: textures.skinBump,
      bumpScale: 0.004
    }),
    tattooGlow: new T.MeshStandardMaterial({
      color: 0x2dd4bf,
      emissive: 0x14b8a6,
      emissiveIntensity: 2.2,
      roughness: 0.2
    }),
    hairDarkSea: new T.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.48,
      metalness: 0.15
    }),
    hairTealStreak: new T.MeshStandardMaterial({
      color: 0x134e4a,
      emissive: 0x042f2e,
      emissiveIntensity: 0.35,
      roughness: 0.42,
      metalness: 0.2
    }),
    beardSilverTeal: new T.MeshStandardMaterial({
      color: 0xcbd5e1,
      roughness: 0.45,
      metalness: 0.15
    }),
    atlanteanBronze: new T.MeshStandardMaterial({
      color: 0xb45309,
      emissive: 0x291102,
      emissiveIntensity: 0.25,
      metalness: 0.88,
      roughness: 0.24
    }),
    darkGold: new T.MeshStandardMaterial({
      color: 0xca8a04,
      emissive: 0x3b2200,
      emissiveIntensity: 0.3,
      metalness: 0.9,
      roughness: 0.2
    }),
    blackGold: new T.MeshStandardMaterial({
      color: 0x292524,
      emissive: 0x1c1917,
      metalness: 0.92,
      roughness: 0.22
    }),
    abyssGem: new T.MeshStandardMaterial({
      color: 0x2dd4bf,
      emissive: 0x0d9488,
      emissiveIntensity: 2.6,
      roughness: 0.12,
      metalness: 0.3
    }),
    tunic: new T.MeshStandardMaterial({
      map: textures.tunicTex,
      color: 0xffffff,
      roughness: 0.58,
      metalness: 0.08,
      side: T.DoubleSide
    }),
    cape: new T.MeshStandardMaterial({
      color: 0x062c3b,
      emissive: 0x021219,
      roughness: 0.5,
      metalness: 0.18,
      side: T.DoubleSide
    }),
    eyeEmerald: new T.MeshStandardMaterial({
      color: 0x34d399,
      emissive: 0x10b981,
      emissiveIntensity: 3.4,
      roughness: 0.08
    }),
    vortexWater: new T.MeshStandardMaterial({
      map: textures.waterTex,
      color: 0x0ea5e9,
      emissive: 0x0369a1,
      emissiveIntensity: 0.55,
      roughness: 0.15,
      metalness: 0.2,
      transparent: true,
      opacity: 0.84,
      side: T.DoubleSide
    }),
    foamWhite: new T.MeshStandardMaterial({
      color: 0xf0f9ff,
      emissive: 0x7dd3fc,
      emissiveIntensity: 0.45,
      roughness: 0.65,
      transparent: true,
      opacity: 0.9
    })
  };
}

function buildPoseidon(textures) {
  const M = createMaterials(textures);
  const vessel = new T.Group();
  const vortexGroup = group(vessel, 0, 0, 0);

  const vortexGeo = new T.CylinderGeometry(0.46, 0.98, 1.35, 36, 16, true);
  const vPos = vortexGeo.attributes.position;
  for (let i = 0; i < vPos.count; i++) {
    const x = vPos.getX(i), y = vPos.getY(i), z = vPos.getZ(i);
    const normY = (y + 0.675) / 1.35;
    const ang = Math.atan2(z, x);
    const spiral = Math.sin(ang * 4 + normY * 7.5) * 0.075 * (1 - normY * 0.4);
    const r = Math.sqrt(x * x + z * z) + spiral;
    vPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
  }
  vortexGeo.computeVertexNormals();
  const vortexCone = new T.Mesh(vortexGeo, M.vortexWater);
  vortexCone.position.y = 0.62;
  vortexGroup.add(vortexCone);

  const innerVortex = new T.Mesh(
    new T.CylinderGeometry(0.32, 0.65, 1.25, 24, 1, true),
    new T.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.42,
      blending: T.AdditiveBlending,
      depthWrite: false,
      side: T.DoubleSide
    })
  );
  innerVortex.position.y = 0.6;
  vortexGroup.add(innerVortex);

  const baseFoam = new T.Mesh(new T.TorusGeometry(0.95, 0.16, 12, 36), M.foamWhite);
  baseFoam.rotation.x = Math.PI / 2;
  baseFoam.position.y = 0.08;
  vortexGroup.add(baseFoam);

  const swirlRings = [];
  for (let i = 0; i < 4; i++) {
    const t = i / 3;
    const rad = 0.88 - t * 0.42;
    const sw = new T.Mesh(
      new T.TorusGeometry(rad, 0.032, 8, 32),
      new T.MeshBasicMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.72,
        blending: T.AdditiveBlending,
        depthWrite: false
      })
    );
    sw.rotation.x = Math.PI / 2 + (i % 2 === 0 ? 0.14 : -0.14);
    sw.position.y = 0.18 + t * 0.92;
    vortexGroup.add(sw);
    swirlRings.push({ mesh: sw, baseY: sw.position.y, phase: i * 1.4 });
  }

  const body = group(vessel, 0, 1.18, 0);

  const pelvis = group(body, 0, 0.92, 0);
  sculpt(pelvis, new T.SphereGeometry(0.26, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.15, 0.75, 0.85]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.18, -0.04, 0);

    sculpt(hip, new T.CylinderGeometry(0.15, 0.106, 0.48, 20), M.skin, [0, -0.23, 0], [0, 0, 0], [1.04, 1, 1.1]);
    const quadGeo = new T.SphereGeometry(0.115, 16, 16);
    sculpt(hip, quadGeo, M.skin, [s * 0.022, -0.20, 0.052], [0, 0, 0], [0.95, 1.85, 0.85]);
    sculpt(hip, quadGeo, M.skin, [s * 0.052, -0.23, 0.01], [0, 0, 0], [0.85, 1.75, 0.9]);

    sculpt(hip, new T.SphereGeometry(0.094, 16, 16), M.skin, [0, -0.48, 0.015], [0, 0, 0], [0.95, 0.95, 1.02]);

    const knee = group(hip, 0, -0.49, 0);
    sculpt(knee, new T.CylinderGeometry(0.095, 0.058, 0.44, 18), M.skin, [0, -0.22, 0], [0, 0, 0], [0.96, 1, 1.03]);
    sculpt(knee, new T.SphereGeometry(0.09, 16, 16), M.skin, [0, -0.15, -0.04], [0, 0, 0], [0.97, 1.65, 0.96]);

    sculpt(knee, new T.CylinderGeometry(0.092, 0.062, 0.34, 14, 1, false, -0.8, 1.6), M.atlanteanBronze, [0, -0.23, 0.012]);

    const ankle = group(knee, 0, -0.44, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.098, 0.05, 0.22), M.skin, [0, -0.02, 0.04], [0.08, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.108, 0.018, 0.238), M.darkGold, [0, -0.046, 0.04], [0.08, 0, 0]);
    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.28, -0.15, -0.12);
  legs.L.knee.rotation.set(0.36, 0, 0);
  legs.R.hip.rotation.set(0.22, 0.18, 0.14);
  legs.R.knee.rotation.set(0.24, 0, 0);

  const torso = group(body, 0, 1.35, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.27, -0.40),
    new T.Vector2(0.24, -0.20),
    new T.Vector2(0.30, 0.03),
    new T.Vector2(0.41, 0.27),
    new T.Vector2(0.36, 0.43),
    new T.Vector2(0.16, 0.50),
    new T.Vector2(0.01, 0.51)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.22, 1.0, 0.75]);

  const pecGeo = new T.SphereGeometry(0.225, 24, 24);
  sculpt(torso, pecGeo, M.skin, [-0.195, 0.23, 0.17], [0.12, -0.22, -0.14], [1.07, 0.86, 0.60]);
  sculpt(torso, pecGeo, M.skin, [0.195, 0.23, 0.17], [0.12, 0.22, 0.14], [1.07, 0.86, 0.60]);

  const chestRuneCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.34, 0.34, 0.10),
    new T.Vector3(-0.24, 0.28, 0.24),
    new T.Vector3(-0.14, 0.21, 0.27),
    new T.Vector3(-0.18, 0.12, 0.25)
  ]);
  sculpt(torso, new T.TubeGeometry(chestRuneCurve, 16, 0.008, 6, false), M.tattooGlow);

  const shoulderRuneCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.38, 0.36, -0.02),
    new T.Vector3(-0.32, 0.25, 0.16),
    new T.Vector3(-0.25, 0.16, 0.22)
  ]);
  sculpt(torso, new T.TubeGeometry(shoulderRuneCurve, 12, 0.007, 6, false), M.tattooGlow);

  const abGeo = new T.SphereGeometry(0.088, 16, 16);
  [
    { y: 0.04, sx: 1.0, sy: 0.75, z: 0.218 },
    { y: -0.075, sx: 0.96, sy: 0.78, z: 0.214 },
    { y: -0.195, sx: 0.88, sy: 0.84, z: 0.204 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.074, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.48]);
    sculpt(torso, abGeo, M.skin, [0.074, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.48]);
  });

  const obliqueGeo = new T.CapsuleGeometry(0.082, 0.23, 10, 16);
  sculpt(torso, obliqueGeo, M.skin, [-0.255, -0.11, 0.088], [0.1, 0, -0.18], [0.86, 1, 0.86]);
  sculpt(torso, obliqueGeo, M.skin, [0.255, -0.11, 0.088], [0.1, 0, 0.18], [0.86, 1, 0.86]);

  const latGeo = new T.SphereGeometry(0.245, 20, 20);
  sculpt(torso, latGeo, M.skin, [-0.22, 0.17, -0.12], [0, 0, -0.25], [1.02, 1.35, 0.66]);
  sculpt(torso, latGeo, M.skin, [0.22, 0.17, -0.12], [0, 0, 0.25], [1.02, 1.35, 0.66]);

  const trapGeo = new T.SphereGeometry(0.225, 18, 18);
  sculpt(torso, trapGeo, M.skin, [-0.19, 0.42, -0.045], [0, 0, 0.42], [1.12, 0.66, 0.76]);
  sculpt(torso, trapGeo, M.skin, [0.19, 0.42, -0.045], [0, 0, -0.42], [1.12, 0.66, 0.76]);

  sculpt(torso, new T.CylinderGeometry(0.128, 0.162, 0.26, 20), M.skin, [0, 0.53, -0.01], [0.08, 0, 0], [1, 1, 1.06]);

  const head = group(torso, 0, 0.75, 0.038);

  const skullGeo = new T.SphereGeometry(0.21, 36, 36);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.24;
    x *= 0.88;
    if (y < 0.03 && y > -0.10 && z > 0) { x *= 1.12; z *= 1.08; }
    if (y <= -0.09 && z > -0.02) { x *= 0.90; z *= 1.12; }
    if (z < -0.12) z *= 0.92;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  const cheekGeo = new T.BoxGeometry(0.065, 0.048, 0.065);
  sculpt(head, cheekGeo, M.skin, [-0.078, -0.012, 0.158], [0.15, -0.45, -0.2]);
  sculpt(head, cheekGeo, M.skin, [0.078, -0.012, 0.158], [0.15, 0.45, 0.2]);

  const noseUpper = new T.BoxGeometry(0.028, 0.065, 0.056);
  sculpt(head, noseUpper, M.skin, [0, 0.018, 0.198], [-0.22, 0, 0]);
  const noseLower = new T.BoxGeometry(0.026, 0.052, 0.054);
  sculpt(head, noseLower, M.skin, [0, -0.026, 0.206], [0.06, 0, 0]);
  sculpt(head, new T.ConeGeometry(0.02, 0.038, 10), M.skin, [0, -0.046, 0.218], [1.45, 0, 0]);

  const browRidge = new T.CapsuleGeometry(0.017, 0.072, 8, 12);
  sculpt(head, browRidge, M.skinShade, [-0.052, 0.046, 0.186], [0.12, 0.25, 1.24]);
  sculpt(head, browRidge, M.skinShade, [0.052, 0.046, 0.186], [0.12, -0.25, -1.24]);

  const eyebrow = new T.CapsuleGeometry(0.014, 0.072, 8, 12);
  sculpt(head, eyebrow, M.hairDarkSea, [-0.052, 0.054, 0.196], [0.12, 0.25, 1.20], [1.1, 1, 0.85]);
  sculpt(head, eyebrow, M.hairDarkSea, [0.052, 0.054, 0.196], [0.12, -0.25, -1.20], [1.1, 1, 0.85]);

  sculpt(head, new T.BoxGeometry(0.008, 0.034, 0.015), M.skinShade, [-0.01, 0.048, 0.198], [0, 0, 0.08]);

    const archZ = -0.18 - Math.cos((x / 0.68) * Math.PI * 0.5) * 0.08;

  return {

const SPRAY_N = 420;
const sprayPos = new Float32Array(SPRAY_N * 3).fill(-100);
const sprayVel = new Float32Array(SPRAY_N * 3);
const sprayLife = new Float32Array(SPRAY_N);
let sprayIdx = 0;

const sprayGeo = new T.BufferGeometry();
sprayGeo.setAttribute('position', new T.BufferAttribute(sprayPos, 3));
scene.add(new T.Points(sprayGeo, new T.PointsMaterial({
  color: 0xe0f2fe,
  size: 0.11,
  transparent: true,
  opacity: 0.9,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnSpray(x, y, z, vxSpread = 3.5, vyMin = 1.5, vyMax = 4.8) {
  const i = sprayIdx;
  sprayIdx = (sprayIdx + 1) % SPRAY_N;
  sprayPos[i * 3] = x;
  sprayPos[i * 3 + 1] = y;
  sprayPos[i * 3 + 2] = z;
  sprayVel[i * 3] = (Math.random() - 0.5) * vxSpread;
  sprayVel[i * 3 + 1] = vyMin + Math.random() * (vyMax - vyMin);
  sprayVel[i * 3 + 2] = (Math.random() - 0.5) * vxSpread;
  sprayLife[i] = 0.65 + Math.random() * 0.5;
}

function updateSpray(dt) {
  for (let i = 0; i < SPRAY_N; i++) {
    if (sprayLife[i] <= 0) continue;
    sprayLife[i] -= dt;
    sprayVel[i * 3 + 1] -= 9.5 * dt;
    sprayPos[i * 3] += sprayVel[i * 3] * dt;
    sprayPos[i * 3 + 1] += sprayVel[i * 3 + 1] * dt;
    sprayPos[i * 3 + 2] += sprayVel[i * 3 + 2] * dt;
    if (sprayLife[i] <= 0) sprayPos[i * 3 + 1] = -100;
  }
  sprayGeo.attributes.position.needsUpdate = true;
}

function triggerTridentSlam(originX, originZ, facingYaw) {
  for (let k = 0; k < 3; k++) {
    const sw = new T.Mesh(
      new T.RingGeometry(0.35, 0.65, 48),
      new T.MeshBasicMaterial({
        color: k === 0 ? 0xffffff : 0x2dd4bf,
        transparent: true,
        opacity: 0.92,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })
    );
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(originX, 0.14 + k * 0.03, originZ);
    scene.add(sw);
    shockwaves.push({ mesh: sw, life: 1.15, max: 1.15, delay: k * 0.12 });
  }

  const dirX = Math.sin(facingYaw);
  const dirZ = Math.cos(facingYaw);
  for (let g = 1; g <= 5; g++) {
    const gx = originX + dirX * (g * 1.15);
    const gz = originZ + dirZ * (g * 1.15);
    const gCol = new T.Mesh(
      new T.CylinderGeometry(0.16 + g * 0.03, 0.38 + g * 0.04, 3.6, 18, 1, true),
      new T.MeshBasicMaterial({
        color: 0x5eead4,
        transparent: true,
        opacity: 0.82,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })
    );
    gCol.position.set(gx, 0.1, gz);
    gCol.scale.set(1, 0.01, 1);
    scene.add(gCol);
    geysers.push({ mesh: gCol, gx, gz, life: 1.1, max: 1.1, delay: g * 0.09, erupted: false });
  }

  impactLight.position.set(originX + dirX * 1.2, 1.2, originZ + dirZ * 1.2);
  impactLight.intensity = 10.0;
  for (let i = 0; i < 36; i++) spawnSpray(originX + dirX * 0.9, 0.25, originZ + dirZ * 0.9, 5.2, 2.2, 6.2);
}

const tsunamiGroup = new T.Group();
tsunamiGroup.visible = false;
scene.add(tsunamiGroup);

const tsuWidth = 14.5;
const tsuSegX = 48;
const tsuSegY = 24;
const tsuGeo = new T.PlaneGeometry(tsuWidth, 4.4, tsuSegX, tsuSegY);
const tsuPos = tsuGeo.attributes.position;
const tsuBase = new Float32Array(tsuPos.array.length);

for (let i = 0; i < tsuPos.count; i++) {
  const x = tsuPos.getX(i);
  const y = tsuPos.getY(i);
  const v = Math.max(0, Math.min(1, (y + 2.2) / 4.4));

  const archForward = Math.sin(v * Math.PI * 0.85) * 1.65 + Math.pow(v, 3) * 1.1;
  const heightCurve = Math.pow(v, 0.78) * 4.5 - 0.2;
  const edgeDrop = 1 - Math.pow(Math.abs(x) / (tsuWidth * 0.5), 2.4) * 0.35;

  const fx = x;
  const fy = heightCurve * edgeDrop;
  const fz = archForward * edgeDrop;

  tsuPos.setXYZ(i, fx, fy, fz);
  tsuBase[i * 3] = fx;
  tsuBase[i * 3 + 1] = fy;
  tsuBase[i * 3 + 2] = fz;
}
tsuGeo.computeVertexNormals();

const tsunamiWaveMesh = new T.Mesh(
  tsuGeo,
  new T.MeshStandardMaterial({
    map: textures.waterTex,
    color: 0x0284c7,
    emissive: 0x0c4a6e,
    emissiveIntensity: 0.65,
    roughness: 0.16,
    metalness: 0.25,
    transparent: true,
    opacity: 0.9,
    side: T.DoubleSide
  })
);
tsunamiGroup.add(tsunamiWaveMesh);

const crestPuffs = [];
const crestGeo = new T.SphereGeometry(0.45, 12, 10);
const crestFoamMat = new T.MeshStandardMaterial({
  color: 0xf0f9ff,
  emissive: 0x7dd3fc,
  emissiveIntensity: 0.45,
  roughness: 0.65,
  transparent: true,
  opacity: 0.9
});
for (let i = 0; i < 34; i++) {
  const u = (i / 33) - 0.5;
  const cx = u * (tsuWidth * 0.92);
  const edgeDrop = 1 - Math.pow(Math.abs(u * 2), 2.4) * 0.35;
  const cy = 4.25 * edgeDrop;
  const cz = 2.55 * edgeDrop;
  const puff = new T.Mesh(crestGeo, crestFoamMat);
  puff.position.set(cx, cy, cz);
  const sc = 0.85 + Math.random() * 0.55;
  puff.scale.set(1.4 * sc, 0.85 * sc, 1.2 * sc);
  tsunamiGroup.add(puff);
  crestPuffs.push({ mesh: puff, baseY: cy, baseZ: cz, phase: i * 0.6 });
}

let tsunamiZ = -13;
let tsunamiActive = false;

function launchTsunami() {
  tsunamiActive = true;
  tsunamiZ = -12.5;
  tsunamiGroup.visible = true;
  tsunamiGroup.position.set(0, 0, tsunamiZ);
}

let mode = 'conduzido';
let slamAnim = 0;
let slamTriggeredInCycle = false;
let wakeTimer = 0;
let stormW = 0;
let focusFace = false;
let quakeShake = 0;

let camAngle = 0.48;
let camPitch = 0.22;
let camDist = 9.2;
let targetCamDist = 9.2;
let currentLookAt = new T.Vector3(0, 2.0, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));

    if (mode === 'golpe') {
      slamAnim = 0.001;
      slamTriggeredInCycle = false;
    } else if (mode === 'tsunami') {
      launchTsunami();
    }
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  targetCamDist = focusFace ? 2.85 : 9.2;
  if (focusFace) {
    camAngle = 0.24;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.25, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.9, 16.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.9, 16.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const deepColor = new T.Color(0x032539);
const shallowColor = new T.Color(0x0284c7);
const crestFoamColor = new T.Color(0xbae6fd);

function update(dt, t) {
  const isStorm = (mode === 'tsunami' || tsunamiActive);
  const stormTarget = isStorm ? 1 : 0;
  stormW = T.MathUtils.damp(stormW, stormTarget, 2.2, dt);

  const waveAmp = 0.14 + stormW * 0.24;
  const oColorAttr = oceanGeo.attributes.color;
  for (let i = 0; i < oceanPos.count; i++) {
    const ox = oceanPos.getX(i);
    const oz = oceanPos.getZ(i);
    const distFromCenter = Math.hypot(ox, oz);

    const w1 = Math.sin(ox * 0.75 + t * 2.2) * Math.cos(oz * 0.65 + t * 1.7);
    const w2 = Math.sin(distFromCenter * 1.4 - t * 3.1) * 0.45;
    const h = (w1 + w2) * waveAmp;
    oceanPos.setY(i, h);

    const normH = T.MathUtils.clamp((h + waveAmp) / (waveAmp * 2), 0, 1);
    const c = deepColor.clone().lerp(shallowColor, normH);
    if (normH > 0.74) c.lerp(crestFoamColor, (normH - 0.74) * 2.6);
    oColorAttr.setXYZ(i, c.r, c.g, c.b);
  }
  oceanPos.needsUpdate = true;
  oColorAttr.needsUpdate = true;
  oceanGeo.computeVertexNormals();

  for (const p of pillars) {
    p.group.position.y = p.baseY + Math.sin(t * 1.5 + p.phase) * 0.05;
  }

  let vx = 0, vz = 0, yaw = Math.sin(t * 0.4) * 0.18, tiltPitch = 0.04, tiltRoll = 0;
  const seaLevel = Math.sin(vx * 0.75 + t * 2.2) * Math.cos(vz * 0.65 + t * 1.7) * waveAmp;

  if (mode === 'correnteza') {
    const a = t * 0.62;
    const R = 3.1;
    vx = Math.cos(a) * R;
    vz = Math.sin(a) * R;
    yaw = -a;
    tiltPitch = 0.18;
    tiltRoll = -0.22;

    wakeTimer -= dt;
    if (wakeTimer <= 0) {
      wakeTimer = 0.11;
      spawnWakeRing(vx, vz);
      for (let s = 0; s < 4; s++) spawnSpray(vx, 0.15, vz, 2.8, 0.8, 2.4);
    }
  } else {
    vx = Math.sin(t * 0.55) * 0.45;
    vz = Math.cos(t * 0.42) * 0.35;
    if (Math.random() < 0.35) spawnSpray(vx + (Math.random() - 0.5) * 1.2, 0.12, vz + (Math.random() - 0.5) * 1.2, 1.8, 0.6, 1.8);
  }

  poseidon.vessel.position.set(vx, seaLevel * 0.65, vz);
  poseidon.vessel.rotation.set(0, yaw, 0);
  poseidon.body.rotation.set(tiltPitch, 0, tiltRoll);

  poseidon.vortexCone.rotation.y += dt * (mode === 'correnteza' ? 5.2 : 3.0);
  poseidon.baseFoam.scale.setScalar(1 + Math.sin(t * 4) * 0.06);
  for (const sw of poseidon.swirlRings) {
    sw.mesh.rotation.z += dt * 4.5;
    sw.mesh.position.y = sw.baseY + Math.sin(t * 3.5 + sw.phase) * 0.05;
  }

  if (mode === 'golpe') {
    slamAnim += dt * 0.85;
    if (slamAnim >= 1.0) {
      slamAnim = 0.001;
      slamTriggeredInCycle = false;
    }

    if (slamAnim < 0.42) {
      const k = slamAnim / 0.42;
      poseidon.rightArm.arm.rotation.set(-0.95 * k, 0.1, 2.75 * k);
      poseidon.rightArm.elbow.rotation.set(0.85 * k, 0.1, 0.2);
      poseidon.trident.rotation.set(-0.45 * k, 0, -0.25);
      poseidon.torso.rotation.x = -0.18 * k;
    } else if (slamAnim < 0.62) {
      const k = (slamAnim - 0.42) / 0.20;
      poseidon.rightArm.arm.rotation.set(-0.95 + 1.55 * k, 0.1, 2.75 - 2.35 * k);
      poseidon.rightArm.elbow.rotation.set(0.85 - 0.55 * k, 0.1, 0.2);
      poseidon.trident.rotation.set(-0.45 + 0.85 * k, 0, -0.25);
      poseidon.torso.rotation.x = -0.18 + 0.42 * k;

      if (k > 0.75 && !slamTriggeredInCycle) {
        slamTriggeredInCycle = true;
        triggerTridentSlam(vx, vz, yaw);
        quakeShake = 0.14;
      }
    } else {
      const k = (slamAnim - 0.62) / 0.38;
      poseidon.rightArm.arm.rotation.set(0.60 * (1 - k) - 0.18 * k, 0.12, 0.40 * (1 - k) + 0.55 * k);
      poseidon.rightArm.elbow.rotation.set(0.30, 0.15, 0.2);
      poseidon.trident.rotation.set(0.40 * (1 - k) + 0.18 * k, 0, -0.38 * k);
      poseidon.torso.rotation.x = 0.24 * (1 - k);
    }
  } else if (mode === 'correnteza') {
    poseidon.rightArm.arm.rotation.set(0.38, 0.15, 0.72);
    poseidon.rightArm.elbow.rotation.set(-0.45, 0.1, 0.25);
    poseidon.trident.rotation.set(0.88, 0.1, -0.35);
    poseidon.torso.rotation.x = 0.14;
  } else if (mode === 'tsunami') {
    poseidon.rightArm.arm.rotation.set(-0.55, 0.15, 2.35 + Math.sin(t * 2) * 0.05);
    poseidon.rightArm.elbow.rotation.set(0.55, 0.2, 0.28);
    poseidon.trident.rotation.set(0.22, 0, -0.24);
    poseidon.torso.rotation.x = -0.06;
  } else {
    poseidon.rightArm.arm.rotation.set(-0.18, 0.12, 0.55 + Math.sin(t * 1.4) * 0.03);
    poseidon.rightArm.elbow.rotation.set(-0.52, 0.15, 0.22);
    poseidon.trident.rotation.set(0.18, 0, -0.46);
    poseidon.torso.rotation.x = 0.02;
  }

  poseidon.leftArm.arm.rotation.set(0.28, -0.22, -0.76 + Math.cos(t * 1.3) * 0.04);
  poseidon.leftArm.elbow.rotation.set(-0.55, -0.25, -0.2);

  poseidon.tridentCore.rotation.y += dt * 2.5;
  poseidon.tridentHalo.rotation.z -= dt * 3.2;
  const powerBoost = (mode === 'golpe' || mode === 'tsunami') ? 1.5 : 1.0;
  poseidon.tridentTipGlow.scale.setScalar((0.9 + Math.sin(t * 12) * 0.18) * powerBoost);

  poseidon.tridentTipAnchor.getWorldPosition(tmpV);
  tridentLight.position.copy(tmpV);
  tridentLight.intensity = 2.0 * powerBoost + Math.sin(t * 14) * 0.35;

  const wind = (mode === 'correnteza' || mode === 'tsunami') ? 1.9 : 1.0;
  for (const b of poseidon.beardBraids) {
    b.group.rotation.x = Math.sin(t * 2.5 * wind + b.phase) * 0.045;
    b.group.rotation.z = b.side * 0.04 + Math.cos(t * 2.1 * wind + b.phase) * 0.035;
  }
  for (const s of poseidon.hairStrands) {
    s.mesh.rotation.x = Math.sin(t * 2.4 * wind + s.phase) * 0.045;
    s.mesh.rotation.z = Math.cos(t * 1.9 * wind + s.phase) * 0.038;
  }

  const cAttr = poseidon.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = poseidon.capeBase[i * 3];
    const by = poseidon.capeBase[i * 3 + 1];
    const bz = poseidon.capeBase[i * 3 + 2];
    const normY = (0.94 - by) / 1.88;
    const wave1 = Math.sin(t * 3.2 * wind - normY * 4.5 + bx * 2.5) * 0.14 * normY;
    const wave2 = Math.cos(t * 2.2 * wind - normY * 3.0) * 0.06 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.4 - normY * 3.0) * 0.035 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  poseidon.cape.geometry.computeVertexNormals();

  const skAttr = poseidon.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = poseidon.skirtBase[i * 3];
    const by = poseidon.skirtBase[i * 3 + 1];
    const bz = poseidon.skirtBase[i * 3 + 2];
    const normY = (0.43 - by) / 0.86;
    skAttr.setZ(i, bz + Math.sin(t * 3.4 * wind - normY * 4.0 + bx * 4.0) * 0.04 * normY);
  }
  skAttr.needsUpdate = true;
  poseidon.skirtMesh.geometry.computeVertexNormals();

  for (let i = wakeRings.length - 1; i >= 0; i--) {
    const w = wakeRings[i];
    w.life -= dt;
    const k = Math.max(0, w.life / w.max);
    w.mesh.scale.setScalar(1 + (1 - k) * 3.2);
    w.mesh.material.opacity = 0.65 * k;
    if (w.life <= 0) {
      scene.remove(w.mesh);
      w.mesh.geometry.dispose();
      w.mesh.material.dispose();
      wakeRings.splice(i, 1);
    }
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    if (sw.delay > 0) { sw.delay -= dt; continue; }
    sw.life -= dt;
    const k = Math.max(0, sw.life / sw.max);
    sw.mesh.scale.setScalar(1 + (1 - k) * 9.5);
    sw.mesh.material.opacity = 0.92 * k;
    if (sw.life <= 0) {
      scene.remove(sw.mesh);
      sw.mesh.geometry.dispose();
      sw.mesh.material.dispose();
      shockwaves.splice(i, 1);
    }
  }

  for (let i = geysers.length - 1; i >= 0; i--) {
    const g = geysers[i];
    if (g.delay > 0) { g.delay -= dt; continue; }
    if (!g.erupted) {
      g.erupted = true;
      for (let s = 0; s < 14; s++) spawnSpray(g.gx, 0.3, g.gz, 3.2, 3.0, 6.8);
    }
    g.life -= dt;
    const k = Math.max(0, g.life / g.max);
    const heightCurve = Math.sin((1 - k) * Math.PI);
    g.mesh.scale.y = Math.max(0.01, heightCurve * 1.15);
    g.mesh.position.y = 1.8 * g.mesh.scale.y;
    g.mesh.rotation.y += dt * 5.0;
    g.mesh.material.opacity = 0.85 * k;
    if (g.life <= 0) {
      scene.remove(g.mesh);
      g.mesh.geometry.dispose();
      g.mesh.material.dispose();
      geysers.splice(i, 1);
    }
  }

  if (tsunamiActive) {
    tsunamiZ += dt * 6.8;
    tsunamiGroup.position.z = tsunamiZ;

    for (const puff of crestPuffs) {
      puff.mesh.position.y = puff.baseY + Math.sin(t * 8 + puff.phase) * 0.16;
      puff.mesh.position.z = puff.baseZ + Math.cos(t * 7 + puff.phase) * 0.14;
    }
    for (let s = 0; s < 6; s++) {
      const rx = (Math.random() - 0.5) * 12;
      spawnSpray(rx, 3.8, tsunamiZ + 2.3, 4.2, 1.5, 4.2);
    }

    if (Math.abs(tsunamiZ - vz) < 1.2) {
      quakeShake = 0.12;
    }

    if (tsunamiZ > 13.5) {
      if (mode === 'tsunami') {
        tsunamiZ = -13.0;
      } else {
        tsunamiActive = false;
        tsunamiGroup.visible = false;
      }
    }
  }

  impactLight.intensity = Math.max(0, impactLight.intensity - dt * 12);
  updateSpray(dt);

  scene.background.lerpColors(baseBg, stormBg, stormW);
  scene.fog.color.copy(scene.background);
  sun.intensity = 2.25 - 1.35 * stormW;
  hemi.intensity = 0.95 - 0.35 * stormW;

  quakeShake = Math.max(0, quakeShake - dt * 0.3);
  const shakeX = (Math.random() - 0.5) * quakeShake;
  const shakeY = (Math.random() - 0.5) * quakeShake;

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(vx + 0.18, 3.12 + seaLevel * 0.65, vz)
    : new T.Vector3(0, 2.05, 0);
  currentLookAt.lerp(desiredTarget, 0.12);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist + shakeX,
    currentLookAt.y + vertDist + shakeY,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
