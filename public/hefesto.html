<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hefesto - Deus da Forja e do Fogo | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --magma: #ea580c;
      --gold: #eab308;
      --ember: #facc15;
      --glass: rgba(24, 14, 10, 0.84);
      --border: rgba(234, 88, 12, 0.48);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0806;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #fff7ed;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.48);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #facc15;
      transform: translateY(-1px);
      background: rgba(46, 22, 12, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #f97316 0%, #eab308 100%);
      color: #180a04;
      border-color: #fef08a;
      box-shadow: 0 0 22px rgba(249, 115, 22, 0.62);
    }
    button.cam-btn {
      border-color: rgba(250, 204, 21, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
      color: #fef3c7;
      border-color: #fde047;
      box-shadow: 0 0 18px rgba(234, 179, 8, 0.52);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fdba74;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 11, 8, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(249, 115, 22, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #ffedd5;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="forja" class="on">Forja Divina</button>
    <button data-m="martelo">Golpe de Bigorna</button>
    <button data-m="automato">Autômato Dourado</button>
    <button data-m="erupcao">Erupção de Lemnos</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Olympus • Hefesto</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE COM FULIGEM, AVENTAL DE COURO E FORJA)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map de pele rústica de ferreiro
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6500; i++) {
    const v = 120 + Math.floor(Math.random() * 16);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Avental Pesado de Couro Curtido com Rebites de Bronze e Fuligem
  const apronCanvas = document.createElement('canvas');
  apronCanvas.width = 512;
  apronCanvas.height = 256;
  const aCtx = apronCanvas.getContext('2d');
  const aGrad = aCtx.createLinearGradient(0, 0, 0, 256);
  aGrad.addColorStop(0, '#451a03');
  aGrad.addColorStop(0.6, '#291004');
  aGrad.addColorStop(1, '#1c0a03');
  aCtx.fillStyle = aGrad;
  aCtx.fillRect(0, 0, 512, 256);

  // Marcas de calor e fuligem
  for (let i = 0; i < 800; i++) {
    aCtx.fillStyle = i % 2 === 0 ? 'rgba(12, 6, 3, 0.25)' : 'rgba(180, 83, 9, 0.14)';
    aCtx.fillRect(Math.random() * 512, Math.random() * 256, 12, 6);
  }

  // Barra reforçada em bronze dourado e rebites
  aCtx.fillStyle = '#b45309';
  aCtx.fillRect(0, 206, 512, 34);
  aCtx.fillStyle = '#facc15';
  for (let x = 16; x < 512; x += 32) {
    aCtx.beginPath();
    aCtx.arc(x, 223, 5, 0, Math.PI * 2);
    aCtx.fill();
  }
  const apronTex = new T.CanvasTexture(apronCanvas);
  apronTex.wrapS = apronTex.wrapT = T.RepeatWrapping;

  // 1.3 Piso da Grande Forja Subterrânea de Lemnos (Basalto, Runas e Canais de Lava)
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#181412';
  fCtx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 4200; i++) {
    fCtx.fillStyle = i % 2 === 0 ? 'rgba(38, 32, 28, 0.45)' : 'rgba(10, 8, 7, 0.55)';
    fCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  // Anéis de fundição e canais de magma brilhantes
  fCtx.strokeStyle = '#ea580c';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 415, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#facc15';
  fCtx.lineWidth = 5;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 430, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 400, 0, Math.PI * 2);
  fCtx.stroke();

  // Canais radiais de lava escorrendo da bigorna central
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    fCtx.strokeStyle = 'rgba(249, 115, 22, 0.78)';
    fCtx.lineWidth = 10;
    fCtx.beginPath();
    fCtx.moveTo(cx + Math.cos(a) * 90, cy + Math.sin(a) * 90);
    fCtx.lineTo(cx + Math.cos(a) * 400, cy + Math.sin(a) * 400);
    fCtx.stroke();

    fCtx.strokeStyle = '#fef08a';
    fCtx.lineWidth = 3;
    fCtx.beginPath();
    fCtx.moveTo(cx + Math.cos(a) * 90, cy + Math.sin(a) * 90);
    fCtx.lineTo(cx + Math.cos(a) * 400, cy + Math.sin(a) * 400);
    fCtx.stroke();
  }

  // Roda dentada / Engrenagem divina gravada no centro da forja
  fCtx.fillStyle = '#292524';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 115, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 7;
  fCtx.stroke();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, apronTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ANATÔMICA E MATERIAIS DA FORJA
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xb0724c,          // Pele bronzeada e marcada pelo calor da forja
      roughness: 0.44,
      metalness: 0.08,
      bumpMap: textures.skinBump,
      bumpScale: 0.0045
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0x8a5436,
      roughness: 0.48,
      metalness: 0.08
    }),
    beardCharcoal: new T.MeshStandardMaterial({
      color: 0x292524,          // Barba espessa de ferreiro (carvão e fuligem)
      roughness: 0.62,
      metalness: 0.1
    }),
    beardCopperStreak: new T.MeshStandardMaterial({
      color: 0x7c2d12,          // Mechas acobreadas iluminadas pelas brasas
      emissive: 0x2a0802,
      emissiveIntensity: 0.25,
      roughness: 0.55
    }),
    forgedBronze: new T.MeshStandardMaterial({
      color: 0xb45309,          // Bronze mecânico de precisão olímpica
      emissive: 0x291102,
      emissiveIntensity: 0.25,
      metalness: 0.92,
      roughness: 0.22
    }),
    divineGold: new T.MeshStandardMaterial({
      color: 0xfacc15,          // Ouro divino polido (prótese mecânica e autômato)
      emissive: 0x451a03,
      emissiveIntensity: 0.3,
      metalness: 0.94,
      roughness: 0.18
    }),
    blackSteel: new T.MeshStandardMaterial({
      color: 0x1c1917,          // Aço temperado escuro
      metalness: 0.92,
      roughness: 0.26
    }),
    magmaGlow: new T.MeshStandardMaterial({
      color: 0xfef08a,
      emissive: 0xf97316,       // Magma e runas incandescentes
      emissiveIntensity: 3.8,
      roughness: 0.1
    }),
    apronLeather: new T.MeshStandardMaterial({
      map: textures.apronTex,
      roughness: 0.68,
      metalness: 0.08,
      side: T.DoubleSide
    }),
    eyeAmberFire: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xf59e0b,       // Olhos brilhando como brasas de forja
      emissiveIntensity: 3.8,
      roughness: 0.06
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE HEFESTO (TRONCO COLOSSAL + PERNA MECÂNICA DOURADA + MARTELO)
   ========================================================================== */
function buildHephaestus(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.06, 0);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS (PERNA DIREITA MUSCULOSA + PERNA ESQUERDA MECÂNICA DOURADA)
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.28, 22, 20), M.apronLeather, [0, 0, 0], [0, 0, 0], [1.18, 0.78, 0.88]);

  const legs = {};

  // PERNA DIREITA (Humana, maciça e musculosa)
  {
    const hipR = group(pelvis, 0.185, -0.04, 0);
    sculpt(hipR, new T.CylinderGeometry(0.165, 0.12, 0.48, 20), M.skin, [0, -0.23, 0], [0, 0, 0], [1.06, 1, 1.12]);
    sculpt(hipR, new T.SphereGeometry(0.13, 16, 16), M.skin, [0.025, -0.20, 0.056], [0, 0, 0], [0.98, 1.82, 0.88]);
    sculpt(hipR, new T.SphereGeometry(0.102, 16, 16), M.skin, [0, -0.48, 0.015]);

    const kneeR = group(hipR, 0, -0.49, 0);
    sculpt(kneeR, new T.CylinderGeometry(0.106, 0.065, 0.45, 18), M.skin, [0, -0.22, 0]);
    sculpt(kneeR, new T.SphereGeometry(0.10, 16, 16), M.skin, [0, -0.15, -0.042], [0, 0, 0], [1.0, 1.65, 0.98]);
    // Greva protetora de bronze
    sculpt(kneeR, new T.CylinderGeometry(0.104, 0.07, 0.34, 16, 1, false, -0.85, 1.7), M.forgedBronze, [0, -0.22, 0.012]);

    const ankleR = group(kneeR, 0, -0.45, 0.02);
    sculpt(ankleR, new T.BoxGeometry(0.115, 0.065, 0.24), M.apronLeather, [0, -0.02, 0.04]);
    sculpt(ankleR, new T.BoxGeometry(0.124, 0.022, 0.255), M.forgedBronze, [0, -0.052, 0.04]);

    legs.R = { hip: hipR, knee: kneeR, ankle: ankleR };
  }

  // PERNA ESQUERDA (PRÓTESE MECÂNICA DE BRONZE E OURO FORJADA PELO PRÓPRIO HEFESTO!)
  {
    const hipL = group(pelvis, -0.185, -0.04, 0);

    // Coxa superior com encaixe blindado de bronze e pistões dourados
    sculpt(hipL, new T.CylinderGeometry(0.155, 0.11, 0.34, 20), M.skin, [0, -0.16, 0], [0, 0, 0], [1.05, 1, 1.1]);
    sculpt(hipL, new T.CylinderGeometry(0.125, 0.095, 0.18, 20), M.forgedBronze, [0, -0.36, 0]);
    sculpt(hipL, new T.TorusGeometry(0.122, 0.014, 8, 24), M.divineGold, [0, -0.28, 0], [Math.PI / 2, 0, 0]);

    // Articulação Mecânica do Joelho (Engrenagem Dourada com Núcleo de Magma)
    const kneeGear = sculpt(hipL, new T.CylinderGeometry(0.088, 0.088, 0.15, 16), M.divineGold, [0, -0.48, 0.01], [0, 0, Math.PI / 2]);
    sculpt(hipL, new T.CylinderGeometry(0.045, 0.045, 0.165, 12), M.magmaGlow, [0, -0.48, 0.01], [0, 0, Math.PI / 2]);

    // Canela Mecânica Articulada (Hastes de Bronze, Pistão Hidráulico Dourado e Núcleo Incandescente)
    const kneeL = group(hipL, 0, -0.49, 0);
    sculpt(kneeL, new T.CylinderGeometry(0.048, 0.038, 0.44, 14), M.blackSteel, [0, -0.22, 0]);
    // Pistão hidráulico traseiro dourado
    sculpt(kneeL, new T.CylinderGeometry(0.026, 0.022, 0.38, 12), M.divineGold, [0, -0.20, -0.055], [-0.08, 0, 0]);
    // Placa tibial blindada frontal
    sculpt(kneeL, new T.BoxGeometry(0.085, 0.34, 0.045), M.forgedBronze, [0, -0.22, 0.048]);
    sculpt(kneeL, new T.BoxGeometry(0.024, 0.26, 0.052), M.magmaGlow, [0, -0.22, 0.05]);

    // Pé Mecânico de Bronze e Ouro
    const ankleL = group(kneeL, 0, -0.45, 0.02);
    sculpt(ankleL, new T.BoxGeometry(0.11, 0.055, 0.24), M.forgedBronze, [0, -0.02, 0.04]);
    sculpt(ankleL, new T.BoxGeometry(0.12, 0.022, 0.255), M.divineGold, [0, -0.05, 0.04]);
    sculpt(ankleL, new T.CylinderGeometry(0.04, 0.04, 0.13, 12), M.divineGold, [0, 0.01, -0.02], [0, 0, Math.PI / 2]);

    legs.L = { hip: hipL, knee: kneeL, ankle: ankleL, kneeGear };
  }

  // Postura firme diante da Bigorna
  legs.L.hip.rotation.set(-0.22, -0.14, -0.12);
  legs.L.knee.rotation.set(0.28, 0, 0);
  legs.R.hip.rotation.set(0.18, 0.16, 0.14);
  legs.R.knee.rotation.set(0.22, 0, 0);

  // ------------------------------------------------------------------------
  // B. TRONCO COLOSSAL DE FERREIRO (OMBROS LARGOS, PEITORAIS E AVENTAL DE COURO)
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.32, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.30, -0.40),
    new T.Vector2(0.28, -0.20),
    new T.Vector2(0.35, 0.04),
    new T.Vector2(0.47, 0.28),
    new T.Vector2(0.42, 0.44),
    new T.Vector2(0.19, 0.51),
    new T.Vector2(0.01, 0.52)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.26, 1.0, 0.80]);

  // Peitorais largos e densos
  const pecGeo = new T.SphereGeometry(0.25, 24, 24);
  sculpt(torso, pecGeo, M.skin, [-0.22, 0.23, 0.19], [0.12, -0.22, -0.14], [1.08, 0.88, 0.62]);
  sculpt(torso, pecGeo, M.skin, [0.22, 0.23, 0.19], [0.12, 0.22, 0.14], [1.08, 0.88, 0.62]);

  // Abdômen forte e Dorsais/Trapézio massivos
  const abGeo = new T.SphereGeometry(0.10, 16, 16);
  [
    { y: 0.04, sx: 1.06, sy: 0.76, z: 0.246 },
    { y: -0.08, sx: 1.02, sy: 0.78, z: 0.242 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.084, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.50]);
    sculpt(torso, abGeo, M.skin, [0.084, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.50]);
  });

  const latGeo = new T.SphereGeometry(0.275, 20, 20);
  sculpt(torso, latGeo, M.skin, [-0.25, 0.17, -0.135], [0, 0, -0.25], [1.05, 1.36, 0.68]);
  sculpt(torso, latGeo, M.skin, [0.25, 0.17, -0.135], [0, 0, 0.25], [1.05, 1.36, 0.68]);

  const trapGeo = new T.SphereGeometry(0.25, 18, 18);
  sculpt(torso, trapGeo, M.skin, [-0.215, 0.43, -0.05], [0, 0, 0.42], [1.16, 0.68, 0.78]);
  sculpt(torso, trapGeo, M.skin, [0.215, 0.43, -0.05], [0, 0, -0.42], [1.16, 0.68, 0.78]);

  sculpt(torso, new T.CylinderGeometry(0.15, 0.188, 0.25, 20), M.skin, [0, 0.53, -0.01], [0.08, 0, 0], [1.04, 1, 1.08]);

  // ------------------------------------------------------------------------
  // C. ROSTO DE MESTRE FERREIRO (BARBA TRANÇADA, ÓCULOS/VISOR DE FORJA NA TESTA)
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.74, 0.04);

  const skullGeo = new T.SphereGeometry(0.214, 36, 36);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.15;
    x *= 0.98;
    if (y < 0.02 && y > -0.09 && z > 0) { x *= 1.08; z *= 1.06; }
    if (y <= -0.08 && z > -0.02) { x *= 1.04; z *= 1.12; }
    if (z < -0.12) z *= 0.92;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  // Nariz largo e forte
  sculpt(head, new T.BoxGeometry(0.038, 0.086, 0.054), M.skin, [0, 0.004, 0.204], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.025, 14, 14), M.skin, [0, -0.038, 0.218], [0, 0, 0], [1.1, 0.85, 1.05]);

  // Sobrancelhas espessas de carvão
  const eyebrow = new T.CapsuleGeometry(0.015, 0.068, 8, 12);
  sculpt(head, eyebrow, M.beardCharcoal, [-0.058, 0.050, 0.202], [0.1, 0.25, 1.32], [1.12, 1, 0.85]);
  sculpt(head, eyebrow, M.beardCharcoal, [0.058, 0.050, 0.202], [0.1, -0.25, -1.32], [1.12, 1, 0.85]);

  // Olhos brilhando como brasas incandescentes da forja
  const eyeGeo = new T.SphereGeometry(0.021, 16, 16);
  sculpt(head, eyeGeo, M.eyeAmberFire, [-0.056, 0.022, 0.188], [0, 0, 0], [1.16, 0.70, 0.8]);
  sculpt(head, eyeGeo, M.eyeAmberFire, [0.056, 0.022, 0.188], [0, 0, 0], [1.16, 0.70, 0.8]);

  // Barba Espessa e Trançada com Anéis de Bronze e Ouro
  const beardLocks = [];
  const mustacheGeo = new T.CapsuleGeometry(0.026, 0.078, 10, 14);
  sculpt(head, mustacheGeo, M.beardCharcoal, [-0.048, -0.082, 0.206], [0.15, 0.35, 1.15], [1.15, 1, 0.88]);
  sculpt(head, mustacheGeo, M.beardCharcoal, [0.048, -0.082, 0.206], [0.15, -0.35, -1.15], [1.15, 1, 0.88]);

  const lockGeo = new T.ConeGeometry(0.072, 0.25, 14);
  lockGeo.rotateX(Math.PI);
  const beardSpecs = [
    { pos: [0, -0.21, 0.17], rot: [-0.16, 0, 0], scale: [1.45, 1.65, 0.98], mat: M.beardCharcoal },
    { pos: [-0.076, -0.19, 0.145], rot: [-0.12, -0.25, -0.14], scale: [1.1, 1.55, 0.9], mat: M.beardCopperStreak },
    { pos: [0.076, -0.19, 0.145], rot: [-0.12, 0.25, 0.14], scale: [1.1, 1.55, 0.9], mat: M.beardCopperStreak },
    { pos: [-0.045, -0.30, 0.14], rot: [-0.20, -0.12, -0.08], scale: [0.85, 1.25, 0.75], mat: M.beardCharcoal },
    { pos: [0.045, -0.30, 0.14], rot: [-0.20, 0.12, 0.08], scale: [0.85, 1.25, 0.75], mat: M.beardCharcoal }
  ];
  beardSpecs.forEach((sp, i) => {
    const m = sculpt(head, lockGeo, sp.mat, sp.pos, sp.rot, sp.scale);
    beardLocks.push({ mesh: m, rx: sp.rot[0], phase: i * 0.7 });
  });

  // Argolas douradas prendendo as tranças da barba
  for (const side of [-1, 1]) {
    sculpt(head, new T.CylinderGeometry(0.028, 0.025, 0.04, 14), M.divineGold, [side * 0.048, -0.26, 0.16], [-0.18, 0, side * 0.08]);
  }

  // Cabelos espessos de carvão presos por faixa de bronze + Lentes de Forja na testa
  sculpt(head, new T.SphereGeometry(0.222, 24, 24), M.beardCharcoal, [0, 0.05, -0.02], [-0.08, 0, 0], [1.05, 1.03, 1.08]);

  const goggleBand = new T.TorusGeometry(0.214, 0.016, 10, 36);
  goggleBand.rotateX(Math.PI / 2);
  sculpt(head, goggleBand, M.apronLeather, [0, 0.11, 0.01], [0.18, 0, 0], [0.98, 1, 1.06]);

  // Lentes de Forja de Bronze e Cristal Âmbar apoiadas na testa
  for (const side of [-1, 1]) {
    const lensGroup = group(head, side * 0.068, 0.135, 0.195);
    lensGroup.rotation.set(-0.32, side * 0.24, 0);
    sculpt(lensGroup, new T.CylinderGeometry(0.042, 0.042, 0.032, 18), M.forgedBronze, [0, 0, 0], [Math.PI / 2, 0, 0]);
    sculpt(lensGroup, new T.CylinderGeometry(0.034, 0.034, 0.036, 16), M.magmaGlow, [0, 0, 0], [Math.PI / 2, 0, 0]);
  }

  // ------------------------------------------------------------------------
  // D. BRAÇOS COLOSSAIS DE FERREIRO + MANOPLA DE FORJA + MARTELO DIVINO
  // ------------------------------------------------------------------------
  function createSmithArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.50, 0.34, -0.01);

    // Deltoide, Bíceps e Tríceps gigantescos
    sculpt(arm, new T.SphereGeometry(0.168, 20, 20), M.skin, [0, -0.02, 0], [0, 0, s * -0.25], [1.08, 1.16, 1.08]);
    sculpt(arm, new T.CapsuleGeometry(0.112, 0.28, 12, 18), M.skin, [s * 0.028, -0.19, 0], [0, 0, s * 0.08]);
    sculpt(arm, new T.SphereGeometry(0.104, 16, 16), M.skin, [s * 0.02, -0.18, 0.054], [0, 0, s * 0.08], [0.96, 1.48, 0.96]);
    sculpt(arm, new T.SphereGeometry(0.10, 16, 16), M.skin, [s * 0.06, -0.19, -0.046], [0, 0, s * 0.08], [0.96, 1.42, 0.92]);

    const elbow = group(arm, s * 0.05, -0.38, 0);
    sculpt(elbow, new T.CylinderGeometry(0.104, 0.068, 0.34, 18), M.skin, [0, -0.16, 0], [0, 0, 0], [1.06, 1, 0.96]);

    // Manopla de Forja em Couro e Bronze Dourado
    const bracer = group(elbow, 0, -0.25, 0);
    sculpt(bracer, new T.CylinderGeometry(0.082, 0.072, 0.14, 24, 1, true), M.apronLeather, [0, 0, 0], [0, 0, 0], [1.06, 1, 0.97]);
    const bRing = new T.TorusGeometry(0.079, 0.008, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.divineGold, [0, 0.062, 0], [0, 0, 0], [1.06, 1, 0.97]);
    sculpt(bracer, bRing, M.divineGold, [0, -0.062, 0], [0, 0, 0], [1.06, 1, 0.97]);

    const hand = group(elbow, 0, -0.35, 0);
    sculpt(hand, new T.BoxGeometry(0.088, 0.095, 0.046), M.skin, [0, -0.02, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.013, 0.044, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.02;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.074, 0.022], [1.3, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.046, -0.038, 0.028], [0.65, 0, -s * 0.65], [1.15, 0.9, 1.15]);

    return { arm, elbow, hand };
  }

  const rightArm = createSmithArm(true);
  const leftArm = createSmithArm(false);

  // Ombreira Assimétrica de Bronze Forjado e Ouro no Ombro Esquerdo
  const smithPauldron = group(leftArm.arm, -0.03, 0.05, 0);
  smithPauldron.rotation.set(0.06, 0.12, 0.34);
  for (let layer = 0; layer < 2; layer++) {
    sculpt(
      smithPauldron,
      new T.SphereGeometry(0.205 - layer * 0.018, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
      layer === 0 ? M.forgedBronze : M.divineGold,
      [0, 0.045 - layer * 0.048, 0],
      [0, 0, 0],
      [1.15, 0.78, 1.18]
    );
  }

  // ------------------------------------------------------------------------
  // E. O GRANDE MARTELO DIVINO DE HEFESTO (NA MÃO DIREITA) + TENAZES DE FORJA (MÃO ESQUERDA)
  // ------------------------------------------------------------------------
  const hammer = new T.Group();
  rightArm.hand.add(hammer);
  hammer.position.set(0, -0.045, 0.04);
  hammer.rotation.set(Math.PI / 2, 0, 0);

  // Cabo longo reforçado em aço escuro e anéis de ouro (1.52 unidades)
  sculpt(hammer, new T.CylinderGeometry(0.028, 0.034, 1.52, 16), M.blackSteel, [0, 0.35, 0]);
  for (const hy of [-0.28, 0.0, 0.25, 0.78]) {
    sculpt(hammer, new T.CylinderGeometry(0.038, 0.038, 0.045, 16), M.divineGold, [0, hy, 0]);
  }
  sculpt(hammer, new T.SphereGeometry(0.046, 14, 14), M.divineGold, [0, -0.42, 0]);

  // Cabeça Monumental do Martelo Divino (Aço Negro, Ouro Polido e Núcleo de Magma)
  const hammerHead = group(hammer, 0, 0.98, 0);
  sculpt(hammerHead, new T.BoxGeometry(0.56, 0.26, 0.26), M.blackSteel);
  // Faixas douradas ornamentadas ao redor do bloco do martelo
  sculpt(hammerHead, new T.BoxGeometry(0.06, 0.28, 0.28), M.divineGold, [-0.14, 0, 0]);
  sculpt(hammerHead, new T.BoxGeometry(0.06, 0.28, 0.28), M.divineGold, [0.14, 0, 0]);
  // Faces de impacto incandescentes
  sculpt(hammerHead, new T.CylinderGeometry(0.145, 0.145, 0.05, 16), M.forgedBronze, [-0.29, 0, 0], [0, 0, Math.PI / 2]);
  sculpt(hammerHead, new T.CylinderGeometry(0.145, 0.145, 0.05, 16), M.forgedBronze, [0.29, 0, 0], [0, 0, Math.PI / 2]);
  // Núcleo de magma pulsante nas laterais do martelo
  sculpt(hammerHead, new T.OctahedronGeometry(0.085, 0), M.magmaGlow, [0, 0, 0.135], [0, 0, 0], [1.4, 0.9, 0.4]);
  sculpt(hammerHead, new T.OctahedronGeometry(0.085, 0), M.magmaGlow, [0, 0, -0.135], [0, 0, 0], [1.4, 0.9, 0.4]);

  const hammerImpactAnchor = group(hammerHead, 0, 0.15, 0);

  // Tenazes de Ferreiro (Tongs) segurando um lingote de ouro incandescente na mão esquerda
  const tongs = new T.Group();
  leftArm.hand.add(tongs);
  tongs.position.set(0, -0.045, 0.04);
  tongs.rotation.set(Math.PI / 2, 0, 0);

  sculpt(tongs, new T.CylinderGeometry(0.014, 0.014, 0.72, 10), M.blackSteel, [-0.018, 0.18, 0], [0, 0, -0.04]);
  sculpt(tongs, new T.CylinderGeometry(0.014, 0.014, 0.72, 10), M.blackSteel, [0.018, 0.18, 0], [0, 0, 0.04]);
  sculpt(tongs, new T.CylinderGeometry(0.026, 0.026, 0.036, 12), M.divineGold, [0, 0.34, 0], [Math.PI / 2, 0, 0]);
  // Lingote de ouro incandescente preso nas pontas das tenazes
  const hotIngot = sculpt(tongs, new T.BoxGeometry(0.12, 0.24, 0.065), M.magmaGlow, [0, 0.56, 0]);

  // ------------------------------------------------------------------------
  // F. AVENTAL PESADO DE COURO DO FERREIRO + CINTO DE FERRAMENTAS
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  // Peitoral do avental de couro preso por alça diagonal
  const apronStrap = new T.CatmullRomCurve3([
    new T.Vector3(-0.24, 0.42, 0.14),
    new T.Vector3(-0.08, 0.16, 0.31),
    new T.Vector3(0.08, -0.14, 0.30),
    new T.Vector3(0.22, -0.36, 0.20)
  ]);
  const strapGeo = new T.TubeGeometry(apronStrap, 20, 0.036, 8, false);
  strapGeo.scale(1, 1, 0.42);
  sculpt(garments, strapGeo, M.apronLeather);

  // Cinto pesado de couro com fivela de engrenagem dourada
  const beltGeo = new T.TorusGeometry(0.31, 0.036, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.apronLeather, [0, -0.36, 0.01], [0.05, 0, -0.03], [1.14, 1, 0.86]);
  sculpt(garments, new T.CylinderGeometry(0.075, 0.075, 0.028, 16), M.divineGold, [0, -0.36, 0.275], [Math.PI / 2, 0, 0]);
  sculpt(garments, new T.OctahedronGeometry(0.034, 0), M.magmaGlow, [0, -0.36, 0.295]);

  // Avental / Saiote longo de couro reforçado com placas de bronze
  const skirtGeo = new T.CylinderGeometry(0.31, 0.56, 0.88, 44, 16, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.44 - y) / 0.88));
    const pleat = Math.sin(angle * 10) * 0.025 * (0.2 + normY * 0.85);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.08;
    z = Math.sin(angle) * r * 0.85 - normY * 0.05;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.apronLeather, [0, -0.78, 0], [0.04, 0, 0]);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    hammer, hammerHead, hammerImpactAnchor, hotIngot,
    beardLocks, skirtMesh, skirtBase
  };
}

  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x090504) },
    midColor: { value: new T.Color(0x3b1208) },
    horizonColor: { value: new T.Color(0xea580c) },
    sunDir: { value: new T.Vector3(0.3, 0.25, -0.9).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(horizonColor, midColor, smoothstep(0.40, 0.65, h));
      col = mix(col, topColor, smoothstep(0.65, 0.96, h));
      float glow = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.45, 0.1) * pow(glow, 6.0) * 0.55;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

/* ==========================================================================
   5. SISTEMA DE FAGULHAS INCANDESCENTES, MARRETAS VOANDO E ERUPÇÕES DE LEMNOS
   ========================================================================== */
const SPARK_N = 360;
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkVel = new Float32Array(SPARK_N * 3);
const sparkLife = new Float32Array(SPARK_N);
let sparkIdx = 0;

for (let i = 0; i < SPARK_N; i++) {
  sparkPos[i * 3] = (Math.random() - 0.5) * 14;
  sparkPos[i * 3 + 1] = 0.2 + Math.random() * 5.8;
  sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
  sparkVel[i * 3] = (Math.random() - 0.5) * 0.35;
  sparkVel[i * 3 + 1] = 0.4 + Math.random() * 0.7;
  sparkVel[i * 3 + 2] = (Math.random() - 0.5) * 0.35;
  sparkLife[i] = 999;
}

const sparkGeo = new T.BufferGeometry();
sparkGeo.setAttribute('position', new T.BufferAttribute(sparkPos, 3));
scene.add(new T.Points(sparkGeo, new T.PointsMaterial({
  color: 0xfef08a,
  size: 0.09,
  transparent: true,
  opacity: 0.9,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnForgeSparks(x, y, z, count = 20) {
  for (let c = 0; c < count; c++) {
    const i = sparkIdx;
    sparkIdx = (sparkIdx + 1) % 180;
    sparkPos[i * 3] = x;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3 + 2] = z;
    sparkVel[i * 3] = (Math.random() - 0.5) * 6.2;
    sparkVel[i * 3 + 1] = 2.0 + Math.random() * 5.5;
    sparkVel[i * 3 + 2] = (Math.random() - 0.5) * 6.2;
    sparkLife[i] = 0.65 + Math.random() * 0.45;
  }
}

function updateSparks(dt, t) {
  for (let i = 0; i < SPARK_N; i++) {
    if (i < 180 && sparkLife[i] < 100) {
      if (sparkLife[i] <= 0) continue;
      sparkLife[i] -= dt;
      sparkVel[i * 3 + 1] -= 9.5 * dt;
      sparkPos[i * 3] += sparkVel[i * 3] * dt;
      sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
      sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
      if (sparkLife[i] <= 0) sparkPos[i * 3 + 1] = -100;
    } else {
      sparkPos[i * 3] += Math.sin(t + i) * 0.22 * dt;
      sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
      sparkPos[i * 3 + 2] += Math.cos(t + i) * 0.22 * dt;
      if (sparkPos[i * 3 + 1] > 6.2) {
        sparkPos[i * 3 + 1] = 0.15;
        sparkPos[i * 3] = (Math.random() - 0.5) * 13;
        sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 13;
      }
    }
  }
  sparkGeo.attributes.position.needsUpdate = true;
}

// --------------------------------------------------------------------------
// ONDAS DE MAGMA E PILARES VULCÂNICOS ("ERUPÇÃO DE LEMNOS" COM MARRETAS VOANDO)
// --------------------------------------------------------------------------
const magmaWaves = [];
const volcanoPillars = [];
const flyingHammers = [];

// Geometrias reutilizáveis para a chuva de Marretas Divinas
const fhShaftGeo = new T.CylinderGeometry(0.022, 0.026, 1.05, 10);
const fhHeadGeo = new T.BoxGeometry(0.42, 0.20, 0.20);
const fhGoldBandGeo = new T.BoxGeometry(0.05, 0.22, 0.22);
const fhMagmaCoreGeo = new T.OctahedronGeometry(0.075, 0);
const fhAuraGeo = new T.CylinderGeometry(0.14, 0.34, 1.55, 12, 1, true);

const fhSteelMat = new T.MeshStandardMaterial({ color: 0x1c1917, metalness: 0.92, roughness: 0.25 });
const fhGoldMat = new T.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.94, roughness: 0.18 });
const fhMagmaMat = new T.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xf97316, emissiveIntensity: 4.0 });
const fhTrailMat = new T.MeshBasicMaterial({
  color: 0xf97316,
  transparent: true,
  opacity: 0.42,
  blending: T.AdditiveBlending,
  side: T.DoubleSide,
  depthWrite: false
});

function createFlyingHammerMesh() {
  const g = new T.Group();

  const shaft = new T.Mesh(fhShaftGeo, fhSteelMat);
  shaft.position.y = -0.15;
  g.add(shaft);

  const head = new T.Mesh(fhHeadGeo, fhSteelMat);
  head.position.y = 0.35;
  g.add(head);

  const bandL = new T.Mesh(fhGoldBandGeo, fhGoldMat);
  bandL.position.set(-0.11, 0.35, 0);
  g.add(bandL);

  const bandR = new T.Mesh(fhGoldBandGeo, fhGoldMat);
  bandR.position.set(0.11, 0.35, 0);
  g.add(bandR);

  const core = new T.Mesh(fhMagmaCoreGeo, fhMagmaMat);
  core.position.set(0, 0.35, 0.105);
  core.scale.set(1.3, 0.9, 0.4);
  g.add(core);

  const aura = new T.Mesh(fhAuraGeo, fhTrailMat.clone());
  aura.position.y = 0.05;
  g.add(aura);

  return g;
}

function spawnAnvilStrikeWave(x, z, maxScale = 6.5) {
  for (let k = 0; k < 2; k++) {
    const sw = new T.Mesh(
      new T.RingGeometry(0.3, 0.65, 48),
      new T.MeshBasicMaterial({
        color: k === 0 ? 0xfef08a : 0xf97316,
        transparent: true,
        opacity: 0.94,
        blending: T.AdditiveBlending,
        side: T.DoubleSide,
        depthWrite: false
      })
    );
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(x, 0.04 + k * 0.02, z);
    scene.add(sw);
    magmaWaves.push({ mesh: sw, life: 1.0, max: 1.0, maxScale: maxScale - k * 1.4 });
  }
  blastLight.position.set(x, 1.3, z);
  blastLight.intensity = 12.0;
  spawnForgeSparks(x, 1.0, z, 42);
}

function eruptAtImpact(px, pz) {
  const pMesh = new T.Mesh(
    new T.CylinderGeometry(0.24, 0.64, 4.6, 16, 1, true),
    new T.MeshBasicMaterial({
      color: 0xf97316,
      transparent: true,
      opacity: 0.88,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  pMesh.position.set(px, 0.1, pz);
  pMesh.scale.set(1, 0.01, 1);
  scene.add(pMesh);

  volcanoPillars.push({ mesh: pMesh, px, pz, life: 1.15, max: 1.15 });
  spawnAnvilStrikeWave(px, pz, 4.8);
  quakeShake = Math.max(quakeShake, 0.22);
}

function launchFlyingHammerVolley() {
  // Lança 2 a 3 marretas flamejantes em arco dos céus em direção à arena
  const count = 2 + (Math.random() < 0.45 ? 1 : 0);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = 1.6 + Math.random() * 2.9;
    const tx = Math.cos(a) * dist;
    const tz = Math.sin(a) * dist;

    // Origem alta nos céus da forja com deslocamento diagonal
    const sx = tx + (Math.random() - 0.5) * 3.8;
    const sy = 7.8 + Math.random() * 2.4;
    const sz = tz + (Math.random() - 0.5) * 3.8;

    const hMesh = createFlyingHammerMesh();
    hMesh.position.set(sx, sy, sz);
    scene.add(hMesh);

    flyingHammers.push({
      mesh: hMesh,
      start: new T.Vector3(sx, sy, sz),
      target: new T.Vector3(tx, 0.18, tz),
      progress: 0,
      speed: 1.65 + Math.random() * 0.45,
      spinAxis: (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 4),
      yaw: Math.atan2(tx - sx, tz - sz)
    });
  }
}

/* ==========================================================================
   6. CONTROLES INTERATIVOS E CÂMERA 360° / FOCO NO ROSTO
   ========================================================================== */
let mode = 'forja';
let hammerCycle = 0;
let strikeDone = false;
let autoWeight = 0;
let eruptionTimer = 0;
let eruptionWeight = 0;
let quakeShake = 0;
let focusFace = false;

let camAngle = 0.44;
let camPitch = 0.22;
let camDist = 8.6;
let targetCamDist = 8.6;
let currentLookAt = new T.Vector3(0, 1.9, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    hammerCycle = 0.001;
    strikeDone = false;
    eruptionTimer = 0.08;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 2.55 : 8.6;
  if (focusFace) {
    camAngle = 0.18;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.5);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.5);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (FORJA DIVINA, GOLPE DE BIGORNA, AUTÔMATO & ERUPÇÃO)
   ========================================================================== */
function update(dt, t) {
  const breath = Math.sin(t * 2.2) * 0.025;
  hephaestus.body.position.y = 1.06 + breath;

  // Engrenagem do joelho mecânico girando sutilmente
  if (hephaestus.legs.L.kneeGear) {
    hephaestus.legs.L.kneeGear.rotation.x += dt * 1.4;
  }

  // 1. ANIMAÇÃO DO MARTELO DIVINO E BIGORNA POR MODO
  if (mode === 'martelo' || mode === 'forja') {
    const cycleSpeed = mode === 'martelo' ? 1.15 : 0.65;
    hammerCycle += dt * cycleSpeed;
    if (hammerCycle >= 1.0) {
      hammerCycle = 0.001;
      strikeDone = false;
    }

    if (hammerCycle < 0.45) {
      // Ergue o Martelo Divino bem alto acima do ombro direito
      const k = hammerCycle / 0.45;
      hephaestus.rightArm.arm.rotation.set(-0.45 * k, 0.15, 2.35 * k);
      hephaestus.rightArm.elbow.rotation.set(0.65 * k, 0.15, 0.2);
      hephaestus.torso.rotation.x = -0.14 * k;
    } else if (hammerCycle < 0.62) {
      // Golpeia com força sobre a Bigorna Divina!
      const k = (hammerCycle - 0.45) / 0.17;
      hephaestus.rightArm.arm.rotation.set(-0.45 + 0.85 * k, 0.15, 2.35 - 1.85 * k);
      hephaestus.rightArm.elbow.rotation.set(0.65 - 0.85 * k, 0.15, 0.2);
      hephaestus.torso.rotation.x = -0.14 + 0.34 * k;

      if (k > 0.8 && !strikeDone) {
        strikeDone = true;
        if (mode === 'martelo') {
          spawnAnvilStrikeWave(0.18, 0.96, 7.2);
          quakeShake = 0.22;
        } else {
          spawnForgeSparks(0.18, 1.02, 0.96, 26);
          blastLight.position.set(0.18, 1.3, 0.96);
          blastLight.intensity = 7.5;
        }
      }
    } else {
      // Retorno suave
      const k = (hammerCycle - 0.62) / 0.38;
      hephaestus.rightArm.arm.rotation.set(0.40 * (1 - k), 0.15, 0.50);
      hephaestus.rightArm.elbow.rotation.set(-0.20 * (1 - k) - 0.35 * k, 0.15, 0.2);
      hephaestus.torso.rotation.x = 0.20 * (1 - k);
    }

    // Mão esquerda posiciona o lingote incandescente com as tenazes sobre a bigorna
    hephaestus.leftArm.arm.rotation.set(-0.55, -0.3, -0.45);
    hephaestus.leftArm.elbow.rotation.set(-0.75, -0.2, 0.15);
  } else if (mode === 'automato' || mode === 'erupcao') {
    // Ergue o martelo triunfantemente comandando o Autômato Dourado ou a Erupção de Lemnos
    hephaestus.rightArm.arm.rotation.set(-0.38, 0.15, 2.32 + Math.sin(t * 2.2) * 0.04);
    hephaestus.rightArm.elbow.rotation.set(0.55, 0.2, 0.25);
    hephaestus.leftArm.arm.rotation.set(-0.35, -0.25, -0.68);
    hephaestus.leftArm.elbow.rotation.set(-0.75, -0.2, 0.15);
    hephaestus.torso.rotation.x = -0.05;

    if (mode === 'erupcao') {
      eruptionTimer -= dt;
      if (eruptionTimer <= 0) {
        eruptionTimer = 0.68;
        launchFlyingHammerVolley();
      }
    }
  }

  // 2. AUTÔMATO DOURADO OLÍMPICO (MARCHANDO EM ÓRBITA AO REDOR DA FORJA)
  const autoTarget = (mode === 'automato') ? 1 : 0;
  autoWeight = T.MathUtils.damp(autoWeight, autoTarget, 3.2, dt);
  automatonOrbitGroup.visible = autoWeight > 0.02;
  if (automatonOrbitGroup.visible) {
    const autoAng = t * 0.95;
    const autoR = 3.15;
    automatonOrbitGroup.position.set(Math.cos(autoAng) * autoR, 0, Math.sin(autoAng) * autoR);
    automatonOrbitGroup.rotation.y = -autoAng;
    automaton.scale.setScalar(autoWeight);
    automaton.position.y = Math.abs(Math.sin(t * 6.5)) * 0.12;
    autoLegL.rotation.x = Math.sin(t * 6.5) * 0.42;
    autoLegR.rotation.x = -Math.sin(t * 6.5) * 0.42;
  }

  // 3. ATUALIZAÇÃO DE MARRETAS VOANDO, ONDAS DE MAGMA, PILARES VULCÂNICOS E FAGULHAS
  for (let i = flyingHammers.length - 1; i >= 0; i--) {
    const fh = flyingHammers[i];
    fh.progress += dt * fh.speed;
    const p = Math.min(1, fh.progress);

    // Trajetória parabólica acelerada de queda meteórica
    const easeP = p * p;
    fh.mesh.position.lerpVectors(fh.start, fh.target, easeP);
    fh.mesh.position.y += Math.sin(p * Math.PI) * 1.1;

    // Giro brutal da marreta no ar antes de esmagar o chão
    fh.mesh.rotation.set(p * fh.spinAxis, fh.yaw, 0.25);

    if (Math.random() < 0.65) {
      spawnForgeSparks(fh.mesh.position.x, fh.mesh.position.y, fh.mesh.position.z, 2);
    }

    if (p >= 1) {
      eruptAtImpact(fh.target.x, fh.target.z);
      scene.remove(fh.mesh);
      fh.mesh.children[5].material.dispose();
      flyingHammers.splice(i, 1);
    }
  }

  for (let i = magmaWaves.length - 1; i >= 0; i--) {
    const mw = magmaWaves[i];
    mw.life -= dt;
    const k = Math.max(0, mw.life / mw.max);
    mw.mesh.scale.setScalar(1 + (1 - k) * mw.maxScale);
    mw.mesh.material.opacity = 0.94 * k;
    if (mw.life <= 0) {
      scene.remove(mw.mesh);
      mw.mesh.geometry.dispose();
      mw.mesh.material.dispose();
      magmaWaves.splice(i, 1);
    }
  }

  for (let i = volcanoPillars.length - 1; i >= 0; i--) {
    const vp = volcanoPillars[i];
    vp.life -= dt;
    const k = Math.max(0, vp.life / vp.max);
    const hCurve = Math.sin((1 - k) * Math.PI);
    vp.mesh.scale.y = Math.max(0.02, hCurve * 1.15);
    vp.mesh.position.y = 2.2 * vp.mesh.scale.y;
    vp.mesh.rotation.y += dt * 4.5;
    vp.mesh.material.opacity = 0.85 * k;
    if (vp.life <= 0) {
      scene.remove(vp.mesh);
      vp.mesh.geometry.dispose();
      vp.mesh.material.dispose();
      volcanoPillars.splice(i, 1);
    }
  }

  // Barba e avental balançando sutilmente com o calor ascendente
  for (const b of hephaestus.beardLocks) {
    b.mesh.rotation.x = b.rx + Math.sin(t * 2.4 + b.phase) * 0.03;
  }
  const skAttr = hephaestus.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = hephaestus.skirtBase[i * 3];
    const by = hephaestus.skirtBase[i * 3 + 1];
    const bz = hephaestus.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.44 - by) / 0.88));
    skAttr.setZ(i, bz + Math.sin(t * 2.8 - normY * 3.5 + bx * 3.5) * 0.028 * normY);
  }
  skAttr.needsUpdate = true;
  hephaestus.skirtMesh.geometry.computeVertexNormals();

  // Caldeirões de magma da forja
  for (const cf of cauldronFlames) {
    cf.mesh.scale.set(1 + Math.sin(t * 10 + cf.phase) * 0.14, 1 + Math.cos(t * 12 + cf.phase) * 0.2, 1);
  }

  const eruptionTarget = (mode === 'erupcao') ? 1 : 0;
  eruptionWeight = T.MathUtils.damp(eruptionWeight, eruptionTarget, 2.5, dt);
  scene.background.lerpColors(forgeBg, eruptionBg, eruptionWeight);
  scene.fog.color.copy(scene.background);

  anvilLight.intensity = 2.6 + Math.sin(t * 14) * 0.45;
  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 15);
  updateSparks(dt, t);

  // 4. CÂMERA INTERATIVA 360° + TREMOR DA BIGORNA + FOCO NO ROSTO
  quakeShake = Math.max(0, quakeShake - dt * 0.55);
  const shakeX = (Math.random() - 0.5) * quakeShake;
  const shakeY = (Math.random() - 0.5) * quakeShake;

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(0, 3.00 + breath, -0.10)
    : new T.Vector3(0, 1.88, 0.15);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist + shakeX,
    currentLookAt.y + vertDist + shakeY,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
