<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ártemis - Deusa da Caça e da Lua | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --silver: #e2e8f0;
      --moonlight: #38bdf8;
      --emerald: #10b981;
      --glass: rgba(8, 20, 26, 0.80);
      --border: rgba(56, 189, 248, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050d14;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f0f9ff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.42);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #7dd3fc;
      transform: translateY(-1px);
      background: rgba(14, 36, 48, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #38bdf8 0%, #10b981 100%);
      color: #04131a;
      border-color: #e0f2fe;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.6);
    }
    button.cam-btn {
      border-color: rgba(16, 185, 129, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #059669 0%, #065f46 100%);
      color: #ecfdf5;
      border-color: #6ee7b7;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.55);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 16, 22, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.32);
      padding: 7px 16px;
      border-radius: 999px;
      color: #e0f2fe;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="vigilia" class="on">Vigília Lunar</button>
    <button data-m="cacada">Caçada Ágil</button>
    <button data-m="raizes">Raízes Espinhosas</button>
    <button data-m="alcateia">Chamado da Alcateia</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Olympus • Ártemis</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE LUNAR, CHITON DE CAÇADORA E CLAREIRA SAGRADA)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map fino de pele
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4800; i++) {
    const v = 124 + Math.floor(Math.random() * 10);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Chiton Curto de Caçadora (Verde-Floresta Profundo com Meandro Grego em Prata e Azul-Lunar)
  const chitonCanvas = document.createElement('canvas');
  chitonCanvas.width = 512;
  chitonCanvas.height = 256;
  const cCtx = chitonCanvas.getContext('2d');
  const grad = cCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#064e3b');
  grad.addColorStop(0.68, '#065f46');
  grad.addColorStop(1, '#022c22');
  cCtx.fillStyle = grad;
  cCtx.fillRect(0, 0, 512, 256);

  // Textura de linho leve
  cCtx.fillStyle = 'rgba(209, 250, 229, 0.08)';
  for (let x = 0; x < 512; x += 8) cCtx.fillRect(x, 0, 3, 256);

  // Barra de Prata Lunar e Azul-Celeste na barra do Chiton curto
  cCtx.fillStyle = '#cbd5e1';
  cCtx.fillRect(0, 198, 512, 38);
  cCtx.fillStyle = '#38bdf8';
  cCtx.fillRect(0, 194, 512, 4);
  cCtx.fillRect(0, 236, 512, 4);

  cCtx.strokeStyle = '#0f172a';
  cCtx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    cCtx.beginPath();
    cCtx.moveTo(x + 4, 229);
    cCtx.lineTo(x + 4, 205);
    cCtx.lineTo(x + 24, 205);
    cCtx.lineTo(x + 24, 223);
    cCtx.lineTo(x + 12, 223);
    cCtx.lineTo(x + 12, 213);
    cCtx.lineTo(x + 18, 213);
    cCtx.stroke();
  }
  const chitonTex = new T.CanvasTexture(chitonCanvas);
  chitonTex.wrapS = chitonTex.wrapT = T.RepeatWrapping;

  // 1.3 Clareira Sagrada da Lua (Mármore Prateado, Musgo Esmeralda e Fases Lunares)
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  const fGrad = fCtx.createRadialGradient(512, 512, 40, 512, 512, 512);
  fGrad.addColorStop(0, '#e2e8f0');
  fGrad.addColorStop(0.55, '#94a3b8');
  fGrad.addColorStop(0.82, '#1e3a4c');
  fGrad.addColorStop(1, '#064e3b');
  fCtx.fillStyle = fGrad;
  fCtx.fillRect(0, 0, 1024, 1024);

  // Veios suaves de mármore lunar
  fCtx.strokeStyle = 'rgba(15, 23, 42, 0.16)';
  fCtx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    fCtx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    fCtx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      fCtx.lineTo(mx, my);
    }
    fCtx.stroke();
  }

  const cx = 512, cy = 512;
  // Anéis celestes prateados e azul-lunar
  fCtx.strokeStyle = '#0284c7';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 425, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#f8fafc';
  fCtx.lineWidth = 6;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 440, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 410, 0, Math.PI * 2);
  fCtx.stroke();

  // 8 Fases da Lua ao redor do círculo sagrado
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const mx = cx + Math.cos(a) * 290;
    const my = cy + Math.sin(a) * 290;

    fCtx.fillStyle = '#f8fafc';
    fCtx.beginPath();
    fCtx.arc(mx, my, 26, 0, Math.PI * 2);
    fCtx.fill();

    if (i % 2 === 1) {
      fCtx.fillStyle = '#0f172a';
      fCtx.beginPath();
      fCtx.arc(mx + 10, my, 22, 0, Math.PI * 2);
      fCtx.fill();
    }
  }

  // Grande Lua Crescente de Prata no centro da arena
  fCtx.fillStyle = '#f8fafc';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 115, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.fillStyle = '#cbd5e1';
  fCtx.beginPath();
  fCtx.arc(cx + 38, cy - 18, 92, 0, Math.PI * 2);
  fCtx.fill();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, chitonTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ORGÂNICA E MATERIAIS LUNARES
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xe6b898,          // Pele luminosa iluminada pelo luar
      roughness: 0.35,
      metalness: 0.05,
      bumpMap: textures.skinBump,
      bumpScale: 0.0022
    }),
    lipRose: new T.MeshStandardMaterial({
      color: 0xd96b78,
      roughness: 0.28,
      metalness: 0.04
    }),
    hairSilverMoon: new T.MeshStandardMaterial({
      color: 0xf1f5f9,          // Cabelos branco-prateados luminosos presos em rabo de cavalo alto
      emissive: 0x1e3a8a,
      emissiveIntensity: 0.22,
      roughness: 0.30,
      metalness: 0.22
    }),
    hairIceHighlight: new T.MeshStandardMaterial({
      color: 0xbae6fd,          // Reflexo azul-gelo lunar nos fios
      emissive: 0x0284c7,
      emissiveIntensity: 0.26,
      roughness: 0.28,
      metalness: 0.25
    }),
    silverPolished: new T.MeshStandardMaterial({
      color: 0xf8fafc,          // Prata lunar espelhada
      emissive: 0x1e293b,
      emissiveIntensity: 0.25,
      metalness: 0.95,
      roughness: 0.14
    }),
    moonBronze: new T.MeshStandardMaterial({
      color: 0x64748b,
      emissive: 0x0f172a,
      emissiveIntensity: 0.2,
      metalness: 0.88,
      roughness: 0.24
    }),
    moonCore: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x38bdf8,       // Energia lunar azul-celeste / prata
      emissiveIntensity: 3.6,
      roughness: 0.08
    }),
    leatherForest: new T.MeshStandardMaterial({
      color: 0x3f2312,
      roughness: 0.65,
      metalness: 0.08
    }),
    hunterChiton: new T.MeshStandardMaterial({
      map: textures.chitonTex,
      color: 0xffffff,
      roughness: 0.52,
      metalness: 0.06,
      side: T.DoubleSide
    }),
    forestCloak: new T.MeshStandardMaterial({
      color: 0x064e3b,          // Manto esmeralda-noturno de caçadora
      emissive: 0x022c22,
      emissiveIntensity: 0.32,
      roughness: 0.50,
      metalness: 0.12,
      side: T.DoubleSide
    }),
    eyeWhite: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xe2e8f0,
      emissiveIntensity: 0.25,
      roughness: 0.08
    }),
    eyeMoonSilver: new T.MeshStandardMaterial({
      color: 0x7dd3fc,          // Olhos prata-celeste luminosos de caçadora noturna
      emissive: 0x38bdf8,
      emissiveIntensity: 2.8,
      roughness: 0.06
    }),
    eyePupil: new T.MeshStandardMaterial({
      color: 0x082f49,
      roughness: 0.1
    }),
    stagIvory: new T.MeshStandardMaterial({
      color: 0xf8fafc,
      emissive: 0xbae6fd,
      emissiveIntensity: 0.38,
      roughness: 0.35,
      metalness: 0.15
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE ÁRTEMIS + DIADEMA LUA CRESCENTE + ARCO LUNAR + CORÇA DE PRATA
   ========================================================================== */
function buildArtemis(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.12, 0);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS ÁGEIS DE CAÇADORA + BOTAS ALTAS DE PRATA E COURO
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.90, 0);
  sculpt(pelvis, new T.SphereGeometry(0.22, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.08, 0.78, 0.82]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.135, -0.04, 0);

    // Coxa esguia e atlética
    sculpt(hip, new T.CylinderGeometry(0.128, 0.088, 0.52, 20), M.skin, [0, -0.25, 0], [0, 0, 0], [1.0, 1, 1.06]);
    sculpt(hip, new T.SphereGeometry(0.098, 16, 16), M.skin, [s * 0.015, -0.21, 0.042], [0, 0, 0], [0.92, 1.8, 0.85]);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.076, 16, 16), M.skin, [0, -0.52, 0.014]);

    // Botas altas de caçadora olímpica em couro escuro e grevas de prata lunar
    const knee = group(hip, 0, -0.53, 0);
    sculpt(knee, new T.CylinderGeometry(0.080, 0.050, 0.48, 18), M.leatherForest, [0, -0.24, 0]);
    sculpt(knee, new T.CylinderGeometry(0.082, 0.054, 0.36, 16, 1, false, -0.85, 1.7), M.silverPolished, [0, -0.24, 0.008]);
    // Lua crescente esculpida na joelheira de prata
    sculpt(knee, new T.TorusGeometry(0.036, 0.007, 8, 20, Math.PI * 1.25), M.silverPolished, [0, -0.03, 0.076], [0, 0, -0.4]);

    const ankle = group(knee, 0, -0.48, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.082, 0.048, 0.20), M.leatherForest, [0, -0.02, 0.035], [0.18, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.088, 0.015, 0.21), M.silverPolished, [0, -0.044, 0.035], [0.18, 0, 0]);

    legs[side] = { hip, knee, ankle };
  }

  // Postura ágil de arqueira pairando na floresta
  legs.L.hip.rotation.set(-0.34, -0.08, -0.05);
  legs.L.knee.rotation.set(0.50, 0, 0);
  legs.R.hip.rotation.set(0.20, 0.08, 0.05);
  legs.R.knee.rotation.set(0.24, 0, 0);

  // ------------------------------------------------------------------------
  // B. TRONCO ATLÉTICO FEMININO + PEITORAL LEVE DE PRATA LUNAR
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.34, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.225, -0.40),
    new T.Vector2(0.172, -0.18),
    new T.Vector2(0.212, 0.04),
    new T.Vector2(0.280, 0.26),
    new T.Vector2(0.250, 0.41),
    new T.Vector2(0.112, 0.48),
    new T.Vector2(0.01, 0.49)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.14, 1.02, 0.72]);

  // Corpete / Túnica ajustada verde-floresta com proteção peitoral prateada assimétrica
  const tunicBodice = new T.LatheGeometry([
    new T.Vector2(0.01, -0.34),
    new T.Vector2(0.195, -0.30),
    new T.Vector2(0.180, -0.14),
    new T.Vector2(0.220, 0.06),
    new T.Vector2(0.285, 0.25),
    new T.Vector2(0.220, 0.34),
    new T.Vector2(0.01, 0.34)
  ], 36);
  sculpt(torso, tunicBodice, M.hunterChiton, [0, 0.02, 0], [0, 0, 0], [1.15, 1.0, 0.76]);

  // Placa peitoral de prata lunar esculpida com símbolo da Lua Crescente no centro
  const bustPlateGeo = new T.SphereGeometry(0.13, 20, 20);
  sculpt(torso, bustPlateGeo, M.silverPolished, [-0.112, 0.20, 0.132], [0.1, -0.2, 0], [0.94, 0.90, 0.76]);
  sculpt(torso, bustPlateGeo, M.silverPolished, [0.112, 0.20, 0.132], [0.1, 0.2, 0], [0.94, 0.90, 0.76]);

  // Broche de Lua Crescente luminosa no centro do peito
  const chestMoon = new T.TorusGeometry(0.045, 0.011, 8, 24, Math.PI * 1.35);
  sculpt(torso, chestMoon, M.moonCore, [0, 0.17, 0.225], [0, 0, -0.45]);

  // Pescoço gracioso e esguio
  sculpt(torso, new T.CylinderGeometry(0.086, 0.108, 0.25, 20), M.skin, [0, 0.51, -0.005], [0.06, 0, 0]);

  // ------------------------------------------------------------------------
  // C. ROSTO DE CAÇADORA DIVINA + DIADEMA DE LUA CRESCENTE + RABO DE CAVALO PRATEADO
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.72, 0.032);

  // Crânio feminino delicado e focado (limpo, traços finos e determinados)
  const skullGeo = new T.SphereGeometry(0.182, 40, 40);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.15;
    x *= 0.88;
    if (y < 0.02 && y > -0.06 && z > 0) { x *= 1.03; z *= 1.04; }
    if (y <= -0.06 && z > -0.02) {
      const chinTaper = Math.max(0.55, 1.0 - ((-0.06 - y) / 0.15) * 0.42);
      x *= chinTaper;
      z *= 1.02;
    }
    if (z < -0.10) z *= 0.94;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  // Maçãs do rosto e nariz reto
  const cheekGeo = new T.SphereGeometry(0.041, 16, 16);
  sculpt(head, cheekGeo, M.skin, [-0.061, -0.015, 0.142], [0, -0.3, 0], [1.08, 0.82, 0.62]);
  sculpt(head, cheekGeo, M.skin, [0.061, -0.015, 0.142], [0, 0.3, 0], [1.08, 0.82, 0.62]);

  sculpt(head, new T.BoxGeometry(0.017, 0.068, 0.036), M.skin, [0, 0.002, 0.174], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.014, 14, 14), M.skin, [0, -0.031, 0.186], [0, 0, 0], [0.92, 0.8, 0.96]);

  // Sobrancelhas finas e determinadas
  const browGeo = new T.CapsuleGeometry(0.0052, 0.052, 8, 12);
  sculpt(head, browGeo, M.moonBronze, [-0.048, 0.046, 0.168], [0.1, 0.25, 1.40]);
  sculpt(head, browGeo, M.moonBronze, [0.048, 0.046, 0.168], [0.1, -0.25, -1.40]);

  // Olhos Prata-Celeste Luminosos (olhar aguçado de caçadora noturna)
  for (const side of [-1, 1]) {
    const eyeGroup = group(head, side * 0.048, 0.018, 0.158);
    eyeGroup.rotation.y = side * 0.18;

    sculpt(eyeGroup, new T.SphereGeometry(0.021, 16, 16), M.eyeWhite, [0, 0, 0], [0, 0, 0], [1.16, 0.88, 0.65]);
    sculpt(eyeGroup, new T.SphereGeometry(0.0145, 16, 16), M.eyeMoonSilver, [-side * 0.002, -0.001, 0.009], [0, 0, 0], [0.95, 1.06, 0.55]);
    sculpt(eyeGroup, new T.SphereGeometry(0.0075, 12, 12), M.eyePupil, [-side * 0.002, -0.001, 0.014], [0, 0, 0], [0.9, 1.05, 0.5]);
    sculpt(eyeGroup, new T.SphereGeometry(0.004, 8, 8), M.eyeWhite, [-side * 0.006, 0.005, 0.016]);
    sculpt(eyeGroup, new T.BoxGeometry(0.048, 0.006, 0.018), M.moonBronze, [0, 0.014, 0.008], [0.12, 0, side * -0.08]);
  }

  // Lábios rosados sutis
  sculpt(head, new T.CapsuleGeometry(0.0072, 0.028, 8, 12), M.lipRose, [0, -0.072, 0.172], [0, 0, Math.PI / 2], [1, 1, 0.75]);
  sculpt(head, new T.CapsuleGeometry(0.0086, 0.024, 8, 12), M.lipRose, [0, -0.082, 0.170], [0, 0, Math.PI / 2], [1, 1, 0.8]);

  // ------------------------------------------------------------------------
  // CABELOS PRATEADOS PRESOS EM RABO DE CAVALO ALTO + DIADEMA DE LUA CRESCENTE
  // ------------------------------------------------------------------------
  sculpt(head, new T.SphereGeometry(0.188, 28, 28), M.hairSilverMoon, [0, 0.032, -0.016], [-0.08, 0, 0], [0.96, 1.06, 1.05]);

  // Mechas frontais dinâmicas emoldurando o rosto
  for (const side of [-1, 1]) {
    const frontLockPts = [
      new T.Vector3(side * 0.06, 0.14, 0.135),
      new T.Vector3(side * 0.145, 0.05, 0.115),
      new T.Vector3(side * 0.162, -0.08, 0.105),
      new T.Vector3(side * 0.145, -0.22, 0.115)
    ];
    sculpt(head, new T.TubeGeometry(new T.CatmullRomCurve3(frontLockPts), 14, 0.022, 8, false), M.hairIceHighlight);
  }

  // Rabo de Cavalo Alto (Ponytail) longo e esvoaçante preso por anel de prata
  const ponytailGroup = group(head, 0, 0.12, -0.175);
  sculpt(ponytailGroup, new T.CylinderGeometry(0.036, 0.032, 0.045, 16), M.silverPolished, [0, 0, 0], [0.55, 0, 0]);

  const ponyStrands = [];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const ox = Math.cos(a) * 0.022;
    const oy = Math.sin(a) * 0.022;
    const len = 0.62 + (i % 3) * 0.07;
    const pts = [];
    for (let k = 0; k <= 6; k++) {
      const t = k / 6;
      const spread = 1 + t * 2.4;
      pts.push(new T.Vector3(
        ox * spread + Math.sin(t * Math.PI * 2.2 + i) * 0.028,
        oy * spread - t * len + Math.sin(t * Math.PI) * 0.12,
        -t * 0.32
      ));
    }
    const strand = sculpt(
      ponytailGroup,
      new T.TubeGeometry(new T.CatmullRomCurve3(pts), 14, 0.024 * (1 - 0.15 * (i % 2)), 8, false),
      i % 2 === 0 ? M.hairSilverMoon : M.hairIceHighlight
    );
    ponyStrands.push({ mesh: strand, phase: i * 0.42 });
  }

  // DIADEMA DE LUA CRESCENTE DE PRATA NA TESTA
  const moonDiadem = group(head, 0, 0.118, 0.012);
  moonDiadem.rotation.x = 0.16;

  const diademBand = new T.TorusGeometry(0.182, 0.0085, 10, 36, Math.PI * 1.45);
  diademBand.rotateX(Math.PI / 2);
  diademBand.rotateY(-Math.PI * 0.225);
  sculpt(moonDiadem, diademBand, M.silverPolished, [0, 0, 0], [0, 0, 0], [0.95, 1, 1.05]);

  // Lua Crescente luminosa apontada para cima no centro da testa
  const crescentCrown = new T.TorusGeometry(0.044, 0.010, 10, 28, Math.PI * 1.38);
  sculpt(moonDiadem, crescentCrown, M.moonCore, [0, 0.048, 0.186], [-0.15, 0, -0.58]);

  // ------------------------------------------------------------------------
  // D. BRAÇOS ATLÉTICOS E BRACELETES LUNARES DE PRATA
  // ------------------------------------------------------------------------
  function createArtemisArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.34, 0.33, -0.005);

    // Ombreira leve de caçadora em prata lunar
    sculpt(
      arm,
      new T.SphereGeometry(0.105, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.46),
      M.silverPolished,
      [s * 0.01, 0.025, 0],
      [0, 0, s * -0.25],
      [1.06, 0.74, 1.1]
    );

    sculpt(arm, new T.SphereGeometry(0.094, 18, 18), M.skin, [0, -0.01, 0]);
    sculpt(arm, new T.CapsuleGeometry(0.064, 0.26, 12, 16), M.skin, [s * 0.018, -0.17, 0], [0, 0, s * 0.06]);

    const elbow = group(arm, s * 0.032, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.062, 0.042, 0.31, 18), M.skin, [0, -0.15, 0]);

    // Proteção de antebraço (Bracer de arqueira em couro e prata)
    const bracer = group(elbow, 0, -0.21, 0);
    sculpt(bracer, new T.CylinderGeometry(0.056, 0.046, 0.14, 20, 1, true), M.leatherForest);
    const bRing = new T.TorusGeometry(0.054, 0.005, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.silverPolished, [0, 0.065, 0]);
    sculpt(bracer, bRing, M.silverPolished, [0, -0.065, 0]);

    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.056, 0.066, 0.028), M.skin, [0, -0.015, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.0085, 0.034, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.014;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.052, 0.015], [1.1, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.032, -0.025, 0.018], [0.55, 0, -s * 0.6], [1.05, 0.9, 1.05]);

    return { arm, elbow, hand };
  }

  const rightArm = createArtemisArm(true);
  const leftArm = createArtemisArm(false);

  // ------------------------------------------------------------------------
  // E. GLAIVE / FOICE CRESCENTE LUNAR DE DUAS LÂMINAS (NA MÃO DIREITA)
  // ------------------------------------------------------------------------
  const lunarGlaive = new T.Group();
  rightArm.hand.add(lunarGlaive);
  lunarGlaive.position.set(0, -0.035, 0.03);

  // Haste longa esculpida em madeira prateada e anéis de prata lunar (2.82 unidades)
  sculpt(lunarGlaive, new T.CylinderGeometry(0.019, 0.021, 2.82, 16), M.moonBronze, [0, 0.16, 0]);
  for (const gy of [-0.45, -0.10, 0.25, 1.38]) {
    sculpt(lunarGlaive, new T.CylinderGeometry(0.025, 0.025, 0.038, 16), M.silverPolished, [0, gy, 0]);
  }

  // Lâmina inferior em meia-lua menor (contrapeso)
  const lowerBlade = new T.TorusGeometry(0.14, 0.016, 8, 24, Math.PI * 1.15);
  sculpt(lunarGlaive, lowerBlade, M.silverPolished, [0, -1.28, 0], [0, 0, Math.PI * 0.42], [0.85, 1.15, 0.35]);

  // Cabeça Superior: Lâmina Gigante em Lua Crescente + Orbe Lunar Flutuante no Centro
  const glaiveHead = group(lunarGlaive, 0, 1.54, 0);
  sculpt(glaiveHead, new T.CylinderGeometry(0.036, 0.024, 0.12, 14), M.silverPolished, [0, 0.04, 0]);

  // Orbe de Energia Lunar giratório no coração da foice
  const glaiveOrb = sculpt(glaiveHead, new T.OctahedronGeometry(0.068, 1), M.moonCore, [0, 0.28, 0], [0, 0, 0], [0.85, 1.15, 0.85]);

  // Grande Lâmina Curva em Lua Crescente de Prata Polida com Fio Luminoso
  const mainCrescent = new T.TorusGeometry(0.34, 0.032, 10, 36, Math.PI * 1.32);
  sculpt(glaiveHead, mainCrescent, M.silverPolished, [0.06, 0.30, 0], [0, 0, -Math.PI * 0.66], [1.05, 1.25, 0.28]);

  const edgeCrescent = new T.TorusGeometry(0.365, 0.011, 8, 36, Math.PI * 1.25);
  sculpt(glaiveHead, edgeCrescent, M.moonCore, [0.06, 0.30, 0], [0, 0, -Math.PI * 0.625], [1.05, 1.25, 0.22]);

  const glaiveAnchor = group(glaiveHead, 0.28, 0.30, 0);
  const glaiveGlow = new T.Mesh(
    new T.SphereGeometry(0.15, 12, 10),
    new T.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.8,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  glaiveAnchor.add(glaiveGlow);

  // Esfera de energia lunar natural na mão esquerda livre
  const leftOrbGlow = new T.Mesh(
    new T.SphereGeometry(0.085, 12, 10),
    new T.MeshBasicMaterial({
      color: 0x10b981,
      transparent: true,
      opacity: 0.72,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  leftOrbGlow.position.set(0, -0.055, 0.035);
  leftArm.hand.add(leftOrbGlow);

  // ------------------------------------------------------------------------
  // F. VESTIMENTA DE CAÇADORA (CHITON CURTO VERDE-FLORESTA E MANTO LUNAR)
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  const beltGeo = new T.TorusGeometry(0.21, 0.018, 10, 32);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.leatherForest, [0, -0.18, 0.005], [0.04, 0, 0], [1.14, 1, 0.78]);
  sculpt(garments, new T.TorusGeometry(0.032, 0.008, 8, 20, Math.PI * 1.35), M.silverPolished, [0, -0.18, 0.175], [0, 0, -0.5]);

  // Chiton curto acima dos joelhos para agilidade na caça
  const skirtGeo = new T.CylinderGeometry(0.21, 0.44, 0.62, 48, 18, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.31 - y) / 0.62));
    const pleat = Math.sin(angle * 18) * 0.022 * (0.2 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.06;
    z = Math.sin(angle) * r * 0.84 - normY * 0.06;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.hunterChiton, [0, -0.48, 0], [0.03, 0, 0]);

  // Manto Esmeralda-Noturno esvoaçante nas costas
  const capeGeo = new T.PlaneGeometry(1.26, 1.62, 24, 30);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.81 - y) / 1.62));
    const archZ = -0.15 - Math.cos((x / 0.63) * Math.PI * 0.5) * 0.07;
    const z = archZ - normY * 0.46;
    const fx = x * (0.58 + normY * 0.75);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.forestCloak, [0, -0.36, -0.04]);

  // ------------------------------------------------------------------------
  // G. CORÇA SAGRADA DE PRATA (COMPANHEIRA ESPIRITUAL ORBITANDO AO REDOR)
  // ------------------------------------------------------------------------
  const stagOrbitGroup = new T.Group();
  root.add(stagOrbitGroup);

  const stag = new T.Group();
  stagOrbitGroup.add(stag);

  // Corpo esguio da Corça/Cervo Lunar
  sculpt(stag, new T.CylinderGeometry(0.11, 0.12, 0.52, 16), M.stagIvory, [0, 0.52, 0], [Math.PI / 2, 0, 0], [0.85, 1, 1.15]);
  // Pescoço e Cabeça nobre
  sculpt(stag, new T.CylinderGeometry(0.055, 0.085, 0.34, 14), M.stagIvory, [0, 0.72, 0.24], [0.42, 0, 0]);
  const stagHead = group(stag, 0, 0.88, 0.34);
  sculpt(stagHead, new T.SphereGeometry(0.075, 14, 14), M.stagIvory, [0, 0, 0], [0.2, 0, 0], [0.82, 0.9, 1.35]);
  sculpt(stagHead, new T.SphereGeometry(0.014, 8, 8), M.moonCore, [-0.048, 0.015, 0.03]);
  sculpt(stagHead, new T.SphereGeometry(0.014, 8, 8), M.moonCore, [0.048, 0.015, 0.03]);

  // Galhada Dourada / Prateada Ramificada (Cervo de Cerineia)
  for (const side of [-1, 1]) {
    const antlerCurve = new T.CatmullRomCurve3([
      new T.Vector3(side * 0.03, 0.05, -0.01),
      new T.Vector3(side * 0.09, 0.18, -0.04),
      new T.Vector3(side * 0.12, 0.32, 0.02),
      new T.Vector3(side * 0.08, 0.42, 0.06)
    ]);
    sculpt(stagHead, new T.TubeGeometry(antlerCurve, 14, 0.009, 6, false), M.silverPolished);
    sculpt(stagHead, new T.ConeGeometry(0.008, 0.11, 5), M.moonCore, [side * 0.09, 0.23, 0.03], [0.55, 0, side * -0.3]);
    sculpt(stagHead, new T.ConeGeometry(0.008, 0.11, 5), M.moonCore, [side * 0.12, 0.33, -0.02], [-0.45, 0, side * -0.4]);
  }

  // 4 Pernas ágeis articuladas da Corça
  const stagLegs = [];
  const legOffsets = [
    [-0.07, 0.42, 0.18],
    [0.07, 0.42, 0.18],
    [-0.07, 0.42, -0.18],
    [0.07, 0.42, -0.18]
  ];
  legOffsets.forEach(([lx, ly, lz], idx) => {
    const sl = group(stag, lx, ly, lz);
    sculpt(sl, new T.CylinderGeometry(0.024, 0.014, 0.42, 10), M.stagIvory, [0, -0.21, 0]);
    stagLegs.push({ pivot: sl, phase: idx * Math.PI * 0.5 });
  });

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    lunarGlaive, glaiveOrb, glaiveAnchor, glaiveGlow, leftOrbGlow,
    ponytailGroup, ponyStrands,
    skirtMesh, skirtBase,
    cape, capeBase,
    stagOrbitGroup, stag, stagLegs
  };
}

const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

const scene = new T.Scene();
const nightBg = new T.Color(0x071926);

// Céu Noturno Olímpico com Luar Azul-Prateado e Estrelas
const skyGeo = new T.SphereGeometry(80, 32, 32);
const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x020617) },
    midColor: { value: new T.Color(0x0c4a6e) },
    horizonColor: { value: new T.Color(0x38bdf8) },
    sunDir: { value: new T.Vector3(-0.45, 0.48, -0.75).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(horizonColor, midColor, smoothstep(0.40, 0.66, h));
      col = mix(col, topColor, smoothstep(0.66, 0.96, h));
      float moonGlow = max(dot(dir, sunDir), 0.0);
      col += vec3(0.75, 0.92, 1.0) * pow(moonGlow, 14.0) * 0.65;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new T.Mesh(skyGeo, skyMat));

// Lua Cheia Luminosa no horizonte do bosque

);

// 8 Colunas de Mármore Prateado e Ciprestes Sagrados ao redor da Clareira
const marbleMat = new T.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.4, metalness: 0.08 });
const silverColMat = new T.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.92, roughness: 0.16 });
const trunkMat = new T.MeshStandardMaterial({ color: 0x3f2312, roughness: 0.85 });
const cypressMat = new T.MeshStandardMaterial({ color: 0x065f46, emissive: 0x022c22, emissiveIntensity: 0.25, roughness: 0.65 });

const shaftGeo = new T.CylinderGeometry(0.22, 0.26, 2.75, 22, 1);
const shPos = shaftGeo.attributes.position;
for (let i = 0; i < shPos.count; i++) {
  const x = shPos.getX(i), y = shPos.getY(i), z = shPos.getZ(i);
  const ang = Math.atan2(z, x);
  const flute = Math.cos(ang * 18) * 0.007;
  const r = Math.sqrt(x * x + z * z) - flute;
  shPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
}
shaftGeo.computeVertexNormals();

for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + 0.2;
  const dist = 5.85;
  const col = group(scene, Math.cos(a) * dist, 0, Math.sin(a) * dist);

  sculpt(col, new T.BoxGeometry(0.72, 0.14, 0.72), marbleMat, [0, 0.07, 0]);
  sculpt(col, shaftGeo, marbleMat, [0, 1.52, 0]);

  sculpt(col, new T.BoxGeometry(0.64, 0.14, 0.64), marbleMat, [0, 3.10, 0]);
  sculpt(col, new T.BoxGeometry(0.54, 0.05, 0.54), silverColMat, [0, 3.20, 0]);
  // Lua crescente de prata coroando cada coluna
  sculpt(col, new T.TorusGeometry(0.14, 0.024, 8, 24, Math.PI * 1.35), silverColMat, [0, 3.38, 0], [0, -a + Math.PI / 2, -0.5]);

  // Ciprestes e Árvores Sagradas alternadas ao redor do bosque
  if (i % 2 === 0) {
    const tAng = a + Math.PI / 8;

    sculpt(tree, new T.CylinderGeometry(0.08, 0.15, 1.1, 10), trunkMat, [0, 0.55, 0]);
    sculpt(tree, new T.ConeGeometry(0.58, 2.4, 12), cypressMat, [0, 2.1, 0]);
    sculpt(tree, new T.ConeGeometry(0.42, 1.8, 12), cypressMat, [0, 3.1, 0]);
  }
}

// Sombra radial suave no piso
function createShadowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  gr.addColorStop(0, 'rgba(2, 6, 23, 0.48)');
  gr.addColorStop(1, 'rgba(2, 6, 23, 0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}
const shadowBlob = new T.Mesh(
  new T.PlaneGeometry(1, 1),
  new T.MeshBasicMaterial({ map: createShadowTex(), transparent: true, depthWrite: false })
);

shadowBlob.position.y = 0.015;

  color: 0x7dd3fc,
  size: 0.085,
  transparent: true,
  opacity: 0.88,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

function spawnLunarSparks(x, y, z, count = 20) {
  for (let c = 0; c < count; c++) {
    const i = fireflyIdx;
    fireflyIdx = (fireflyIdx + 1) % 150;
    fireflyPos[i * 3] = x;
    fireflyPos[i * 3 + 1] = y;
    fireflyPos[i * 3 + 2] = z;
    fireflyVel[i * 3] = (Math.random() - 0.5) * 5.2;
    fireflyVel[i * 3 + 1] = 1.8 + Math.random() * 4.8;
    fireflyVel[i * 3 + 2] = (Math.random() - 0.5) * 5.2;
    fireflyLife[i] = 0.65 + Math.random() * 0.45;
  }
}

function updateFireflies(dt, t) {
  for (let i = 0; i < FIREFLY_N; i++) {
    if (i < 150 && fireflyLife[i] < 100) {
      if (fireflyLife[i] <= 0) continue;
      fireflyLife[i] -= dt;
      fireflyVel[i * 3 + 1] -= 8.5 * dt;
      fireflyPos[i * 3] += fireflyVel[i * 3] * dt;
      fireflyPos[i * 3 + 1] += fireflyVel[i * 3 + 1] * dt;
      fireflyPos[i * 3 + 2] += fireflyVel[i * 3 + 2] * dt;
      if (fireflyLife[i] <= 0) fireflyPos[i * 3 + 1] = -100;
    } else {
      fireflyPos[i * 3] += Math.sin(t * 1.2 + i) * 0.16 * dt;
      fireflyPos[i * 3 + 1] += fireflyVel[i * 3 + 1] * dt;
      fireflyPos[i * 3 + 2] += Math.cos(t * 1.2 + i) * 0.16 * dt;
      if (fireflyPos[i * 3 + 1] > 5.8) {
        fireflyPos[i * 3 + 1] = 0.1;
        fireflyPos[i * 3] = (Math.random() - 0.5) * 13;
        fireflyPos[i * 3 + 2] = (Math.random() - 0.5) * 13;
      }
    }
  }
  fireflyGeo.attributes.position.needsUpdate = true;
}

function spawnThornyRootWave(originX, originZ, yaw) {
  // Faz brotar uma fileira em arco de raízes espinhosas e cristais lunares pelo solo
  for (let step = 1; step <= 4; step++) {
    const spread = (Math.random() - 0.5) * 0.9;
    const ang = yaw + spread;
    const dist = step * 1.15;
    const rx = originX + Math.sin(ang) * dist;
    const rz = originZ + Math.cos(ang) * dist;

    const rootGroup = new T.Group();
    rootGroup.position.set(rx, 0, rz);

    // 3 garras/raízes retorcidas emergindo juntas do solo
    for (let b = 0; b < 3; b++) {
      const ba = (b / 3) * Math.PI * 2 + step;
      const pts = [
        new T.Vector3(0, 0, 0),
        new T.Vector3(Math.cos(ba) * 0.18, 0.55, Math.sin(ba) * 0.18),
        new T.Vector3(Math.cos(ba) * 0.08, 1.15, Math.sin(ba) * 0.08),
        new T.Vector3(-Math.cos(ba) * 0.06, 1.55, -Math.sin(ba) * 0.06)
      ];
      const vine = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 12, 0.048, 7, false), rootWoodMat);
      const thorn = new T.Mesh(new T.ConeGeometry(0.055, 0.42, 5), crystalThornMat);
      thorn.position.set(-Math.cos(ba) * 0.06, 1.65, -Math.sin(ba) * 0.06);
      thorn.rotation.set(Math.sin(ba) * 0.3, 0, -Math.cos(ba) * 0.3);
      rootGroup.add(vine, thorn);
    }

    rootGroup.scale.set(1, 0.01, 1);
    scene.add(rootGroup);
    thornyRoots.push({ mesh: rootGroup, rx, rz, life: 1.35, max: 1.35, delay: step * 0.08, erupted: false });
  }
}

/* ==========================================================================
   6. CONTROLES INTERATIVOS E CÂMERA 360° / FOCO NO ROSTO
   ========================================================================== */
let mode = 'vigilia';
let rootTimer = 0;
let sweepAngle = 0;
let eclipseWeight = 0;
let trailTimer = 0;
let focusFace = false;

let camAngle = 0.40;
let camPitch = 0.18;
let camDist = 8.4;
let targetCamDist = 8.4;
let currentLookAt = new T.Vector3(0, 1.9, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    rootTimer = 0.12;
    sweepAngle = 0;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 2.5 : 8.4;
  if (focusFace) {
    camAngle = 0.20;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (VIGÍLIA LUNAR, CAÇADA ÁGIL, FLECHA DE PRATA & CHUVA)
   ========================================================================== */
function update(dt, t) {
  let ax = 0, az = 0, yaw = Math.sin(t * 0.35) * 0.18, pitch = 0.04, roll = 0;
  const hoverY = Math.sin(t * 1.7) * 0.08;

  // 1. MOVIMENTAÇÃO POR MODO
  if (mode === 'cacada') {
    const a = t * 1.05;
    const R = 2.9;
    ax = Math.cos(a) * R;
    az = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.22;
    roll = -0.26;

    trailTimer -= dt;
    if (trailTimer <= 0) {
      trailTimer = 0.10;
      spawnHuntTrail(ax, az);
    }
  } else {
    ax = Math.sin(t * 0.45) * 0.20;
    az = Math.cos(t * 0.38) * 0.16;
  }

  artemis.root.position.set(ax, 0, az);
  artemis.root.rotation.set(0, yaw, 0);
  artemis.body.position.y = 1.12 + hoverY;
  artemis.body.rotation.set(pitch, 0, roll);

  // 2. GLAIVE / FOICE CRESCENTE LUNAR DE DUAS LÂMINAS
  if (mode === 'raizes') {
    // Gira e golpeia com a Foice Lunar fazendo brotar Raízes Espinhosas pelo solo
    sweepAngle += dt * 3.2;
    artemis.rightArm.arm.rotation.set(-0.65 + Math.sin(sweepAngle) * 0.45, 0.25, 1.35 + Math.cos(sweepAngle) * 0.4);
    artemis.rightArm.elbow.rotation.set(-0.35, 0.2, 0.2);
    artemis.lunarGlaive.rotation.set(0.85, sweepAngle * 0.5, -0.3);

    artemis.leftArm.arm.rotation.set(-0.85, -0.35, -0.75);
    artemis.leftArm.elbow.rotation.set(-0.45, -0.2, 0.15);

    rootTimer -= dt;
    if (rootTimer <= 0) {
      rootTimer = 0.72;
      spawnThornyRootWave(ax, az, yaw + Math.sin(t * 1.6) * 1.4);
    }
  } else if (mode === 'alcateia') {
    // Ergue a Foice Crescente Lunar aos céus invocando o Chamado da Alcateia sob Luar Cheio
    artemis.rightArm.arm.rotation.set(-0.45, 0.15, 2.38 + Math.sin(t * 2.2) * 0.04);
    artemis.rightArm.elbow.rotation.set(0.55, 0.2, 0.25);
    artemis.lunarGlaive.rotation.set(0.20, 0, -0.22);

    artemis.leftArm.arm.rotation.set(-0.45, -0.25, -0.85 + Math.cos(t * 2) * 0.05);
    artemis.leftArm.elbow.rotation.set(-0.55, -0.15, 0.15);
  } else if (mode === 'cacada') {
    // Postura aerodinâmica de perseguição veloz com a Foice Lunar inclinada
    artemis.rightArm.arm.rotation.set(0.38, 0.15, 0.72);
    artemis.rightArm.elbow.rotation.set(-0.45, 0.1, 0.22);
    artemis.lunarGlaive.rotation.set(0.95, 0.1, -0.35);

    artemis.leftArm.arm.rotation.set(-0.35, -0.25, -0.68);
    artemis.leftArm.elbow.rotation.set(-0.62, -0.2, 0.15);
  } else {
    // Vigília Lunar (Padrão): postura majestosa apoiando a Foice Crescente Lunar
    artemis.rightArm.arm.rotation.set(-0.18, 0.12, 0.55 + Math.sin(t * 1.4) * 0.025);
    artemis.rightArm.elbow.rotation.set(-0.52, 0.15, 0.22);
    artemis.lunarGlaive.rotation.set(0.18, 0, -0.45);

    artemis.leftArm.arm.rotation.set(-0.28, -0.22, -0.64 + Math.cos(t * 1.4) * 0.03);
    artemis.leftArm.elbow.rotation.set(-0.68, -0.2, 0.18);
  }

  // Corça Sagrada de Prata galopando ao redor de Ártemis
  const stagSpeed = (mode === 'cacada') ? 1.85 : 1.05;
  const stagRadius = (mode === 'cacada') ? 1.55 : 1.18;
  const stagAng = t * stagSpeed + 1.2;
  artemis.stagOrbitGroup.position.set(
    Math.cos(stagAng) * stagRadius,
    0.05 + Math.abs(Math.sin(t * 7.5)) * 0.12,
    Math.sin(stagAng) * stagRadius
  );
  artemis.stagOrbitGroup.rotation.y = -stagAng;
  for (const sl of artemis.stagLegs) {
    sl.pivot.rotation.x = Math.sin(t * 7.5 + sl.phase) * 0.45;
  }

  // Brilho da Foice Crescente Lunar e da palma esquerda
  const powerBoost = (mode === 'raizes' || mode === 'alcateia') ? 1.45 : 1.0;
  artemis.glaiveOrb.rotation.y += dt * 3.0;
  artemis.glaiveGlow.scale.setScalar((0.9 + Math.sin(t * 14) * 0.2) * powerBoost);
  artemis.leftOrbGlow.scale.setScalar((0.85 + Math.cos(t * 12) * 0.18) * powerBoost);
  artemis.glaiveAnchor.getWorldPosition(tmpV);
  arrowLight.position.copy(tmpV);
  arrowLight.intensity = 1.9 * powerBoost + Math.sin(t * 14) * 0.35;

  // Vento no rabo de cavalo prateado, chiton curto e manto esmeralda
  const wind = (mode === 'cacada' || mode === 'alcateia') ? 1.85 : 1.0;
  artemis.ponytailGroup.rotation.x = Math.sin(t * 2.6 * wind) * 0.08;
  for (const ps of artemis.ponyStrands) {
    ps.mesh.rotation.y = Math.sin(t * 3.0 * wind + ps.phase) * 0.045;
  }

  const cAttr = artemis.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = artemis.capeBase[i * 3];
    const by = artemis.capeBase[i * 3 + 1];
    const bz = artemis.capeBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.81 - by) / 1.62));
    const wave1 = Math.sin(t * 3.2 * wind - normY * 4.5 + bx * 2.5) * 0.13 * normY;
    const wave2 = Math.cos(t * 2.2 * wind - normY * 3.0) * 0.055 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.4 - normY * 3.0) * 0.032 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  artemis.cape.geometry.computeVertexNormals();

  const skAttr = artemis.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = artemis.skirtBase[i * 3];
    const by = artemis.skirtBase[i * 3 + 1];
    const bz = artemis.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.31 - by) / 0.62));
    skAttr.setZ(i, bz + Math.sin(t * 3.4 * wind - normY * 4.0 + bx * 4.0) * 0.038 * normY);
  }
  skAttr.needsUpdate = true;
  artemis.skirtMesh.geometry.computeVertexNormals();

  // 3. ATUALIZAÇÃO DE RAÍZES ESPINHOSAS, ALCATEIA ESPECTRAL E ONDAS LUNARES
  for (let i = thornyRoots.length - 1; i >= 0; i--) {
    const tr = thornyRoots[i];
    if (tr.delay > 0) { tr.delay -= dt; continue; }
    if (!tr.erupted) {
      tr.erupted = true;
      spawnLunarImpactWave(tr.rx, tr.rz, 0x10b981, 2.4);
      spawnLunarSparks(tr.rx, 0.2, tr.rz, 10);
      blastLight.position.set(tr.rx, 0.8, tr.rz);
      blastLight.intensity = 7.5;
    }
    tr.life -= dt;
    const k = Math.max(0, tr.life / tr.max);
    const grow = Math.sin((1 - k) * Math.PI);
    tr.mesh.scale.y = Math.max(0.02, grow * 1.2);
    if (tr.life <= 0) {
      scene.remove(tr.mesh);
      tr.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
      });
      thornyRoots.splice(i, 1);
    }
  }

  for (let i = lunarWaves.length - 1; i >= 0; i--) {
    const lw = lunarWaves[i];
    lw.life -= dt;
    const k = Math.max(0, lw.life / lw.max);
    lw.mesh.scale.setScalar(1 + (1 - k) * lw.maxScale);
    lw.mesh.material.opacity = 0.92 * k;
    if (lw.life <= 0) {
      scene.remove(lw.mesh);
      lw.mesh.geometry.dispose();
      lw.mesh.material.dispose();
      lunarWaves.splice(i, 1);
    }
  }

  for (let i = huntTrails.length - 1; i >= 0; i--) {
    const ht = huntTrails[i];
    ht.life -= dt;
    const k = Math.max(0, ht.life / ht.max);
    ht.mesh.scale.setScalar(1 + (1 - k) * 2.2);
    ht.mesh.material.opacity = 0.72 * k;
    if (ht.life <= 0) {
      scene.remove(ht.mesh);
      ht.mesh.geometry.dispose();
      ht.mesh.material.dispose();
      huntTrails.splice(i, 1);
    }
  }

  // Chamado da Alcateia ativo (4 Lobos Espectrais de Prata correndo sob Luar Cheio)
  const packTarget = (mode === 'alcateia') ? 1 : 0;
  eclipseWeight = T.MathUtils.damp(eclipseWeight, packTarget, 3.0, dt);
  wolfPackGroup.visible = eclipseWeight > 0.02;
  if (wolfPackGroup.visible) {
    wolfPackGroup.position.set(ax, 0, az);
    packRing.rotation.z += dt * 1.8;
    packRing.scale.setScalar(eclipseWeight * (1 + Math.sin(t * 6) * 0.05));
    packRing.material.opacity = 0.85 * eclipseWeight;
    moonBeamMesh.material.opacity = 0.22 * eclipseWeight;

    for (const sw of spiritWolves) {
      sw.angle += dt * 2.35;
      sw.group.position.set(
        Math.cos(sw.angle) * sw.radius,
        Math.abs(Math.sin(t * 10 + sw.phase)) * 0.14,
        Math.sin(sw.angle) * sw.radius
      );
      sw.group.rotation.y = -sw.angle;
      sw.group.scale.setScalar(eclipseWeight);
      for (let l = 0; l < sw.legs.length; l++) {
        sw.legs[l].rotation.x = Math.sin(t * 10 + sw.phase + l * 1.5) * 0.55;
      }
    }
  }

  scene.background.lerpColors(nightBg, eclipseBg, eclipseWeight);
  scene.fog.color.copy(scene.background);

  lunarRing.rotation.z += dt * 0.18;
  shadowBlob.position.set(ax, 0.015, az);
  const s = 1.6 - hoverY * 1.4;
  shadowBlob.scale.set(s, s, 1);
  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 15);
  updateFireflies(dt, t);

  // 4. CÂMERA INTERATIVA 360° + ZOOM + FOCO NO ROSTO / CORPO INTEIRO
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(ax, 3.04 + hoverY, az)
    : new T.Vector3(0, 1.92, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
