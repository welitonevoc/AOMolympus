<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dionísio - Deus do Vinho e do Êxtase | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --wine: #9333ea;
      --grape: #7e22ce;
      --emerald: #10b981;
      --gold: #facc15;
      --glass: rgba(24, 10, 36, 0.80);
      --border: rgba(192, 132, 252, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #13071e;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f5f3ff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.42);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #e879f9;
      transform: translateY(-1px);
      background: rgba(44, 16, 66, 0.92);
    }
    button.on {
      background: linear-gradient(135deg, #a855f7 0%, #eab308 100%);
      color: #140521;
      border-color: #f3e8ff;
      box-shadow: 0 0 22px rgba(168, 85, 247, 0.6);
    }
    button.cam-btn {
      border-color: rgba(250, 204, 21, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: #ffffff;
      border-color: #a7f3d0;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.55);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #e9d5ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 960px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 8, 30, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(192, 132, 252, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #f3e8ff;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="banquete" class="on">Banquete Olímpico</button>
    <button data-m="danca">Dança Báquica</button>
    <button data-m="vinhas">Vinhas Selvagens</button>
    <button data-m="extase">Êxtase Dionisíaco</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto</button>
  </div>
</div>

<div id="badge">Olympus • Dionísio</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE, PELE DE PANTERA NEBRIS, TECIDO E PISO)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map suave da pele
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5500; i++) {
    const v = 123 + Math.floor(Math.random() * 12);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Nébris (Pele de Pantera / Leopardo Sagrada cruzando o ombro de Dionísio)
  const peltCanvas = document.createElement('canvas');
  peltCanvas.width = 512;
  peltCanvas.height = 256;
  const pCtx = peltCanvas.getContext('2d');
  const pGrad = pCtx.createLinearGradient(0, 0, 512, 256);
  pGrad.addColorStop(0, '#d97706');
  pGrad.addColorStop(0.5, '#b45309');
  pGrad.addColorStop(1, '#92400e');
  pCtx.fillStyle = pGrad;
  pCtx.fillRect(0, 0, 512, 256);

  // Rosetas clássicas de pantera/leopardo
  for (let i = 0; i < 85; i++) {
    const rx = Math.random() * 512;
    const ry = Math.random() * 256;
    const rad = 8 + Math.random() * 8;
    pCtx.fillStyle = '#78350f';
    pCtx.beginPath();
    pCtx.arc(rx, ry, rad * 0.65, 0, Math.PI * 2);
    pCtx.fill();

    pCtx.strokeStyle = '#1c1917';
    pCtx.lineWidth = 3.5;
    pCtx.beginPath();
    pCtx.arc(rx, ry, rad, 0.3, Math.PI * 1.65);
    pCtx.stroke();
  }
  const nebrisTex = new T.CanvasTexture(peltCanvas);
  nebrisTex.wrapS = nebrisTex.wrapT = T.RepeatWrapping;

  // 1.3 Himation Púrpura Imperial & Vinho Profundo com borda dourada
  const tunicCanvas = document.createElement('canvas');
  tunicCanvas.width = 512;
  tunicCanvas.height = 256;
  const tCtx = tunicCanvas.getContext('2d');
  const tGrad = tCtx.createLinearGradient(0, 0, 0, 256);
  tGrad.addColorStop(0, '#581c87');
  tGrad.addColorStop(0.62, '#4c1d95');
  tGrad.addColorStop(1, '#3b0764');
  tCtx.fillStyle = tGrad;
  tCtx.fillRect(0, 0, 512, 256);

  // Pregas e brilho de seda púrpura
  tCtx.fillStyle = 'rgba(233, 213, 255, 0.08)';
  for (let x = 0; x < 512; x += 10) tCtx.fillRect(x, 0, 3, 256);

  // Barra dourada com folhas de hera/videira estilizadas
  tCtx.fillStyle = '#eab308';
  tCtx.fillRect(0, 200, 512, 38);
  tCtx.fillStyle = '#3b0764';
  tCtx.fillRect(0, 196, 512, 4);
  tCtx.fillRect(0, 238, 512, 4);

  tCtx.strokeStyle = '#3b0764';
  tCtx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    tCtx.beginPath();
    tCtx.moveTo(x, 219);
    tCtx.quadraticCurveTo(x + 8, 207, x + 16, 219);
    tCtx.quadraticCurveTo(x + 24, 231, x + 32, 219);
    tCtx.stroke();
  }
  const tunicTex = new T.CanvasTexture(tunicCanvas);
  tunicTex.wrapS = tunicTex.wrapT = T.RepeatWrapping;

  // 1.4 Piso do Anfiteatro & Vinhedo Sagrado (Mármore creme, mosaico de uvas e ouro)
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#f5f0e6';
  fCtx.fillRect(0, 0, 1024, 1024);

  // Veios de mármore quente
  fCtx.strokeStyle = 'rgba(120, 90, 130, 0.18)';
  fCtx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    fCtx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    fCtx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      fCtx.lineTo(mx, my);
    }
    fCtx.stroke();
  }

  const cx = 512, cy = 512;
  // Anel externo púrpura imperial e ouro
  fCtx.strokeStyle = '#6b21a8';
  fCtx.lineWidth = 18;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 425, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 7;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 440, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 410, 0, Math.PI * 2);
  fCtx.stroke();

  // Mandala de Videiras, Folhas de Hera e Cachos de Uva no mosaico
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const rx = cx + Math.cos(a) * 265;
    const ry = cy + Math.sin(a) * 265;

    // Folha de parreira verde-esmeralda
    fCtx.fillStyle = '#15803d';
    fCtx.beginPath();
    fCtx.arc(rx, ry, 28, 0, Math.PI * 2);
    fCtx.fill();

    // Cacho de uvas púrpuras douradas
    fCtx.fillStyle = '#7e22ce';
    for (let u = 0; u < 5; u++) {
      const ua = a + (u - 2) * 0.14;
      const ur = 195 + (u % 2) * 22;
      fCtx.beginPath();
      fCtx.arc(cx + Math.cos(ua) * ur, cy + Math.sin(ua) * ur, 13, 0, Math.PI * 2);
      fCtx.fill();
    }
  }

  // Sol báquico dourado no centro
  fCtx.fillStyle = '#eab308';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 62, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = '#6b21a8';
  fCtx.lineWidth = 6;
  fCtx.stroke();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, nebrisTex, tunicTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ANATÔMICA E MATERIAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xd5976c,          // Pele mediterrânea quente e jovial
      roughness: 0.38,
      metalness: 0.06,
      bumpMap: textures.skinBump,
      bumpScale: 0.003
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0xbd7d53,
      roughness: 0.42,
      metalness: 0.06
    }),
    hairDarkAuburn: new T.MeshStandardMaterial({
      color: 0x2e1028,          // Cachos escuros com reflexo vinho-mogno
      emissive: 0x1a0518,
      emissiveIntensity: 0.22,
      roughness: 0.36,
      metalness: 0.16
    }),
    hairWineHighlight: new T.MeshStandardMaterial({
      color: 0x6b21a8,          // Reflexo púrpura-uva nos cachos
      emissive: 0x2e084d,
      emissiveIntensity: 0.25,
      roughness: 0.34,
      metalness: 0.2
    }),
    ivyGreen: new T.MeshStandardMaterial({
      color: 0x16a34a,          // Folhas de hera e parreira vibrantes
      emissive: 0x052e16,
      emissiveIntensity: 0.25,
      roughness: 0.48,
      side: T.DoubleSide
    }),
    grapePurple: new T.MeshStandardMaterial({
      color: 0x9333ea,          // Cachos de uvas brilhantes
      emissive: 0x3b0764,
      emissiveIntensity: 0.35,
      roughness: 0.22,
      metalness: 0.2
    }),
    goldPolished: new T.MeshStandardMaterial({
      color: 0xfacc15,
      emissive: 0x422006,
      emissiveIntensity: 0.25,
      metalness: 0.92,
      roughness: 0.18
    }),
    bronzeWood: new T.MeshStandardMaterial({
      color: 0x78350f,
      roughness: 0.55,
      metalness: 0.25
    }),
    pineConeMat: new T.MeshStandardMaterial({
      color: 0x92400e,
      emissive: 0x451a03,
      emissiveIntensity: 0.3,
      roughness: 0.42,
      metalness: 0.45
    }),
    nebrisPelt: new T.MeshStandardMaterial({
      map: textures.nebrisTex,
      roughness: 0.65,
      metalness: 0.05,
      side: T.DoubleSide
    }),
    purpleTunic: new T.MeshStandardMaterial({
      map: textures.tunicTex,
      color: 0xffffff,
      roughness: 0.50,
      metalness: 0.08,
      side: T.DoubleSide
    }),
    wineLiquid: new T.MeshStandardMaterial({
      color: 0xc026d3,
      emissive: 0x86198f,
      emissiveIntensity: 2.2,
      roughness: 0.08,
      metalness: 0.2,
      transparent: true,
      opacity: 0.92
    }),
    eyeAmethyst: new T.MeshStandardMaterial({
      color: 0xf0abfc,
      emissive: 0xc026d3,       // Olhos ametista/magenta radiantes de êxtase
      emissiveIntensity: 2.9,
      roughness: 0.08
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE DIONÍSIO + COROA DE VIDEIRAS + TIRSO (THYRSUS) + CÁLICE
   ========================================================================== */
function buildDionysus(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.10, 0);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS ATLÉTICAS E DESCONTRAÍDAS (SANDÁLIAS DE VINHA E OURO)
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.24, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.10, 0.78, 0.84]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.15, -0.04, 0);

    // Coxa atlética esculpida
    sculpt(hip, new T.CylinderGeometry(0.138, 0.098, 0.50, 20), M.skin, [0, -0.24, 0], [0, 0, 0], [1.02, 1, 1.07]);
    sculpt(hip, new T.SphereGeometry(0.106, 16, 16), M.skin, [s * 0.018, -0.21, 0.046], [0, 0, 0], [0.94, 1.82, 0.86]);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.086, 16, 16), M.skin, [0, -0.50, 0.014]);

    // Canela e Panturrilha
    const knee = group(hip, 0, -0.51, 0);
    sculpt(knee, new T.CylinderGeometry(0.086, 0.052, 0.46, 18), M.skin, [0, -0.23, 0]);
    sculpt(knee, new T.SphereGeometry(0.082, 16, 16), M.skin, [0, -0.15, -0.036], [0, 0, 0], [0.96, 1.65, 0.95]);

    // Tiras de vinha e ouro enroladas nas pernas
    const vineWrap = new T.TorusGeometry(0.068, 0.006, 8, 20);
    vineWrap.rotateX(Math.PI / 2);
    sculpt(knee, vineWrap, M.goldPolished, [0, -0.34, 0.005], [0.15, 0, 0]);
    sculpt(knee, vineWrap, M.ivyGreen, [0, -0.28, 0.005], [-0.15, 0, 0]);

    // Pé e Sandália Dourada
    const ankle = group(knee, 0, -0.46, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.09, 0.048, 0.21), M.skin, [0, -0.02, 0.038], [0.22, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.098, 0.015, 0.225), M.goldPolished, [0, -0.044, 0.038], [0.22, 0, 0]);
    legs[side] = { hip, knee, ankle };
  }

  // Postura boêmia e graciosa flutuando/dançando no ar
  legs.L.hip.rotation.set(-0.36, -0.10, -0.06);
  legs.L.knee.rotation.set(0.55, 0, 0);
  legs.R.hip.rotation.set(0.20, 0.10, 0.06);
  legs.R.knee.rotation.set(0.25, 0, 0);

  // ------------------------------------------------------------------------
  // B. TRONCO ATLÉTICO ESCULPIDO + NEBRIS (PELE DE PANTERA CRUZADA NO OMBRO)
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.32, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.43),
    new T.Vector2(0.245, -0.39),
    new T.Vector2(0.215, -0.19),
    new T.Vector2(0.265, 0.03),
    new T.Vector2(0.37, 0.26),
    new T.Vector2(0.33, 0.42),
    new T.Vector2(0.145, 0.49),
    new T.Vector2(0.01, 0.50)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.16, 1.02, 0.74]);

  // Peitorais bem definidos
  const pecGeo = new T.SphereGeometry(0.205, 22, 22);
  sculpt(torso, pecGeo, M.skin, [-0.175, 0.22, 0.16], [0.12, -0.22, -0.14], [1.05, 0.85, 0.58]);
  sculpt(torso, pecGeo, M.skin, [0.175, 0.22, 0.16], [0.12, 0.22, 0.14], [1.05, 0.85, 0.58]);

  // Abdômen definido (6-pack) e Oblíquos
  const abGeo = new T.SphereGeometry(0.082, 14, 14);
  [
    { y: 0.04, sx: 0.98, sy: 0.75, z: 0.202 },
    { y: -0.075, sx: 0.94, sy: 0.78, z: 0.198 },
    { y: -0.19, sx: 0.86, sy: 0.84, z: 0.188 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.068, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.48]);
    sculpt(torso, abGeo, M.skin, [0.068, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.48]);
  });

  const obliqueGeo = new T.CapsuleGeometry(0.075, 0.22, 10, 14);
  sculpt(torso, obliqueGeo, M.skin, [-0.235, -0.11, 0.082], [0.1, 0, -0.18], [0.85, 1, 0.85]);
  sculpt(torso, obliqueGeo, M.skin, [0.235, -0.11, 0.082], [0.1, 0, 0.18], [0.85, 1, 0.85]);

  // Dorsais e Pescoço
  const latGeo = new T.SphereGeometry(0.225, 18, 18);
  sculpt(torso, latGeo, M.skin, [-0.20, 0.17, -0.112], [0, 0, -0.25], [1.0, 1.32, 0.65]);
  sculpt(torso, latGeo, M.skin, [0.20, 0.17, -0.112], [0, 0, 0.25], [1.0, 1.32, 0.65]);
  sculpt(torso, new T.CylinderGeometry(0.116, 0.146, 0.25, 20), M.skin, [0, 0.52, -0.008], [0.07, 0, 0]);

  // NEBRIS: Faixa de Pele de Pantera Sagrada cruzando do ombro esquerdo até a cintura direita
  const nebrisCurve = new T.CatmullRomCurve3([
    new T.Vector3(0.22, -0.35, 0.21),
    new T.Vector3(0.04, -0.06, 0.25),
    new T.Vector3(-0.18, 0.24, 0.21),
    new T.Vector3(-0.23, 0.44, 0.11),
    new T.Vector3(-0.20, 0.45, -0.12),
    new T.Vector3(-0.04, 0.08, -0.21),
    new T.Vector3(0.16, -0.34, -0.18)
  ]);
  const nebrisGeo = new T.TubeGeometry(nebrisCurve, 32, 0.105, 12, false);
  nebrisGeo.scale(1.15, 1, 0.44);
  sculpt(torso, nebrisGeo, M.nebrisPelt);

  // Broche de Ouro e Ametista prendendo a Nébris no ombro esquerdo
  sculpt(torso, new T.CylinderGeometry(0.048, 0.048, 0.02, 20), M.goldPolished, [-0.22, 0.42, 0.13], [-0.35, -0.25, 0]);
  sculpt(torso, new T.OctahedronGeometry(0.024, 0), M.grapePurple, [-0.22, 0.42, 0.145]);

  // ------------------------------------------------------------------------
  // C. ROSTO JOVEM, CARISMÁTICO E SORRIDENTE + COROA DE VIDEIRAS E UVAS
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.73, 0.032);

  // Crânio jovem harmônico e expressivo (sem barba)
  const skullGeo = new T.SphereGeometry(0.194, 38, 38);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.15;
    x *= 0.91;
    if (y < 0.02 && y > -0.08 && z > 0) { x *= 1.04; z *= 1.04; }
    if (y <= -0.08 && z > -0.02) {
      const taper = Math.max(0.66, 1.0 - ((-0.08 - y) / 0.14) * 0.32);
      x *= taper;
      z *= 1.04;
    }
    if (z < -0.11) z *= 0.93;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  // Maçãs do rosto e nariz clássico
  const cheekGeo = new T.SphereGeometry(0.045, 16, 16);
  sculpt(head, cheekGeo, M.skin, [-0.068, -0.015, 0.15], [0, -0.3, 0], [1.1, 0.85, 0.65]);
  sculpt(head, cheekGeo, M.skin, [0.068, -0.015, 0.15], [0, 0.3, 0], [1.1, 0.85, 0.65]);

  sculpt(head, new T.BoxGeometry(0.022, 0.078, 0.042), M.skin, [0, 0.004, 0.185], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.016, 14, 14), M.skin, [0, -0.034, 0.199], [0, 0, 0], [0.95, 0.82, 1.0]);

  // Sobrancelhas expressivas e joviais
  const browGeo = new T.CapsuleGeometry(0.0085, 0.056, 8, 12);
  sculpt(head, browGeo, M.hairDarkAuburn, [-0.052, 0.048, 0.179], [0.1, 0.25, 1.40]);
  sculpt(head, browGeo, M.hairDarkAuburn, [0.052, 0.048, 0.179], [0.1, -0.25, -1.40]);

  // Olhos Ametista / Magenta radiantes de celebração e êxtase
  const eyeGeo = new T.SphereGeometry(0.019, 16, 16);
  sculpt(head, eyeGeo, M.eyeAmethyst, [-0.052, 0.022, 0.173], [0, 0, 0], [1.15, 0.76, 0.8]);
  sculpt(head, eyeGeo, M.eyeAmethyst, [0.052, 0.022, 0.173], [0, 0, 0], [1.15, 0.76, 0.8]);

  // Sorriso aberto e carismático do Deus da Festa
  const smileCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.032, -0.072, 0.180),
    new T.Vector3(0, -0.086, 0.189),
    new T.Vector3(0.032, -0.072, 0.180)
  ]);
  sculpt(head, new T.TubeGeometry(smileCurve, 12, 0.007, 6, false), M.skinShade);

  // Cabeleira Exuberante de Cachos Escuros com Reflexo Púrpura caindo sobre os ombros
  const hairCurls = [];
  sculpt(head, new T.SphereGeometry(0.20, 24, 24), M.hairDarkAuburn, [0, 0.04, -0.02], [-0.08, 0, 0], [1.03, 1.03, 1.07]);

  for (let i = 0; i < 34; i++) {
    const ang = (i / 34) * Math.PI * 2;
    const isFront = Math.cos(ang) > 0.38;
    const rad = isFront ? 0.18 : 0.198;
    const cx = Math.sin(ang) * rad;
    const cz = Math.cos(ang) * rad - 0.01;
    const cy = isFront ? 0.074 : (0.04 - (i % 5) * 0.052);
    const curlSize = isFront ? 0.034 : (0.048 + (i % 2) * 0.014);

    const curl = sculpt(
      head,
      new T.SphereGeometry(curlSize, 12, 12),
      i % 3 === 0 ? M.hairWineHighlight : M.hairDarkAuburn,
      [cx, cy, cz],
      [0.2, ang, 0],
      [1.05, 1.28, 0.95]
    );
    hairCurls.push({ mesh: curl, baseY: cy, phase: i * 0.48 });
  }

  // COROA DE FOLHAS DE PARREIRA / HERA E CACHOS DE UVAS PÚRPURAS
  const vineCrown = group(head, 0, 0.105, 0.01);
  vineCrown.rotation.x = 0.2;

  const crownVine = new T.TorusGeometry(0.20, 0.014, 10, 36);
  crownVine.rotateX(Math.PI / 2);
  sculpt(vineCrown, crownVine, M.ivyGreen, [0, 0, 0], [0, 0, 0], [0.98, 1, 1.06]);

  // Folhas de parreira esculpidas ao redor da coroa
  const ivyLeafGeo = new T.SphereGeometry(0.034, 8, 8);
  ivyLeafGeo.scale(0.85, 1.25, 0.18);
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    sculpt(
      vineCrown,
      ivyLeafGeo,
      M.ivyGreen,
      [Math.sin(a) * 0.205, 0.015, Math.cos(a) * 0.218],
      [0.35, a, (i % 2 === 0 ? 0.3 : -0.3)]
    );
  }

  // Dois pequenos cachos de uvas púrpuras pendentes nas têmporas da coroa
  for (const side of [-1, 1]) {
    const cluster = group(vineCrown, side * 0.195, -0.02, 0.06);
    for (let g = 0; g < 6; g++) {
      const gx = ((g % 2) - 0.5) * 0.022;
      const gy = -Math.floor(g / 2) * 0.022;
      const gz = (g % 3) * 0.008;
      sculpt(cluster, new T.SphereGeometry(0.016, 10, 10), M.grapePurple, [gx, gy, gz]);
    }
  }

  // ------------------------------------------------------------------------
  // D. BRAÇOS ATLÉTICOS + TIRSO (THYRSUS) + CÁLICE DOURADO TRANSBORDANDO VINHO
  // ------------------------------------------------------------------------
  function createDionysusArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.41, 0.33, -0.008);

    sculpt(arm, new T.SphereGeometry(0.132, 18, 18), M.skin, [0, 0, 0], [0, 0, s * -0.22], [1.04, 1.12, 1.04]);
    sculpt(arm, new T.CapsuleGeometry(0.084, 0.26, 12, 16), M.skin, [s * 0.02, -0.17, 0], [0, 0, s * 0.07]);
    sculpt(arm, new T.SphereGeometry(0.078, 14, 14), M.skin, [s * 0.015, -0.16, 0.038], [0, 0, s * 0.07], [0.92, 1.42, 0.92]);

    const elbow = group(arm, s * 0.038, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.078, 0.052, 0.31, 18), M.skin, [0, -0.15, 0]);

    // Bracelete Dourado Ornamentado com Folhas de Hera
    const bracer = group(elbow, 0, -0.24, 0);
    sculpt(bracer, new T.CylinderGeometry(0.062, 0.055, 0.085, 24, 1, true), M.goldPolished);
    const bRing = new T.TorusGeometry(0.06, 0.0055, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.ivyGreen, [0, 0.04, 0]);
    sculpt(bracer, bRing, M.ivyGreen, [0, -0.04, 0]);

    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.068, 0.078, 0.034), M.skin, [0, -0.018, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.0095, 0.036, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.016;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.058, 0.016], [1.15, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.036, -0.028, 0.02], [0.55, 0, -s * 0.6], [1.05, 0.9, 1.05]);

    return { arm, elbow, hand };
  }

  const rightArm = createDionysusArm(true);
  const leftArm = createDionysusArm(false);

  // ------------------------------------------------------------------------
  // E. O TIRSO (THYRSUS) NA MÃO DIREITA — CAJADO DE VIDEIRA COM PINHA DOURADA
  // ------------------------------------------------------------------------
  const thyrsus = new T.Group();
  rightArm.hand.add(thyrsus);
  thyrsus.position.set(0, -0.035, 0.032);

  // Haste longa de madeira sagrada (2.78 unidades)
  sculpt(thyrsus, new T.CylinderGeometry(0.022, 0.025, 2.78, 16), M.bronzeWood, [0, 0.18, 0]);
  sculpt(thyrsus, new T.ConeGeometry(0.034, 0.2, 8), M.goldPolished, [0, -1.28, 0], [Math.PI, 0, 0]);

  // Vinha de hera e uvas enrolada em espiral ao longo de todo o Tirso
  const staffVinePts = [];
  for (let i = 0; i <= 48; i++) {
    const t = i / 48;
    const ang = t * Math.PI * 10;
    const y = -0.95 + t * 2.35;
    staffVinePts.push(new T.Vector3(Math.cos(ang) * 0.032, y, Math.sin(ang) * 0.032));
  }
  sculpt(thyrsus, new T.TubeGeometry(new T.CatmullRomCurve3(staffVinePts), 54, 0.0085, 6, false), M.ivyGreen);

  // Fitas púrpuras esvoaçantes amarradas abaixo da pinha do Tirso
  const ribbonL = sculpt(thyrsus, new T.BoxGeometry(0.035, 0.42, 0.006), M.purpleTunic, [-0.04, 1.24, 0.02], [0.1, 0, 0.28]);
  const ribbonR = sculpt(thyrsus, new T.BoxGeometry(0.035, 0.42, 0.006), M.purpleTunic, [0.04, 1.24, -0.02], [-0.1, 0, -0.28]);

  // Cabeça do Tirso: Coroa de Folhas de Hera + Pinha Sagrada Dourada Luminosa
  const thyrsusHead = group(thyrsus, 0, 1.56, 0);

  // Colar de folhas de parreira na base da pinha
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    sculpt(
      thyrsusHead,
      ivyLeafGeo,
      M.ivyGreen,
      [Math.cos(a) * 0.068, -0.04, Math.sin(a) * 0.068],
      [0.65, -a, 0],
      [1.4, 1.4, 1.0]
    );
  }

  // Pinha Sagrada Esculpida em camadas de escamas douradas e púrpura
  const pineCore = sculpt(thyrsusHead, new T.SphereGeometry(0.095, 18, 18), M.pineConeMat, [0, 0.12, 0], [0, 0, 0], [0.95, 1.65, 0.95]);
  for (let ring = 0; ring < 4; ring++) {
    const ry = 0.02 + ring * 0.062;
    const rad = Math.sin(((ring + 0.6) / 4.6) * Math.PI) * 0.092;
    const count = 7;
    for (let s = 0; s < count; s++) {
      const sa = (s / count) * Math.PI * 2 + ring * 0.45;
      sculpt(
        thyrsusHead,
        new T.ConeGeometry(0.026, 0.065, 5),
        ring % 2 === 0 ? M.goldPolished : M.grapePurple,
        [Math.cos(sa) * rad, ry, Math.sin(sa) * rad],
        [Math.sin(sa) * 0.55, -sa, -Math.cos(sa) * 0.55]
      );
    }
  }

  const thyrsusAnchor = group(thyrsusHead, 0, 0.28, 0);
  const thyrsusGlow = new T.Mesh(
    new T.SphereGeometry(0.18, 12, 10),
    new T.MeshBasicMaterial({
      color: 0xd946ef,
      transparent: true,
      opacity: 0.72,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  thyrsusAnchor.add(thyrsusGlow);

  // ------------------------------------------------------------------------
  // F. CÁLICE DOURADO (KANTHAROS) TRANSBORDANDO VINHO LUMINOSO NA MÃO ESQUERDA
  // ------------------------------------------------------------------------
  const chalice = group(leftArm.hand, 0, -0.055, 0.055);
  chalice.rotation.set(Math.PI / 2, 0, 0);

  // Pé e haste do cálice grego Kantharos
  sculpt(chalice, new T.CylinderGeometry(0.025, 0.055, 0.03, 18), M.goldPolished, [0, -0.09, 0]);
  sculpt(chalice, new T.CylinderGeometry(0.014, 0.018, 0.07, 14), M.goldPolished, [0, -0.045, 0]);
  // Bojo do cálice dourado
  sculpt(chalice, new T.CylinderGeometry(0.078, 0.038, 0.11, 22), M.goldPolished, [0, 0.035, 0]);
  // Duas alças altas elegantes do Kantharos
  for (const side of [-1, 1]) {
    const handleArc = new T.TorusGeometry(0.052, 0.006, 8, 20, Math.PI * 1.35);
    sculpt(chalice, handleArc, M.goldPolished, [side * 0.072, 0.065, 0], [0, 0, side === 1 ? -0.4 : 2.1]);
  }
  // Vinho divino brilhante no interior do cálice
  sculpt(chalice, new T.CylinderGeometry(0.072, 0.072, 0.01, 20), M.wineLiquid, [0, 0.088, 0]);

  const chaliceGlow = new T.Mesh(
    new T.SphereGeometry(0.11, 12, 10),
    new T.MeshBasicMaterial({
      color: 0xe879f9,
      transparent: true,
      opacity: 0.65,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  chaliceGlow.position.y = 0.11;
  chalice.add(chaliceGlow);

  // ------------------------------------------------------------------------
  // G. VESTIMENTA BÁQUICA (HIMATION PÚRPURA IMPERIAL E MANTO ESCARLATE-VINHO)
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  // Cinto dourado ornamentado com cachos de uva
  const beltGeo = new T.TorusGeometry(0.26, 0.024, 10, 32);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.goldPolished, [0, -0.34, 0.008], [0.05, 0, -0.03], [1.06, 1, 0.82]);
  sculpt(garments, new T.OctahedronGeometry(0.03, 0), M.grapePurple, [0, -0.34, 0.215]);

  // Himation Púrpura Imperial drapeado na cintura e pernas
  const skirtGeo = new T.CylinderGeometry(0.26, 0.54, 0.86, 48, 18, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.43 - y) / 0.86));
    const pleat = Math.sin(angle * 13) * 0.03 * (0.25 + normY * 0.92);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.05;
    z = Math.sin(angle) * r * 0.83 - normY * 0.08;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.purpleTunic, [0, -0.76, 0], [0.04, 0, 0]);

  // Manto Púrpura-Real esvoaçante preso aos ombros
  const capeGeo = new T.PlaneGeometry(1.36, 1.86, 24, 32);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.93 - y) / 1.86));
    const archZ = -0.17 - Math.cos((x / 0.68) * Math.PI * 0.5) * 0.08;
    const z = archZ - normY * 0.52;
    const fx = x * (0.64 + normY * 0.74);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.purpleTunic, [0, -0.45, -0.04]);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    thyrsus, thyrsusHead, pineCore, thyrsusAnchor, thyrsusGlow, ribbonL, ribbonR,
    chalice, chaliceGlow,
    hairCurls,
    skirtMesh, skirtBase,
    cape, capeBase
  };
}

/* ==========================================================================
   4. VINHEDO OLÍMPICO, PÉRGOLAS COM CACHOS DE UVAS E TOCHAS ROXAS
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const festBg = new T.Color(0x240b36);
const ecstasyBg = new T.Color(0x3b0764);
scene.background = festBg.clone();
scene.fog = new T.FogExp2(0x240b36, 0.02);

// Céu de Crepúsculo Festivo (Púrpura, Magenta e Ouro)
const skyGeo = new T.SphereGeometry(80, 32, 32);
const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x11051f) },
    midColor: { value: new T.Color(0x581c87) },
    horizonColor: { value: new T.Color(0xf59e0b) },
    sunDir: { value: new T.Vector3(0.45, 0.35, -0.80).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(horizonColor, midColor, smoothstep(0.40, 0.66, h));
      col = mix(col, topColor, smoothstep(0.66, 0.96, h));
      float sunGlow = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.72, 0.95) * pow(sunGlow, 8.0) * 0.48;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new T.Mesh(skyGeo, skyMat));

const camera = new T.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 150);

// Iluminação Quente de Banquete e Vinho
const hemi = new T.HemisphereLight(0xf3e8ff, 0x4c1d95, 1.02);
scene.add(hemi);

const sun = new T.DirectionalLight(0xfef3c7, 2.15);
sun.position.set(4.8, 7.8, 5.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 28 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const grapeRim = new T.DirectionalLight(0xd946ef, 1.5);
grapeRim.position.set(-4.5, 4.5, -5.0);
scene.add(grapeRim);

const thyrsusLight = new T.PointLight(0xd946ef, 2.2, 8.5);
scene.add(thyrsusLight);

const pulseLight = new T.PointLight(0xfacc15, 0, 15);
scene.add(pulseLight);

const textures = createProceduralTextures();

// Plataforma Circular de Mármore Claro com Mosaico de Videiras e Sol Báquico
const arenaFloor = new T.Mesh(
  new T.CylinderGeometry(7.3, 7.6, 0.32, 72),
  new T.MeshStandardMaterial({ map: textures.floorTex, roughness: 0.36, metalness: 0.12 })
);
arenaFloor.position.y = -0.16;
arenaFloor.receiveShadow = true;
scene.add(arenaFloor);

const stepRing = new T.Mesh(
  new T.CylinderGeometry(7.9, 8.2, 0.18, 72),
  new T.MeshStandardMaterial({ color: 0xede9fe, roughness: 0.48 })
);
stepRing.position.y = -0.24;
stepRing.receiveShadow = true;
scene.add(stepRing);

const wineRing = new T.Mesh(
  new T.RingGeometry(4.55, 4.66, 72),
  new T.MeshBasicMaterial({
    color: 0xc026d3,
    transparent: true,
    opacity: 0.8,
    blending: T.AdditiveBlending,
    side: T.DoubleSide
  })
);
wineRing.rotation.x = -Math.PI / 2;
wineRing.position.y = 0.015;
scene.add(wineRing);

// 8 Colunas Enfeitadas com Videiras, Cachos de Uvas Púrpuras e Tochas Douradas
const marbleMat = new T.MeshStandardMaterial({ color: 0xfaf5ff, roughness: 0.42, metalness: 0.06 });
const goldColMat = new T.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.88, roughness: 0.22 });
const vineColMat = new T.MeshStandardMaterial({ color: 0x15803d, roughness: 0.62 });
const grapeColMat = new T.MeshStandardMaterial({ color: 0x7e22ce, emissive: 0x3b0764, emissiveIntensity: 0.4, roughness: 0.25 });
const torchCoreMat = new T.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.92, blending: T.AdditiveBlending });
const torchOuterMat = new T.MeshBasicMaterial({ color: 0xd946ef, transparent: true, opacity: 0.75, blending: T.AdditiveBlending });

const shaftGeo = new T.CylinderGeometry(0.22, 0.26, 2.75, 22, 1);
const shPos = shaftGeo.attributes.position;
for (let i = 0; i < shPos.count; i++) {
  const x = shPos.getX(i), y = shPos.getY(i), z = shPos.getZ(i);
  const ang = Math.atan2(z, x);
  const flute = Math.cos(ang * 16) * 0.007;
  const r = Math.sqrt(x * x + z * z) - flute;
  shPos.setXYZ(i, Math.cos(ang) * r, y, Math.sin(ang) * r);
}
shaftGeo.computeVertexNormals();

const torchFlames = [];
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + 0.2;
  const dist = 5.85;
  const col = group(scene, Math.cos(a) * dist, 0, Math.sin(a) * dist);

  sculpt(col, new T.BoxGeometry(0.72, 0.14, 0.72), marbleMat, [0, 0.07, 0]);
  sculpt(col, shaftGeo, marbleMat, [0, 1.52, 0]);
  sculpt(col, new T.CylinderGeometry(0.34, 0.22, 0.15, 20), marbleMat, [0, 2.96, 0]);
  sculpt(col, new T.BoxGeometry(0.64, 0.14, 0.64), marbleMat, [0, 3.10, 0]);
  sculpt(col, new T.BoxGeometry(0.54, 0.05, 0.54), goldColMat, [0, 3.20, 0]);

  // Videira enrolada na coluna com cachos de uvas pendentes
  const vinePts = [];
  for (let v = 0; v <= 24; v++) {
    const t = v / 24;
    const va = t * Math.PI * 4 + i;
    vinePts.push(new T.Vector3(Math.cos(va) * 0.255, 0.35 + t * 2.45, Math.sin(va) * 0.255));
  }
  sculpt(col, new T.TubeGeometry(new T.CatmullRomCurve3(vinePts), 24, 0.018, 6, false), vineColMat);

  for (let g = 0; g < 4; g++) {
    const t = (g + 0.4) / 4;
    const va = t * Math.PI * 4 + i;
    sculpt(col, new T.SphereGeometry(0.065, 10, 10), grapeColMat, [Math.cos(va) * 0.28, 0.35 + t * 2.45, Math.sin(va) * 0.28], [0, 0, 0], [0.85, 1.45, 0.85]);
  }

  // Tocha festiva roxo-dourada no topo
  sculpt(col, new T.CylinderGeometry(0.30, 0.18, 0.16, 12), goldColMat, [0, 3.30, 0]);
  const f1 = new T.Mesh(new T.ConeGeometry(0.13, 0.42, 10), torchCoreMat);
  f1.position.y = 3.54;
  col.add(f1);

  const f2 = new T.Mesh(new T.ConeGeometry(0.21, 0.58, 12), torchOuterMat);
  f2.position.y = 3.62;
  col.add(f2);

  torchFlames.push({ f1, f2, phase: i * 0.85 });
}

// Sombra radial suave no piso
function createShadowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  gr.addColorStop(0, 'rgba(30, 10, 45, 0.45)');
  gr.addColorStop(1, 'rgba(30, 10, 45, 0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}
const shadowBlob = new T.Mesh(
  new T.PlaneGeometry(1, 1),
  new T.MeshBasicMaterial({ map: createShadowTex(), transparent: true, depthWrite: false })
);
shadowBlob.rotation.x = -Math.PI / 2;
shadowBlob.position.y = 0.015;
scene.add(shadowBlob);

// Instanciar Dionísio
const dionysus = buildDionysus(textures);
scene.add(dionysus.root);

/* ==========================================================================
   5. PODERES EXCLUSIVOS DE DIONÍSIO:
      - Gotas de Vinho e Folhas de Parreira Flutuando pelo Santuário
      - Vinhas Selvagens (Raízes e Videiras Espinhentas com Cachos de Uvas emergindo do solo)
      - Êxtase Dionisíaco (Vórtice Festivo Púrpura-Dourado + Notas Musicais/Orbes + Ondas de Euforia)
   ========================================================================== */
const WINE_N = 280;
const winePos = new Float32Array(WINE_N * 3);
const wineSpeed = new Float32Array(WINE_N);
for (let i = 0; i < WINE_N; i++) {
  winePos[i * 3] = (Math.random() - 0.5) * 14;
  winePos[i * 3 + 1] = 0.2 + Math.random() * 5.6;
  winePos[i * 3 + 2] = (Math.random() - 0.5) * 14;
  wineSpeed[i] = 0.25 + Math.random() * 0.45;
}
const wineGeo = new T.BufferGeometry();
wineGeo.setAttribute('position', new T.BufferAttribute(winePos, 3));
scene.add(new T.Points(wineGeo, new T.PointsMaterial({
  color: 0xe879f9,
  size: 0.088,
  transparent: true,
  opacity: 0.86,
  blending: T.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
})));

// --------------------------------------------------------------------------
// "VINHAS SELVAGENS" — CIPÓS DE PARREIRA COM FOLHAS E UVAS EMERGINDO DO CHÃO
// --------------------------------------------------------------------------
const wildVines = [];
const vineStemMat = new T.MeshStandardMaterial({ color: 0x15803d, emissive: 0x052e16, emissiveIntensity: 0.35, roughness: 0.55 });
const vineLeafMat = new T.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x14532d, emissiveIntensity: 0.4, roughness: 0.4 });
const vineGrapeMat = new T.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x6b21a8, emissiveIntensity: 0.85, roughness: 0.2 });

function spawnWildVineBurst(centerX, centerZ) {
  for (let v = 0; v < 5; v++) {
    const a = Math.random() * Math.PI * 2;
    const dist = 1.4 + Math.random() * 2.8;
    const vx = centerX + Math.cos(a) * dist;
    const vz = centerZ + Math.sin(a) * dist;

    const vineGroup = new T.Group();
    vineGroup.position.set(vx, 0, vz);

    // Cipó retorcido subindo em espiral
    const pts = [];
    const h = 1.8 + Math.random() * 1.1;
    for (let k = 0; k <= 12; k++) {
      const t = k / 12;
      const sa = t * Math.PI * 3 + v;
      const r = 0.22 * (1 - t * 0.65);
      pts.push(new T.Vector3(Math.cos(sa) * r, t * h, Math.sin(sa) * r));
    }
    const stem = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 16, 0.036, 7, false), vineStemMat);
    vineGroup.add(stem);

    // Folhas e cachos de uvas luminosas ao longo do cipó
    for (let f = 1; f <= 4; f++) {
      const t = f / 5;
      const sa = t * Math.PI * 3 + v;
      const leaf = new T.Mesh(new T.SphereGeometry(0.11, 8, 8), vineLeafMat);
      leaf.position.set(Math.cos(sa) * 0.16, t * h, Math.sin(sa) * 0.16);
      leaf.scale.set(1.2, 0.25, 0.9);
      vineGroup.add(leaf);

      if (f % 2 === 0) {
        const grape = new T.Mesh(new T.SphereGeometry(0.085, 8, 8), vineGrapeMat);
        grape.position.set(-Math.cos(sa) * 0.14, t * h - 0.06, -Math.sin(sa) * 0.14);
        grape.scale.set(0.85, 1.45, 0.85);
        vineGroup.add(grape);
      }
    }

    vineGroup.scale.set(1, 0.01, 1);
    scene.add(vineGroup);
    wildVines.push({ mesh: vineGroup, life: 1.45, max: 1.45 });
  }

  pulseLight.position.set(centerX, 1.5, centerZ);
  pulseLight.intensity = 9.0;
}

// --------------------------------------------------------------------------
// ONDAS DE DANÇA BÁQUICA & SUPREMO "ÊXTASE DIONISÍACO"
// --------------------------------------------------------------------------
const euphoriaWaves = [];
const danceTrails = [];

function spawnDanceTrail(x, z) {
  const ring = new T.Mesh(
    new T.RingGeometry(0.28, 0.65, 28),
    new T.MeshBasicMaterial({
      color: 0xd946ef,
      transparent: true,
      opacity: 0.72,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.03, z);
  scene.add(ring);
  danceTrails.push({ mesh: ring, life: 0.95, max: 0.95 });
}

function spawnEuphoriaWave(x, z) {
  const ring = new T.Mesh(
    new T.RingGeometry(0.3, 0.72, 48),
    new T.MeshBasicMaterial({
      color: 0xfacc15,
      transparent: true,
      opacity: 0.92,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.04, z);
  scene.add(ring);
  euphoriaWaves.push({ mesh: ring, life: 1.15, max: 1.15 });
}

// Supremo: "Êxtase Dionisíaco" (Vórtice Festivo Púrpura-Dourado + Orbes de Vinho Orbitantes)
const ecstasyGroup = new T.Group();
ecstasyGroup.visible = false;
scene.add(ecstasyGroup);

const ecstasyRing1 = new T.Mesh(
  new T.TorusGeometry(1.75, 0.035, 10, 56),
  new T.MeshBasicMaterial({ color: 0xd946ef, transparent: true, opacity: 0.88, blending: T.AdditiveBlending, depthWrite: false })
);
ecstasyRing1.rotation.x = Math.PI / 2;
ecstasyRing1.position.y = 0.85;

const ecstasyRing2 = new T.Mesh(
  new T.TorusGeometry(2.2, 0.028, 10, 56),
  new T.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.82, blending: T.AdditiveBlending, depthWrite: false })
);
ecstasyRing2.rotation.x = Math.PI / 2;
ecstasyRing2.position.y = 2.05;

const ecstasyBeam = new T.Mesh(
  new T.CylinderGeometry(1.4, 2.3, 5.2, 32, 1, true),
  new T.MeshBasicMaterial({
    color: 0x9333ea,
    transparent: true,
    opacity: 0.25,
    blending: T.AdditiveBlending,
    side: T.DoubleSide,
    depthWrite: false
  })
);
ecstasyBeam.position.y = 2.6;
ecstasyGroup.add(ecstasyRing1, ecstasyRing2, ecstasyBeam);

const ecstasyOrbs = [];
for (let i = 0; i < 12; i++) {
  const orb = new T.Mesh(
    new T.OctahedronGeometry(0.12, 0),
    new T.MeshBasicMaterial({
      color: i % 2 === 0 ? 0xfacc15 : 0xe879f9,
      transparent: true,
      opacity: 0.9,
      blending: T.AdditiveBlending
    })
  );
  ecstasyGroup.add(orb);
  ecstasyOrbs.push({
    mesh: orb,
    angle: (i / 12) * Math.PI * 2,
    radius: 1.4 + (i % 3) * 0.45,
    y: 0.4 + (i % 4) * 0.9,
    speed: 2.2 + (i % 3) * 0.4
  });
}

/* ==========================================================================
   6. CONTROLES INTERATIVOS E CÂMERA 360° / FOCO NO ROSTO E CORPO
   ========================================================================== */
let mode = 'banquete';
let vineTimer = 0;
let trailTimer = 0;
let euphoriaTimer = 0;
let ecstasyWeight = 0;
let focusFace = false;

let camAngle = 0.42;
let camPitch = 0.18;
let camDist = 8.4;
let targetCamDist = 8.4;
let currentLookAt = new T.Vector3(0, 1.9, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    vineTimer = 0.10;
    euphoriaTimer = 0.08;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Rosto';
  targetCamDist = focusFace ? 2.55 : 8.4;
  if (focusFace) {
    camAngle = 0.20;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (BANQUETE, DANÇA BÁQUICA, VINHAS & ÊXTASE DIONISÍACO)
   ========================================================================== */
const tmpV = new T.Vector3();

function update(dt, t) {
  let dx = 0, dz = 0, yaw = Math.sin(t * 0.45) * 0.24, pitch = 0.04, roll = 0;
  const hoverY = Math.sin(t * 1.8) * 0.08;

  // 1. MOVIMENTAÇÃO E POSTURA FESTIVA POR MODO
  if (mode === 'danca') {
    const a = t * 0.92;
    const R = 2.75;
    dx = Math.cos(a) * R;
    dz = Math.sin(a) * R;
    yaw = -a + Math.sin(t * 3.0) * 0.42;
    pitch = 0.12;
    roll = -0.22;

    trailTimer -= dt;
    if (trailTimer <= 0) {
      trailTimer = 0.11;
      spawnDanceTrail(dx, dz);
    }
  } else {
    dx = Math.sin(t * 0.5) * 0.22;
    dz = Math.cos(t * 0.42) * 0.18;
  }

  dionysus.root.position.set(dx, 0, dz);
  dionysus.root.rotation.set(0, yaw, 0);
  dionysus.body.position.y = 1.10 + hoverY;
  dionysus.body.rotation.set(pitch, 0, roll);

  // Balanço rítmico nas pernas
  dionysus.legs.L.hip.rotation.x = -0.36 + Math.sin(t * 2.2) * 0.08;
  dionysus.legs.R.hip.rotation.x = 0.20 - Math.sin(t * 2.2) * 0.08;

  // 2. POSTURA DOS BRAÇOS (TIRSO & CÁLICE DE VINHO)
  if (mode === 'vinhas') {
    // Bate o Tirso no ar invocando Vinhas Selvagens do solo
    dionysus.rightArm.arm.rotation.set(-0.45, 0.15, 2.35 + Math.sin(t * 5.0) * 0.18);
    dionysus.rightArm.elbow.rotation.set(0.45, 0.2, 0.25);
    dionysus.thyrsus.rotation.set(0.25, 0, -0.22);
    dionysus.leftArm.arm.rotation.set(-0.42, -0.3, -0.75);
    dionysus.leftArm.elbow.rotation.set(-0.85, -0.2, 0.15);

    vineTimer -= dt;
    if (vineTimer <= 0) {
      vineTimer = 0.95;
      spawnWildVineBurst(dx, dz);
    }
  } else if (mode === 'extase') {
    // Ergue tanto o Tirso quanto o Cálice Dourado em celebração suprema!
    dionysus.rightArm.arm.rotation.set(-0.35, 0.15, 2.35 + Math.sin(t * 2.4) * 0.06);
    dionysus.rightArm.elbow.rotation.set(0.45, 0.2, 0.25);
    dionysus.thyrsus.rotation.set(0.20, 0, -0.22);

    dionysus.leftArm.arm.rotation.set(-0.45, -0.25, -2.15 + Math.cos(t * 2.4) * 0.06);
    dionysus.leftArm.elbow.rotation.set(-0.45, -0.2, 0.15);

    euphoriaTimer -= dt;
    if (euphoriaTimer <= 0) {
      euphoriaTimer = 0.85;
      spawnEuphoriaWave(dx, dz);
    }
  } else {
    // Banquete Olímpico / Dança Báquica: Brinda com o Cálice na mão esquerda e apoia o Tirso na direita
    dionysus.rightArm.arm.rotation.set(-0.18, 0.12, 0.58 + Math.sin(t * 1.6) * 0.03);
    dionysus.rightArm.elbow.rotation.set(-0.52, 0.15, 0.22);
    dionysus.thyrsus.rotation.set(0.18, 0, -0.44);

    dionysus.leftArm.arm.rotation.set(-0.62, -0.35, -0.68 + Math.cos(t * 1.8) * 0.05);
    dionysus.leftArm.elbow.rotation.set(-1.05, -0.25, 0.18);
  }

  // Brilho do Tirso e do Cálice de Vinho
  const festBoost = (mode === 'extase' || mode === 'vinhas') ? 1.5 : 1.0;
  dionysus.thyrsusGlow.scale.setScalar((0.9 + Math.sin(t * 12) * 0.18) * festBoost);
  dionysus.chaliceGlow.scale.setScalar((0.85 + Math.cos(t * 10) * 0.16) * festBoost);
  dionysus.thyrsusAnchor.getWorldPosition(tmpV);
  thyrsusLight.position.copy(tmpV);
  thyrsusLight.intensity = 2.1 * festBoost + Math.sin(t * 14) * 0.35;

  // Vento nos cachos escuros, fitas do tirso e manto púrpura
  const wind = (mode === 'danca' || mode === 'extase') ? 1.85 : 1.0;
  for (const c of dionysus.hairCurls) {
    c.mesh.position.y = c.baseY + Math.sin(t * 2.8 * wind + c.phase) * 0.008;
  }
  dionysus.ribbonL.rotation.z = 0.28 + Math.sin(t * 4.2 * wind) * 0.14;
  dionysus.ribbonR.rotation.z = -0.28 + Math.cos(t * 4.0 * wind) * 0.14;

  const cAttr = dionysus.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = dionysus.capeBase[i * 3];
    const by = dionysus.capeBase[i * 3 + 1];
    const bz = dionysus.capeBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.93 - by) / 1.86));
    const wave1 = Math.sin(t * 3.2 * wind - normY * 4.5 + bx * 2.5) * 0.13 * normY;
    const wave2 = Math.cos(t * 2.2 * wind - normY * 3.0) * 0.055 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.4 - normY * 3.0) * 0.032 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  dionysus.cape.geometry.computeVertexNormals();

  const skAttr = dionysus.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = dionysus.skirtBase[i * 3];
    const by = dionysus.skirtBase[i * 3 + 1];
    const bz = dionysus.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.43 - by) / 0.86));
    skAttr.setZ(i, bz + Math.sin(t * 3.4 * wind - normY * 4.0 + bx * 4.0) * 0.04 * normY);
  }
  skAttr.needsUpdate = true;
  dionysus.skirtMesh.geometry.computeVertexNormals();

  // 3. ATUALIZAÇÃO DE VINHAS SELVAGENS, RASTROS DE DANÇA E ÊXTASE DIONISÍACO
  for (let i = wildVines.length - 1; i >= 0; i--) {
    const wv = wildVines[i];
    wv.life -= dt;
    const k = Math.max(0, wv.life / wv.max);
    const growCurve = Math.sin((1 - k) * Math.PI);
    wv.mesh.scale.y = Math.max(0.02, growCurve * 1.15);
    wv.mesh.rotation.y += dt * 0.8;
    if (wv.life <= 0) {
      scene.remove(wv.mesh);
      wv.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
      });
      wildVines.splice(i, 1);
    }
  }

  for (let i = danceTrails.length - 1; i >= 0; i--) {
    const dtItem = danceTrails[i];
    dtItem.life -= dt;
    const k = Math.max(0, dtItem.life / dtItem.max);
    dtItem.mesh.scale.setScalar(1 + (1 - k) * 2.3);
    dtItem.mesh.material.opacity = 0.72 * k;
    if (dtItem.life <= 0) {
      scene.remove(dtItem.mesh);
      dtItem.mesh.geometry.dispose();
      dtItem.mesh.material.dispose();
      danceTrails.splice(i, 1);
    }
  }

  for (let i = euphoriaWaves.length - 1; i >= 0; i--) {
    const ew = euphoriaWaves[i];
    ew.life -= dt;
    const k = Math.max(0, ew.life / ew.max);
    ew.mesh.scale.setScalar(1 + (1 - k) * 6.5);
    ew.mesh.material.opacity = 0.92 * k;
    if (ew.life <= 0) {
      scene.remove(ew.mesh);
      ew.mesh.geometry.dispose();
      ew.mesh.material.dispose();
      euphoriaWaves.splice(i, 1);
    }
  }

  // Êxtase Dionisíaco ativo
  const ecstasyTarget = (mode === 'extase') ? 1 : 0;
  ecstasyWeight = T.MathUtils.damp(ecstasyWeight, ecstasyTarget, 3.0, dt);
  ecstasyGroup.visible = ecstasyWeight > 0.02;
  if (ecstasyGroup.visible) {
    ecstasyGroup.position.set(dx, 0, dz);
    ecstasyRing1.rotation.z += dt * 2.4;
    ecstasyRing2.rotation.z -= dt * 3.0;
    ecstasyBeam.rotation.y += dt * 1.5;
    ecstasyRing1.scale.setScalar(ecstasyWeight * (1 + Math.sin(t * 6) * 0.08));
    ecstasyRing2.scale.setScalar(ecstasyWeight * (1 + Math.cos(t * 6) * 0.08));
    ecstasyBeam.material.opacity = 0.25 * ecstasyWeight;

    for (const orb of ecstasyOrbs) {
      orb.angle += dt * orb.speed;
      orb.y += dt * 1.4;
      if (orb.y > 4.2) orb.y = 0.2;
      orb.mesh.position.set(
        Math.cos(orb.angle) * orb.radius,
        orb.y,
        Math.sin(orb.angle) * orb.radius
      );
      orb.mesh.rotation.y += dt * 4.0;
      orb.mesh.scale.setScalar(ecstasyWeight);
    }
  }

  // Tochas das colunas e gotas de vinho flutuantes
  for (const tf of torchFlames) {
    tf.f1.scale.set(1 + Math.sin(t * 11 + tf.phase) * 0.12, 1 + Math.cos(t * 13 + tf.phase) * 0.18, 1);
    tf.f2.scale.set(1 + Math.cos(t * 10 + tf.phase) * 0.15, 1 + Math.sin(t * 9 + tf.phase) * 0.2, 1);
  }

  const wAttr = wineGeo.attributes.position;
  for (let i = 0; i < WINE_N; i++) {
    wAttr.setY(i, wAttr.getY(i) + wineSpeed[i] * dt);
    wAttr.setX(i, wAttr.getX(i) + Math.sin(t + i) * 0.14 * dt);
    if (wAttr.getY(i) > 5.8) wAttr.setY(i, 0.2);
  }
  wAttr.needsUpdate = true;

  wineRing.rotation.z += dt * 0.18;
  shadowBlob.position.set(dx, 0.015, dz);
  const s = 1.6 - hoverY * 1.4;
  shadowBlob.scale.set(s, s, 1);
  pulseLight.intensity = Math.max(0, pulseLight.intensity - dt * 14);

  scene.background.lerpColors(festBg, ecstasyBg, ecstasyWeight);
  scene.fog.color.copy(scene.background);

  // 4. CÂMERA INTERATIVA 360° + ZOOM + FOCO NO ROSTO / CORPO INTEIRO
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(dx, 3.02 + hoverY, dz)
    : new T.Vector3(0, 1.92, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
</body>
</html>
