<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Colosso de Zeus (Bronze, Prata & Ouro) | Age of Mythology 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #facc15;
      --silver: #e2e8f0;
      --bronze: #d97706;
      --glass: rgba(10, 16, 28, 0.86);
      --border: rgba(250, 204, 21, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09111e;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: auto;
    }
    button {
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.48);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      background: rgba(24, 36, 62, 0.94);
    }
    button.tier-btn.on[data-tier="1"] {
      background: linear-gradient(135deg, #d97706 0%, #78350f 100%);
      color: #ffffff;
      border-color: #fde68a;
      box-shadow: 0 0 18px rgba(217, 119, 6, 0.6);
    }
    button.tier-btn.on[data-tier="2"] {
      background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
      color: #090d16;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(226, 232, 240, 0.65);
    }
    button.tier-btn.on[data-tier="3"] {
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 55%, #b45309 100%);
      color: #140c02;
      border-color: #ffffff;
      box-shadow: 0 0 26px rgba(250, 204, 21, 0.85);
    }
    button.act-btn.on {
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      color: #ffffff;
      border-color: #bae6fd;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }
    button.cam-btn {
      border-color: rgba(125, 211, 252, 0.5);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      color: #fff;
      border-color: #e0f2fe;
    }

    #info-card {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 12px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      min-width: 320px;
      max-width: 92vw;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.52);
    }
    #card-title {
      color: #fde047;
      font-weight: 700;
      font-size: 13.5px;
    }
    #card-sub {
      color: #cbd5e1;
      font-size: 11.5px;
      margin-top: 2px;
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fde047;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 1060px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 16, 28, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 15px;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 11.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="row">
    <button data-tier="1" class="tier-btn on">🥉 Colosso de Bronze</button>
    <button data-tier="2" class="tier-btn">🥈 Colosso de Prata (Mão de Talos)</button>
    <button data-tier="3" class="tier-btn">🥇 Colosso de Ouro (Colosso de Rodes)</button>
  </div>
  <div class="row">
    <button data-act="vigilia" class="act-btn on">Vigília Titânica</button>
    <button data-act="marcha" class="act-btn">Marcha Colossal</button>
    <button data-act="ataque" class="act-btn">Golpe de Montante</button>
    <button data-act="devorar" class="act-btn">🌲 Devorar Árvore (Cura)</button>
    <button id="btn-focus" class="cam-btn">Focar Elmo & Espada</button>
  </div>
</div>

<div id="badge">Zeus • Unidade Mítica: Colosso</div>

<div id="info-card">
  <div id="card-title">Colosso de Bronze • Era Mítica (Base)</div>
  <div id="card-sub">Autômato gigante forjado por Hefesto para Zeus: couraça muscular de bronze, elmo coríntio fechado, saiote azul-olímpico e montante colossal</div>
</div>

<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. ESPECIFICAÇÃO DAS 3 EVOLUÇÕES DO COLOSSO DE ZEUS (BRONZE -> PRATA -> OURO)
   ========================================================================== */
const COLOSSUS_TIERS = {
  1: {
    tier: 1,
    title: 'Colosso de Bronze • Era Mítica (Base)',
    subtitle: 'Autômato gigante forjado em bronze maciço com couraça muscular esculpida, elmo coríntio fechado, túnica azul-olímpico e espada grande',
    metalHex: 0xb87634,
    accentHex: 0xeab308,
    bladeHex: 0xd69e54,
    metalness: 0.86,
    roughness: 0.28,
    crestHex: 0x1d4ed8,
    skirtHex: 0x1e3a8a,
    eyeHex: 0x38bdf8,
    eyeIntensity: 1.8,
    auraHex: 0xd97706
  },
  2: {
    tier: 2,
    title: 'Colosso de Prata • Melhoria: Mão de Talos',
    subtitle: 'Corpo reforçado em prata olímpica polida com ombreiras duplas, brilho estelar e lâmina rúnica prateada de alto impacto',
    metalHex: 0xdbe4ee,
    accentHex: 0x38bdf8,
    bladeHex: 0xf1f5f9,
    metalness: 0.94,
    roughness: 0.18,
    crestHex: 0x2563eb,
    skirtHex: 0x1e3a8a,
    eyeHex: 0x38bdf8,
    eyeIntensity: 2.8,
    auraHex: 0x38bdf8
  },
  3: {
    tier: 3,
    title: 'Colosso de Ouro • Melhoria Suprema: Colosso de Rodes',
    subtitle: 'Ápice divino em ouro olímpico radiante: crista dourada incandescente, ornamentos solares nos ombros e espada carregada pelos raios de Zeus',
    metalHex: 0xfacc15,
    accentHex: 0xfef08a,
    bladeHex: 0xfde047,
    metalness: 0.96,
    roughness: 0.14,
    crestHex: 0xfacc15,
    skirtHex: 0x1d4ed8,
    eyeHex: 0xfef08a,
    eyeIntensity: 4.2,
    auraHex: 0xfacc15
  }
};

/* ==========================================================================
   2. TEXTURAS PROCEDURAIS PBR (METAL FORJADO COM PÁTINA & PISO DO OLIMPO)
   ========================================================================== */
function createForgedMetalTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, 512, 512);

  // Micro-marteladas e ranhuras de metal forjado gigante
  for (let i = 0; i < 4200; i++) {
    const v = 116 + Math.floor(Math.random() * 24);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 2);
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}

function createColossusSkirtTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Tecido azul-olímpico profundo com pregas verticais
  ctx.fillStyle = '#1e3a8a';
  ctx.fillRect(0, 0, 512, 256);

  for (let x = 0; x < 512; x += 16) {
    ctx.fillStyle = (x / 16) % 2 === 0 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(9, 13, 28, 0.28)';
    ctx.fillRect(x, 0, 8, 256);
  }

  // Barrado inferior com meandro grego dourado
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 192, 512, 46);
  ctx.fillStyle = '#facc15';
  ctx.fillRect(0, 187, 512, 5);
  ctx.fillRect(0, 238, 512, 5);

  ctx.strokeStyle = '#fde047';
  ctx.lineWidth = 3.5;
  for (let x = 0; x < 512; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x + 4, 230);
    ctx.lineTo(x + 4, 200);
    ctx.lineTo(x + 24, 200);
    ctx.lineTo(x + 24, 222);
    ctx.lineTo(x + 12, 222);
    ctx.lineTo(x + 12, 211);
    ctx.lineTo(x + 19, 211);
    ctx.stroke();
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createFloorTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(0, 0, 1024, 1024);

  // Lajes de pedra monumental da arena
  const grid = 8;
  const cell = 1024 / grid;
  for (let gx = 0; gx < grid; gx++) {
    for (let gy = 0; gy < grid; gy++) {
      const shade = 195 + Math.floor((Math.random() - 0.5) * 22);
      ctx.fillStyle = `rgb(${shade}, ${shade - 4}, ${shade - 12})`;
      ctx.fillRect(gx * cell + 3, gy * cell + 3, cell - 6, cell - 6);
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(gx * cell + 1.5, gy * cell + 1.5, cell - 3, cell - 3);
    }
  }

  const cx = 512, cy = 512;
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.arc(cx, cy, 420, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(cx, cy, 438, 0, Math.PI * 2);
  ctx.stroke();

  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

/* ==========================================================================
   3. HELPERS DE ESCULTURA TITÂNICA E CONSTRUÇÃO DO COLOSSO
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function buildColossus(metalBump, initialTier = 1) {
  const spec0 = COLOSSUS_TIERS[initialTier];
  const skirtTex = createColossusSkirtTexture();

  const M = {
    bodyMetal: new T.MeshStandardMaterial({
      color: spec0.metalHex,
      metalness: spec0.metalness,
      roughness: spec0.roughness,
      bumpMap: metalBump,
      bumpScale: 0.004
    }),
    accentMetal: new T.MeshStandardMaterial({
      color: spec0.accentHex,
      emissive: 0x3b2200,
      emissiveIntensity: 0.25,
      metalness: 0.94,
      roughness: 0.16
    }),
    bladeMetal: new T.MeshStandardMaterial({
      color: spec0.bladeHex,
      emissive: 0x1e293b,
      emissiveIntensity: 0.2,
      metalness: 0.96,
      roughness: 0.14
    }),
    skirtCloth: new T.MeshStandardMaterial({
      map: skirtTex,
      color: 0xffffff,
      roughness: 0.54,
      side: T.DoubleSide
    }),
    crestMat: new T.MeshStandardMaterial({
      color: spec0.crestHex,
      emissive: 0x1e3a8a,
      emissiveIntensity: 0.25,
      roughness: 0.42
    }),
    cloakMat: new T.MeshStandardMaterial({
      color: 0x1e3a8a,
      emissive: 0x091326,
      emissiveIntensity: 0.25,
      roughness: 0.52,
      side: T.DoubleSide
    }),
    darkJoint: new T.MeshStandardMaterial({
      color: 0x1e293b,
      metalness: 0.75,
      roughness: 0.45
    }),
    soberEyeMat: new T.MeshStandardMaterial({
      color: 0x475569,
      emissive: 0x0f172a,
      emissiveIntensity: 0.2,
      metalness: 0.65,
      roughness: 0.35
    }),
    soberPupilMat: new T.MeshStandardMaterial({
      color: 0x090d16,
      roughness: 0.2,
      metalness: 0.8
    })
  };

  const root = new T.Group();
  const colossusScale = 1.28;
  const body = group(root, 0, 1.06 * colossusScale, 0);
  body.scale.setScalar(colossusScale);

  const tier2Parts = [];
  const tier3Parts = [];

  // Pelve & Saiote
  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.28, 22, 18), M.bodyMetal, [0, 0, 0], [0, 0, 0], [1.22, 0.82, 0.90]);

  const skirtGroup = group(pelvis, 0, -0.02, 0);
  const innerSkirtGeo = new T.CylinderGeometry(0.30, 0.52, 0.56, 36, 10, true);
  const skPos = innerSkirtGeo.attributes.position;
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.28 - y) / 0.56));
    const pleat = Math.sin(angle * 16) * 0.022 * (0.25 + normY * 0.85);
    const r = Math.sqrt(x * x + z * z) + pleat;
    skPos.setXYZ(i, Math.cos(angle) * r * 1.16, y, Math.sin(angle) * r * 0.88);
  }
  innerSkirtGeo.computeVertexNormals();
  const innerSkirt = new T.Mesh(innerSkirtGeo, M.skirtCloth);
  innerSkirt.position.set(0, -0.24, 0);
  innerSkirt.castShadow = true;
  innerSkirt.receiveShadow = true;
  skirtGroup.add(innerSkirt);

  const strapCount = 14;
  for (let i = 0; i < strapCount; i++) {
    const a = (i / strapCount) * Math.PI * 2;
    const sinA = Math.sin(a), cosA = Math.cos(a);

    const longStrap = sculpt(
      skirtGroup,
      new T.BoxGeometry(0.105, 0.48, 0.026),
      M.bodyMetal,
      [sinA * 0.35, -0.23, cosA * 0.275],
      [cosA * 0.22, a, -sinA * 0.22]
    );
    sculpt(longStrap, new T.BoxGeometry(0.024, 0.42, 0.032), M.accentMetal, [0, 0, 0]);
    sculpt(longStrap, new T.SphereGeometry(0.022, 8, 8), M.accentMetal, [0, -0.19, 0.016]);

    const shortStrap = sculpt(
      skirtGroup,
      new T.BoxGeometry(0.115, 0.22, 0.030),
      M.accentMetal,
      [sinA * 0.355, -0.10, cosA * 0.282],
      [cosA * 0.24, a, -sinA * 0.24]
    );
    sculpt(shortStrap, new T.BoxGeometry(0.085, 0.16, 0.034), M.bodyMetal, [0, 0.01, 0]);
  }

  const frontApron = sculpt(skirtGroup, new T.BoxGeometry(0.18, 0.50, 0.034), M.accentMetal, [0, -0.24, 0.285], [-0.18, 0, 0]);
  sculpt(frontApron, new T.BoxGeometry(0.13, 0.44, 0.038), M.skirtCloth, [0, 0, 0.002]);
  sculpt(frontApron, new T.OctahedronGeometry(0.036, 0), M.accentMetal, [0, -0.16, 0.022]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.19, -0.05, 0);

    sculpt(hip, new T.CylinderGeometry(0.175, 0.132, 0.48, 20), M.bodyMetal, [0, -0.23, 0], [0, 0, 0], [1.08, 1, 1.12]);
    sculpt(hip, new T.SphereGeometry(0.115, 16, 16), M.darkJoint, [0, -0.48, 0]);

    const knee = group(hip, 0, -0.49, 0);
    sculpt(knee, new T.CylinderGeometry(0.125, 0.088, 0.45, 18), M.bodyMetal, [0, -0.22, 0.01], [0, 0, 0], [1.06, 1, 1.12]);
    sculpt(knee, new T.ConeGeometry(0.072, 0.16, 5), M.accentMetal, [0, -0.02, 0.115], [0.18, 0, 0], [1.15, 1, 0.45]);
    sculpt(knee, new T.TorusGeometry(0.105, 0.016, 8, 22), M.accentMetal, [0, -0.34, 0.01], [Math.PI / 2, 0, 0]);

    const ankle = group(knee, 0, -0.45, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.145, 0.085, 0.28), M.bodyMetal, [0, -0.03, 0.045]);
    sculpt(ankle, new T.BoxGeometry(0.155, 0.026, 0.295), M.accentMetal, [0, -0.068, 0.045]);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.18, -0.12, -0.08);
  legs.L.knee.rotation.set(0.24, 0, 0);
  legs.R.hip.rotation.set(0.15, 0.14, 0.10);
  legs.R.knee.rotation.set(0.20, 0, 0);

  // Torso
  const torso = group(body, 0, 1.32, 0);
  const torsoPts = [
    new T.Vector2(0.01, -0.44),
    new T.Vector2(0.30, -0.40),
    new T.Vector2(0.28, -0.18),
    new T.Vector2(0.36, 0.05),
    new T.Vector2(0.48, 0.28),
    new T.Vector2(0.42, 0.44),
    new T.Vector2(0.18, 0.51),
    new T.Vector2(0.01, 0.52)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.bodyMetal, [0, 0, 0], [0, 0, 0], [1.22, 1.04, 0.80]);

  const pecGeo = new T.SphereGeometry(0.24, 22, 22);
  sculpt(torso, pecGeo, M.bodyMetal, [-0.22, 0.23, 0.20], [0.12, -0.22, -0.14], [1.10, 0.88, 0.56]);
  sculpt(torso, pecGeo, M.bodyMetal, [0.22, 0.23, 0.20], [0.12, 0.22, 0.14], [1.10, 0.88, 0.56]);

  const abGeo = new T.SphereGeometry(0.10, 14, 14);
  [0.03, -0.09, -0.21].forEach(ay => {
    sculpt(torso, abGeo, M.bodyMetal, [-0.09, ay, 0.265], [0, 0, 0], [1.05, 0.78, 0.48]);
    sculpt(torso, abGeo, M.bodyMetal, [0.09, ay, 0.265], [0, 0, 0], [1.05, 0.78, 0.48]);
  });

  const chestBolt = group(torso, 0, 0.20, 0.305);
  sculpt(chestBolt, new T.ConeGeometry(0.044, 0.16, 4), M.accentMetal, [-0.018, 0.065, 0], [0, 0, -0.34], [1, 1, 0.38]);
  sculpt(chestBolt, new T.BoxGeometry(0.075, 0.026, 0.028), M.accentMetal, [0, 0.005, 0], [0, 0, -0.15]);
  sculpt(chestBolt, new T.ConeGeometry(0.044, 0.17, 4), M.accentMetal, [0.020, -0.065, 0], [0, 0, Math.PI - 0.34], [1, 1, 0.38]);

  const belt = new T.TorusGeometry(0.32, 0.036, 10, 32);
  belt.rotateX(Math.PI / 2);
  sculpt(torso, belt, M.accentMetal, [0, -0.38, 0.01], [0.04, 0, 0], [1.18, 1, 0.86]);
  sculpt(torso, new T.BoxGeometry(0.15, 0.12, 0.04), M.accentMetal, [0, -0.38, 0.29]);

  const gorget = new T.TorusGeometry(0.24, 0.032, 10, 32);
  gorget.rotateX(Math.PI / 2);
  sculpt(torso, gorget, M.accentMetal, [0, 0.44, 0.01], [0.16, 0, 0], [1.18, 1, 0.92]);

  // Capa Real
  const cloakGroup = group(torso, 0, 0.42, -0.22);
  for (const side of [-1, 1]) {
    sculpt(cloakGroup, new T.CylinderGeometry(0.055, 0.055, 0.03, 14), M.accentMetal, [side * 0.32, 0.02, 0.06], [0.3, 0, side * -0.3]);
  }
  const capeGeo = new T.PlaneGeometry(1.48, 1.85, 22, 26);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.925 - y) / 1.85));
    const archZ = -0.04 - Math.cos((x / 0.74) * Math.PI * 0.5) * 0.08;
    const z = archZ - normY * 0.36;
    const fx = x * (0.58 + normY * 0.68);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const royalCape = sculpt(cloakGroup, capeGeo, M.cloakMat, [0, -0.92, -0.04]);
  tier3Parts.push(cloakGroup);

  // Cabeça & Elmo
  sculpt(torso, new T.CylinderGeometry(0.145, 0.175, 0.24, 20), M.darkJoint, [0, 0.54, -0.005], [0.05, 0, 0]);

  const head = group(torso, 0, 0.76, 0.025);
  sculpt(head, new T.SphereGeometry(0.185, 24, 24), M.darkJoint, [0, 0, 0], [0, 0, 0], [0.94, 1.15, 1.0]);

  for (const side of [-1, 1]) {
    const eyePivot = group(head, side * 0.062, 0.034, 0.182);
    eyePivot.rotation.set(0, side * 0.22, side * -0.10);
    sculpt(eyePivot, new T.SphereGeometry(0.024, 14, 12), M.soberEyeMat, [0, 0, 0], [0, 0, 0], [1.35, 0.68, 0.65]);
    sculpt(eyePivot, new T.SphereGeometry(0.013, 10, 10), M.soberPupilMat, [0, -0.001, 0.011], [0, 0, 0], [1.0, 0.9, 0.6]);
    sculpt(eyePivot, new T.BoxGeometry(0.064, 0.012, 0.024), M.bodyMetal, [0, 0.014, 0.006], [0.1, 0, side * -0.08]);
  }

  const helm = group(head, 0, 0.02, 0);
  sculpt(helm, new T.SphereGeometry(0.215, 28, 22, 0, Math.PI * 2, 0, Math.PI * 0.58), M.bodyMetal, [0, 0.03, 0], [-0.06, 0, 0], [0.98, 1.12, 1.06]);
  sculpt(helm, new T.BoxGeometry(0.034, 0.14, 0.042), M.accentMetal, [0, 0.02, 0.215], [-0.05, 0, 0]);
  for (const side of [-1, 1]) {
    const cheek = group(helm, side * 0.145, -0.055, 0.115);
    cheek.rotation.set(0.06, side * 0.42, side * -0.08);
    sculpt(cheek, new T.BoxGeometry(0.035, 0.18, 0.14), M.bodyMetal);
    sculpt(cheek, new T.BoxGeometry(0.038, 0.024, 0.145), M.accentMetal, [0, -0.08, 0]);
  }
  sculpt(helm, new T.CylinderGeometry(0.205, 0.235, 0.16, 22, 1, true, Math.PI * 0.62, Math.PI * 0.76), M.bodyMetal, [0, -0.07, -0.015], [0.12, 0, 0]);

  const crestMount = group(helm, 0, 0.25, -0.01);
  sculpt(crestMount, new T.BoxGeometry(0.052, 0.12, 0.36), M.accentMetal, [0, 0.01, -0.01], [-0.10, 0, 0]);
  const crestSegments = [];
  const crestCount = 26;
  for (let i = 0; i < crestCount; i++) {
    const t = i / (crestCount - 1);
    const ang = -0.62 + t * 2.75;
    const r = 0.31;
    const cy = Math.cos(ang) * r * 0.95 + 0.01;
    const cz = Math.sin(ang) * r * 1.18 - 0.03;
    const plumeH = 0.22 + Math.sin(t * Math.PI) * 0.08;
    const seg = sculpt(
      crestMount,
      new T.BoxGeometry(0.038, plumeH, 0.042),
      M.crestMat,
      [0, cy, cz],
      [ang, 0, 0]
    );
    crestSegments.push({ mesh: seg, phase: i * 0.38, factor: 0.3 + t * 0.9 });
  }

  // Braços
  function createColossusArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.50, 0.34, -0.008);

    sculpt(arm, new T.SphereGeometry(0.19, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), M.bodyMetal, [s * 0.02, 0.04, 0], [0, 0, s * -0.32], [1.14, 0.80, 1.18]);
    const pauldronT2 = sculpt(arm, new T.SphereGeometry(0.215, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.44), M.accentMetal, [s * 0.025, 0.075, 0], [0, 0, s * -0.36], [1.16, 0.76, 1.20]);
    tier2Parts.push(pauldronT2);

    sculpt(arm, new T.SphereGeometry(0.155, 18, 18), M.bodyMetal, [0, -0.01, 0]);
    sculpt(arm, new T.CapsuleGeometry(0.108, 0.28, 12, 16), M.bodyMetal, [s * 0.024, -0.18, 0], [0, 0, s * 0.07]);

    const elbow = group(arm, s * 0.045, -0.36, 0);
    sculpt(elbow, new T.SphereGeometry(0.095, 14, 14), M.darkJoint, [0, 0, 0]);
    sculpt(elbow, new T.CylinderGeometry(0.102, 0.076, 0.33, 18), M.bodyMetal, [0, -0.16, 0]);
    sculpt(elbow, new T.TorusGeometry(0.096, 0.016, 8, 22), M.accentMetal, [0, -0.08, 0], [Math.PI / 2, 0, 0]);
    sculpt(elbow, new T.TorusGeometry(0.080, 0.016, 8, 22), M.accentMetal, [0, -0.27, 0], [Math.PI / 2, 0, 0]);

    const hand = group(elbow, 0, -0.34, 0);
    sculpt(hand, new T.BoxGeometry(0.095, 0.105, 0.065), M.accentMetal, [0, -0.02, 0]);

    return { arm, elbow, hand };
  }

  const rightArm = createColossusArm(true);
  const leftArm = createColossusArm(false);

  // Espada Grande
  const greatsword = group(rightArm.hand, 0, -0.04, 0.03);
  greatsword.rotation.set(Math.PI / 2, 0, 0);

  sculpt(greatsword, new T.SphereGeometry(0.048, 12, 12), M.accentMetal, [0, -0.32, 0]);
  sculpt(greatsword, new T.CylinderGeometry(0.026, 0.030, 0.38, 12), M.darkJoint, [0, -0.12, 0]);
  sculpt(greatsword, new T.BoxGeometry(0.42, 0.065, 0.085), M.accentMetal, [0, 0.08, 0]);
  for (const side of [-1, 1]) {
    sculpt(greatsword, new T.ConeGeometry(0.045, 0.12, 6), M.accentMetal, [side * 0.22, 0.08, 0], [0, 0, side * -Math.PI / 2]);
  }

  const bladeLen = 1.95;
  const bladeGroup = group(greatsword, 0, 0.11, 0);
  sculpt(bladeGroup, new T.BoxGeometry(0.16, bladeLen * 0.78, 0.028), M.bladeMetal, [0, bladeLen * 0.39, 0]);

  const fullerMat = new T.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0x38bdf8,
    emissiveIntensity: 0.4,
    roughness: 0.1
  });
  sculpt(bladeGroup, new T.BoxGeometry(0.035, bladeLen * 0.72, 0.034), fullerMat, [0, bladeLen * 0.38, 0]);
  sculpt(bladeGroup, new T.ConeGeometry(0.114, bladeLen * 0.24, 4), M.bladeMetal, [0, bladeLen * 0.89, 0], [0, Math.PI / 4, 0], [1.0, 1.0, 0.25]);

  const slashTrail = new T.Mesh(
    new T.RingGeometry(1.1, 2.35, 32, 1, -0.4, 1.5),
    new T.MeshBasicMaterial({
      color: 0xfef08a,
      transparent: true,
      opacity: 0.0,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  slashTrail.rotation.y = Math.PI / 2;
  slashTrail.position.set(0, 1.05, 0.35);
  greatsword.add(slashTrail);

  const swordTipAnchor = group(bladeGroup, 0, bladeLen, 0);

  const auraRing = new T.Mesh(
    new T.RingGeometry(0.85, 1.15, 48),
    new T.MeshBasicMaterial({
      color: spec0.auraHex,
      transparent: true,
      opacity: 0.32,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  auraRing.rotation.x = -Math.PI / 2;
  auraRing.position.y = 0.025;
  root.add(auraRing);

  function setTier(tier) {
    const next = COLOSSUS_TIERS[tier] || COLOSSUS_TIERS[1];
    M.bodyMetal.color.setHex(next.metalHex);
    M.bodyMetal.metalness = next.metalness;
    M.bodyMetal.roughness = next.roughness;

    M.accentMetal.color.setHex(next.accentHex);
    M.bladeMetal.color.setHex(next.bladeHex);
    M.crestMat.color.setHex(next.crestHex);

    fullerMat.emissive.setHex(next.eyeHex);
    fullerMat.emissiveIntensity = tier === 3 ? 2.2 : (tier === 2 ? 1.1 : 0.3);
    auraRing.material.color.setHex(next.auraHex);
    slashTrail.material.color.setHex(next.eyeHex);

    tier2Parts.forEach(p => { p.visible = tier >= 2; });
    tier3Parts.forEach(p => { p.visible = tier >= 3; });
  }

  setTier(initialTier);

  return {
    root,
    body,
    torso,
    head,
    legs,
    rightArm,
    leftArm,
    greatsword,
    slashTrail,
    swordTipAnchor,
    auraRing,
    crestSegments,
    royalCape,
    capeBase,
    colossusScale,
    setTier
  };
}

const PART_N = 80;
const partPos = new Float32Array(PART_N * 3).fill(-100);
const partVel = new Float32Array(PART_N * 3);
const partLife = new Float32Array(PART_N);
let partIdx = 0;

const partGeo = new T.BufferGeometry();
partGeo.setAttribute('position', new T.BufferAttribute(partPos, 3));
const partMat = new T.PointsMaterial({
  color: 0xfacc15,
  size: 0.15,
  transparent: true,
  opacity: 0.95,
  blending: T.AdditiveBlending,
  depthWrite: false
});
scene.add(new T.Points(partGeo, partMat));

function spawnParticles(pos, colorHex, count = 18, upwardHeal = false) {
  partMat.color.setHex(colorHex);
  for (let k = 0; k < count; k++) {
    const i = partIdx;
    partIdx = (partIdx + 1) % PART_N;
    partPos[i * 3] = pos.x + (Math.random() - 0.5) * 0.4;
    partPos[i * 3 + 1] = pos.y + (Math.random() - 0.5) * 0.4;
    partPos[i * 3 + 2] = pos.z + (Math.random() - 0.5) * 0.4;

    if (upwardHeal) {
      partVel[i * 3] = -pos.x * 1.4 + (Math.random() - 0.5) * 0.8;
      partVel[i * 3 + 1] = 1.8 + Math.random() * 2.2;
      partVel[i * 3 + 2] = -pos.z * 1.4 + (Math.random() - 0.5) * 0.8;
    } else {
      partVel[i * 3] = (Math.random() - 0.5) * 5.2;
      partVel[i * 3 + 1] = 1.2 + Math.random() * 4.5;
      partVel[i * 3 + 2] = (Math.random() - 0.5) * 5.2;
    }
    partLife[i] = 0.35 + Math.random() * 0.25;
  }
  impactLight.color.setHex(colorHex);
  impactLight.position.copy(pos);
  impactLight.intensity = 9.0;
}

function updateParticles(dt) {
  for (let i = 0; i < PART_N; i++) {
    if (partLife[i] <= 0) continue;
    partLife[i] -= dt;
    partPos[i * 3] += partVel[i * 3] * dt;
    partPos[i * 3 + 1] += partVel[i * 3 + 1] * dt;
    partPos[i * 3 + 2] += partVel[i * 3 + 2] * dt;
    if (partLife[i] <= 0) partPos[i * 3 + 1] = -100;
  }
  partGeo.attributes.position.needsUpdate = true;
}

}

  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.15, 0.95);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.006, 2.5, 16.5);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.018, 2.5, 16.5);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new T.Clock();
let elapsed = 0;
let attackTimer = 0;
let slashSparkDone = false;
let lastStepSign = 1;
const tmpV = new T.Vector3();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  let cy = 0;
  let yaw = Math.sin(elapsed * 0.35) * 0.10;
  let pitch = 0.02;
  let roll = 0;
  let torsoYaw = 0;
  const heavyBreath = Math.sin(elapsed * 1.8) * 0.025;

  colossus.slashTrail.material.opacity = 0;

  if (action === 'marcha') {
    const a = elapsed * 0.65;
    const R = 3.1;
    cx = Math.cos(a) * R;
    cz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.08;
    roll = -0.05;

    const stride = elapsed * 3.8;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    cy = Math.abs(cosS) * 0.08;
    torsoYaw = sinS * 0.12;

    const stepSign = Math.sign(sinS);
    if (stepSign !== lastStepSign && Math.abs(sinS) > 0.85) {
      lastStepSign = stepSign;
      spawnShockWave(cx, cz, COLOSSUS_TIERS[currentTier].auraHex, 2.8);
    }

    colossus.legs.L.hip.rotation.x = -0.15 + sinS * 0.42;
    colossus.legs.L.knee.rotation.x = 0.22 + Math.max(0, -cosS) * 0.42;
    colossus.legs.R.hip.rotation.x = -0.15 - sinS * 0.42;
    colossus.legs.R.knee.rotation.x = 0.22 + Math.max(0, cosS) * 0.42;

    colossus.rightArm.arm.rotation.set(-0.45 - sinS * 0.22, 0.15, 0.32);
    colossus.rightArm.elbow.rotation.set(-0.48, 0.1, 0.1);
    colossus.leftArm.arm.rotation.set(-0.25 + sinS * 0.28, -0.15, -0.28);
    colossus.leftArm.elbow.rotation.set(-0.35, -0.1, -0.1);
  } else if (action === 'ataque') {
    const prevAtk = attackTimer;
    attackTimer = (attackTimer + dt * 0.95) % 1.0;
    if (attackTimer < prevAtk) slashSparkDone = false;

    if (attackTimer < 0.38) {
      const p = attackTimer / 0.38;
      const ease = p * p;
      torsoYaw = -0.42 * ease;
      pitch = -0.12 * ease;
      cz = -0.22 * ease;

      colossus.rightArm.arm.rotation.set(-2.35 * ease - 0.35 * (1 - ease), 0.18, 0.35);
      colossus.rightArm.elbow.rotation.set(-0.85 * ease - 0.45 * (1 - ease), 0, 0);
      colossus.leftArm.arm.rotation.set(-1.65 * ease, -0.45 * ease, -0.25);
      colossus.leftArm.elbow.rotation.set(-0.65 * ease, 0, 0);
    } else if (attackTimer < 0.65) {
      const p = (attackTimer - 0.38) / 0.27;
      const slam = Math.sin(p * Math.PI * 0.5);
      torsoYaw = -0.42 + 0.85 * slam;
      pitch = -0.12 + 0.32 * slam;
      cz = -0.22 + 0.72 * slam;
      cy = -0.10 * slam;

      colossus.rightArm.arm.rotation.set(-2.35 + 1.85 * slam, 0.12, 0.22);
      colossus.rightArm.elbow.rotation.set(-0.85 + 0.65 * slam, 0, 0);
      colossus.leftArm.arm.rotation.set(-1.65 + 1.25 * slam, -0.25, -0.35);
      colossus.leftArm.elbow.rotation.set(-0.65 + 0.35 * slam, 0, 0);

      colossus.slashTrail.material.opacity = Math.sin(p * Math.PI) * 0.85;

      if (slam > 0.88 && !slashSparkDone) {
        slashSparkDone = true;
        colossus.root.updateMatrixWorld(true);
        colossus.swordTipAnchor.getWorldPosition(tmpV);
        const hex = COLOSSUS_TIERS[currentTier].auraHex;
        spawnParticles(tmpV, hex, 26, false);
        spawnShockWave(tmpV.x, tmpV.z, hex, 4.4);
      }
    } else {
      const k = (attackTimer - 0.65) / 0.35;
      const rem = 1 - k;
      torsoYaw = 0.43 * rem;
      pitch = 0.20 * rem;
      cz = 0.50 * rem;
      cy = -0.10 * rem;

      colossus.rightArm.arm.rotation.set(-0.50 * rem - 0.35 * k, 0.15, 0.28);
      colossus.rightArm.elbow.rotation.set(-0.20 * rem - 0.45 * k, 0, 0);
      colossus.leftArm.arm.rotation.set(-0.40 * rem - 0.22 * k, -0.15, -0.28);
      colossus.leftArm.elbow.rotation.set(-0.30, 0, 0);
    }
  } else if (action === 'devorar') {
    const chew = Math.sin(elapsed * 4.5);
    pitch = 0.26 + chew * 0.06;
    torsoYaw = -0.18;

    colossus.leftArm.arm.rotation.set(-1.25 + chew * 0.12, -0.22, -0.18);
    colossus.leftArm.elbow.rotation.set(-0.35 - chew * 0.25, 0, 0);
    colossus.rightArm.arm.rotation.set(-0.32, 0.18, 0.32);
    colossus.rightArm.elbow.rotation.set(-0.48, 0, 0);

    const treeCycle = (elapsed * 0.35) % 1.0;
    const treeScale = Math.max(0.25, 1.0 - treeCycle * 0.75);
    sacredTree.scale.setScalar(treeScale);

    if (Math.random() < 0.35) {
      spawnParticles(new T.Vector3(0.55, 1.85, 1.75), 0x10b981, 4, true);
    }
  } else {
    colossus.rightArm.arm.rotation.set(-0.35, 0.15, 0.28 + Math.sin(elapsed * 1.4) * 0.02);
    colossus.rightArm.elbow.rotation.set(-0.45, 0.08, 0.08);
    colossus.leftArm.arm.rotation.set(-0.22, -0.14, -0.28 - Math.cos(elapsed * 1.4) * 0.02);
    colossus.leftArm.elbow.rotation.set(-0.32, -0.08, -0.08);

    colossus.legs.L.hip.rotation.set(-0.18, -0.12, -0.08);
    colossus.legs.L.knee.rotation.set(0.24, 0, 0);
    colossus.legs.R.hip.rotation.set(0.15, 0.14, 0.10);
    colossus.legs.R.knee.rotation.set(0.20, 0, 0);
  }

  colossus.root.position.set(cx, cy, cz);
  colossus.root.rotation.set(0, yaw, 0);
  colossus.body.position.y = 1.06 * colossus.colossusScale + heavyBreath;
  colossus.body.rotation.set(pitch, torsoYaw, roll);

  const wind = (action === 'marcha' || action === 'ataque') ? 2.0 : 1.0;
  for (const cs of colossus.crestSegments) {
    cs.mesh.position.x = Math.sin(elapsed * 3.0 * wind - cs.phase) * 0.015 * cs.factor;
  }
  if (colossus.royalCape.parent.visible) {
    const cAttr = colossus.royalCape.geometry.attributes.position;
    for (let i = 0; i < cAttr.count; i++) {
      const bx = colossus.capeBase[i * 3];
      const by = colossus.capeBase[i * 3 + 1];
      const bz = colossus.capeBase[i * 3 + 2];
      const normY = Math.max(0, Math.min(1, (0.925 - by) / 1.85));
      const wave = Math.sin(elapsed * 2.8 * wind - normY * 4.2 + bx * 2.2) * 0.11 * normY;
      cAttr.setXYZ(i, bx, by, bz + wave);
    }
    cAttr.needsUpdate = true;
    colossus.royalCape.geometry.computeVertexNormals();
  }

  colossus.auraRing.rotation.z += dt * 0.45;
  colossus.auraRing.scale.setScalar(1 + Math.sin(elapsed * 3) * 0.05);

  for (let i = shockWaves.length - 1; i >= 0; i--) {
    const sw = shockWaves[i];
    sw.life -= dt;
    const k = Math.max(0, sw.life / sw.max);
    sw.mesh.scale.setScalar(1 + (1 - k) * sw.maxScale);
    sw.mesh.material.opacity = 0.92 * k;
    if (sw.life <= 0) {
      scene.remove(sw.mesh);
      sw.mesh.geometry.dispose();
      sw.mesh.material.dispose();
      shockWaves.splice(i, 1);
    }
  }

  impactLight.intensity = Math.max(0, impactLight.intensity - dt * 20);
  updateParticles(dt);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusClose && action !== 'marcha') camAngle += dt * 0.05;

  const desiredTarget = focusClose
    ? new T.Vector3(cx, 3.25 + cy + heavyBreath, cz)
    : new T.Vector3(0, 2.25, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

function startApp() {
  animate();
}

if (document.readyState === 'complete') {
  startApp();
} else {
  window.addEventListener('load', startApp);
}
</script>
</body>
</html>
