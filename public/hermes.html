<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hermes - Mensageiro dos Deuses | Age of Mythology: Olympus 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #facc15;
      --turquoise: #2dd4bf;
      --sky-gold: #fde047;
      --glass: rgba(12, 26, 42, 0.78);
      --border: rgba(45, 212, 191, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c1f38;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f0fdfa;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #fde047;
      transform: translateY(-1px);
      background: rgba(20, 44, 68, 0.92);
    }
    button.on {
      background: linear-gradient(135deg, #fde047 0%, #2dd4bf 100%);
      color: #071926;
      border-color: #fef9c3;
      box-shadow: 0 0 22px rgba(45, 212, 191, 0.55);
    }
    button.cam-btn {
      border-color: rgba(250, 204, 21, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #b45309 100%);
      color: #ffffff;
      border-color: #fef08a;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.5);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fde047;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 920px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 24, 38, 0.76);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 7px 16px;
      border-radius: 999px;
      color: #fef9c3;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="flutuar" class="on">Flutuar</button>
    <button data-m="velocidade">Velocidade Divina</button>
    <button data-m="rajada">Rajada de Vento</button>
    <button data-m="relampago">Passo Relâmpago</button>
    <button id="btn-focus" class="cam-btn">Focar Rosto / Corpo</button>
  </div>
</div>

<div id="badge">Olympus • Hermes</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (PELE ATLÉTICA, CHITON, PENAS E ROSA DOS VENTOS)
   ========================================================================== */
function createProceduralTextures() {
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5500; i++) {
    const v = 123 + Math.floor(Math.random() * 12);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  const chitonCanvas = document.createElement('canvas');
  chitonCanvas.width = 512;
  chitonCanvas.height = 256;
  const cCtx = chitonCanvas.getContext('2d');
  const grad = cCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#fffbeb');
  grad.addColorStop(0.68, '#fef3c7');
  grad.addColorStop(1, '#e0f2fe');
  cCtx.fillStyle = grad;
  cCtx.fillRect(0, 0, 512, 256);

  cCtx.fillStyle = 'rgba(14, 116, 144, 0.08)';
  for (let x = 0; x < 512; x += 10) cCtx.fillRect(x, 0, 3, 256);

  cCtx.fillStyle = '#0d9488';
  cCtx.fillRect(0, 196, 512, 42);
  cCtx.fillStyle = '#facc15';
  cCtx.fillRect(0, 192, 512, 5);
  cCtx.fillRect(0, 238, 512, 5);

  cCtx.strokeStyle = '#fef08a';
  cCtx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    cCtx.beginPath();
    cCtx.moveTo(x + 4, 229);
    cCtx.lineTo(x + 4, 205);
    cCtx.lineTo(x + 24, 205);
    cCtx.lineTo(x + 24, 223);
    cCtx.lineTo(x + 12, 223);
    cCtx.lineTo(x + 12, 213);
    cCtx.lineTo(x + 18, 213);
    cCtx.stroke();
  }
  const chitonTex = new T.CanvasTexture(chitonCanvas);
  chitonTex.wrapS = chitonTex.wrapT = T.RepeatWrapping;

  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  fCtx.fillStyle = '#f8fafc';
  fCtx.fillRect(0, 0, 1024, 1024);

  fCtx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
  fCtx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    fCtx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    fCtx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      fCtx.lineTo(mx, my);
    }
    fCtx.stroke();
  }

  const cx = 512, cy = 512;
  fCtx.strokeStyle = '#0f766e';
  fCtx.lineWidth = 14;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 430, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 7;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 444, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 416, 0, Math.PI * 2);
  fCtx.stroke();

  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const isCardinal = i % 4 === 0;
    const isOrdinal = i % 2 === 0 && !isCardinal;
    const outerR = isCardinal ? 360 : (isOrdinal ? 280 : 210);
    const halfW = isCardinal ? 0.14 : 0.10;

    fCtx.fillStyle = isCardinal ? '#eab308' : (isOrdinal ? '#0d9488' : '#38bdf8');
    fCtx.beginPath();
    fCtx.moveTo(cx, cy);
    fCtx.lineTo(cx + Math.cos(a - halfW) * 85, cy + Math.sin(a - halfW) * 85);
    fCtx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
    fCtx.lineTo(cx + Math.cos(a + halfW) * 85, cy + Math.sin(a + halfW) * 85);
    fCtx.closePath();
    fCtx.fill();
    fCtx.strokeStyle = '#fef08a';
    fCtx.lineWidth = 2.5;
    fCtx.stroke();
  }

  fCtx.fillStyle = '#facc15';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 54, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = '#0f766e';
  fCtx.lineWidth = 6;
  fCtx.stroke();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, chitonTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA ANATÔMICA E MATERIAIS
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xd69b6e,
      roughness: 0.38,
      metalness: 0.06,
      bumpMap: textures.skinBump,
      bumpScale: 0.003
    }),
    skinShade: new T.MeshStandardMaterial({
      color: 0xc08256,
      roughness: 0.42,
      metalness: 0.06,
      bumpMap: textures.skinBump,
      bumpScale: 0.003
    }),
    hairGoldBrown: new T.MeshStandardMaterial({
      color: 0x92541e,
      emissive: 0x241102,
      emissiveIntensity: 0.15,
      roughness: 0.36,
      metalness: 0.15
    }),
    hairHighlight: new T.MeshStandardMaterial({
      color: 0xd99b38,
      emissive: 0x331d03,
      emissiveIntensity: 0.18,
      roughness: 0.32,
      metalness: 0.2
    }),
    goldPolished: new T.MeshStandardMaterial({
      color: 0xfacc15,
      emissive: 0x422006,
      emissiveIntensity: 0.24,
      metalness: 0.92,
      roughness: 0.18
    }),
    bronzeTraveler: new T.MeshStandardMaterial({
      color: 0xb45309,
      emissive: 0x291102,
      emissiveIntensity: 0.2,
      metalness: 0.86,
      roughness: 0.26
    }),
    leatherBelt: new T.MeshStandardMaterial({
      color: 0x5c2d16,
      roughness: 0.65,
      metalness: 0.1
    }),
    wingIvory: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfef9c3,
      emissiveIntensity: 0.22,
      roughness: 0.35,
      metalness: 0.12
    }),
    wingGoldTip: new T.MeshStandardMaterial({
      color: 0xfde047,
      emissive: 0x713f12,
      emissiveIntensity: 0.28,
      metalness: 0.88,
      roughness: 0.2
    }),
    turquoiseGem: new T.MeshStandardMaterial({
      color: 0x2dd4bf,
      emissive: 0x0d9488,
      emissiveIntensity: 2.6,
      roughness: 0.1,
      metalness: 0.3
    }),
    emeraldEye: new T.MeshStandardMaterial({
      color: 0x10b981,
      emissive: 0x059669,
      emissiveIntensity: 2.8,
      roughness: 0.08
    }),
    eyeGoldSky: new T.MeshStandardMaterial({
      color: 0xfef08a,
      emissive: 0x38bdf8,
      emissiveIntensity: 2.8,
      roughness: 0.08
    }),
    chiton: new T.MeshStandardMaterial({
      map: textures.chitonTex,
      color: 0xffffff,
      roughness: 0.52,
      metalness: 0.05,
      side: T.DoubleSide
    }),
    chlamysCloak: new T.MeshStandardMaterial({
      color: 0x0d9488,
      emissive: 0x042f2e,
      emissiveIntensity: 0.32,
      roughness: 0.46,
      metalness: 0.14,
      side: T.DoubleSide
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE HERMES + PÉTASO ALADO + TALARIA + CADUCEU (KERYKEION)
   ========================================================================== */
function buildWingPair(parent, matPrimary, matTip, scale = 1.0) {
  const pair = { left: null, right: null };
  for (const side of [-1, 1]) {
    const pivot = group(parent, side * 0.02, 0, 0);
    for (let f = 0; f < 5; f++) {
      const t = f / 4;
      const len = (0.28 - t * 0.09) * scale;
      const feather = sculpt(
        pivot,
        new T.ConeGeometry(0.022 * scale, len, 6),
        f < 2 ? matTip : matPrimary,
        [side * (len * 0.45), (0.04 - t * 0.045) * scale, -t * 0.03 * scale],
        [-0.25, side * -0.22, side * (-1.35 + t * 0.35)],
        [0.42, 1, 1]
      );
      feather.castShadow = true;
    }
    if (side === -1) pair.left = pivot;
    else pair.right = pivot;
  }
  return pair;
}

function buildHermes(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.12, 0);

  // A. Pelve e Pernas
  const pelvis = group(body, 0, 0.90, 0);
  sculpt(pelvis, new T.SphereGeometry(0.225, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.06, 0.76, 0.80]);

  const legs = {};
  const talariaWings = [];

  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.145, -0.04, 0);

    sculpt(hip, new T.CylinderGeometry(0.132, 0.092, 0.50, 20), M.skin, [0, -0.24, 0], [0, 0, 0], [1.0, 1, 1.06]);
    const quadGeo = new T.SphereGeometry(0.102, 16, 16);
    sculpt(hip, quadGeo, M.skin, [s * 0.018, -0.21, 0.046], [0, 0, 0], [0.94, 1.82, 0.86]);

    sculpt(hip, new T.SphereGeometry(0.082, 16, 16), M.skin, [0, -0.50, 0.014]);

    const knee = group(hip, 0, -0.51, 0);
    sculpt(knee, new T.CylinderGeometry(0.084, 0.050, 0.46, 18), M.skin, [0, -0.23, 0]);
    sculpt(knee, new T.SphereGeometry(0.08, 16, 16), M.skin, [0, -0.15, -0.035], [0, 0, 0], [0.96, 1.65, 0.95]);

    sculpt(knee, new T.CylinderGeometry(0.078, 0.054, 0.28, 16, 1, false, -0.8, 1.6), M.goldPolished, [0, -0.26, 0.008]);

    const ankle = group(knee, 0, -0.46, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.086, 0.046, 0.21), M.skin, [0, -0.02, 0.038], [0.26, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.094, 0.015, 0.224), M.goldPolished, [0, -0.044, 0.038], [0.26, 0, 0]);

    const strap = new T.TorusGeometry(0.056, 0.0055, 8, 20);
    strap.rotateX(Math.PI / 2);
    for (let k = 0; k < 3; k++) {
      sculpt(ankle, strap, k === 1 ? M.leatherBelt : M.goldPolished, [0, 0.02 + k * 0.042, -0.02], [0.12, 0, 0]);
    }

    const ankleWingsMount = group(ankle, 0, 0.05, -0.02);
    const wPair = buildWingPair(ankleWingsMount, M.wingIvory, M.wingGoldTip, 0.85);
    talariaWings.push(wPair);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.42, -0.06, -0.04);
  legs.L.knee.rotation.set(0.62, 0, 0);
  legs.R.hip.rotation.set(0.24, 0.06, 0.05);
  legs.R.knee.rotation.set(0.28, 0, 0);

  // B. Tronco
  const torso = group(body, 0, 1.32, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.43),
    new T.Vector2(0.23, -0.39),
    new T.Vector2(0.20, -0.19),
    new T.Vector2(0.25, 0.03),
    new T.Vector2(0.35, 0.26),
    new T.Vector2(0.31, 0.42),
    new T.Vector2(0.135, 0.49),
    new T.Vector2(0.01, 0.50)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.14, 1.02, 0.70]);

  const pecGeo = new T.SphereGeometry(0.195, 22, 22);
  sculpt(torso, pecGeo, M.skin, [-0.165, 0.22, 0.15], [0.12, -0.22, -0.14], [1.04, 0.85, 0.56]);
  sculpt(torso, pecGeo, M.skin, [0.165, 0.22, 0.15], [0.12, 0.22, 0.14], [1.04, 0.85, 0.56]);

  const abGeo = new T.SphereGeometry(0.078, 14, 14);
  [
    { y: 0.04, sx: 0.96, sy: 0.75, z: 0.192 },
    { y: -0.075, sx: 0.92, sy: 0.78, z: 0.188 },
    { y: -0.19, sx: 0.84, sy: 0.84, z: 0.178 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.064, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.46]);
    sculpt(torso, abGeo, M.skin, [0.064, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.46]);
  });

  const obliqueGeo = new T.CapsuleGeometry(0.07, 0.22, 10, 14);
  sculpt(torso, obliqueGeo, M.skin, [-0.22, -0.11, 0.078], [0.1, 0, -0.18], [0.85, 1, 0.85]);
  sculpt(torso, obliqueGeo, M.skin, [0.22, -0.11, 0.078], [0.1, 0, 0.18], [0.85, 1, 0.85]);

  const latGeo = new T.SphereGeometry(0.215, 18, 18);
  sculpt(torso, latGeo, M.skin, [-0.19, 0.17, -0.105], [0, 0, -0.25], [1.0, 1.32, 0.64]);
  sculpt(torso, latGeo, M.skin, [0.19, 0.17, -0.105], [0, 0, 0.25], [1.0, 1.32, 0.64]);

  sculpt(torso, new T.CylinderGeometry(0.11, 0.138, 0.25, 20), M.skin, [0, 0.52, -0.008], [0.07, 0, 0]);

  // C. Cabeça e Rosto
  const head = group(torso, 0, 0.73, 0.032);

  const skullGeo = new T.SphereGeometry(0.192, 38, 38);
  const sPos = skullGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    y *= 1.16;
    x *= 0.90;
    if (y < 0.02 && y > -0.08 && z > 0) { x *= 1.04; z *= 1.04; }
    if (y <= -0.08 && z > -0.02) {
      const taper = Math.max(0.68, 1.0 - ((-0.08 - y) / 0.14) * 0.30);
      x *= taper;
      z *= 1.05;
    }
    if (z < -0.11) z *= 0.93;
    sPos.setXYZ(i, x, y, z);
  }
  skullGeo.computeVertexNormals();
  sculpt(head, skullGeo, M.skin);

  const cheekGeo = new T.SphereGeometry(0.045, 16, 16);
  sculpt(head, cheekGeo, M.skin, [-0.068, -0.016, 0.15], [0, -0.3, 0], [1.1, 0.85, 0.65]);
  sculpt(head, cheekGeo, M.skin, [0.068, -0.016, 0.15], [0, 0.3, 0], [1.1, 0.85, 0.65]);

  sculpt(head, new T.BoxGeometry(0.022, 0.078, 0.042), M.skin, [0, 0.004, 0.184], [-0.14, 0, 0]);
  sculpt(head, new T.SphereGeometry(0.016, 14, 14), M.skin, [0, -0.034, 0.198], [0, 0, 0], [0.95, 0.82, 1.0]);

  const browGeo = new T.CapsuleGeometry(0.0085, 0.056, 8, 12);
  sculpt(head, browGeo, M.hairGoldBrown, [-0.052, 0.048, 0.178], [0.1, 0.25, 1.38]);
  sculpt(head, browGeo, M.hairGoldBrown, [0.052, 0.048, 0.178], [0.1, -0.25, -1.38]);

  const eyeGeo = new T.SphereGeometry(0.019, 16, 16);
  sculpt(head, eyeGeo, M.eyeGoldSky, [-0.052, 0.022, 0.172], [0, 0, 0], [1.15, 0.78, 0.8]);
  sculpt(head, eyeGeo, M.eyeGoldSky, [0.052, 0.022, 0.172], [0, 0, 0], [1.15, 0.78, 0.8]);

  const mouthCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.026, -0.076, 0.182),
    new T.Vector3(0, -0.082, 0.188),
    new T.Vector3(0.026, -0.076, 0.182)
  ]);
  sculpt(head, new T.TubeGeometry(mouthCurve, 10, 0.006, 6, false), M.skinShade);

  const hairCurls = [];
  sculpt(head, new T.SphereGeometry(0.198, 24, 24), M.hairGoldBrown, [0, 0.04, -0.02], [-0.08, 0, 0], [1.02, 1.02, 1.06]);

  for (let i = 0; i < 22; i++) {
    const ang = (i / 22) * Math.PI * 2;
    const isFront = Math.cos(ang) > 0.35;
    const rad = isFront ? 0.175 : 0.192;
    const cx = Math.sin(ang) * rad;
    const cz = Math.cos(ang) * rad - 0.01;
    const cy = isFront ? 0.072 : (0.02 - (i % 3) * 0.045);
    const curlSize = isFront ? 0.032 : (0.046 + (i % 2) * 0.012);

    const curl = sculpt(
      head,
      new T.SphereGeometry(curlSize, 12, 12),
      i % 3 === 0 ? M.hairHighlight : M.hairGoldBrown,
      [cx, cy, cz],
      [0.2, ang, 0],
      [1.0, 1.25, 0.9]
    );
    hairCurls.push({ mesh: curl, baseY: cy, phase: i * 0.55 });
  }

  // PÉTASO ALADO
  const petasos = group(head, 0, 0.118, -0.005);
  petasos.rotation.set(-0.14, 0, 0);

  const brimGeo = new T.CylinderGeometry(0.21, 0.34, 0.026, 36);
  sculpt(petasos, brimGeo, M.bronzeTraveler, [0, 0, 0], [0, 0, 0], [0.96, 1, 1.08]);

  const brimRim = new T.TorusGeometry(0.338, 0.009, 8, 40);
  brimRim.rotateX(Math.PI / 2);
  sculpt(petasos, brimRim, M.goldPolished, [0, -0.01, 0], [0, 0, 0], [0.96, 1, 1.08]);

  sculpt(
    petasos,
    new T.SphereGeometry(0.195, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.52),
    M.goldPolished,
    [0, 0.005, 0],
    [0, 0, 0],
    [0.95, 0.72, 1.04]
  );
  sculpt(petasos, new T.OctahedronGeometry(0.022, 0), M.turquoiseGem, [0, 0.045, 0.198], [0, 0, 0], [0.85, 1.3, 0.6]);

  const petasosWingMount = group(petasos, 0, 0.055, -0.01);
  const petasosWings = buildWingPair(petasosWingMount, M.wingIvory, M.wingGoldTip, 1.05);

  // D. Braços
  function createHermesArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.39, 0.33, -0.008);

    sculpt(arm, new T.SphereGeometry(0.125, 18, 18), M.skin, [0, 0, 0], [0, 0, s * -0.22], [1.04, 1.12, 1.04]);
    sculpt(arm, new T.CapsuleGeometry(0.08, 0.26, 12, 16), M.skin, [s * 0.02, -0.17, 0], [0, 0, s * 0.07]);
    sculpt(arm, new T.SphereGeometry(0.074, 14, 14), M.skin, [s * 0.015, -0.16, 0.038], [0, 0, s * 0.07], [0.92, 1.42, 0.92]);

    const elbow = group(arm, s * 0.038, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.074, 0.048, 0.31, 18), M.skin, [0, -0.15, 0]);

    const bracer = group(elbow, 0, -0.24, 0);
    sculpt(bracer, new T.CylinderGeometry(0.058, 0.052, 0.08, 24, 1, true), M.goldPolished);
    const bRing = new T.TorusGeometry(0.056, 0.005, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.bronzeTraveler, [0, 0.038, 0]);
    sculpt(bracer, bRing, M.bronzeTraveler, [0, -0.038, 0]);

    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.064, 0.074, 0.032), M.skin, [0, -0.018, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.009, 0.036, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.0155;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.058, 0.016], [isRight ? 1.2 : 0.35, 0, 0]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.035, -0.028, 0.02], [0.55, 0, -s * 0.6], [1.05, 0.9, 1.05]);

    return { arm, elbow, hand };
  }

  const rightArm = createHermesArm(true);
  const leftArm = createHermesArm(false);

  // E. CADUCEU (KERYKEION)
  const caduceus = new T.Group();
  rightArm.hand.add(caduceus);
  caduceus.position.set(0, -0.035, 0.032);

  sculpt(caduceus, new T.CylinderGeometry(0.02, 0.022, 2.35, 16), M.goldPolished, [0, 0.16, 0]);
  sculpt(caduceus, new T.ConeGeometry(0.032, 0.18, 8), M.bronzeTraveler, [0, -1.08, 0], [Math.PI, 0, 0]);

  const caduceusHead = group(caduceus, 0, 1.18, 0);
  const caduceusCrystal = sculpt(caduceusHead, new T.OctahedronGeometry(0.075, 1), M.turquoiseGem, [0, 0.24, 0], [0, 0, 0], [0.85, 1.35, 0.85]);

  const caduceusHalo = new T.Mesh(
    new T.TorusGeometry(0.125, 0.008, 8, 28),
    new T.MeshBasicMaterial({
      color: 0xfde047,
      transparent: true,
      opacity: 0.8,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  caduceusHalo.position.set(0, 0.24, 0);
  caduceusHead.add(caduceusHalo);

  const caduceusWingMount = group(caduceusHead, 0, 0.18, 0);
  const caduceusWings = buildWingPair(caduceusWingMount, M.wingIvory, M.wingGoldTip, 1.15);

  for (const side of [-1, 1]) {
    const snakePts = [];
    const turns = 2.5;
    for (let i = 0; i <= 32; i++) {
      const t = i / 32;
      const y = -0.45 + t * 0.62;
      const env = Math.sin(t * Math.PI * 0.85) * 0.085 + 0.025;
      const ang = t * Math.PI * 2 * turns + (side === 1 ? 0 : Math.PI);
      snakePts.push(new T.Vector3(Math.cos(ang) * env, y, Math.sin(ang) * env));
    }
    const snakeCurve = new T.CatmullRomCurve3(snakePts);
    sculpt(caduceusHead, new T.TubeGeometry(snakeCurve, 36, 0.015, 8, false), side === 1 ? M.goldPolished : M.bronzeTraveler);

    const sHead = group(caduceusHead, side * 0.085, 0.17, 0.02);
    sHead.rotation.set(0.2, side * -0.4, side * 0.55);
    sculpt(sHead, new T.ConeGeometry(0.022, 0.065, 8), M.goldPolished, [0, 0, 0], [Math.PI / 2, 0, 0], [1.1, 1, 0.65]);
    sculpt(sHead, new T.SphereGeometry(0.006, 8, 8), M.emeraldEye, [-0.011, 0.008, 0.012]);
    sculpt(sHead, new T.SphereGeometry(0.006, 8, 8), M.emeraldEye, [0.011, 0.008, 0.012]);
  }

  const caduceusAnchor = group(caduceusHead, 0, 0.34, 0);
  const caduceusGlow = new T.Mesh(
    new T.SphereGeometry(0.16, 12, 10),
    new T.MeshBasicMaterial({
      color: 0x2dd4bf,
      transparent: true,
      opacity: 0.72,
      blending: T.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  caduceusAnchor.add(caduceusGlow);

  // F. Vestimentas
  const garments = group(torso, 0, 0, 0);

  const sashCurve = new T.CatmullRomCurve3([
    new T.Vector3(-0.18, -0.36, 0.18),
    new T.Vector3(-0.22, 0.05, 0.20),
    new T.Vector3(-0.20, 0.40, 0.11),
    new T.Vector3(-0.18, 0.42, -0.11),
    new T.Vector3(-0.15, 0.05, -0.18),
    new T.Vector3(-0.12, -0.36, -0.15)
  ]);
  const sashGeo = new T.TubeGeometry(sashCurve, 28, 0.095, 12, false);
  sashGeo.scale(1.12, 1, 0.46);
  sculpt(garments, sashGeo, M.chiton);

  const fibula = group(garments, -0.22, 0.41, 0.12);
  fibula.rotation.set(-0.35, -0.25, 0);
  sculpt(fibula, new T.CylinderGeometry(0.048, 0.048, 0.016, 20), M.goldPolished, [0, 0, 0], [Math.PI / 2, 0, 0]);
  sculpt(fibula, new T.OctahedronGeometry(0.022, 0), M.turquoiseGem, [0, 0, 0.012]);

  const beltGeo = new T.TorusGeometry(0.245, 0.022, 10, 32);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.leatherBelt, [0, -0.34, 0.008], [0.05, 0, -0.03], [1.06, 1, 0.80]);
  sculpt(garments, new T.BoxGeometry(0.085, 0.068, 0.022), M.goldPolished, [0, -0.34, 0.205]);

  const skirtGeo = new T.CylinderGeometry(0.245, 0.44, 0.56, 44, 16, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.28 - y) / 0.56));
    const pleat = Math.sin(angle * 16) * 0.024 * (0.25 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.05;
    z = Math.sin(angle) * r * 0.82 - normY * 0.06;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.chiton, [0, -0.61, 0], [0.04, 0, 0]);

  const capeGeo = new T.PlaneGeometry(1.18, 1.32, 22, 26);
  const cPos = capeGeo.attributes.position;
  const capeBase = new Float32Array(cPos.array.length);
  for (let i = 0; i < cPos.count; i++) {
    const x = cPos.getX(i), y = cPos.getY(i);
    const normY = Math.max(0, Math.min(1, (0.66 - y) / 1.32));
    const archZ = -0.15 - Math.cos((x / 0.59) * Math.PI * 0.5) * 0.06;
    const z = archZ - normY * 0.45;
    const fx = x * (0.55 + normY * 0.72);
    cPos.setXYZ(i, fx, y, z);
    capeBase[i * 3] = fx;
    capeBase[i * 3 + 1] = y;
    capeBase[i * 3 + 2] = z;
  }
  capeGeo.computeVertexNormals();
  const cape = sculpt(garments, capeGeo, M.chlamysCloak, [-0.06, -0.22, -0.04], [0, -0.12, 0.08]);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    caduceus, caduceusCrystal, caduceusHalo, caduceusAnchor, caduceusGlow,
    petasosWings, talariaWings, caduceusWings,
    hairCurls,
    skirtMesh, skirtBase,
    cape, capeBase
  };
}

const skyGeo = new T.SphereGeometry(80, 32, 32);
const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x0c244a) },
    midColor: { value: new T.Color(0x0284c7) },
    horizonColor: { value: new T.Color(0xfde047) },
    sunDir: { value: new T.Vector3(0.55, 0.35, -0.75).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(horizonColor, midColor, smoothstep(0.42, 0.66, h));
      col = mix(col, topColor, smoothstep(0.66, 0.96, h));
      float sunGlow = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.92, 0.62) * pow(sunGlow, 9.0) * 0.48;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new T.Mesh(skyGeo, skyMat));

function createShadowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  gr.addColorStop(0, 'rgba(15, 23, 42, 0.38)');
  gr.addColorStop(1, 'rgba(15, 23, 42, 0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}

function spawnAfterimage(x, y, z, yaw, pitch, roll, colorHex = 0x2dd4bf) {
  const ghost = new T.Group();
  ghost.position.set(x, y, z);
  ghost.rotation.set(pitch, yaw, roll);

  const gMat = new T.MeshBasicMaterial({
    color: colorHex,
    transparent: true,
    opacity: 0.62,
    blending: T.AdditiveBlending,
    depthWrite: false
  });

  const torsoGhost = new T.Mesh(new T.CylinderGeometry(0.26, 0.16, 0.95, 12), gMat);
  torsoGhost.position.y = 1.45;
  const headGhost = new T.Mesh(new T.SphereGeometry(0.18, 12, 12), gMat);

  const brimGhost = new T.Mesh(new T.CylinderGeometry(0.22, 0.34, 0.03, 16), gMat);
  brimGhost.position.y = 2.22;

function spawnSonicRing(x, y, z, yaw = 0, horizontal = true, colorHex = 0xfde047) {
  const ring = new T.Mesh(
    new T.RingGeometry(0.25, 0.48, 36),
    new T.MeshBasicMaterial({
      color: colorHex,
      transparent: true,
      opacity: 0.9,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  if (horizontal) {
    ring.rotation.x = -Math.PI / 2;
  } else {
    ring.rotation.y = yaw;
  }
  ring.position.set(x, y, z);
  scene.add(ring);
  sonicRings.push({ mesh: ring, life: 0.65, max: 0.65, maxScale: horizontal ? 5.2 : 3.5 });
}

const windBlades = [];

function fireWindGust(yaw) {
  hermes.root.updateMatrixWorld(true);
  hermes.caduceusAnchor.getWorldPosition(tmpV);
  const start = tmpV.clone();

  const dirX = Math.sin(yaw);
  const dirZ = Math.cos(yaw);

  const gustGroup = new T.Group();
  gustGroup.position.copy(start);
  gustGroup.rotation.y = yaw;

  const crescent = new T.Mesh(
    new T.TorusGeometry(0.68, 0.055, 8, 28, Math.PI * 0.85),
    new T.MeshBasicMaterial({
      color: 0x5eead4,
      transparent: true,
      opacity: 0.92,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  crescent.rotation.set(Math.PI / 2, 0, -Math.PI * 0.425);

  const innerCrescent = new T.Mesh(
    new T.TorusGeometry(0.52, 0.035, 8, 24, Math.PI * 0.75),
    new T.MeshBasicMaterial({
      color: 0xfef08a,
      transparent: true,
      opacity: 0.95,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  innerCrescent.rotation.set(Math.PI / 2, 0, -Math.PI * 0.375);

  gustGroup.add(crescent, innerCrescent);
  scene.add(gustGroup);

  windBlades.push({
    mesh: gustGroup,
    vx: dirX * 14.5,
    vz: dirZ * 14.5,
    life: 0.75,
    max: 0.75
  });

  spawnSonicRing(start.x, start.y, start.z, yaw, false, 0x2dd4bf);
  flashLight.position.copy(start);
  flashLight.intensity = 7.5;
}

  { x: 0, z: 0, yaw: 0.2 },
  { x: 2.8, z: 1.8, yaw: -2.2 },
  { x: -2.9, z: 1.5, yaw: 2.1 },
  { x: 2.2, z: -2.5, yaw: -0.7 },
  { x: -2.4, z: -2.2, yaw: 0.8 }
];

let camAngle = 0.42;
let camPitch = 0.18;
let camDist = 8.4;
let targetCamDist = 8.4;
let currentLookAt = new T.Vector3(0, 1.9, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    gustTimer = 0.08;
    blinkTimer = 0.05;
    if (mode === 'flutuar' || mode === 'rajada') {
      hx = 0;
      hz = 0;
    }
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  targetCamDist = focusFace ? 2.6 : 8.4;
  if (focusFace) {
    camAngle = 0.22;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.25, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO
   ========================================================================== */
function update(dt, t) {
  let pitch = 0.06, roll = 0;
  const hoverY = Math.sin(t * 2.2) * 0.09;

  if (mode === 'velocidade') {
    const a = t * 2.65;
    const R = 3.15;
    hx = Math.cos(a) * R;
    hz = Math.sin(a) * R;
    hyaw = -a;
    pitch = 0.38;
    roll = -0.45;

    ghostTimer -= dt;
    if (ghostTimer <= 0) {
      ghostTimer = 0.045;
      spawnAfterimage(hx, hoverY, hz, hyaw, pitch, roll, 0x2dd4bf);
    }
  } else if (mode === 'relampago') {
    blinkTimer -= dt;
    if (blinkTimer <= 0) {
      blinkTimer = 0.68;

      spawnAfterimage(hx, hoverY, hz, hyaw, 0.25, 0, 0xfde047);
      spawnSonicRing(hx, 0.15, hz, 0, true, 0x2dd4bf);

      blinkIndex = (blinkIndex + 1) % blinkWaypoints.length;
      const wp = blinkWaypoints[blinkIndex];
      hx = wp.x;
      hz = wp.z;
      hyaw = wp.yaw;

      spawnSonicRing(hx, 0.15, hz, 0, true, 0xfde047);
      flashLight.position.set(hx, 1.5, hz);
      flashLight.intensity = 10.0;
    }
    pitch = 0.18;
  } else if (mode === 'rajada') {
    hx = Math.sin(t * 0.8) * 0.25;
    hz = Math.cos(t * 0.6) * 0.20;
    hyaw = Math.sin(t * 0.95) * 0.85;
    pitch = 0.12;

    gustTimer -= dt;
    if (gustTimer <= 0) {
      gustTimer = 0.42;
      fireWindGust(hyaw);
    }
  } else {
    hx = Math.sin(t * 0.7) * 0.22;
    hz = Math.cos(t * 0.55) * 0.18;
    hyaw = Math.sin(t * 0.45) * 0.22;
  }

  hermes.root.position.set(hx, 0, hz);
  hermes.root.rotation.set(0, hyaw, 0);
  hermes.body.position.y = 1.12 + hoverY;
  hermes.body.rotation.set(pitch, 0, roll);

  footWindGroup.position.set(hx, 0, hz);
  for (const sw of footSwirls) {
    sw.mesh.rotation.z += dt * sw.speed * (mode === 'velocidade' ? 2.2 : 1.0);
  }

  const runFreq = mode === 'velocidade' ? 8.0 : 2.2;
  hermes.legs.L.hip.rotation.x = -0.42 + Math.sin(t * runFreq) * 0.14;
  hermes.legs.L.knee.rotation.x = 0.62 + Math.cos(t * runFreq) * 0.12;
  hermes.legs.R.hip.rotation.x = 0.24 - Math.sin(t * runFreq) * 0.14;
  hermes.legs.R.knee.rotation.x = 0.28 - Math.cos(t * runFreq) * 0.12;

  if (mode === 'rajada') {
    hermes.rightArm.arm.rotation.set(-1.35, 0.15, 0.35);
    hermes.rightArm.elbow.rotation.set(-0.25, 0.1, 0.15);
    hermes.caduceus.rotation.set(0.35, 0, -0.15);
    hermes.leftArm.arm.rotation.set(0.45, -0.3, -0.85);
  } else if (mode === 'velocidade') {
    hermes.rightArm.arm.rotation.set(0.55, 0.2, 0.65);
    hermes.rightArm.elbow.rotation.set(-0.65, 0.15, 0.2);
    hermes.caduceus.rotation.set(1.1, 0.2, -0.3);
    hermes.leftArm.arm.rotation.set(0.62, -0.25, -0.78);
  } else {
    hermes.rightArm.arm.rotation.set(-0.28, 0.15, 0.72 + Math.sin(t * 2.0) * 0.04);
    hermes.rightArm.elbow.rotation.set(-0.68, 0.2, 0.25);
    hermes.caduceus.rotation.set(0.22, Math.sin(t * 1.8) * 0.15, -0.38);
    hermes.leftArm.arm.rotation.set(0.28, -0.22, -0.76 + Math.cos(t * 1.8) * 0.04);
    hermes.leftArm.elbow.rotation.set(-0.52, -0.2, -0.18);
  }

  const flapSpeed = (mode === 'velocidade' || mode === 'relampago') ? 24.0 : 12.5;
  const flapAmp = (mode === 'velocidade' || mode === 'relampago') ? 0.45 : 0.28;

  for (const tw of hermes.talariaWings) {
    const f = Math.sin(t * flapSpeed) * flapAmp;
    tw.left.rotation.z = f;
    tw.right.rotation.z = -f;
  }
  const pf = Math.sin(t * (flapSpeed * 0.65)) * (flapAmp * 0.65);
  hermes.petasosWings.left.rotation.z = pf;
  hermes.petasosWings.right.rotation.z = -pf;

  const cf = Math.sin(t * (flapSpeed * 0.75)) * (flapAmp * 0.7);
  hermes.caduceusWings.left.rotation.z = cf;
  hermes.caduceusWings.right.rotation.z = -cf;
  hermes.caduceusCrystal.rotation.y += dt * 3.5;
  hermes.caduceusHalo.rotation.z -= dt * 4.0;

  hermes.caduceusAnchor.getWorldPosition(tmpV);
  caduceusLight.position.copy(tmpV);
  caduceusLight.intensity = 2.0 + Math.sin(t * 14) * 0.4;

  const wind = (mode === 'velocidade' || mode === 'rajada') ? 2.1 : 1.0;
  for (const c of hermes.hairCurls) {
    c.mesh.position.y = c.baseY + Math.sin(t * 3.2 * wind + c.phase) * 0.008;
  }

  const cAttr = hermes.cape.geometry.attributes.position;
  for (let i = 0; i < cAttr.count; i++) {
    const bx = hermes.capeBase[i * 3];
    const by = hermes.capeBase[i * 3 + 1];
    const bz = hermes.capeBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.66 - by) / 1.32));
    const wave1 = Math.sin(t * 3.8 * wind - normY * 4.5 + bx * 2.8) * 0.14 * normY;
    const wave2 = Math.cos(t * 2.6 * wind - normY * 3.0) * 0.06 * normY;
    cAttr.setXYZ(i, bx + Math.sin(t * 2.8 - normY * 3.0) * 0.04 * normY, by, bz + wave1 + wave2);
  }
  cAttr.needsUpdate = true;
  hermes.cape.geometry.computeVertexNormals();

  const skAttr = hermes.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = hermes.skirtBase[i * 3];
    const by = hermes.skirtBase[i * 3 + 1];
    const bz = hermes.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.28 - by) / 0.56));
    skAttr.setZ(i, bz + Math.sin(t * 3.8 * wind - normY * 4.0 + bx * 4.0) * 0.04 * normY);
  }
  skAttr.needsUpdate = true;
  hermes.skirtMesh.geometry.computeVertexNormals();

  for (let i = afterimages.length - 1; i >= 0; i--) {
    const ai = afterimages[i];
    ai.life -= dt;
    const k = Math.max(0, ai.life / ai.max);
    ai.mat.opacity = 0.62 * k;
    if (ai.life <= 0) {
      scene.remove(ai.mesh);
      ai.mesh.traverse(c => { if (c.geometry) c.geometry.dispose(); });
      ai.mat.dispose();
      afterimages.splice(i, 1);
    }
  }

  for (let i = sonicRings.length - 1; i >= 0; i--) {
    const sr = sonicRings[i];
    sr.life -= dt;
    const k = Math.max(0, sr.life / sr.max);
    sr.mesh.scale.setScalar(1 + (1 - k) * sr.maxScale);
    sr.mesh.material.opacity = 0.9 * k;
    if (sr.life <= 0) {
      scene.remove(sr.mesh);
      sr.mesh.geometry.dispose();
      sr.mesh.material.dispose();
      sonicRings.splice(i, 1);
    }
  }

  for (let i = windBlades.length - 1; i >= 0; i--) {
    const wb = windBlades[i];
    wb.life -= dt;
    wb.mesh.position.x += wb.vx * dt;
    wb.mesh.position.z += wb.vz * dt;
    wb.mesh.scale.setScalar(1 + (1 - wb.life / wb.max) * 1.4);
    const k = Math.max(0, wb.life / wb.max);
    wb.mesh.children[0].material.opacity = 0.92 * k;
    wb.mesh.children[1].material.opacity = 0.95 * k;
    if (wb.life <= 0) {
      scene.remove(wb.mesh);
      wb.mesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      windBlades.splice(i, 1);
    }
  }

  const wAttr = windGeo.attributes.position;
  for (let i = 0; i < WIND_N; i++) {
    windAngle[i] += windSpeed[i] * dt * (mode === 'velocidade' ? 2.2 : 1.0);
    wAttr.setX(i, Math.cos(windAngle[i]) * windRadius[i]);
    wAttr.setZ(i, Math.sin(windAngle[i]) * windRadius[i]);
  }
  wAttr.needsUpdate = true;

  for (const c of clouds) {
    c.g.position.y = c.baseY + Math.sin(t * 0.7 + c.ph) * 0.12;
  }

  shadowBlob.position.set(hx, 0.015, hz);
  const s = 1.55 - hoverY * 1.5;
  shadowBlob.scale.set(s, s, 1);
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 16);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace && mode !== 'velocidade') camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(hx, 2.98 + hoverY, hz)
    : new T.Vector3(0, 1.92, 0);
  currentLookAt.lerp(desiredTarget, 0.14);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
