<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. CONFIGURAÇÃO VISUAL DAS 3 DIVINDADES NÓRDICAS (ODIN, THOR, LOKI E FREYR)
   ========================================================================== */
export const NORSE_GODS = {
  odin: {
    id: 'odin',
    title: 'Coletores Nórdicos & Anão de Odin',
    subtitle: 'Túnicas de lã azul-real de Valhalla, peles de lobo cinzento, detalhes dourados e o Anão mestre da mineração',
    bgHex: 0x0c192c,
    hemiSky: 0xe0f2fe,
    hemiGround: 0x1e3a8a,
    rimHex: 0x38bdf8,
    ringHex: 0x38bdf8,
    tunicBase: '#1e3a8a',

    tunicTrim: '#facc15',

    accentHex: 0xfacc15,

  },

    hemiGround: 0x7f1d1d,
    rimHex: 0xf97316,
    ringHex: 0xf59e0b,
    tunicBase: '#7f1d1d',
    tunicStripe: '#450a0a',
    tunicTrim: '#f59e0b',
    furHex: 0x5c3317,
    accentHex: 0xf59e0b,
    toolMetalHex: 0xcbd5e1,
    sparkHex: 0xfef08a,
    maleHair: 0xd97706,
    femaleHair: 0xb45309,
    dwarfHair: 0x78350f
  },
  loki: {
    id: 'loki',
    title: 'Coletores Nórdicos & Anão de Loki',
    subtitle: 'Túnicas verde-floresta de Jotunheim com bordados rúnicos em bronze e peles escuras das montanhas',
    bgHex: 0x071914,
    hemiSky: 0xd1fae5,
    hemiGround: 0x064e3b,
    rimHex: 0x10b981,
    ringHex: 0x10b981,
    tunicBase: '#065f46',
    tunicStripe: '#022c22',
    tunicTrim: '#34d399',
    furHex: 0x334155,
    accentHex: 0xd97706,
    toolMetalHex: 0x94a3b8,
    sparkHex: 0x6ee7b7,
    maleHair: 0x27272a,
    femaleHair: 0x9a3412,
    dwarfHair: 0x1f2937
  },
  freyr: {
    id: 'freyr',
    title: 'Coletores Nórdicos & Anão de Freyr',
    subtitle: 'Vestes em dourado-trigo e verde-bosque de Alfheim com peles claras de cervo e ouro da colheita',
    bgHex: 0x161b0c,
    hemiSky: 0xfef9c3,
    hemiGround: 0x3f6212,
    rimHex: 0xfacc15,
    ringHex: 0xa3e635,
    tunicBase: '#a16207',
    tunicStripe: '#365314',
    tunicTrim: '#fef08a',
    furHex: 0xd6d3d1,
    accentHex: 0xfacc15,
    toolMetalHex: 0xfde047,
    sparkHex: 0xfef08a,
    maleHair: 0xeab308,
    femaleHair: 0xfef08a,
    dwarfHair: 0xb45309
  }
};

/* ==========================================================================
   2. TEXTURAS PROCEDURAIS PBR PARA LÃ NÓRDICA E SOLO NEVADO
   ========================================================================== */
export function createNorseWoolTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = theme.tunicBase;
  ctx.fillRect(0, 0, 512, 256);

  // Trama de lã grossa
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  for (let x = 0; x < 512; x += 6) ctx.fillRect(x, 0, 2, 256);
  for (let y = 0; y < 256; y += 6) ctx.fillRect(0, y, 512, 2);

  // Barrado nórdico entrelaçado
  ctx.fillStyle = theme.tunicStripe;
  ctx.fillRect(0, 194, 512, 42);
  ctx.fillStyle = theme.tunicTrim;
  ctx.fillRect(0, 190, 512, 4);
  ctx.fillRect(0, 236, 512, 4);

  // Runas / Nó celta-nórdico estilizado
  ctx.strokeStyle = theme.tunicTrim;
  ctx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x + 16, 200);
    ctx.lineTo(x + 26, 215);
    ctx.lineTo(x + 16, 230);
    ctx.lineTo(x + 6, 215);
    ctx.closePath();
    ctx.moveTo(x + 16, 200);
    ctx.lineTo(x + 16, 230);
    ctx.stroke();
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

export function createSnowArenaTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  // Pedra nórdica coberta com geada e neve compactada
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 3200; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(248, 250, 252, 0.45)' : 'rgba(71, 85, 105, 0.22)';
    ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 12, 12);
  }

  const cx = 512, cy = 512;
  ctx.strokeStyle = theme.tunicBase;
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.arc(cx, cy, 420, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = theme.tunicTrim;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(cx, cy, 436, 0, Math.PI * 2);
  ctx.stroke();

  // Símbolo Valknut / Estrela Rúnica no centro
  ctx.strokeStyle = theme.tunicBase;
  ctx.lineWidth = 8;
  for (let t = 0; t < 3; t++) {
    const rot = (t / 3) * Math.PI * 2;
    ctx.beginPath();
    for (let v = 0; v < 3; v++) {
      const a = rot + (v / 3) * Math.PI * 2;
      const px = cx + Math.cos(a) * 145;
      const py = cy + Math.sin(a) * 145;
      if (v === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

/* ==========================================================================
   3. CONSTRUÇÃO DOS COLETORES NÓRDICOS (HOMEM, MULHER & ANÃO)
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

/**
 * role: 'homem' | 'mulher' | 'anao'
 */
export function buildNorseWorker(role, initialGod = 'odin') {
  const theme = NORSE_GODS[initialGod] || NORSE_GODS.odin;
  const isFemale = role === 'mulher';
  const isDwarf = role === 'anao';

  const hairHex = isDwarf ? theme.dwarfHair : (isFemale ? theme.femaleHair : theme.maleHair);
  const skinHex = isDwarf ? 0xd99b72 : (isFemale ? 0xedd0be : 0xdfb193);

  const M = {
    skin: new T.MeshStandardMaterial({ color: skinHex, roughness: 0.46, metalness: 0.04 }),
    hair: new T.MeshStandardMaterial({ color: hairHex, roughness: 0.62 }),
    tunic: new T.MeshStandardMaterial({
      map: createNorseWoolTexture(theme),
      roughness: 0.68,
      side: T.DoubleSide
    }),
    fur: new T.MeshStandardMaterial({ color: theme.furHex, roughness: 0.85 }),
    pants: new T.MeshStandardMaterial({ color: 0x334155, roughness: 0.72 }),
    leather: new T.MeshStandardMaterial({ color: 0x451a03, roughness: 0.72 }),
    accent: new T.MeshStandardMaterial({ color: theme.accentHex, metalness: 0.86, roughness: 0.24 }),
    wood: new T.MeshStandardMaterial({ color: 0x6b3818, roughness: 0.65 }),
    toolMetal: new T.MeshStandardMaterial({ color: theme.toolMetalHex, metalness: 0.88, roughness: 0.22 }),
    lipMat: new T.MeshStandardMaterial({ color: isFemale ? 0xc86d6d : 0xa86454, roughness: 0.45 }),
    eyeIris: new T.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2 })
  };

  const root = new T.Group();

  // Escalas específicas:
  // Homem Nórdico: alto e esguio (1.02)
  // Mulher Nórdica: esguia e ágil (0.95)
  // Anão Minerador: baixo, largo e atarracado (Y = 0.72, X/Z = 1.18)
  const scaleY = isDwarf ? 0.72 : (isFemale ? 0.95 : 1.02);
  const scaleXZ = isDwarf ? 1.18 : (isFemale ? 0.94 : 1.0);
  const baseHipY = 1.00 * scaleY;

  const body = group(root, 0, baseHipY, 0);
  body.scale.set(scaleXZ, scaleY, scaleXZ);

  // Pelve e calças de lã nórdicas
  const pelvis = group(body, 0, 0.88, 0);
  const hipWidth = isFemale ? 1.08 : (isDwarf ? 1.16 : 0.98);
  sculpt(pelvis, new T.SphereGeometry(0.195, 18, 16), M.pants, [0, 0, 0], [0, 0, 0], [hipWidth, 0.78, 0.84]);

  // Pernas com calças de lã e botas nórdicas forradas de pele
  const legs = {};
  const legSpread = isFemale ? 0.125 : (isDwarf ? 0.15 : 0.135);
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * legSpread, -0.04, 0);

    const thighRTop = isFemale ? 0.106 : (isDwarf ? 0.128 : 0.114);
    const thighRBot = isFemale ? 0.078 : (isDwarf ? 0.096 : 0.084);
    sculpt(hip, new T.CylinderGeometry(thighRTop, thighRBot, 0.48, 16), M.pants, [0, -0.23, 0]);
    sculpt(hip, new T.SphereGeometry(thighRBot * 1.02, 12, 12), M.pants, [0, -0.47, 0.01]);

    const knee = group(hip, 0, -0.48, 0);
    const calfRTop = isFemale ? 0.076 : (isDwarf ? 0.092 : 0.082);
    const calfRBot = isFemale ? 0.052 : (isDwarf ? 0.064 : 0.056);
    sculpt(knee, new T.CylinderGeometry(calfRTop, calfRBot, 0.44, 16), M.leather, [0, -0.22, 0]);
    // Dobra de pele de lobo no topo da bota
    const bootFur = new T.TorusGeometry(calfRTop * 1.05, 0.022, 8, 20);
    bootFur.rotateX(Math.PI / 2);
    sculpt(knee, bootFur, M.fur, [0, -0.06, 0]);

    const ankle = group(knee, 0, -0.44, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.092, 0.055, 0.21), M.leather, [0, -0.022, 0.036]);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.12, -0.08, -0.04);
  legs.L.knee.rotation.set(0.16, 0, 0);
  legs.R.hip.rotation.set(0.10, 0.08, 0.04);
  legs.R.knee.rotation.set(0.14, 0, 0);

  // Tronco
  const torso = group(body, 0, 1.28, 0);
  const shoulderW = isFemale ? 0.255 : (isDwarf ? 0.345 : 0.305);
  const waistW = isFemale ? 0.178 : (isDwarf ? 0.255 : 0.210);

  const tunicPts = [
    new T.Vector2(0.01, -0.38),
    new T.Vector2(0.22, -0.34),
    new T.Vector2(waistW + 0.018, -0.15),
    new T.Vector2(waistW + 0.045, 0.05),
    new T.Vector2(shoulderW + 0.018, 0.27),
    new T.Vector2(shoulderW * 0.78, 0.38),
    new T.Vector2(0.14, 0.39),
    new T.Vector2(0.01, 0.39)
  ];
  sculpt(torso, new T.LatheGeometry(tunicPts, 32), M.tunic, [0, 0.01, 0], [0, 0, 0], [1.10, 1.0, 0.78]);

  // Gola espessa de pele de lobo nos ombros (típica do clima gelado nórdico)
  const furCollar = new T.TorusGeometry(shoulderW * 0.72, 0.045, 10, 28);
  furCollar.rotateX(Math.PI / 2);
  sculpt(torso, furCollar, M.fur, [0, 0.38, 0.0], [0.14, 0, 0], [1.18, 1, 0.88]);

  // Broches ovais nórdicos (Tortoise Brooches) no peito da mulher
  if (isFemale) {
    for (const side of [-1, 1]) {
      sculpt(torso, new T.SphereGeometry(0.028, 12, 12), M.accent, [side * 0.11, 0.22, 0.17], [0, 0, 0], [0.85, 1.25, 0.45]);
    }
  }

  // Cinto largo de couro com fivela rúnica
  const belt = new T.TorusGeometry(waistW + 0.03, 0.028, 10, 28);
  belt.rotateX(Math.PI / 2);
  sculpt(torso, belt, M.leather, [0, -0.16, 0.005], [0.04, 0, 0], [1.12, 1, 0.82]);
  sculpt(torso, new T.CylinderGeometry(0.036, 0.036, 0.018, 14), M.accent, [0, -0.16, (waistW + 0.03) * 0.84], [Math.PI / 2, 0, 0]);

  // Túnica inferior / Saiote de lã
  const skirtH = isFemale ? 0.94 : 0.54;
  const skirtBotR = isFemale ? 0.34 : (isDwarf ? 0.38 : 0.35);
  const skirtY = isFemale ? -0.62 : -0.42;
  const skirtGeo = new T.CylinderGeometry(waistW + 0.02, skirtBotR, skirtH, 36, 12, true);
  const skPos = skirtGeo.attributes.position;
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (skirtH * 0.5 - y) / skirtH));
    const pleat = Math.sin(angle * 16) * 0.018 * (0.2 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    skPos.setXYZ(i, Math.cos(angle) * r * 1.05, y, Math.sin(angle) * r * 0.85);
  }
  skirtGeo.computeVertexNormals();
  sculpt(torso, skirtGeo, M.tunic, [0, skirtY, 0], [0.02, 0, 0]);

  // Pescoço e Cabeça Nórdica
  sculpt(torso, new T.CylinderGeometry(0.085, 0.108, 0.20, 16), M.skin, [0, 0.48, -0.005], [0.05, 0, 0]);

  const head = group(torso, 0, 0.68, 0.025);
  // Cabeça do Anão é proporcionalmente maior e mais expressiva
  if (isDwarf) {
    head.scale.set(0.92, 1.24, 0.92);
  }
  const headScaleX = isFemale ? 0.88 : (isDwarf ? 1.02 : 0.94);
  sculpt(head, new T.SphereGeometry(0.172, 28, 28), M.skin, [0, 0, 0], [0, 0, 0], [headScaleX, 1.12, 0.98]);

  // Nariz nórdico (mais largo e proeminente no Anão)
  const noseW = isDwarf ? 0.032 : 0.020;
  sculpt(head, new T.BoxGeometry(noseW, 0.068, 0.038), M.skin, [0, 0.005, 0.164], [-0.12, 0, 0]);
  if (isDwarf) {
    sculpt(head, new T.SphereGeometry(0.026, 12, 12), M.skin, [0, -0.025, 0.180]);
  }
  sculpt(head, new T.BoxGeometry(0.038, 0.012, 0.018), M.lipMat, [0, -0.068, 0.158]);

  // Olhos azuis nórdicos
  const eyeWhiteMat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  for (const side of [-1, 1]) {
    sculpt(head, new T.SphereGeometry(0.019, 12, 12), eyeWhiteMat, [side * 0.050, 0.022, 0.152], [0, 0, 0], [1.15, 0.72, 0.75]);
    sculpt(head, new T.SphereGeometry(0.011, 10, 10), M.eyeIris, [side * 0.050, 0.022, 0.162]);
    sculpt(head, new T.BoxGeometry(0.048, 0.008, 0.015), M.hair, [side * 0.050, 0.044, 0.158], [0, 0, side * -0.08]);
  }

  // Cabelos e Barbas Nórdicas
  sculpt(head, new T.SphereGeometry(0.182, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.62), M.hair, [0, 0.028, -0.01], [-0.12, 0, 0], [headScaleX * 1.04, 1.06, 1.04]);

  if (isFemale) {
    // Duas tranças nórdicas longas caindo sobre os ombros + tiara metálica
    for (const side of [-1, 1]) {
      const braidCurve = new T.CatmullRomCurve3([
        new T.Vector3(side * 0.13, 0.04, 0.04),
        new T.Vector3(side * 0.16, -0.14, 0.10),
        new T.Vector3(side * 0.14, -0.34, 0.12)
      ]);
      sculpt(head, new T.TubeGeometry(braidCurve, 12, 0.022, 8, false), M.hair);
      sculpt(head, new T.CylinderGeometry(0.024, 0.024, 0.022, 10), M.accent, [side * 0.14, -0.32, 0.12]);
    }
    const circlet = new T.TorusGeometry(0.168, 0.009, 8, 32);
    circlet.rotateX(Math.PI / 2);
    sculpt(head, circlet, M.accent, [0, 0.095, 0.005], [0.20, 0, 0], [0.92, 1, 1.02]);
  } else if (isDwarf) {
    // ANÃO MINERADOR: Barba gigantesca bifurcada em duas tranças grossas com anéis de ouro + Gorro de couro de minerador!
    sculpt(head, new T.SphereGeometry(0.188, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.52), M.leather, [0, 0.04, -0.005], [-0.1, 0, 0], [1.06, 1.05, 1.06]);
    const capRim = new T.TorusGeometry(0.184, 0.018, 8, 28);
    capRim.rotateX(Math.PI / 2);
    sculpt(head, capRim, M.fur, [0, 0.06, 0.005], [0.12, 0, 0], [1.06, 1, 1.06]);

    // Bigode espesso
    sculpt(head, new T.CapsuleGeometry(0.024, 0.075, 8, 10), M.hair, [-0.045, -0.055, 0.172], [0.1, 0.3, 1.2]);
    sculpt(head, new T.CapsuleGeometry(0.024, 0.075, 8, 10), M.hair, [0.045, -0.055, 0.172], [0.1, -0.3, -1.2]);

    // Duas tranças de barba longas e pesadas com argolas douradas
    for (const side of [-1, 1]) {
      sculpt(head, new T.ConeGeometry(0.055, 0.42, 10), M.hair, [side * 0.055, -0.24, 0.145], [Math.PI - 0.12, 0, side * 0.08]);
      sculpt(head, new T.CylinderGeometry(0.032, 0.028, 0.035, 12), M.accent, [side * 0.068, -0.32, 0.155], [-0.12, 0, side * 0.08]);
    }
  } else {
    // Coletor Nórdico (Homem): Barba viking bem aparada e cabelos na altura dos ombros
    sculpt(head, new T.ConeGeometry(0.11, 0.24, 12), M.hair, [0, -0.15, 0.13], [Math.PI - 0.15, 0, 0], [1.1, 1, 0.75]);
    for (const side of [-1, 1]) {
      sculpt(head, new T.CapsuleGeometry(0.025, 0.16, 8, 10), M.hair, [side * 0.14, -0.08, 0.02], [0.1, 0, side * -0.1]);
    }
  }

  // Braços articulados com mangas de lã e braceletes
  function createNorseArm(isRight) {
    const s = isRight ? 1 : -1;
    const armX = isFemale ? 0.295 : (isDwarf ? 0.385 : 0.345);
    const arm = group(torso, s * armX, 0.32, -0.005);

    const upperR = isFemale ? 0.058 : (isDwarf ? 0.085 : 0.070);
    sculpt(arm, new T.SphereGeometry(upperR * 1.15, 14, 14), M.tunic, [0, -0.01, 0]);
    sculpt(arm, new T.CapsuleGeometry(upperR, 0.24, 10, 14), M.tunic, [s * 0.015, -0.15, 0], [0, 0, s * 0.06]);

    const elbow = group(arm, s * 0.03, -0.30, 0);
    const foreRTop = isFemale ? 0.052 : (isDwarf ? 0.076 : 0.062);
    const foreRBot = isFemale ? 0.038 : (isDwarf ? 0.056 : 0.045);
    sculpt(elbow, new T.CylinderGeometry(foreRTop, foreRBot, 0.28, 14), M.skin, [0, -0.14, 0]);

    // Braçadeira de couro e bronze
    const bracer = new T.CylinderGeometry(foreRBot * 1.15, foreRBot * 1.08, 0.09, 16, 1, true);
    sculpt(elbow, bracer, M.leather, [0, -0.22, 0]);

    const hand = group(elbow, 0, -0.29, 0);
    sculpt(hand, new T.BoxGeometry(0.054, 0.066, 0.028), M.skin, [0, -0.015, 0]);

    return { arm, elbow, hand };
  }

  const rightArm = createNorseArm(true);
  const leftArm = createNorseArm(false);

  // ========================================================================
  // FERRAMENTAS NÓRDICAS DE COLETA
  // ========================================================================
  const tools = {};

  // 1. Machado Bárbaro de Lenhador (Cortar Pinheiro)
  const axe = group(rightArm.hand, 0, -0.025, 0.02);
  axe.rotation.set(Math.PI / 2, 0, 0);
  sculpt(axe, new T.CylinderGeometry(0.016, 0.018, 0.96, 10), M.wood, [0, 0.28, 0]);
  sculpt(axe, new T.BoxGeometry(0.032, 0.16, 0.22), M.toolMetal, [0, 0.68, 0.08]);
  sculpt(axe, new T.BoxGeometry(0.012, 0.22, 0.07), M.accent, [0, 0.68, 0.18]);
  tools.axe = axe;

  // 2. Picareta Pesada de Mineração (Anão usa uma picareta rúnica reforçada!)
  const pickaxe = group(rightArm.hand, 0, -0.025, 0.02);
  pickaxe.rotation.set(Math.PI / 2, 0, 0);
  sculpt(pickaxe, new T.CylinderGeometry(0.016, 0.018, 0.94, 10), M.wood, [0, 0.28, 0]);
  sculpt(pickaxe, new T.CylinderGeometry(0.028, 0.028, 0.09, 10), isDwarf ? M.accent : M.toolMetal, [0, 0.68, 0]);
  sculpt(pickaxe, new T.ConeGeometry(0.026, 0.26, 5), M.toolMetal, [0, 0.68, 0.14], [Math.PI / 2 + 0.18, 0, 0]);
  sculpt(pickaxe, new T.ConeGeometry(0.026, 0.26, 5), M.toolMetal, [0, 0.68, -0.14], [-Math.PI / 2 - 0.18, 0, 0]);
  tools.pickaxe = pickaxe;

  // 3. Martelo Nórdico de Construção (Construir)
  const hammer = group(rightArm.hand, 0, -0.025, 0.02);
  hammer.rotation.set(Math.PI / 2, 0, 0);
  sculpt(hammer, new T.CylinderGeometry(0.015, 0.017, 0.58, 10), M.wood, [0, 0.18, 0]);
  sculpt(hammer, new T.BoxGeometry(0.11, 0.11, 0.20), M.toolMetal, [0, 0.44, 0]);
  tools.hammer = hammer;

  // 4. Cesto de Madeira com Bagas Nórdicas (Colher Bagas)
  const basket = group(leftArm.hand, 0, -0.04, 0.06);
  sculpt(basket, new T.CylinderGeometry(0.18, 0.12, 0.20, 16), M.wood, [0, -0.04, 0.06], [0.25, 0, 0]);
  const berryCols = [0xdc2626, 0x2563eb, 0x7e22ce, 0xf59e0b];
  for (let f = 0; f < 6; f++) {
    const fa = (f / 6) * Math.PI * 2;
    sculpt(
      basket,
      new T.SphereGeometry(0.042, 10, 10),
      new T.MeshStandardMaterial({ color: berryCols[f % berryCols.length], roughness: 0.35 }),
      [Math.cos(fa) * 0.07, 0.065, 0.085 + Math.sin(fa) * 0.07]
    );
  }
  tools.basket = basket;

  function setToolMode(act) {
    tools.axe.visible = act === 'madeira';
    tools.pickaxe.visible = act === 'ouro';
    tools.hammer.visible = act === 'construir';
    tools.basket.visible = act === 'fruta';
  }
  setToolMode('vigilia');

  function applyGodTheme(godKey) {
    const next = NORSE_GODS[godKey] || NORSE_GODS.odin;
    M.hair.color.setHex(isDwarf ? next.dwarfHair : (isFemale ? next.femaleHair : next.maleHair));
    M.fur.color.setHex(next.furHex);
    M.accent.color.setHex(next.accentHex);
    M.toolMetal.color.setHex(next.toolMetalHex);

    if (M.tunic.map) M.tunic.map.dispose();
    M.tunic.map = createNorseWoolTexture(next);
    M.tunic.needsUpdate = true;
  }

  return {
    root, body, torso, head, legs,
    rightArm, leftArm, tools,
    setToolMode, applyGodTheme,
    role, isFemale, isDwarf, baseHipY
  };
}

// Neve caindo suavemente + faíscas de trabalho
const SNOW_N = 220;
const snowPos = new Float32Array(SNOW_N * 3);
for (let i = 0; i < SNOW_N; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 14;
  snowPos[i * 3 + 1] = Math.random() * 6.5;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
}
const snowGeo = new T.BufferGeometry();
snowGeo.setAttribute('position', new T.BufferAttribute(snowPos, 3));
scene.add(new T.Points(snowGeo, new T.PointsMaterial({ color: 0xf8fafc, size: 0.065, transparent: true, opacity: 0.75 })));

const PART_N = 60;
const partPos = new Float32Array(PART_N * 3).fill(-100);
const partVel = new Float32Array(PART_N * 3);
const partLife = new Float32Array(PART_N);
let partIdx = 0;

const partGeo = new T.BufferGeometry();
partGeo.setAttribute('position', new T.BufferAttribute(partPos, 3));
const partMat = new T.PointsMaterial({
  color: 0x7dd3fc,
  size: 0.11,
  transparent: true,
  opacity: 0.95,
  blending: T.AdditiveBlending,
  depthWrite: false
});
scene.add(new T.Points(partGeo, partMat));

function spawnWorkParticles(x, y, z) {
  for (let k = 0; k < 12; k++) {
    const i = partIdx;
    partIdx = (partIdx + 1) % PART_N;
    partPos[i * 3] = x + (Math.random() - 0.5) * 0.25;
    partPos[i * 3 + 1] = y;
    partPos[i * 3 + 2] = z + (Math.random() - 0.5) * 0.25;
    partVel[i * 3] = (Math.random() - 0.5) * 3.4;
    partVel[i * 3 + 1] = 1.8 + Math.random() * 2.8;
    partVel[i * 3 + 2] = (Math.random() - 0.5) * 3.4;
    partLife[i] = 0.25 + Math.random() * 0.22;
  }
  hitLight.position.set(x, y + 0.3, z);
  hitLight.intensity = 6.5;
}

function updateParticles(dt) {
  const sAttr = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_N; i++) {
    let sy = sAttr.getY(i) - dt * 0.65;
    if (sy < 0) sy = 6.5;
    sAttr.setY(i, sy);
  }
  sAttr.needsUpdate = true;

  for (let i = 0; i < PART_N; i++) {
    if (partLife[i] <= 0) continue;
    partLife[i] -= dt;
    partVel[i * 3 + 1] -= 9.5 * dt;
    partPos[i * 3] += partVel[i * 3] * dt;
    partPos[i * 3 + 1] += partVel[i * 3 + 1] * dt;
    partPos[i * 3 + 2] += partVel[i * 3 + 2] * dt;
    if (partLife[i] <= 0) partPos[i * 3 + 1] = -100;
  }
  partGeo.attributes.position.needsUpdate = true;
}

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFaces = !focusFaces;
  btnFocus.classList.toggle('active', focusFaces);
  btnFocus.textContent = focusFaces ? 'Corpo Inteiro' : 'Focar Rostos';
  targetCamDist = focusFaces ? 2.95 : 7.8;
  if (focusFaces) {
    camAngle = 0.20;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.8, 14.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.8, 14.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   6. LOOP DE ANIMAÇÃO DOS COLETORES NÓRDICOS E DO ANÃO
   ========================================================================== */
let sparkDone = false;

export function animateWorker(w, dt, t, slotOffsetX, phaseOffset, actionState = action, currentWhoMode = whoMode, onSpark = null) {
  if (!w.root.visible) return;

  let vx = slotOffsetX;
  let vz = 0;
  let vy = 0;
  let yaw = 0;
  let pitch = 0;
  let torsoYaw = 0;
  const breath = Math.sin(t * 2.3 + phaseOffset) * 0.016;

  if (actionState === 'andar') {
    const a = t * 0.95 + phaseOffset;
    const R = w.isDwarf ? 1.85 : (w.isFemale ? 2.35 : 2.85);
    vx = Math.cos(a) * R;
    vz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.06;

    const stepFreq = w.isDwarf ? 7.2 : 5.6;
    const stride = t * stepFreq + phaseOffset;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    vy = Math.abs(cosS) * 0.04;
    torsoYaw = sinS * 0.09;

    w.legs.L.hip.rotation.x = -0.12 + sinS * 0.36;
    w.legs.L.knee.rotation.x = 0.18 + Math.max(0, -cosS) * 0.36;
    w.legs.R.hip.rotation.x = -0.12 - sinS * 0.36;
    w.legs.R.knee.rotation.x = 0.18 + Math.max(0, cosS) * 0.36;

    w.rightArm.arm.rotation.set(-0.15 - sinS * 0.35, 0.08, 0.14);
    w.rightArm.elbow.rotation.set(-0.25, 0, 0.08);
    w.leftArm.arm.rotation.set(-0.15 + sinS * 0.35, -0.08, -0.14);
    w.leftArm.elbow.rotation.set(-0.25, 0, -0.08);
  } else if (actionState === 'madeira' || actionState === 'ouro' || actionState === 'construir') {
    vx = (currentWhoMode === 'todos') ? slotOffsetX : 0;
    vz = 0.25;
    yaw = (currentWhoMode === 'todos') ? -slotOffsetX * 0.45 : 0;

    // Anão minera ouro 35% mais rápido (especialidade clássica do Age of Mythology!)
    const speed = (w.isDwarf && actionState === 'ouro') ? 5.6 : (actionState === 'construir' ? 5.0 : 3.9);
    const swing = (t * speed + phaseOffset) % (Math.PI * 2);
    const strike = Math.sin(swing);

    pitch = 0.14 + strike * 0.16;
    torsoYaw = -0.18 + strike * 0.28;

    w.rightArm.arm.rotation.set(-1.35 + strike * 0.95, 0.18, 0.25);
    w.rightArm.elbow.rotation.set(-0.65 + strike * 0.35, 0.1, 0.1);
    w.leftArm.arm.rotation.set(-0.65 + strike * 0.35, -0.25, -0.22);
    w.leftArm.elbow.rotation.set(-0.85, -0.15, 0.15);

    w.legs.L.hip.rotation.set(-0.22, -0.10, -0.06);
    w.legs.L.knee.rotation.set(0.28, 0, 0);
    w.legs.R.hip.rotation.set(0.18, 0.10, 0.06);
    w.legs.R.knee.rotation.set(0.22, 0, 0);

    if (strike > 0.92 && !sparkDone) {
      sparkDone = true;
      if (onSpark) {
        onSpark(0, actionState === 'madeira' ? 0.85 : 0.45, 1.18);
      } else {
        spawnWorkParticles(0, actionState === 'madeira' ? 0.85 : 0.45, 1.18);
      }
    } else if (strike < 0.2) {
      sparkDone = false;
    }
  } else if (actionState === 'fruta') {
    vx = (currentWhoMode === 'todos') ? slotOffsetX : 0;
    vz = 0.28;
    yaw = (currentWhoMode === 'todos') ? -slotOffsetX * 0.45 : 0;

    const pick = Math.sin(t * 3.4 + phaseOffset);
    pitch = 0.22 + pick * 0.08;
    torsoYaw = pick * 0.18;

    w.leftArm.arm.rotation.set(-0.55, -0.28, -0.24);
    w.leftArm.elbow.rotation.set(-1.05, -0.2, 0.2);

    w.rightArm.arm.rotation.set(-0.95 - pick * 0.35, 0.22 - pick * 0.25, 0.22);
    w.rightArm.elbow.rotation.set(-0.55 - pick * 0.45, 0.15, 0.15);

    w.legs.L.hip.rotation.set(-0.18, -0.08, -0.04);
    w.legs.L.knee.rotation.set(0.26, 0, 0);
    w.legs.R.hip.rotation.set(0.16, 0.08, 0.04);
    w.legs.R.knee.rotation.set(0.22, 0, 0);
  } else {
    vx = (currentWhoMode === 'todos') ? slotOffsetX : 0;
    vz = (currentWhoMode === 'todos' && w.isDwarf) ? 0.18 : 0;
    yaw = Math.sin(t * 0.45 + phaseOffset) * 0.12 + (currentWhoMode === 'todos' ? -slotOffsetX * 0.18 : 0);

    w.rightArm.arm.rotation.set(-0.14, 0.08, 0.18 + Math.sin(t * 1.8 + phaseOffset) * 0.02);
    w.rightArm.elbow.rotation.set(-0.32, 0.06, 0.08);
    w.leftArm.arm.rotation.set(-0.14, -0.08, -0.18 - Math.cos(t * 1.8 + phaseOffset) * 0.02);
    w.leftArm.elbow.rotation.set(-0.32, -0.06, -0.08);

    w.legs.L.hip.rotation.set(-0.12, -0.08, -0.04);
    w.legs.L.knee.rotation.set(0.16, 0, 0);
    w.legs.R.hip.rotation.set(0.10, 0.08, 0.04);
    w.legs.R.knee.rotation.set(0.14, 0, 0);
  }

  w.root.position.set(vx, vy, vz);
  w.root.rotation.set(0, yaw, 0);
  w.body.position.y = w.baseHipY + breath;
  w.body.rotation.set(pitch, torsoYaw, 0);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // Disposição lado a lado quando "Todos (3)" está ativo: Homem à esquerda, Anão no centro-frente, Mulher à direita
  animateWorker(norseMan, dt, elapsed, -0.88, 0);
  animateWorker(norseDwarf, dt, elapsed, 0.0, 0.9);
  animateWorker(norseWoman, dt, elapsed, 0.88, 1.8);

  hitLight.intensity = Math.max(0, hitLight.intensity - dt * 22);
  updateParticles(dt);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFaces && action !== 'andar') camAngle += dt * 0.05;

  const focusY = (whoMode === 'anao') ? 1.72 : 2.25;
  const desiredTarget = focusFaces
    ? new T.Vector3(0, focusY, 0)
    : new T.Vector3(0, 1.58, 0.15);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
