<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rá - Deus do Sol e Rei dos Deuses | Age of Mythology 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #facc15;
      --amber: #f59e0b;
      --lapis: #1d4ed8;
      --turquoise: #06b6d4;
      --glass: rgba(18, 13, 5, 0.84);
      --border: rgba(250, 204, 21, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0904;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #fefce8;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }
    button:hover {
      border-color: #fde047;
      transform: translateY(-1px);
      background: rgba(42, 30, 10, 0.94);
    }
    button.on {
      background: linear-gradient(135deg, #fde047 0%, #d97706 100%);
      color: #140c02;
      border-color: #fef9c3;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.65);
    }
    button.cam-btn {
      border-color: rgba(6, 182, 212, 0.55);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #0891b2 0%, #1d4ed8 100%);
      color: #ffffff;
      border-color: #a5f3fc;
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.55);
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fde047;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 980px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 11, 4, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(250, 204, 21, 0.34);
      padding: 7px 16px;
      border-radius: 999px;
      color: #fef9c3;
      font-size: 12.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="btn-group">
    <button data-m="gloria" class="on">Glória Solar</button>
    <button data-m="bencao">Bênção do Faraó</button>
    <button data-m="chuva">Chuva Dourada</button>
    <button data-m="ira">Raio de Rá</button>
    <button id="btn-focus" class="cam-btn">Focar Elmo Faraônico</button>
  </div>
</div>

<div id="badge">Egito • Rá</div>
<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const T = THREE;

/* ==========================================================================
   1. TEXTURAS PROCEDURAIS PBR (OURO EGÍPCIO, NEMES REAL E SANTUÁRIO SOLAR)
   ========================================================================== */
function createProceduralTextures() {
  // 1.1 Bump map suave de pele e escultura
  const skinCanvas = document.createElement('canvas');
  skinCanvas.width = skinCanvas.height = 256;
  const sCtx = skinCanvas.getContext('2d');
  sCtx.fillStyle = '#808080';
  sCtx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4800; i++) {
    const v = 124 + Math.floor(Math.random() * 10);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  const skinBump = new T.CanvasTexture(skinCanvas);
  skinBump.wrapS = skinBump.wrapT = T.RepeatWrapping;
  skinBump.repeat.set(4, 4);

  // 1.2 Textura Real do Nemes (Listras finas de Ouro Polido e Azul Lápis-Lazúli)
  const nemesCanvas = document.createElement('canvas');
  nemesCanvas.width = 512;
  nemesCanvas.height = 512;
  const nCtx = nemesCanvas.getContext('2d');
  const stripeH = 16;
  for (let y = 0; y < 512; y += stripeH) {
    const isGold = (y / stripeH) % 2 === 0;
    nCtx.fillStyle = isGold ? '#facc15' : '#172554';
    nCtx.fillRect(0, y, 512, stripeH);
    // Filete fino de brilho
    nCtx.fillStyle = isGold ? '#fef08a' : '#1e40af';
    nCtx.fillRect(0, y, 512, 3);
  }
  const nemesTex = new T.CanvasTexture(nemesCanvas);
  nemesTex.wrapS = nemesTex.wrapT = T.RepeatWrapping;

  // 1.3 Saiote Real Shendyt (Linho Branco Plissado com Barrado de Ouro e Turquesa)
  const kiltCanvas = document.createElement('canvas');
  kiltCanvas.width = 512;
  kiltCanvas.height = 256;
  const kCtx = kiltCanvas.getContext('2d');
  const kGrad = kCtx.createLinearGradient(0, 0, 0, 256);
  kGrad.addColorStop(0, '#fffbeb');
  kGrad.addColorStop(0.72, '#fef3c7');
  kGrad.addColorStop(1, '#fde68a');
  kCtx.fillStyle = kGrad;
  kCtx.fillRect(0, 0, 512, 256);

  // Pregas verticais finas do linho real
  kCtx.fillStyle = 'rgba(180, 120, 20, 0.16)';
  for (let x = 0; x < 512; x += 6) kCtx.fillRect(x, 0, 2, 256);

  // Barrado Egípcio Real em Ouro, Lápis-Lazúli e Turquesa
  kCtx.fillStyle = '#1e3a8a';
  kCtx.fillRect(0, 198, 512, 42);
  kCtx.fillStyle = '#facc15';
  kCtx.fillRect(0, 193, 512, 5);
  kCtx.fillRect(0, 240, 512, 5);
  for (let x = 8; x < 512; x += 24) {
    kCtx.fillStyle = (x / 24) % 2 === 0 ? '#06b6d4' : '#facc15';
    kCtx.fillRect(x, 205, 14, 28);
  }
  const kiltTex = new T.CanvasTexture(kiltCanvas);
  kiltTex.wrapS = kiltTex.wrapT = T.RepeatWrapping;

  // 1.4 Piso do Santuário de Heliópolis (Arenito Dourado com Mandala Solar Egípcia)
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = 1024;
  const fCtx = floorCanvas.getContext('2d');
  const fGrad = fCtx.createRadialGradient(512, 512, 40, 512, 512, 512);
  fGrad.addColorStop(0, '#fef3c7');
  fGrad.addColorStop(0.45, '#e7c686');
  fGrad.addColorStop(0.85, '#b88946');
  fGrad.addColorStop(1, '#855822');
  fCtx.fillStyle = fGrad;
  fCtx.fillRect(0, 0, 1024, 1024);

  // Textura granulada de pedra egípcia polida
  for (let i = 0; i < 3200; i++) {
    fCtx.fillStyle = i % 2 === 0 ? 'rgba(255, 251, 235, 0.22)' : 'rgba(92, 56, 16, 0.16)';
    fCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 6, 6);
  }

  const cx = 512, cy = 512;
  // Anéis concêntricos de ouro e lápis-lazúli
  fCtx.strokeStyle = '#1e3a8a';
  fCtx.lineWidth = 18;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 425, 0, Math.PI * 2);
  fCtx.stroke();

  fCtx.strokeStyle = '#eab308';
  fCtx.lineWidth = 8;
  fCtx.beginPath();
  fCtx.arc(cx, cy, 442, 0, Math.PI * 2);
  fCtx.stroke();
  fCtx.beginPath();
  fCtx.arc(cx, cy, 408, 0, Math.PI * 2);
  fCtx.stroke();

  // 16 Raios Solares Egípcios em Ouro e Turquesa no centro do templo
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.22;
    const isMajor = i % 2 === 0;
    const outerR = isMajor ? 330 : 245;
    const halfW = isMajor ? 0.13 : 0.09;

    fCtx.fillStyle = isMajor ? '#eab308' : '#0891b2';
    fCtx.beginPath();
    fCtx.moveTo(cx, cy);
    fCtx.lineTo(cx + Math.cos(a - halfW) * 90, cy + Math.sin(a - halfW) * 90);
    fCtx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
    fCtx.lineTo(cx + Math.cos(a + halfW) * 90, cy + Math.sin(a + halfW) * 90);
    fCtx.closePath();
    fCtx.fill();
    fCtx.strokeStyle = '#fef08a';
    fCtx.lineWidth = 2.5;
    fCtx.stroke();
  }

  // Disco Solar Dourado Central
  fCtx.fillStyle = '#facc15';
  fCtx.beginPath();
  fCtx.arc(cx, cy, 76, 0, Math.PI * 2);
  fCtx.fill();
  fCtx.strokeStyle = '#1e3a8a';
  fCtx.lineWidth = 7;
  fCtx.stroke();

  const floorTex = new T.CanvasTexture(floorCanvas);

  return { skinBump, nemesTex, kiltTex, floorTex };
}

/* ==========================================================================
   2. HELPERS DE ESCULTURA REAL EGÍPCIA E MATERIAIS DE OURO POLIDO
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function createMaterials(textures) {
  return {
    skin: new T.MeshStandardMaterial({
      color: 0xc58654,          // Pele bronze-dourada nobre e radiante
      roughness: 0.36,
      metalness: 0.08,
      bumpMap: textures.skinBump,
      bumpScale: 0.0028
    }),
    pureGold: new T.MeshStandardMaterial({
      color: 0xfacc15,          // Ouro real egípcio polido
      emissive: 0x451a03,
      emissiveIntensity: 0.28,
      metalness: 0.95,
      roughness: 0.14
    }),
    warmGold: new T.MeshStandardMaterial({
      color: 0xeab308,
      emissive: 0x3b1702,
      emissiveIntensity: 0.24,
      metalness: 0.90,
      roughness: 0.20
    }),
    lapisLazuli: new T.MeshStandardMaterial({
      color: 0x1e3a8a,          // Lápis-lazúli real profundo
      emissive: 0x0f172a,
      emissiveIntensity: 0.30,
      metalness: 0.55,
      roughness: 0.24
    }),
    turquoise: new T.MeshStandardMaterial({
      color: 0x06b6d4,          // Turquesa sagrada egípcia
      emissive: 0x0e7490,
      emissiveIntensity: 0.45,
      metalness: 0.50,
      roughness: 0.22
    }),
    obsidianKohl: new T.MeshStandardMaterial({
      color: 0x09090b,
      metalness: 0.85,
      roughness: 0.22
    }),
    nemesMat: new T.MeshStandardMaterial({
      map: textures.nemesTex,
      metalness: 0.35,
      roughness: 0.35,
      side: T.DoubleSide
    }),
    kiltMat: new T.MeshStandardMaterial({
      map: textures.kiltTex,
      roughness: 0.48,
      metalness: 0.08,
      side: T.DoubleSide
    }),
    solarDiscMat: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xf59e0b,       // Disco Solar incandescente
      emissiveIntensity: 3.8,
      roughness: 0.08
    }),
    eyeSolarGold: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xfde047,       // Olhos solares brilhantes
      emissiveIntensity: 4.0,
      roughness: 0.05
    })
  };
}

/* ==========================================================================
   3. CONSTRUÇÃO DE RÁ — DEUS DO SOL EGÍPCIO
      - Elmo / Coroa Faraônica Real (Nemes listrado + Máscara Dourada de Falcão + Disco Solar Uraeus)
      - Colar Usekh monumental em ouro, lápis-lazúli e turquesa
      - Braços majestosos com palmas abertas e artefatos (Was e Ankh) FLUTUANDO EM PÉ ao lado de cada mão
   ========================================================================== */
function buildRa(textures) {
  const M = createMaterials(textures);

  const root = new T.Group();
  const body = group(root, 0, 1.12, 0);

  // ------------------------------------------------------------------------
  // A. PELVE E PERNAS ATLÉTICAS NOBRES (SANDÁLIAS REAIS DE OURO)
  // ------------------------------------------------------------------------
  const pelvis = group(body, 0, 0.88, 0);
  sculpt(pelvis, new T.SphereGeometry(0.22, 22, 20), M.skin, [0, 0, 0], [0, 0, 0], [1.08, 0.78, 0.82]);

  const legs = {};
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * 0.14, -0.04, 0);

    // Coxa atlética esculpida
    sculpt(hip, new T.CylinderGeometry(0.128, 0.090, 0.50, 20), M.skin, [0, -0.24, 0], [0, 0, 0], [1.02, 1, 1.06]);
    sculpt(hip, new T.SphereGeometry(0.098, 16, 16), M.skin, [s * 0.016, -0.21, 0.042], [0, 0, 0], [0.94, 1.8, 0.86]);

    // Joelho
    sculpt(hip, new T.SphereGeometry(0.080, 16, 16), M.skin, [0, -0.50, 0.014]);

    // Canela e Tornozeleira Real Dourada
    const knee = group(hip, 0, -0.51, 0);
    sculpt(knee, new T.CylinderGeometry(0.080, 0.048, 0.46, 18), M.skin, [0, -0.23, 0]);
    sculpt(knee, new T.SphereGeometry(0.076, 16, 16), M.skin, [0, -0.15, -0.034], [0, 0, 0], [0.96, 1.65, 0.95]);

    const anklet = new T.TorusGeometry(0.056, 0.008, 8, 24);
    anklet.rotateX(Math.PI / 2);
    sculpt(knee, anklet, M.pureGold, [0, -0.41, 0.008]);

    // Pé e Sandália Real Egípcia Dourada
    const ankle = group(knee, 0, -0.46, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.084, 0.044, 0.21), M.skin, [0, -0.02, 0.038], [0.20, 0, 0]);
    sculpt(ankle, new T.BoxGeometry(0.092, 0.015, 0.224), M.pureGold, [0, -0.042, 0.038], [0.20, 0, 0]);
    const strap = new T.TorusGeometry(0.054, 0.005, 8, 20);
    strap.rotateX(Math.PI / 2);
    sculpt(ankle, strap, M.pureGold, [0, 0.02, -0.02], [0.12, 0, 0]);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.26, -0.08, -0.04);
  legs.L.knee.rotation.set(0.34, 0, 0);
  legs.R.hip.rotation.set(0.18, 0.08, 0.04);
  legs.R.knee.rotation.set(0.20, 0, 0);

  // ------------------------------------------------------------------------
  // B. TRONCO REAL EGÍPCIO + COLAR MONUMENTAL USEKH EM OURO E PEDRAS PRECIOSAS
  // ------------------------------------------------------------------------
  const torso = group(body, 0, 1.32, 0);

  const torsoPts = [
    new T.Vector2(0.01, -0.43),
    new T.Vector2(0.225, -0.39),
    new T.Vector2(0.195, -0.19),
    new T.Vector2(0.245, 0.03),
    new T.Vector2(0.345, 0.26),
    new T.Vector2(0.305, 0.42),
    new T.Vector2(0.130, 0.49),
    new T.Vector2(0.01, 0.50)
  ];
  sculpt(torso, new T.LatheGeometry(torsoPts, 36), M.skin, [0, 0, 0], [0, 0, 0], [1.14, 1.02, 0.72]);

  // Peitorais definidos e elegantes
  const pecGeo = new T.SphereGeometry(0.19, 22, 22);
  sculpt(torso, pecGeo, M.skin, [-0.16, 0.22, 0.148], [0.12, -0.22, -0.14], [1.04, 0.85, 0.56]);
  sculpt(torso, pecGeo, M.skin, [0.16, 0.22, 0.148], [0.12, 0.22, 0.14], [1.04, 0.85, 0.56]);

  // Abdômen atlético sutil
  const abGeo = new T.SphereGeometry(0.075, 14, 14);
  [
    { y: 0.03, sx: 0.94, sy: 0.75, z: 0.188 },
    { y: -0.08, sx: 0.90, sy: 0.78, z: 0.184 }
  ].forEach(lvl => {
    sculpt(torso, abGeo, M.skin, [-0.06, lvl.y, lvl.z], [0, -0.1, 0], [lvl.sx, lvl.sy, 0.44]);
    sculpt(torso, abGeo, M.skin, [0.06, lvl.y, lvl.z], [0, 0.1, 0], [lvl.sx, lvl.sy, 0.44]);
  });

  // COLAR REAL EGÍPCIO USEKH (6 camadas ricamente ornamentadas em Ouro, Lápis-Lazúli e Turquesa)
  const collarMats = [M.pureGold, M.lapisLazuli, M.pureGold, M.turquoise, M.pureGold, M.lapisLazuli];
  for (let c = 0; c < 6; c++) {
    const colRad = 0.155 + c * 0.028;
    const usekh = new T.TorusGeometry(colRad, 0.015, 10, 36, Math.PI * 1.15);
    usekh.rotateX(Math.PI / 2);
    usekh.rotateY(-Math.PI * 0.075);
    sculpt(torso, usekh, collarMats[c], [0, 0.41 - c * 0.022, 0.02 + c * 0.006], [0.18, 0, 0], [1.08, 1, 0.78]);
  }
  // Escaravelho Solar Dourado no centro do colar Usekh
  const scarab = group(torso, 0, 0.24, 0.228);
  sculpt(scarab, new T.SphereGeometry(0.032, 14, 14), M.pureGold, [0, 0, 0], [0, 0, 0], [0.85, 1.25, 0.45]);
  sculpt(scarab, new T.OctahedronGeometry(0.02, 0), M.turquoise, [0, 0, 0.012]);

  // Pescoço real
  sculpt(torso, new T.CylinderGeometry(0.105, 0.132, 0.25, 20), M.skin, [0, 0.52, -0.006], [0.06, 0, 0]);

  // ------------------------------------------------------------------------
  // C. ELMO / COROA FARAÔNICA MAJESTOSA DE RÁ
  //    - Cocar Real Nemes listrado em Ouro e Lápis-Lazúli com abas caindo sobre o peito
  //    - Máscara Real de Falcão em Ouro Polido, Olhos de Hórus e Bico Dourado Nobre
  //    - Barba Faraônica Trançada de Ouro
  //    - Coroa Suprema com o Disco Solar Incandescente e a Serpente Sagrada Uraeus
  // ------------------------------------------------------------------------
  const head = group(torso, 0, 0.73, 0.032);

  // Crânio esculpido com máscara facial dourada de falcão faraônico
  sculpt(head, new T.SphereGeometry(0.185, 36, 36), M.pureGold, [0, 0.01, 0.005], [0, 0, 0], [0.92, 1.14, 0.98]);

  // Bico Real de Falcão em Ouro Polido (proporções nobres e esculpidas)
  const beakGroup = group(head, 0, -0.01, 0.165);
  // Arco superior curvo do bico de falcão
  const upperBeakCurve = new T.CatmullRomCurve3([
    new T.Vector3(0, 0.035, -0.01),
    new T.Vector3(0, 0.025, 0.065),
    new T.Vector3(0, -0.015, 0.105),
    new T.Vector3(0, -0.055, 0.095)
  ]);
  sculpt(beakGroup, new T.TubeGeometry(upperBeakCurve, 16, 0.026, 10, false), M.pureGold, [0, 0, 0], [0, 0, 0], [0.85, 1.1, 1.0]);
  sculpt(beakGroup, new T.ConeGeometry(0.022, 0.065, 8), M.pureGold, [0, -0.058, 0.092], [2.75, 0, 0], [0.8, 1, 1]);
  // Mandíbula inferior dourada
  sculpt(beakGroup, new T.ConeGeometry(0.024, 0.085, 8), M.warmGold, [0, -0.048, 0.045], [1.65, 0, 0], [0.85, 1, 0.8]);

  // Olhos Solares Incandescentes + Marcações Sagradas do Olho de Hórus em Lápis-Lazúli e Obsidiana
  for (const side of [-1, 1]) {
    const eyeGroup = group(head, side * 0.068, 0.038, 0.148);
    eyeGroup.rotation.y = side * 0.34;

    sculpt(eyeGroup, new T.SphereGeometry(0.022, 16, 16), M.eyeSolarGold, [0, 0, 0], [0, 0, 0], [1.22, 0.72, 0.7]);
    // Contorno egípcio Kohl / Lápis-lazúli ao redor do olho
    sculpt(eyeGroup, new T.BoxGeometry(0.068, 0.008, 0.016), M.lapisLazuli, [side * 0.012, 0.014, 0.008], [0, 0, side * -0.14]);
    sculpt(eyeGroup, new T.BoxGeometry(0.062, 0.007, 0.016), M.lapisLazuli, [side * 0.008, -0.013, 0.008], [0, 0, side * 0.08]);
    // Traço vertical e espiral característica do Olho de Rá/Hórus na face
    sculpt(eyeGroup, new T.BoxGeometry(0.009, 0.055, 0.014), M.lapisLazuli, [0, -0.042, 0.010], [0.1, 0, side * -0.15]);
  }

  // Barba Faraônica Cerimonial em Ouro e Lápis-Lazúli
  const royalBeard = group(head, 0, -0.12, 0.155);
  sculpt(royalBeard, new T.CylinderGeometry(0.022, 0.014, 0.22, 12), M.lapisLazuli, [0, -0.10, 0], [0.14, 0, 0]);
  for (let b = 0; b < 4; b++) {
    const by = -0.03 - b * 0.045;
    sculpt(royalBeard, new T.TorusGeometry(0.021 - b * 0.0015, 0.0045, 8, 16), M.pureGold, [0, by, b * 0.006], [Math.PI / 2 + 0.14, 0, 0]);
  }

  // ELMO / COCAR REAL NEMES (Capuz majestoso listrado em Ouro e Azul Lápis-Lazúli)
  const nemesCrown = group(head, 0, 0.02, -0.01);

  // Diadema frontal dourado que emoldura a testa do Faraó
  const frontBand = new T.CylinderGeometry(0.194, 0.190, 0.042, 32, 1, true, -Math.PI * 0.65, Math.PI * 1.3);
  sculpt(nemesCrown, frontBand, M.pureGold, [0, 0.105, 0.01], [0.08, 0, 0], [0.96, 1, 1.06]);

  // Cúpula ampla e esculpida do Cocar Nemes
  sculpt(nemesCrown, new T.SphereGeometry(0.245, 32, 24), M.nemesMat, [0, 0.06, -0.04], [-0.14, 0, 0], [1.14, 1.04, 1.08]);

  // Duas Abas Reais (Lappets) listradas caindo simetricamente sobre o peito
  for (const side of [-1, 1]) {
    const lappetPts = [
      new T.Vector3(side * 0.21, 0.08, 0.04),
      new T.Vector3(side * 0.23, -0.08, 0.10),
      new T.Vector3(side * 0.19, -0.26, 0.15),
      new T.Vector3(side * 0.16, -0.40, 0.17)
    ];
    const lappetTube = new T.TubeGeometry(new T.CatmullRomCurve3(lappetPts), 18, 0.048, 10, false);
    lappetTube.scale(1.15, 1, 0.42);
    sculpt(nemesCrown, lappetTube, M.nemesMat);

    // Ponteira de ouro maciço nas abas do Nemes
    sculpt(nemesCrown, new T.CylinderGeometry(0.042, 0.036, 0.035, 12), M.pureGold, [side * 0.184, -0.41, 0.072], [0.15, 0, 0], [1.1, 1, 0.55]);
  }

  // Trança real traseira do Nemes
  sculpt(nemesCrown, new T.CylinderGeometry(0.042, 0.024, 0.36, 14), M.nemesMat, [0, -0.18, -0.24], [0.18, 0, 0]);
  sculpt(nemesCrown, new T.CylinderGeometry(0.028, 0.028, 0.03, 12), M.pureGold, [0, -0.34, -0.27], [0.18, 0, 0]);

  // SERPENTE SAGRADA URAEUS NA TESTA + DISCO SOLAR MONUMENTAL DE RÁ
  const browUraeus = group(nemesCrown, 0, 0.125, 0.205);
  sculpt(browUraeus, new T.CylinderGeometry(0.014, 0.02, 0.11, 10), M.pureGold, [0, 0.04, 0], [-0.15, 0, 0]);
  sculpt(browUraeus, new T.SphereGeometry(0.032, 12, 12), M.pureGold, [0, 0.09, 0.015], [0, 0, 0], [1.15, 1.35, 0.45]);
  sculpt(browUraeus, new T.OctahedronGeometry(0.014, 0), M.turquoise, [0, 0.09, 0.028]);

  // Grande Disco Solar Coroado acima do Elmo Faraônico
  const sunCrownGroup = group(nemesCrown, 0, 0.44, -0.02);

  // Chifres/Suportes reais dourados abraçando a base do Disco Solar
  for (const side of [-1, 1]) {
    const cradleCurve = new T.CatmullRomCurve3([
      new T.Vector3(side * 0.05, -0.20, 0.02),
      new T.Vector3(side * 0.24, -0.10, 0.02),
      new T.Vector3(side * 0.28, 0.10, 0.02),
      new T.Vector3(side * 0.20, 0.26, 0.02)
    ]);
    sculpt(sunCrownGroup, new T.TubeGeometry(cradleCurve, 18, 0.022, 8, false), M.pureGold);
  }

  // Disco Solar Incandescente + Moldura de Ouro Polido
  const sunDisk = group(sunCrownGroup, 0, 0.04, 0.02);
  sculpt(sunDisk, new T.SphereGeometry(0.22, 28, 28), M.solarDiscMat, [0, 0, 0], [0, 0, 0], [1, 1, 0.32]);
  sculpt(sunDisk, new T.TorusGeometry(0.225, 0.024, 12, 40), M.pureGold);

  const sunAura = new T.Mesh(
    new T.SphereGeometry(0.34, 20, 20),
    new T.MeshBasicMaterial({
      color: 0xfacc15,
      transparent: true,
      opacity: 0.48,
      blending: T.AdditiveBlending,
      depthWrite: false
    })
  );
  sunAura.scale.set(1, 1, 0.35);
  sunDisk.add(sunAura);

  // ------------------------------------------------------------------------
  // D. BRAÇOS MAJESTOSOS COM BRACELETES DE OURO E TURQUESA (MÃOS ABERTAS)
  // ------------------------------------------------------------------------
  function createRaArm(isRight) {
    const s = isRight ? 1 : -1;
    const arm = group(torso, s * 0.39, 0.33, -0.008);

    // Ombreira Real em Ouro e Lápis-Lazúli
    sculpt(
      arm,
      new T.SphereGeometry(0.132, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.48),
      M.pureGold,
      [s * 0.01, 0.03, 0],
      [0, 0, s * -0.25],
      [1.08, 0.78, 1.12]
    );

    sculpt(arm, new T.SphereGeometry(0.112, 18, 18), M.skin, [0, -0.01, 0]);
    sculpt(arm, new T.CapsuleGeometry(0.074, 0.26, 12, 16), M.skin, [s * 0.018, -0.17, 0], [0, 0, s * 0.06]);

    // Bracelete superior dourado no bíceps
    const armlet = new T.TorusGeometry(0.078, 0.009, 8, 24);
    armlet.rotateX(Math.PI / 2);
    sculpt(arm, armlet, M.pureGold, [s * 0.015, -0.14, 0]);
    sculpt(arm, armlet, M.turquoise, [s * 0.017, -0.16, 0]);

    const elbow = group(arm, s * 0.035, -0.34, 0);
    sculpt(elbow, new T.CylinderGeometry(0.072, 0.048, 0.31, 18), M.skin, [0, -0.15, 0]);

    // Braçadeira Real de Ouro Polido e Lápis-Lazúli no pulso
    const bracer = group(elbow, 0, -0.23, 0);
    sculpt(bracer, new T.CylinderGeometry(0.058, 0.052, 0.11, 24, 1, true), M.pureGold);
    const bRing = new T.TorusGeometry(0.056, 0.006, 8, 24);
    bRing.rotateX(Math.PI / 2);
    sculpt(bracer, bRing, M.lapisLazuli, [0, 0.05, 0]);
    sculpt(bracer, bRing, M.lapisLazuli, [0, -0.05, 0]);
    sculpt(bracer, new T.OctahedronGeometry(0.016, 0), M.turquoise, [s * 0.058, 0, 0]);

    // Mão aberta em gesto divino de invocação
    const hand = group(elbow, 0, -0.32, 0);
    sculpt(hand, new T.BoxGeometry(0.062, 0.072, 0.030), M.skin, [0, -0.016, 0]);
    const fingerGeo = new T.CapsuleGeometry(0.0085, 0.035, 6, 8);
    for (let f = 0; f < 4; f++) {
      const fx = (f - 1.5) * 0.015;
      sculpt(hand, fingerGeo, M.skin, [fx, -0.054, 0.01], [0.32, 0, (f - 1.5) * 0.05]);
    }
    sculpt(hand, fingerGeo, M.skin, [-s * 0.034, -0.025, 0.018], [0.45, 0, -s * 0.55], [1.05, 0.9, 1.05]);

    return { arm, elbow, hand };
  }

  const rightArm = createRaArm(true);
  const leftArm = createRaArm(false);

  // ------------------------------------------------------------------------
  // E. ARTEFATOS SAGRADOS FLUTUANDO EM PÉ AO LADO DE CADA MÃO!
  // ------------------------------------------------------------------------

  // 1. CETRO WAS (FLUTUANDO EM PÉ AO LADO DA MÃO DIREITA)
  const wasOrbitGroup = new T.Group();
  root.add(wasOrbitGroup);

  const wasScepter = new T.Group();
  wasOrbitGroup.add(wasScepter);

  sculpt(wasScepter, new T.CylinderGeometry(0.02, 0.018, 2.25, 16), M.pureGold, [0, 0, 0]);
  for (const wy of [-0.75, -0.35, 0.15, 0.65, 0.95]) {
    sculpt(wasScepter, new T.CylinderGeometry(0.027, 0.027, 0.036, 16), wy > 0 ? M.turquoise : M.lapisLazuli, [0, wy, 0]);
  }
  sculpt(wasScepter, new T.ConeGeometry(0.026, 0.16, 4), M.pureGold, [-0.028, -1.16, 0], [Math.PI, 0, -0.28]);
  sculpt(wasScepter, new T.ConeGeometry(0.026, 0.16, 4), M.pureGold, [0.028, -1.16, 0], [Math.PI, 0, 0.28]);

  const wasTop = group(wasScepter, 0, 1.15, 0);
  sculpt(wasTop, new T.BoxGeometry(0.065, 0.11, 0.042), M.pureGold, [0, 0.02, 0]);
  sculpt(wasTop, new T.ConeGeometry(0.034, 0.18, 5), M.pureGold, [0, 0.04, 0.09], [1.85, 0, 0], [0.85, 1, 1]);
  sculpt(wasTop, new T.ConeGeometry(0.016, 0.12, 4), M.pureGold, [-0.02, 0.11, -0.03], [-0.45, 0, 0.15]);
  sculpt(wasTop, new T.ConeGeometry(0.016, 0.12, 4), M.pureGold, [0.02, 0.11, -0.03], [-0.45, 0, -0.15]);
  sculpt(wasTop, new T.OctahedronGeometry(0.022, 0), M.turquoise, [0, 0.03, 0.025]);

  const wasEnergyRing = new T.Mesh(
    new T.TorusGeometry(0.16, 0.008, 8, 32),
    new T.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false })
  );
  wasEnergyRing.rotation.x = Math.PI / 2;
  wasEnergyRing.position.y = 0.25;
  wasScepter.add(wasEnergyRing);

  // 2. CHAVE DA VIDA ANKH (FLUTUANDO EM PÉ AO LADO DA MÃO ESQUERDA)
  const ankhOrbitGroup = new T.Group();
  root.add(ankhOrbitGroup);

  const ankhArtifact = new T.Group();
  ankhOrbitGroup.add(ankhArtifact);

  sculpt(ankhArtifact, new T.BoxGeometry(0.055, 0.48, 0.032), M.pureGold, [0, -0.22, 0]);
  sculpt(ankhArtifact, new T.BoxGeometry(0.022, 0.42, 0.038), M.lapisLazuli, [0, -0.22, 0]);

  sculpt(ankhArtifact, new T.BoxGeometry(0.42, 0.055, 0.032), M.pureGold, [0, 0.04, 0]);
  sculpt(ankhArtifact, new T.BoxGeometry(0.36, 0.022, 0.038), M.turquoise, [0, 0.04, 0]);
  sculpt(ankhArtifact, new T.OctahedronGeometry(0.036, 0), M.solarDiscMat, [0, 0.04, 0]);

  const ankhLoop = new T.TorusGeometry(0.125, 0.026, 12, 36);
  sculpt(ankhArtifact, ankhLoop, M.pureGold, [0, 0.22, 0], [0, 0, 0], [0.88, 1.32, 0.75]);

  const ankhInnerGlow = new T.Mesh(
    new T.SphereGeometry(0.11, 16, 14),
    new T.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.55, blending: T.AdditiveBlending, depthWrite: false })
  );
  ankhInnerGlow.position.set(0, 0.22, 0);
  ankhInnerGlow.scale.set(0.85, 1.25, 0.35);
  ankhArtifact.add(ankhInnerGlow);

  // ------------------------------------------------------------------------
  // F. SAIOTE REAL EGÍPCIO (SHENDYT) + AVENTAL CERIMONIAL DE OURO E LÁPIS-LAZÚLI
  // ------------------------------------------------------------------------
  const garments = group(torso, 0, 0, 0);

  const beltGeo = new T.TorusGeometry(0.245, 0.026, 12, 36);
  beltGeo.rotateX(Math.PI / 2);
  sculpt(garments, beltGeo, M.pureGold, [0, -0.34, 0.008], [0.05, 0, -0.03], [1.08, 1, 0.82]);

  const cartouche = group(garments, 0, -0.34, 0.205);
  sculpt(cartouche, new T.CylinderGeometry(0.052, 0.052, 0.024, 20), M.pureGold, [0, 0, 0], [Math.PI / 2, 0, 0], [1.2, 1, 0.9]);
  sculpt(cartouche, new T.OctahedronGeometry(0.028, 0), M.turquoise, [0, 0, 0.014]);

  const skirtGeo = new T.CylinderGeometry(0.245, 0.46, 0.78, 48, 18, true);
  const skPos = skirtGeo.attributes.position;
  const skirtBase = new Float32Array(skPos.array.length);
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (0.39 - y) / 0.78));
    const pleat = Math.sin(angle * 22) * 0.022 * (0.25 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    x = Math.cos(angle) * r * 1.06;
    z = Math.sin(angle) * r * 0.82 - normY * 0.06;
    skPos.setXYZ(i, x, y, z);
    skirtBase[i * 3] = x;
    skirtBase[i * 3 + 1] = y;
    skirtBase[i * 3 + 2] = z;
  }
  skirtGeo.computeVertexNormals();
  const skirtMesh = sculpt(garments, skirtGeo, M.kiltMat, [0, -0.72, 0], [0.04, 0, 0]);

  const apron = group(garments, 0, -0.58, 0.215);
  apron.rotation.x = -0.08;
  sculpt(apron, new T.BoxGeometry(0.16, 0.48, 0.022), M.pureGold);
  sculpt(apron, new T.BoxGeometry(0.11, 0.42, 0.026), M.lapisLazuli);
  for (let r = 0; r < 5; r++) {
    sculpt(apron, new T.BoxGeometry(0.12, 0.024, 0.03), r % 2 === 0 ? M.pureGold : M.turquoise, [0, 0.16 - r * 0.08, 0]);
  }

  return {
    root, body, torso, head, legs,
    rightArm, leftArm,
    wasOrbitGroup, wasScepter, wasEnergyRing,
    ankhOrbitGroup, ankhArtifact, ankhInnerGlow,
    sunDisk, sunAura,
    skirtMesh, skirtBase,
    materials: M
  };
}

const skyMat = new T.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new T.Color(0x0c1938) },
    midColor: { value: new T.Color(0x1d4ed8) },
    horizonColor: { value: new T.Color(0xfde047) },
    wrathFactor: { value: 0.0 },
    sunDir: { value: new T.Vector3(0.45, 0.45, -0.78).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizonColor;
    uniform float wrathFactor;
    uniform vec3 sunDir;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 dayCol = mix(horizonColor, midColor, smoothstep(0.40, 0.66, h));
      dayCol = mix(dayCol, topColor, smoothstep(0.66, 0.96, h));

      vec3 wrCol = mix(vec3(0.98, 0.55, 0.12), vec3(0.24, 0.05, 0.02), smoothstep(0.40, 0.85, h));
      vec3 col = mix(dayCol, wrCol, wrathFactor);

      float sunGlow = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.94, 0.68) * pow(sunGlow, 8.0) * (0.5 + wrathFactor * 0.5);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

function createShadowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;

  const gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  gr.addColorStop(0, 'rgba(60, 36, 12, 0.42)');
  gr.addColorStop(1, 'rgba(60, 36, 12, 0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}

document.querySelectorAll('button[data-m]').forEach((b) => {
  b.addEventListener('click', () => {
    mode = b.dataset.m;
    blessingTimer = 0.08;
    document.querySelectorAll('button[data-m]').forEach((x) => x.classList.toggle('on', x === b));
  });
});

const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusFace = !focusFace;
  btnFocus.classList.toggle('active', focusFace);
  btnFocus.textContent = focusFace ? 'Corpo Inteiro' : 'Focar Elmo Faraônico';
  targetCamDist = focusFace ? 2.65 : 8.4;
  if (focusFace) {
    camAngle = 0.16;
    camPitch = 0.08;
  }
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.22, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.85, 15.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.85, 15.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO
   ========================================================================== */
function update(dt, t) {
  const rx = Math.sin(t * 0.45) * 0.16;
  const rz = Math.cos(t * 0.38) * 0.14;
  const yaw = Math.sin(t * 0.35) * 0.16;
  const hoverY = Math.sin(t * 1.65) * 0.08;

  ra.root.position.set(rx, 0, rz);
  ra.root.rotation.set(0, yaw, 0);
  ra.body.position.y = 1.12 + hoverY;

  if (mode === 'ira') {
    ra.rightArm.arm.rotation.set(-0.42, 0.22, 1.15 + Math.sin(t * 2.2) * 0.05);
    ra.rightArm.elbow.rotation.set(-0.45, 0.2, 0.2);
    ra.leftArm.arm.rotation.set(-0.42, -0.22, -1.15 - Math.cos(t * 2.2) * 0.05);
    ra.leftArm.elbow.rotation.set(-0.45, -0.2, -0.2);
  } else {
    ra.rightArm.arm.rotation.set(-0.28, 0.20, 0.72 + Math.sin(t * 1.6) * 0.04);
    ra.rightArm.elbow.rotation.set(-0.62, 0.25, 0.18);
    ra.leftArm.arm.rotation.set(-0.28, -0.20, -0.72 - Math.cos(t * 1.6) * 0.04);
    ra.leftArm.elbow.rotation.set(-0.62, -0.25, -0.18);
  }

  const artifactBobR = Math.sin(t * 2.4) * 0.08;
  const artifactBobL = Math.cos(t * 2.4) * 0.08;

  ra.wasOrbitGroup.position.set(0.86, 2.02 + hoverY + artifactBobR, 0.24);
  ra.wasScepter.rotation.set(0, Math.sin(t * 0.9) * 0.22, 0);
  ra.wasEnergyRing.rotation.z += dt * 2.8;

  ra.ankhOrbitGroup.position.set(-0.86, 2.08 + hoverY + artifactBobL, 0.24);
  ra.ankhArtifact.rotation.set(0, Math.sin(t * 1.2) * 0.35, 0);
  ra.ankhInnerGlow.scale.set(0.85 + Math.sin(t * 8) * 0.12, 1.25 + Math.sin(t * 8) * 0.12, 0.35);

  const powerBoost = (mode === 'ira' || mode === 'chuva' || mode === 'bencao') ? 1.45 : 1.0;
  ra.sunDisk.scale.setScalar(1 + Math.sin(t * 6) * 0.05 * powerBoost);
  ra.sunAura.scale.set(1.1 + Math.cos(t * 8) * 0.12, 1.1 + Math.cos(t * 8) * 0.12, 0.35);
  solarPoint.position.set(rx, 3.4 + hoverY, rz);
  solarPoint.intensity = 2.4 * powerBoost;

  const skAttr = ra.skirtMesh.geometry.attributes.position;
  for (let i = 0; i < skAttr.count; i++) {
    const bx = ra.skirtBase[i * 3];
    const by = ra.skirtBase[i * 3 + 1];
    const bz = ra.skirtBase[i * 3 + 2];
    const normY = Math.max(0, Math.min(1, (0.39 - by) / 0.78));
    skAttr.setZ(i, bz + Math.sin(t * 2.8 - normY * 3.5 + bx * 4.0) * 0.025 * normY);
  }
  skAttr.needsUpdate = true;
  ra.skirtMesh.geometry.computeVertexNormals();

  if (mode === 'bencao') {
    blessingTimer -= dt;
    if (blessingTimer <= 0) {
      blessingTimer = 0.95;
      spawnSolarWave(rx, rz, 0xfacc15, 6.2);
      spawnSolarWave(rx, rz, 0x06b6d4, 4.5);
    }
  }

  const wrathTarget = (mode === 'ira') ? 1 : 0;
  wrathWeight = T.MathUtils.damp(wrathWeight, wrathTarget, 3.0, dt);
  wrathBeamGroup.visible = wrathWeight > 0.02;
  skyMat.uniforms.wrathFactor.value = wrathWeight;

  if (wrathBeamGroup.visible) {
    const beamAngle = t * 0.75;
    const targetX = rx + Math.sin(beamAngle) * 2.35;
    const targetZ = rz + Math.cos(beamAngle) * 2.35;
    wrathBeamGroup.position.set(targetX, 0, targetZ);
    wrathCore.scale.set(wrathWeight * (1 + Math.sin(t * 22) * 0.12), 1, wrathWeight * (1 + Math.sin(t * 22) * 0.12));
    wrathOuter.scale.set(wrathWeight * (1 + Math.cos(t * 18) * 0.18), 1, wrathWeight * (1 + Math.cos(t * 18) * 0.18));
    if (Math.random() < 0.35) spawnSolarWave(targetX, targetZ, 0xfef08a, 3.8);
    blastLight.position.set(targetX, 1.3, targetZ);
    blastLight.intensity = 12.0 * wrathWeight;
  }

  for (let i = solarWaves.length - 1; i >= 0; i--) {
    const sw = solarWaves[i];
    sw.life -= dt;
    const k = Math.max(0, sw.life / sw.max);
    sw.mesh.scale.setScalar(1 + (1 - k) * sw.maxScale);
    sw.mesh.material.opacity = 0.92 * k;
    if (sw.life <= 0) {
      scene.remove(sw.mesh);
      sw.mesh.geometry.dispose();
      sw.mesh.material.dispose();
      solarWaves.splice(i, 1);
    }
  }

  const dAttr = sunDustGeo.attributes.position;
  const isRain = (mode === 'chuva');
  for (let i = 0; i < SUN_DUST_N; i++) {
    if (isRain) {
      dAttr.setY(i, dAttr.getY(i) - sunDustSpeed[i] * 4.5 * dt);
      if (dAttr.getY(i) < 0.1) dAttr.setY(i, 5.8);
    } else {
      dAttr.setY(i, dAttr.getY(i) + sunDustSpeed[i] * dt);
      dAttr.setX(i, dAttr.getX(i) + Math.sin(t + i) * 0.12 * dt);
      if (dAttr.getY(i) > 5.8) dAttr.setY(i, 0.15);
    }
  }
  dAttr.needsUpdate = true;

  solarFloorRing.rotation.z += dt * 0.18;
  shadowBlob.position.set(rx, 0.015, rz);
  const s = 1.6 - hoverY * 1.4;
  shadowBlob.scale.set(s, s, 1);
  blastLight.intensity = Math.max(0, blastLight.intensity - dt * 15);

  scene.background.lerpColors(daySky, wrathSky, wrathWeight);
  scene.fog.color.copy(scene.background);

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusFace) camAngle += dt * 0.055;

  const desiredTarget = focusFace
    ? new T.Vector3(rx, 3.12 + hoverY, rz)
    : new T.Vector3(0, 1.98, 0);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);
}

const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  update(dt, elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.onload = animate;
</script>
