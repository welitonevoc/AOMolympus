      border-color: #fef08a;

/* ==========================================================================
   2. TEXTURAS PROCEDURAIS PBR EGÍPCIAS (HIERÓGLIFOS, LINHO, PISO & ALVO)
   ========================================================================== */
function createSandstoneTex(bright = false) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bright ? '#f4e6c8' : '#dfc89a';
  ctx.fillRect(0, 0, 512, 512);

  const rows = 12, rowH = 512 / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rowH;
    const cols = 4, colW = 512 / cols;
    const off = (r % 2 === 0) ? 0 : colW * 0.5;
    for (let col = -1; col <= cols; col++) {
      const x = col * colW + off;
      const shade = (bright ? 236 : 216) + Math.floor((Math.random() - 0.5) * 18);
      ctx.fillStyle = `rgba(${shade}, ${shade - 16}, ${shade - 44}, 0.48)`;
      ctx.fillRect(x + 2, y + 2, colW - 4, rowH - 4);
      ctx.strokeStyle = 'rgba(88, 62, 30, 0.34)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, colW - 2, rowH - 2);
    }
    // Faixas sutis de hieróglifos gravados em baixo-relevo a cada 4 fileiras
    if (r === 3 || r === 8) {
      ctx.fillStyle = 'rgba(105, 72, 32, 0.24)';
      ctx.fillRect(0, y + 4, 512, 3);
      ctx.fillRect(0, y + rowH - 7, 512, 3);
      for (let gx = 14; gx < 500; gx += 34) {
        // Símbolos estilizados: Ankh, disco, papiro, onda
        ctx.strokeStyle = 'rgba(95, 65, 28, 0.35)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(gx + 8, y + 16, 4.5, 0, Math.PI * 2);
        ctx.moveTo(gx + 8, y + 21);
        ctx.lineTo(gx + 8, y + 32);
        ctx.moveTo(gx + 3, y + 25);
        ctx.lineTo(gx + 13, y + 25);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(gx + 20, y + 28);
        ctx.lineTo(gx + 25, y + 14);
        ctx.lineTo(gx + 30, y + 28);
        ctx.closePath();
        ctx.stroke();
      }
    }
  }
  for (let i = 0; i < 2200; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,250,235,0.10)' : 'rgba(80,55,25,0.09)';
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
  }
  const tex = new T.CanvasTexture(c);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(2, 2);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createRoofTilesTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d9c49c';
  ctx.fillRect(0, 0, 512, 512);
  const grid = 8, cell = 512 / grid;
  for (let gx = 0; gx < grid; gx++) {
    for (let gy = 0; gy < grid; gy++) {
      const shade = 208 + Math.floor((Math.random() - 0.5) * 22);
      ctx.fillStyle = `rgb(${shade}, ${shade - 14}, ${shade - 36})`;
      ctx.fillRect(gx * cell + 3, gy * cell + 3, cell - 6, cell - 6);
      ctx.strokeStyle = 'rgba(75, 58, 35, 0.44)';
      ctx.lineWidth = 3;
      ctx.strokeRect(gx * cell + 1.5, gy * cell + 1.5, cell - 3, cell - 3);
    }
  }
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createLinenTex(theme) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = theme.linenBase;
  ctx.fillRect(0, 0, 512, 256);

  // Pregas finas do linho egípcio + listras reais alternadas
  for (let x = 0; x < 512; x += 64) {
    ctx.fillStyle = theme.linenStripe;
    ctx.globalAlpha = 0.16;
    ctx.fillRect(x, 0, 26, 256);
    ctx.globalAlpha = 1.0;
  }
  ctx.fillStyle = 'rgba(120, 80, 20, 0.09)';
  for (let x = 0; x < 512; x += 6) ctx.fillRect(x, 0, 2, 256);

  // Barrado cerimonial com pétalas de lótus
  ctx.fillStyle = theme.linenStripe;
  ctx.fillRect(0, 188, 512, 46);
  ctx.fillStyle = theme.linenTrim;
  ctx.fillRect(0, 182, 512, 6);
  ctx.fillRect(0, 234, 512, 6);

  ctx.fillStyle = theme.linenTrim;
  for (let x = 6; x < 512; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x + 6, 194);
    ctx.lineTo(x + 12, 228);
    ctx.lineTo(x, 228);
    ctx.closePath();
    ctx.fill();
  }
  const tex = new T.CanvasTexture(c);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createTargetTex(theme) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const cx = 128, cy = 128;
  const rings = ['#e5c98b', theme.linenStripe, '#f8fafc', theme.linenTrim, '#facc15'];
  const radii = [122, 96, 70, 44, 20];
  rings.forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy, radii[i], 0, Math.PI * 2);
    ctx.fill();
  });
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createGroundTex(theme) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = theme.groundGrass;
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 6200; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(20, 35, 10, 0.14)';
    ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  const dirtGrad = ctx.createRadialGradient(cx, cy, 190, cx, cy, 420);
  dirtGrad.addColorStop(0, theme.groundDirt);
  dirtGrad.addColorStop(0.75, theme.groundDirt);
  dirtGrad.addColorStop(1, 'rgba(200, 167, 114, 0)');
  ctx.fillStyle = dirtGrad;
  ctx.fillRect(0, 0, 1024, 1024);

  // Mosaico circular egípcio ao redor da construção
  ctx.strokeStyle = theme.linenStripe;
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(cx, cy, 352, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = theme.linenTrim;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, 368, 0, Math.PI * 2);
  ctx.stroke();

  // Raios de lajes cerimoniais
  ctx.fillStyle = 'rgba(145, 125, 96, 0.52)';
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const px = cx + Math.cos(a) * 320 - 18;
    const py = cy + Math.sin(a) * 320 - 14;
    ctx.fillRect(px, py, 36, 28);
  }
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

/* ==========================================================================
   3. HELPERS ARQUITETÔNICOS EGÍPCIOS & ELEMENTOS CULTURAIS EXCLUSIVOS
   ========================================================================== */
function grp(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function box(parent, w, h, d, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function cyl(parent, rt, rb, h, segs, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, segs), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

// Pilone Egípcio Monumental com Moldura Torus, Cornija Cavetto e Nichos
function buildPylon(parent, wBot, dBot, h, M, pos = [0, 0, 0], addVents = true) {
  const p = grp(parent, pos[0], pos[1], pos[2]);
  const wTop = wBot * 0.86, dTop = dBot * 0.86;
  const rxB = wBot * 0.5, rzB = dBot * 0.5, rxT = wTop * 0.5, rzT = dTop * 0.5;

  const geo = new T.BufferGeometry();
  const verts = new Float32Array([
    -rxB, 0, rzB,   rxB, 0, rzB,   rxT, h, rzT,
    -rxB, 0, rzB,   rxT, h, rzT,  -rxT, h, rzT,
     rxB, 0, -rzB, -rxB, 0, -rzB, -rxT, h, -rzT,
     rxB, 0, -rzB, -rxT, h, -rzT,  rxT, h, -rzT,
    -rxB, 0, -rzB, -rxB, 0, rzB,  -rxT, h, rzT,
    -rxB, 0, -rzB, -rxT, h, rzT,  -rxT, h, -rzT,
     rxB, 0, rzB,   rxB, 0, -rzB,  rxT, h, -rzT,
     rxB, 0, rzB,   rxT, h, -rzT,  rxT, h, rzT,
    -rxT, h, rzT,   rxT, h, rzT,   rxT, h, -rzT,
    -rxT, h, rzT,   rxT, h, -rzT, -rxT, h, -rzT
  ]);
  const uvs = new Float32Array(30 * 2);
  for (let i = 0; i < 30; i++) {
    uvs[i * 2] = (verts[i * 3] + rxB) / wBot;
    uvs[i * 2 + 1] = verts[i * 3 + 1] / h;
  }
  geo.setAttribute('position', new T.BufferAttribute(verts, 3));
  geo.setAttribute('uv', new T.BufferAttribute(uvs, 2));
  geo.computeVertexNormals();

  const body = new T.Mesh(geo, M.stoneBright);
  body.castShadow = true;
  body.receiveShadow = true;
  p.add(body);

  // Moldura Torus dourada + Cornija Cavetto escalonada
  box(p, wTop + 0.08, 0.06, dTop + 0.08, M.gold, [0, h - 0.01, 0]);
  box(p, wTop + 0.22, 0.13, dTop + 0.22, M.stoneBright, [0, h + 0.07, 0]);
  box(p, wTop + 0.28, 0.08, dTop + 0.28, M.trim, [0, h + 0.16, 0]);
  box(p, wTop + 0.12, 0.05, dTop + 0.12, M.roofTiles, [0, h + 0.22, 0]);

  if (addVents) {
    const count = Math.max(2, Math.floor(wTop / 0.52));
    for (let i = 0; i < count; i++) {
      const vx = -wTop * 0.34 + (count === 1 ? 0 : (i / (count - 1)) * wTop * 0.68);
      box(p, 0.13, 0.18, 0.06, M.dark, [vx, h - 0.36, rzT + 0.015]);
      box(p, 0.13, 0.18, 0.06, M.dark, [vx, h - 0.36, -rzT - 0.015]);
    }
  }
  return p;
}

// Coluna Egípcia de Lótus / Papiro com Capitel Campaniforme e Faixas
function buildLotusColumn(parent, h, M, pos = [0, 0, 0], radius = 0.11, isGold = false) {
  const c = grp(parent, pos[0], pos[1], pos[2]);
  const shaftMat = isGold ? M.gold : M.stoneBright;
  cyl(c, radius * 1.48, radius * 1.60, 0.10, 14, M.stoneBase, [0, 0.05, 0]);
  cyl(c, radius * 0.90, radius * 1.14, h - 0.32, 14, shaftMat, [0, 0.10 + (h - 0.32) * 0.5, 0]);
  cyl(c, radius * 1.05, radius * 1.05, 0.05, 14, M.trim, [0, h - 0.24, 0]);
  cyl(c, radius * 1.08, radius * 1.08, 0.04, 14, M.gold, [0, h - 0.19, 0]);
  cyl(c, radius * 1.72, radius * 1.02, 0.16, 14, shaftMat, [0, h - 0.09, 0]);
  box(c, radius * 2.9, 0.07, radius * 2.9, M.stoneBase, [0, h + 0.02, 0]);
  return c;
}

// Mastro Cerimonial Egípcio com Flâmula Ondulante ao Vento
function buildTempleFlagpole(parent, h, M, flagsList, pos = [0, 0, 0]) {
  const fp = grp(parent, pos[0], pos[1], pos[2]);
  cyl(fp, 0.024, 0.032, h, 8, M.gold, [0, h * 0.5, 0]);
  const orb = new T.Mesh(new T.SphereGeometry(0.055, 10, 10), M.gold);
  orb.position.set(0, h + 0.04, 0);
  fp.add(orb);
  const pennantPivot = grp(fp, 0, h - 0.14, 0.02);
  box(pennantPivot, 0.02, 0.58, 0.26, M.trim, [0, -0.22, 0.14]);
  box(pennantPivot, 0.024, 0.08, 0.28, M.gold, [0, -0.48, 0.14]);
  if (flagsList) flagsList.push({ node: pennantPivot, phase: pos[0] * 1.7 + pos[2] });
  return fp;
}

// Disco Solar Alado com Cobras Uraeus Douradas
function buildWingedSun(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const g = grp(parent, pos[0], pos[1], pos[2]);

  const disk = new T.Mesh(new T.SphereGeometry(0.14, 16, 16), M.gold);
  disk.scale.set(1, 1, 0.45);
  g.add(disk);
  for (const s of [-1, 1]) {
    box(g, 0.42, 0.09, 0.04, M.gold, [s * 0.28, 0.02, 0], [0, 0, s * 0.08]);
    box(g, 0.36, 0.04, 0.05, M.trim, [s * 0.26, -0.03, 0.01], [0, 0, s * 0.08]);
    // Pequenas cobras Uraeus flanqueando o disco
    cyl(g, 0.022, 0.016, 0.14, 8, M.gold, [s * 0.15, -0.06, 0.03], [0, 0, s * -0.22]);
  }
  return g;
}

// Esfinge Egípcia Monumental Guardiã
function buildMiniSphinx(parent, M, pos = [0, 0, 0], rotY = 0, scale = 1.0) {
  const sp = grp(parent, pos[0], pos[1], pos[2]);

  box(sp, 0.58, 0.22, 1.08, M.stoneBase, [0, 0.11, 0]);

  // Corpo de leão deitado
  box(sp, 0.38, 0.32, 0.68, M.statue, [0, 0.42, -0.08]);
  // Patas dianteiras estendidas
  box(sp, 0.11, 0.14, 0.38, M.statue, [-0.14, 0.33, 0.34]);
  box(sp, 0.11, 0.14, 0.38, M.statue, [0.14, 0.33, 0.34]);
  // Cabeça com toucado Nemes dourado e barba faraônica
  const head = new T.Mesh(new T.SphereGeometry(0.14, 14, 14), M.statue);
  head.position.set(0, 0.68, 0.24);
  sp.add(head);
  box(sp, 0.32, 0.26, 0.24, M.gold, [0, 0.64, 0.19]);
  box(sp, 0.05, 0.14, 0.04, M.gold, [0, 0.50, 0.33]);
  return sp;
}

// Obelisco Egípcio com Hieróglifos e Piramídio Dourado
function buildObelisk(parent, h, M, pos = [0, 0, 0]) {
  const o = grp(parent, pos[0], pos[1], pos[2]);
  box(o, 0.46, 0.18, 0.46, M.stoneBase, [0, 0.09, 0]);
  box(o, 0.50, 0.06, 0.50, M.trim, [0, 0.20, 0]);
  cyl(o, 0.11, 0.17, h, 4, M.stoneBright, [0, 0.22 + h * 0.5, 0], [0, Math.PI / 4, 0]);
  box(o, 0.07, h * 0.78, 0.26, M.trim, [0, 0.22 + h * 0.5, 0]);
  const tip = new T.Mesh(new T.ConeGeometry(0.16, 0.36, 4), M.gold);
  tip.position.set(0, 0.22 + h + 0.18, 0);
  tip.rotation.y = Math.PI / 4;

}

// Braseiro Sagrado Egípcio
function buildBrazier(parent, M, flamesList, pos = [0, 0, 0], scale = 1.0) {

  cyl(g, 0.25, 0.13, 0.15, 14, M.gold, [0, 0.58, 0]);

// Estátua Guardiã Divina (Muda cabeça/coroa e símbolo conforme Rá, Ísis ou Set)
function buildGuardian(parent, M, statuesList, pos = [0, 0, 0], scale = 1.0) {
  const g = grp(parent, pos[0], pos[1], pos[2]);
  g.scale.setScalar(scale);

  box(g, 0.68, 0.32, 0.68, M.statue, [0, 0.16, 0]);
  box(g, 0.74, 0.07, 0.74, M.trim, [0, 0.35, 0]);
  box(g, 0.70, 0.05, 0.70, M.gold, [0, 0.41, 0]);

  const fig = grp(g, 0, 0.44, 0);
  cyl(fig, 0.07, 0.055, 0.52, 10, M.statue, [-0.09, 0.26, 0.05], [-0.08, 0, 0]);
  cyl(fig, 0.07, 0.055, 0.52, 10, M.statue, [0.09, 0.26, -0.04], [0.06, 0, 0]);
  cyl(fig, 0.15, 0.20, 0.34, 12, M.trim, [0, 0.54, 0]);
  box(fig, 0.36, 0.40, 0.20, M.statue, [0, 0.90, 0]);
  cyl(fig, 0.18, 0.20, 0.06, 12, M.gold, [0, 1.08, 0]);

  const head = new T.Mesh(new T.SphereGeometry(0.12, 14, 14), M.statue);
  head.position.set(0, 1.24, 0.02);
  fig.add(head);
  box(fig, 0.30, 0.25, 0.20, M.gold, [0, 1.16, -0.02]);

  // ☀️ Rá: Disco Solar + Cobra Uraeus
  const raCrown = grp(fig, 0, 1.46, 0.02);
  const raDisk = new T.Mesh(new T.SphereGeometry(0.14, 14, 14), M.gold);
  raDisk.scale.set(1, 1, 0.35);
  raCrown.add(raDisk);

  // 🪽 Ísis: Chifres Hathóricos + Orbe Turquesa
  const isisHorns = grp(fig, 0, 1.40, 0.02);
  box(isisHorns, 0.028, 0.24, 0.028, M.gold, [-0.12, 0.10, 0], [0, 0, -0.26]);
  box(isisHorns, 0.028, 0.24, 0.028, M.gold, [0.12, 0.10, 0], [0, 0, 0.26]);
  const isisOrb = new T.Mesh(new T.SphereGeometry(0.085, 12, 12), M.vortexOuter);
  isisOrb.position.set(0, 0.10, 0);
  isisHorns.add(isisOrb);
  isisHorns.visible = false;

  // 🐺 Set: Focinho alongado + Orelhas quadradas altas
  const setParts = grp(fig, 0, 1.24, 0.02);
  box(setParts, 0.055, 0.055, 0.24, M.statue, [0, -0.02, 0.13]);
  box(setParts, 0.032, 0.26, 0.045, M.gold, [-0.065, 0.21, -0.02]);
  box(setParts, 0.032, 0.26, 0.045, M.gold, [0.065, 0.21, -0.02]);
  setParts.visible = false;

  cyl(fig, 0.018, 0.018, 1.65, 8, M.gold, [0.24, 0.86, 0.10], [0.10, 0, 0]);

  if (statuesList) statuesList.push({ raCrown, isisHorns, setParts });
  return g;
}

// Kit Exclusivo da Divindade ao Redor de Cada Construção (Rá, Ísis e Set)
// Adiciona elementos 3D únicos para cada deus — não apenas troca de cor!
function attachGodSanctuaryKit(parent, M, godKitsList, flamesList, radius = 2.45) {
  const wrap = grp(parent, 0, 0, 0);

  // ☀️ RÁ: Dois Pilares Solares Dourados com Discos Radiantes e Cobras Uraeus
  const raKit = grp(wrap);
  for (const s of [-1, 1]) {
    const px = s * radius, pz = radius * 0.62;
    const ped = grp(raKit, px, 0, pz);
    box(ped, 0.44, 0.22, 0.44, M.stoneBright, [0, 0.11, 0]);
    cyl(ped, 0.11, 0.15, 0.95, 8, M.stoneBright, [0, 0.68, 0]);
    const sunRing = new T.Mesh(new T.TorusGeometry(0.24, 0.028, 8, 24), M.gold);
    sunRing.position.set(0, 1.42, 0);
    ped.add(sunRing);
    const sunCore = new T.Mesh(new T.SphereGeometry(0.14, 14, 14), M.ember);
    sunCore.position.set(0, 1.42, 0);
    ped.add(sunCore);
  }

  // 🪽 ÍSIS: Dois Espelhos d'Água com Flores de Lótus, Papiros e Cruz Ankh Luminosa
  const isisKit = grp(wrap);
  for (const s of [-1, 1]) {
    const px = s * radius, pz = radius * 0.62;
    const pool = grp(isisKit, px, 0, pz);
    cyl(pool, 0.48, 0.54, 0.18, 18, M.stoneBright, [0, 0.09, 0]);
    cyl(pool, 0.41, 0.41, 0.05, 18, M.water, [0, 0.17, 0]);
    // Flor de lótus dourada/turquesa flutuando
    for (let p = 0; p < 6; p++) {
      const a = (p / 6) * Math.PI * 2;
      const petal = new T.Mesh(new T.ConeGeometry(0.06, 0.18, 4), M.gold);
      petal.position.set(Math.cos(a) * 0.10, 0.22, Math.sin(a) * 0.10);
      petal.rotation.set(0.85, -a, 0);
      pool.add(petal);
    }
    // Cruz Ankh flutuando sobre o espelho d'água
    const ankh = grp(pool, 0, 0.88, 0);
    const loop = new T.Mesh(new T.TorusGeometry(0.10, 0.022, 8, 18), M.vortexOuter);
    loop.position.y = 0.18;
    ankh.add(loop);
    box(ankh, 0.28, 0.04, 0.04, M.gold, [0, 0.04, 0]);
    box(ankh, 0.04, 0.26, 0.04, M.gold, [0, -0.06, 0]);
  }
  isisKit.visible = false;

  // 🐺 SET: Dois Obeliscos Sombrios de Obsidiana em Chamas + Escudos de Guerra
  const setKit = grp(wrap);
  for (const s of [-1, 1]) {
    const px = s * radius, pz = radius * 0.62;
    const ob = grp(setKit, px, 0, pz);
    box(ob, 0.46, 0.20, 0.46, M.obsidian, [0, 0.10, 0]);
    cyl(ob, 0.09, 0.18, 1.35, 4, M.obsidian, [0, 0.88, 0], [0, Math.PI / 4, 0]);
    const tip = new T.Mesh(new T.ConeGeometry(0.12, 0.24, 4), M.ember);
    tip.rotation.y = Math.PI / 4;
    tip.position.set(0, 1.66, 0);
    ob.add(tip);
    const fl = new T.Mesh(new T.ConeGeometry(0.14, 0.36, 8), M.flame);
    fl.position.set(0, 1.92, 0);
    ob.add(fl);
    if (flamesList) flamesList.push(fl);
  }
  setKit.visible = false;

  godKitsList.push({ raKit, isisKit, setKit });
}

function buildPalmTree(parent, h, M, pos = [0, 0, 0], scale = 1.0) {
  const p = grp(parent, pos[0], pos[1], pos[2]);
  p.scale.setScalar(scale);
  cyl(p, 0.07, 0.12, h, 10, M.wood, [0, h * 0.5, 0], [0.05, 0, 0.04]);
  for (let f = 0; f < 7; f++) {
    const a = (f / 7) * Math.PI * 2;
    const frond = new T.Mesh(new T.ConeGeometry(0.18, 0.82, 4), M.foliage);
    frond.position.set(Math.cos(a) * 0.30, h + 0.04, Math.sin(a) * 0.30);
    frond.rotation.set(1.05, -a, 0);
    frond.scale.set(1, 1, 0.24);
    frond.castShadow = true;
    p.add(frond);
  }
  return p;
}

function buildChariotWheel(parent, M, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const w = grp(parent, pos[0], pos[1], pos[2]);
  w.rotation.set(rot[0], rot[1], rot[2]);
  const rim = new T.Mesh(new T.TorusGeometry(0.32, 0.03, 8, 20), M.wood);
  rim.castShadow = true;
  w.add(rim);
  for (let s = 0; s < 3; s++) {
    box(w, 0.60, 0.025, 0.025, M.gold, [0, 0, 0], [0, 0, (s / 3) * Math.PI]);
  }
  return w;
}

function buildEgyptianWarChariot(parent, M, pos = [0, 0, 0], rotY = 0, isRoyal = false) {
  const ch = grp(parent, pos[0], pos[1], pos[2]);
  ch.rotation.y = rotY;
  const bodyMat = isRoyal ? M.gold : M.trim;
  box(ch, 0.72, 0.44, 0.52, bodyMat, [0, 0.52, 0]);
  box(ch, 0.76, 0.06, 0.56, M.gold, [0, 0.75, 0]);
  box(ch, 0.68, 0.05, 0.50, M.wood, [0, 0.30, 0]);
  cyl(ch, 0.025, 0.025, 0.96, 8, M.wood, [0, 0.32, 0], [0, 0, Math.PI / 2]);
  buildChariotWheel(ch, M, [-0.46, 0.32, 0], [0, Math.PI / 2, 0]);
  buildChariotWheel(ch, M, [0.46, 0.32, 0], [0, Math.PI / 2, 0]);
  cyl(ch, 0.022, 0.028, 1.15, 8, M.wood, [0, 0.38, 0.72], [Math.PI / 2 - 0.14, 0, 0]);
  box(ch, 0.58, 0.03, 0.04, M.gold, [0, 0.46, 1.24]);
  // Aljava lateral na biga
  cyl(ch, 0.06, 0.05, 0.38, 8, M.secondary, [0.38, 0.56, 0.12], [0.22, 0, -0.18]);
  return ch;
}

function buildWeaponRack(parent, M, pos = [0, 0, 0], rotY = 0, goldenWeapons = false) {
  const r = grp(parent, pos[0], pos[1], pos[2]);
  r.rotation.y = rotY;
  box(r, 0.90, 0.06, 0.24, M.wood, [0, 0.03, 0]);
  box(r, 0.06, 0.75, 0.06, M.wood, [-0.38, 0.38, 0]);
  box(r, 0.06, 0.75, 0.06, M.wood, [0.38, 0.38, 0]);
  box(r, 0.92, 0.06, 0.06, M.wood, [0, 0.74, 0]);
  const shaftMat = goldenWeapons ? M.gold : M.wood;
  for (let i = -2; i <= 2; i++) {
    cyl(r, 0.012, 0.014, 1.15, 8, shaftMat, [i * 0.14, 0.58, 0.05], [-0.14, 0, 0]);
    const tip = new T.Mesh(new T.ConeGeometry(0.035, 0.16, 4), M.gold);
    tip.position.set(i * 0.14, 1.18, -0.03);
    tip.rotation.x = -0.14;
    r.add(tip);
  }
  const shield = grp(r, 0.56, 0.38, 0.08);
  shield.rotation.x = -0.22;
  box(shield, 0.34, 0.52, 0.03, goldenWeapons ? M.gold : M.trim, [0, 0, 0]);
  cyl(shield, 0.17, 0.17, 0.03, 14, goldenWeapons ? M.gold : M.trim, [0, 0.26, 0], [Math.PI / 2, 0, 0]);
  box(shield, 0.06, 0.58, 0.045, M.trim, [0, 0.08, 0.01]);
  return r;
}

function buildArcheryTarget(parent, M, pos = [0, 0, 0], rotY = 0, scale = 1.0) {
  const t = grp(parent, pos[0], pos[1], pos[2]);
  t.rotation.y = rotY;
  t.scale.setScalar(scale);
  box(t, 0.06, 0.85, 0.06, M.wood, [-0.18, 0.40, -0.10], [0.22, 0, 0]);
  box(t, 0.06, 0.85, 0.06, M.wood, [0.18, 0.40, -0.10], [0.22, 0, 0]);
  const disc = new T.Mesh(new T.CylinderGeometry(0.36, 0.36, 0.08, 24), M.target);
  disc.rotation.set(Math.PI / 2 - 0.18, 0, 0);
  disc.position.set(0, 0.58, 0.04);
  disc.castShadow = true;
  t.add(disc);
  const rim = new T.Mesh(new T.TorusGeometry(0.36, 0.025, 8, 24), M.gold);
  rim.rotation.x = -0.18;
  rim.position.set(0, 0.58, 0.08);
  t.add(rim);
  // Flechas já cravadas no centro do alvo
  cyl(t, 0.008, 0.008, 0.28, 6, M.gold, [0.02, 0.60, 0.18], [Math.PI / 2 - 0.12, 0.06, 0]);
  cyl(t, 0.008, 0.008, 0.26, 6, M.gold, [-0.05, 0.54, 0.17], [Math.PI / 2 - 0.16, -0.08, 0]);
  return t;
}

// Torre de Vigia Única Egípcia com Guaritas Salientes, Seteiras, Pontas de Flechas e Óleo Quente (T4+)
function buildWatchTower(parent, h, M, oilStreamsList, flamesList, pos = [0, 0, 0], scale = 1.0, tier = 3) {
  const tw = grp(parent, pos[0], pos[1], pos[2]);
  tw.scale.setScalar(scale);

  box(tw, 1.50, 0.24, 1.50, M.secondary, [0, 0.12, 0]);
  box(tw, 1.32, 0.16, 1.32, M.stoneBase, [0, 0.32, 0]);
  buildPylon(tw, 1.16, 1.16, h, M, [0, 0.40, 0], tier >= 2);

  if (tier >= 3) {
    box(tw, 1.16, 0.09, 1.16, M.trim, [0, 0.40 + h * 0.52, 0]);
    buildWingedSun(tw, M, [0, 0.40 + h * 0.52, 0.60], 0.88);
  }

  const yBox = 0.40 + h + 0.18;
  const distOut = 0.58;
  const faces = [
    { pos: [0, yBox, distOut], rotY: 0 },
    { pos: [0, yBox, -distOut], rotY: Math.PI },
    { pos: [distOut, yBox, 0], rotY: Math.PI / 2 },
    { pos: [-distOut, yBox, 0], rotY: -Math.PI / 2 }
  ];

  faces.forEach((f, idx) => {
    const ho = grp(tw, f.pos[0], f.pos[1], f.pos[2]);
    ho.rotation.y = f.rotY;
    box(ho, 0.74, 0.48, 0.26, M.stoneBright, [0, 0, 0]);
    box(ho, 0.78, 0.08, 0.30, M.trim, [0, 0.27, 0]);
    for (const sx of [-0.20, 0, 0.20]) {
      box(ho, 0.045, 0.26, 0.05, M.dark, [sx, 0.03, 0.12]);
      const arrow = new T.Mesh(new T.ConeGeometry(0.026, 0.16, 4), M.gold);
      arrow.rotation.x = Math.PI / 2;
      arrow.position.set(sx, 0.03, 0.19);
      ho.add(arrow);
    }

    if (tier >= 4) {
      const cauldron = grp(ho, 0, -0.14, 0.16);
      cyl(cauldron, 0.17, 0.11, 0.15, 12, M.gold, [0, 0, 0], [0.42, 0, 0]);
      const streamH = yBox - 0.26;
      const stream = new T.Mesh(new T.CylinderGeometry(0.055, 0.12, streamH, 10, 1, true), M.oil);
      stream.position.set(0, -streamH * 0.5 - 0.04, 0.08);
      cauldron.add(stream);
      const pool = new T.Mesh(new T.CylinderGeometry(0.30, 0.34, 0.04, 14), M.ember);
      pool.position.set(0, -streamH - 0.03, 0.08);
      cauldron.add(pool);
      if (oilStreamsList) oilStreamsList.push({ stream, pool, phase: idx * 1.5 });
    }
  });

  if (tier >= 3 && tier < 5) {
    buildBrazier(tw, M, flamesList, [0, yBox + 0.30, 0], 0.88);
  }
  if (tier === 5) {
    const cap = new T.Mesh(new T.ConeGeometry(0.45, 0.60, 4), M.gold);
    cap.rotation.y = Math.PI / 4;
    cap.position.set(0, yBox + 0.58, 0);
    tw.add(cap);
  }
  return tw;
}

/* ==========================================================================
   4. CONSTRUTOR ÉPICO DAS 12 EDIFICAÇÕES EGÍPCIAS (RÁ • ÍSIS • SET)

function buildAllEgyptianBuildings(initialGod = 'ra') {
  const theme = EGYPT_GODS[initialGod];

  const M = {

    dark: new T.MeshStandardMaterial({ color: 0x1a140e, roughness: 0.92 }),
    statue: new T.MeshStandardMaterial({ color: theme.statueHex, roughness: 0.42, metalness: 0.24 }),

    cropGold: new T.MeshStandardMaterial({ color: 0xeab308, roughness: 0.64 }),
    cropGreen: new T.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.70 }),
    water: new T.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0369a1, emissiveIntensity: 0.38, roughness: 0.10 }),
    oil: new T.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.88, blending: T.AdditiveBlending, side: T.DoubleSide }),
    ember: new T.MeshStandardMaterial({ color: 0xffffff, emissive: theme.flameHex, emissiveIntensity: 3.5, roughness: 0.18 }),
    flame: new T.MeshBasicMaterial({ color: theme.flameHex, transparent: true, opacity: 0.92, blending: T.AdditiveBlending }),
    vortexOuter: new T.MeshBasicMaterial({ color: theme.vortexOuter, transparent: true, opacity: 0.86, blending: T.AdditiveBlending, side: T.DoubleSide }),
    vortexInner: new T.MeshBasicMaterial({ color: theme.vortexInner, transparent: true, opacity: 0.92, blending: T.AdditiveBlending, side: T.DoubleSide })
  };

  const flames = [];
  const statues = [];
  const flags = [];
  const godKits = [];
  const cranes = [];
  const windmills = [];
  const waterwheels = [];
  const cropClusters = [];
  const vortexPairs = [];
  const gatePivots = [];
  const oilStreams = [];
  const towerFireOrigins = [];

  const buildings = {
    cerco: {}, arsenal: {}, torres: {}, fazenda: {}, titan: {}, mercado: {},
    ferreiro: {}, muralha: {}, quartel: {}, estabulos: {}, arquearia: {}, casa: {}
  };

  // ========================================================================
  // 1. OFICINA DE CERCO (T3 a T5) — HANGAR DUPLO, ARÍETE, ONAGRO E GUINDASTE
  // ========================================================================
  for (let t = 3; t <= 5; t++) {
    const g = new T.Group();
    const bw = 4.2 + (t - 2) * 0.34, bd = 3.8 + (t - 2) * 0.30;
    box(g, bw, 0.20, bd, M.secondary, [0, 0.10, 0]);
    box(g, bw - 0.18, 0.12, bd - 0.18, M.stoneBase, [0, 0.26, 0]);
    box(g, bw - 0.42, 0.04, bd - 0.42, M.roofTiles, [0, 0.34, 0]);

    // Hangar colunado duplo ao fundo
    const hangW = 3.45 + (t - 3) * 0.26;
    const hangH = 1.75 + (t - 3) * 0.18;
    const hangZ = -0.78;
    box(g, hangW, hangH, 0.28, M.stoneBright, [0, 0.32 + hangH * 0.5, hangZ - 0.78]);
    for (const s of [-1, 1]) {
      box(g, 0.28, hangH, 1.56, M.stoneBright, [s * (hangW * 0.5 - 0.14), 0.32 + hangH * 0.5, hangZ]);
    }
    // Colunata frontal dividindo o hangar em duas baias de cerco
    for (const cx of [-hangW * 0.42, 0, hangW * 0.42]) {
      buildLotusColumn(g, hangH, M, [cx, 0.32, hangZ + 0.76], 0.095, t === 5);
    }
    box(g, hangW + 0.26, 0.16, 1.78, M.stoneBright, [0, 0.32 + hangH + 0.08, hangZ]);
    box(g, hangW + 0.34, 0.10, 1.86, M.trim, [0, 0.32 + hangH + 0.20, hangZ]);
    box(g, hangW + 0.14, 0.06, 1.66, M.roofTiles, [0, 0.32 + hangH + 0.28, hangZ]);
    buildWingedSun(g, M, [0, 0.32 + hangH + 0.08, hangZ + 0.92], 1.12);

    // Baia Esquerda: Aríete Blindado Egípcio com Cabeça de Carneiro Dourada
    const ram = grp(g, -0.88, 0.32, 0.28);
    box(ram, 0.78, 0.66, 1.24, M.wood, [0, 0.56, 0]);
    box(ram, 0.86, 0.14, 1.32, M.trim, [0, 0.92, 0]);
    box(ram, 0.72, 0.08, 1.28, M.gold, [0, 1.00, 0]);
    cyl(ram, 0.12, 0.14, 1.65, 12, M.wood, [0, 0.48, 0.18], [Math.PI / 2, 0, 0]);
    const ramHead = new T.Mesh(new T.ConeGeometry(0.18, 0.36, 8), M.gold);
    ramHead.rotation.x = Math.PI / 2;
    ramHead.position.set(0, 0.48, 1.08);
    ram.add(ramHead);
    for (const sx of [-0.44, 0.44]) {
      for (const sz of [-0.38, 0.38]) {
        buildChariotWheel(ram, M, [sx, 0.30, sz], [0, Math.PI / 2, 0]);
      }
    }

    // Baia Direita: Catapulta Onagro Tensionada
    const cata = grp(g, 0.88, 0.32, 0.26);
    box(cata, 0.78, 0.16, 1.18, M.wood, [0, 0.32, 0]);
    box(cata, 0.10, 0.62, 0.14, M.wood, [-0.34, 0.66, -0.10]);
    box(cata, 0.10, 0.62, 0.14, M.wood, [0.34, 0.66, -0.10]);
    box(cata, 0.80, 0.12, 0.14, M.gold, [0, 0.94, -0.10]);
    // Braço de lançamento inclinado com pedra
    const arm = grp(cata, 0, 0.42, 0.28);
    arm.rotation.x = -0.68;
    box(arm, 0.10, 1.05, 0.10, M.wood, [0, 0.46, 0]);
    cyl(arm, 0.16, 0.10, 0.12, 10, M.gold, [0, 0.98, 0.06]);
    const boulder = new T.Mesh(new T.DodecahedronGeometry(0.14, 0), M.stoneBase);
    boulder.position.set(0, 1.08, 0.06);
    arm.add(boulder);
    for (const sx of [-0.44, 0.44]) {
      for (const sz of [-0.36, 0.36]) {
        buildChariotWheel(cata, M, [sx, 0.28, sz], [0, Math.PI / 2, 0]);
      }
    }

    // Guindaste Giratório com Bloco de Pedra Hieroglífico Suspenso
    const craneBase = grp(g, 1.72, 0.32, 1.25);
    cyl(craneBase, 0.24, 0.30, 0.38, 12, M.stoneBright, [0, 0.19, 0]);
    const cranePivot = grp(craneBase, 0, 0.38, 0);
    cyl(cranePivot, 0.08, 0.10, 2.05, 10, t >= 4 ? M.gold : M.wood, [0, 1.02, 0]);
    box(cranePivot, 0.10, 0.10, 1.65, M.wood, [0, 1.92, -0.52], [-0.28, 0, 0]);
    box(cranePivot, 0.28, 0.24, 0.30, M.stoneBase, [0, 1.68, 0.22]); // contrapeso
    cyl(cranePivot, 0.014, 0.014, 0.85, 6, M.gold, [0, 1.68, -1.24]);
    box(cranePivot, 0.42, 0.38, 0.42, M.stoneBright, [0, 1.18, -1.24]);
    box(cranePivot, 0.45, 0.06, 0.45, M.trim, [0, 1.18, -1.24]);
    cranes.push(cranePivot);

    // Pilhas de Munição (Pedras de Catapulta e Dardos de Cerco)
    const ammo = grp(g, -1.62, 0.32, 1.28);
    const ammoCoords = [[0, 0.14, 0], [0.28, 0.14, 0.04], [0.14, 0.14, 0.26], [0.14, 0.36, 0.10]];
    ammoCoords.forEach(([ax, ay, az]) => {
      const rock = new T.Mesh(new T.DodecahedronGeometry(0.15, 0), M.stoneBase);
      rock.position.set(ax, ay, az);
      rock.castShadow = true;
      ammo.add(rock);
    });

    if (t >= 4) {
      buildPylon(g, 0.96, 0.92, hangH + 0.72, M, [-hangW * 0.56, 0.32, hangZ - 0.10], true);
      buildPylon(g, 0.96, 0.92, hangH + 0.72, M, [hangW * 0.56, 0.32, hangZ - 0.10], true);
      buildTempleFlagpole(g, hangH + 1.25, M, flags, [-hangW * 0.56, 0.32, hangZ + 0.48]);
      buildTempleFlagpole(g, hangH + 1.25, M, flags, [hangW * 0.56, 0.32, hangZ + 0.48]);
      buildMiniSphinx(g, M, [-1.45, 0.32, 1.68], 0.16, 0.82);
      buildBrazier(g, M, flames, [0, 0.32, 1.72], 0.95);
    }
    if (t === 5) {
      buildObelisk(g, 2.10, M, [-2.25, 0.32, 1.72]);
      buildObelisk(g, 2.10, M, [2.25, 0.32, 1.72]);
      buildMiniSphinx(g, M, [1.45, 0.32, 1.68], -0.16, 0.82);
      buildGuardian(g, M, statues, [0, 0.32 + hangH + 0.30, hangZ], 0.85);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, bw * 0.62);
    buildings.cerco[t] = g;
  }

  // ========================================================================
  // 2. ARSENAL DIVINO (T2 a T5) — COLUNATA, RELÍQUIA E RASTÉIS DOURADOS
  // ========================================================================
  for (let t = 2; t <= 5; t++) {
    const g = new T.Group();
    const bw = 3.8 + t * 0.34, bd = 3.4 + t * 0.30;
    box(g, bw, 0.20, bd, M.secondary, [0, 0.10, 0]);
    box(g, bw - 0.16, 0.12, bd - 0.16, M.stoneBase, [0, 0.26, 0]);
    box(g, 1.50, 0.10, 0.30, M.stoneBright, [0, 0.05, bd * 0.5 + 0.08]);

    const hallW = 2.85 + t * 0.26, hallH = 1.55 + t * 0.18;
    box(g, hallW, hallH, 1.55, M.stoneBright, [0, 0.32 + hallH * 0.5, -0.58]);
    box(g, hallW + 0.24, 0.12, 1.78, M.trim, [0, 0.32 + hallH + 0.06, -0.58]);
    box(g, hallW + 0.12, 0.06, 1.66, M.roofTiles, [0, 0.32 + hallH + 0.15, -0.58]);

    // Colunata frontal de lótus
    const colCount = t >= 4 ? 6 : 4;
    for (let i = 0; i < colCount; i++) {
      const cx = -hallW * 0.44 + (i / (colCount - 1)) * (hallW * 0.88);
      buildLotusColumn(g, hallH, M, [cx, 0.32, 0.45], 0.088, t >= 4);
    }
    box(g, hallW + 0.18, 0.14, 0.46, M.stoneBright, [0, 0.32 + hallH + 0.05, 0.45]);
    box(g, hallW + 0.24, 0.08, 0.52, M.trim, [0, 0.32 + hallH + 0.15, 0.45]);
    buildWingedSun(g, M, [0, 0.32 + hallH + 0.06, 0.72], 1.05 + t * 0.04);

    // Pedestal Central de Relíquia Sagrada
    const relicPed = grp(g, 0, 0.32, 0.92);
    box(relicPed, 0.66, 0.42, 0.66, M.stoneBright, [0, 0.21, 0]);
    box(relicPed, 0.72, 0.08, 0.72, M.gold, [0, 0.46, 0]);
    const relicOrb = new T.Mesh(new T.OctahedronGeometry(0.22, 0), M.gold);
    relicOrb.position.set(0, 0.86, 0);
    relicPed.add(relicOrb);
    const relicRing = new T.Mesh(new T.TorusGeometry(0.32, 0.025, 8, 24), M.vortexOuter);
    relicRing.position.set(0, 0.86, 0);
    relicPed.add(relicRing);

    // Rastéis de armas douradas flanqueando a entrada
    buildWeaponRack(g, M, [-1.18, 0.32, 1.08], 0.24, true);
    buildWeaponRack(g, M, [1.18, 0.32, 1.08], -0.24, true);

    if (t >= 3) {
      buildPylon(g, 0.92, 0.90, hallH + 0.58, M, [-hallW * 0.55, 0.32, -0.45], true);
      buildPylon(g, 0.92, 0.90, hallH + 0.58, M, [hallW * 0.55, 0.32, -0.45], true);
      buildTempleFlagpole(g, hallH + 1.15, M, flags, [-hallW * 0.55, 0.32, 0.12]);
      buildTempleFlagpole(g, hallH + 1.15, M, flags, [hallW * 0.55, 0.32, 0.12]);
      buildBrazier(g, M, flames, [-0.62, 0.32, 1.48], 0.90);
      buildBrazier(g, M, flames, [0.62, 0.32, 1.48], 0.90);
    }
    if (t >= 4) {
      buildGuardian(g, M, statues, [-1.62, 0.32, 1.25], 0.92);
      buildGuardian(g, M, statues, [1.62, 0.32, 1.25], 0.92);
    }
    if (t === 5) {
      buildPylon(g, 0.90, 0.88, hallH + 0.70, M, [-hallW * 0.55, 0.32, 0.88], true);
      buildPylon(g, 0.90, 0.88, hallH + 0.70, M, [hallW * 0.55, 0.32, 0.88], true);
      buildObelisk(g, 2.05, M, [-2.22, 0.32, 1.65]);
      buildObelisk(g, 2.05, M, [2.22, 0.32, 1.65]);
      buildMiniSphinx(g, M, [-1.05, 0.32, 1.75], 0.14, 0.84);
      buildMiniSphinx(g, M, [1.05, 0.32, 1.75], -0.14, 0.84);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, bw * 0.62);
    buildings.arsenal[t] = g;
  }

  // ========================================================================
  // 3. TORRE DE VIGIA ÚNICA (T1 a T5) — FLECHAS DE FOGO E ÓLEO QUENTE (T4+)
  // ========================================================================
  for (let t = 1; t <= 5; t++) {
    const g = new T.Group();
    const twH = 1.65 + t * 0.42;
    const twScale = 0.95 + t * 0.06;
    buildWatchTower(g, twH, M, oilStreams, flames, [0, 0, 0], twScale, t);
    towerFireOrigins[t] = (0.40 + twH + 0.18) * twScale;

    if (t >= 3) {
      buildTempleFlagpole(g, twH * twScale + 0.85, M, flags, [-0.95, 0, 0.95]);
      buildTempleFlagpole(g, twH * twScale + 0.85, M, flags, [0.95, 0, 0.95]);
    }
    if (t === 5) {
      buildMiniSphinx(g, M, [-1.18, 0, 1.25], 0.25, 0.84);
      buildMiniSphinx(g, M, [1.18, 0, 1.25], -0.25, 0.84);
      buildObelisk(g, 1.85, M, [-1.68, 0, -1.35]);
      buildObelisk(g, 1.85, M, [1.68, 0, -1.35]);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, 2.35);
    buildings.torres[t] = g;
  }

  // ========================================================================
  // 4. FAZENDA DO NILO (T1 a T5) — MOINHO, CANAL, SILO, PÉRGOLA E COLHEITA
  // ========================================================================
  for (let t = 1; t <= 5; t++) {
    const g = new T.Group();
    const bw = 4.4 + t * 0.24, bd = 4.2 + t * 0.22;
    box(g, bw, 0.14, bd, M.secondary, [0, 0.07, 0]);
    box(g, bw - 0.18, 0.08, bd - 0.18, M.stoneBase, [0, 0.18, 0]);

    // Canal de Irrigação em Pedra com Água Corrente, Comporta e Ponte
    box(g, 0.78, 0.22, bd - 0.36, M.stoneBright, [-0.15, 0.22, 0]);
    box(g, 0.56, 0.08, bd - 0.42, M.water, [-0.15, 0.31, 0]);
    // Ponte de pedra e madeira sobre o canal
    box(g, 1.05, 0.10, 0.72, M.wood, [-0.15, 0.38, 0.52]);
    box(g, 1.05, 0.18, 0.06, M.gold, [-0.15, 0.48, 0.85]);
    box(g, 1.05, 0.18, 0.06, M.gold, [-0.15, 0.48, 0.19]);
    // Comporta elevatória no canal
    box(g, 0.08, 0.65, 0.08, M.wood, [-0.52, 0.56, -0.78]);
    box(g, 0.08, 0.65, 0.08, M.wood, [0.22, 0.56, -0.78]);
    box(g, 0.82, 0.08, 0.08, M.gold, [-0.15, 0.86, -0.78]);
    box(g, 0.54, 0.34, 0.05, M.wood, [-0.15, 0.46, -0.78]);

    // Moinho de Vento Giratório de 4 Velas em Linho Egípcio
    const millX = -1.38, millZ = -1.12;
    const millH = 1.68 + t * 0.22;
    const millGrp = grp(g, millX, 0.22, millZ);
    cyl(millGrp, 0.44, 0.64, millH, 12, t >= 4 ? M.stoneBright : M.stoneBase, [0, millH * 0.5, 0]);
    cyl(millGrp, 0.48, 0.48, 0.10, 12, M.trim, [0, millH + 0.04, 0]);
    const cap = new T.Mesh(new T.ConeGeometry(0.50, 0.48, 12), t >= 4 ? M.gold : M.linen);
    cap.position.set(0, millH + 0.32, 0);
    millGrp.add(cap);
    // Hub giratório com 4 velas de linho
    const sailHub = grp(millGrp, 0, millH - 0.14, 0.50);
    cyl(sailHub, 0.09, 0.09, 0.20, 10, M.gold, [0, 0, 0], [Math.PI / 2, 0, 0]);
    for (let s = 0; s < 4; s++) {
      const blade = grp(sailHub, 0, 0, 0);
      blade.rotation.z = (s / 4) * Math.PI * 2;
      box(blade, 0.06, 1.28, 0.04, M.wood, [0, 0.64, 0]);
      box(blade, 0.36, 0.96, 0.02, M.linen, [0.18, 0.72, 0.02]);
    }
    windmills.push(sailHub);

    // Silo Cônico de Grãos + Pérgola Sombreada de Colheita
    const silo = grp(g, 1.22, 0.22, -1.18);
    const sH = 1.15 + t * 0.14;
    cyl(silo, 0.46, 0.56, sH, 16, M.stoneBright, [0, sH * 0.5, 0]);
    cyl(silo, 0.52, 0.52, 0.08, 16, M.trim, [0, sH * 0.85, 0]);
    const sDome = new T.Mesh(new T.SphereGeometry(0.46, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), t >= 4 ? M.gold : M.stoneBase);
    sDome.position.set(0, sH, 0);
    silo.add(sDome);
    if (t >= 3) buildWingedSun(silo, M, [0, sH * 0.65, 0.54], 0.72);

    // Pérgola de Sombra com Sacos de Grãos e Ânforas
    const perg = grp(g, 1.22, 0.22, 0.18);
    for (const px of [-0.46, 0.46]) {
      for (const pz of [-0.36, 0.36]) buildLotusColumn(perg, 1.08, M, [px, 0, pz], 0.055);
    }
    box(perg, 1.15, 0.06, 0.95, M.linen, [0, 1.12, 0], [0.10, 0, 0]);
    cyl(perg, 0.16, 0.19, 0.34, 10, M.cropGold, [-0.22, 0.17, 0.08]);
    cyl(perg, 0.15, 0.18, 0.30, 10, M.cropGold, [0.08, 0.15, 0.14]);
    cyl(perg, 0.10, 0.07, 0.36, 10, M.secondary, [0.34, 0.18, -0.06]);

    // Canteiros Orgânicos de Trigo Dourado e Linho Ondulantes ao Vento
    const beds = [
      { cx: -1.35, cz: 0.78, mat: M.cropGold },
      { cx: 1.15,  cz: 1.32, mat: M.cropGreen },
      { cx: -1.35, cz: 1.56, mat: M.cropGreen }
    ];
    beds.forEach((b, bi) => {
      box(g, 1.48, 0.10, 0.68, M.secondary, [b.cx, 0.25, b.cz]);
      for (let r = -2; r <= 2; r++) {
        for (let c = -1; c <= 1; c++) {
          const stalkPivot = grp(g, b.cx + r * 0.26, 0.30, b.cz + c * 0.20);
          const hStalk = 0.36 + ((r + c + bi) % 3) * 0.06;
          cyl(stalkPivot, 0.015, 0.032, hStalk, 6, b.mat, [0, hStalk * 0.5, 0]);
          const headMesh = new T.Mesh(new T.ConeGeometry(0.055, 0.16, 5), b.mat);
          headMesh.position.y = hStalk + 0.05;
          stalkPivot.add(headMesh);
          cropClusters.push({ node: stalkPivot, phase: (r * 0.7 + c * 1.1 + bi) });
        }
      }
    });

    // Espantalho Egípcio no Canteiro
    const scare = grp(g, -0.92, 0.22, 0.96);
    cyl(scare, 0.025, 0.03, 0.95, 8, M.wood, [0, 0.47, 0]);
    box(scare, 0.64, 0.05, 0.05, M.wood, [0, 0.70, 0]);
    box(scare, 0.24, 0.36, 0.16, M.linen, [0, 0.58, 0]);
    const sHead = new T.Mesh(new T.SphereGeometry(0.11, 10, 10), M.cropGold);
    sHead.position.y = 0.90;
    scare.add(sHead);

    if (t >= 3) {
      buildPalmTree(g, 1.55, M, [-1.95, 0.22, -0.15], 0.95);
      buildPalmTree(g, 1.70, M, [1.98, 0.22, -0.65], 1.0);
    }
    if (t >= 4) {
      buildGuardian(g, M, statues, [0.52, 0.22, -1.48], 0.85);
    }
    if (t === 5) {
      buildObelisk(g, 1.95, M, [2.05, 0.22, 1.55]);
      buildBrazier(g, M, flames, [-0.72, 0.22, 1.85], 0.92);
      buildBrazier(g, M, flames, [0.42, 0.22, 1.85], 0.92);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, bw * 0.58);
    buildings.fazenda[t] = g;
  }

  // ========================================================================
  // 5. PORTAL DO TITÃ (T4 a T5) — ESCAVAÇÃO, PILONES COLOSSAIS E VÓRTICE DUPLO
  // ========================================================================
  for (let t = 4; t <= 5; t++) {
    const g = new T.Group();
    const bw = 4.8 + (t - 4) * 0.5, bd = 4.6 + (t - 4) * 0.45;
    box(g, bw, 0.24, bd, M.secondary, [0, 0.12, 0]);
    box(g, bw - 0.22, 0.14, bd - 0.22, M.stoneBase, [0, 0.31, 0]);

    // Fosso escavado abissal no centro
    cyl(g, 1.65, 1.48, 0.12, 24, M.dark, [0, 0.35, -0.10]);
    const pitRim = new T.Mesh(new T.TorusGeometry(1.68, 0.10, 8, 32), M.gold);
    pitRim.rotation.x = Math.PI / 2;
    pitRim.position.set(0, 0.41, -0.10);
    g.add(pitRim);

    // Escadaria ritual frontal
    for (let s = 0; s < 4; s++) {
      box(g, 1.85 - s * 0.12, 0.10, 0.36, M.stoneBright, [0, 0.05 + s * 0.09, bd * 0.46 - s * 0.22]);
    }

    // Pilones colossais formando o portal
    const pH = 3.15 + (t - 4) * 0.55;
    buildPylon(g, 1.38, 1.28, pH, M, [-1.52, 0.38, -0.15], true);
    buildPylon(g, 1.38, 1.28, pH, M, [1.52, 0.38, -0.15], true);
    // Arquitrave colossal + Disco Solar Alado gigante
    box(g, 4.35, 0.34, 1.15, M.stoneBright, [0, 0.38 + pH + 0.10, -0.15]);
    box(g, 4.48, 0.14, 1.26, M.trim, [0, 0.38 + pH + 0.32, -0.15]);
    buildWingedSun(g, M, [0, 0.38 + pH + 0.12, 0.48], 1.55);

    // Vórtice Duplo Contra-Rotativo dentro do Portal
    const vGrp = grp(g, 0, 1.85 + (t - 4) * 0.22, -0.15);
    const outerRing = new T.Mesh(new T.TorusGeometry(1.08, 0.10, 10, 32), M.vortexOuter);
    const innerRing = new T.Mesh(new T.TorusGeometry(0.72, 0.08, 10, 28), M.vortexInner);
    const core = new T.Mesh(new T.OctahedronGeometry(0.42, 1), M.ember);
    vGrp.add(outerRing, innerRing, core);
    vortexPairs.push({ outer: outerRing, inner: innerRing, core });

    buildTempleFlagpole(g, pH + 1.05, M, flags, [-1.52, 0.38, 0.58]);
    buildTempleFlagpole(g, pH + 1.05, M, flags, [1.52, 0.38, 0.58]);
    buildMiniSphinx(g, M, [-1.45, 0.38, 1.55], 0.18, 0.92);
    buildMiniSphinx(g, M, [1.45, 0.38, 1.55], -0.18, 0.92);
    buildBrazier(g, M, flames, [-0.88, 0.38, 1.82], 1.05);
    buildBrazier(g, M, flames, [0.88, 0.38, 1.82], 1.05);

    if (t === 5) {
      buildPylon(g, 1.10, 1.05, pH * 0.84, M, [-1.95, 0.38, -1.35], true);
      buildPylon(g, 1.10, 1.05, pH * 0.84, M, [1.95, 0.38, -1.35], true);
      buildObelisk(g, 2.35, M, [-2.35, 0.38, 1.58]);
      buildObelisk(g, 2.35, M, [2.35, 0.38, 1.58]);
      buildGuardian(g, M, statues, [-2.18, 0.38, 0.35], 1.02);
      buildGuardian(g, M, statues, [2.18, 0.38, 0.35], 1.02);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, bw * 0.62);
    buildings.titan[t] = g;
  }

  // ========================================================================
  // 6. MERCADO DO OÁSIS (T3 a T5) — 4 BARRACAS LISTRADAS, SACADA E BALANÇA
  // ========================================================================
  for (let t = 3; t <= 5; t++) {
    const g = new T.Group();
    const bw = 4.2 + (t - 2) * 0.34, bd = 3.8 + (t - 2) * 0.30;
    box(g, bw, 0.20, bd, M.secondary, [0, 0.10, 0]);
    box(g, bw - 0.16, 0.12, bd - 0.16, M.stoneBase, [0, 0.26, 0]);
    box(g, 2.10, 0.03, 2.55, M.linen, [0, 0.33, 0.28]); // tapete cerimonial

    // Edifício Mercantil ao Fundo com Sacada Colunada Superior
    const hallW = 3.05 + (t - 3) * 0.28, hallH = 1.65 + (t - 3) * 0.16;
    box(g, hallW, hallH, 1.25, M.stoneBright, [0, 0.32 + hallH * 0.5, -1.02]);
    box(g, hallW + 0.24, 0.12, 1.48, M.trim, [0, 0.32 + hallH + 0.06, -1.02]);
    // Sacada superior projetada à frente com colunas de lótus e balaustrada
    const balcY = 0.32 + hallH * 0.56;
    box(g, hallW * 0.88, 0.10, 0.58, M.stoneBright, [0, balcY, -0.14]);
    box(g, hallW * 0.88, 0.24, 0.06, M.gold, [0, balcY + 0.16, 0.12]);
    for (const bx of [-hallW * 0.36, -hallW * 0.12, hallW * 0.12, hallW * 0.36]) {
      buildLotusColumn(g, hallH * 0.46, M, [bx, balcY + 0.05, 0.10], 0.055, t === 5);
    }
    buildWingedSun(g, M, [0, 0.32 + hallH + 0.06, -0.22], 1.05);

    // 4 Barracas Listradas de Linho Egípcio com Mercadorias, Ânforas e Ouro
    const stallPos = [
      [-1.38, -0.05], [1.38, -0.05],
      [-1.38,  1.05], [1.38,  1.05]
    ];
    stallPos.forEach(([sx, sz], idx) => {
      const st = grp(g, sx, 0.32, sz);
      buildLotusColumn(st, 1.15, M, [-0.38, 0, 0.32], 0.055);
      buildLotusColumn(st, 1.15, M, [0.38, 0, 0.32], 0.055);
      buildLotusColumn(st, 1.15, M, [-0.38, 0, -0.32], 0.055);
      buildLotusColumn(st, 1.15, M, [0.38, 0, -0.32], 0.055);
      box(st, 0.96, 0.06, 0.86, M.linen, [0, 1.20, 0], [0.16, 0, 0]);
      box(st, 0.78, 0.34, 0.44, M.wood, [0, 0.17, 0.05]);
      box(st, 0.22, 0.18, 0.22, M.gold, [-0.18, 0.43, 0.05]);
      cyl(st, 0.10, 0.06, 0.30, 10, idx % 2 === 0 ? M.secondary : M.trim, [0.18, 0.48, 0.05]);
    });

    // Balança de Ma'at em Ouro no Centro do Mercado
    const scaleStand = grp(g, 0, 0.32, 0.78);
    box(scaleStand, 0.68, 0.42, 0.48, M.stoneBright, [0, 0.21, 0]);
    box(scaleStand, 0.72, 0.06, 0.52, M.trim, [0, 0.44, 0]);
    cyl(scaleStand, 0.022, 0.032, 0.46, 8, M.gold, [0, 0.68, 0]);
    box(scaleStand, 0.50, 0.025, 0.025, M.gold, [0, 0.88, 0]);
    cyl(scaleStand, 0.09, 0.04, 0.04, 10, M.gold, [-0.22, 0.76, 0]);
    cyl(scaleStand, 0.09, 0.04, 0.04, 10, M.gold, [0.22, 0.76, 0]);

    if (t >= 4) {
      buildPylon(g, 0.92, 0.88, hallH + 0.68, M, [-hallW * 0.56, 0.32, -0.95], true);
      buildPylon(g, 0.92, 0.88, hallH + 0.68, M, [hallW * 0.56, 0.32, -0.95], true);
      buildTempleFlagpole(g, hallH + 1.15, M, flags, [-hallW * 0.56, 0.32, -0.42]);
      buildTempleFlagpole(g, hallH + 1.15, M, flags, [hallW * 0.56, 0.32, -0.42]);
      buildGuardian(g, M, statues, [0, 0.32, -0.18], 0.88);
    }
    if (t === 5) {
      buildObelisk(g, 2.05, M, [-2.12, 0.32, 1.65]);
      buildObelisk(g, 2.05, M, [2.12, 0.32, 1.65]);
      buildMiniSphinx(g, M, [-0.88, 0.32, 1.72], 0.14, 0.82);
      buildMiniSphinx(g, M, [0.88, 0.32, 1.72], -0.14, 0.82);
      buildBrazier(g, M, flames, [-1.45, 0.32, 1.72], 0.95);
      buildBrazier(g, M, flames, [1.45, 0.32, 1.72], 0.95);
    }
    attachGodSanctuaryKit(g, M, godKits, flames, bw * 0.62);
    buildings.mercado[t] = g;
  }

  // ========================================================================
  // 7. FERREIRO & ALTO-FORNO (T2 a T5) — ARQUITETURA PROFUNDA E MONUMENTAL
  // ========================================================================
  for (let t = 2; t <= 5; t++) {
    const g = new T.Group();
    const bw = 4.1 + t * 0.34, bd = 3.8 + t * 0.32;

    // 1. Fundação escalonada de arenito com escadaria frontal e piso de lajes
    box(g, bw, 0.20, bd, M.secondary, [0, 0.10, 0]);
    box(g, bw - 0.18, 0.14, bd - 0.18, M.stoneBase, [0, 0.27, 0]);
    box(g, bw - 0.42, 0.04, bd - 0.42, M.roofTiles, [0, 0.35, 0]);
    // Escadaria frontal de entrada
    box(g, 1.55, 0.12, 0.32, M.stoneBright, [0, 0.06, bd * 0.5 + 0.10]);
    box(g, 1.35, 0.12, 0.22, M.stoneBright, [0, 0.18, bd * 0.5 - 0.02]);

    // 2. Salão de Forja com Profundidade Real (Paredes Laterais Recuadas, Fundo Espesso e Pórtico Aberto)
    const hallW = 2.65 + t * 0.24;
    const hallH = 1.62 + t * 0.18;
    const hallD = 1.75;
    const hallZ = -0.68;

    // Parede traseira espessa com nicho interno escurecido
    box(g, hallW, hallH, 0.34, M.stoneBright, [0, 0.34 + hallH * 0.5, hallZ - hallD * 0.5]);
    box(g, hallW * 0.72, hallH * 0.65, 0.12, M.dark, [0, 0.34 + hallH * 0.38, hallZ - hallD * 0.5 + 0.16]);
    // Paredes laterais profundas com contrafortes externos
    for (const s of [-1, 1]) {
      box(g, 0.32, hallH, hallD, M.stoneBright, [s * (hallW * 0.5 - 0.16), 0.34 + hallH * 0.5, hallZ]);
      box(g, 0.14, hallH * 0.85, 0.38, M.stoneBase, [s * (hallW * 0.5 + 0.06), 0.34 + hallH * 0.42, hallZ - 0.35]);
      box(g, 0.14, hallH * 0.85, 0.38, M.stoneBase, [s * (hallW * 0.5 + 0.06), 0.34 + hallH * 0.42, hallZ + 0.35]);
    }
    // Colunata frontal de lótus sustentando a arquitrave do salão aberto
    const colCount = t >= 4 ? 4 : 3;
    for (let i = 0; i < colCount; i++) {
      const cx = -hallW * 0.38 + (i / (colCount - 1)) * (hallW * 0.76);
      buildLotusColumn(g, hallH, M, [cx, 0.34, hallZ + hallD * 0.5], 0.095, t === 5);
    }
    // Arquitrave pesada + Cornija Cavetto + Cobertura em lajes
    box(g, hallW + 0.26, 0.18, hallD + 0.26, M.stoneBright, [0, 0.34 + hallH + 0.09, hallZ]);
    box(g, hallW + 0.34, 0.10, hallD + 0.34, M.trim, [0, 0.34 + hallH + 0.22, hallZ]);
    box(g, hallW + 0.14, 0.06, hallD + 0.14, M.roofTiles, [0, 0.34 + hallH + 0.30, hallZ]);

    // Clerestório / Segundo nível de exaustão (T3+)
    if (t >= 3) {
      const clH = 0.56 + (t - 3) * 0.10;
      box(g, hallW * 0.68, clH, hallD * 0.62, M.stoneBright, [0, 0.34 + hallH + 0.32 + clH * 0.5, hallZ - 0.08]);
      box(g, hallW * 0.74, 0.09, hallD * 0.68, M.trim, [0, 0.34 + hallH + 0.32 + clH + 0.04, hallZ - 0.08]);
      for (const vx of [-0.45, 0, 0.45]) {
        box(g, 0.22, 0.22, 0.06, M.dark, [vx, 0.34 + hallH + 0.32 + clH * 0.5, hallZ - 0.08 + hallD * 0.31 + 0.01]);
      }
      buildWingedSun(g, M, [0, 0.34 + hallH + 0.10, hallZ + hallD * 0.5 + 0.16], 1.05 + (t - 3) * 0.08);
    } else {
      buildWingedSun(g, M, [0, 0.34 + hallH + 0.10, hallZ + hallD * 0.5 + 0.16], 0.90);
    }

    // 3. Alto-Forno Monumental Interno/Frontal com Chaminé-Pilone, Cadinho Incandescente e Canal de Metal Fundido
    const chimH = 2.35 + t * 0.36;
    buildPylon(g, 1.05, 1.05, chimH, M, [-hallW * 0.28, 0.34, hallZ - 0.18], false);
    // Brilho de fogo no topo da chaminé
    const topFire = new T.Mesh(new T.ConeGeometry(0.22, 0.48, 8), M.flame);
    topFire.position.set(-hallW * 0.28, 0.34 + chimH + 0.42, hallZ - 0.18);
    g.add(topFire);
    flames.push(topFire);

    const furnace = grp(g, -hallW * 0.28, 0.34, 0.44);
    box(furnace, 1.18, 0.96, 0.94, M.stoneBase, [0, 0.48, 0]);
    box(furnace, 1.30, 0.12, 1.04, M.trim, [0, 1.00, 0]);
    // Boca arqueada escura do alto-forno com brasas vivas e cadinho
    box(furnace, 0.72, 0.56, 0.20, M.dark, [0, 0.46, 0.40]);
    box(furnace, 0.80, 0.08, 0.22, M.gold, [0, 0.76, 0.41]);
    const emberCore = new T.Mesh(new T.DodecahedronGeometry(0.36, 1), M.ember);
    emberCore.scale.set(1.22, 0.78, 1.05);
    emberCore.position.set(0, 0.44, 0.34);
    furnace.add(emberCore);
    // Fole duplo de madeira e couro acoplado na lateral do forno
    box(furnace, 0.44, 0.26, 0.38, M.wood, [-0.78, 0.34, 0.10], [0, 0, -0.22]);
    box(furnace, 0.46, 0.06, 0.40, M.gold, [-0.78, 0.46, 0.10], [0, 0, -0.22]);
    // Calha de metal fundido descendo do alto-forno até a forma de lingotes (T3+)
    if (t >= 3) {
      box(furnace, 0.18, 0.08, 0.62, M.stoneBase, [0, 0.24, 0.72], [0.22, 0, 0]);
      box(furnace, 0.10, 0.05, 0.58, M.ember, [0, 0.27, 0.72], [0.22, 0, 0]);
      box(furnace, 0.46, 0.14, 0.34, M.stoneBright, [0, 0.07, 1.04]);
      box(furnace, 0.32, 0.06, 0.20, M.ember, [0, 0.14, 1.04]);
    }

    // 4. Aqueduto de Pedra com Pilares e Roda Hidráulica Giratória na Lateral Esquerda
    const wheelX = -hallW * 0.5 - 0.36;
    const wheelGroup = grp(g, wheelX, 0.96, -0.22);
    // Pilares de sustentação do aqueduto
    box(wheelGroup, 0.30, 1.24, 0.28, M.stoneBase, [0, 0.02, -0.95]);
    box(wheelGroup, 0.30, 1.24, 0.28, M.stoneBase, [0, 0.02, -0.35]);
    // Calha elevada de pedra + água corrente caindo na roda
    box(wheelGroup, 0.38, 0.16, 1.38, M.stoneBright, [0, 0.66, -0.58]);
    box(wheelGroup, 0.26, 0.06, 1.34, M.water, [0, 0.75, -0.58]);
    // Jato d'água caindo sobre as pás
    box(wheelGroup, 0.20, 0.62, 0.10, M.water, [0, 0.38, 0.04]);
    // Canal inferior de pedra recolhendo a água
    box(wheelGroup, 0.44, 0.20, 2.25, M.stoneBase, [0, -0.52, 0.28]);
    box(wheelGroup, 0.32, 0.06, 2.15, M.water, [0, -0.41, 0.28]);

    const wheel = grp(wheelGroup, 0, 0, 0);

  // ========================================================================
  // 12. CASA DA POPULAÇÃO (T1 a T5 — UMA ÚNICA CASA EVOLUTIVA, LINDA NA T1)
  // ========================================================================
  const houseRoot = new T.Group();
  const hPlat1 = box(houseRoot, 2.60, 0.16, 2.40, M.stoneBase, [0, 0.08, 0]);
  const hPlat2 = box(houseRoot, 2.40, 0.10, 2.20, M.stoneBright, [0, 0.21, 0]);

  box(hFrontFacade, 0.56, 0.92, 0.12, M.wood, [0, 0.72, 0.04]);
  box(hFrontFacade, 0.04, 0.92, 0.14, M.gold, [0, 0.72, 0.05]);
  box(hFrontFacade, 0.70, 1.02, 0.08, M.gold, [0, 0.77, 0.02]);
  box(hFrontFacade, 0.78, 0.09, 0.14, M.trim, [0, 1.28, 0.05]);
  buildWingedSun(hFrontFacade, M, [0, 1.42, 0.07], 0.76);

  buildLotusColumn(hFrontFacade, 1.28, M, [-0.62, 0.26, 0.34], 0.070);
  buildLotusColumn(hFrontFacade, 1.28, M, [0.62, 0.26, 0.34], 0.070);
  box(hFrontFacade, 1.50, 0.05, 0.56, M.linen, [0, 1.52, 0.22], [0.18, 0, 0]);

  box(hFrontFacade, 0.34, 0.26, 0.08, M.dark, [-0.58, 1.20, 0.02]);
  box(hFrontFacade, 0.34, 0.26, 0.08, M.dark, [0.58, 1.20, 0.02]);
  cyl(hFrontFacade, 0.11, 0.07, 0.34, 12, M.secondary, [0.88, 0.43, 0.24]);
  cyl(hFrontFacade, 0.09, 0.06, 0.28, 12, M.gold, [1.06, 0.40, 0.18]);

  const hStairs = grp(houseRoot, -1.06, 0.26, 0.02);
  for (let s = 0; s < 5; s++) {
    box(hStairs, 0.28, 0.24 + s * 0.24, 0.24, M.stoneBright, [0, (0.24 + s * 0.24) * 0.5, 0.45 - s * 0.22]);
  }

  const hT2Group = grp(hFrontFacade, 0, 0, 0);
  box(hT2Group, 0.68, 0.22, 0.28, M.stoneBase, [-0.74, 0.37, 0.46]);
  box(hT2Group, 0.68, 0.22, 0.28, M.stoneBase, [0.74, 0.37, 0.46]);
  for (const jx of [-0.84, -0.64, 0.64, 0.84]) {
    const bush = new T.Mesh(new T.SphereGeometry(0.14, 8, 8), M.foliage);
    bush.position.set(jx, 0.52, 0.46);
    hT2Group.add(bush);
  }

  const hT3Group = grp(houseRoot, 0, 0, 0);
  box(hT3Group, 1.44, 0.98, 1.20, M.stoneBright, [0, 2.20, -0.18]);
  box(hT3Group, 1.60, 0.10, 1.36, M.trim, [0, 2.74, -0.18]);
  box(hT3Group, 1.50, 0.06, 1.26, M.roofTiles, [0, 2.82, -0.18]);
  // Porta do segundo pavimento abrindo para a varanda
  box(hT3Group, 0.44, 0.72, 0.10, M.wood, [0, 2.08, 0.42]);
  box(hT3Group, 0.54, 0.78, 0.07, M.gold, [0, 2.11, 0.41]);
  buildLotusColumn(hT3Group, 0.98, M, [-0.62, 1.74, 0.64], 0.065);
  buildLotusColumn(hT3Group, 0.98, M, [0.62, 1.74, 0.64], 0.065);
  box(hT3Group, 1.46, 0.05, 0.62, M.linen, [0, 2.66, 0.56], [0.18, 0, 0]);

  const hT4Group = grp(houseRoot, 0, 0, 0);
  buildPalmTree(hT4Group, 1.42, M, [-1.50, 0.26, 1.00], 0.92);
  buildPalmTree(hT4Group, 1.60, M, [1.50, 0.26, -0.78], 1.0);
  // Muro do pátio com abertura central ampla para a porta da casa
  box(hT4Group, 1.15, 0.52, 0.16, M.stoneBright, [-1.14, 0.52, 1.54]);
  box(hT4Group, 1.15, 0.52, 0.16, M.stoneBright, [1.14, 0.52, 1.54]);
  box(hT4Group, 0.16, 0.52, 2.98, M.stoneBright, [-1.68, 0.52, 0.05]);
  box(hT4Group, 0.16, 0.52, 2.98, M.stoneBright, [1.68, 0.52, 0.05]);

  const hT5Group = grp(houseRoot, 0, 0, 0);
  buildPylon(hT5Group, 0.76, 0.70, 1.76, M, [-0.82, 0.26, 1.50], false);
  buildPylon(hT5Group, 0.76, 0.70, 1.76, M, [0.82, 0.26, 1.50], false);
  buildBrazier(hT5Group, M, flames, [-0.82, 0.26, 2.02], 0.84);
  buildBrazier(hT5Group, M, flames, [0.82, 0.26, 2.02], 0.84);
  const hFinial = new T.Mesh(new T.ConeGeometry(0.28, 0.50, 4), M.gold);
  hFinial.position.set(0, 3.10, -0.18);
  hFinial.rotation.y = Math.PI / 4;
  hT5Group.add(hFinial);

  attachGodSanctuaryKit(houseRoot, M, godKits, flames, 2.15);

  function setHouseTier(tier) {
    const scaleXZ = 0.92 + tier * 0.06;
    const scaleY = 0.96 + tier * 0.03;
    hPlat1.scale.set(scaleXZ * 1.15, 1, scaleXZ * 1.15);
    hPlat2.scale.set(scaleXZ * 1.12, 1, scaleXZ * 1.12);
    hMainBody.scale.set(scaleXZ, scaleY, scaleXZ);
    hCornice.scale.set(scaleXZ, 1, scaleXZ);
    hRoof.scale.set(scaleXZ, 1, scaleXZ);

    // Mantém a fachada (porta, moldura dourada, janelas, pórtico e disco solar) sempre rente à parede frontal!
    hFrontFacade.position.z = -0.10 + (1.56 * 0.5) * scaleXZ;
    hStairs.position.x = -(1.82 * 0.5) * scaleXZ - 0.16;

    hT2Group.visible = tier >= 2;
    hT3Group.visible = tier >= 3;
    hT4Group.visible = tier >= 4;
    hT5Group.visible = tier >= 5;
  }
  setHouseTier(3);
  buildings.casa = { root: houseRoot, setTier: setHouseTier };

  // Agrupamento geral
  const root = new T.Group();
  Object.keys(buildings).forEach(bKey => {
    if (bKey === 'casa') root.add(buildings.casa.root);
    else Object.values(buildings[bKey]).forEach(grpTier => root.add(grpTier));
  });

  const auraRing = new T.Mesh(
    new T.RingGeometry(3.05, 3.38, 64),
    new T.MeshBasicMaterial({
      color: theme.glowHex,
      transparent: true,
      opacity: 0.0,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  auraRing.rotation.x = -Math.PI / 2;
  auraRing.position.y = 0.03;
  root.add(auraRing);

  function setSelection(bldKey, tier) {
    Object.keys(buildings).forEach(k => {
      if (k === 'casa') {
        buildings.casa.root.visible = (k === bldKey);
        if (k === bldKey) buildings.casa.setTier(tier);
      } else {
        Object.keys(buildings[k]).forEach(tNum => {
          buildings[k][tNum].visible = (k === bldKey && Number(tNum) === tier);
        });
      }
    });
  }

  function applyGod(godKey) {
    const next = EGYPT_GODS[godKey] || EGYPT_GODS.ra;
    M.stoneBase.color.setHex(next.stoneBase);
    M.stoneBright.color.setHex(next.stoneBright);
    M.trim.color.setHex(next.trimHex);
    M.secondary.color.setHex(next.secondaryHex);
    M.gold.color.setHex(next.goldHex);
    M.statue.color.setHex(next.statueHex);
    M.flame.color.setHex(next.flameHex);
    M.ember.emissive.setHex(next.flameHex);
    M.vortexOuter.color.setHex(next.vortexOuter);
    M.vortexInner.color.setHex(next.vortexInner);
    auraRing.material.color.setHex(next.glowHex);

    if (M.linen.map) M.linen.map.dispose();
    M.linen.map = createLinenTex(next);
    M.linen.needsUpdate = true;

    if (M.target.map) M.target.map.dispose();
    M.target.map = createTargetTex(next);
    M.target.needsUpdate = true;

    statues.forEach(st => {
      st.raCrown.visible = (godKey === 'ra');
      st.isisHorns.visible = (godKey === 'isis');
      st.setParts.visible = (godKey === 'set');
    });

    godKits.forEach(gk => {
      gk.raKit.visible = (godKey === 'ra');
      gk.isisKit.visible = (godKey === 'isis');
      gk.setKit.visible = (godKey === 'set');
    });
  }

  return {
    root, flames, flags, cranes, windmills, waterwheels, cropClusters, vortexPairs,
    gatePivots, oilStreams, towerFireOrigins, auraRing, setSelection, applyGod
  };
}

const towerArrows = [];
const tArrowGeo = new T.CylinderGeometry(0.016, 0.016, 0.65, 6);
tArrowGeo.rotateX(Math.PI / 2);
const tArrowMat = new T.MeshBasicMaterial({ color: 0xfef08a });
const tFlameTipMat = new T.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.95, blending: T.AdditiveBlending });
let towerVolleyTimer = 0;

function spawnTowerFireArrow(originY) {
  const a = Math.random() * Math.PI * 2;
  const dist = 3.2 + Math.random() * 2.4;
  const start = new T.Vector3(Math.cos(a) * 0.58, originY, Math.sin(a) * 0.58);
  const target = new T.Vector3(Math.cos(a) * dist, 0.06, Math.sin(a) * dist);

  const arrowGrp = new T.Group();
  const shaft = new T.Mesh(tArrowGeo, tArrowMat);
  const tipFlame = new T.Mesh(new T.SphereGeometry(0.055, 8, 8), tFlameTipMat);
  tipFlame.position.z = 0.34;
  arrowGrp.add(shaft, tipFlame);
  arrowGrp.position.copy(start);
  scene.add(arrowGrp);

  towerArrows.push({ mesh: arrowGrp, start, target, progress: 0, speed: 1.55 + Math.random() * 0.35 });
}

const waves = [];
function spawnUpgradeWave(hex) {
  const ring = new T.Mesh(
    new T.RingGeometry(1.5, 2.2, 56),

      transparent: true,
      opacity: 0.95,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.04;
  scene.add(ring);
  waves.push({ mesh: ring, life: 0.85, max: 0.85 });
}

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, 0.08, 1.15);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.007, 3.8, 22.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    targetCamDist = T.MathUtils.clamp(targetCamDist + (pinchDist - d) * 0.02, 3.8, 22.0);
    pinchDist = d;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (FLÂMULAS, GUINDASTE, MOINHO, ÓLEO QUENTE E VÓRTICE)
   ========================================================================== */
const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const isProd = currentAct === 'producao';
  const isBless = currentAct === 'bencao';
  const speedFactor = isProd ? 2.2 : 1.0;

  egyptCity.flames.forEach((fl, idx) => {
    fl.scale.set(
      1 + Math.sin(elapsed * 12 + idx) * 0.14,
      1 + Math.cos(elapsed * 15 + idx) * 0.22,
      1 + Math.sin(elapsed * 11 + idx) * 0.14
    );
  });

  egyptCity.flags.forEach(f => {
    f.node.rotation.y = Math.sin(elapsed * 3.2 + f.phase) * 0.22;
  });

  egyptCity.cranes.forEach(c => {
    c.rotation.y = Math.sin(elapsed * 0.65 * speedFactor) * 0.55;
  });

  egyptCity.windmills.forEach(w => {
    w.rotation.z -= dt * 1.15 * speedFactor;
  });

  egyptCity.waterwheels.forEach(ww => {
    ww.rotation.x += dt * 1.45 * speedFactor;
  });

  egyptCity.cropClusters.forEach(cc => {
    cc.node.rotation.z = Math.sin(elapsed * 2.1 * speedFactor + cc.phase) * 0.07;
    cc.node.rotation.x = Math.cos(elapsed * 1.7 * speedFactor + cc.phase) * 0.05;
  });

  egyptCity.vortexPairs.forEach(v => {
    v.outer.rotation.z += dt * 1.25 * speedFactor;
    v.inner.rotation.z -= dt * 2.15 * speedFactor;
    v.core.scale.setScalar(1 + Math.sin(elapsed * 4.5) * 0.07);
  });

  egyptCity.oilStreams.forEach(os => {
    const pulse = 1 + Math.sin(elapsed * 9 * speedFactor + os.phase) * 0.18;
    os.stream.scale.set(pulse, 1, pulse);
    os.pool.scale.setScalar(1 + Math.cos(elapsed * 7 * speedFactor + os.phase) * 0.14);
  });

  if (currentBld === 'torres') {
    towerVolleyTimer -= dt * speedFactor;
    if (towerVolleyTimer <= 0) {
      towerVolleyTimer = isProd ? 0.24 : 0.48;
      spawnTowerFireArrow(egyptCity.towerFireOrigins[currentTier] || 2.6);
    }
  }
  for (let i = towerArrows.length - 1; i >= 0; i--) {
    const ar = towerArrows[i];
    ar.progress += dt * ar.speed;
    const p = Math.min(1, ar.progress);
    const pos = new T.Vector3().lerpVectors(ar.start, ar.target, p);
    pos.y += Math.sin(p * Math.PI) * 0.85;
    ar.mesh.position.copy(pos);
    const nextP = Math.min(1, p + 0.05);
    const nextPos = new T.Vector3().lerpVectors(ar.start, ar.target, nextP);
    nextPos.y += Math.sin(nextP * Math.PI) * 0.85;
    ar.mesh.lookAt(nextPos);
    if (p >= 1) {
      scene.remove(ar.mesh);
      towerArrows.splice(i, 1);
    }
  }

  const targetGateAngle = gateOpen ? (Math.PI * 0.46) : 0;
  gateAngle = T.MathUtils.damp(gateAngle, targetGateAngle, 5.5, dt);
  egyptCity.gatePivots.forEach(gp => {
    gp.left.rotation.y = -gateAngle;
    gp.right.rotation.y = gateAngle;
  });

  // Partículas ambientes sutis sempre ativas, intensificadas em Produção / Bênção
  partMat.opacity = T.MathUtils.damp(partMat.opacity, (isProd || isBless) ? 0.90 : 0.34, 4, dt);
  const attr = partGeo.attributes.position;
  const mult = isProd ? 2.1 : (isBless ? 1.5 : 0.65);
  for (let i = 0; i < PART_N; i++) {
    let py = attr.getY(i) + partVel[i] * dt * mult;
    if (py > 5.0) py = 0.2;
    attr.setY(i, py);
  }
  attr.needsUpdate = true;

  blessingBeam.material.opacity = T.MathUtils.damp(blessingBeam.material.opacity, isBless ? 0.55 : 0.0, 4, dt);
  blessingBeam.rotation.y += dt * 1.1;

  egyptCity.auraRing.material.opacity = T.MathUtils.damp(
    egyptCity.auraRing.material.opacity,
    isBless ? 0.82 : (isProd ? 0.38 : 0.14),
    4,
    dt
  );
  egyptCity.auraRing.rotation.z += dt * 0.38;

  divineLight.intensity = isBless ? (5.8 + Math.sin(elapsed * 9) * 1.2) : (isProd ? 3.5 : 2.1);

  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life -= dt;
    const k = Math.max(0, w.life / w.max);
    w.mesh.scale.setScalar(1 + (1 - k) * 2.3);
    w.mesh.material.opacity = 0.95 * k;
    if (w.life <= 0) {
      scene.remove(w.mesh);
      w.mesh.geometry.dispose();
      w.mesh.material.dispose();
      waves.splice(i, 1);
    }
  }

  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging && !focusDetails && currentBld !== 'muralha') camAngle += dt * 0.05;

  const fCoords = BUILDING_INFO[currentBld].focus;
  const desired = focusDetails
    ? new T.Vector3(fCoords[0], fCoords[1], fCoords[2])
    : new T.Vector3(0, 1.35 + currentTier * 0.10, 0);
  currentLookAt.lerp(desired, 0.13);

  const hDist = Math.cos(camPitch) * camDist;
  const vDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * hDist,
    currentLookAt.y + vDist,
    currentLookAt.z + Math.cos(camAngle) * hDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

syncUI();
if (document.readyState === 'complete') {
  animate();
} else {
  window.addEventListener('load', animate);
}
</script>
