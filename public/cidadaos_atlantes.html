<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cidadãos Atlantes & Lhama (Evolução Herói) | Age of Mythology: Retold 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --gold: #facc15;
      --orichalcum: #f59e0b;
      --glass: rgba(12, 18, 30, 0.88);
      --border: rgba(250, 204, 21, 0.45);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080f1c;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }
    .row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: auto;
    }
    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.48);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      background: rgba(24, 36, 58, 0.94);
    }
    button.god-btn.on[data-god="kronos"] {
      background: linear-gradient(135deg, #38bdf8 0%, #312e81 100%);
      color: #ffffff;
      border-color: #bae6fd;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
    }
    button.god-btn.on[data-god="oranos"] {
      background: linear-gradient(135deg, #facc15 0%, #0284c7 100%);
      color: #081222;
      border-color: #fef9c3;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.55);
    }
    button.god-btn.on[data-god="gaia"] {
      background: linear-gradient(135deg, #10b981 0%, #065f46 100%);
      color: #ffffff;
      border-color: #a7f3d0;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.55);
    }
    button.gen-btn.on {
      background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
      color: #090d16;
      border-color: #ffffff;
    }
    button.act-btn.on {
      background: linear-gradient(135deg, #0ea5e9 0%, #1d4ed8 100%);
      color: #ffffff;
      border-color: #bae6fd;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.5);
    }
    button#btn-hero {
      border-color: #facc15;
      color: #fde047;
      background: rgba(38, 28, 8, 0.9);
    }
    button#btn-hero.hero-on {
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 55%, #b45309 100%);
      color: #140c02;
      border-color: #ffffff;
      box-shadow: 0 0 26px rgba(250, 204, 21, 0.85);
    }
    button.cam-btn {
      border-color: rgba(125, 211, 252, 0.5);
    }
    button.cam-btn.active {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      color: #fff;
      border-color: #e0f2fe;
    }

    #info-card {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 12px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      min-width: 320px;
      max-width: 92vw;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    }
    #card-title {
      color: #fde047;
      font-weight: 700;
      font-size: 13.5px;
    }
    #card-sub {
      color: #cbd5e1;
      font-size: 11.5px;
      margin-top: 2px;
    }

    #badge {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 10px;
      color: #fde047;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 1120px) {
      #badge { display: none; }
    }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 16, 28, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 15px;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 11.5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  <!-- Linha 1: Divindades Atlantes + Promoção a Herói + Seleção de Exibição -->
  <div class="row">
    <button data-god="kronos" class="god-btn on">⏳ Kronos</button>
    <button data-god="oranos" class="god-btn">🌪️ Oranos</button>
    <button data-god="gaia" class="god-btn">🌿 Gaia</button>
    <span style="width:4px"></span>
    <button id="btn-hero">✨ Promover a Herói</button>
    <span style="width:4px"></span>

    <button data-gen="homem" class="gen-btn">Cidadão (Homem)</button>

</div>

<div id="badge">Atlântida • Cidadão & Herói</div>

<div id="info-card">
  <div id="card-title">Cidadãos Atlantes de Kronos & Lhama de Carga</div>
  <div id="card-sub">Anel astrolábico cronológico giratório nas costas, fivela de ampulheta temporal, braceletes de ardósia e Lhama com anel temporal</div>
</div>

<div id="hint">Arraste para girar 360° • Scroll / Pinça para zoom</div>

<script>
const T = THREE;

/* ==========================================================================
   1. CONFIGURAÇÃO VISUAL DAS 3 DIVINDADES ATLANTES (KRONOS, ORANOS E GAIA)
   ========================================================================== */
const ATLANTEAN_GODS = {
  kronos: {
    id: 'kronos',
    title: 'Cidadãos Atlantes de Kronos & Lhama de Carga',
    subtitle: 'Anel astrolábico cronológico giratório nas costas, fivela de ampulheta temporal, braceletes de ardósia e Lhama com anel temporal',
    bgHex: 0x0d1528,
    hemiSky: 0xe0f2fe,
    hemiGround: 0x1e1b4b,
    rimHex: 0x38bdf8,
    ringHex: 0x38bdf8,
    tunicBase: '#f8fafc',
    tunicStripe: '#312e81',
    tunicTrim: '#facc15',
    sashHex: 0x1d4ed8,
    accentHex: 0xfacc15,
    toolMetalHex: 0xf59e0b,
    sparkHex: 0x7dd3fc,
    llamaBlanket: 0x312e81
  },
  oranos: {
    id: 'oranos',
    title: 'Cidadãos Atlantes de Oranos & Lhama de Carga',
    subtitle: 'Asas celestes douradas e branco-pérola nas costas, tiara solar radiante, punhos luminosos e Lhama com asas douradas nos alforjes',
    bgHex: 0x0a1e32,
    hemiSky: 0xfef9c3,
    hemiGround: 0x0369a1,
    rimHex: 0xfacc15,
    ringHex: 0xfacc15,
    tunicBase: '#fffbeb',
    tunicStripe: '#0284c7',
    tunicTrim: '#eab308',
    sashHex: 0x0ea5e9,
    accentHex: 0xfde047,
    toolMetalHex: 0xfacc15,
    sparkHex: 0xfef08a,
    llamaBlanket: 0x0284c7
  },
  gaia: {
    id: 'gaia',
    title: 'Cidadãos Atlantes de Gaia & Lhama de Carga',
    subtitle: 'Coroa de folhas e brotos esmeralda, guirlanda vegetal na cintura e barra, brotos nos tornozelos e Lhama ornamentada com flores',
    bgHex: 0x071a14,
    hemiSky: 0xd1fae5,
    hemiGround: 0x064e3b,
    rimHex: 0x10b981,
    ringHex: 0x10b981,
    tunicBase: '#f0fdf4',
    tunicStripe: '#065f46',
    tunicTrim: '#f59e0b',
    sashHex: 0x059669,
    accentHex: 0xfacc15,
    toolMetalHex: 0xd97706,
    sparkHex: 0x6ee7b7,
    llamaBlanket: 0x065f46
  }
};

/* ==========================================================================
   2. TEXTURAS PROCEDURAIS (SEDA ATLANTE E PISO CONCÊNTRICO DE ATLÂNTIDA)
   ========================================================================== */
function createAtlanteanClothTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = theme.tunicBase;
  ctx.fillRect(0, 0, 512, 256);

  ctx.fillStyle = 'rgba(15, 23, 42, 0.06)';
  for (let x = 0; x < 512; x += 8) ctx.fillRect(x, 0, 3, 256);

  // Barrado geométrico atlante com espirais e ondas de Oricalco
  ctx.fillStyle = theme.tunicStripe;
  ctx.fillRect(0, 194, 512, 42);
  ctx.fillStyle = theme.tunicTrim;
  ctx.fillRect(0, 190, 512, 4);
  ctx.fillRect(0, 236, 512, 4);

  ctx.strokeStyle = theme.tunicTrim;
  ctx.lineWidth = 3;
  for (let x = 0; x < 512; x += 32) {
    ctx.beginPath();
    ctx.arc(x + 16, 215, 10, 0, Math.PI * 1.5);
    ctx.stroke();
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  return tex;
}

function createAtlanteanFloorTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 40; i++) {
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    let mx = Math.random() * 1024, my = 0;
    ctx.moveTo(mx, my);
    while (my < 1024) {
      my += 32;
      mx += (Math.random() - 0.5) * 45;
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
  }

  // 3 Círculos Concêntricos Clássicos de Atlântida
  const cx = 512, cy = 512;
  const rings = [420, 330, 240];
  rings.forEach((r, idx) => {
    ctx.strokeStyle = idx % 2 === 0 ? theme.tunicStripe : theme.tunicTrim;
    ctx.lineWidth = idx === 0 ? 18 : 10;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  });

  return new T.CanvasTexture(canvas);
}

/* ==========================================================================
   3. HELPERS DE GEOMETRIA NATIVA R128 E CONSTRUÇÃO DOS CIDADÃOS ATLANTES
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function sculpt(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = new T.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function buildAtlanteanCitizen(isFemale, initialGod = 'kronos') {
  const theme = ATLANTEAN_GODS[initialGod];

  const M = {
    skin: new T.MeshStandardMaterial({
      color: isFemale ? 0xdfb08c : 0xc99268,
      emissive: 0xfacc15,
      emissiveIntensity: 0.0,
      roughness: 0.44,
      metalness: 0.06
    }),
    hair: new T.MeshStandardMaterial({
      color: isFemale ? 0x3b2314 : 0x29180e,
      roughness: 0.62
    }),
    tunic: new T.MeshStandardMaterial({
      map: createAtlanteanClothTexture(theme),
      emissive: 0xfacc15,
      emissiveIntensity: 0.0,
      roughness: 0.52,
      side: T.DoubleSide
    }),
    sash: new T.MeshStandardMaterial({
      color: theme.sashHex,
      emissive: 0xfacc15,
      emissiveIntensity: 0.0,
      roughness: 0.48,
      side: T.DoubleSide
    }),
    orichalcum: new T.MeshStandardMaterial({
      color: theme.accentHex,
      emissive: 0xf59e0b,
      emissiveIntensity: 0.15,
      metalness: 0.92,
      roughness: 0.18
    }),
    slateStone: new T.MeshStandardMaterial({
      color: 0x475569,
      roughness: 0.45,
      metalness: 0.35
    }),
    foliage: new T.MeshStandardMaterial({
      color: 0x15803d,
      roughness: 0.65
    }),
    pearlWhite: new T.MeshStandardMaterial({
      color: 0xf8fafc,
      emissive: 0xfef08a,
      emissiveIntensity: 0.18,
      roughness: 0.28
    }),
    divineGlow: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: theme.ringHex,
      emissiveIntensity: 2.3,
      roughness: 0.15
    }),
    leather: new T.MeshStandardMaterial({
      color: 0x5c2d16,
      roughness: 0.72
    }),
    wood: new T.MeshStandardMaterial({
      color: 0x6b3818,
      roughness: 0.65
    }),
    toolMetal: new T.MeshStandardMaterial({
      color: theme.toolMetalHex,
      emissive: 0xfacc15,
      emissiveIntensity: 0.1,
      metalness: 0.90,
      roughness: 0.20
    }),
    lipMat: new T.MeshStandardMaterial({
      color: isFemale ? 0xc86d6d : 0xa86454,
      roughness: 0.45
    }),
    eyeIris: new T.MeshStandardMaterial({
      color: 0x0284c7,
      emissive: 0x38bdf8,
      emissiveIntensity: 0.0,
      roughness: 0.15
    })
  };

  const root = new T.Group();
  const heightScale = isFemale ? 0.95 : 1.0;

  // Geometria das pernas: pelvis(0.88) -> hip(-0.04) -> knee(-0.48) -> ankle(-0.44) -> sola(-0.05) = -0.13 local.
  // Definindo baseBodyY = 0.13 * heightScale, a sola das sandálias apoia firmemente em y = 0.00!
  const baseBodyY = 0.13 * heightScale;
  const body = group(root, 0, baseBodyY, 0);
  body.scale.setScalar(heightScale);

  const heroParts = [];
  const godAdornments = { kronos: [], oranos: [], gaia: [] };

  // Pelve e Pernas
  const pelvis = group(body, 0, 0.88, 0);
  const hipWidth = isFemale ? 1.08 : 0.98;
  sculpt(pelvis, new T.SphereGeometry(0.19, 18, 16), M.tunic, [0, 0, 0], [0, 0, 0], [hipWidth, 0.78, 0.82]);

  const legs = {};
  const legSpread = isFemale ? 0.125 : 0.135;
  for (const side of ['L', 'R']) {
    const s = side === 'R' ? 1 : -1;
    const hip = group(pelvis, s * legSpread, -0.04, 0);

    const thighRTop = isFemale ? 0.105 : 0.112;
    const thighRBot = isFemale ? 0.075 : 0.082;
    sculpt(hip, new T.CylinderGeometry(thighRTop, thighRBot, 0.48, 16), M.skin, [0, -0.23, 0]);
    sculpt(hip, new T.SphereGeometry(thighRBot * 1.02, 12, 12), M.skin, [0, -0.47, 0.01]);

    const knee = group(hip, 0, -0.48, 0);
    const calfRTop = isFemale ? 0.072 : 0.078;
    const calfRBot = isFemale ? 0.045 : 0.050;
    sculpt(knee, new T.CylinderGeometry(calfRTop, calfRBot, 0.44, 16), M.skin, [0, -0.22, 0]);

    // Grevas douradas de Oricalco (forma Herói)
    const heroGreave = sculpt(knee, new T.CylinderGeometry(calfRTop * 1.08, calfRBot * 1.12, 0.34, 16, 1, false, -0.88, 1.76), M.orichalcum, [0, -0.22, 0.01]);
    heroGreave.visible = false;
    heroParts.push(heroGreave);

    const ankle = group(knee, 0, -0.44, 0.02);
    sculpt(ankle, new T.BoxGeometry(0.082, 0.016, 0.20), M.leather, [0, -0.042, 0.035]);
    sculpt(ankle, new T.BoxGeometry(0.076, 0.032, 0.18), M.skin, [0, -0.022, 0.032]);
    sculpt(ankle, new T.BoxGeometry(0.086, 0.012, 0.024), M.orichalcum, [0, -0.008, 0.06]);

    // GAIA: Pequenos brotos e folhas esmeralda junto às sandálias
    const gaiaAnkle = group(ankle, 0, -0.005, 0.01);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      sculpt(gaiaAnkle, new T.DodecahedronGeometry(0.020, 0), M.foliage, [Math.cos(a) * 0.055, 0.01, Math.sin(a) * 0.065]);
    }
    sculpt(gaiaAnkle, new T.OctahedronGeometry(0.016, 0), M.divineGlow, [s * 0.055, 0.028, 0.02]);
    godAdornments.gaia.push(gaiaAnkle);

    legs[side] = { hip, knee, ankle };
  }

  legs.L.hip.rotation.set(-0.08, -0.08, -0.04);
  legs.L.knee.rotation.set(0.10, 0, 0);
  legs.R.hip.rotation.set(0.06, 0.08, 0.04);
  legs.R.knee.rotation.set(0.08, 0, 0);

  // Tronco
  const torso = group(body, 0, 1.28, 0);
  const shoulderW = isFemale ? 0.255 : 0.305;
  const waistW = isFemale ? 0.175 : 0.205;

  const tunicPts = [
    new T.Vector2(0.01, -0.38),
    new T.Vector2(0.215, -0.34),
    new T.Vector2(waistW + 0.015, -0.15),
    new T.Vector2(waistW + 0.045, 0.05),
    new T.Vector2(shoulderW + 0.015, 0.27),
    new T.Vector2(shoulderW * 0.78, 0.37),
    new T.Vector2(0.14, 0.38),
    new T.Vector2(0.01, 0.38)
  ];
  sculpt(torso, new T.LatheGeometry(tunicPts, 32), M.tunic, [0, 0.01, 0], [0, 0, 0], [1.10, 1.0, 0.76]);

  const collar = new T.TorusGeometry(0.18, 0.016, 8, 28);
  collar.rotateX(Math.PI / 2);
  sculpt(torso, collar, M.orichalcum, [0, 0.37, 0.01], [0.16, 0, 0], [1.12, 1, 0.88]);

  const heroBreastplate = sculpt(torso, new T.LatheGeometry(tunicPts, 32), M.orichalcum, [0, 0.015, 0.004], [0, 0, 0], [1.12, 1.01, 0.78]);
  heroBreastplate.visible = false;
  heroParts.push(heroBreastplate);

  sculpt(torso, new T.BoxGeometry(0.075, 0.64, 0.24), M.sash, [0, 0.04, 0.01], [0, 0, isFemale ? 0.48 : -0.52]);
  const belt = new T.TorusGeometry(waistW + 0.025, 0.022, 10, 28);
  belt.rotateX(Math.PI / 2);
  sculpt(torso, belt, M.sash, [0, -0.16, 0.005], [0.04, 0, 0], [1.12, 1, 0.80]);
  sculpt(torso, new T.OctahedronGeometry(0.032, 0), M.orichalcum, [0, -0.16, (waistW + 0.025) * 0.84]);

  /* ------------------------------------------------------------------------
     ELEMENTOS EXCLUSIVOS DE CADA DEUS INTEGRADOS AOS ALDEÕES
     ------------------------------------------------------------------------ */
  // 1. KRONOS: Anéis astrolábicos cronológicos giratórios nas costas + fivela de ampulheta temporal
  const kronosBackHalo = group(torso, 0, 0.22, -0.22);
  const kOuterRing = new T.Mesh(new T.TorusGeometry(0.26, 0.014, 8, 32), M.divineGlow);
  const kInnerRing = new T.Mesh(new T.TorusGeometry(0.18, 0.011, 8, 24), M.orichalcum);
  kronosBackHalo.add(kOuterRing, kInnerRing);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    sculpt(kronosBackHalo, new T.BoxGeometry(0.025, 0.08, 0.018), M.slateStone, [Math.cos(a) * 0.26, Math.sin(a) * 0.26, 0], [0, 0, a + Math.PI / 2]);
  }
  const kHourglassTop = sculpt(torso, new T.ConeGeometry(0.026, 0.045, 6), M.divineGlow, [0, -0.135, (waistW + 0.03) * 0.86], [Math.PI, 0, 0]);
  const kHourglassBot = sculpt(torso, new T.ConeGeometry(0.026, 0.045, 6), M.divineGlow, [0, -0.185, (waistW + 0.03) * 0.86]);
  godAdornments.kronos.push(kronosBackHalo, kHourglassTop, kHourglassBot);

  // 2. ORANOS: Asas celestes douradas e branco-pérola nas costas + borda luminosa na faixa
  const oranosWings = group(torso, 0, 0.20, -0.17);
  for (const s of [-1, 1]) {
    sculpt(oranosWings, new T.BoxGeometry(0.32, 0.085, 0.022), M.orichalcum, [s * 0.20, 0.10, -0.03], [0.15, s * -0.32, s * 0.42]);
    sculpt(oranosWings, new T.BoxGeometry(0.26, 0.070, 0.020), M.pearlWhite, [s * 0.18, 0.02, -0.04], [0.15, s * -0.32, s * 0.22]);
    sculpt(oranosWings, new T.BoxGeometry(0.18, 0.055, 0.018), M.divineGlow, [s * 0.14, -0.05, -0.05], [0.15, s * -0.32, s * 0.05]);
  }
  const oranosSashGlow = sculpt(torso, new T.BoxGeometry(0.086, 0.65, 0.246), M.divineGlow, [0, 0.04, 0.01], [0, 0, isFemale ? 0.48 : -0.52]);
  godAdornments.oranos.push(oranosWings, oranosSashGlow);

  // 3. GAIA: Guirlanda vegetal na cintura e na faixa
  const gaiaTorsoVines = group(torso, 0, 0, 0);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const vx = Math.cos(a) * (waistW + 0.045) * 1.12;
    const vz = Math.sin(a) * (waistW + 0.045) * 0.82;
    sculpt(gaiaTorsoVines, new T.DodecahedronGeometry(0.032, 0), M.foliage, [vx, -0.16 + (i % 2) * 0.02, vz]);
    if (i % 2 === 0) {
      sculpt(gaiaTorsoVines, new T.OctahedronGeometry(0.022, 0), M.divineGlow, [vx * 1.04, -0.14, vz * 1.04]);
    }
  }
  for (let b = 0; b < 5; b++) {
    const tFrac = (b - 2) * 0.11;
    sculpt(gaiaTorsoVines, new T.DodecahedronGeometry(0.028, 0), M.foliage, [-tFrac * 0.55, 0.04 + tFrac, 0.145]);
  }
  godAdornments.gaia.push(gaiaTorsoVines);

  const heroCape = sculpt(torso, new T.PlaneGeometry(1.05, 1.38, 14, 18), M.sash, [0, -0.32, -0.18], [0.14, 0, 0]);
  heroCape.visible = false;
  heroParts.push(heroCape);

  const skirtH = isFemale ? 0.96 : 0.56;
  const skirtBotR = isFemale ? 0.34 : 0.36;
  const skirtY = isFemale ? -0.64 : -0.44;
  const skirtGeo = new T.CylinderGeometry(0.21, skirtBotR, skirtH, 36, 12, true);
  const skPos = skirtGeo.attributes.position;
  for (let i = 0; i < skPos.count; i++) {
    let x = skPos.getX(i), y = skPos.getY(i), z = skPos.getZ(i);
    const angle = Math.atan2(z, x);
    const normY = Math.max(0, Math.min(1, (skirtH * 0.5 - y) / skirtH));
    const pleat = Math.sin(angle * 16) * 0.018 * (0.2 + normY * 0.9);
    const r = Math.sqrt(x * x + z * z) + pleat;
    skPos.setXYZ(i, Math.cos(angle) * r * 1.05, y, Math.sin(angle) * r * 0.84);
  }
  skirtGeo.computeVertexNormals();
  sculpt(torso, skirtGeo, M.tunic, [0, skirtY, 0], [0.02, 0, 0]);

  // GAIA: Guirlanda vegetal na barra da túnica
  const gaiaSkirtTrim = group(torso, 0, skirtY - skirtH * 0.45, 0);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    sculpt(gaiaSkirtTrim, new T.DodecahedronGeometry(0.030, 0), M.foliage, [Math.cos(a) * skirtBotR * 1.03, 0.03, Math.sin(a) * skirtBotR * 0.83]);
  }
  godAdornments.gaia.push(gaiaSkirtTrim);

  // Pescoço e Cabeça
  sculpt(torso, new T.CylinderGeometry(0.082, 0.102, 0.22, 16), M.skin, [0, 0.48, -0.005], [0.05, 0, 0]);

  const head = group(torso, 0, 0.68, 0.025);
  const headScaleX = isFemale ? 0.88 : 0.93;
  sculpt(head, new T.SphereGeometry(0.168, 28, 28), M.skin, [0, 0, 0], [0, 0, 0], [headScaleX, 1.12, 0.96]);

  sculpt(head, new T.BoxGeometry(0.018, 0.068, 0.032), M.skin, [0, 0.005, 0.158], [-0.10, 0, 0]);
  sculpt(head, new T.BoxGeometry(0.038, 0.012, 0.018), M.lipMat, [0, -0.068, 0.154]);

  const eyeWhiteMat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  for (const side of [-1, 1]) {
    sculpt(head, new T.SphereGeometry(0.019, 12, 12), eyeWhiteMat, [side * 0.048, 0.022, 0.148], [0, 0, 0], [1.15, 0.72, 0.75]);
    sculpt(head, new T.SphereGeometry(0.011, 10, 10), M.eyeIris, [side * 0.048, 0.022, 0.158]);
    sculpt(head, new T.BoxGeometry(0.046, 0.007, 0.014), M.hair, [side * 0.048, 0.044, 0.154], [0, 0, side * -0.08]);
  }

  sculpt(head, new T.SphereGeometry(0.178, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.62), M.hair, [0, 0.025, -0.01], [-0.12, 0, 0], [headScaleX * 1.03, 1.08, 1.02]);
  if (isFemale) {
    sculpt(head, new T.SphereGeometry(0.088, 18, 18), M.hair, [0, -0.02, -0.18], [0, 0, 0], [0.95, 1.05, 1.15]);
  }
  const diadem = new T.TorusGeometry(0.168, 0.010, 8, 32);
  diadem.rotateX(Math.PI / 2);
  sculpt(head, diadem, M.orichalcum, [0, 0.092, 0.005], [0.20, 0, 0], [headScaleX * 1.02, 1, 1.02]);

  // Adornos de Cabeça por Deus
  const kronosGem = sculpt(head, new T.OctahedronGeometry(0.028, 0), M.divineGlow, [0, 0.122, 0.152]);
  godAdornments.kronos.push(kronosGem);

  const oranosTiara = group(head, 0, 0.122, 0.145);
  sculpt(oranosTiara, new T.OctahedronGeometry(0.026, 0), M.divineGlow, [0, 0.01, 0]);
  for (const s of [-1, 1]) {
    sculpt(oranosTiara, new T.ConeGeometry(0.012, 0.065, 4), M.orichalcum, [s * 0.045, 0.02, -0.01], [0.1, 0, s * -0.45]);
  }
  godAdornments.oranos.push(oranosTiara);

  const gaiaCrown = group(head, 0, 0.095, 0.005);
  gaiaCrown.rotation.x = 0.20;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    sculpt(gaiaCrown, new T.DodecahedronGeometry(0.024, 0), M.foliage, [Math.cos(a) * 0.172 * headScaleX, 0.008, Math.sin(a) * 0.172]);
    if (i % 3 === 0) {
      sculpt(gaiaCrown, new T.OctahedronGeometry(0.018, 0), M.divineGlow, [Math.cos(a) * 0.18 * headScaleX, 0.024, Math.sin(a) * 0.18]);
    }
  }
  godAdornments.gaia.push(gaiaCrown);

  const heroCrown = group(head, 0, 0.14, 0.04);
  sculpt(heroCrown, new T.ConeGeometry(0.024, 0.14, 4), M.orichalcum, [0, 0.05, 0.12], [0.2, 0, 0]);
  sculpt(heroCrown, new T.ConeGeometry(0.018, 0.10, 4), M.orichalcum, [-0.07, 0.03, 0.10], [0.2, 0, 0.28]);
  sculpt(heroCrown, new T.ConeGeometry(0.018, 0.10, 4), M.orichalcum, [0.07, 0.03, 0.10], [0.2, 0, -0.28]);
  heroCrown.visible = false;
  heroParts.push(heroCrown);

  // Braços (usando CylinderGeometry + SphereGeometry 100% compatíveis com Three.js r128!)
  function createAtlanteanArm(isRight) {
    const s = isRight ? 1 : -1;
    const armX = isFemale ? 0.295 : 0.345;
    const arm = group(torso, s * armX, 0.32, -0.005);

    const upperR = isFemale ? 0.056 : 0.068;
    sculpt(arm, new T.SphereGeometry(upperR * 1.15, 14, 14), M.skin, [0, -0.01, 0]);
    sculpt(arm, new T.CylinderGeometry(upperR, upperR * 0.88, 0.26, 14), M.skin, [s * 0.015, -0.15, 0], [0, 0, s * 0.06]);
    sculpt(arm, new T.SphereGeometry(upperR * 0.88, 12, 12), M.skin, [s * 0.025, -0.28, 0]);

    // Gaia: Ombreiras botânicas de folhas e brotos esmeralda
    const gaiaShoulder = group(arm, s * 0.015, 0.01, 0);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      sculpt(gaiaShoulder, new T.DodecahedronGeometry(0.032, 0), M.foliage, [Math.cos(a) * upperR * 1.15, 0.01, Math.sin(a) * upperR * 1.15]);
    }
    sculpt(gaiaShoulder, new T.OctahedronGeometry(0.024, 0), M.divineGlow, [s * 0.03, 0.045, 0]);
    godAdornments.gaia.push(gaiaShoulder);

    const heroPauldron = sculpt(arm, new T.SphereGeometry(0.115, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), M.orichalcum, [s * 0.015, 0.025, 0], [0, 0, s * -0.32], [1.1, 0.75, 1.12]);
    heroPauldron.visible = false;
    heroParts.push(heroPauldron);

    const elbow = group(arm, s * 0.03, -0.30, 0);
    const foreRTop = isFemale ? 0.052 : 0.062;
    const foreRBot = isFemale ? 0.038 : 0.045;
    sculpt(elbow, new T.CylinderGeometry(foreRTop, foreRBot, 0.28, 14), M.skin, [0, -0.14, 0]);

    // Kronos: Braceletes de pedra ardósia com Oricalco nos punhos
    const kBracelet = sculpt(elbow, new T.CylinderGeometry(foreRBot * 1.16, foreRBot * 1.12, 0.065, 12), M.slateStone, [0, -0.22, 0]);
    const kBraceletTrim = sculpt(elbow, new T.TorusGeometry(foreRBot * 1.16, 0.007, 6, 16), M.orichalcum, [0, -0.19, 0], [Math.PI / 2, 0, 0]);
    godAdornments.kronos.push(kBracelet, kBraceletTrim);

    // Oranos: Anel luminoso dourado nos punhos
    const oWristRing = sculpt(elbow, new T.TorusGeometry(foreRBot * 1.22, 0.009, 8, 20), M.divineGlow, [0, -0.22, 0], [Math.PI / 2, 0, 0]);
    godAdornments.oranos.push(oWristRing);

    // Gaia: Braceletes de folhas esmeralda
    const gBracelet = group(elbow, 0, -0.22, 0);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      sculpt(gBracelet, new T.DodecahedronGeometry(0.022, 0), M.foliage, [Math.cos(a) * foreRBot * 1.18, 0, Math.sin(a) * foreRBot * 1.18]);
    }
    godAdornments.gaia.push(gBracelet);

    const hand = group(elbow, 0, -0.29, 0);
    sculpt(hand, new T.BoxGeometry(0.052, 0.064, 0.026), M.skin, [0, -0.015, 0]);

    return { arm, elbow, hand };
  }

  const rightArm = createAtlanteanArm(true);
  const leftArm = createAtlanteanArm(false);

  // Ferramentas de Trabalho Atlantes
  const tools = {};
  const axe = group(rightArm.hand, 0, -0.025, 0.02);
  axe.rotation.set(Math.PI / 2, 0, 0);
  sculpt(axe, new T.CylinderGeometry(0.015, 0.017, 0.92, 10), M.wood, [0, 0.28, 0]);
  sculpt(axe, new T.BoxGeometry(0.03, 0.14, 0.20), M.toolMetal, [0, 0.66, 0.07]);
  tools.axe = axe;

  const pickaxe = group(rightArm.hand, 0, -0.025, 0.02);
  pickaxe.rotation.set(Math.PI / 2, 0, 0);
  sculpt(pickaxe, new T.CylinderGeometry(0.015, 0.017, 0.92, 10), M.wood, [0, 0.28, 0]);
  sculpt(pickaxe, new T.CylinderGeometry(0.024, 0.024, 0.08, 10), M.toolMetal, [0, 0.68, 0]);
  sculpt(pickaxe, new T.ConeGeometry(0.024, 0.24, 5), M.toolMetal, [0, 0.68, 0.13], [Math.PI / 2 + 0.18, 0, 0]);
  sculpt(pickaxe, new T.ConeGeometry(0.024, 0.24, 5), M.toolMetal, [0, 0.68, -0.13], [-Math.PI / 2 - 0.18, 0, 0]);
  tools.pickaxe = pickaxe;

  const hammer = group(rightArm.hand, 0, -0.025, 0.02);
  hammer.rotation.set(Math.PI / 2, 0, 0);
  sculpt(hammer, new T.CylinderGeometry(0.014, 0.016, 0.56, 10), M.wood, [0, 0.18, 0]);
  sculpt(hammer, new T.CylinderGeometry(0.038, 0.038, 0.18, 12), M.toolMetal, [0, 0.42, 0], [Math.PI / 2, 0, 0]);
  tools.hammer = hammer;

  const basket = group(leftArm.hand, 0, -0.04, 0.06);
  sculpt(basket, new T.CylinderGeometry(0.18, 0.12, 0.20, 18), M.leather, [0, -0.04, 0.06], [0.25, 0, 0]);
  const fruitCols = [0xdc2626, 0xf59e0b, 0x7e22ce, 0x16a34a];
  for (let f = 0; f < 6; f++) {
    const fa = (f / 6) * Math.PI * 2;
    sculpt(
      basket,
      new T.SphereGeometry(0.042, 10, 10),
      new T.MeshStandardMaterial({ color: fruitCols[f % fruitCols.length], roughness: 0.35 }),
      [Math.cos(fa) * 0.07, 0.065, 0.085 + Math.sin(fa) * 0.07]
    );
  }
  tools.basket = basket;

  const heroGroundAura = new T.Mesh(
    new T.RingGeometry(0.32, 0.68, 36),
    new T.MeshBasicMaterial({
      color: 0xfacc15,
      transparent: true,
      opacity: 0.85,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  heroGroundAura.rotation.x = -Math.PI / 2;
  heroGroundAura.position.y = 0.025;
  heroGroundAura.visible = false;
  root.add(heroGroundAura);

  const godFootAura = new T.Mesh(
    new T.RingGeometry(0.24, 0.34, 32),
    new T.MeshBasicMaterial({
      color: theme.ringHex,
      transparent: true,
      opacity: 0.35,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  godFootAura.rotation.x = -Math.PI / 2;
  godFootAura.position.y = 0.012;
  root.add(godFootAura);

  function setToolMode(act) {
    tools.axe.visible = act === 'madeira';
    tools.pickaxe.visible = act === 'ouro';
    tools.hammer.visible = act === 'construir';
    tools.basket.visible = act === 'fruta';
  }
  setToolMode('vigilia');

  function setHeroState(isHero) {
    heroParts.forEach(p => { p.visible = isHero; });
    heroGroundAura.visible = isHero;
    oranosWings.scale.setScalar(isHero ? 1.55 : 1.0);

    M.skin.emissiveIntensity = isHero ? 0.28 : 0.0;
    M.tunic.emissiveIntensity = isHero ? 0.35 : 0.0;
    M.sash.emissiveIntensity = isHero ? 0.32 : 0.0;
    M.orichalcum.emissiveIntensity = isHero ? 0.75 : 0.15;
    M.toolMetal.emissiveIntensity = isHero ? 0.65 : 0.10;
    M.eyeIris.emissiveIntensity = isHero ? 2.4 : 0.0;
  }

  function applyGodTheme(godKey) {
    const next = ATLANTEAN_GODS[godKey] || ATLANTEAN_GODS.kronos;
    M.sash.color.setHex(next.sashHex);
    M.orichalcum.color.setHex(next.accentHex);
    M.toolMetal.color.setHex(next.toolMetalHex);
    M.divineGlow.emissive.setHex(next.ringHex);
    godFootAura.material.color.setHex(next.ringHex);

    Object.keys(godAdornments).forEach(k => {
      const active = (k === godKey);
      godAdornments[k].forEach(obj => { obj.visible = active; });
    });

    if (M.tunic.map) M.tunic.map.dispose();
    M.tunic.map = createAtlanteanClothTexture(next);
    M.tunic.needsUpdate = true;
  }

  applyGodTheme(initialGod);

  return {
    root, body, torso, head, legs,
    rightArm, leftArm, tools, heroGroundAura, godFootAura,
    kronosBackHalo, oranosWings,
    setToolMode, setHeroState, applyGodTheme,
    isFemale, heightScale, baseBodyY
  };
}

/* ==========================================================================
   4. CONSTRUÇÃO DA LHAMA DE CARGA ATLANTE (NATIVA R128 + ADORNOS DIVINOS)
   ========================================================================== */
function buildAtlanteanLlama(initialGod = 'kronos') {
  const theme = ATLANTEAN_GODS[initialGod];

  const M = {
    wool: new T.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.88 }),
    faceSkin: new T.MeshStandardMaterial({ color: 0x78350f, roughness: 0.72 }),
    blanket: new T.MeshStandardMaterial({ color: theme.llamaBlanket, roughness: 0.58 }),
    gold: new T.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.88, roughness: 0.22 }),
    leather: new T.MeshStandardMaterial({ color: 0x5c2d16, roughness: 0.75 }),
    hoof: new T.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 }),
    foliage: new T.MeshStandardMaterial({ color: 0x15803d, roughness: 0.65 }),
    pearlWhite: new T.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.28 }),
    divineGlow: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: theme.ringHex,
      emissiveIntensity: 2.1,
      roughness: 0.15
    })
  };

  const root = new T.Group();
  // Cascos apoiam exatamente em y = 0.00 (body.y = 0.82, pernas descem até -0.82)
  const baseBodyY = 0.82;
  const body = group(root, 0, baseBodyY, 0);
  const llamaGodParts = { kronos: [], oranos: [], gaia: [] };

  // Tronco fofo de lã construído com CylinderGeometry + SphereGeometry (compatível r128)
  sculpt(body, new T.CylinderGeometry(0.24, 0.24, 0.62, 18), M.wool, [0, 0, 0], [Math.PI / 2, 0, 0], [0.95, 1.0, 1.05]);
  sculpt(body, new T.SphereGeometry(0.24, 18, 16), M.wool, [0, 0, 0.31], [0, 0, 0], [0.95, 1.05, 1.0]);
  sculpt(body, new T.SphereGeometry(0.24, 18, 16), M.wool, [0, 0, -0.31], [0, 0, 0], [0.95, 1.05, 1.0]);

  sculpt(body, new T.ConeGeometry(0.07, 0.22, 8), M.wool, [0, 0.08, -0.45], [-2.3, 0, 0]);
  sculpt(body, new T.CylinderGeometry(0.255, 0.255, 0.44, 18, 1, true, -Math.PI * 0.75, Math.PI * 1.5), M.blanket, [0, 0.02, 0], [0, 0, Math.PI / 2]);

  // KRONOS na Lhama: Anel temporal azul-celeste giratório acima do dorso
  const kBackRing = new T.Mesh(new T.TorusGeometry(0.22, 0.013, 8, 28), M.divineGlow);
  kBackRing.rotation.x = Math.PI / 2;
  kBackRing.position.set(0, 0.34, -0.02);
  body.add(kBackRing);
  llamaGodParts.kronos.push(kBackRing);

  for (const side of [-1, 1]) {
    sculpt(body, new T.BoxGeometry(0.14, 0.24, 0.30), M.leather, [side * 0.28, -0.02, -0.02], [0, 0, side * -0.12]);
    sculpt(body, new T.BoxGeometry(0.15, 0.04, 0.31), M.gold, [side * 0.28, 0.06, -0.02], [0, 0, side * -0.12]);

    // Kronos: Estrelas cronológicas nos alforjes
    const kStar = sculpt(body, new T.OctahedronGeometry(0.036, 0), M.divineGlow, [side * 0.355, -0.02, -0.02]);
    llamaGodParts.kronos.push(kStar);

    // Oranos: Pequenas asas douradas nos alforjes
    const oWing = group(body, side * 0.35, 0.04, -0.02);
    sculpt(oWing, new T.BoxGeometry(0.03, 0.07, 0.28), M.gold, [0, 0.03, -0.04], [0.22, 0, side * -0.25]);
    sculpt(oWing, new T.BoxGeometry(0.025, 0.05, 0.22), M.pearlWhite, [side * 0.01, -0.01, -0.06], [0.15, 0, side * -0.20]);
    llamaGodParts.oranos.push(oWing);

    // Gaia: Brotos e flores esmeralda nos alforjes
    const gSprout = group(body, side * 0.28, 0.11, -0.02);
    sculpt(gSprout, new T.DodecahedronGeometry(0.045, 0), M.foliage, [0, 0.02, 0.04]);
    sculpt(gSprout, new T.DodecahedronGeometry(0.038, 0), M.foliage, [0, 0.03, -0.05]);
    sculpt(gSprout, new T.OctahedronGeometry(0.028, 0), M.divineGlow, [0, 0.065, 0]);
    llamaGodParts.gaia.push(gSprout);
  }

  const neck = group(body, 0, 0.14, 0.36);
  sculpt(neck, new T.CylinderGeometry(0.11, 0.16, 0.58, 16), M.wool, [0, 0.26, 0.06], [0.22, 0, 0]);
  const neckCollar = new T.TorusGeometry(0.135, 0.016, 8, 22);
  neckCollar.rotateX(Math.PI / 2);
  sculpt(neck, neckCollar, M.gold, [0, 0.24, 0.06], [0.22, 0, 0]);

  const oChestSun = sculpt(neck, new T.OctahedronGeometry(0.038, 0), M.divineGlow, [0, 0.20, 0.19]);
  llamaGodParts.oranos.push(oChestSun);

  const gGarland = group(neck, 0, 0.24, 0.06);
  gGarland.rotation.x = 0.22;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    sculpt(gGarland, new T.DodecahedronGeometry(0.032, 0), M.foliage, [Math.cos(a) * 0.148, 0, Math.sin(a) * 0.148]);
    if (i % 2 === 0) {
      sculpt(gGarland, new T.OctahedronGeometry(0.020, 0), M.divineGlow, [Math.cos(a) * 0.165, 0.01, Math.sin(a) * 0.165]);
    }
  }
  llamaGodParts.gaia.push(gGarland);

  const head = group(neck, 0, 0.54, 0.14);
  sculpt(head, new T.SphereGeometry(0.125, 16, 16), M.wool, [0, 0, 0], [0, 0, 0], [0.85, 0.95, 1.15]);
  sculpt(head, new T.CylinderGeometry(0.055, 0.075, 0.16, 12), M.faceSkin, [0, -0.02, 0.14], [Math.PI / 2, 0, 0]);
  const eyeMat = new T.MeshStandardMaterial({ color: 0x09090b, roughness: 0.2 });
  for (const side of [-1, 1]) {
    sculpt(head, new T.SphereGeometry(0.018, 10, 10), eyeMat, [side * 0.078, 0.025, 0.06]);
    sculpt(head, new T.ConeGeometry(0.026, 0.18, 6), M.faceSkin, [side * 0.062, 0.14, -0.02], [-0.15, 0, side * -0.18]);
  }

  const legs = [];
  const legCoords = [
    [-0.13, -0.14, 0.28],
    [0.13, -0.14, 0.28],
    [-0.13, -0.14, -0.28],
    [0.13, -0.14, -0.28]
  ];
  legCoords.forEach(([lx, ly, lz], idx) => {
    const legPivot = group(body, lx, ly, lz);
    sculpt(legPivot, new T.CylinderGeometry(0.068, 0.044, 0.36, 12), M.wool, [0, -0.18, 0]);
    sculpt(legPivot, new T.CylinderGeometry(0.042, 0.036, 0.30, 10), M.faceSkin, [0, -0.48, 0]);
    sculpt(legPivot, new T.CylinderGeometry(0.040, 0.044, 0.06, 10), M.hoof, [0, -0.65, 0.01]);
    legs.push({ pivot: legPivot, phase: (idx === 0 || idx === 3) ? 0 : Math.PI });
  });

  function applyGodTheme(godKey) {
    const next = ATLANTEAN_GODS[godKey] || ATLANTEAN_GODS.kronos;
    M.blanket.color.setHex(next.llamaBlanket);
    M.divineGlow.emissive.setHex(next.ringHex);
    Object.keys(llamaGodParts).forEach(k => {
      const active = (k === godKey);
      llamaGodParts[k].forEach(obj => { obj.visible = active; });
    });
  }

  applyGodTheme(initialGod);

  return { root, body, neck, head, legs, applyGodTheme, baseBodyY, kBackRing };
}

const PART_N = 90;
const partPos = new Float32Array(PART_N * 3).fill(-100);
const partVel = new Float32Array(PART_N * 3);
const partLife = new Float32Array(PART_N);
let partIdx = 0;

const partGeo = new T.BufferGeometry();
partGeo.setAttribute('position', new T.BufferAttribute(partPos, 3));
const partMat = new T.PointsMaterial({
  color: ATLANTEAN_GODS.kronos.sparkHex,
  size: 0.11,
  transparent: true,
  opacity: 0.95,
  blending: T.AdditiveBlending,
  depthWrite: false
});
scene.add(new T.Points(partGeo, partMat));

function spawnHeroBurst(x, z, count = 24) {
  for (let k = 0; k < count; k++) {
    const i = partIdx;
    partIdx = (partIdx + 1) % PART_N;
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.65;
    partPos[i * 3] = x + Math.cos(a) * r;
    partPos[i * 3 + 1] = 0.15 + Math.random() * 0.4;
    partPos[i * 3 + 2] = z + Math.sin(a) * r;
    partVel[i * 3] = Math.cos(a) * 1.1;
    partVel[i * 3 + 1] = 2.0 + Math.random() * 2.4;
    partVel[i * 3 + 2] = Math.sin(a) * 1.1;
    partLife[i] = 0.55 + Math.random() * 0.35;
  }
  heroLight.position.set(x, 1.8, z);
  heroLight.intensity = 10.0;
}

const ascensionWaves = [];
function triggerHeroAscensionWave(x, z) {
  const ring = new T.Mesh(
    new T.RingGeometry(0.35, 0.85, 48),
    new T.MeshBasicMaterial({
      color: 0xfacc15,
      transparent: true,
      opacity: 0.95,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.04, z);
  scene.add(ring);
  ascensionWaves.push({ mesh: ring, life: 0.95, max: 0.95 });
  spawnHeroBurst(x, z, 32);
}

function updateParticles(dt) {
  for (let i = 0; i < PART_N; i++) {
    if (partLife[i] <= 0) continue;
    partLife[i] -= dt;
    partPos[i * 3] += partVel[i * 3] * dt;
    partPos[i * 3 + 1] += partVel[i * 3 + 1] * dt;
    partPos[i * 3 + 2] += partVel[i * 3 + 2] * dt;
    if (partLife[i] <= 0) partPos[i * 3 + 1] = -100;
  }
  partGeo.attributes.position.needsUpdate = true;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, -0.15, 0.85);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.005, 1.8, 14.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const delta = pinchStartDist - dist;
    targetCamDist = T.MathUtils.clamp(targetCamDist + delta * 0.015, 1.8, 14.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ==========================================================================
   7. LOOP DE ANIMAÇÃO (COM PÉS E CASCOS FIRMEMENTE APOIADOS EM Y = 0.00)
   ========================================================================== */
let sparkDone = false;

function animateCitizen(c, dt, t, offsetX, phaseOffset) {
  if (!c.root.visible) return;

  let vx = offsetX;
  let vz = 0;
  let vy = 0;
  let yaw = 0;
  let pitch = 0;
  let torsoYaw = 0;
  const breath = Math.sin(t * 2.3 + phaseOffset) * 0.012;

  if (action === 'andar') {
    const a = t * 0.92 + phaseOffset * 0.4;
    const R = c.isFemale ? 2.15 : 2.75;
    vx = Math.cos(a) * R;
    vz = Math.sin(a) * R;
    yaw = -a;
    pitch = 0.05;

    const stride = t * 5.6 + phaseOffset;
    const sinS = Math.sin(stride);
    const cosS = Math.cos(stride);
    vy = Math.abs(cosS) * 0.025;
    torsoYaw = sinS * 0.08;

    c.legs.L.hip.rotation.x = -0.10 + sinS * 0.34;
    c.legs.L.knee.rotation.x = 0.14 + Math.max(0, -cosS) * 0.34;
    c.legs.R.hip.rotation.x = -0.10 - sinS * 0.34;
    c.legs.R.knee.rotation.x = 0.14 + Math.max(0, cosS) * 0.34;

    c.rightArm.arm.rotation.set(-0.15 - sinS * 0.35, 0.08, 0.14);
    c.rightArm.elbow.rotation.set(-0.25, 0, 0.08);
    c.leftArm.arm.rotation.set(-0.15 + sinS * 0.35, -0.08, -0.14);
    c.leftArm.elbow.rotation.set(-0.25, 0, -0.08);
  } else if (action === 'madeira' || action === 'ouro' || action === 'construir') {
    vx = (whoMode === 'todos') ? offsetX : -0.25;
    vz = 0.25;
    yaw = (whoMode === 'todos') ? -offsetX * 0.42 : 0.15;

    const speed = isHeroPromoted ? 5.2 : 3.9;
    const swing = (t * speed + phaseOffset) % (Math.PI * 2);
    const strike = Math.sin(swing);

    pitch = 0.12 + strike * 0.14;
    torsoYaw = -0.18 + strike * 0.28;

    c.rightArm.arm.rotation.set(-1.35 + strike * 0.95, 0.18, 0.25);
    c.rightArm.elbow.rotation.set(-0.65 + strike * 0.35, 0.1, 0.1);
    c.leftArm.arm.rotation.set(-0.65 + strike * 0.35, -0.25, -0.22);
    c.leftArm.elbow.rotation.set(-0.85, -0.15, 0.15);

    c.legs.L.hip.rotation.set(-0.16, -0.10, -0.06);
    c.legs.L.knee.rotation.set(0.20, 0, 0);
    c.legs.R.hip.rotation.set(0.14, 0.10, 0.06);
    c.legs.R.knee.rotation.set(0.16, 0, 0);

    if (strike > 0.92 && !sparkDone) {
      sparkDone = true;
      spawnHeroBurst(0, 1.18, 10);
    } else if (strike < 0.2) {
      sparkDone = false;
    }
  } else if (action === 'fruta') {
    vx = (whoMode === 'todos') ? offsetX : -0.25;
    vz = 0.28;
    yaw = (whoMode === 'todos') ? -offsetX * 0.42 : 0.15;

    const pick = Math.sin(t * 3.4 + phaseOffset);
    pitch = 0.18 + pick * 0.06;
    torsoYaw = pick * 0.18;

    c.leftArm.arm.rotation.set(-0.55, -0.28, -0.24);
    c.leftArm.elbow.rotation.set(-1.05, -0.2, 0.2);

    c.rightArm.arm.rotation.set(-0.95 - pick * 0.35, 0.22 - pick * 0.25, 0.22);
    c.rightArm.elbow.rotation.set(-0.55 - pick * 0.45, 0.15, 0.15);

    c.legs.L.hip.rotation.set(-0.14, -0.08, -0.04);
    c.legs.L.knee.rotation.set(0.18, 0, 0);
    c.legs.R.hip.rotation.set(0.12, 0.08, 0.04);
    c.legs.R.knee.rotation.set(0.16, 0, 0);
  } else {
    vx = offsetX;
    vz = 0;
    yaw = Math.sin(t * 0.45 + phaseOffset) * 0.12 + (whoMode === 'todos' ? -offsetX * 0.14 : 0);

    c.rightArm.arm.rotation.set(-0.14, 0.08, 0.16 + Math.sin(t * 1.8 + phaseOffset) * 0.02);
    c.rightArm.elbow.rotation.set(-0.32, 0.06, 0.08);
    c.leftArm.arm.rotation.set(-0.14, -0.08, -0.16 - Math.cos(t * 1.8 + phaseOffset) * 0.02);
    c.leftArm.elbow.rotation.set(-0.32, -0.06, -0.08);

    c.legs.L.hip.rotation.set(-0.08, -0.08, -0.04);
    c.legs.L.knee.rotation.set(0.10, 0, 0);
    c.legs.R.hip.rotation.set(0.06, 0.08, 0.04);
    c.legs.R.knee.rotation.set(0.08, 0, 0);
  }

  c.root.position.set(vx, vy, vz);
  c.root.rotation.set(0, yaw, 0);
  c.body.position.y = c.baseBodyY;
  c.torso.position.y = 1.28 + breath;
  c.torso.rotation.set(pitch, torsoYaw, 0);

  if (c.kronosBackHalo) {
    c.kronosBackHalo.rotation.z += dt * (isHeroPromoted ? 1.8 : 0.85);
  }
  if (c.oranosWings) {
    c.oranosWings.rotation.y = Math.sin(t * 3.2 + phaseOffset) * 0.08;
  }
  c.godFootAura.rotation.z -= dt * 0.5;
  c.godFootAura.material.opacity = isHeroPromoted ? 0.15 : (0.32 + Math.sin(t * 3.5 + phaseOffset) * 0.08);

  if (isHeroPromoted) {
    c.heroGroundAura.rotation.z += dt * 1.6;
    c.heroGroundAura.scale.setScalar(1 + Math.sin(t * 5) * 0.08);
    if (Math.random() < 0.14) spawnHeroBurst(vx, vz, 1);
  } else if (Math.random() < 0.04) {
    spawnHeroBurst(vx, vz, 1);
  }
}

function animateLlama(dt, t) {
  let lx = (whoMode === 'todos') ? 1.15 : 0.72;
  let lz = -0.10;
  let ly = 0;
  let yaw = -0.22 + Math.sin(t * 0.6) * 0.08;

  if (action === 'andar') {
    const a = t * 0.92 - 0.55;
    const R = 2.45;
    lx = Math.cos(a) * R;
    lz = Math.sin(a) * R;
    yaw = -a;

    const stride = t * 6.4;
    ly = Math.abs(Math.cos(stride)) * 0.025;
    for (const lg of atlanteanLlama.legs) {
      lg.pivot.rotation.x = Math.sin(stride + lg.phase) * 0.34;
    }
  } else {
    for (const lg of atlanteanLlama.legs) {
      lg.pivot.rotation.x = 0;
    }
    atlanteanLlama.head.rotation.y = Math.sin(t * 1.4) * 0.18;
    atlanteanLlama.head.rotation.x = Math.cos(t * 1.1) * 0.08;
  }

  atlanteanLlama.root.position.set(lx, ly, lz);
  atlanteanLlama.root.rotation.set(0, yaw, 0);
  atlanteanLlama.body.position.y = atlanteanLlama.baseBodyY;
  if (atlanteanLlama.kBackRing) {
    atlanteanLlama.kBackRing.rotation.z += dt * 1.2;
  }
}

const clock = new T.Clock();
let elapsed = 0;
let loopRunning = false;

function animate() {
  loopRunning = true;
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const manX = (whoMode === 'todos') ? -0.78 : -0.28;
  const womanX = (whoMode === 'todos') ? 0.12 : -0.28;

  animateCitizen(atlanteanMan, dt, elapsed, manX, 0);
  animateCitizen(atlanteanWoman, dt, elapsed, womanX, 1.3);
  animateLlama(dt, elapsed);

  for (let i = ascensionWaves.length - 1; i >= 0; i--) {
    const aw = ascensionWaves[i];
    aw.life -= dt;
    const k = Math.max(0, aw.life / aw.max);
    aw.mesh.scale.setScalar(1 + (1 - k) * 4.5);
    aw.mesh.material.opacity = 0.95 * k;
    if (aw.life <= 0) {
      scene.remove(aw.mesh);
      aw.mesh.geometry.dispose();
      aw.mesh.material.dispose();
      ascensionWaves.splice(i, 1);
    }
  }

  heroLight.intensity = isHeroPromoted ? (3.2 + Math.sin(elapsed * 8) * 0.8) : Math.max(0, heroLight.intensity - dt * 18);
  updateParticles(dt);

  camDist = T.MathUtils.lerp(camDist, targetCamDist, 0.14);
  if (!dragging && !focusFaces && action !== 'andar') camAngle += dt * 0.05;

  const desiredTarget = focusFaces
    ? new T.Vector3(-0.25, 1.50, 0)
    : new T.Vector3(0.15, 0.95, 0.10);
  currentLookAt.lerp(desiredTarget, 0.13);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// Inicia imediatamente e mantém fallback seguro no onload
animate();
window.addEventListener('load', function () {
  if (!loopRunning) animate();
});
</script>
