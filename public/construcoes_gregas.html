/* ==========================================================================
   2. TEXTURAS PROCEDURAIS PBR (PEDRA/MÁRMORE, TELHAS, TOLDOS, ALVOS, SOLO)
   ========================================================================== */
function createWallTexture(theme, isBright = false) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');

  const baseHex = isBright ? theme.wallBright : theme.wallBase;
  const c = new T.Color(baseHex);
  const r0 = Math.floor(c.r * 255);
  const g0 = Math.floor(c.g * 255);
  const b0 = Math.floor(c.b * 255);

  ctx.fillStyle = `rgb(${r0}, ${g0}, ${b0})`;
  ctx.fillRect(0, 0, 512, 512);

  const rows = 14;
  const rH = 512 / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rH;
    const cols = 7;
    const cW = 512 / cols;
    const off = (r % 2 === 0) ? 0 : cW * 0.5;
    for (let col = -1; col <= cols; col++) {
      const x = col * cW + off;
      const d = Math.floor((Math.random() - 0.5) * 22);
      ctx.fillStyle = `rgb(${T.MathUtils.clamp(r0 + d, 18, 252)}, ${T.MathUtils.clamp(g0 + d, 18, 252)}, ${T.MathUtils.clamp(b0 + d, 18, 252)})`;
      ctx.fillRect(x + 2, y + 2, cW - 4, rH - 4);
      ctx.strokeStyle = theme.id === 'hades' ? 'rgba(0,0,0,0.45)' : 'rgba(45,40,35,0.26)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, cW - 2, rH - 2);
    }
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createRoofTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = theme.roofBase;
  ctx.fillRect(0, 0, 512, 512);

  const tiles = 24;
  const tW = 512 / tiles;
  for (let i = 0; i < tiles; i++) {
    const x = i * tW;
    const grad = ctx.createLinearGradient(x, 0, x + tW, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0.35)');
    grad.addColorStop(0.35, theme.roofRib);
    grad.addColorStop(0.75, theme.roofPatina);
    grad.addColorStop(1, 'rgba(0,0,0,0.40)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, 0, tW, 512);
  }

  // Telhas intercaladas com variação sutil
  for (let y = 0; y < 512; y += 32) {
    ctx.strokeStyle = 'rgba(10, 10, 10, 0.34)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
    for (let i = 0; i < tiles; i += 2) {
      if ((i + y / 32) % 3 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.09)';
        ctx.fillRect(i * tW + 2, y + 2, tW - 4, 28);
      }
    }
  }

  const tex = new T.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createAwningTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');

  const stripes = 12;
  const sW = 256 / stripes;
  for (let i = 0; i < stripes; i++) {
    ctx.fillStyle = (i % 2 === 0) ? theme.awningA : theme.awningB;
    ctx.fillRect(i * sW, 0, sW, 256);
  }
  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createTargetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, 256, 256);

  const rings = [
    { r: 120, color: '#991b1b' },
    { r: 92, color: '#f8fafc' },
    { r: 64, color: '#dc2626' },
    { r: 36, color: '#f8fafc' },
    { r: 16, color: '#dc2626' }
  ];
  rings.forEach(ring => {
    ctx.beginPath();
    ctx.arc(128, 128, ring.r, 0, Math.PI * 2);
    ctx.fillStyle = ring.color;
    ctx.fill();
  });

  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

function createGroundTexture(theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = theme.groundGrass;
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 6500; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 255, 0.07)' : 'rgba(10, 20, 10, 0.14)';
    ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 10, 10);
  }

  const cx = 512, cy = 512;
  const dirtGrad = ctx.createRadialGradient(cx, cy, 170, cx, cy, 410);
  dirtGrad.addColorStop(0, theme.groundDirt);
  dirtGrad.addColorStop(0.75, theme.groundDirt);
  dirtGrad.addColorStop(1, 'rgba(191, 160, 112, 0)');
  ctx.fillStyle = dirtGrad;
  ctx.fillRect(0, 0, 1024, 1024);

  // Pedras de calçamento grego no caminho
  ctx.fillStyle = theme.id === 'hades' ? 'rgba(65, 60, 68, 0.65)' : 'rgba(155, 145, 128, 0.62)';
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2;
    const r = 210 + (i % 4) * 35;
    ctx.fillRect(cx + Math.cos(a) * r - 18, cy + Math.sin(a) * r - 14, 36, 28);
  }

  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}

/* ==========================================================================
   3. HELPERS DE GEOMETRIA ARQUITETÔNICA & ELEMENTOS DIVINOS (ZEUS/POSEIDON/HADES)
   ========================================================================== */
function group(parent, x = 0, y = 0, z = 0) {
  const g = new T.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}

function box(parent, w, h, d, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function cyl(parent, rt, rb, h, segs, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, segs), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

// Emblema Divino 3D Dinâmico (⚡ Raio de Zeus | 🔱 Tridente de Poseidon | 💀 Bidente & Crânio de Hades)
function createDivineEmblem(parent, M, pos = [0, 0, 0], scale = 1.0, rotY = 0) {
  const sym = group(parent, pos[0], pos[1], pos[2]);
  sym.scale.setScalar(scale);
  sym.rotation.y = rotY;

  // 1. Zeus: Raio Olímpico
  const zeus = group(sym);
  box(zeus, 0.08, 0.34, 0.05, M.divineGlow, [-0.04, 0.14, 0], [0, 0, -0.35]);
  box(zeus, 0.14, 0.06, 0.05, M.gold, [0, 0, 0]);
  cyl(zeus, 0.005, 0.07, 0.36, 4, M.divineGlow, [0.05, -0.15, 0], [0, 0, Math.PI - 0.35]);

  // 2. Poseidon: Tridente Sagrado
  const poseidon = group(sym);
  cyl(poseidon, 0.024, 0.024, 0.56, 8, M.gold, [0, -0.06, 0]);
  box(poseidon, 0.28, 0.04, 0.04, M.gold, [0, 0.08, 0]);
  cyl(poseidon, 0.005, 0.045, 0.28, 4, M.divineGlow, [0, 0.24, 0]);
  for (const sx of [-1, 1]) {
    cyl(poseidon, 0.005, 0.035, 0.22, 4, M.divineGlow, [sx * 0.12, 0.20, 0], [0, 0, sx * -0.08]);
  }
  poseidon.visible = false;

  // 3. Hades: Bidente Infernal + Crânio do Estige
  const hades = group(sym);
  cyl(hades, 0.024, 0.024, 0.46, 8, M.gold, [0, -0.12, 0]);
  box(hades, 0.24, 0.04, 0.04, M.gold, [0, 0.06, 0]);
  for (const sx of [-1, 1]) {
    cyl(hades, 0.005, 0.042, 0.26, 4, M.divineGlow, [sx * 0.10, 0.20, 0]);
  }
  const skull = new T.Mesh(new T.SphereGeometry(0.065, 10, 10), M.divineGlow);
  skull.position.set(0, 0.06, 0.03);
  hades.add(skull);
  hades.visible = false;

  M.emblems.push({ zeus, poseidon, hades });
  return sym;
}

// Telhado Grego Clássico de Duas Águas com Frontão Triangular
function buildGableRoof(parent, w, d, h, M, yBase, hasTrim = true, addEmblem = false) {
  const g = group(parent, 0, yBase, 0);
  const rx = w * 0.5, rz = d * 0.5;
  const slopeLen = Math.hypot(rx, h);
  const slopeAng = Math.atan2(h, rx);

  box(g, slopeLen + 0.10, 0.08, d + 0.14, M.roof, [-rx * 0.5, h * 0.5, 0], [0, 0, slopeAng]);
  box(g, slopeLen + 0.10, 0.08, d + 0.14, M.roof, [rx * 0.5, h * 0.5, 0], [0, 0, -slopeAng]);

  // Cumeeira superior
  box(g, 0.12, 0.09, d + 0.16, M.wallBright, [0, h + 0.03, 0]);

  if (hasTrim) {
    box(g, w + 0.08, 0.07, d + 0.08, M.trim, [0, -0.02, 0]);
  }

  // Frontões triangulares frontal e traseiro
  const shape = new T.Shape();
  shape.moveTo(-rx, 0);
  shape.lineTo(rx, 0);
  shape.lineTo(0, h);
  shape.closePath();
  const geo = new T.ExtrudeGeometry(shape, { depth: d - 0.02, bevelEnabled: false });
  geo.translate(0, 0, -(d - 0.02) * 0.5);
  const ped = new T.Mesh(geo, M.wallBright);
  ped.castShadow = true;
  ped.receiveShadow = true;
  g.add(ped);

  if (addEmblem) {
    createDivineEmblem(g, M, [0, h * 0.38, rz + 0.03], h * 1.1, 0);
    createDivineEmblem(g, M, [0, h * 0.38, -rz - 0.03], h * 1.1, Math.PI);
  }
  return g;
}

// Telhado Inclinado Simples (Alpendre / Galeria / Tenda)
function buildShedRoof(parent, w, d, hRise, M, pos = [0, 0, 0], rotY = 0, useAwning = false) {
  const g = group(parent, pos[0], pos[1], pos[2]);
  g.rotation.y = rotY;
  const slopeLen = Math.hypot(d, hRise);
  const ang = Math.atan2(hRise, d);
  box(g, w + 0.08, 0.07, slopeLen + 0.10, useAwning ? M.awning : M.roof, [0, hRise * 0.5, 0], [ang, 0, 0]);
  box(g, w + 0.10, 0.06, 0.08, M.trim, [0, 0.02, d * 0.5]);
  return g;
}

// Estandarte Grego com Bandeira e Mastro
function buildGreekBanner(parent, M, pos = [0, 0, 0], rotY = 0, scale = 1.0) {
  const b = group(parent, pos[0], pos[1], pos[2]);
  b.rotation.y = rotY;
  b.scale.setScalar(scale);

  cyl(b, 0.025, 0.03, 1.35, 8, M.wood, [0, 0.675, 0]);
  cyl(b, 0.01, 0.04, 0.12, 8, M.gold, [0, 1.38, 0]);
  box(b, 0.42, 0.03, 0.03, M.wood, [0.20, 1.24, 0]);
  box(b, 0.36, 0.54, 0.02, M.trim, [0.20, 0.95, 0]);
  createDivineEmblem(b, M, [0.20, 0.95, 0.02], 0.42, 0);
  return b;
}

// Braseiro Grego com Chama Animada
function buildBrazier(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const b = group(parent, pos[0], pos[1], pos[2]);
  b.scale.setScalar(scale);
  cyl(b, 0.14, 0.19, 0.08, 12, M.gold, [0, 0.04, 0]);
  cyl(b, 0.045, 0.06, 0.38, 10, M.gold, [0, 0.27, 0]);
  cyl(b, 0.22, 0.12, 0.14, 12, M.gold, [0, 0.52, 0]);
  const flame = new T.Mesh(new T.ConeGeometry(0.16, 0.38, 10), M.flame);
  flame.position.set(0, 0.74, 0);
  b.add(flame);
  M.flames.push(flame);
  return b;
}

// Ânfora Grega + Barril de Madeira + Cipreste Mediterrâneo
function buildAmphora(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const a = group(parent, pos[0], pos[1], pos[2]);
  a.scale.setScalar(scale);
  cyl(a, 0.10, 0.06, 0.16, 12, M.terracotta, [0, 0.08, 0]);
  const belly = new T.Mesh(new T.SphereGeometry(0.12, 12, 12), M.terracotta);
  belly.position.y = 0.22;
  a.add(belly);
  cyl(a, 0.05, 0.04, 0.12, 10, M.wallBright, [0, 0.36, 0]);

}

function buildBarrel(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const b = group(parent, pos[0], pos[1], pos[2]);
  b.scale.setScalar(scale);
  cyl(b, 0.13, 0.13, 0.34, 12, M.wood, [0, 0.17, 0]);
  cyl(b, 0.136, 0.136, 0.04, 12, M.iron, [0, 0.08, 0]);
  cyl(b, 0.136, 0.136, 0.04, 12, M.iron, [0, 0.26, 0]);

}

function buildCypress(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const t = group(parent, pos[0], pos[1], pos[2]);
  t.scale.setScalar(scale);
  cyl(t, 0.04, 0.06, 0.26, 8, M.wood, [0, 0.13, 0]);
  cyl(t, 0.02, 0.22, 1.35, 10, M.foliage, [0, 0.85, 0]);

}

// Pilar/Fonte de Água para Poseidon ou Pira de Obsidiana para Hades (Elementos exclusivos por Deus)
function buildGodSignatureDecor(parent, M, tier) {
  const g = group(parent);

  // Elementos exclusivos de Poseidon: Espelho d'água / Fonte cristalina com Tridente
  const posGroup = group(g);
  const poolBase = cyl(posGroup, 0.72, 0.80, 0.16, 18, M.wallBright, [-2.45, 0.08, 1.55]);
  const waterDisc = new T.Mesh(new T.CylinderGeometry(0.64, 0.64, 0.17, 18), M.water);
  waterDisc.position.set(-2.45, 0.09, 1.55);
  posGroup.add(waterDisc);
  cyl(posGroup, 0.08, 0.12, 0.55, 12, M.gold, [-2.45, 0.36, 1.55]);
  createDivineEmblem(posGroup, M, [-2.45, 0.85, 1.55], 0.95, 0.4);
  if (tier >= 4) {
    const waterDisc2 = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.16, 16), M.water);
    waterDisc2.position.set(2.45, 0.08, 1.55);
    posGroup.add(waterDisc2);
    cyl(posGroup, 0.62, 0.68, 0.15, 16, M.wallBright, [2.45, 0.075, 1.55]);
  }
  M.poseidonOnly.push(posGroup);

  // Elementos exclusivos de Hades: Obeliscos de Obsidiana e Piras Espectrais do Estige
  const hadesGroup = group(g);
  box(hadesGroup, 0.42, 0.95, 0.42, M.obsidian, [-2.45, 0.475, 1.55]);
  cyl(hadesGroup, 0.01, 0.26, 0.42, 4, M.obsidian, [-2.45, 1.16, 1.55]);
  const styxFlame1 = new T.Mesh(new T.ConeGeometry(0.22, 0.52, 8), M.flame);
  styxFlame1.position.set(-2.45, 1.48, 1.55);
  hadesGroup.add(styxFlame1);
  M.flames.push(styxFlame1);
  if (tier >= 4) {
    box(hadesGroup, 0.42, 0.95, 0.42, M.obsidian, [2.45, 0.475, 1.55]);
    const styxFlame2 = new T.Mesh(new T.ConeGeometry(0.22, 0.52, 8), M.flame);
    styxFlame2.position.set(2.45, 1.15, 1.55);
    hadesGroup.add(styxFlame2);
    M.flames.push(styxFlame2);
  }
  hadesGroup.visible = false;
  M.hadesOnly.push(hadesGroup);

  // Elementos exclusivos de Zeus: Pilares Olímpicos Dourados com Orbes de Raio
  const zeusGroup = group(g);
  cyl(zeusGroup, 0.14, 0.18, 1.15, 14, M.wallBright, [-2.45, 0.575, 1.55]);
  box(zeusGroup, 0.44, 0.14, 0.44, M.gold, [-2.45, 1.20, 1.55]);
  createDivineEmblem(zeusGroup, M, [-2.45, 1.52, 1.55], 0.95, 0.4);
  if (tier >= 4) {
    cyl(zeusGroup, 0.14, 0.18, 1.15, 14, M.wallBright, [2.45, 0.575, 1.55]);
    box(zeusGroup, 0.44, 0.14, 0.44, M.gold, [2.45, 1.20, 1.55]);
    createDivineEmblem(zeusGroup, M, [2.45, 1.52, 1.55], 0.95, -0.4);
  }
  M.zeusOnly.push(zeusGroup);

  return g;
}

// --------------------------------------------------------------------------
// 4.1 QUARTEL GREGO (BARRACKS)
// --------------------------------------------------------------------------
function buildQuartel(parent, M, tier) {
  const root = group(parent);
  const scaleMod = 1 + (tier - 2) * 0.04;
  root.scale.setScalar(scaleMod);

  box(root, 3.85, 0.14, 3.55, M.wallBase, [0, 0.07, 0]);
  if (tier >= 4) {
    box(root, 3.92, 0.06, 3.62, M.gold, [0, 0.16, 0]);
  }

  // Salão principal traseiro com pórtico de colunas dóricas
  const mainH = 1.25 + (tier - 2) * 0.12;
  const colMat = tier === 5 ? M.gold : M.wallBright;
  box(root, 2.95, mainH, 1.35, M.wallBase, [0, 0.14 + mainH * 0.5, -0.78]);
  box(root, 3.02, 0.12, 1.42, M.trim, [0, 0.22, -0.78]);
  box(root, 0.78, mainH * 0.72, 0.08, tier >= 4 ? M.gold : M.wood, [0, 0.14 + mainH * 0.36, -0.09]);

  for (const cx of [-0.62, -0.22, 0.22, 0.62]) {
    cyl(root, 0.065, 0.08, mainH, 12, colMat, [cx, 0.14 + mainH * 0.5, 0.16]);
  }
  box(root, 1.56, 0.12, 0.42, M.wallBright, [0, 0.14 + mainH + 0.06, 0.04]);
  buildGableRoof(root, 3.12, 1.56, 0.52, M, 0.14 + mainH, true, true);

  // Ala lateral direita (T2+) e ala lateral esquerda formando pátio em U (T3+)
  const wingH = 0.88 + (tier - 2) * 0.06;
  box(root, 0.85, wingH, 1.65, M.wallBase, [1.28, 0.14 + wingH * 0.5, 0.48]);
  box(root, 0.90, 0.10, 1.70, M.trim, [1.28, 0.22, 0.48]);
  buildGableRoof(root, 0.96, 1.78, 0.32, M, 0.14 + wingH, true, false);
  buildGreekBanner(root, M, [1.56, 0.14, 1.38], 0.3, 0.95);

  if (tier >= 3) {
    box(root, 0.85, wingH, 1.65, M.wallBase, [-1.28, 0.14 + wingH * 0.5, 0.48]);
    box(root, 0.90, 0.10, 1.70, M.trim, [-1.28, 0.22, 0.48]);
    buildGableRoof(root, 0.96, 1.78, 0.32, M, 0.14 + wingH, true, false);
    buildGreekBanner(root, M, [-1.56, 0.14, 1.38], -0.3, 0.95);
  }

  // Boneco de treino e suporte de lanças no pátio militar
  const dummy = group(root, 0.42, 0.14, 0.95);
  cyl(dummy, 0.04, 0.05, 0.95, 8, M.wood, [0, 0.475, 0]);
  box(dummy, 0.58, 0.07, 0.07, M.wood, [0, 0.72, 0]);
  cyl(dummy, 0.12, 0.14, 0.36, 10, M.hay, [0, 0.68, 0]);

  const rack = group(root, -0.45, 0.14, 0.92);
  box(rack, 0.55, 0.05, 0.16, M.wood, [0, 0.03, 0]);
  for (let i = -2; i <= 2; i++) {
    cyl(rack, 0.012, 0.015, 1.05, 6, M.wood, [i * 0.10, 0.52, 0], [0.08, 0, 0]);
    cyl(rack, 0.004, 0.025, 0.14, 4, tier === 5 ? M.gold : M.iron, [i * 0.10, 1.08, 0.04], [0.08, 0, 0]);
  }

  if (tier >= 4) {
    buildBrazier(root, M, [-0.88, 0.14, 1.52], 0.95);
    buildBrazier(root, M, [0.88, 0.14, 1.52], 0.95);
  }
  buildCypress(root, M, [-1.72, 0.14, -1.25], 1.0);
  buildCypress(root, M, [1.72, 0.14, -1.25], 1.0);

  buildGodSignatureDecor(root, M, tier);
  return root;
}

// --------------------------------------------------------------------------
// 4.2 ESTÁBULOS GREGOS (STABLES)
// --------------------------------------------------------------------------
function buildHorseModel(parent, M, pos = [0, 0, 0], rotY = 0, isWhite = true) {
  const h = group(parent, pos[0], pos[1], pos[2]);
  h.rotation.y = rotY;
  const coat = isWhite ? M.horseWhite : M.horseBrown;

  box(h, 0.24, 0.24, 0.52, coat, [0, 0.42, 0]);
  for (const lx of [-0.08, 0.08]) {
    for (const lz of [-0.18, 0.18]) {
      box(h, 0.05, 0.30, 0.05, coat, [lx, 0.15, lz]);
    }
  }
  box(h, 0.14, 0.28, 0.16, coat, [0, 0.60, 0.24], [0.42, 0, 0]);
  box(h, 0.12, 0.14, 0.26, coat, [0, 0.72, 0.36], [0.25, 0, 0]);
  box(h, 0.04, 0.26, 0.06, M.wood, [0, 0.62, 0.15], [0.42, 0, 0]);
  box(h, 0.05, 0.26, 0.05, M.wood, [0, 0.38, -0.28], [-0.25, 0, 0]);
  return h;
}

function buildEstabulos(parent, M, tier) {
  const root = group(parent);
  const scaleMod = 1 + (tier - 2) * 0.04;
  root.scale.setScalar(scaleMod);

  box(root, 3.85, 0.12, 3.45, M.wallBase, [0, 0.06, 0]);

  // Celeiro central de dois pavimentos no fundo
  const barnH = 1.48 + (tier - 2) * 0.10;
  box(root, 2.65, barnH, 1.18, M.wallBase, [0.15, 0.12 + barnH * 0.5, -0.78]);
  box(root, 2.72, 0.12, 1.24, M.trim, [0.15, 0.22, -0.78]);
  buildGableRoof(root, 2.82, 1.34, 0.48, M, 0.12 + barnH, true, tier >= 3);

  // Cobertura aberta em L das baias dos cavalos
  const postMat = tier === 5 ? M.gold : M.wood;
  buildShedRoof(root, 2.65, 1.05, 0.34, M, [0.15, 0.88, 0.28], 0, false);
  for (const px of [-1.05, -0.25, 0.55, 1.35]) {
    cyl(root, 0.05, 0.06, 0.88, 8, postMat, [px, 0.56, 0.76]);
  }

  buildShedRoof(root, 1.15, 1.45, 0.32, M, [-1.25, 0.86, 0.42], Math.PI * 0.5, false);
  for (const pz of [-0.08, 0.45, 0.95]) {
    cyl(root, 0.05, 0.06, 0.86, 8, postMat, [-1.76, 0.55, pz]);
  }

  // Cavalos nas baias
  buildHorseModel(root, M, [-0.55, 0.12, 0.38], 0.25, true);
  buildHorseModel(root, M, [0.22, 0.12, 0.42], -0.20, false);
  if (tier >= 4) {
    buildHorseModel(root, M, [0.95, 0.12, 0.38], -0.35, true);
  }

  // Fardos de feno dourado, bebedouro, barris e estandarte
  for (const [hx, hz, hr] of [[-0.35, 1.18, 0.28], [-0.02, 1.24, 0.22], [-0.62, 1.28, 0.20]]) {
    const hayMound = new T.Mesh(new T.SphereGeometry(hr, 12, 10), M.hay);
    hayMound.scale.set(1.2, 0.75, 1.1);
    hayMound.position.set(hx, 0.12 + hr * 0.45, hz);
    hayMound.castShadow = true;
    root.add(hayMound);
  }

  box(root, 0.62, 0.22, 0.28, M.wood, [0.85, 0.23, 1.12]);
  const troughWater = new T.Mesh(new T.BoxGeometry(0.54, 0.23, 0.20), M.water);
  troughWater.position.set(0.85, 0.24, 1.12);
  root.add(troughWater);

  buildBarrel(root, M, [1.55, 0.12, 0.25], 1.0);
  buildBarrel(root, M, [1.58, 0.12, 0.62], 0.85);
  buildGreekBanner(root, M, [0.42, 0.12, 1.48], 0.2, 0.95);

  if (tier >= 5) {
    buildBrazier(root, M, [-1.45, 0.12, 1.42], 0.95);
  }

  buildGodSignatureDecor(root, M, tier);
  return root;
}

// --------------------------------------------------------------------------
// 4.3 CENTRO DE ARQUEARIA (ARCHERY RANGE)
// --------------------------------------------------------------------------
function buildArcheryTarget(parent, M, pos = [0, 0, 0], rotY = 0, scale = 1.0) {
  const t = group(parent, pos[0], pos[1], pos[2]);
  t.rotation.y = rotY;
  t.scale.setScalar(scale);

  box(t, 0.05, 0.68, 0.05, M.wood, [-0.12, 0.32, -0.10], [0.28, 0, 0]);
  box(t, 0.05, 0.68, 0.05, M.wood, [0.12, 0.32, -0.10], [0.28, 0, 0]);
  box(t, 0.05, 0.64, 0.05, M.wood, [0, 0.30, 0.14], [-0.32, 0, 0]);

  const disc = new T.Mesh(new T.CylinderGeometry(0.28, 0.28, 0.06, 20), M.target);
  disc.rotation.set(Math.PI * 0.44, 0, 0);
  disc.position.set(0, 0.42, 0.02);
  disc.castShadow = true;
  t.add(disc);

  // Flechas cravadas no alvo
  for (const [ax, ay] of [[0.03, 0.44], [-0.06, 0.38]]) {
    cyl(t, 0.008, 0.008, 0.32, 6, M.wood, [ax, ay, 0.16], [Math.PI * 0.46, 0, 0.08]);
  }
  return t;
}

function buildArquearia(parent, M, tier) {
  const root = group(parent);
  const scaleMod = 1 + (tier - 2) * 0.04;
  root.scale.setScalar(scaleMod);

  box(root, 3.85, 0.12, 3.45, M.wallBase, [0, 0.06, 0]);

  // Galpão principal alongado com pórtico lateral
  const hallH = 1.18 + (tier - 2) * 0.10;
  box(root, 1.35, hallH, 2.35, M.wallBase, [-0.85, 0.12 + hallH * 0.5, -0.25]);
  box(root, 1.40, 0.12, 2.40, M.trim, [-0.85, 0.20, -0.25]);
  const mainRoof = buildGableRoof(root, 1.48, 2.52, 0.46, M, 0.12 + hallH, true, tier >= 3);
  mainRoof.position.set(-0.85, 0.12 + hallH, -0.25);

  // Pórtico frontal do galpão
  box(root, 0.72, 0.82, 0.65, M.wallBase, [-0.85, 0.53, 1.15]);
  box(root, 0.38, 0.58, 0.06, M.wood, [-0.85, 0.41, 1.49]);
  const porchRoof = buildGableRoof(root, 0.82, 0.75, 0.26, M, 0.94, true, false);
  porchRoof.position.set(-0.85, 0.94, 1.15);

  // Galeria lateral coberta com escudos-alvo
  buildShedRoof(root, 1.75, 0.78, 0.28, M, [0.75, 0.78, -0.78], 0, false);
  for (const px of [0.02, 0.75, 1.48]) {
    cyl(root, 0.045, 0.055, 0.78, 8, tier === 5 ? M.gold : M.wood, [px, 0.51, -0.44]);
  }
  for (let i = 0; i < 4; i++) {
    const wallTarget = new T.Mesh(new T.CylinderGeometry(0.20, 0.20, 0.05, 18), M.target);
    wallTarget.rotation.set(Math.PI * 0.5, 0, 0);
    wallTarget.position.set(0.16 + i * 0.42, 0.46, -0.92);
    root.add(wallTarget);
  }

  // Cercas de madeira e alvos no campo de tiro
  for (const fz of [0.35, 1.05]) {
    box(root, 1.65, 0.04, 0.04, M.wood, [0.75, 0.34, fz]);
    for (let fx = 0.0; fx <= 1.50; fx += 0.30) {
      box(root, 0.04, 0.36, 0.04, M.wood, [fx, 0.24, fz]);
    }
  }

  buildArcheryTarget(root, M, [0.42, 0.12, 1.32], -0.25, 1.0);
  buildArcheryTarget(root, M, [1.05, 0.12, 1.25], -0.25, 1.0);
  if (tier >= 4) {
    buildArcheryTarget(root, M, [1.55, 0.12, 0.85], -0.45, 1.05);
  }

  buildGreekBanner(root, M, [-0.15, 0.12, 1.45], 0.15, 0.95);
  buildCypress(root, M, [-1.65, 0.12, 0.85], 1.0);
  buildCypress(root, M, [-1.65, 0.12, -1.15], 1.05);

  buildGodSignatureDecor(root, M, tier);
  return root;
}

// --------------------------------------------------------------------------
// 4.4 CASA DA POPULAÇÃO (ÚNICA RESIDÊNCIA EVOLUINDO DE T1 ATÉ T5 NO MESMO LOTE)
// --------------------------------------------------------------------------
function buildHouseChimney(parent, M, pos, height, isOrnate = false) {
  const [cx, cy, cz] = pos;
  box(parent, 0.24, height, 0.24, isOrnate ? M.wallBright : M.wallBase, [cx, cy + height * 0.5, cz]);
  box(parent, 0.30, 0.08, 0.30, isOrnate ? M.gold : M.trim, [cx, cy + height + 0.03, cz]);
  const smokeAnchor = new T.Object3D();
  smokeAnchor.position.set(cx, cy + height + 0.14, cz);
  parent.add(smokeAnchor);
  M.smokeAnchors.push(smokeAnchor);
}

function buildDomesticWell(parent, M, pos = [0, 0, 0]) {
  const w = group(parent, pos[0], pos[1], pos[2]);
  cyl(w, 0.28, 0.30, 0.28, 14, M.wallBase, [0, 0.14, 0]);
  cyl(w, 0.22, 0.22, 0.29, 14, M.darkInterior, [0, 0.145, 0]);
  box(w, 0.04, 0.48, 0.04, M.wood, [-0.24, 0.42, 0]);
  box(w, 0.04, 0.48, 0.04, M.wood, [0.24, 0.42, 0]);
  buildGableRoof(w, 0.62, 0.46, 0.18, M, 0.64, false, false);
  return w;
}

function buildMiniStatue(parent, M, pos = [0, 0, 0]) {
  const s = group(parent, pos[0], pos[1], pos[2]);
  box(s, 0.34, 0.24, 0.34, M.wallBright, [0, 0.12, 0]);
  box(s, 0.38, 0.05, 0.38, M.gold, [0, 0.26, 0]);
  cyl(s, 0.09, 0.13, 0.48, 12, M.gold, [0, 0.52, 0]);
  const head = new T.Mesh(new T.SphereGeometry(0.08, 12, 12), M.gold);
  head.position.y = 0.84;
  s.add(head);
  createDivineEmblem(s, M, [0.14, 0.72, 0.06], 0.38, 0);
  return s;
}

function buildCasaPopulacao(parent, M, tier) {
  const root = group(parent);

  // Lote residencial único (terreno demarcado sempre no mesmo espaço central)
  box(root, 3.45, 0.08, 3.25, M.wallBase, [0, 0.04, 0]);

  // Cerca / Mureta baixa delimitando o lote a partir de T3
  if (tier >= 3) {
    const wallMat = tier === 5 ? M.wallBright : M.wallBase;
    const capMat = tier === 5 ? M.gold : M.trim;
    // Mureta traseira e laterais
    box(root, 3.35, 0.22, 0.10, wallMat, [0, 0.19, -1.52]);
    box(root, 3.38, 0.05, 0.13, capMat, [0, 0.32, -1.52]);
    box(root, 0.10, 0.22, 3.05, wallMat, [-1.62, 0.19, 0]);
    box(root, 0.13, 0.05, 3.08, capMat, [-1.62, 0.32, 0]);
    box(root, 0.10, 0.22, 3.05, wallMat, [1.62, 0.19, 0]);
    box(root, 0.13, 0.05, 3.08, capMat, [1.62, 0.32, 0]);
    // Pilares de entrada na frente do lote
    for (const px of [-0.72, 0.72]) {
      box(root, 0.20, 0.36, 0.20, wallMat, [px, 0.26, 1.50]);
      box(root, 0.24, 0.06, 0.24, capMat, [px, 0.46, 1.50]);
    }
  }

  // ========================================================================
  // TIER 1 — CABANA ARCAICA (1 cômodo simples e rústico)
  // ========================================================================
  if (tier === 1) {
    box(root, 1.35, 0.10, 1.45, M.obsidian, [0, 0.13, -0.05]);
    box(root, 1.22, 0.78, 1.32, M.wallBase, [0, 0.57, -0.05]);
    // Porta simples de madeira e 1 janela pequena
    box(root, 0.38, 0.56, 0.06, M.wood, [0, 0.46, 0.62]);
    box(root, 0.22, 0.22, 0.06, M.darkInterior, [0.62, 0.62, 0.05]);
    buildGableRoof(root, 1.38, 1.48, 0.36, M, 0.96, false, false);
    buildHouseChimney(root, M, [-0.42, 0.18, -0.45], 1.24, false);
    buildAmphora(root, M, [0.46, 0.08, 0.68], 0.80);
    buildBarrel(root, M, [-0.52, 0.08, 0.64], 0.78);
  }

  // ========================================================================
  // TIER 2 — RESIDÊNCIA CLÁSSICA (Pedra cortada, faixa divina, 2 colunas)
  // ========================================================================
  else if (tier === 2) {
    box(root, 1.52, 0.12, 1.78, M.wallBright, [0, 0.14, -0.05]);
    box(root, 1.38, 0.92, 1.45, M.wallBase, [0, 0.66, -0.15]);
    box(root, 1.42, 0.11, 1.49, M.trim, [0, 0.26, -0.15]);
    box(root, 0.44, 0.66, 0.07, M.wood, [0, 0.53, 0.59]);
    // Janelas laterais emolduradas
    for (const jz of [-0.35, 0.20]) {
      box(root, 0.06, 0.24, 0.22, M.darkInterior, [0.70, 0.72, jz]);
      box(root, 0.06, 0.24, 0.22, M.darkInterior, [-0.70, 0.72, jz]);
    }
    // Pórtico frontal de 2 colunas dóricas
    for (const cx of [-0.54, 0.54]) {
      cyl(root, 0.055, 0.068, 0.92, 12, M.wallBright, [cx, 0.66, 0.88]);
    }
    buildGableRoof(root, 1.54, 2.02, 0.42, M, 1.12, true, true);
    buildHouseChimney(root, M, [-0.48, 0.20, -0.58], 1.45, false);
    buildAmphora(root, M, [0.68, 0.08, 0.88], 0.92);
    buildBarrel(root, M, [-0.72, 0.08, 0.82], 0.86);
    buildCypress(root, M, [-1.18, 0.08, -0.65], 0.90);
  }

  // ========================================================================
  // TIER 3 — CASA HEROICA EM L (Ala lateral anexa, 4 colunas, poço)
  // ========================================================================
  else if (tier === 3) {
    // Corpo principal vertical (direita/centro)
    box(root, 1.48, 1.02, 1.75, M.wallBase, [0.32, 0.59, -0.22]);
    box(root, 1.52, 0.12, 1.79, M.trim, [0.32, 0.18, -0.22]);
    box(root, 0.48, 0.72, 0.07, M.wood, [0.32, 0.46, 0.67]);
    // 4 colunas dóricas na entrada
    for (const cx of [-0.32, 0.10, 0.54, 0.96]) {
      cyl(root, 0.055, 0.07, 1.02, 12, M.wallBright, [cx, 0.59, 0.96]);
    }
    buildGableRoof(root, 1.62, 2.28, 0.46, M, 1.10, true, true);

    // Ala lateral anexa formando planta em L (esquerda)
    box(root, 1.08, 0.88, 1.18, M.wallBase, [-0.88, 0.52, -0.35]);
    box(root, 1.12, 0.11, 1.22, M.trim, [-0.88, 0.18, -0.35]);
    buildGableRoof(root, 1.18, 1.28, 0.36, M, 0.96, true, false);

    buildHouseChimney(root, M, [-1.12, 0.08, -0.65], 1.58, false);
    buildDomesticWell(root, M, [-0.95, 0.08, 0.78]);
    buildAmphora(root, M, [1.12, 0.08, 0.78], 0.95);
    buildBarrel(root, M, [1.22, 0.08, 0.45], 0.90);
    buildCypress(root, M, [-1.32, 0.08, -1.12], 0.95);
    buildCypress(root, M, [1.32, 0.08, -1.12], 0.95);
  }

  // ========================================================================
  // TIER 4 — SOLAR MÍTICO DE DOIS PAVIMENTOS (Sobrado com sacada e escada)
  // ========================================================================
  else if (tier === 4) {
    // Pavimento térreo amplo em L
    box(root, 2.38, 1.04, 1.68, M.wallBase, [0, 0.60, -0.32]);
    box(root, 2.44, 0.12, 1.74, M.trim, [0, 0.18, -0.32]);
    box(root, 0.56, 0.78, 0.08, M.gold, [-0.25, 0.48, 0.54]);

    // Pórtico térreo de 4 colunas
    for (const cx of [-0.92, -0.46, 0.02, 0.48]) {
      cyl(root, 0.06, 0.075, 1.04, 14, M.wallBright, [cx, 0.60, 0.86]);
    }
    buildGableRoof(root, 2.52, 2.15, 0.44, M, 1.12, true, false);

    // Segundo pavimento (sobrado superior) + Sacada com balaustrada
    box(root, 1.48, 0.76, 1.18, M.wallBright, [-0.32, 1.54, -0.45]);
    box(root, 1.52, 0.08, 1.22, M.gold, [-0.32, 1.94, -0.45]);
    buildGableRoof(root, 1.62, 1.32, 0.42, M, 1.98, true, true);

    // Sacada frontal superior e escada lateral de pedra
    box(root, 1.48, 0.08, 0.42, M.wallBright, [-0.32, 1.18, 0.32]);
    for (let bx = -0.98; bx <= 0.34; bx += 0.165) {
      cyl(root, 0.015, 0.018, 0.24, 6, M.gold, [bx, 1.34, 0.48]);
    }
    box(root, 1.44, 0.04, 0.04, M.trim, [-0.32, 1.46, 0.48]);

    for (let s = 0; s < 5; s++) {
      box(root, 0.36, 0.12, 0.16, M.wallBright, [0.76, 0.16 + s * 0.18, 0.62 - s * 0.12]);
    }

    buildHouseChimney(root, M, [-0.96, 0.08, -0.82], 2.25, true);
    buildBrazier(root, M, [-0.88, 0.08, 1.18], 0.82);
    buildAmphora(root, M, [0.95, 0.08, 1.05], 1.0);
    buildCypress(root, M, [-1.35, 0.08, -1.12], 1.05);
    buildCypress(root, M, [1.35, 0.08, -1.12], 1.05);
  }

  // ========================================================================
  // TIER 5 — VILA OLÍMPICA / MANSÃO PATRÍCIA (Ápice Mármore, Ouro e Fonte)
  // ========================================================================
  else {
    // Plataforma elevada de mármore e ouro
    box(root, 2.78, 0.14, 2.35, M.wallBright, [0, 0.15, -0.18]);
    box(root, 2.84, 0.06, 2.41, M.gold, [0, 0.24, -0.18]);

    // Corpo térreo monumental em mármore polido
    box(root, 2.48, 1.12, 1.72, M.wallBright, [0, 0.82, -0.32]);
    box(root, 2.54, 0.12, 1.78, M.trim, [0, 0.34, -0.32]);
    box(root, 0.64, 0.86, 0.08, M.gold, [0, 0.70, 0.56]);

    // Peristilo frontal com 6 colunas douradas
    for (const cx of [-1.05, -0.63, -0.21, 0.21, 0.63, 1.05]) {
      cyl(root, 0.065, 0.08, 1.12, 14, M.gold, [cx, 0.82, 0.88]);
    }
    box(root, 2.62, 0.14, 2.18, M.wallBright, [0, 1.44, -0.12]);
    box(root, 2.66, 0.07, 2.22, M.gold, [0, 1.54, -0.12]);

    // Segundo andar completo com varanda dourada e frontão com símbolo divino
    box(root, 1.88, 0.82, 1.28, M.wallBright, [0, 1.98, -0.38]);
    box(root, 1.94, 0.08, 1.34, M.trim, [0, 2.42, -0.38]);
    for (let bx = -1.15; bx <= 1.15; bx += 0.19) {
      cyl(root, 0.016, 0.02, 0.26, 6, M.gold, [bx, 1.70, 0.88]);
    }
    box(root, 2.42, 0.04, 0.04, M.gold, [0, 1.84, 0.88]);
    buildGableRoof(root, 2.04, 1.44, 0.52, M, 2.46, true, true);

    // Chaminé nobre, espelho d'água ornamental, estatueta e braseiros
    buildHouseChimney(root, M, [-0.82, 0.26, -0.85], 2.45, true);

    // Pequeno espelho d'água ornamental no pátio da frente
    cyl(root, 0.44, 0.48, 0.14, 16, M.wallBright, [0, 0.15, 1.22]);
    const patioWater = new T.Mesh(new T.CylinderGeometry(0.38, 0.38, 0.15, 16), M.water);
    patioWater.position.set(0, 0.16, 1.22);
    root.add(patioWater);

    buildMiniStatue(root, M, [-1.08, 0.08, 1.18]);
    buildBrazier(root, M, [1.08, 0.08, 1.18], 0.88);
    buildCypress(root, M, [-1.38, 0.08, -1.15], 1.10);
    buildCypress(root, M, [1.38, 0.08, -1.15], 1.10);
    buildCypress(root, M, [-1.38, 0.08, 0.15], 1.00);
    buildCypress(root, M, [1.38, 0.08, 0.15], 1.00);
  }

  buildGodSignatureDecor(root, M, tier);
  return root;
}

// --------------------------------------------------------------------------
// 4.5 MERCADO (MARKET / ÁGORA — Ref. image_6e0ba5.png)
// --------------------------------------------------------------------------
function buildMarketStall(parent, M, pos = [0, 0, 0], rotY = 0, produceColor = 0xdc2626) {
  const st = group(parent, pos[0], pos[1], pos[2]);
  st.rotation.y = rotY;

  // Bancada de madeira com faixa da divindade
  box(st, 0.82, 0.36, 0.52, M.wood, [0, 0.18, 0]);
  box(st, 0.85, 0.08, 0.55, M.trim, [0, 0.32, 0]);

  // Mercadorias coloridas (frutas, grãos, especiarias)
  const goodsMat = new T.MeshStandardMaterial({ color: produceColor, roughness: 0.65 });
  box(st, 0.34, 0.10, 0.38, goodsMat, [-0.18, 0.39, 0], [0.15, 0, 0]);
  const goodsMat2 = new T.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.65 });
  box(st, 0.34, 0.10, 0.38, goodsMat2, [0.18, 0.39, 0], [0.15, 0, 0]);

  // Postes e Toldo Listrado Inclinado (Azul/Branco para Zeus, Turquesa/Branco Poseidon, Carmesim/Ouro Hades!)
  for (const sx of [-0.38, 0.38]) {
    cyl(st, 0.025, 0.03, 0.85, 8, M.wood, [sx, 0.425, -0.22]);
    cyl(st, 0.025, 0.03, 0.66, 8, M.wood, [sx, 0.33, 0.22]);
  }
  buildShedRoof(st, 0.88, 0.68, 0.24, M, [0, 0.66, 0], 0, true);
  return st;
}

function buildMercado(parent, M, tier) {
  const root = group(parent);
  const scaleMod = 1 + (tier - 2) * 0.04;
  root.scale.setScalar(scaleMod);

  box(root, 3.65, 0.12, 3.45, M.wallBase, [0, 0.06, 0]);

  // Armazém Comercial de 2 Pavimentos no Fundo (Ref. image_6e0ba5.png!)
  const wH = 1.48 + (tier - 2) * 0.10;
  box(root, 2.35, wH, 1.15, M.wallBase, [-0.25, 0.12 + wH * 0.5, -0.78]);
  box(root, 2.40, 0.12, 1.20, M.trim, [-0.25, 0.20, -0.78]);
  buildGableRoof(root, 2.52, 1.32, 0.46, M, 0.12 + wH, true, tier >= 3);

  // Ala Lateral Esquerda com Pórtico de Colunas (Ref. image_6e0ba5.png!)
  const colMat = tier === 5 ? M.gold : M.wallBright;
  box(root, 0.95, 0.92, 1.05, M.wallBase, [-1.32, 0.58, -0.05]);
  cyl(root, 0.06, 0.07, 0.92, 10, colMat, [-1.68, 0.58, 0.38]);
  cyl(root, 0.06, 0.07, 0.92, 10, colMat, [-0.96, 0.58, 0.38]);
  buildGableRoof(root, 1.06, 1.18, 0.34, M, 1.04, true, false);

  // Varanda Superior e Escadaria Externa de Pedra na Direita (Ref. image_6e0ba5.png!)
  box(root, 2.35, 0.10, 0.42, M.wallBright, [-0.25, 0.92, -0.02]);
  box(root, 2.35, 0.06, 0.44, M.trim, [-0.25, 0.98, -0.02]);
  for (let bx = -1.25; bx <= 0.85; bx += 0.21) {
    cyl(root, 0.018, 0.02, 0.26, 6, M.iron, [bx, 1.12, 0.16]);
  }
  box(root, 2.25, 0.04, 0.04, M.wood, [-0.20, 1.25, 0.16]);

  // Escadaria lateral descendo para o pátio
  for (let s = 0; s < 6; s++) {
    box(root, 0.48, 0.14, 0.18, M.wallBright, [1.18, 0.18 + s * 0.13, 0.65 - s * 0.13]);
  }

  // Caixotes, Ânforas Pintadas e Barris no Pátio Central (Ref. image_6e0ba5.png!)
  box(root, 0.38, 0.34, 0.38, M.wood, [-0.15, 0.29, 0.22]);
  box(root, 0.32, 0.28, 0.32, M.wood, [-0.52, 0.26, 0.45]);
  buildAmphora(root, M, [0.22, 0.12, 0.38], 1.1);
  buildAmphora(root, M, [0.46, 0.12, 0.24], 0.9);
  buildBarrel(root, M, [0.75, 0.12, 1.05], 1.0);

  // Tendas Listradas de Mercado na Frente (2 em T2, 3 em T3–T4, 4 em T5 — Ref. image_6e0ba5.png!)
  buildMarketStall(root, M, [-0.72, 0.12, 1.18], 0.38, 0x16a34a);
  buildMarketStall(root, M, [0.28, 0.12, 1.18], -0.35, 0xdc2626);
  if (tier >= 3) {
    buildMarketStall(root, M, [1.22, 0.12, 0.72], -0.45, 0xeab308);
  }
  if (tier >= 5) {
    buildMarketStall(root, M, [-1.45, 0.12, 0.75], 0.55, 0x9333ea);
    buildBrazier(root, M, [1.55, 0.12, 1.35], 0.9);
  }

  buildGodSignatureDecor(root, M, tier);
  return root;
}

// --------------------------------------------------------------------------
// 4.6 FERREIRO / ARMORY (Ref. image_6e0ecb.png)
// --------------------------------------------------------------------------
function buildBlastFurnace(parent, M, pos = [0, 0, 0], scale = 1.0) {
  const f = group(parent, pos[0], pos[1], pos[2]);
  f.scale.setScalar(scale);

  // Base escalonada de pedra refratária e chaminé cônica do alto-forno (Ref. image_6e0ecb.png!)
  cyl(f, 0.46, 0.52, 0.26, 16, M.wallBase, [0, 0.13, 0]);
  cyl(f, 0.34, 0.44, 0.28, 16, M.wallBright, [0, 0.40, 0]);
  cyl(f, 0.22, 0.32, 0.42, 16, M.wallBase, [0, 0.74, 0]);
  cyl(f, 0.25, 0.25, 0.08, 16, M.wallBright, [0, 0.96, 0]);

  // Boca de fogo incandescente e brasa no topo
  const fireCore = new T.Mesh(new T.CylinderGeometry(0.16, 0.16, 0.06, 14), M.divineGlow);
  fireCore.position.y = 0.98;
  f.add(fireCore);

  const flame = new T.Mesh(new T.ConeGeometry(0.18, 0.42, 10), M.flame);
  flame.position.y = 1.18;
  f.add(flame);
  M.flames.push(flame);

  return f;
}

function buildFerreiro(parent, M, tier) {
  const root = group(parent);
  const scaleMod = 1 + (tier - 2) * 0.04;
  root.scale.setScalar(scaleMod);

  box(root, 3.65, 0.12, 3.35, M.wallBase, [0, 0.06, 0]);

  // Oficina Principal em Pedra/Mármore com Telhado Duplo Escalonado (Ref. image_6e0ecb.png!)
  const shopH = 1.15 + (tier - 2) * 0.10;
  box(root, 2.45, shopH, 1.15, M.wallBase, [-0.35, 0.12 + shopH * 0.5, -0.68]);
  box(root, 2.50, 0.12, 1.20, M.trim, [-0.35, 0.20, -0.68]);
  buildGableRoof(root, 2.62, 1.32, 0.46, M, 0.12 + shopH, true, tier >= 3);

  // Galpão Aberto Perpendicular de Madeira/Pedra para Forja (Ref. image_6e0ecb.png!)
  const shedH = 0.88;
  const postMat = tier === 5 ? M.gold : M.wood;
  buildGableRoof(root, 1.05, 1.55, 0.32, M, 0.12 + shedH, false, false);
  for (const sx of [0.65, 1.45]) {
    for (const sz of [-0.15, 0.55, 1.15]) {
      cyl(root, 0.05, 0.06, shedH, 8, postMat, [sx, 0.12 + shedH * 0.5, sz]);
    }
  }
  // Reposicionar teto do galpão aberto sobre os pilares direitos
  const shedRoof = buildGableRoof(root, 0.98, 1.52, 0.30, M, 0.12 + shedH, true, false);
  shedRoof.position.set(1.05, 0.12 + shedH, 0.50);

  // Alto-Forno Cilíndrico de Fundição na Frente + Cocho Retangular de Água de Têmpera (Ref. image_6e0ecb.png!)
  buildBlastFurnace(root, M, [0.05, 0.12, 1.12], tier >= 4 ? 1.18 : 1.0);
  if (tier >= 4) {
    buildBlastFurnace(root, M, [-0.85, 0.12, 1.18], 0.88);
  }

  // Cocho de água de têmpera ao lado do forno
  box(root, 0.56, 0.24, 0.34, M.wood, [0.72, 0.24, 0.92], [0, 0.45, 0]);
  const troughWater = new T.Mesh(new T.BoxGeometry(0.48, 0.25, 0.26), M.water);
  troughWater.position.set(0.72, 0.25, 0.92);
  troughWater.rotation.y = 0.45;
  root.add(troughWater);

  // Bigorna de Aço/Ouro e Barris
  box(root, 0.22, 0.22, 0.22, M.wood, [0.42, 0.23, 0.42]);
  box(root, 0.34, 0.14, 0.16, tier === 5 ? M.gold : M.iron, [0.42, 0.40, 0.42]);
  buildBarrel(root, M, [-0.45, 0.12, 0.15], 1.0);
  buildBarrel(root, M, [-0.72, 0.12, 0.25], 0.85);

  // Escudos Hoplitas Gregos apoiados na parede do galpão (Ref. image_6e0ecb.png!)
  for (let i = 0; i < (tier >= 4 ? 3 : 2); i++) {
    const shield = new T.Mesh(new T.CylinderGeometry(0.22, 0.22, 0.04, 18), tier === 5 ? M.gold : M.trim);
    shield.rotation.set(Math.PI * 0.42, 0, -0.35);
    shield.position.set(1.52, 0.32, 0.65 + i * 0.35);
    shield.castShadow = true;
    root.add(shield);
  }

  buildGodSignatureDecor(root, M, tier);
  return root;
}

/* ==========================================================================
   5. SISTEMA COMPLETO DAS 6 CONSTRUÇÕES E TROCA INSTANTÂNEA DE DEUS / TIER
   ========================================================================== */
function createGreekBuildingsSystem() {
  const initialTheme = GOD_THEMES.zeus;

  const M = {
    wallBase: new T.MeshStandardMaterial({
      map: createWallTexture(initialTheme, false),
      roughness: 0.66,
      metalness: 0.08
    }),
    wallBright: new T.MeshStandardMaterial({
      map: createWallTexture(initialTheme, true),
      roughness: 0.52,
      metalness: 0.12
    }),
    trim: new T.MeshStandardMaterial({
      color: initialTheme.trimHex,
      roughness: 0.38,
      metalness: 0.32
    }),
    gold: new T.MeshStandardMaterial({
      color: initialTheme.goldHex,
      emissive: 0x3b2200,
      emissiveIntensity: 0.25,
      metalness: 0.90,
      roughness: 0.20
    }),
    roof: new T.MeshStandardMaterial({
      map: createRoofTexture(initialTheme),
      roughness: 0.56,
      metalness: 0.16,
      side: T.DoubleSide
    }),
    awning: new T.MeshStandardMaterial({
      map: createAwningTexture(initialTheme),
      roughness: 0.65,
      side: T.DoubleSide
    }),
    target: new T.MeshStandardMaterial({
      map: createTargetTexture(),
      roughness: 0.60
    }),
    wood: new T.MeshStandardMaterial({ color: 0x5c2e16, roughness: 0.72 }),
    terracotta: new T.MeshStandardMaterial({ color: 0xb45309, roughness: 0.62 }),
    iron: new T.MeshStandardMaterial({ color: 0x334155, metalness: 0.75, roughness: 0.35 }),
    obsidian: new T.MeshStandardMaterial({ color: 0x18181b, roughness: 0.42, metalness: 0.35 }),
    hay: new T.MeshStandardMaterial({ color: 0xd97706, roughness: 0.88 }),
    horseWhite: new T.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.65 }),
    horseBrown: new T.MeshStandardMaterial({ color: 0x6b361a, roughness: 0.68 }),
    darkInterior: new T.MeshStandardMaterial({ color: 0x141210, roughness: 0.92 }),
    foliage: new T.MeshStandardMaterial({ color: 0x1e4d20, roughness: 0.82 }),
    water: new T.MeshStandardMaterial({
      color: initialTheme.waterHex,
      emissive: 0x0369a1,
      emissiveIntensity: 0.45,
      roughness: 0.15,
      metalness: 0.2
    }),
    flame: new T.MeshBasicMaterial({
      color: initialTheme.flameHex,
      transparent: true,
      opacity: 0.92,
      blending: T.AdditiveBlending
    }),
    divineGlow: new T.MeshStandardMaterial({
      color: 0xffffff,
      emissive: initialTheme.glowHex,
      emissiveIntensity: 3.0,
      roughness: 0.1
    }),
    emblems: [],
    flames: [],
    smokeAnchors: [],
    zeusOnly: [],
    poseidonOnly: [],
    hadesOnly: []
  };

  const root = new T.Group();
  const builders = {
    quartel: buildQuartel,
    estabulos: buildEstabulos,
    arquearia: buildArquearia,
    casa: buildCasaPopulacao,
    mercado: buildMercado,
    ferreiro: buildFerreiro
  };

  const bldKeys = Object.keys(builders);
  const instances = {};

  // Posições na Pólis Completa caso o usuário clique em "Ver Pólis Completa"
  const villageOffsets = {
    quartel: [-4.4, 0, -3.2],
    estabulos: [0.0, 0, -3.6],
    arquearia: [4.4, 0, -3.2],
    casa: [-4.4, 0, 2.8],
    mercado: [0.0, 0, 3.0],
    ferreiro: [4.4, 0, 2.8]
  };

  bldKeys.forEach(key => {
    instances[key] = {};
    const minTier = (key === 'casa') ? 1 : 2;
    for (let t = minTier; t <= 5; t++) {
      const holder = new T.Group();
      builders[key](holder, M, t);
      root.add(holder);
      instances[key][t] = holder;
    }
  });

  // Aura de energia divina no solo
  const auraRing = new T.Mesh(
    new T.RingGeometry(2.55, 2.85, 64),
    new T.MeshBasicMaterial({
      color: initialTheme.glowHex,
      transparent: true,
      opacity: 0.25,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  auraRing.rotation.x = -Math.PI / 2;
  auraRing.position.y = 0.02;
  root.add(auraRing);

  function updateVisibility(activeBld, activeTier, villageMode) {
    auraRing.visible = !villageMode;
    bldKeys.forEach(key => {
      const off = villageOffsets[key];
      const minTier = (key === 'casa') ? 1 : 2;
      const effectiveTier = (villageMode && activeTier === 1 && key !== 'casa') ? 2 : activeTier;
      for (let t = minTier; t <= 5; t++) {
        const obj = instances[key][t];
        if (villageMode) {
          obj.visible = (t === effectiveTier);
          obj.position.set(off[0], off[1], off[2]);
        } else {
          obj.visible = (key === activeBld && t === activeTier);
          obj.position.set(0, 0, 0);
        }
      }
    });
  }

  function applyGod(godKey) {
    const theme = GOD_THEMES[godKey] || GOD_THEMES.zeus;
    M.trim.color.setHex(theme.trimHex);
    M.gold.color.setHex(theme.goldHex);
    M.water.color.setHex(theme.waterHex);
    M.flame.color.setHex(theme.flameHex);
    M.divineGlow.emissive.setHex(theme.glowHex);
    auraRing.material.color.setHex(theme.glowHex);

    if (M.wallBase.map) M.wallBase.map.dispose();
    M.wallBase.map = createWallTexture(theme, false);
    M.wallBase.needsUpdate = true;

    if (M.wallBright.map) M.wallBright.map.dispose();
    M.wallBright.map = createWallTexture(theme, true);
    M.wallBright.needsUpdate = true;

    if (M.roof.map) M.roof.map.dispose();
    M.roof.map = createRoofTexture(theme);
    M.roof.needsUpdate = true;

    if (M.awning.map) M.awning.map.dispose();
    M.awning.map = createAwningTexture(theme);
    M.awning.needsUpdate = true;

    M.emblems.forEach(e => {
      e.zeus.visible = (godKey === 'zeus');
      e.poseidon.visible = (godKey === 'poseidon');
      e.hades.visible = (godKey === 'hades');
    });

    M.zeusOnly.forEach(g => { g.visible = (godKey === 'zeus'); });
    M.poseidonOnly.forEach(g => { g.visible = (godKey === 'poseidon'); });
    M.hadesOnly.forEach(g => { g.visible = (godKey === 'hades'); });
  }

  return { root, M, auraRing, updateVisibility, applyGod };
}

/* ==========================================================================
   6. CENA 3D, ILUMINAÇÃO, EFEITOS ATMOSFÉRICOS POR DEUS (RAIOS, MARES, TREVAS)
   ========================================================================== */
const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(GOD_THEMES.zeus.bgHex);
scene.fog = new T.FogExp2(GOD_THEMES.zeus.bgHex, 0.016);

const camera = new T.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 180);

const hemi = new T.HemisphereLight(GOD_THEMES.zeus.hemiSky, GOD_THEMES.zeus.hemiGround, 1.15);
scene.add(hemi);

const sun = new T.DirectionalLight(GOD_THEMES.zeus.sunHex, 2.45);
sun.position.set(6.5, 11.0, 7.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9.5, right: 9.5, top: 9.5, bottom: -9.5, near: 1, far: 35 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const rimLight = new T.DirectionalLight(GOD_THEMES.zeus.rimHex, 1.45);
rimLight.position.set(-6.0, 5.2, -6.5);
scene.add(rimLight);

const godPointLight = new T.PointLight(GOD_THEMES.zeus.glowHex, 1.8, 15);
godPointLight.position.set(0, 3.5, 0);
scene.add(godPointLight);

// Terreno Circular
const groundMat = new T.MeshStandardMaterial({
  map: createGroundTexture(GOD_THEMES.zeus),
  roughness: 0.80,
  metalness: 0.05
});
const terrain = new T.Mesh(new T.CylinderGeometry(9.6, 9.9, 0.38, 72), groundMat);
terrain.position.y = -0.19;
terrain.receiveShadow = true;
scene.add(terrain);

// Instanciar as 6 Construções Gregas
const system = createGreekBuildingsSystem();
scene.add(system.root);

// Arcos Elétricos de Zeus (Raios celestiais ao redor da construção)
const lightningGroup = new T.Group();
scene.add(lightningGroup);
const boltMat = new T.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.0 });
const lightningBolts = [];
for (let b = 0; b < 5; b++) {
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push(new T.Vector3(0, i * 0.5, 0));
  const geo = new T.BufferGeometry().setFromPoints(pts);
  const line = new T.Line(geo, boltMat);
  lightningGroup.add(line);
  lightningBolts.push(line);
}

// Partículas Ambientais Dinâmicas (Fagulhas Douradas de Zeus / Névoa Marinha de Poseidon / Brasas do Estige de Hades)
const PARTICLE_N = 130;
const pPos = new Float32Array(PARTICLE_N * 3);
const pVel = new Float32Array(PARTICLE_N);
for (let i = 0; i < PARTICLE_N; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 0.6 + Math.random() * 2.9;
  pPos[i * 3] = Math.cos(a) * r;
  pPos[i * 3 + 1] = Math.random() * 4.5;
  pPos[i * 3 + 2] = Math.sin(a) * r;
  pVel[i] = 0.4 + Math.random() * 0.75;
}
const pGeo = new T.BufferGeometry();
pGeo.setAttribute('position', new T.BufferAttribute(pPos, 3));
const pMat = new T.PointsMaterial({
  color: GOD_THEMES.zeus.particleHex,
  size: 0.10,
  transparent: true,
  opacity: 0.82,
  blending: T.AdditiveBlending,
  depthWrite: false
});
scene.add(new T.Points(pGeo, pMat));

// Partículas de Fumaça das Chaminés das Casas da População
const SMOKE_N = 36;
const smokeSprites = [];
const smokeGeo = new T.SphereGeometry(0.11, 8, 8);
const smokeMat = new T.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.35 });
for (let i = 0; i < SMOKE_N; i++) {
  const s = new T.Mesh(smokeGeo, smokeMat);
  s.visible = false;
  scene.add(s);
  smokeSprites.push({ mesh: s, life: Math.random(), anchorIdx: i % 10 });
}

// Ondas de Evolução (Upgrade Burst)
const upgradeWaves = [];
function triggerUpgradeBurst(colorHex) {
  const ring = new T.Mesh(
    new T.RingGeometry(1.4, 2.0, 56),
    new T.MeshBasicMaterial({
      color: colorHex,
      transparent: true,
      opacity: 0.92,
      blending: T.AdditiveBlending,
      side: T.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.04;
  scene.add(ring);
  upgradeWaves.push({ mesh: ring, life: 0.85, max: 0.85 });
}

/* ==========================================================================
   7. CONTROLES DE UI, SELEÇÃO E CÂMERA 360°
   ========================================================================== */
let currentBld = 'quartel';
let currentGod = 'zeus';
let currentTier = 2;
let actionMode = 'normal';
let focusDetails = false;
let villageMode = false;

let camAngle = 0.68;
let camPitch = 0.48;
let camDist = 9.2;
let targetCamDist = 9.2;
let currentLookAt = new T.Vector3(0, 1.05, 0);

let dragging = false;
let lastX = 0, lastY = 0;
let pinchStartDist = 0;

const cardTitle = document.getElementById('card-title');
const cardSub = document.getElementById('card-sub');
const btnTier1 = document.getElementById('btn-tier-1');

function syncTierButtonsForBuilding() {
  const isHouse = (currentBld === 'casa');
  btnTier1.style.display = isHouse ? 'inline-block' : 'none';
  if (!isHouse && currentTier === 1) {
    currentTier = 2;
  }
  document.querySelectorAll('button[data-tier]').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.tier) === currentTier);
  });
}

function refreshUIAndScene() {
  syncTierButtonsForBuilding();
  const gTheme = GOD_THEMES[currentGod];
  const bInfo = BUILDING_INFO[currentBld];
  const tierNames = {
    1: 'Tier 1 (Era Arcaica)',
    2: 'Tier 2 (Era Clássica)',
    3: 'Tier 3 (Era Heroica)',
    4: 'Tier 4 (Era Mítica)',
    5: 'Tier 5 (Ápice Olímpico)'
  };

  if (villageMode) {
    cardTitle.textContent = `Pólis Grega ${gTheme.adjective} • Todas as 6 Construções (${tierNames[currentTier]})`;
    cardSub.textContent = `Visualização panorâmica da cidade com ${gTheme.godDesc}`;
  } else {
    cardTitle.textContent = `${bInfo.name} ${gTheme.adjective} • ${tierNames[currentTier]}`;
    cardSub.textContent = `${bInfo.tiers[currentTier]} — Estilo ${gTheme.name}: ${gTheme.godDesc}`;
  }

  system.updateVisibility(currentBld, currentTier, villageMode);
}

// Botões das 6 Construções
document.querySelectorAll('button[data-bld]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentBld = btn.dataset.bld;
    if (villageMode) {
      villageMode = false;
      document.getElementById('btn-village').classList.remove('active');
      targetCamDist = focusDetails ? 5.4 : 9.2;
    }
    document.querySelectorAll('button[data-bld]').forEach(b => b.classList.toggle('on', b === btn));
    refreshUIAndScene();
    triggerUpgradeBurst(GOD_THEMES[currentGod].glowHex);
  });
});

// Botões dos 3 Deuses (Zeus, Poseidon, Hades)
document.querySelectorAll('button[data-god]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentGod = btn.dataset.god;
    const theme = GOD_THEMES[currentGod];
    document.querySelectorAll('button[data-god]').forEach(b => b.classList.toggle('on', b === btn));

    scene.background.setHex(theme.bgHex);
    scene.fog.color.setHex(theme.bgHex);
    scene.fog.density = (currentGod === 'hades') ? 0.024 : 0.015;
    hemi.color.setHex(theme.hemiSky);
    hemi.groundColor.setHex(theme.hemiGround);
    sun.color.setHex(theme.sunHex);
    sun.intensity = theme.sunIntensity;
    rimLight.color.setHex(theme.rimHex);
    godPointLight.color.setHex(theme.glowHex);
    pMat.color.setHex(theme.particleHex);

    if (groundMat.map) groundMat.map.dispose();
    groundMat.map = createGroundTexture(theme);
    groundMat.needsUpdate = true;

    system.applyGod(currentGod);
    refreshUIAndScene();
    triggerUpgradeBurst(theme.glowHex);
  });
});

// Botões de Tier T2–T5
document.querySelectorAll('button[data-tier]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTier = Number(btn.dataset.tier);
    document.querySelectorAll('button[data-tier]').forEach(b => b.classList.toggle('on', b === btn));
    refreshUIAndScene();
    triggerUpgradeBurst(GOD_THEMES[currentGod].glowHex);
  });
});

// Botões de Ação (Produção Normal vs Bênção Divina)
document.querySelectorAll('button[data-act]').forEach(btn => {
  btn.addEventListener('click', () => {
    actionMode = btn.dataset.act;
    document.querySelectorAll('button[data-act]').forEach(b => b.classList.toggle('on', b === btn));
    if (actionMode === 'bencao') {
      triggerUpgradeBurst(GOD_THEMES[currentGod].glowHex);
    }
  });
});

// Botão Aproximar Detalhes
const btnFocus = document.getElementById('btn-focus');
btnFocus.addEventListener('click', () => {
  focusDetails = !focusDetails;
  if (focusDetails && villageMode) {
    villageMode = false;
    document.getElementById('btn-village').classList.remove('active');
    refreshUIAndScene();
  }
  btnFocus.classList.toggle('active', focusDetails);
  btnFocus.textContent = focusDetails ? 'Visão Padrão' : 'Aproximar Detalhes';
  targetCamDist = focusDetails ? 5.2 : 9.2;
});

// Botão Ver Pólis Completa (Todas as 6 construções juntas)
const btnVillage = document.getElementById('btn-village');
btnVillage.addEventListener('click', () => {
  villageMode = !villageMode;
  if (villageMode && focusDetails) {
    focusDetails = false;
    btnFocus.classList.remove('active');
    btnFocus.textContent = 'Aproximar Detalhes';
  }
  btnVillage.classList.toggle('active', villageMode);
  targetCamDist = villageMode ? 15.5 : 9.2;
  refreshUIAndScene();
});

// Orbit Controls 360° (Mouse + Touch)
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAngle -= (e.clientX - lastX) * 0.009;
  camPitch = T.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.006, 0.10, 1.18);
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetCamDist = T.MathUtils.clamp(targetCamDist + e.deltaY * 0.007, 4.0, 22.0);
}, { passive: false });

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    targetCamDist = T.MathUtils.clamp(targetCamDist + (pinchStartDist - dist) * 0.02, 4.0, 22.0);
    pinchStartDist = dist;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Inicializar visualização padrão (Quartel de Zeus T2)
system.applyGod('zeus');
refreshUIAndScene();

/* ==========================================================================
   8. LOOP DE ANIMAÇÃO (RAIOS DE ZEUS, ONDAS DE POSEIDON, ESTIGE DE HADES)
   ========================================================================== */
const clock = new T.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const isBlessing = (actionMode === 'bencao');

  // 1. Oscilação das chamas (Ferreiro, Braseiros e Piras de Hades)
  system.M.flames.forEach((fl, idx) => {
    const boost = isBlessing ? 1.35 : 1.0;
    fl.scale.set(
      boost * (1 + Math.sin(elapsed * 13 + idx) * 0.14),
      boost * (1 + Math.cos(elapsed * 16 + idx) * 0.24),
      boost * (1 + Math.sin(elapsed * 12 + idx) * 0.14)
    );
  });

  // 2. Raios Elétricos Dinâmicos quando Zeus está ativo
  if (currentGod === 'zeus') {
    const flash = isBlessing
      ? (Math.sin(elapsed * 28) > 0.1 ? 0.92 : 0.25)
      : (Math.sin(elapsed * 14) > 0.72 ? 0.78 : 0.0);
    boltMat.opacity = flash;
    if (flash > 0.05) {
      lightningBolts.forEach((line, bIdx) => {
        const attr = line.geometry.attributes.position;
        const ang = bIdx * 1.25 + elapsed * 1.8;
        const rad = villageMode ? 4.5 : 1.75;
        const bx = Math.cos(ang) * rad;
        const bz = Math.sin(ang) * rad;
        for (let i = 0; i <= 8; i++) {
          const jitter = (i === 0 || i === 8) ? 0 : 0.24;
          attr.setXYZ(
            i,
            bx + (Math.random() - 0.5) * jitter,
            i * 0.52,
            bz + (Math.random() - 0.5) * jitter
          );
        }
        attr.needsUpdate = true;
      });
    }
  } else {
    boltMat.opacity = 0.0;
  }

  // 3. Pulso da água e brilho de Poseidon vs Trevas/Chama de Hades
  if (currentGod === 'poseidon') {
    system.M.water.emissiveIntensity = (isBlessing ? 1.1 : 0.45) + Math.sin(elapsed * 4) * 0.18;
  }
  godPointLight.intensity = isBlessing
    ? (4.8 + Math.sin(elapsed * 10) * 1.2)
    : (1.4 + (currentTier - 2) * 0.35);

  // 4. Partículas Ambientais por Divindade
  const pAttr = pGeo.attributes.position;
  const speedMult = isBlessing ? 2.4 : 1.0;
  for (let i = 0; i < PARTICLE_N; i++) {
    let py = pAttr.getY(i) + pVel[i] * dt * speedMult;
    if (py > 4.6) py = 0.15;
    pAttr.setY(i, py);
  }
  pAttr.needsUpdate = true;

  // 5. Fumaça saindo das chaminés das Casas da População
  const visibleAnchors = system.M.smokeAnchors.filter(a => {
    let p = a.parent;
    while (p) {
      if (!p.visible) return false;
      p = p.parent;
    }
    return true;
  });

  smokeSprites.forEach((sp, idx) => {
    if (visibleAnchors.length === 0) {
      sp.mesh.visible = false;
      return;
    }
    sp.mesh.visible = true;
    sp.life += dt * 0.55;
    if (sp.life >= 1.0) {
      sp.life = 0;
      const anchor = visibleAnchors[idx % visibleAnchors.length];
      const worldPos = new T.Vector3();
      anchor.getWorldPosition(worldPos);
      sp.mesh.position.copy(worldPos);
    } else {
      sp.mesh.position.y += dt * 0.72;
      sp.mesh.position.x += Math.sin(elapsed * 2 + idx) * dt * 0.18;
      const sc = 0.6 + sp.life * 1.4;
      sp.mesh.scale.setScalar(sc);
    }
  });

  // 6. Ondas de evolução no solo
  system.auraRing.material.opacity = isBlessing ? 0.75 : (0.16 + (currentTier - 2) * 0.06);
  system.auraRing.rotation.z += dt * 0.4;

  for (let i = upgradeWaves.length - 1; i >= 0; i--) {
    const uw = upgradeWaves[i];
    uw.life -= dt;
    const k = Math.max(0, uw.life / uw.max);
    uw.mesh.scale.setScalar(1 + (1 - k) * 2.2);
    uw.mesh.material.opacity = 0.92 * k;
    if (uw.life <= 0) {
      scene.remove(uw.mesh);
      uw.mesh.geometry.dispose();
      uw.mesh.material.dispose();
      upgradeWaves.splice(i, 1);
    }
  }

  // 7. Câmera orbital suave 360°
  camDist = T.MathUtils.damp(camDist, targetCamDist, 6, dt);
  if (!dragging) camAngle += dt * 0.055;

  const desiredTarget = new T.Vector3(0, villageMode ? 0.9 : 1.05, 0);
  currentLookAt.lerp(desiredTarget, 0.14);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  camera.position.set(
    currentLookAt.x + Math.sin(camAngle) * horizDist,
    currentLookAt.y + vertDist,
    currentLookAt.z + Math.cos(camAngle) * horizDist
  );
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

if (document.readyState === 'complete') {
  animate();
} else {
  window.addEventListener('load', animate);
}
</script>
</body>
</html>
