<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kimodo Studio 3D - Age of Mythology Olympus</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121316;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .hud-panel {
      position: absolute;
      z-index: 10;
      background: rgba(18, 20, 26, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    #top-left-panel {
      top: 12px;
      left: 12px;
      width: 320px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 12px 14px;
    }
    #top-left-panel::-webkit-scrollbar {
      width: 4px;
    }
    #top-left-panel::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .slider-row label {
      font-size: 10px;
      color: #94a3b8;
      width: 65px;
      flex-shrink: 0;
      font-weight: 600;
      text-transform: uppercase;
    }
    .slider-row input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      -webkit-appearance: none;
      margin: 0;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
    }
    .slider-row .slider-val {
      font-size: 10px;
      font-family: monospace;
      color: #facc15;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      font-weight: 700;
    }
    .editor-tab-btn {
      flex: 1;
      padding: 6px 2px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      text-align: center;
      cursor: pointer;
    }
    .editor-tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
    }
    .tool-chip {
      flex: 1;
      padding: 5px 2px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      text-align: center;
      cursor: pointer;
    }
    .tool-chip.active {
      background: #059669;
      border-color: #34d399;
      color: #ffffff;
    }
    #top-left-panel h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #model-status {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .hud-row {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hud-row label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      font-weight: 600;
    }
    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    select:focus, button:hover {
      border-color: #38bdf8;
      background: #334155;
    }
    #bottom-control-bar {
      bottom: 14px;
      right: 14px;
      left: auto;
      transform: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 200px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 10px 12px;
      border-radius: 12px;
    }
    #bottom-control-bar::-webkit-scrollbar {
      width: 4px;
    }
    #bottom-control-bar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .btn-anim {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      width: 100%;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-anim.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      color: #ffffff;
      font-weight: 600;
    }
    .btn-sec {
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 11px;
      color: #38bdf8;
    }
    #loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      font-size: 16px;
      background: rgba(15, 23, 42, 0.9);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(56, 189, 248, 0.3);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="loading-spinner">
    <div class="spinner"></div>
    <span>Carregando Modelo 3D & Animações...</span>
  </div>

  <div id="top-left-panel" class="hud-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <h1>🏛️ Kimodo 3D Studio</h1>
      <button id="btn-toggle-studio" class="btn-sec" style="padding: 2px 6px; font-size: 10px;">Minimizar ✕</button>
    </div>
    <div id="model-status">Pronto para inspecionar</div>
    
    <div id="studio-body">
      <div class="hud-row" style="margin-bottom: 6px;">
        <label>Modelo 3D</label>
        <select id="model-select">
          <option value="aldeao.glb" selected>🌾 Aldeão Grego (Mocap & 8 Funções)</option>
          <option value="soldier.glb">🪖 Guerreiro Espartano (Mixamo)</option>
          <option value="hoplita_pro_animado.glb">🏛️ Hoplita Grego HQ</option>
          <option value="guerreiro_espartano_completo.glb">⚔️ Guerreiro (TripoSR)</option>
          <option value="talos_clean_hq_animado_completo.glb">🤖 Talos Autômato</option>
          <option value="centauro_rigged.glb">🐴 Centauro Sagrado</option>
          <option value="agape_walking.glb">🚶 Ágape em Marcha</option>
        </select>
      </div>

      <!-- Abas de Edição -->
      <div style="display: flex; gap: 4px; margin-bottom: 8px;">
        <button id="tab-btn-aldeao" class="editor-tab-btn active">🧍 Aldeão</button>
        <button id="tab-btn-ferramenta" class="editor-tab-btn">🪓 Ferramenta</button>
        <button id="tab-btn-camera" class="editor-tab-btn">🎥 Câmera</button>
      </div>

      <!-- Aba 1: Manipulação do Personagem / Aldeão -->
      <div id="tab-pane-aldeao">
        <div class="slider-row">
          <label>Tamanho</label>
          <button id="btn-aldeao-scale-minus" class="btn-sec" style="padding: 1px 5px; font-size: 9px;">-</button>
          <input type="range" id="sld-aldeao-scale" min="0.4" max="3.0" step="0.05" value="1.45" />
          <button id="btn-aldeao-scale-plus" class="btn-sec" style="padding: 1px 5px; font-size: 9px;">+</button>
          <span id="val-aldeao-scale" class="slider-val">1.45x</span>
        </div>

        <div class="slider-row">
          <label>Girar Y</label>
          <input type="range" id="sld-aldeao-rot-y" min="-180" max="180" step="5" value="0" />
          <span id="val-aldeao-rot-y" class="slider-val">0°</span>
        </div>

        <div class="slider-row">
          <label>Altura Y</label>
          <input type="range" id="sld-aldeao-pos-y" min="-1.0" max="2.0" step="0.05" value="0.0" />
          <span id="val-aldeao-pos-y" class="slider-val">0.00</span>
        </div>

        <div class="slider-row">
          <label>Lateral X</label>
          <input type="range" id="sld-aldeao-pos-x" min="-2.0" max="2.0" step="0.05" value="0.0" />
          <span id="val-aldeao-pos-x" class="slider-val">0.00</span>
        </div>

        <div class="slider-row">
          <label>Prof. Z</label>
          <input type="range" id="sld-aldeao-pos-z" min="-2.0" max="2.0" step="0.05" value="0.0" />
          <span id="val-aldeao-pos-z" class="slider-val">0.00</span>
        </div>

        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <button id="btn-reset-aldeao" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px;">🔄 Resetar Aldeão</button>
          <button id="btn-aldeao-turn-45" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px;">🔄 Girar 45°</button>
        </div>
      </div>

      <!-- Aba 2: Manipulação do Machado & Ferramentas -->
      <div id="tab-pane-ferramenta" style="display: none;">
        <!-- Seletor Rápido de Ferramentas -->
        <div style="display: flex; gap: 3px; margin-bottom: 6px;">
          <button id="chip-tool-axe" class="tool-chip active">🪓 Machado</button>
          <button id="chip-tool-pick" class="tool-chip">⛏️ Picareta</button>
          <button id="chip-tool-knife" class="tool-chip">🗡️ Faca</button>
          <button id="chip-tool-fish" class="tool-chip">🐟 Vara</button>
          <button id="chip-tool-none" class="tool-chip">🚫</button>
        </div>

        <div class="slider-row">
          <label>Tamanho</label>
          <button id="btn-tool-scale-minus" class="btn-sec" style="padding: 1px 5px; font-size: 9px;">-</button>
          <input type="range" id="sld-tool-scale" min="0.4" max="3.5" step="0.05" value="1.50" />
          <button id="btn-tool-scale-plus" class="btn-sec" style="padding: 1px 5px; font-size: 9px;">+</button>
          <span id="val-tool-scale" class="slider-val">1.50x</span>
        </div>

        <div class="slider-row">
          <label>Lâmina Y</label>
          <input type="range" id="sld-tool-rot-y" min="-180" max="180" step="5" value="0" />
          <span id="val-tool-rot-y" class="slider-val">0°</span>
        </div>

        <div class="slider-row">
          <label>Frente X</label>
          <input type="range" id="sld-tool-rot-x" min="-180" max="180" step="5" value="0" />
          <span id="val-tool-rot-x" class="slider-val">0°</span>
        </div>

        <div class="slider-row">
          <label>Lateral Z</label>
          <input type="range" id="sld-tool-rot-z" min="-180" max="180" step="5" value="0" />
          <span id="val-tool-rot-z" class="slider-val">0°</span>
        </div>

        <div class="slider-row">
          <label>Cabo (Y)</label>
          <input type="range" id="sld-tool-pos-y" min="-30" max="40" step="1" value="0" />
          <span id="val-tool-pos-y" class="slider-val">0</span>
        </div>

        <div class="slider-row">
          <label>Palma (X)</label>
          <input type="range" id="sld-tool-pos-x" min="-15" max="15" step="0.5" value="0" />
          <span id="val-tool-pos-x" class="slider-val">0.0</span>
        </div>

        <div class="slider-row">
          <label>Palma (Z)</label>
          <input type="range" id="sld-tool-pos-z" min="-15" max="15" step="0.5" value="0" />
          <span id="val-tool-pos-z" class="slider-val">0.0</span>
        </div>

        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <button id="btn-tool-quick-flip" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px;">🔄 Inverter 180°</button>
          <button id="btn-tool-quick-rot" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px;">🔁 Girar 90°</button>
          <button id="btn-tool-quick-reset" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px;">Reset</button>
        </div>
      </div>

      <!-- Aba 3: Câmera & Visual -->
      <div id="tab-pane-camera" style="display: none;">
        <div class="hud-row" style="flex-direction: row; gap: 4px; margin-top: 2px;">
          <button id="btn-cam-close" class="btn-sec" style="flex: 1; font-size: 10px; padding: 6px 2px;">🔍 Busto</button>
          <button id="btn-cam-full" class="btn-sec" style="flex: 1; font-size: 10px; padding: 6px 2px; border-color: #38bdf8;">🧍 Corpo</button>
          <button id="btn-cam-rts" class="btn-sec" style="flex: 1; font-size: 10px; padding: 6px 2px;">📐 RTS 45°</button>
        </div>

        <div class="hud-row" style="flex-direction: row; gap: 4px; margin-top: 4px;">
          <button id="btn-wireframe" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px 2px;">Malha</button>
          <button id="btn-bones" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px 2px;">Ossos</button>
          <button id="btn-reset-cam" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px 2px;">Reset Cam</button>
        </div>

        <div style="margin-top: 8px;">
          <button id="btn-copy-config" class="btn-sec" style="width: 100%; font-size: 11px; padding: 6px; background: #0284c7; color: #fff; font-weight: 700;">📋 Copiar Ajustes (JSON)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom-control-bar" class="hud-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <span style="font-size: 11px; font-weight: 700; color: #38bdf8;">🎬 Ações</span>
      <button id="btn-toggle-menu" class="btn-sec" style="padding: 2px 6px; font-size: 10px;">Minimizar ✕</button>
    </div>
    <div id="anim-buttons-group" style="display: flex; flex-direction: column; gap: 4px;"></div>
    <div style="display: flex; gap: 4px; margin-top: 4px;">
      <button id="btn-pause" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px 6px;">⏸️ Pausar</button>
      <button id="btn-speed" class="btn-sec" style="flex: 1; font-size: 10px; padding: 5px 6px;">1.0x</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, mixer, currentAction = null;
    let currentModel = null, skeletonHelper = null, aldeaoTools = null;
    let clock = new THREE.Clock();
    let animations = [];
    let isWireframe = false, isSkeleton = false, isPaused = false;
    let speedLevels = [0.25, 0.5, 1.0, 1.5, 2.0];
    let speedIdx = 2;
    let isMenuMinimized = false;

    const container = document.getElementById('canvas-container');
    const spinner = document.getElementById('loading-spinner');
    const statusText = document.getElementById('model-status');
    const animButtonsGroup = document.getElementById('anim-buttons-group');
    const btnPause = document.getElementById('btn-pause');
    const btnSpeed = document.getElementById('btn-speed');
    const btnWire = document.getElementById('btn-wireframe');
    const btnBones = document.getElementById('btn-bones');
    const btnResetCam = document.getElementById('btn-reset-cam');
    const btnCamClose = document.getElementById('btn-cam-close');
    const btnCamFull = document.getElementById('btn-cam-full');
    const btnCamRts = document.getElementById('btn-cam-rts');
    const btnToggleMenu = document.getElementById('btn-toggle-menu');
    const modelSelect = document.getElementById('model-select');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121316);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.15, 1.75);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.95, 0);

      // Iluminação Realista PBR
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334455, 0.9);
      scene.add(hemiLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(4, 7, 5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
      fillLight.position.set(-4, 3, -3);
      scene.add(fillLight);

      const groundLight = new THREE.DirectionalLight(0xf59e0b, 0.4);
      groundLight.position.set(0, -3, 0);
      scene.add(groundLight);

      // Grid do chão
      const grid = new THREE.GridHelper(10, 20, 0x38bdf8, 0x334155);
      grid.position.y = 0;
      scene.add(grid);

      // Chão refletor de sombra
      const floorGeo = new THREE.PlaneGeometry(20, 20);
      const floorMat = new THREE.ShadowMaterial({ opacity: 0.3 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      window.addEventListener('resize', onWindowResize);
      loadModel(modelSelect.value);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function loadModel(filename) {
      spinner.style.display = 'flex';
      statusText.textContent = `Carregando ${filename}...`;

      if (currentModel) {
        scene.remove(currentModel);
        if (skeletonHelper) scene.remove(skeletonHelper);
        currentModel = null;
        skeletonHelper = null;
      }
      if (mixer) mixer.stopAllAction();

      const loader = new THREE.GLTFLoader();
      loader.load(
        filename,
        (gltf) => {
          spinner.style.display = 'none';
          currentModel = gltf.scene;

          currentModel.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.geometry && !child.geometry.attributes.normal) {
                child.geometry.computeVertexNormals();
              }
              if (child.material) {
                if (child.isSkinnedMesh) {
                  child.material.skinning = true;
                }
                const maxAniso = renderer.capabilities.getMaxAnisotropy();
                ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap'].forEach(mapName => {
                  if (child.material[mapName]) {
                    child.material[mapName].anisotropy = maxAniso;
                    child.material[mapName].minFilter = THREE.LinearMipmapLinearFilter;
                    child.material[mapName].magFilter = THREE.LinearFilter;
                    child.material[mapName].needsUpdate = true;
                  }
                });
                child.material.side = THREE.DoubleSide;
                child.material.wireframe = isWireframe;
                child.material.needsUpdate = true;
              } else {
                const hasColors = !!(child.geometry && child.geometry.attributes.color);
                child.material = new THREE.MeshStandardMaterial({
                  skinning: !!child.isSkinnedMesh,
                  vertexColors: hasColors,
                  color: hasColors ? 0xffffff : 0xd4af37,
                  roughness: 0.6,
                  metalness: 0.2,
                  wireframe: isWireframe,
                  side: THREE.DoubleSide
                });
              }
            }
          });

          scene.add(currentModel);
          fitCameraToModel(currentModel);

          // Criar esqueleto visual
          skeletonHelper = new THREE.SkeletonHelper(currentModel);
          skeletonHelper.visible = isSkeleton;
          scene.add(skeletonHelper);

          mixer = new THREE.AnimationMixer(currentModel);

          aldeaoTools = null;

          // Gerador de ferramentas 3D realistas para o Aldeão (escala 1:1, empunhadura anatômica na palma)
          function createAldeaoTools() {
            const tools = {};

            const bronzeMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.3 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.85, roughness: 0.35 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.75 });

              const rotsLForeArm = [[0.4, 0, 0], [0.45, 0, 0], [0.35, 0, 0], [0.75, 0, 0], [0.55, 0, 0], [0.4, 0, 0]];
              const rotsSpine = [[0.06, 0, 0], [0.09, 0.02, 0], [0.05, -0.02, 0], [-0.2, 0, 0], [-0.08, 0, 0], [0.06, 0, 0]];
              const rotsHead = [[-0.08, 0, 0], [-0.05, 0.02, 0], [-0.1, -0.02, 0], [-0.25, 0, 0], [-0.12, 0, 0], [-0.08, 0, 0]];

              for (let i = 0; i < times.length; i++) {
                qRArm.push(...makeQuat(bRArm, rotsRArm[i][0], rotsRArm[i][1], rotsRArm[i][2]));
                qRForeArm.push(...makeQuat(bRForeArm, rotsRForeArm[i][0], rotsRForeArm[i][1], rotsRForeArm[i][2]));
                qLArm.push(...makeQuat(bLArm, rotsLArm[i][0], rotsLArm[i][1], rotsLArm[i][2]));
                qLForeArm.push(...makeQuat(bLForeArm, rotsLForeArm[i][0], rotsLForeArm[i][1], rotsLForeArm[i][2]));
                qSpine.push(...makeQuat(bSpine, rotsSpine[i][0], rotsSpine[i][1], rotsSpine[i][2]));
                qHead.push(...makeQuat(bHead, rotsHead[i][0], rotsHead[i][1], rotsHead[i][2]));
              }

              const tracks = [
                new THREE.QuaternionKeyframeTrack('mixamorigRightArm_013.quaternion', times, qRArm),
                new THREE.QuaternionKeyframeTrack('mixamorigRightForeArm_014.quaternion', times, qRForeArm),
                new THREE.QuaternionKeyframeTrack('mixamorigLeftArm_09.quaternion', times, qLArm),
                new THREE.QuaternionKeyframeTrack('mixamorigLeftForeArm_010.quaternion', times, qLForeArm),
                new THREE.QuaternionKeyframeTrack('mixamorigSpine1_03.quaternion', times, qSpine),
                new THREE.QuaternionKeyframeTrack('mixamorigHead_06.quaternion', times, qHead)
              ];
              list.push(new THREE.AnimationClip('🐟 Pescar (Arpão/Vara)', 2.4, tracks));
            }

            // 6. Adorar no Templo para Favor Divino (pray_temple)
            {
              const times = [0.0, 0.70, 1.40, 2.10, 2.60, 3.00];
              const qRArm = [], qRForeArm = [], qLArm = [], qLForeArm = [], qSpine = [], qHead = [];

              const rotsRArm = [[-0.4, 0, 0.2], [0.3, 0, 0.1], [-1.2, 0.05, 0.4], [-1.35, 0.08, 0.45], [-0.8, 0.03, 0.3], [-0.4, 0, 0.2]];
              const rotsRForeArm = [[0.8, 0, 0], [0.3, 0, 0], [0.5, 0, 0], [0.65, 0, 0], [0.75, 0, 0], [0.8, 0, 0]];
              const rotsLArm = [[-0.4, 0, -0.2], [0.3, 0, -0.1], [-1.2, -0.05, -0.4], [-1.35, -0.08, -0.45], [-0.8, -0.03, -0.3], [-0.4, 0, -0.2]];
              const rotsLForeArm = [[0.8, 0, 0], [0.3, 0, 0], [0.5, 0, 0], [0.65, 0, 0], [0.75, 0, 0], [0.8, 0, 0]];
              const rotsSpine = [[0, 0, 0], [0.35, 0, 0], [-0.2, 0, 0], [-0.28, 0, 0], [-0.1, 0, 0], [0, 0, 0]];
              const rotsHead = [[0, 0, 0], [0.25, 0, 0], [-0.4, 0, 0], [-0.5, 0, 0], [-0.2, 0, 0], [0, 0, 0]];

              for (let i = 0; i < times.length; i++) {
                qRArm.push(...makeQuat(bRArm, rotsRArm[i][0], rotsRArm[i][1], rotsRArm[i][2]));
                qRForeArm.push(...makeQuat(bRForeArm, rotsRForeArm[i][0], rotsRForeArm[i][1], rotsRForeArm[i][2]));
                qLArm.push(...makeQuat(bLArm, rotsLArm[i][0], rotsLArm[i][1], rotsLArm[i][2]));
                qLForeArm.push(...makeQuat(bLForeArm, rotsLForeArm[i][0], rotsLForeArm[i][1], rotsLForeArm[i][2]));
                qSpine.push(...makeQuat(bSpine, rotsSpine[i][0], rotsSpine[i][1], rotsSpine[i][2]));
                qHead.push(...makeQuat(bHead, rotsHead[i][0], rotsHead[i][1], rotsHead[i][2]));
              }

              const tracks = [
                new THREE.QuaternionKeyframeTrack('mixamorigRightArm_013.quaternion', times, qRArm),
                new THREE.QuaternionKeyframeTrack('mixamorigRightForeArm_014.quaternion', times, qRForeArm),
                new THREE.QuaternionKeyframeTrack('mixamorigLeftArm_09.quaternion', times, qLArm),
                new THREE.QuaternionKeyframeTrack('mixamorigLeftForeArm_010.quaternion', times, qLForeArm),
                new THREE.QuaternionKeyframeTrack('mixamorigSpine1_03.quaternion', times, qSpine),
                new THREE.QuaternionKeyframeTrack('mixamorigHead_06.quaternion', times, qHead)
              ];
              list.push(new THREE.AnimationClip('🏛️ Adorar no Templo (Favor Divino)', 3.0, tracks));
            }

            return list;
          }

          // Função para construir botões de animação na interface
          function buildAnimationControls(clipList) {
            animations = clipList;
            animButtonsGroup.innerHTML = '';
            statusText.textContent = `Ativo: ${animations.length} ações disponíveis`;

            if (animations.length > 0) {
              animations.forEach((clip) => {
                const btn = document.createElement('button');
                btn.className = 'btn-anim';
                let icon = '🎬';
                const low = clip.name.toLowerCase();
                if (low.includes('andar') || low.includes('walk')) icon = '🚶';
                else if (low.includes('correr') || low.includes('run')) icon = '🏃';
                else if (low.includes('postura') || low.includes('idle')) icon = '🧍';
                else if (low.includes('faquinha') || low.includes('atacar') || low.includes('slash')) icon = '🗡️';
                else if (low.includes('madeira') || low.includes('machadinha')) icon = '🪓';
                else if (low.includes('ouro') || low.includes('picareta')) icon = '⛏️';
                else if (low.includes('alimento') || low.includes('bagas')) icon = '🌾';
                else if (low.includes('pesca') || low.includes('pescar')) icon = '🐟';
                else if (low.includes('adorar') || low.includes('templo') || low.includes('favor')) icon = '🏛️';
                btn.textContent = `${icon} ${clip.name}`;
                btn.addEventListener('click', () => {
                  document.querySelectorAll('.btn-anim').forEach(b => b.classList.remove('active'));
                  btn.classList.add('active');
                  playClip(clip);
                });
                animButtonsGroup.appendChild(btn);
              });

              // Selecionar marcha (Walk) por padrão
              const defaultClip = animations.find(c => c.name.toLowerCase().includes('andar') || c.name.toLowerCase().includes('walk')) || animations[0];
              const defaultBtn = Array.from(animButtonsGroup.children).find(b => b.textContent.includes(defaultClip.name)) || animButtonsGroup.children[0];
              if (defaultBtn) defaultBtn.classList.add('active');
              playClip(defaultClip);
            } else {
              animButtonsGroup.innerHTML = '<span style="font-size:12px;color:#94a3b8;padding:6px;">Sem animações disponíveis</span>';
            }
          }

          // Se for o Aldeão (ou legado Ágape), inicializar socket e as 8 funções de forma imediata
          const isAldeao = filename.includes('aldeao') || filename.includes('agape');
          if (isAldeao) {
            // Escala ampliada do Aldeão (+45%) para melhor visibilidade e destaque
            currentModel.scale.set(1.45, 1.45, 1.45);
            statusText.textContent = 'Aldeão Grego pronto (Tamanho Ampliado: 145%)';
            
            let rightHandBone = null;
            let targetMesh = null;
            currentModel.traverse((c) => {
              if (c.isSkinnedMesh && !targetMesh) targetMesh = c;
              if (c.name && c.name.includes('RightHand') && !c.name.includes('end')) {
                rightHandBone = c;
              }
            });

            // Criar socket da mão e ferramentas 3D com ancoragem anatômica no centro da cavidade da palma
            if (rightHandBone) {
              const socket = new THREE.Group();
              socket.name = 'RightHand_Socket';
              socket.position.set(1.6, 8.8, 3.5); // Exato centro do punho fechado anatômico do aldeão
              rightHandBone.add(socket);
              aldeaoTools = createAldeaoTools();
              for (const k in aldeaoTools) {
                socket.add(aldeaoTools[k]);
                aldeaoTools[k].visible = false;
              }
            }

            // Coletar animações embutidas no aldeao.glb (todas as 7 ações bakeadas com node-index nativo)
            const embeddedAnims = gltf.animations || [];
            buildAnimationControls(embeddedAnims);
          } else {
            buildAnimationControls(gltf.animations || []);
          }
        },
        (xhr) => {
          const pct = Math.round((xhr.loaded / (xhr.total || 1)) * 100);
          if (pct > 0 && pct <= 100) statusText.textContent = `Baixando modelo: ${pct}%`;
        },
        (error) => {
          spinner.style.display = 'none';
          statusText.textContent = `Erro ao carregar modelo: ${error.message}`;
        }
      );
    }

    function playClip(targetClip) {
      if (!mixer || !targetClip) return;

      // Troca dinâmica de ferramentas no socket da mão do Aldeão
      if (aldeaoTools) {
        const name = targetClip.name.toLowerCase();
        aldeaoTools.knife.visible = name.includes('faquinha') || name.includes('atacar') || name.includes('slash') || name.includes('punhalada');
        aldeaoTools.axe.visible = name.includes('madeira') || name.includes('machadinha');
        aldeaoTools.pickaxe.visible = name.includes('ouro') || name.includes('picareta');
        aldeaoTools.fishing.visible = name.includes('pesca') || name.includes('pescar');
      }

      const newAction = mixer.clipAction(targetClip);
      newAction.reset();
      newAction.timeScale = speedLevels[speedIdx];

      if (currentAction && currentAction !== newAction) {
        currentAction.fadeOut(0.25);
      }
      newAction.fadeIn(0.25).play();
      currentAction = newAction;
      statusText.textContent = `Aldeão em ação: ${targetClip.name}`;
      if (typeof syncToolSlidersFromActive === 'function') {
        syncToolSlidersFromActive();
      }
    }

    if (btnToggleMenu) {
      btnToggleMenu.addEventListener('click', () => {
        isMenuMinimized = !isMenuMinimized;
        animButtonsGroup.style.display = isMenuMinimized ? 'none' : 'flex';
        btnToggleMenu.textContent = isMenuMinimized ? 'Expandir ⏶' : 'Minimizar ✕';
      });
    }

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      if (currentAction) currentAction.paused = isPaused;
      btnPause.textContent = isPaused ? '▶️ Continuar' : '⏸️ Pausar';
      btnPause.style.background = isPaused ? '#0284c7' : '#1e293b';
    });

    btnSpeed.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speedLevels.length;
      const spd = speedLevels[speedIdx];
      btnSpeed.textContent = `Velocidade: ${spd.toFixed(2)}x`;
      if (currentAction) currentAction.timeScale = spd;
    });

    btnWire.addEventListener('click', () => {
      isWireframe = !isWireframe;
      if (currentModel) {
        currentModel.traverse(c => {
          if (c.isMesh) c.material.wireframe = isWireframe;
        });
      }
      btnWire.style.borderColor = isWireframe ? '#38bdf8' : '#334155';
    });

    btnBones.addEventListener('click', () => {
      isSkeleton = !isSkeleton;
      if (skeletonHelper) skeletonHelper.visible = isSkeleton;
      btnBones.style.borderColor = isSkeleton ? '#38bdf8' : '#334155';
    });

    function setCameraView(preset) {
      const btns = [btnCamClose, btnCamFull, btnCamRts];
      btns.forEach(b => { if (b) b.style.borderColor = '#334155'; });

      if (preset === 'close') {
        if (btnCamClose) btnCamClose.style.borderColor = '#38bdf8';
        controls.target.set(0, 1.45, 0);
        camera.position.set(0, 1.50, 0.90);
      } else if (preset === 'rts') {
        if (btnCamRts) btnCamRts.style.borderColor = '#38bdf8';
        controls.target.set(0, 0.95, 0);
        camera.position.set(2.0, 2.5, 2.0);
      } else {
        // Padrão: Corpo Inteiro (Close Humanóide, grande, nítido e imponente)
        if (btnCamFull) btnCamFull.style.borderColor = '#38bdf8';
        controls.target.set(0, 1.20, 0);
        camera.position.set(0, 1.30, 1.35);
      }
      camera.lookAt(controls.target);
      controls.update();
    }

    if (btnCamClose) btnCamClose.addEventListener('click', () => setCameraView('close'));
    if (btnCamFull) btnCamFull.addEventListener('click', () => setCameraView('full'));
    if (btnCamRts) btnCamRts.addEventListener('click', () => setCameraView('rts'));

    function fitCameraToModel(model) {
      if (!model) return;
      const isHumanoid = modelSelect.value.includes('aldeao') || modelSelect.value.includes('agape') || modelSelect.value.includes('soldier') || modelSelect.value.includes('hoplita');
      if (isHumanoid) {
        setCameraView('full');
        return;
      }
      const box = new THREE.Box3();
      model.traverse(c => {
        if (c.isMesh && !c.isBone && c.geometry) {
          if (!c.geometry.boundingBox) c.geometry.computeBoundingBox();
          box.union(c.geometry.boundingBox);
        }
      });
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      controls.target.set(center.x, center.y, center.z);
      const maxDim = Math.max(size.x, size.y, size.z, 1.0);
      camera.position.set(center.x, center.y + size.y * 0.1, center.z + maxDim * 1.5);
      camera.lookAt(center);
      controls.update();
    }

    btnResetCam.addEventListener('click', () => {
      if (currentModel) {
        fitCameraToModel(currentModel);
      } else {
        setCameraView('full');
      }
    });

    modelSelect.addEventListener('change', (e) => {
      loadModel(e.target.value);
    });

    // Alternar minimizar/expandir painel do Studio
    const btnToggleStudio = document.getElementById('btn-toggle-studio');
    const studioBody = document.getElementById('studio-body');
    let isStudioMinimized = false;
    if (btnToggleStudio && studioBody) {
      btnToggleStudio.addEventListener('click', () => {
        isStudioMinimized = !isStudioMinimized;
        studioBody.style.display = isStudioMinimized ? 'none' : 'block';
        btnToggleStudio.textContent = isStudioMinimized ? 'Expandir ⏶' : 'Minimizar ✕';
      });
    }

    // Gerenciador de Abas do Studio
    const tabBtnAldeao = document.getElementById('tab-btn-aldeao');
    const tabBtnFerramenta = document.getElementById('tab-btn-ferramenta');
    const tabBtnCamera = document.getElementById('tab-btn-camera');
    const paneAldeao = document.getElementById('tab-pane-aldeao');
    const paneFerramenta = document.getElementById('tab-pane-ferramenta');
    const paneCamera = document.getElementById('tab-pane-camera');

    function switchEditorTab(tab) {
      [tabBtnAldeao, tabBtnFerramenta, tabBtnCamera].forEach(b => { if (b) b.classList.remove('active'); });
      [paneAldeao, paneFerramenta, paneCamera].forEach(p => { if (p) p.style.display = 'none'; });

      if (tab === 'aldeao' && paneAldeao) {
        tabBtnAldeao.classList.add('active');
        paneAldeao.style.display = 'block';
      } else if (tab === 'ferramenta' && paneFerramenta) {
        tabBtnFerramenta.classList.add('active');
        paneFerramenta.style.display = 'block';
        syncToolSlidersFromActive();
      } else if (tab === 'camera' && paneCamera) {
        tabBtnCamera.classList.add('active');
        paneCamera.style.display = 'block';
      }
    }

    if (tabBtnAldeao) tabBtnAldeao.addEventListener('click', () => switchEditorTab('aldeao'));
    if (tabBtnFerramenta) tabBtnFerramenta.addEventListener('click', () => switchEditorTab('ferramenta'));
    if (tabBtnCamera) tabBtnCamera.addEventListener('click', () => switchEditorTab('camera'));

    // --- 1. MANIPULAÇÃO DO ALDEÃO / MODELO ---
    const sldAldeaoScale = document.getElementById('sld-aldeao-scale');
    const valAldeaoScale = document.getElementById('val-aldeao-scale');
    const sldAldeaoRotY = document.getElementById('sld-aldeao-rot-y');
    const valAldeaoRotY = document.getElementById('val-aldeao-rot-y');
    const sldAldeaoPosY = document.getElementById('sld-aldeao-pos-y');
    const valAldeaoPosY = document.getElementById('val-aldeao-pos-y');
    const sldAldeaoPosX = document.getElementById('sld-aldeao-pos-x');
    const valAldeaoPosX = document.getElementById('val-aldeao-pos-x');
    const sldAldeaoPosZ = document.getElementById('sld-aldeao-pos-z');
    const valAldeaoPosZ = document.getElementById('val-aldeao-pos-z');

    function setAldeaoScale(s) {
      if (!currentModel) return;
      s = Math.max(0.3, Math.min(3.5, s));
      currentModel.scale.set(s, s, s);
      if (sldAldeaoScale) sldAldeaoScale.value = s;
      if (valAldeaoScale) valAldeaoScale.textContent = `${s.toFixed(2)}x`;
    }

    if (sldAldeaoScale) {
      sldAldeaoScale.addEventListener('input', (e) => setAldeaoScale(parseFloat(e.target.value)));
    }
    const btnAldeaoScaleMinus = document.getElementById('btn-aldeao-scale-minus');
    if (btnAldeaoScaleMinus) {
      btnAldeaoScaleMinus.addEventListener('click', () => {
        if (currentModel) setAldeaoScale(currentModel.scale.x - 0.1);
      });
    }
    const btnAldeaoScalePlus = document.getElementById('btn-aldeao-scale-plus');
    if (btnAldeaoScalePlus) {
      btnAldeaoScalePlus.addEventListener('click', () => {
        if (currentModel) setAldeaoScale(currentModel.scale.x + 0.1);
      });
    }

    if (sldAldeaoRotY) {
      sldAldeaoRotY.addEventListener('input', (e) => {
        if (!currentModel) return;
        const deg = parseFloat(e.target.value);
        currentModel.rotation.y = THREE.MathUtils.degToRad(deg);
        if (valAldeaoRotY) valAldeaoRotY.textContent = `${deg}°`;
      });
    }

    const btnAldeaoTurn45 = document.getElementById('btn-aldeao-turn-45');
    if (btnAldeaoTurn45) {
      btnAldeaoTurn45.addEventListener('click', () => {
        if (!currentModel) return;
        let deg = Math.round(THREE.MathUtils.radToDeg(currentModel.rotation.y) + 45);
        if (deg > 180) deg -= 360;
        currentModel.rotation.y = THREE.MathUtils.degToRad(deg);
        if (sldAldeaoRotY) sldAldeaoRotY.value = deg;
        if (valAldeaoRotY) valAldeaoRotY.textContent = `${deg}°`;
      });
    }

    if (sldAldeaoPosY) {
      sldAldeaoPosY.addEventListener('input', (e) => {
        if (!currentModel) return;
        const y = parseFloat(e.target.value);
        currentModel.position.y = y;
        if (valAldeaoPosY) valAldeaoPosY.textContent = y.toFixed(2);
      });
    }

    if (sldAldeaoPosX) {
      sldAldeaoPosX.addEventListener('input', (e) => {
        if (!currentModel) return;
        const x = parseFloat(e.target.value);
        currentModel.position.x = x;
        if (valAldeaoPosX) valAldeaoPosX.textContent = x.toFixed(2);
      });

        if (valAldeaoPosZ) valAldeaoPosZ.textContent = z.toFixed(2);

        currentModel.position.set(0, 0, 0);
        if (sldAldeaoRotY) sldAldeaoRotY.value = 0;
        if (valAldeaoRotY) valAldeaoRotY.textContent = '0°';
        if (sldAldeaoPosY) sldAldeaoPosY.value = 0;
        if (valAldeaoPosY) valAldeaoPosY.textContent = '0.00';
        if (sldAldeaoPosX) sldAldeaoPosX.value = 0;
        if (valAldeaoPosX) valAldeaoPosX.textContent = '0.00';
        if (sldAldeaoPosZ) sldAldeaoPosZ.value = 0;
        if (valAldeaoPosZ) valAldeaoPosZ.textContent = '0.00';
      });

    // --- 2. MANIPULAÇÃO DO MACHADO E FERRAMENTAS ---
    let userActiveToolKey = 'axe';

    function getActiveTool() {
      if (!aldeaoTools) return null;
      if (aldeaoTools[userActiveToolKey]) return aldeaoTools[userActiveToolKey];
      return aldeaoTools.axe;
    }

    function setActiveToolVisible(toolKey) {
      userActiveToolKey = toolKey;
      if (!aldeaoTools) return;
      for (const k in aldeaoTools) {
        aldeaoTools[k].visible = (k === toolKey);
      }
      const chips = {
        axe: document.getElementById('chip-tool-axe'),
        pick: document.getElementById('chip-tool-pick'),
        knife: document.getElementById('chip-tool-knife'),
        fish: document.getElementById('chip-tool-fish'),
        none: document.getElementById('chip-tool-none')
      };
      for (const c in chips) {
        if (chips[c]) chips[c].classList.remove('active');
      }
      if (chips[toolKey]) chips[toolKey].classList.add('active');
      syncToolSlidersFromActive();
    }

    const chipAxe = document.getElementById('chip-tool-axe');
    if (chipAxe) chipAxe.addEventListener('click', () => setActiveToolVisible('axe'));
    const chipPick = document.getElementById('chip-tool-pick');
    if (chipPick) chipPick.addEventListener('click', () => setActiveToolVisible('pickaxe'));
    const chipKnife = document.getElementById('chip-tool-knife');
    if (chipKnife) chipKnife.addEventListener('click', () => setActiveToolVisible('knife'));
    const chipFish = document.getElementById('chip-tool-fish');
    if (chipFish) chipFish.addEventListener('click', () => setActiveToolVisible('fishing'));
    const chipNone = document.getElementById('chip-tool-none');
    if (chipNone) chipNone.addEventListener('click', () => setActiveToolVisible('none'));

    // Sliders da Ferramenta
    const sldToolScale = document.getElementById('sld-tool-scale');
    const valToolScale = document.getElementById('val-tool-scale');
    const sldToolRotY = document.getElementById('sld-tool-rot-y');
    const valToolRotY = document.getElementById('val-tool-rot-y');
    const sldToolRotX = document.getElementById('sld-tool-rot-x');
    const valToolRotX = document.getElementById('val-tool-rot-x');
    const sldToolRotZ = document.getElementById('sld-tool-rot-z');
    const valToolRotZ = document.getElementById('val-tool-rot-z');
    const sldToolPosY = document.getElementById('sld-tool-pos-y');
    const valToolPosY = document.getElementById('val-tool-pos-y');
    const sldToolPosX = document.getElementById('sld-tool-pos-x');
    const valToolPosX = document.getElementById('val-tool-pos-x');
    const sldToolPosZ = document.getElementById('sld-tool-pos-z');
    const valToolPosZ = document.getElementById('val-tool-pos-z');

    function syncToolSlidersFromActive() {
      const tool = getActiveTool();
      if (!tool) return;
      const s = tool.scale.x;
      if (sldToolScale) sldToolScale.value = s;
      if (valToolScale) valToolScale.textContent = `${s.toFixed(2)}x`;

      const ry = Math.round(THREE.MathUtils.radToDeg(tool.rotation.y));
      if (sldToolRotY) sldToolRotY.value = ry;
      if (valToolRotY) valToolRotY.textContent = `${ry}°`;

      const rx = Math.round(THREE.MathUtils.radToDeg(tool.rotation.x));
      if (sldToolRotX) sldToolRotX.value = rx;
      if (valToolRotX) valToolRotX.textContent = `${rx}°`;

      const rz = Math.round(THREE.MathUtils.radToDeg(tool.rotation.z));
      if (sldToolRotZ) sldToolRotZ.value = rz;
      if (valToolRotZ) valToolRotZ.textContent = `${rz}°`;

      if (sldToolPosY) sldToolPosY.value = tool.position.y;
      if (valToolPosY) valToolPosY.textContent = tool.position.y.toFixed(1);

      if (sldToolPosX) sldToolPosX.value = tool.position.x;
      if (valToolPosX) valToolPosX.textContent = tool.position.x.toFixed(1);

      if (sldToolPosZ) sldToolPosZ.value = tool.position.z;
      if (valToolPosZ) valToolPosZ.textContent = tool.position.z.toFixed(1);
    }

    function setToolScale(s) {
      const tool = getActiveTool();
      if (!tool) return;
      s = Math.max(0.3, Math.min(4.0, s));
      tool.scale.set(s, s, s);
      if (sldToolScale) sldToolScale.value = s;
      if (valToolScale) valToolScale.textContent = `${s.toFixed(2)}x`;
    }

    if (sldToolScale) {
      sldToolScale.addEventListener('input', (e) => setToolScale(parseFloat(e.target.value)));
    }
    const btnToolScaleMinus = document.getElementById('btn-tool-scale-minus');
    if (btnToolScaleMinus) {
      btnToolScaleMinus.addEventListener('click', () => {
        const tool = getActiveTool();
        if (tool) setToolScale(tool.scale.x - 0.1);
      });
    }
    const btnToolScalePlus = document.getElementById('btn-tool-scale-plus');
    if (btnToolScalePlus) {
      btnToolScalePlus.addEventListener('click', () => {
        const tool = getActiveTool();
        if (tool) setToolScale(tool.scale.x + 0.1);
      });
    }

    if (sldToolRotY) {
      sldToolRotY.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const deg = parseFloat(e.target.value);
        tool.rotation.y = THREE.MathUtils.degToRad(deg);
        if (valToolRotY) valToolRotY.textContent = `${deg}°`;
      });
    }

    if (sldToolRotX) {
      sldToolRotX.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const deg = parseFloat(e.target.value);
        tool.rotation.x = THREE.MathUtils.degToRad(deg);
        if (valToolRotX) valToolRotX.textContent = `${deg}°`;
      });
    }

    if (sldToolRotZ) {
      sldToolRotZ.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const deg = parseFloat(e.target.value);
        tool.rotation.z = THREE.MathUtils.degToRad(deg);
        if (valToolRotZ) valToolRotZ.textContent = `${deg}°`;
      });
    }

    if (sldToolPosY) {
      sldToolPosY.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const y = parseFloat(e.target.value);
        tool.position.y = y;
        if (valToolPosY) valToolPosY.textContent = y.toFixed(1);
      });
    }

    if (sldToolPosX) {
      sldToolPosX.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const x = parseFloat(e.target.value);
        tool.position.x = x;
        if (valToolPosX) valToolPosX.textContent = x.toFixed(1);
      });
    }

    if (sldToolPosZ) {
      sldToolPosZ.addEventListener('input', (e) => {
        const tool = getActiveTool();
        if (!tool) return;
        const z = parseFloat(e.target.value);
        tool.position.z = z;
        if (valToolPosZ) valToolPosZ.textContent = z.toFixed(1);
      });
    }

    // Botões de Ação Rápida da Ferramenta
    const btnToolQuickFlip = document.getElementById('btn-tool-quick-flip');
    if (btnToolQuickFlip) {
      btnToolQuickFlip.addEventListener('click', () => {
        const tool = getActiveTool();
        if (!tool) return;
        const curDeg = Math.round(THREE.MathUtils.radToDeg(tool.rotation.x));
        const newDeg = (Math.abs(curDeg - 180) < 10) ? 0 : 180;
        tool.rotation.x = THREE.MathUtils.degToRad(newDeg);
        if (sldToolRotX) sldToolRotX.value = newDeg;
        if (valToolRotX) valToolRotX.textContent = `${newDeg}°`;
      });
    }

    const btnToolQuickRot = document.getElementById('btn-tool-quick-rot');
    if (btnToolQuickRot) {
      btnToolQuickRot.addEventListener('click', () => {
        const tool = getActiveTool();
        if (!tool) return;
        let deg = Math.round(THREE.MathUtils.radToDeg(tool.rotation.y) + 90);
        if (deg > 180) deg -= 360;
        tool.rotation.y = THREE.MathUtils.degToRad(deg);
        if (sldToolRotY) sldToolRotY.value = deg;
        if (valToolRotY) valToolRotY.textContent = `${deg}°`;
      });
    }

    const btnToolQuickReset = document.getElementById('btn-tool-quick-reset');
    if (btnToolQuickReset) {
      btnToolQuickReset.addEventListener('click', () => {
        const tool = getActiveTool();
        if (!tool) return;
        tool.scale.set(1.5, 1.5, 1.5);
        tool.rotation.set(0, 0, 0);
        tool.position.set(0, 0, 0);
        syncToolSlidersFromActive();
      });
    }

    // Botão de Copiar Configurações
    const btnCopyConfig = document.getElementById('btn-copy-config');
    if (btnCopyConfig) {
      btnCopyConfig.addEventListener('click', () => {
        const tool = getActiveTool();
        const config = {
          aldeao: currentModel ? {
            scale: currentModel.scale.x,
            rotY: THREE.MathUtils.radToDeg(currentModel.rotation.y),
            pos: [currentModel.position.x, currentModel.position.y, currentModel.position.z]
          } : null,
          tool: tool ? {
            type: userActiveToolKey,
            scale: tool.scale.x,
            rot: [
              THREE.MathUtils.radToDeg(tool.rotation.x),
              THREE.MathUtils.radToDeg(tool.rotation.y),
              THREE.MathUtils.radToDeg(tool.rotation.z)
            ],
            pos: [tool.position.x, tool.position.y, tool.position.z]
          } : null
        };
        const text = JSON.stringify(config, null, 2);
        navigator.clipboard.writeText(text).then(() => {
          btnCopyConfig.textContent = '✅ Copiado com Sucesso!';
          setTimeout(() => { btnCopyConfig.textContent = '📋 Copiar Ajustes (JSON)'; }, 2000);
        }).catch(() => {
          prompt('Copie as configurações calibradas:', text);
        });
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && !isPaused) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
